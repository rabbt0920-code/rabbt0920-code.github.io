<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="投胎修仙模擬器：選詞條、配點、隨機出身，五年一回合，賭上這條命去成為仙尊，或者回到地球。">
<meta property="og:type" content="website">
<meta property="og:title" content="投胎修仙模擬器">
<meta property="og:description" content="選詞條、配點、隨機出身，五年一回合。成為仙尊，或回到地球——兩個願望，一條命。">
<meta property="og:image" content="https://rabbt0920-code.github.io/xiuxian-sim/og.png">
<meta property="og:url" content="https://rabbt0920-code.github.io/xiuxian-sim/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="投胎修仙模擬器">
<meta name="twitter:image" content="https://rabbt0920-code.github.io/xiuxian-sim/og.png">
<meta name="theme-color" content="#0f1218">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f6e7ae'/%3E%3Cpath d='M2 26 L12 14 L18 22 L24 16 L30 26Z' fill='%23151b2b'/%3E%3C/svg%3E">
<title>投胎修仙模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1218;--bg2:#161a23;--card:#1b202b;--card2:#222937;--line:#2d3546;
  --text:#ece6d6;--mute:#9ba2b0;--gold:#d9b45b;--gold-d:#8a7036;--jade:#6cc1a6;--red:#e2674d;--blue:#7fa6e0;
  --r:14px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);
  background:radial-gradient(1100px 520px at 50% -8%,#212a3d 0%,rgba(15,18,24,0) 70%),var(--bg);
  font:16px/1.75 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-weight:700;letter-spacing:.05em;margin:0;line-height:1.35}
p{margin:0 0 .7em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h2[tabindex]:focus{outline:none}
#app{max-width:780px;margin:0 auto;padding:18px 16px 72px}
.muted{color:var(--mute)}.small{font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:14px 0}
.card h2{font-size:1.35rem;margin-bottom:.5em}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:46px;padding:10px 22px;border-radius:999px;
  border:1px solid var(--line);background:var(--card2);transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--gold-d);background:#29324a}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#e5c570,#c49a3e);color:#1a1405;border-color:#e9cf85;font-weight:700}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#efd283,#cfa648)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* 標題頁 */
.title{text-align:center;padding:44px 0 8px}
.kicker{letter-spacing:.4em;color:var(--gold);font-size:.85rem;margin-bottom:.8em}
.title h1{font-size:clamp(2.1rem,8vw,3.2rem);margin-bottom:.4em}
.lead{max-width:34em;margin:0 auto 1.6em;color:#cfc9b8}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0;text-align:left}
.goal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.goal b{font-family:'Noto Serif TC',serif;font-size:1.1rem;display:block}
.goal.done{border-color:var(--gold-d);background:linear-gradient(180deg,#262313,var(--card))}
.goal .tag{font-size:.8rem;color:var(--gold)}
.stampline{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-size:.9rem;color:var(--mute);margin:16px 0}
details.reset{margin-top:28px;font-size:.88rem;color:var(--mute)}
details.reset summary{cursor:pointer;display:inline-block;padding:6px}

/* 詞條與配點 */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.sec-h h3{font-size:1.1rem}
.counter{color:var(--gold);font-weight:700}
.traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.trait{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:76px;transition:border-color .15s,background .15s}
.trait b{display:block;font-family:'Noto Serif TC',serif}
.trait span{font-size:.85rem;color:var(--mute);display:block;line-height:1.5}
.trait:hover:not(:disabled){border-color:var(--gold-d)}
.trait.on{border-color:var(--gold);background:#2b2a1f}
.trait.on b::after{content:' ✓';color:var(--gold)}
.trait.rare b{color:var(--gold)}
.trait:disabled{opacity:.5;cursor:not-allowed}
.trait.locked{border-style:dashed}
.alloc{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:4.2em 1fr auto;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.arow .nm{font-family:'Noto Serif TC',serif}
.arow .pv{font-size:.82rem;color:var(--mute)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);font-size:1.2rem;line-height:1}
.stepper button:hover:not(:disabled){border-color:var(--gold)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:1.6em;text-align:center;font-weight:700}

/* HUD */
.hud{position:sticky;top:0;z-index:5;background:rgba(15,18,24,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:-18px -16px 6px;padding:12px 16px}
.hud-top{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.age{font-family:'Noto Serif TC',serif;font-size:2rem;font-weight:700;color:var(--gold);line-height:1}
.age-u{font-size:.8rem;color:var(--mute);margin-left:2px}
.realm b{font-family:'Noto Serif TC',serif;font-size:1.1rem}
.realm small{color:var(--mute);display:block;font-size:.78rem;line-height:1.4}
.hud .meta{text-align:right;font-size:.78rem;color:var(--mute);line-height:1.5}
.bar{display:block;height:6px;border-radius:99px;background:#2a3142;overflow:hidden}
.bar u{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .5s}
.bar.xp u{background:linear-gradient(90deg,var(--gold-d),var(--gold))}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.stat{font-size:.82rem;color:var(--mute);line-height:1.3}
.stat b{display:block;font-size:1.15rem;color:var(--text)}
.stat .bar{height:4px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;font-size:.76rem;line-height:1.5;padding:1px 9px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--mute);white-space:nowrap}
.chip.gold{color:var(--gold);border-color:var(--gold-d)}
.chip.danger{color:#ff9a85;border-color:#7b3a2e;background:#2a1713}
.chip.lock{color:#ffd48a;border-color:#6f5a2a}
.chip.cost{color:#e8c46a}
.chip.st-bold{color:#f0a48f}.chip.st-diligent{color:#8fc9ff}.chip.st-timid{color:#c6b4f0}.chip.st-careful{color:#9bdcbc}

/* 事件 */
.event .passive{color:var(--mute);font-size:.86rem;margin-bottom:.8em}
.etext{font-size:1.04rem;color:#ddd7c6}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--gold-d);background:#283148}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt:disabled{opacity:.55;cursor:not-allowed}
.olabel{display:block;font-weight:500}
.ometa{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.result{margin-top:16px;border-top:1px dashed var(--line);padding-top:16px}
.roll{font-size:.86rem;color:var(--mute);margin-bottom:.6em}
.roll strong{color:var(--text)}
.roll b{padding:1px 10px;border-radius:99px;margin-left:6px;font-weight:700}
.band-g .roll b{background:#2d4a3d;color:#9df0cc}
.band-k .roll b{background:#2c3f53;color:#a9d1ff}
.band-f .roll b{background:#4a3f25;color:#ffd48a}
.band-b .roll b{background:#4d2a22;color:#ffa391}
.rtext{font-size:1.04rem}
.pextra{color:var(--gold);border-left:3px solid var(--gold-d);padding-left:12px;margin:.8em 0}
.survive{color:#9df0cc;border-left:3px solid #3b7a62;padding-left:12px}
.fx{list-style:none;padding:0;margin:.6em 0 0;display:flex;flex-wrap:wrap;gap:6px}
.fx li{font-size:.84rem;padding:2px 10px;border-radius:99px;border:1px solid}
.fx li.up{color:#9df0cc;border-color:#2f6a55;background:#142a23}
.fx li.down{color:#ffa391;border-color:#7b3a2e;background:#2a1713}
.unlock{margin-top:12px;padding:10px 14px;border:1px solid var(--gold-d);border-radius:12px;background:#262313;color:var(--gold)}
.dead{color:#ffa391;font-family:'Noto Serif TC',serif;font-size:1.1rem;margin-top:12px}

/* 一般元件 */
.pbox{display:grid;gap:12px;margin-top:14px}
.pcard{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pcard:hover{border-color:var(--gold)}
.pcard b{font-family:'Noto Serif TC',serif;font-size:1.2rem;color:var(--gold)}
.birth-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.birth-grid .card{margin:0}
.birth-grid h3{font-size:1.05rem;color:var(--gold);margin-bottom:.2em}
.endtitle{font-size:clamp(1.8rem,6vw,2.6rem);color:var(--gold);margin:.2em 0}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.sum div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.84rem;color:var(--mute)}
.sum b{display:block;color:var(--text);font-size:1.05rem}
.story p{font-size:1.04rem;line-height:1.95}
.story em{color:var(--gold);font-style:normal}
details.log{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px}
details.log summary{cursor:pointer;padding:10px 0;color:var(--mute)}
.log ol{margin:0;padding:0 0 10px 0;list-style:none;display:grid;gap:10px}
.log li{font-size:.9rem;color:var(--mute);border-left:2px solid var(--line);padding-left:12px}
.log li b{color:var(--text)}
.toast{color:var(--gold);font-size:.9rem}

@media (max-width:560px){
  .goals,.birth-grid{grid-template-columns:1fr}
  .hud-top{grid-template-columns:auto 1fr}
  .hud .meta{grid-column:1/3;text-align:left;display:flex;gap:12px;flex-wrap:wrap}
  .stats{gap:4px}
  .stat{font-size:.74rem}
  .arow{grid-template-columns:3.6em 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.hero{max-width:560px;margin:0 auto 18px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.hero svg{display:block;width:100%;height:auto}
.title{padding-top:20px}
[data-focus]:focus:not(:focus-visible){outline:none}

/* 因果小字 */
.why{font-size:.78rem;line-height:1.55;color:#8e97a8;margin:.35em 0 .35em;padding-left:10px;border-left:2px solid #3a4560}
.why.hint{color:#c9b37a;border-left-color:var(--gold-d)}
.roll + .why{margin-top:-.2em}
/* 難度 */
.diffbox{display:flex;flex-direction:column;gap:2px;margin:12px 0 4px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:.88rem}
.diffbox b{font-family:'Noto Serif TC',serif;font-size:1rem}
.diffbox span{color:var(--mute)}
.diffbox.d-easy{border-color:#2f6a55}.diffbox.d-easy b{color:#9df0cc}
.diffbox.d-normal{border-color:#6f5a2a}.diffbox.d-normal b{color:#ffd48a}
.diffbox.d-hell{border-color:#7b3a2e;background:#241512}.diffbox.d-hell b{color:#ff9a85}
.chip.dchip.d-easy{color:#9df0cc;border-color:#2f6a55}
.chip.dchip.d-normal{color:#ffd48a;border-color:#6f5a2a}
.chip.dchip.d-hell{color:#ff9a85;border-color:#7b3a2e;background:#2a1713}
.chip.path{color:var(--blue);border-color:#3a557d}
.card.resume{text-align:left;border-color:var(--gold-d)}
/* 結局 CG */
.cg{margin:-20px -20px 16px;border-radius:var(--r) var(--r) 0 0;overflow:hidden;border-bottom:1px solid var(--line);line-height:0}
.cg svg{width:100%;height:auto;display:block;aspect-ratio:400/220}
.cg{--hi:var(--jade)}
.cg .tw{animation:cgtw 3s ease-in-out infinite}
@keyframes cgtw{50%{opacity:.25}}
.cg .float{animation:cgfl 4s ease-in-out infinite}
@keyframes cgfl{50%{transform:translateY(-4px)}}
.cg .pulse{animation:cgpu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cgpu{50%{opacity:.08;transform:scale(1.25)}}
.cg .spin{animation:cgsp 18s linear infinite}
@keyframes cgsp{to{transform:rotate(360deg)}}
.cg .rise{animation:cgri 6s linear infinite;opacity:0}
@keyframes cgri{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-120px)}}
.cg .flash{animation:cgfa 5s steps(1) infinite;opacity:0}
@keyframes cgfa{0%,88%{opacity:0}90%{opacity:1}92%{opacity:0}94%{opacity:.8}96%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cg *{animation:none!important}.cg .rise{opacity:.7}.cg .flash{opacity:0}}

/* ================= 動畫與回饋（v2） ================= */
#app{position:relative;z-index:1}
/* 背景 */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb-mt{position:absolute;left:0;right:0;bottom:0;width:100%;height:32vh;opacity:.9}
.amb-cl{position:absolute;width:300px;opacity:.05;animation:cldrift linear infinite}
.amb-cl.c1{top:12%;animation-duration:90s;animation-delay:-20s}
.amb-cl.c2{top:38%;width:220px;animation-duration:120s;animation-delay:-70s;opacity:.04}
.amb-cl.c3{top:64%;width:360px;animation-duration:150s;animation-delay:-40s;opacity:.035}
@keyframes cldrift{from{transform:translateX(-400px)}to{transform:translateX(110vw)}}
.amb-mo i{position:absolute;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:#f0d48a;box-shadow:0 0 6px 2px rgba(240,212,138,.5);opacity:0;animation:mote var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}15%{opacity:.55}50%{transform:translate(18px,-50vh)}85%{opacity:.35}100%{opacity:0;transform:translate(-10px,-100vh)}}

/* 畫面進場 */
#app>section,#app>.card{animation:secIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes secIn{from{opacity:0;transform:translateY(14px)}}
.event.enter{animation:evIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes evIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(3px)}}
.event.enter .opt{animation:optIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.18s + var(--i)*.07s)}
@keyframes optIn{from{opacity:0;transform:translateX(-14px)}}
.pcard{animation:optIn .5s both;animation-delay:calc(.15s + var(--i)*.12s)}
.title h1{background:linear-gradient(100deg,#ece6d6 30%,#fff3c4 45%,#d9b45b 50%,#ece6d6 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.hero{animation:heroFl 7s ease-in-out infinite}
@keyframes heroFl{50%{transform:translateY(-5px)}}

/* 按鈕與選項 */
.btn.primary{position:relative;overflow:hidden}
.btn.primary::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%,70%{left:-60%}100%{left:130%}}
.opt{position:relative;overflow:hidden}
.opt::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line);transition:width .25s,background .25s}
.opt.st-bold::before{background:#f0a48f}.opt.st-diligent::before{background:#8fc9ff}.opt.st-timid::before{background:#c6b4f0}.opt.st-careful::before{background:#9bdcbc}
.opt:hover:not(:disabled)::before{width:6px}
.opt:hover:not(:disabled){transform:translateX(3px)}
.opt:active:not(:disabled){transform:scale(.985)}
.trait.on{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.04)}}

/* HUD 回饋 */
.bar u{animation:barGrow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes barGrow{from{width:var(--from)}}
.bar.xp{position:relative;height:7px}
.bar.xp u{position:relative;overflow:hidden}
.bar.xp u::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:xpGl 2.4s ease-in-out infinite}
@keyframes xpGl{60%,100%{transform:translateX(100%)}}
.realm.full .bar.xp{box-shadow:0 0 0 1px var(--gold),0 0 12px 2px rgba(240,199,94,.55);animation:fullPulse 1.6s ease-in-out infinite}
@keyframes fullPulse{50%{box-shadow:0 0 0 1px var(--gold),0 0 20px 5px rgba(240,199,94,.85)}}
.ready{color:var(--gold);font-weight:700;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.realm.lvup b{animation:lvB 1.4s ease-out;display:inline-block}
@keyframes lvB{0%{transform:scale(1.6);color:#fff3c4;text-shadow:0 0 18px #f0c75e}100%{transform:none}}
.waitchip{margin-left:8px;font-size:.72rem;color:#9df0cc;border:1px solid #2f6a55;border-radius:99px;padding:0 8px;vertical-align:2px;animation:blink 2.4s ease-in-out infinite}
.age.tick{display:inline-block;animation:ageT .6s ease-out}
@keyframes ageT{0%{transform:translateY(-10px);opacity:0}100%{transform:none;opacity:1}}
.stat b{position:relative}
.stat .dlt{position:absolute;left:100%;top:-2px;margin-left:3px;font-style:normal;font-size:.72rem;font-weight:700;animation:dlt 2.2s ease-out both}
.s-up .dlt{color:#9df0cc}.s-down .dlt{color:#ffa391}
@keyframes dlt{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.s-up b{animation:sUp .9s ease-out}.s-down b{animation:sDn .9s ease-out}
@keyframes sUp{30%{color:#9df0cc;transform:scale(1.2)}}
@keyframes sDn{30%{color:#ffa391;transform:translateX(-2px)}60%{transform:translateX(2px)}}
.s-up .bar u{background:#9df0cc}.s-down .bar u{background:#e2674d}

/* 事件插圖 */
.evart{margin:-20px -20px 14px;height:90px;border-radius:var(--r) var(--r) 0 0;overflow:hidden;border-bottom:1px solid var(--line)}
.evart svg{width:100%;height:100%;display:block}
.ev-ready{border-color:var(--gold-d);box-shadow:0 0 30px rgba(240,199,94,.15)}
.vortex{background:radial-gradient(ellipse at center,#3a2f12 0%,#1b202b 70%)}
.vx path{fill:none;stroke:#f0c75e;stroke-width:1.5;opacity:.6;transform-origin:200px 45px;animation:vx 6s linear infinite}
.vx path:nth-child(2){animation-duration:4s;animation-direction:reverse;opacity:.75}
.vx path:nth-child(3){animation-duration:2.5s;opacity:.9}
@keyframes vx{to{transform:rotate(360deg)}}
.vortex .core{fill:#fff3c4;filter:drop-shadow(0 0 6px #f0c75e);animation:corePu 1.4s ease-in-out infinite;transform-origin:200px 45px}
@keyframes corePu{50%{transform:scale(1.6)}}
.vortex .orb{fill:#f6e7ae;transform-origin:200px 45px;animation:orb 3s linear infinite;animation-delay:var(--dl)}

    f:R('他跪在山腳不肯走，整座山的人都看你笑話。',{人:-1},{flag:'rejected'}),
    g:R('他被你的氣勢嚇到，鞠躬三次，轉身走了。',{心:2},{flag:'rejected'})}),
  O('假裝不在家','timid',null,R('你在洞府裡悄悄掩上門，聽著門外少年的啜泣，心想：「師父這個職業，我做不了。」',{心:1}))
]},
// =============== 道侶線 ===============
{id:'d_meet',co:true,t:'一場邂逅',a:[30,50],rm:[1,7],nf:['partner','partnerLost'],text:'宗門交流會上，有人在人群中向你舉杯。對方自稱{P}，是一位{K}。「聽聞道友的名號已久。」對方笑著說。',o:[
  O('舉杯回敬，主動攀談','bold',['人',10],{
    g:R('你們從天南聊到地北，不知不覺聊到天亮。臨別時，{P}說：「不如結為道侶，一起走下去。」你竟說不出拒絕的話。',{人:1,心:1},{partner:1,aff:3}),
    k:R('相談甚歡，你們互換了傳訊符。幾個月後，{P}笑著說：「不如同行？」',{人:1},{partner:1,aff:2}),
    f:R('你緊張得把酒灑了，對方禮貌地笑笑，轉身離去。',{人:-1})}),
  O('以武會友，切磋一場','diligent',['體',11],{
    g:R('你們過了百招，最後同時收手。{P}說：「道友的路數，很合我的胃口。」你們從此結伴而行。',{exp:10,體:1},{partner:1,aff:3}),
    k:R('不分勝負。你們笑著抱拳，成了同行的道友。',{exp:5},{partner:1,aff:2}),
    f:R('你輸得很難看，對方客氣地說「承讓」。',{體:-1})}),
  O('先暗中打聽對方底細','careful',['人',10],{
    g:R('你打聽到{P}為人正派，便登門拜訪。對方又驚又喜：「你竟然做了功課。」你們結為道侶。',{人:1},{partner:1,aff:3}),
    k:R('打聽完你鬆了口氣，才主動搭話。兩人慢慢熟悉，終於結伴。',{},{partner:1,aff:2}),
    f:R('你打聽得太久，等你想搭話時，{P}已經離開了。',{})}),
  O('假裝沒看見，繼續喝酒','timid',null,R('你低頭喝了三杯酒，抬頭時人已經不見了。你有點後悔。',{心:1}))
]},
{id:'d_walk',t:'並肩同行',fl:['partner'],a:[30,3000],rm:[1,7],w:3,rep:true,text:'你和{P}已經結伴多年。這個月，對方提議：「我們好久沒一起出門了。」',o:[
  O('一起遊歷名山大川','bold',['體',11],{
    g:R('你們一起翻過三座山，在山頂看了一場日出。{P}靠在你肩上，什麼也沒說。',{體:1,exp:8},{aff:2}),
    k:R('途中遇到一點小麻煩，兩人一起解決，感情又深了一層。',{exp:4},{aff:1}),
    f:R('走錯了路，吵了一架，但晚上又和好了。',{})}),
  O('一起坐而論道','diligent',['悟',11],{
    g:R('{P}的見解與你完全不同，卻讓你豁然開朗。你們一論就是三天。',{悟:1,exp:12},{aff:2}),
    k:R('你們各抒己見，沒吵起來，也沒說服對方。',{exp:6},{aff:1}),
    f:R('你們為了一個細節爭得面紅耳赤，不歡而散。',{},{aff:-1})}),
  O('為對方準備一份禮物','careful',null,R('你準備了一份小禮物。{P}打開時愣了愣，笑著說：「你什麼時候學會這些的？」',{},{aff:2}),{cost:{金:2}}),
  O('說「我想一個人靜一靜」','timid',null,R('{P}看了你一眼，沒有說話。第二天，對方的茶放在你門口，沒有留字條。',{心:1},{aff:-1}))
]},
{id:'d_danger',t:'共赴險境',fl:['partner'],a:[30,3000],rm:[2,6],w:2.5,text:'你們在途中遇上一頭兇名遠播的妖獸。{P}臉色一變：「我來擋，你先走！」',o:[
  O('擋在對方身前','bold',['體',14],{
    g:R('你一把推開{P}，硬接妖獸一擊，反手斬下牠的一臂。事後{P}紅著眼睛說：「下次不許這樣。」',{體:1,exp:20},{aff:3}),
    k:R('你們聯手擊退妖獸，雙雙掛彩，相視而笑。',{exp:10},{aff:2}),
    f:R('你受了重傷，{P}背著你逃了三十里。',{體:-2},{aff:2}),
    b:R('妖獸比你們想像的凶。',{},{die:'為了掩護{P}撤退，永遠留在了那片荒野'})}),
  O('並肩作戰，默契配合','diligent',['悟',14],{
    g:R('你們的配合天衣無縫，妖獸倒下時，兩人都沒怎麼受傷。',{exp:22,悟:1},{aff:2}),
    k:R('勉強配合，打贏了。',{exp:10},{aff:1}),
    f:R('配合失誤，兩人各自受了傷。',{體:-1})}),
  O('設下陷阱，引開妖獸','careful',['心',13],{
    g:R('你不慌不忙布好陷阱，妖獸一頭撞了進去。{P}看著你，忽然笑了：「你這人，穩得讓人安心。」',{心:1,exp:12},{aff:2}),
    k:R('陷阱拖住了妖獸一會兒，足夠你們撤退。',{exp:5},{aff:1}),
    f:R('陷阱沒起作用，你們狼狽逃走。',{體:-1})}),
  O('拉著對方轉身就跑','timid',null,R('你拉住{P}的手，轉身就跑。對方愣了一下，跟著你跑了很遠。「你這個人，」對方笑著說，「還挺靠譜。」',{心:1},{aff:1}))
]},
{id:'d_quarrel',t:'丹爐引發的戰爭',fl:['partner'],a:[30,3000],rm:[1,7],w:2,text:'你和{P}為了「丹爐到底該誰洗」吵了三天。這是你們吵過最久的一次。',o:[
  O('低頭認錯','careful',['人',9],{
    g:R('你一臉誠懇地道歉，還主動洗了丹爐。{P}笑出聲：「下不為例。」',{人:1},{aff:2}),
    k:R('你道了歉，對方消了氣。',{},{aff:1}),
    f:R('你道歉得太敷衍，對方更生氣了。',{},{aff:-1})}),
  O('講道理','diligent',['悟',11],{
    g:R('你把丹爐的使用頻率列成表格，雙方一看就明白。',{悟:1},{aff:1}),
    k:R('你講完，對方點頭，但沒說話。',{}),
    f:R('你越講越火大，對方摔門而去。',{},{aff:-2})}),
  O('一腳踹翻丹爐','bold',['心',10],{
    g:R('丹爐翻了。對方愣了三秒，噗哧笑出來：「你瘋了嗎？」兩人當場笑成一團。',{},{aff:2}),
    k:R('丹爐翻了，場面尷尬，但沒人再吵了。',{}),
    f:R('丹爐躺在地上，你們誰也不說話。',{},{aff:-2})}),
  O('冷戰到底','timid',null,R('三天後，{P}先開口：「我們該洗丹爐了。」你默默站起來。',{心:1},{aff:-1}))
]},
{id:'d_truth',t:'你到底從哪裡來',fl:['partner'],nf:['partnerWilling'],ca:3,cl:1,a:[30,3000],rm:[1,7],w:5,rep:true,text:'夜裡，{P}忽然問你：「你每次看星星，眼神都像在看故鄉。你到底是從哪裡來的？」',o:[
  O('全盤托出','bold',['人',12],{
    g:R('你把一切都說了：藍星、地鐵、火鍋、手機。{P}聽完沉默了很久，然後說：「那我跟你一起去看看。」',{心:1},{flag:'partnerWilling',aff:3}),
    k:R('{P}聽完愣了很久，最終點頭：「我信你。如果有一天你要回去，我會陪你。」',{},{flag:'partnerWilling',aff:2}),
    f:R('{P}以為你在開玩笑，笑著拍了拍你的肩。你苦笑，決定改天再試。',{})}),
  O('半真半假地描述','diligent',['悟',13],{
    g:R('你用「很遠很遠的地方」開頭，一點一點把真相鋪開。{P}聽著聽著，眼睛亮了：「我想去看看。」',{悟:1},{flag:'partnerWilling',aff:2}),
    k:R('{P}半信半疑，但說：「我願意等你說完全部。」',{},{flag:'partnerWilling',aff:1}),
    f:R('你的故事前後矛盾，{P}皺起眉頭。',{},{aff:-1})}),
  O('不說，先用行動陪伴','careful',null,R('你什麼也沒說，只是握住了對方的手。{P}也什麼都沒問。',{心:1},{aff:2})),
  O('搪塞過去','timid',null,R('「就是個很遠的地方。」你說。{P}看了你一眼，沒有追問。',{},{aff:-1}))
]},
{id:'d_gap',t:'歲月的差距',fl:['partner'],a:[60,3000],rm:[3,5],w:3,text:'歲月不饒人。{P}的修為停在了原地，而你的步伐越來越快。這一天，對方輕聲說：「我的壽元，大約還剩二十年。」',o:[
  O('傾盡資源，為對方延壽','careful',['人',12],{
    g:R('你踏遍三座坊市，終於湊齊了延壽丹。{P}服下後，眼角有了光：「這輩子，我欠你的。」',{人:1},{aff:3}),
    k:R('延壽丹起了作用，多了二十年。',{},{aff:2}),
    f:R('藥材沒湊齊，你滿身疲憊地回來，{P}只是握住你的手。',{},{aff:1})},{cost:{金:6}}),
  O('傾囊相授，助對方突破','diligent',['悟',15],{
    g:R('你把自己的心得毫無保留地寫給對方。{P}閉關三年後出關，已與你同階。',{悟:1,exp:10},{aff:3}),
    k:R('對方成功突破了一小步，壽元也延長了一些。',{},{aff:2}),
    f:R('功法與對方不合，反而讓對方傷了經脈。',{},{aff:-1})}),
  O('放下一切，陪伴到最後','careful',null,R('你放下一切，陪{P}走完最後的歲月。送別那天，你在墳前坐了三天三夜。',{心:2,exp:5},{partnerDie:1})),
  O('假裝不知道，繼續閉關','timid',null,R('你把消息壓在心底，埋頭苦修。二十年後，{P}在你出關前悄悄走了，留下一封信：「不怪你。」',{心:-1,exp:10},{partnerDie:1}))
]},
// =============== 中後期通用 ===============
{id:'e_council',t:'仙盟大會',a:[60,3000],rm:[3,6],w:1.6,text:'各大門派齊聚一堂，商討如何應對魔道、妖族與不知何時會爆發的空間裂縫。你發現這是一場一千句話裡只有兩句是人話的會議。',o:[
  O('發表意見，直指要害','bold',['人',14],{
    g:R('你的一席話說得全場鴉雀無聲，隨後掌聲雷動。你的名聲在修仙界又上了一個台階。',{人:3,exp:15}),
    k:R('你的意見被部分採納，大家對你多了幾分尊重。',{人:1,exp:6}),
    f:R('你直言不諱，得罪了幾位長老。',{人:-2})}),
  O('暗中觀察，摸清各方底牌','diligent',['心',13],{
    g:R('你一整場會議沒說一句話，卻把各方勢力的底細摸了個清清楚楚。',{人:1,悟:1,exp:20}),
    k:R('你看出了幾個關鍵人物的立場。',{exp:8}),
    f:R('被點名發言，卻什麼也答不出來。',{人:-1})}),
  O('私下結盟，拉攏幾位長老','careful',['人',14],{
    g:R('會議散後，你已和三位長老建立了私人同盟。',{人:3,金:4}),
    k:R('你拉攏了一位長老，勉強算有收穫。',{人:1,金:2}),
    f:R('被人察覺你的小動作，大家看你的眼神變了。',{人:-2,金:-2})}),
  O('藉口上廁所溜了','timid',null,R('你一個「如廁」就是三天，沒人發現你不在。「會議可以不開，命不能不要。」',{心:1}))
]},
{id:'e_demon',t:'魔道的誘惑',a:[60,3000],rm:[3,6],w:1.6,text:'一位魔道前輩攔住你的去路：「道友，你卡在瓶頸已經很久了吧？我這裡有一門功法，三年之內，保你突破。只要……沾一點血。」',o:[
  O('斷然拒絕，立場堅定','bold',['心',14],{
    g:R('你一句「道不同」，斬釘截鐵。魔修眼神複雜，竟拱手而去。',{心:3,exp:20}),
    k:R('你拒絕了，雖然心裡有那麼一絲動搖。',{心:1,exp:8}),
    f:R('你拒絕得不夠堅決，魔修笑著說：「你會回來的。」',{心:-1})}),
  O('假意答應，套取功法','diligent',['悟',15],{
    g:R('你騙過了魔修，抄下了功法的核心——然後徹底銷毀。你知道了魔道的路數，卻沒有沾一滴血。',{悟:2,心:1,exp:30}),
    k:R('你騙到一部分，但被魔修識破。',{悟:1,exp:12}),
    f:R('你的演技被看穿，魔修的臉色變了。',{體:-1}),
    b:R('魔修的手段，比你想像得更狠。',{},{die:'被魔修識破詭計，神魂俱滅'})}),
  O('拖延，說要考慮一下','careful',['人',13],{
    g:R('你拖了三天，魔修不耐煩地走了，你鬆了口氣。',{心:1}),
    k:R('你勉強拖過去了，但心裡很不安。',{}),
    f:R('魔修看出你在拖延，冷笑一聲，在你身上留了個標記。',{心:-1})}),
  O('心動了，試一試','bold',['心',16],{
    g:R('你只沾了一點，竟立刻突破了瓶頸，卻也從此背負了一道心魔。',{exp:40,心:-2}),
    k:R('你沾了一點血，突破了瓶頸，但心裡隱約有些不安。',{exp:25,心:-1}),
    f:R('魔功反噬，你吐血三升。',{體:-2,心:-2,exp:-10}),
    b:R('魔功比你想像的更邪門。',{},{die:'入了魔道，從此世上少了一位修士，多了一頭魔'})})
]},
{id:'e_herb',t:'千年靈藥',a:[60,3000],rm:[3,6],w:1.6,text:'你偶然得知，後山的懸崖峭壁上，長著一株千年靈藥。傳說服用之人，可增壽百年、修為倍增。但同時，有幾股勢力也盯上了它。',o:[
  O('趁夜摘取，神不知鬼不覺','bold',['體',14],{
    g:R('你深夜出手，悄無聲息地摘下靈藥。第二天，大家發現靈藥不見了，你已經在洞府裡煉化了它。',{體:2,exp:40}),
    k:R('你摘到了靈藥，但被人發現了蹤跡。',{exp:20,人:-1}),
    f:R('被守衛發現，你狼狽逃出，一無所獲。',{體:-1}),
    b:R('有人在崖邊布下了暗哨。',{},{die:'為了一株靈藥，死在了後山的懸崖下'})}),
  O('聯合幾位修士，共同採摘','careful',['人',13],{
    g:R('你們協作默契，靈藥被分成了五份，每個人都得到了足夠的好處。',{人:2,exp:25}),
    k:R('靈藥分得不均，你得到了一小份。',{人:1,exp:12}),
    f:R('同盟內鬥，靈藥被別人搶了去。',{人:-2})}),
  O('研究藥性，提前準備克制手段','diligent',['悟',15],{
    g:R('你提前調配了一份護脈丹，服用靈藥時毫無反噬，修為暴漲。',{悟:1,exp:45}),
    k:R('你準備得還算充分，服藥後略有不適，但總體順利。',{exp:22}),
    f:R('你的準備不夠充分，服藥後差點被藥力撐爆。',{體:-2,exp:10})}),
  O('讓別人去爭，自己看看就好','timid',null,R('你坐在遠處看了一整天。最終，靈藥被一個你不認識的修士帶走了。你沒覺得後悔。',{心:1}))
]},
{id:'e_formation',t:'護山大陣',fl:['inSect'],a:[60,3000],rm:[3,5],w:2,text:'宗門的護山大陣出現了裂縫，長老們一籌莫展。有人找到了你：「你對陣法有些心得，能不能……幫個忙？」',o:[
  O('親自操刀，修復大陣','diligent',['悟',14],{
    g:R('你花了七天七夜，將大陣修復得比原本更堅固。長老們看你的眼神，已經變了。',{悟:2,人:3,exp:30}),
    k:R('大陣被修好了，雖然有些粗糙，但足以應付。',{悟:1,人:1,exp:15}),
    f:R('修復過程中出了岔子，大陣的裂縫更大了。',{人:-2})}),
  O('召集同門，集思廣益','careful',['人',13],{
    g:R('你把宗門裡的陣法愛好者全找來，眾人一起動手，三天就搞定。你成了組織者，名聲大振。',{人:4,exp:15}),
    k:R('大家七嘴八舌，終於把大陣修好了。',{人:2,exp:6}),
    f:R('意見太多，反而一事無成。',{人:-1})}),
  O('藉機研究大陣的運作原理','bold',['悟',15],{
    g:R('你一邊修復一邊研究，發現這座大陣的核心，竟與你的功法暗合。',{悟:2,exp:40}),
    k:R('你研究了一部分，收穫不小。',{悟:1,exp:20}),
    f:R('你過於投入，忽略了時間，修復拖延。',{人:-1})}),
  O('推薦別人去做','timid',null,R('你把事情推給了別人，自己落得清閒。事後，那人受到了宗門的重賞。你有點後悔。',{心:-1}))
]},
{id:'e_politic',t:'宗門內鬥',fl:['inSect'],a:[40,3000],rm:[2,5],w:2,text:'宗門裡兩位長老因為掌門之位爭得不可開交，各自拉攏弟子。你的師兄師姐們也被分成了兩派。他們看著你，在等你表態。',o:[
  O('站隊強勢一方','bold',['人',13],{
    g:R('你押對了寶，強勢一方上位後，你被提拔為核心弟子。',{人:3,金:4,exp:20}),
    k:R('你選了強勢的一方，雖然沒有太多好處，但也安全。',{人:1,金:1}),
    f:R('你站的一方輸了，被對方清算。',{人:-3,金:-3})}),
  O('兩邊都不站，專心修行','diligent',['心',12],{
    g:R('你兩邊都不得罪，埋頭修行。紛爭結束後，兩邊都覺得你是個可交的人。',{心:2,人:2,exp:20}),
    k:R('你保持中立，雖然被人孤立了一陣子。',{心:1,exp:10}),
    f:R('兩邊都覺得你不識抬舉，暗中排擠你。',{人:-2})}),
  O('暗中調解，居中斡旋','careful',['人',14],{
    g:R('你憑著三寸不爛之舌，居然真的讓兩位長老坐下來談了一次。雖然沒完全和解，但避免了流血。',{人:4,心:1,exp:25}),
    k:R('你的調解產生了一點效果。',{人:2}),
    f:R('你兩頭不討好，被雙方都罵了一頓。',{人:-2})}),
  O('稱病閉關，避開風頭','timid',null,R('你在洞府裡閉關三個月，出來時，紛爭已經結束了。',{心:1,exp:6}))
]},
{id:'e_void',t:'虛空遊歷',a:[200,5000],rm:[5,7],w:2,text:'修為到了這個階段，凡間的一切都顯得渺小。你站在山巔，感到一陣前所未有的空虛。星空在召喚你，你的神識，隱隱觸碰到了「世界」的邊緣。',o:[
  O('破開虛空，探索邊界','bold',['心',16],{
    g:R('你一步踏入虛空，在無數星辰間漫遊。你看見了無數個世界，也看見了自己的渺小與偉大。',{心:2,悟:2,exp:50}),
    k:R('你在虛空邊緣走了一圈，獲得了一些感悟。',{悟:1,exp:25}),
    f:R('虛空亂流把你捲了回來，你吐了一口血。',{體:-2}),
    b:R('虛空比你想像的更危險。',{},{die:'迷失在虛空的亂流中，再也沒有回來'})}),
  O('靜心推演，觀察世界運行的規律','diligent',['悟',17],{
    g:R('你推演三年，隱約看見了一條連通世界的線，感到前所未有的清明。',{悟:3,exp:50}),
    k:R('你推演出一些規律，收穫頗豐。',{悟:1,exp:25}),
    f:R('推演過度，你的識海一片混亂。',{心:-1,exp:-8})}),
  O('向天道問路','careful',['心',15],{
    g:R('你向蒼天發問，三天後，天地間回應了一句：「慢慢來。」你莫名地笑了。',{心:2,exp:25}),
    k:R('你沒得到回應，但心安了一些。',{心:1}),
    f:R('你的問題，天地沒有回答。',{})}),
  O('留在原地，繼續享受這份平靜','timid',null,R('你什麼也沒做，只是看了一夜的星星。這一刻，你覺得自己什麼都不缺。',{心:1}))
]},
{id:'e_heavenwar',t:'仙魔之戰',a:[200,5000],rm:[5,7],w:2.2,text:'天地間忽然出現一道巨大的裂縫，裂縫之後，是無邊無際的魔氣。仙界的使者匆匆趕來：「魔界入侵，凡有修為者，皆需出力！」大戰一觸即發。',o:[
  O('衝上最前線，血戰魔將','bold',['體',18],{
    g:R('你一人斬殺三名魔將，名字被刻在了仙界的功勳碑上。',{體:2,人:3,exp:60}),
    k:R('你負傷殺敵，立下大功。',{體:-1,人:2,exp:30}),
    f:R('你被魔將重創，躺了三十年才恢復。',{體:-3,exp:-10}),
    b:R('魔將的實力，遠在你的預料之上。',{},{die:'在仙魔大戰中身隕，連殘魂都被魔氣吞噬'})}),
  O('布下大陣，守住關隘','diligent',['悟',18],{
    g:R('你的大陣擋住了魔潮三個月，為仙界爭取了寶貴的時間。',{悟:2,人:2,exp:55}),
    k:R('大陣守住了一段時間，雖然最終被突破，但你已盡力。',{悟:1,exp:25}),
    f:R('大陣被魔氣腐蝕，你匆忙撤退。',{心:-1})}),
  O('整合各路援軍，統一指揮','careful',['人',17],{
    g:R('你憑著多年積累的人脈，把各路散兵游勇整合成一支精銳。仙魔大戰後，你被推舉為聯軍統帥。',{人:4,exp:45}),
    k:R('你整合了一部分援軍，起到了不小的作用。',{人:2,exp:20}),
    f:R('各路援軍互不服氣，局面一團混亂。',{人:-2})}),
  O('後撤保存實力','timid',null,R('你選擇退到安全地帶。事後，你聽說這場大戰，死了很多你認識的人。',{心:-2}))
]},
{id:'e_cave',t:'大能洞府',a:[100,4000],rm:[4,6],w:1.8,text:'你偶然發現一處隱秘的洞府，洞口刻著一行小字：「有緣者入，無緣者死。」洞府主人，是一位數千年前隕落的大能。這到底是機緣，還是陷阱？',o:[
  O('闖入洞府，直取核心','bold',['悟',16],{
    g:R('你一路闖過十八道禁制，在洞府深處找到了大能的傳承，修為暴漲。',{悟:2,體:1,exp:50}),
    k:R('你闖過了大部分禁制，拿到了一些珍寶。',{exp:25,金:5}),
    f:R('你被禁制擋在外面，狼狽退出。',{體:-2}),
    b:R('洞府的最後一道禁制，是專門為闖入者準備的。',{},{die:'死於大能洞府的最後一道禁制，成了洞府的又一具白骨'})}),
  O('仔細觀察，解析禁制','diligent',['悟',17],{
    g:R('你解開了所有禁制，洞府的大門緩緩打開。裡面的傳承，全部歸你。',{悟:3,exp:55}),
    k:R('你解開了一部分禁制，已能拿到不少寶物。',{悟:1,exp:25,金:3}),
    f:R('你解了一天，也沒找到突破口。',{})}),
  O('請同道一起探索','careful',['人',15],{
    g:R('眾人合力，一一破解禁制。分贓時你也沒吃虧，還賺了幾個人情。',{人:3,exp:30,金:4}),
    k:R('大家分了寶物，你得了一份。',{人:1,exp:15}),
    f:R('有人暗中使絆，你損失慘重。',{人:-2,金:-3})}),
  O('不入洞府，把位置記下來','timid',null,R('你把洞府的位置記在心裡，打算以後再來。但很多年後，你都沒有回來。',{心:1}))
]},
{id:'e_debate',t:'論道大會',a:[100,4000],rm:[4,6],w:1.8,text:'修仙界百年一度的「論道大會」召開了。來自四方的大能齊聚一堂，輪流登台闡述自己的「道」。台下的聽眾，個個都是行家。輪到你時，所有人都安靜了。',o:[
  O('闡述自己一生所悟的道','diligent',['悟',16],{
    g:R('你一口氣講了三個時辰。結束時，全場靜默了片刻，然後雷鳴般的掌聲響起。你的「道」，被許多人記住了。',{悟:2,人:3,exp:50}),
    k:R('你講得中規中矩，部分人點頭稱是。',{悟:1,exp:25}),
    f:R('你講到一半，被某位大能指出了破綻，場面尷尬。',{心:-1})}),
  O('挑戰前一位發言者的觀點','bold',['心',16],{
    g:R('你一句反問，把對方問得啞口無言。全場譁然，隨後掌聲四起。',{心:2,人:2,exp:40}),
    k:R('你提出了一個有趣的反駁，引發了一場熱烈的討論。',{人:1,exp:20}),
    f:R('你的質疑被對方輕鬆化解，反而顯得有些魯莽。',{人:-1,心:-1})}),
  O('只說幾句，點到為止','careful',['心',14],{
    g:R('你只說了短短三句話，卻讓人回味無窮。',{心:2,人:2,exp:30}),
    k:R('你的簡短發言，沒有太多亮點，但也安全。',{exp:10}),
    f:R('你太簡短了，大家以為你沒東西可說。',{人:-1})}),
  O('推辭，只當聽眾','timid',null,R('你搖搖頭，在角落裡聽了三天的論道。這三天，你收穫比任何一次都多。',{悟:1,exp:15}))
]},

// =============== 劇情線 A：戒指裡的老爺爺 ===============
{id:'s_gp1',t:'老爺爺的心事',fl:['grandpa'],nf:['gp1'],a:[16,3000],rm:[1,3],w:5,text:'夜深人靜，戒指裡的老爺爺難得沒有講當年勇。他沉默許久，才開口：「小子……老夫其實，欠一個人一個交代。」',o:[
  O('靜靜聽他說完','careful',['心',10],{
    g:R('老爺爺說起往事：他叫玄塵，曾是一代宗師，卻被最信任的大弟子暗算，神魂被封入戒中。他請你日後留意「幽冥宗」。',{悟:1,心:1,exp:6},{flag:'gp1'}),
    k:R('老爺爺說了個大概，聲音越來越輕：「叛徒……幽冥宗……」',{心:1},{flag:'gp1'}),
    f:R('老爺爺講到一半，你睡著了。他嘆了口氣：「罷了。」但你還是記住了「幽冥宗」三個字。',{},{flag:'gp1'})}),
  O('追問細節，問出他的來歷','diligent',['悟',11],{
    g:R('你一句一句追問，老爺爺終於全盤托出：他的本命法寶被叛徒奪走，他的宗門被屠。他說：「老夫不求報仇，只求，不要讓叛徒的陰謀得逞。」',{悟:1,exp:10},{flag:'gp1'}),
    k:R('你問到了一部分真相。',{exp:5},{flag:'gp1'}),
    f:R('你問得太急，老爺爺閉了嘴，過了三天才重新開口。',{},{flag:'gp1'})}),
  O('勸他放下過去','bold',['心',11],{
    g:R('老爺爺沉默良久：「你這小子……比老夫當年強。」他似乎輕鬆了一些。',{心:2},{flag:'gp1'}),
    k:R('老爺爺嘆了口氣：「放不下啊。」',{心:1},{flag:'gp1'}),
    f:R('老爺爺惱了：「你懂什麼！」他三天沒搭理你。',{},{flag:'gp1'})}),
  O('假裝睡著','timid',null,R('你打起了呼嚕。老爺爺嘆氣：「罷了，老夫自己想。」但你隱約聽到了「幽冥宗」三個字。',{},{flag:'gp1'}))
]},
{id:'s_gp2',t:'舊宗門遺址',fl:['gp1'],nf:['gp2'],a:[30,3000],rm:[2,4],w:5,text:'老爺爺指點你去了一處荒山。那裡曾是他的宗門「玄塵宗」的山門，如今只剩斷壁殘垣與一棵半枯的古松。「就是這裡了。」他的聲音，有些顫抖。',o:[
  O('清理遺址，尋找遺物','diligent',['悟',12],{
    g:R('你在廢墟下挖出一個玉盒，裡面是玄塵老祖當年的傳承玉簡。老爺爺沉默了很久，才說：「謝謝。」',{悟:2,exp:15},{flag:['gp2','gp2full']}),
    k:R('你找到了一些殘片，雖然不完整，但足以讓老爺爺露出一絲笑意。',{悟:1,exp:8},{flag:'gp2'}),
    f:R('什麼也沒找到，你只挖了滿手繭。',{體:1},{flag:'gp2'})}),
  O('在古松下祭拜','careful',['心',10],{
    g:R('你在松下擺上清酒，鞠了三躬。老爺爺在戒指裡泣不成聲，過了很久，說了一句「老夫，終於可以釋懷了」。',{心:2,exp:10},{flag:['gp2','gp2full']}),
    k:R('你祭拜完畢，老爺爺輕輕道了聲謝。',{心:1},{flag:'gp2'}),
    f:R('你祭拜得有些草率，老爺爺沒說話。',{},{flag:'gp2'})}),
  O('布陣驅散殘留的怨氣','diligent',['悟',13],{
    g:R('你布下的陣法把山門上積壓了千年的怨氣一掃而空。古松上，竟抽出了一枚新芽。',{悟:1,心:1,exp:20},{flag:['gp2','gp2full']}),
    k:R('怨氣被驅散了一部分，山門稍稍亮堂了些。',{exp:10},{flag:'gp2'}),
    f:R('陣法失敗，怨氣反而被激發了。你匆忙撤離。',{體:-1},{flag:'gp2'})}),
  O('掉頭就走，這裡有點陰森','timid',null,R('你拉著戒指轉身就走。老爺爺在戒指裡罵了一路：「膽小鬼！」',{},{flag:'gp2'}))
]},
{id:'s_gp3',t:'叛徒現身',fl:['gp2'],nf:['gp3'],a:[40,3000],rm:[3,5],w:5,text:'幽冥宗的長老找上了門：「這位道友，你身上，有『玄塵』的氣息。」戒指裡，老爺爺低聲說：「就是他。我的好徒弟，一千年了，還是那麼愛笑。」',o:[
  O('正面對峙，直接揭穿','bold',['心',14],{
    g:R('你一口喝破他的身份。叛徒臉色驟變，倉皇而逃。老爺爺在戒指裡，笑出了聲。',{心:2,人:1,exp:25},{flag:['gp3','gpWin']}),
    k:R('雙方僵持不下，他撂了狠話退去。',{exp:12},{flag:'gp3'}),
    f:R('你被他一掌震傷，老爺爺拚命替你擋了一擊。',{體:-2},{flag:'gp3'}),
    b:R('叛徒的實力，比你想像的更強。',{},{die:'被叛徒當場擊殺，戒指落入了他手中'})}),
  O('假裝不知情，與他周旋','careful',['人',13],{
    g:R('你一邊套話，一邊暗自記下他的弱點。叛徒告辭時，還以為占了便宜。',{人:1,exp:20},{flag:['gp3','gpWin']}),
    k:R('你與他周旋了一晚，得到了一些情報。',{exp:8},{flag:'gp3'}),
    f:R('你被他看穿，幸好老爺爺出面解圍。',{體:-1},{flag:'gp3'})}),
  O('設下陷阱，引他入局','diligent',['悟',14],{
    g:R('你悄悄布下一座殺陣，將他困在其中，逼他交出了老爺爺的本命法寶殘片。',{悟:1,exp:30,金:3},{flag:['gp3','gpWin']}),
    k:R('陷阱困住了他一瞬，你趁機逃脫。',{exp:10},{flag:'gp3'}),
    f:R('陷阱被他一眼看穿，你吃了個悶虧。',{體:-1},{flag:'gp3'})}),
  O('轉身就跑','timid',null,R('你拔腿就跑，叛徒在背後大笑：「小娃娃，跑得挺快。」老爺爺沉默片刻：「……下次，換個法子。」',{心:-1},{flag:'gp3'}))
]},
{id:'s_gp4',t:'老爺爺的最後一課',fl:['gp3'],nf:['gp4'],a:[60,5000],rm:[4,6],w:6,text:'深夜，戒指微微發熱。老爺爺的聲音比以往都輕：「小子，老夫的殘魂，撐不了多久了。有些事，是該告訴你了。」',o:[
  O('靜靜聽他說','careful',['心',12],{
    g:R('老爺爺說：「老夫……並不屬於這個世界。我來自一個叫『藍星』的地方。」他把一生所學盡數傳你，最後說了一句：「回家的路，在星空的盡頭。」你鼻子一酸。',{悟:2,心:1,exp:30},{clue:1,flag:['gp4','gpTruth']}),
    k:R('老爺爺說了一個你不太懂的詞：「藍星」。他用最後的力量，在你識海裡刻下一幅星圖。',{悟:1,exp:15},{clue:1,flag:['gp4','gpTruth']}),
    f:R('老爺爺說到一半，魂力不支：「星……」就再也沒了聲音。戒指安靜了下來。',{exp:5},{flag:'gp4'})}),
  O('以自己的魂力，助他延續','diligent',['悟',15],{
    g:R('你以自己的魂力為引，讓老爺爺的殘魂多撐了三天。三天裡，他把所有的秘密都告訴了你。',{悟:2,exp:30},{clue:1,flag:['gp4','gpTruth']}),
    k:R('你多撐了老爺爺一天，聽到了一些零碎的故事。',{exp:12},{clue:1,flag:['gp4','gpTruth']}),
    f:R('你魂力不足，反而傷了自己。老爺爺說：「別，小子，別。」',{體:-1,心:-1},{flag:'gp4'})}),
  O('告訴他：「您不是一個人」','bold',['心',13],{
    g:R('老爺爺沉默了很久，才說：「……你是不是，也是從那邊來的？」你沒有回答，只是笑。老爺爺的聲音，帶著顫抖：「那就好，那就好。」',{心:3,exp:25},{clue:1,flag:['gp4','gpTruth']}),
    k:R('老爺爺說：「小子，有你這句話，老夫值了。」',{心:2},{flag:'gp4'}),
    f:R('老爺爺沒聽懂你的意思，嘆了口氣：「老夫累了。」',{},{flag:'gp4'})}),
  O('讓他好好休息，不再追問','timid',null,R('你把戒指輕輕握在手心，一夜沒睡。第二天，戒指再沒有發過熱。',{心:1},{flag:'gp4'}))
]},

// =============== 劇情線 B：宿敵 ===============
{id:'s_rv1',t:'集市上的少年',a:[16,45],rm:[0,2],nf:['rival','rivalFriend'],w:4,text:'集市上，一個衣著華麗的少年擋住你的路，說你踩了他的靴子。那雙靴子，其實乾淨得像沒穿過。他的眼神裡寫滿了「我就是來找茬的」。',o:[
  O('針鋒相對，當眾讓他下不了台','bold',['心',10],{
    g:R('你三言兩語把他噎得面紅耳赤，周圍人哄笑。他咬牙：「你給我記住！」',{心:1,人:1},{flag:'rival'}),
    k:R('你不卑不亢頂了回去，他悻悻而去。',{心:1},{flag:'rival'}),
    f:R('你嘴上不饒人，卻被他帶來的人推了一把。',{體:-1},{flag:'rival'})}),
  O('客氣道歉，化解尷尬','careful',['人',10],{
    g:R('他愣住了，臉紅了半天，只丟下一句「算你識相」。後來你們竟成了點頭之交。',{人:2},{flag:'rivalFriend'}),
    k:R('他哼了一聲走了，事情就此了結。',{人:1}),
    f:R('他覺得你軟弱，更加變本加厲。',{人:-1},{flag:'rival'})}),
  O('看出他在虛張聲勢，淡定以對','diligent',['悟',11],{
    g:R('你看出他其實心裡發虛，只是想引起注意。你請他喝了杯茶，他的臉更紅了。',{悟:1,人:1},{flag:'rivalFriend'}),
    k:R('你淡淡一笑，他反而有些不知所措。',{人:1}),
    f:R('你猜錯了，他是真來找茬。',{體:-1},{flag:'rival'})}),
  O('繞道走開','timid',null,R('你繞了條小路。身後傳來一聲冷哼，他記住了你的背影。',{},{flag:'rival'}))
]},
{id:'e_rival',t:'宿敵重逢',fl:['rival'],nf:['rivalMet'],a:[60,2000],rm:[3,5],w:4,text:'當年集市上那個找茬的少年，如今竟成了某大宗門的首席。他看你的眼神，充滿了「我等你很久了」。',o:[
  O('正面對決','bold',['體',15],{
    g:R('你一拳擊碎他的護體靈光，他愣了片刻：「……你什麼時候這麼強了？」',{exp:30,人:2},{flag:'rivalMet'}),
    k:R('旗鼓相當，打到雙方都沒力氣。他笑著說：「下次再來。」',{exp:15,體:-1},{flag:'rivalMet'}),
    f:R('被他壓著打了三條街。',{體:-2,人:-1},{flag:'rivalMet'}),
    b:R('他這些年，確實更努力。',{},{die:'敗給宿敵，臨終聽到一句：「莫欺中年窮。」'})}),
  O('智取','diligent',['悟',14],{
    g:R('你布下一座簡易陣法，讓他自己走了進去。',{exp:28,悟:1},{flag:'rivalMet'}),
    k:R('用小手段勝了半招。',{exp:12},{flag:'rivalMet'}),
    f:R('陣法被他一眼看穿。',{體:-1},{flag:'rivalMet'})}),
  O('主動結盟，化敵為友','careful',['人',13],{
    g:R('他沉默片刻，伸出手：「過去的事，翻篇吧。」',{人:3,金:4},{flag:'rivalMet'}),
    k:R('勉強達成了「互不干涉」的協議。',{人:1},{flag:'rivalMet'}),
    f:R('他以為你是在示弱，反而更囂張了。',{人:-1},{flag:'rivalMet'})}),
  O('轉身離開','timid',null,R('你頭也不回地走了。他在背後喊了一句什麼，你假裝沒聽見。',{心:1},{flag:'rivalMet'}))
]},
{id:'e_rival_f',t:'故人重逢',fl:['rivalFriend'],nf:['rivalMet'],a:[60,2000],rm:[3,5],w:4,text:'當年集市上那個紅著臉的少年，如今已是名震一方的人物。他在一場宴席上遠遠舉杯，笑著說：「我可沒忘了那杯茶。」',o:[
  O('舉杯回敬，與他敘舊','careful',['人',11],{
    g:R('你們聊了一整夜。他說：「這些年，我最想念的，其實是那杯茶。」你們結為摯友。',{人:3,心:1,exp:15},{flag:['rivalMet','rivalAlly']}),
    k:R('敘了舊，客氣而溫暖。',{人:2},{flag:'rivalMet'}),
    f:R('你們聊得有些尷尬，只好以酒掩飾。',{},{flag:'rivalMet'})}),
  O('邀他切磋，點到為止','bold',['體',13],{
    g:R('你們過了百招，不分勝負，相視而笑：「這才是對手。」',{體:1,人:2,exp:20},{flag:['rivalMet','rivalAlly']}),
    k:R('切磋愉快，雙方都有收穫。',{exp:10},{flag:'rivalMet'}),
    f:R('你輸了半招，他很客氣地說「承讓」。',{體:-1},{flag:'rivalMet'})}),
  O('請他助你一臂之力','diligent',['人',12],{
    g:R('他二話不說，答應了你的請求。你欠他一個人情，但覺得很值得。',{人:2,exp:20,金:3},{flag:['rivalMet','rivalAlly']}),
    k:R('他給了你一點幫助，雖然不多，但很誠懇。',{人:1,exp:8},{flag:'rivalMet'}),
    f:R('他婉拒了：「抱歉，這事我不便插手。」',{人:-1},{flag:'rivalMet'})}),
  O('客氣寒暄，保持距離','timid',null,R('你們寒暄了幾句，各自散去。你覺得有些可惜，卻也說不上來為什麼。',{心:1},{flag:'rivalMet'}))
]},
{id:'e_rival_d',t:'師徒再見',fl:['rejected'],nf:['rivalMet'],a:[60,2000],rm:[3,5],w:4,text:'當年被你一腳踹下山的少年，如今成了魔道新晉巨擘，人稱「血衣修羅」。他站在你面前，一字一句：「師父，別來無恙。」',o:[
  O('直面他，問他想要什麼','bold',['心',14],{
    g:R('你直視他的眼睛：「我當年錯了嗎？」他愣住了。許久，他別過頭：「……我只是想要一個說法。」',{心:2,exp:25},{flag:'rivalMet'}),
    k:R('兩人對峙許久，各自退了一步。',{心:1},{flag:'rivalMet'}),
    f:R('他一掌拍來，你勉強接下，卻也被震退三步。',{體:-2},{flag:'rivalMet'}),
    b:R('他的修為，早已不在你之下。',{},{die:'被親手教出來的魔道巨擘斬殺，死前，他說：「師父，這一次，我贏了。」'})}),
  O('道歉：當年是我太過魯莽','careful',['心',13],{
    g:R('他怔在原地，眼眶紅了：「……我等你這句話，等了五十年。」你們就著一壺酒，聊了一夜。',{心:3,人:2,exp:20},{flag:['rivalMet','rivalAlly']}),
    k:R('他沉默許久，只說了一句：「我知道了。」',{心:1},{flag:'rivalMet'}),
    f:R('他冷笑一聲：「現在說這些，有什麼用。」',{心:-1},{flag:'rivalMet'})}),
  O('試探他的修為，看看這些年他走了多遠','diligent',['悟',14],{
    g:R('你看出他的修為已經很高，卻處處留手。他對你，其實並無殺意。',{悟:1,exp:25},{flag:'rivalMet'}),
    k:R('你試探了一番，雙方都沒有下殺手。',{exp:12},{flag:'rivalMet'}),
    f:R('你的試探被他看穿，他的眼神冷了下來。',{體:-1},{flag:'rivalMet'})}),
  O('轉身離開，不願再見','timid',null,R('你背對著他，一步一步走遠。他沒有追來，只是在背後輕聲說了一句什麼。你沒有聽清。',{心:-1},{flag:'rivalMet'}))
]},
{id:'s_rv3',t:'了斷',fl:['rivalMet'],nf:['rivalEnd'],a:[80,3000],rm:[4,6],w:6,text:'一切都該有個了斷。你與他的恩怨，在這一年走到了盡頭。他站在山巔等你，風把他的衣角吹得獵獵作響。',o:[
  O('決一死戰','bold',['體',16],{
    g:R('一戰七天七夜，你以半招之差勝出。他倒下時笑了：「這輩子，終於不是你讓我了。」',{體:2,exp:40,人:2},{flag:'rivalEnd'}),
    k:R('兩敗俱傷，雙雙重傷，彼此一笑泯恩仇。',{體:-1,exp:20},{flag:'rivalEnd'}),
    f:R('你輸了，他卻沒有下殺手：「下次。」',{體:-2},{flag:'rivalEnd'}),
    b:R('這一戰，他豁出了一切。',{},{die:'敗於宿敵之手，臨終前他說：「對不起。我只是想贏你一次。」'})}),
  O('擺下一壺酒，與他對飲','careful',['人',15],{
    g:R('你擺下一壺酒，與他對飲三杯。他沉默許久，終於舉杯：「算了。」從此他成了你最可靠的盟友。',{人:3,心:2,exp:25},{flag:['rivalEnd','rivalAlly']}),
    k:R('酒喝完了，恩怨也淡了一些。',{人:1,心:1},{flag:'rivalEnd'}),
    f:R('他冷笑一聲，拂袖而去。',{人:-1},{flag:'rivalEnd'})}),
  O('揭開當年的真相，點醒他','diligent',['悟',15],{
    g:R('你把當年的來龍去脈一一說明。他聽完，沉默了很久，緩緩放下了劍。',{悟:1,心:2,exp:30},{flag:['rivalEnd','rivalAlly']}),
    k:R('你說出了真相，他半信半疑，但已不再那麼激動。',{心:1,exp:12},{flag:'rivalEnd'}),
    f:R('他不信你的話，認為你在狡辯。',{心:-1},{flag:'rivalEnd'})}),
  O('把所有讓給他，退隱山林','timid',null,R('你把所有資源讓給了他。他愣住了，良久才說：「……你真是個傻子。」你笑了笑，轉身離去。',{心:2,金:-3},{flag:['rivalEnd','rivalAlly']}))
]},
// =============== 家境專屬（續） ===============
{id:'f_hunter2',t:'山神祭',fm:['hunter'],a:[16,90],rm:[0,3],w:6,text:'山神祭到了。村長說，今年得獵一頭「山神的使者」——一頭活了三十年的白毛野豬王——才能保來年平安。全村的目光，都落在你身上。',o:[
  O('接下重任，獨自進山','bold',['體',12],{
    g:R('三天三夜的追蹤，你在山谷裡與野豬王正面撞上。一場惡戰後，你把牠扛下山。全村歡呼，你成了「山神的使者」。',{體:2,人:2,exp:10}),
    k:R('你重傷了牠，牠逃進深山。村長說：「也算有誠意了。」',{體:1,人:1,exp:5}),
    f:R('你被野豬王撞斷兩根肋骨，被人抬回村裡。',{體:-2}),
    b:R('白毛野豬王比傳說中更凶。',{},{die:'被白毛野豬王拱下山崖，那年之後沒人敢再進山'})}),
  O('召集獵戶，設下圍獵','careful',['人',11],{
    g:R('你把村裡的獵手組織起來，布好陷阱，一網打盡。全村吃了三天的肉。',{人:3,金:2,exp:6}),
    k:R('圍獵成功，但野豬王衝破了一角。',{人:1,exp:3}),
    f:R('大家各有各的算盤，圍獵亂成一鍋粥。',{人:-1})}),
  O('觀察足跡與習性，守在泉邊','diligent',['悟',12],{
    g:R('你從泥土與樹皮上讀出了牠的路線，守在泉邊一箭定勝負。',{悟:1,體:1,exp:10}),
    k:R('你推斷出牠的巢穴，但沒能守到牠。',{exp:5}),
    f:R('追蹤一路跟丟，白走了十里山路。',{})}),
  O('稱病躲開','timid',null,R('你抱著被子說身體不適。村長嘆了口氣，另請別人。你心裡有點愧疚。',{心:-1,人:-1}))
]},
{id:'f_hunter3',t:'獵人的直覺',fm:['hunter'],a:[80,3000],rm:[3,6],w:6,text:'你從小在山裡長大，養成了一種說不清的直覺。這天清晨，你忽然覺得整座山都在發抖——不是地震，是無數獸類同時往同一個方向逃。',o:[
  O('立刻通知附近的村鎮撤離','careful',['人',13],{
    g:R('你拉響警鐘，三座村鎮連夜撤離。獸潮過境時，沒有一個人死傷。人們為你立了一塊功德碑。',{人:3,心:2,exp:20}),
    k:R('大部分人撤了出去，只有少數人損失了家當。',{人:1,exp:8}),
    f:R('沒人信你的話，等獸潮到了才後悔。',{人:-1})}),
  O('逆著獸潮，找出源頭','bold',['體',15],{
    g:R('你在獸潮盡頭發現一頭受傷的上古妖獸，牠才是這一切的源頭。你一擊斬殺，獸潮瞬間散去。',{體:2,exp:35,金:4}),
    k:R('你找到源頭，勉強擊退了牠。',{體:-1,exp:18}),
    f:R('被獸潮沖得七零八落，狼狽退回。',{體:-2}),
    b:R('源頭遠比你想像的龐大。',{},{die:'逆著獸潮而行，成為了獸潮的一部分'})}),
  O('用野外經驗找一處安全地帶','diligent',['悟',14],{
    g:R('你憑直覺找到一處山洞，躲過了獸潮，洞裡還有一株靈藥。',{悟:1,exp:20}),
    k:R('躲過了獸潮，但損失了一些裝備。',{exp:8}),
    f:R('你判斷錯了方向，差點被獸群追上。',{體:-1})}),
  O('先自己躲起來再說','timid',null,R('你躲進了地底的石縫。獸潮過去後，你灰頭土臉地爬出來，山下的村莊已是一片狼藉。',{心:-1}))
]},
{id:'f_decline2',t:'討債的上門',fm:['decline'],a:[16,80],rm:[0,3],w:6,text:'一群人敲響了祖宅的大門，領頭的拿著一張泛黃的借據：「令祖百年前借了我家三百靈石，連本帶利，一共是三千。」你翻了翻借據，發現上面的印章看起來……很新。',o:[
  O('逐條對質，找出借據的破綻','diligent',['悟',11],{
    g:R('你指出印泥的年份不對，對方臉色大變，扔下借據落荒而逃。',{悟:1,人:1,exp:6}),
    k:R('你抓到幾處破綻，雙方各退一步，只賠了一小筆。',{金:-1}),
    f:R('你說了半天，對方一句「那就官府見」就把你堵住了。',{金:-3})}),
  O('請族中長輩出面','careful',['人',10],{
    g:R('長輩出面，說了幾句場面話，對方居然乖乖退下。你第一次覺得，祖上的名頭還有點用。',{人:2}),
    k:R('長輩替你還了一半，另一半記在帳上。',{金:-1,人:1}),
    f:R('長輩推說「這是你們這一房的事」，把你晾在一邊。',{人:-1})}),
  O('把他們趕出門去','bold',['體',11],{
    g:R('你一個人擋在門前，對方硬是沒敢往裡走一步。你在祖宅前立了威。',{體:1,心:1}),
    k:R('把人趕走了，但對方撂下「改日再來」。',{}),
    f:R('寡不敵眾，被推倒在地，丟了面子。',{體:-1,人:-1})}),
  O('破財消災','timid',null,R('你湊了三百靈石遞過去。對方收了錢，臨走還說：「下次別再欠了。」',{金:-3}))
]},
{id:'f_decline3',t:'重振門楣',fm:['decline'],fl:['oldlib'],a:[60,3000],rm:[3,6],w:6,text:'你憑藉祖宅藏書上的心得，一路修到今日。族裡的老人們紛紛上門：「家主，咱家這百年的沒落，該到頭了。」他們看著你，眼裡有光，也有期望。',o:[
  O('重開宗祠，立族規','careful',['人',13],{
    g:R('你重開祠堂，立下新的族規。族人們看著你，彷彿看見了祖上的影子。從此家族漸漸有了生氣。',{人:3,金:3,exp:15}),
    k:R('族規立下，反應平平，但至少有了開端。',{人:1,exp:6}),
    f:R('族中老人對新規矩大為不滿，吵了三天。',{人:-1})}),
  O('把祖傳功法整理成冊，傳授後輩','diligent',['悟',14],{
    g:R('你花了一年整理功法，後輩中竟出了好幾個好苗子。族譜上，你的名字被寫在最前面。',{悟:2,人:2,exp:25}),
    k:R('整理出了一部分，後輩進步有限。',{悟:1,exp:10}),
    f:R('功法太深，後輩學不會，反而生了怨言。',{人:-1})}),
  O('帶族人去奪回祖產','bold',['體',14],{
    g:R('你一人一劍殺上門去，把被霸佔多年的祖產奪了回來。族人們跪了一地。',{體:1,人:2,金:5,exp:15}),
    k:R('祖產拿回一半，對方答應不再追究。',{金:2,人:1}),
    f:R('寡不敵眾，族人折損了幾個。',{人:-2,體:-1}),
    b:R('對方請來了高人。',{},{die:'為奪回祖產，死在了自家祖宅的門前'})}),
  O('不管了，各人有各人的路','timid',null,R('你搖搖頭：「各人有各人的路，我就不管了。」你轉身離開，背後傳來一聲嘆息。',{心:-1}))
]},
{id:'f_merchant2',t:'商會聯姻',fm:['merchant'],a:[16,70],rm:[0,3],w:6,text:'家裡的長輩拿著一幅畫像找到你：「對方是南城商會會長的獨子（獨女），這門親事，能讓咱家的生意再上三層樓。」你看了看畫像，沒說話。',o:[
  O('談條件：先見面，再決定','careful',['人',11],{
    g:R('見面後，雙方發現聊得很來，雖然沒成婚，卻成了生意夥伴。',{人:2,金:4}),
    k:R('見了面，雙方客客氣氣，條件談妥，生意照做。',{金:2}),
    f:R('雙方家長都插了嘴，場面一度尷尬。',{人:-1})}),
  O('直接拒絕，婚事自己做主','bold',['心',11],{
    g:R('你說得斬釘截鐵，長輩居然沒反駁，反而說：「像我年輕時。」',{心:2,人:1}),
    k:R('長輩大發雷霆，但你的態度很堅決。',{心:1}),
    f:R('長輩把你關進了祠堂三天。',{心:-1,體:-1})}),
  O('答應聯姻，換取資源','diligent',['人',12],{
    g:R('你們談成了互利的協議，雖然是政治婚姻，卻意外相處得不錯。',{金:6,人:2}),
    k:R('聯姻成了，資源到手，但你心裡有點空。',{金:4,心:-1}),
    f:R('對方並不買帳，兩家鬧得不太愉快。',{金:-2,人:-1})}),
  O('找個藉口出遠門','timid',null,R('你以「歷練」為由，一走就是三年。回來時，那樁婚事早已不了了之。',{心:1,exp:4}))
]},
{id:'f_merchant3',t:'靈石行情',fm:['merchant'],a:[80,3000],rm:[3,6],w:6,text:'你敏銳地察覺到，南方的靈石礦即將減產，行情將暴漲。商會的幾位老朋友也在觀望，沒人敢第一個下手。',o:[
  O('傾家囊買入，賭一把','bold',['金',12],{
    g:R('一個月後，靈石價格翻了三倍。你大賺一筆，連商會會長都來登門請教。',{金:10,人:2,exp:10}),
    k:R('行情上漲，你小賺一筆。',{金:5}),
    f:R('礦區復工的消息一出，價格暴跌。你血本無歸。',{金:-6})}),
  O('聯合商會，共同操盤','careful',['人',13],{
    g:R('你和商會幾位大佬達成默契，穩穩賺了一筆，還換來幾個重要的人情。',{金:6,人:3}),
    k:R('大家各懷心思，最終賺得不多。',{金:3,人:1}),
    f:R('有人走漏消息，行情被攪亂，大家一起虧。',{金:-3,人:-1})}),
  O('深入礦區，調查真相','diligent',['悟',14],{
    g:R('你親自進了礦區，發現減產是假象。你反手賣空，賺得盆滿缽滿。',{金:8,悟:1,exp:15}),
    k:R('你摸清了部分真相，及時調整了策略。',{金:4,exp:6}),
    f:R('礦區戒備森嚴，你被攔在外面，什麼也沒查到。',{})}),
  O('不碰，行情風險太大','timid',null,R('你把錢收好，什麼也沒做。事後行情果然劇烈震盪，你覺得自己的直覺救了你。',{心:1}))
]},
{id:'f_scholar2',t:'藏書閣的秘密',fm:['scholar'],a:[40,3000],rm:[2,5],w:6,text:'你在城中藏書閣借閱古籍時，發現某本書的頁腳有一行極小的批註：「此處有錯，真本在三樓東廂。」你心頭一跳——批註的筆跡，和你爹年輕時一模一樣。',o:[
  O('夜探三樓東廂','bold',['體',12],{
    g:R('你潛入東廂，找到了那本真本——裡面不僅有失傳的修煉心得，還附有你爹當年的批註。',{悟:2,exp:20}),
    k:R('你找到了真本，但被巡夜的僕人發現，倉皇逃出。',{悟:1,exp:10}),
    f:R('東廂門鎖上有禁制，你被反震彈出，驚動了守閣人。',{體:-1,人:-1})}),
  O('光明正大向館主請教','careful',['人',12],{
    g:R('館主沉默良久，領你上了三樓：「你爹當年也問過同樣的問題。」',{人:2,悟:1,exp:15}),
    k:R('館主給你看了一部分，說「其餘的，等你有資格再說」。',{exp:8}),
    f:R('館主冷冷一句「無可奉告」就送客了。',{})}),
  O('研究批註，推演出真本內容','diligent',['悟',14],{
    g:R('你僅憑批註與上下文，把真本的核心推演了出來，甚至比原本更完整。',{悟:2,exp:25}),
    k:R('推演出大致輪廓，雖不完整，但已受益匪淺。',{悟:1,exp:12}),
    f:R('推演錯誤，你一度走火入魔。',{心:-1,exp:-5})}),
  O('把書放回，裝作沒看見','timid',null,R('你把書放回書架，走出了藏書閣。有些事，不知道也許更好。',{心:1}))
]},
{id:'f_scholar3',t:'著書立說',fm:['scholar'],a:[80,3000],rm:[3,6],w:6,text:'修行多年，你已有許多心得。幾位老友勸你：「該寫成書了，傳給後人。」你鋪開一張紙，卻又遲遲沒有落筆。',o:[
  O('寫成《修行心得》，公開流傳','diligent',['悟',14],{
    g:R('書一出，修仙界為之轟動。許多宗門把它列為必讀。你成了「一代宗師」。',{悟:1,人:3,金:4,exp:25}),
    k:R('書銷量不錯，也有人批評，但你已問心無愧。',{人:2,金:2,exp:12}),
    f:R('書寫得過於艱澀，沒人看得懂，印了一批全當了廢紙。',{金:-2})}),
  O('只傳給入室弟子','careful',['人',12],{
    g:R('弟子們拿到書如獲至寶，其中幾個果然青出於藍。',{人:2,悟:1,exp:15}),
    k:R('書只在小範圍傳閱，但足以讓你欣慰。',{人:1,exp:8}),
    f:R('你的弟子裡有人心術不正，把書偷偷賣了。',{人:-1,金:-1})}),
  O('邊寫邊修，借寫書悟道','bold',['心',13],{
    g:R('寫到一半，你忽然豁然開朗，連寫了三天三夜，竟在紙上悟出了新境界。',{心:2,悟:2,exp:30}),
    k:R('書寫完了，你的心境也穩固了不少。',{心:1,exp:15}),
    f:R('寫著寫著，你被自己的觀點困住了，一時走不出來。',{心:-1})}),
  O('算了，這些東西寫了也沒人看','timid',null,R('你把紙放進抽屜，再也沒有打開過。',{}))
]},
{id:'f_orphan2',t:'乞丐幫的暗號',fm:['orphan'],fl:['beggar'],a:[16,80],rm:[0,3],w:6,text:'街上一個陌生乞丐湊過來，用你熟悉的暗號敲了敲碗：「老幫主說，你可以來了。」你這才知道，當年那位老乞丐，竟是丐幫的幫主。',o:[
  O('赴約，聽聽他怎麼說','careful',['人',10],{
    g:R('老幫主把一枚舊竹牌放進你手裡：「從今天起，你在街上，就沒人敢動你。」',{人:3,體:1,exp:8},{flag:'beggar2'}),
    k:R('老幫主給了你一個座位和一碗熱湯，說：「慢慢來。」',{人:1,exp:4},{flag:'beggar2'}),
    f:R('丐幫的幾個小頭目不服你，把你圍在巷子裡，考驗了你一番。',{體:-1,人:1},{flag:'beggar2'})}),
  O('試探他的底細','diligent',['悟',11],{
    g:R('你看出他每一個動作都暗藏章法——這根本是個隱世高人。你當場拜師。',{悟:1,exp:12},{flag:'beggar2'}),
    k:R('你看出他確實不簡單，但沒敢多問。',{exp:5},{flag:'beggar2'}),
    f:R('他笑著說：「小子，別瞎猜。」你被噎了一臉。',{},{flag:'beggar2'})}),
  O('婉拒，不想再沾這種生活','timid',null,R('你說：「多謝，但我想靠自己走出去。」老幫主點點頭，沒有勉強。',{心:2}))
]},
{id:'f_orphan3',t:'碎玉的身世',fm:['orphan'],fl:['beggar2'],a:[40,3000],rm:[2,5],w:6,text:'丐幫幫主臨終前，留給你一塊刻著奇怪紋路的碎玉：「你的來歷，不簡單。」你摩挲著碎玉，隱約想起襁褓中的觸感。',o:[
  O('追查碎玉來歷','diligent',['悟',13],{
    g:R('碎玉來自一位隱世宗師，他當年為避災將襁褓中的你託付給了老幫主。你在他的墓前磕了三個頭，淚水止不住地流。',{心:2,悟:1,exp:20,金:2}),
    k:R('你查到碎玉出自一座已毀的古宗，線索到此中斷，但你已覺得足夠。',{心:1,exp:10}),
    f:R('線索全斷了，你有點失落。',{心:-1})}),
  O('請丐幫的兄弟幫忙打聽','careful',['人',12],{
    g:R('丐幫弟兄遍布天下，一個月後，你得到了確切的消息：你的生身之處，是一座名為「清河」的小鎮。',{人:3,exp:12}),
    k:R('兄弟們給了你一些零碎的消息。',{人:1}),
    f:R('消息傳來傳去，傳出了十幾個不同版本。',{})}),
  O('不追了，向前看','bold',['心',11],{
    g:R('你把碎玉掛在胸前：「過去是誰，不重要。重要的是，我現在是誰。」',{心:3}),
    k:R('你把碎玉收進懷裡，不再多想。',{心:1}),
    f:R('你嘴上說放下，夜裡卻睡不著。',{心:-1})}),
  O('把碎玉當了換靈石','timid',null,R('碎玉賣了三百靈石。你對自己說：身世不能當飯吃。',{金:3,心:-1}))
]},
{id:'f_cadet2',t:'嫡系的刁難',fm:['cadet'],a:[16,90],rm:[0,3],w:6,text:'嫡系的大少爺在族中聚會上，故意把一杯茶潑在你衣服上，笑著說：「旁支的人，就該習慣被潑。」滿堂寂靜，所有人都在等你的反應。',o:[
  O('當場回敬，不吃這一套','bold',['心',11],{
    g:R('你端起茶杯，慢條斯理地澆在了他頭上：「旁支的人，也該習慣還手。」全場倒吸一口涼氣，隨後有人悄悄笑出了聲。',{心:2,人:1}),
    k:R('你冷冷回了一句，沒讓對方占便宜。',{心:1}),
    f:R('你剛出手，就被族老喝止，反被罰了一頓。',{人:-1,體:-1})}),
  O('一笑置之，不動聲色','careful',['心',11],{
    g:R('你擦了擦衣服，笑著說：「茶不錯。」大少爺自討沒趣，其他人看你的眼神多了幾分敬意。',{心:2,人:2}),
    k:R('你忍下這口氣，事情不了了之。',{心:1}),
    f:R('你憋著氣回屋，一夜沒睡好。',{心:-1})}),
  O('暗中蒐集他的把柄','diligent',['人',12],{
    g:R('你查到嫡系少爺私下的幾件醜事，沒聲張，只是留著。從此他對你客氣了許多。',{人:2,金:2,exp:6}),
    k:R('你查到一些蛛絲馬跡，暫時沒有動手。',{人:1}),
    f:R('你的動作被察覺，反而被他抓了把柄。',{人:-2})}),
  O('低頭離席','timid',null,R('你默默離開了聚會，背後傳來一陣哄笑。你告訴自己：忍，是為了以後。',{心:1,人:-1}))
]},
{id:'f_cadet3',t:'家族大難',fm:['cadet'],a:[70,3000],rm:[3,6],w:6,text:'家族遭遇死對頭偷襲，主脈傷亡慘重，連族長都身受重傷。曾經看不起你的嫡系們，此刻都紅著眼睛看著你：「旁支的……這次，只有你能幫我們了。」',o:[
  O('義無反顧，率先迎敵','bold',['體',15],{
    g:R('你一人一劍，連殺三名敵將，守住了祖宅。從此族中無人再敢叫你「旁支」。',{體:2,人:4,exp:35}),
    k:R('你守住了大門，雖然負傷，卻贏得了所有人的敬重。',{體:-1,人:3,exp:18}),
    f:R('你拚盡全力，仍沒能守住整個家族，但你救出了幾個孩子。',{體:-2,人:2}),
    b:R('敵人的首領是一位金丹後期的老怪。',{},{die:'為守護家族戰死，族譜上，你的名字終於寫在了主脈那一頁'})}),
  O('運籌帷幄，聯絡外援','careful',['人',14],{
    g:R('你把這些年攢下的人脈全拿了出來，一夜之間，十幾位盟友趕來支援。家族轉危為安。',{人:4,exp:25}),
    k:R('你請來幾位援手，雖不能完全扭轉，但足以穩住局面。',{人:2,exp:12}),
    f:R('你的求援信，大多石沉大海。',{人:-1})}),
  O('帶走族中孩子與典籍，另立根基','diligent',['悟',14],{
    g:R('你當機立斷，帶著幾十個孩子和全部典籍，連夜轉移。多年後，新的家族在另一座山上興旺起來。',{人:3,悟:1,exp:30}),
    k:R('你護住了一部分孩子和典籍，家族元氣大傷，但延續下來了。',{人:2,exp:15}),
    f:R('轉移的路上遭遇追殺，損失慘重。',{人:-1,體:-1})}),
  O('袖手旁觀，這與我無關','timid',null,R('你站在遠處，看著祖宅燃燒。很多年後，你仍會夢見那一夜的火光。',{心:-3,人:-3}))
]},
{id:'f_official2',t:'朝堂風雲',fm:['official'],a:[40,3000],rm:[2,5],w:6,text:'朝中兩位大臣爭權，各自派人來拉攏你：「你是官宦之家出身，又有修為在身，不如站在咱們這邊。」兩邊的許諾都很誘人，兩邊的威脅也都很真實。',o:[
  O('左右逢源，兩邊都不得罪','careful',['人',13],{
    g:R('你一邊收了左相的禮，一邊給右相送了信，兩邊都以為你是自己人。多年後，勝出的那一方送了你一份厚禮。',{人:3,金:5,exp:12}),
    k:R('你勉強維持了平衡，兩邊都對你客客氣氣。',{人:1,金:2}),
    f:R('你的手段被識破，兩邊都不信任你了。',{人:-2})}),
  O('選定一方，全力相助','bold',['心',13],{
    g:R('你押對了寶，你支持的那一方大獲全勝，你成了新朝堂的座上賓。',{人:3,金:6,exp:15}),
    k:R('你支持的一方勉強贏了，你得了些好處。',{人:1,金:3}),
    f:R('你押錯了寶，被對方清算，損失慘重。',{人:-2,金:-4})}),
  O('拒絕捲入，專心修煉','diligent',['心',12],{
    g:R('你以修行為由婉拒，反而讓兩邊都高看了你一眼。',{心:2,exp:15}),
    k:R('你躲開了麻煩，雖有些得罪人，但清靜自在。',{心:1,exp:8}),
    f:R('兩邊都覺得你不識抬舉，暗中使了點絆子。',{人:-1})}),
  O('偷偷離開皇都','timid',null,R('你連夜出城，朝堂的紛爭，從此與你無關。',{心:1}))
]},
{id:'f_official3',t:'告老還鄉',fm:['official'],a:[90,3000],rm:[3,6],w:6,text:'你的祖父，那位當了一輩子知縣的老人，終於要告老還鄉了。他在信裡說：「孫兒，我這一輩子，沒見過仙人。聽說你成了……能不能，讓祖父開開眼？」',o:[
  O('帶祖父遊歷一回，讓他親眼看看','careful',['人',12],{
    g:R('你帶著祖父御劍飛過雲海。老人家抓著你的袖子，眼眶紅了：「值了，這輩子值了。」',{心:2,人:2}),
    k:R('你帶祖父見識了幾處靈山，老人家連連點頭。',{心:1,人:1}),
    f:R('老人家被風吹得頭暈，吐了一路，卻還是笑著說「好」。',{心:1})}),
  O('贈他一顆延壽丹','diligent',['悟',11],{
    g:R('你用多年積累的藥材為他煉了一顆延壽丹。祖父多活了二十年，臨終前拉著你的手說：「好孩子。」',{心:2,悟:1,exp:10}),
    k:R('丹藥生效了，祖父多了幾年的壽命。',{心:1}),
    f:R('丹藥品質不夠，祖父只多撐了三個月。',{心:-1})},{cost:{金:3}}),
  O('只送一封信，不去見面','timid',null,R('你寫了一封很長的信，卻沒有寄出。很多年後，你才知道，祖父在老宅的書房裡，一直擺著你小時候的畫像。',{心:-2})),
  O('告訴他：修仙之人，不該牽掛紅塵','bold',['心',12],{
    g:R('祖父沉默良久，說：「你說得對。」然後他轉過身，去澆院子裡的花。你知道，他其實懂。',{心:3}),
    k:R('祖父點點頭：「也好。」',{心:1}),
    f:R('你的話傷了老人家的心，他再也沒提這件事。',{心:-2,人:-1})})
]},
{id:'f_temple2',t:'紙條上的筆跡',fm:['temple'],fl:['noteclue'],a:[40,3000],rm:[2,5],w:6,text:'你整理觀主的遺物時，發現了一本舊書，書頁間夾著一張似曾相識的紙。你把它與當年包著你的那張紙條放在一起——上面的筆跡，竟不是觀主的。',o:[
  O('循著筆跡去找寫字的人','diligent',['人',12],{
    g:R('你沿著筆跡的線索，找到了一位隱居山間的老婦人。她見到你，愣了很久，才說：「你……長這麼大了。」',{心:2,人:2,exp:12},{flag:'noteclue2'}),
    k:R('你找到了一位認得這筆跡的老者，但他只說了一句：「別再查了。」',{心:1},{flag:'noteclue2'}),
    f:R('線索在半路中斷了，筆跡的主人，已不知去向。',{心:-1},{flag:'noteclue2'})}),
  O('請觀中的老道士解讀','careful',['悟',11],{
    g:R('老道士看了一會兒，說：「這是一位女子的筆跡。她當年……很不得已。」你默默點了點頭。',{心:2,exp:8},{flag:'noteclue2'}),
    k:R('老道士只說了一句：「天機不可洩露。」',{心:1},{flag:'noteclue2'}),
    f:R('老道士顧左右而言他，什麼也沒說。',{},{flag:'noteclue2'})}),
  O('把紙放回去，不再追究','timid',null,R('你把紙夾回書裡，合上。有些答案，也許本來就不該知道。',{心:1}))
]},
{id:'f_temple3',t:'觀主的最後一課',fm:['temple'],fl:['noteclue2'],a:[80,3000],rm:[3,6],w:6,text:'你重回那座小道觀，在觀主的舊蒲團前坐了一夜。天亮時，你忽然明白了他當年寫下那張紙條時的心情——不是遺棄，而是託付。',o:[
  O('在蒲團前靜坐，悟他的道','careful',['心',13],{
    g:R('你在蒲團上坐了七天。第七天清晨，一縷清氣從蒲團裡升起，融入你的身體——那是觀主留下的最後一課。',{心:3,悟:1,exp:30}),
    k:R('你坐了三天，心裡的結，散了大半。',{心:2,exp:15}),
    f:R('你坐不住，匆匆離開。',{心:-1})}),
  O('重修道觀，讓它延續下去','diligent',['人',12],{
    g:R('你拿出多年積蓄，把道觀重新修葺一新。很快，山下的人家開始送孩子來學藝。觀裡又有了朗朗書聲。',{人:3,金:-3,心:2,exp:15}),
    k:R('道觀被修好了一半，剩下的，你打算慢慢來。',{人:1,心:1}),
    f:R('資金不夠，修了一半就停工了。',{金:-2})}),
  O('把紙條供在觀主靈前，然後離開','bold',null,R('你把紙條供在靈前，磕了三個頭：「謝謝您。」然後轉身下山，沒有回頭。',{心:2})),
  O('不回去了','timid',null,R('你站在山腳，抬頭看了看那座小道觀，終究沒有上去。',{心:-1}))
]},
// =============== 出生地專屬（續） ===============
{id:'p_town2',t:'鎮上的瘟疫',pl:['town'],a:[16,80],rm:[0,3],w:6,text:'青石鎮來了一場怪病，染病的人渾身發冷、不言不語。鎮上的大夫束手無策，鄰居們一個個倒下。你聽說，病因似乎和後山的一口老井有關。',o:[
  O('冒險去後山查那口井','bold',['體',11],{
    g:R('你在井底發現一具被邪氣浸染的屍骸，毀掉它後，瘟疫果然消散。鎮上為你立了一塊碑。',{體:1,人:3,exp:10}),
    k:R('你找到了一點線索，鎮上的病情緩和了。',{人:1,exp:5}),
    f:R('你被井中的寒氣侵入，病倒了一個月。',{體:-2}),
    b:R('井底的東西，比你想的更邪。',{},{die:'死在了後山那口老井旁，鎮上的瘟疫，三個月後才散'})}),
  O('配藥救治鎮上的病人','diligent',['悟',11],{
    g:R('你日夜研究，配出了解藥，救了鎮上近百人。從此鎮上人見了你，都客客氣氣叫你「小神醫」。',{悟:1,人:3,exp:8}),
    k:R('你配出了緩解的方子，救了不少人。',{人:2}),
    f:R('藥方不對，反而加重了幾個人的病情。',{人:-1,心:-1})}),
  O('組織鄉親隔離，統一送水送飯','careful',['人',11],{
    g:R('你把鎮上的人分成幾區，各有負責的人。疫情被牢牢控制住，沒有擴散。',{人:3,exp:6}),
    k:R('隔離基本成功，但仍有零星病例。',{人:1}),
    f:R('有人偷偷跑出隔離區，疫情擴散。',{人:-1})}),
  O('帶著家當離開青石鎮','timid',null,R('你背起包袱連夜離開。多年後，你聽說青石鎮還在，但你再也沒回去過。',{心:-1}))
]},
{id:'p_town3',t:'回鄉',pl:['town'],a:[70,3000],rm:[3,6],w:6,text:'你已經很多年沒回過青石鎮了。這次路過，鎮口的老槐樹還在，只是賣包子的老闆換成了他的孫子。街角一個小孩好奇地看著你：「叔叔（阿姨），你是仙人嗎？」',o:[
  O('蹲下來，陪他聊聊','careful',['人',10],{
    g:R('你和小孩聊了一下午。他說他長大也想當仙人。你送了他一枚護身符。多年後，他真的來找你了。',{人:2,心:2,exp:8}),
    k:R('你們聊了幾句，他笑得很開心。',{心:1}),
    f:R('小孩被你身上的靈壓嚇哭了，旁人警惕地把他抱走。',{心:-1})}),
  O('去老包子鋪坐一坐','diligent',['心',10],{
    g:R('你吃了一籠包子，味道和幾十年前一樣。你坐了很久，忽然覺得，心裡有什麼東西鬆了。',{心:3,exp:15}),
    k:R('包子味道變了，但你吃得很香。',{心:1}),
    f:R('包子鋪早已關門，你站在門口，站了很久。',{心:-1})}),
  O('為鎮上留下一座護鎮陣法','bold',['悟',13],{
    g:R('你花了三天，在鎮口布下一座小型護陣。從此，青石鎮的瘟疫、妖獸，再也沒有踏進來過。',{悟:1,人:3,exp:20}),
    k:R('陣法起效了，但威力有限。',{人:1,exp:8}),
    f:R('陣法布到一半，靈氣不夠，只好作罷。',{})}),
  O('悄悄看一眼，轉身離開','timid',null,R('你站在鎮口的老槐樹下，看了很久。然後轉身離去，什麼也沒留下。',{心:1}))
]},
{id:'p_mount2',t:'落霞山的妖王',pl:['mount'],a:[60,3000],rm:[3,5],w:6,text:'一頭新晉的妖王看中了落霞山，打算把整座山脈改成牠的後花園。山下的村民、你的洞府，全都在牠的規劃圖上。',o:[
  O('單挑妖王','bold',['體',15],{
    g:R('一戰三天，你以一招取勝，妖王臣服，成了你的護山靈獸。落霞山從此太平。',{體:2,exp:35,人:2}),
    k:R('雙方打成平手，妖王退走，答應不再侵擾。',{體:-1,exp:18}),
    f:R('你被妖王一爪拍進山壁，養了三個月傷。',{體:-3}),
    b:R('妖王的實力超出了你的判斷。',{},{die:'死在落霞山的山巔，連洞府都被妖王占了'})}),
  O('聯合群修，共同圍剿','careful',['人',14],{
    g:R('你聯絡了方圓百里的修士，布下天羅地網。妖王被生擒，你分到了最大的一份戰利品。',{人:3,金:5,exp:20}),
    k:R('圍剿成功，但各有損傷，你分到一小份。',{人:1,金:2,exp:10}),
    f:R('同盟內部有人洩密，圍剿失敗。',{人:-2,金:-2})}),
  O('布下大陣，封山避世','diligent',['悟',15],{
    g:R('你把整座山封印起來，妖王被擋在陣外，山中靈氣更加濃郁。',{悟:2,exp:30}),
    k:R('大陣暫時封住了山脈，但只能撐一陣子。',{exp:12}),
    f:R('大陣被妖王一爪擊碎，你狼狽逃離。',{體:-1,exp:-5})}),
  O('帶著村民撤離，讓出落霞山','timid',null,R('你把山下的村民送到安全的地方。回頭望去，落霞山已成了妖王的領地。',{人:2,心:-1}))
]},
{id:'p_mount3',t:'山中隱者',pl:['mount'],a:[16,300],rm:[1,4],w:6,text:'你在山路上遇見一位坐在石頭上打盹的老人。他睜開一隻眼，看了你一眼：「小子，你背上的柴，比你的命還重。」你一低頭，才發現自己背著三捆乾柴。',o:[
  O('恭敬行禮，向老人請教','careful',['心',11],{
    g:R('老人點點頭：「有點意思。」他隨手在地上畫了一個圈，你看了半個時辰，忽然悟了一個道理。',{心:2,悟:1,exp:15}),
    k:R('老人隨口說了句偈語，你記在心裡，之後常拿出來想一想。',{心:1,exp:6}),
    f:R('老人閉上了眼睛：「還沒到時候。」',{})}),
  O('把背上的柴放下，陪他坐一會兒','diligent',['悟',11],{
    g:R('你在老人旁邊坐了一下午，什麼也沒說。夕陽下，你體會到一種說不出來的安寧。',{悟:2,心:1,exp:12}),
    k:R('你陪他坐了一會兒，什麼收穫也沒有，卻覺得很舒服。',{心:1}),
    f:R('你坐得腿麻，心思亂飄。',{})}),
  O('向他請教修行秘訣','bold',['人',11],{
    g:R('老人笑了：「小子夠直接。」他傳了你一套山中隱士的吐納口訣。',{體:1,exp:12,人:1}),
    k:R('老人說：「修行哪有什麼秘訣，多吃飯多睡覺。」你想了想，居然有點道理。',{體:1}),
    f:R('老人皺眉：「年輕人不要太急。」',{})}),
  O('背著柴繼續趕路','timid',null,R('你點點頭，繼續走。走了很遠，才想起來——那老人說的，好像不是柴。',{心:1}))
]},
{id:'p_sect2',t:'山門試煉',pl:['sect'],a:[16,60],rm:[0,2],w:6,text:'天衍宗一年一度的山門試煉開始了，凡人也可以參加。山腳下擠滿了人，你在人群裡看見了好幾張熟面孔——據說今年的獎勵是一枚築基丹。',o:[
  O('全力闖關','bold',['體',11],{
    g:R('你一路過關斬將，奪得第一，築基丹到手。',{體:1,exp:20,人:2},{flag:'pillZhuji'}),
    k:R('你闖到了第三關，拿到了一份安慰獎。',{exp:8,金:2}),
    f:R('你在第二關被淘汰，鼻青臉腫地爬下山。',{體:-1})}),
  O('觀察前面人的失敗，總結經驗','diligent',['悟',11],{
    g:R('你看了一整天，把每一關的規律都摸透了，最後輕輕鬆鬆拿下築基丹。',{悟:2,exp:20},{flag:'pillZhuji'}),
    k:R('你雖然沒奪冠，但闖到了不錯的名次。',{exp:10}),
    f:R('你想得太多，結果輪到你時，已經沒機會了。',{})}),
  O('結交其他參賽者，組隊闖關','careful',['人',11],{
    g:R('你和幾位參賽者結成隊伍，互相扶持，最終共同通關，你還交了幾個朋友。',{人:3,exp:12}),
    k:R('隊伍中有人掉隊，但你們還是完成了試煉。',{人:1,exp:6}),
    f:R('隊友內鬥，你們全部被淘汰。',{人:-1})}),
  O('只在山腳下看熱鬧','timid',null,R('你在山腳下啃著烤紅薯，看了一整天的熱鬧。這也是一種收穫。',{心:1}))
]},
{id:'p_sect3',t:'宗門高層的邀請',pl:['sect'],nf:['inSect','sxFall'],a:[60,3000],rm:[3,5],w:6,text:'一名天衍宗的長老親自找到你：「聽說你在山腳修行多年，修為也很可觀。宗門正在招攬客卿，不知你有沒有興趣？」你知道，這不是個簡單的邀請。',o:[
  O('欣然接受，成為宗門客卿','careful',['人',13],{
    g:R('你以客卿身份入了宗門，不受宗規束縛，卻享有資源。你成了山腳下的一個傳說。',{人:3,金:5,exp:15},{flag:['inSect','guest']}),
    k:R('你接受了邀請，但被安排在邊緣位置。',{人:1,金:2},{flag:['inSect','guest']}),
    f:R('長老發現你的資質不如傳聞，態度冷淡了許多。',{人:-1})}),
  O('開條件：不入宗門，只做合作','diligent',['悟',14],{
    g:R('你提出以「合作」代替「從屬」，長老居然答應了。你既有資源，又保有自由。',{悟:1,人:2,金:4,exp:15}),
    k:R('長老勉強同意，條件比你預期的低一點。',{金:2,人:1}),
    f:R('長老認為你不識抬舉，轉身離開。',{人:-1})}),
  O('婉拒，繼續做山腳的散修','timid',null,R('你說：「多謝抬愛，但我還是想自由一點。」長老點了點頭：「各人有各人的路。」',{心:1})),
  O('借機打聽宗門內部的情報','bold',['人',12],{
    g:R('你從長老的言談中，探到了宗門的幾個大秘密。這些情報，日後定能派上用場。',{人:2,exp:15,金:3}),
    k:R('你探到一些不痛不癢的消息。',{人:1}),
    f:R('你被長老看穿，對方的笑容不太對勁。',{人:-1})})
]},
{id:'p_market2',t:'坊市大騙局',pl:['market'],a:[16,80],rm:[0,3],w:6,text:'一個衣著光鮮的商人在坊市裡到處宣揚：「十塊靈石，換一百塊！三天後本金奉還，利潤翻十倍！」圍觀的人擠了個水洩不通，有人已經把家底掏了出來。你覺得，這事不對勁。',o:[
  O('投一點試試水','bold',['金',9],{
    g:R('三天後，你的靈石真的翻了十倍！你剛想加碼，商人人間蒸發了——不過你賺了。',{金:6}),
    k:R('你拿回了本金，賺了一點，及時收手。',{金:2}),
    f:R('商人跑路，你血本無歸。',{金:-3})},{cost:{金:2}}),
  O('暗中調查商人的底細','diligent',['悟',11],{
    g:R('你查出這個人是個慣犯，立刻通知了巡城衛。他當場被抓，你還得了一筆賞金。',{金:4,人:2,exp:6}),
    k:R('你查到一些線索，但沒敢輕舉妄動。',{exp:4}),
    f:R('你被商人的手下盯上，丟了錢袋。',{金:-2})}),
  O('勸身邊的人不要上當','careful',['人',11],{
    g:R('你當眾揭穿騙局，大家紛紛收回錢，商人灰溜溜地逃走了。',{人:3,心:1}),
    k:R('有些人聽了你的勸，有些人沒聽。',{人:1}),
    f:R('商人說你是同行嫉妒，周圍的人把你轟了出去。',{人:-2})}),
  O('冷眼旁觀','timid',null,R('你抱著手站在人群外。三天後，商人果然捲款跑路，圍觀者哭成一片。你默默為自己的直覺乾杯。',{心:1}))
]},
{id:'p_market3',t:'商會的邀請',pl:['market'],a:[70,3000],rm:[3,6],w:6,text:'浮雲坊市最大的商會「天衡行」派人遞來燙金請柬：「閣下名聲遠播，本行願以長老之位相邀，共謀大業。」你看著請柬，心想：這到底是機緣，還是陷阱？',o:[
  O('赴宴，當面談條件','careful',['人',13],{
    g:R('你在宴席上侃侃而談，三言兩語，把原本的條件改成了對你更有利的版本。你成了天衡行的「名譽長老」。',{人:3,金:6,exp:15}),
    k:R('你拿到了一個不錯的位置，只是條件沒有想像中優厚。',{人:2,金:3}),
    f:R('宴席上暗流湧動，你喝了幾杯就覺得不對勁，及時離席。',{體:-1})}),
  O('先查商會的底細','diligent',['悟',14],{
    g:R('你查出天衡行背後有一股隱藏的勢力，及時避開了陷阱，還順手撿到了一條有價值的情報。',{悟:1,金:4,exp:20}),
    k:R('你查到一些線索，決定暫時觀望。',{exp:8}),
    f:R('你查來查去，只查到商會有很多錢。',{})}),
  O('接受長老之位，掌管一部分生意','bold',['人',14],{
    g:R('你接手生意後迅速整頓，三年便翻了一倍。你在坊市的地位，今非昔比。',{金:10,人:3,exp:12}),
    k:R('你接手了生意，勉強維持，利潤不高。',{金:4,人:1}),
    f:R('你接手的是個爛攤子，賠了不少。',{金:-4,人:-1})}),
  O('婉拒，不涉商事','timid',null,R('你把請柬退了回去。事後，你聽說天衡行當年的另一位被邀者，被捲入了一場大官司。',{心:1}))
]},
{id:'p_wild2',t:'瘴林部落',pl:['wild'],a:[16,100],rm:[0,3],w:6,text:'你在瘴林深處，意外闖入一個隱秘的部落。他們的人皮膚黝黑，眼神警惕，圍著你喃喃自語。其中一位頭戴羽冠的老者站了出來：「外來人，你為什麼闖我族的聖地？」',o:[
  O('誠懇道歉，說明來意','careful',['人',11],{
    g:R('老者聽完，緩緩點頭：「你很坦誠。」部落收留了你一晚，還教你辨別瘴林的毒花。',{人:2,體:1,exp:10}),
    k:R('部落沒有為難你，但讓你天亮前離開。',{人:1}),
    f:R('老者揮手，兩個壯漢把你扔出了聖地。',{人:-1,體:-1})}),
  O('展示修為，震懾部落','bold',['體',12],{
    g:R('你一掌拍碎旁邊的巨石，部落眾人倒吸涼氣，老者低頭：「大人，請。」你成了他們的座上賓。',{體:1,人:1,exp:10,金:2}),
    k:R('你的實力讓他們不敢動手，但也成了他們的眼中釘。',{體:1}),
    f:R('你的威懾沒起作用，被他們用毒箭射中。',{體:-2}),
    b:R('部落的毒，比你想像的更烈。',{},{die:'中了部落的毒箭，死在瘴林深處，無人知曉'})}),
  O('向老者請教部落的修煉之法','diligent',['悟',12],{
    g:R('老者看了你很久，點頭：「你的悟性不錯，我可以教你一招『血脈祭』。」',{悟:2,體:1,exp:20}),
    k:R('老者教了你一個小訣竅，但沒有深入。',{exp:8}),
    f:R('老者說：「這是我族的秘傳，外人不得學。」',{})}),
  O('悄悄後退，原路返回','timid',null,R('你小心翼翼地後退，退出了部落的視線。後來你每想起這件事，都覺得自己錯過了什麼。',{心:1}))
]},
{id:'p_wild3',t:'南荒古祭壇',pl:['wild'],a:[80,3000],rm:[3,6],w:6,text:'瘴林深處，一座巨大的古祭壇從密林中顯露出來。祭壇上刻著無數你看不懂的符號，其中有一部分，與你曾見過的某種陣法暗合。祭壇中央，似乎在等待什麼。',o:[
  O('登上祭壇，嘗試溝通','bold',['心',15],{
    g:R('你站在祭壇中央，閉上眼睛。無數古老的聲音湧入你的識海，你聽見了遠古的歌謠，也看見了一段被遺忘的歷史。',{心:2,悟:2,exp:35}),
    k:R('你與祭壇建立了一絲聯繫，獲得了零星的感悟。',{心:1,exp:18}),
    f:R('祭壇的力量太過強大，你被震出老遠。',{體:-2,心:-1}),
    b:R('祭壇的古老意志，並不歡迎外來者。',{},{die:'死在南荒古祭壇之上，成為了祭壇的又一道刻痕'})}),
  O('研究符號，推演陣法','diligent',['悟',15],{
    g:R('你花了七天七夜，把祭壇的符號解讀了大半。你推演出一套全新的陣法。',{悟:2,exp:35}),
    k:R('你解讀了一部分，已大有收穫。',{悟:1,exp:18}),
    f:R('符號太過古怪，你看得頭痛欲裂。',{心:-1})}),
  O('拓印符號，帶回宗門','careful',['人',13],{
    g:R('你把拓印的符號帶給了某位陣法大師，換來一份重禮與一個人情。',{人:3,金:5,exp:12}),
    k:R('拓印被交給了宗門，你得了些獎勵。',{金:3}),
    f:R('拓印時觸動了祭壇的禁制，你狼狽逃出。',{體:-1})}),
  O('敬畏之餘，默默離開','timid',null,R('你對祭壇鞠了一躬，轉身離開。身後的林中，似乎有什麼東西，輕輕嘆了口氣。',{心:1}))
]},
{id:'p_capital2',t:'皇室的招攬',pl:['capital'],a:[30,300],rm:[1,4],w:6,text:'宮裡來了人，客客氣氣地遞給你一道聖旨：「陛下聽聞閣下修為不凡，願封你為『護國仙師』，享一品俸祿。」你看著聖旨上龍飛鳳舞的字，不知該喜還是該憂。',o:[
  O('接旨，入宮為仙師','careful',['人',12],{
    g:R('你入宮後，很快得到了皇帝的信任，一品俸祿、皇家藏書任你取用。',{人:3,金:5,exp:15}),
    k:R('你成了護國仙師，但行動處處受限。',{人:1,金:3}),
    f:R('宮廷風雲詭譎，你剛入宮就捲入一場明爭暗鬥。',{人:-1,金:-1})}),
  O('要求平等相待，不受約束','bold',['心',12],{
    g:R('你一句「不為臣，只為客」，反而讓皇帝敬重，答應給你自由出入皇宮的特權。',{心:2,人:2,金:3}),
    k:R('皇帝勉強答應，但臉色不太好看。',{心:1}),
    f:R('皇帝勃然大怒，你被趕出了皇都。',{人:-2,金:-2})}),
  O('接受，但要求查閱皇家藏書','diligent',['悟',12],{
    g:R('皇家藏書閣裡，有一整層的修煉秘籍。你在宮中三年，把它讀了個遍。',{悟:2,exp:25}),
    k:R('你讀了一部分藏書，已受益匪淺。',{悟:1,exp:12}),
    f:R('藏書閣的守衛極嚴，你只讀了幾本不重要的。',{exp:4})}),
  O('婉拒，離開皇都','timid',null,R('你以「閒雲野鶴」為由婉拒，連夜出城。皇城裡的人還在議論這件事。',{心:1}))
]},
{id:'p_capital3',t:'改朝換代',pl:['capital'],a:[90,3000],rm:[3,6],w:6,text:'皇都的龍氣忽然劇烈波動。你推演天機，發現這個王朝的氣數，即將走到盡頭。已經有人在暗中串聯，準備改朝換代。各方勢力都在觀望，也都在尋找像你這樣的人。',o:[
  O('扶持新朝，成為開國功臣','bold',['人',14],{
    g:R('你選對了人，新朝建立後，你被封為「國師」，享無上尊榮。',{人:4,金:8,exp:25}),
    k:R('新朝建立，你得了些好處，但也捲入了不少是非。',{人:2,金:4,exp:12}),
    f:R('你選錯了人，被舊朝殘黨追殺。',{人:-2,體:-2}),
    b:R('你支持的那一方被徹底擊潰。',{},{die:'在改朝換代的混亂中，被亂軍所殺'})}),
  O('暗中觀察，伺機而動','diligent',['悟',14],{
    g:R('你精準判斷了局勢，在最關鍵的時刻出手，立下首功。',{悟:1,人:3,金:5,exp:25}),
    k:R('你保持中立，躲過了亂世，順便收集了些有用的情報。',{exp:12}),
    f:R('你觀察得太久，錯過了最好的時機。',{})}),
  O('勸皇帝體面退位，避免生靈塗炭','careful',['心',14],{
    g:R('你一番話說動了皇帝，王朝和平過渡，萬民感念你的恩德。',{心:3,人:3,exp:30}),
    k:R('皇帝猶豫不決，但最終減少了流血。',{心:1,人:1,exp:12}),
    f:R('皇帝大怒，下令通緝你。',{人:-2})}),
  O('帶著親近的人，離開皇都','timid',null,R('你選擇離開。多年後，你聽說新朝建立了。那座皇都，已經不再是你熟悉的樣子。',{心:-1}))
]},
{id:'e_pill',t:'丹房的人情',a:[16,60],rm:[0,1],nf:['pillZhuji'],w:2,text:'坊市丹房的老闆正愁著一爐丹藥賣不出去，其中有一枚築基丹，品相還不錯。「道友，要不要來點？」他搓著手，笑得像在賣保險。',o:[
  O('砍價，寸步不讓','bold',['人',10],{
    g:R('你砍得老闆直捂胸口，最後以一個友情價成交。「築基丹到手，賺到了。」',{人:1},{flag:'pillZhuji'}),
    k:R('折騰半天，勉強拿下，雖然荷包瘦了一圈。',{金:-2},{flag:'pillZhuji'}),
    f:R('老闆咬死不降價，你空手而回。',{})}),
  O('幫老闆處理他的麻煩事，抵作丹錢','careful',['人',9],{
    g:R('你替老闆擺平了一樁糾紛，他拍著胸脯把築基丹塞到你手裡：「這情，我記下了。」',{人:2},{flag:'pillZhuji'}),
    k:R('忙了兩天，老闆給了你那枚築基丹。',{},{flag:'pillZhuji'}),
    f:R('越幫越忙，老闆氣得把你趕了出去。',{人:-1})}),
  O('直接花錢買','diligent',null,R('你數了數靈石，把築基丹買了下來。',{金:-3},{flag:'pillZhuji'}),{cost:{金:3}}),
  O('沒錢，逛逛就走','timid',null,R('你在丹房門口看了半個時辰，最後空著手離開。',{心:1}))
]},
{id:'e_tianmo',t:'天魔入侵',a:[200,5000],rm:[6,6],nf:['tianmoDone'],w:30,text:'天穹裂開一道猙獰的豁口，無邊魔氣傾瀉而下。天魔之主的聲音響徹九州：「此界靈氣，本座要了。」仙界使者傳來急訊：整個修仙界的存亡，繫於渡劫期修士之手。你，恰好是目前站在這條線上的人。這不是演習，也不會有重來鍵。',o:[
  O('衝上九天，與天魔之主正面決戰','bold',['體',22],{
    g:R('你一拳轟碎魔主的本體，天魔潰逃，豁口在你身後緩緩合攏。九州萬民仰頭，只看見一道比朝陽還亮的背影。這一戰，足以寫進天地的史書。',{體:3,心:2,人:3,金:5,exp:120},{flag:['tianmoDone','tianmoWin']}),
    k:R('你與天魔之主大戰七天七夜，終於將它逼回魔界，豁口勉強封上。你渾身是傷，但活了下來，世界也還在。',{體:1,心:1,人:2,金:3,exp:80},{flag:['tianmoDone','tianmoWin']}),
    f:R('天魔之主的實力遠超想像，你的一擊被它隨手捏碎。魔氣淹沒了九州，修仙界在一夜之間，成了魔界的後花園。',{},{end:'worldend'}),
    b:R('你衝得太快，也敗得太快。魔氣吞沒了一切，包括你。',{},{end:'worldend'})}),
  O('以畢生所學布下封界大陣','diligent',['悟',23],{
    g:R('你以自身為陣眼，布下前所未有的封界大陣，將豁口牢牢鎖死。連仙界使者都目瞪口呆：「這陣法……是你自己想的？」',{悟:3,心:2,人:2,金:5,exp:120},{flag:['tianmoDone','tianmoWin']}),
    k:R('大陣撐住了豁口，雖然搖搖欲墜，卻也等到了援軍。你耗盡心力，但世界保住了。',{悟:1,心:1,人:2,金:3,exp:80},{flag:['tianmoDone','tianmoWin']}),
    f:R('大陣在最後一刻出現一道裂紋，魔氣順著裂縫灌入。你眼睜睜看著結界崩潰，九州化為魔域。',{},{end:'worldend'}),
    b:R('大陣反噬，你的神魂與陣法一同崩碎，再沒人能阻止魔氣了。',{},{end:'worldend'})}),
  O('聯絡各方大能，結成聯軍共禦天魔','careful',['人',22],{
    g:R('你一道傳訊，仙盟、妖族、佛修、魔道，甚至那位退隱千年的老怪物全都來了。聯軍如潮，天魔之主被圍殺在豁口之前。史稱「九州會盟」。',{人:4,心:2,悟:1,金:6,exp:120},{flag:['tianmoDone','tianmoWin']}),
    k:R('聯軍來得不算整齊，但終究擋住了第一波魔潮。你居中調度，撐到了天魔退去。',{人:2,心:1,金:3,exp:80},{flag:['tianmoDone','tianmoWin']}),
    f:R('各方勢力互相猜忌，聯軍還沒成形就潰散了。你站在空蕩蕩的盟台上，聽見魔氣席捲而來的聲音。',{},{end:'worldend'}),
    b:R('有人在最關鍵的時刻臨陣倒戈。聯軍崩潰，魔氣一發不可收拾。',{},{end:'worldend'})}),
  O('潛入魔界，直取天魔本源','timid',['心',23],{
    g:R('你悄悄繞過魔潮，潛入魔界深處，一劍斬斷了天魔本源。豁口在魔氣失去源頭之後自行崩塌。沒人知道是誰做的，只有你知道。',{心:4,悟:2,體:1,金:5,exp:120},{flag:['tianmoDone','tianmoWin']}),
    k:R('你冒險摸到本源附近，重創了它。天魔大軍失去統帥，開始潰散。',{心:2,悟:1,金:3,exp:80},{flag:['tianmoDone','tianmoWin']}),
    f:R('你在魔界迷了路，等你終於找到本源時，外面的世界已經沒了。',{},{end:'worldend'}),
    b:R('魔界比你想像的更加詭異，你連本源的影子都沒摸到，就被魔氣同化。',{},{end:'worldend'})})
]},
{id:'e_hermit',t:'平淡的五年',a:[16,99999],rm:[0,6],rep:true,w:0.7,text:'風平浪靜的歲月，沒有奇遇，沒有仇家，沒有女主，只有你和你的蒲團。',o:[
  O('閉關苦修','diligent',['心',9],{
    g:R('你心無旁騖，修為突飛猛進。',{exp:14,悟:1}),
    k:R('穩穩當當地積累了一點。',{exp:8}),
    f:R('心浮氣躁，白坐了五年。',{exp:3})}),
  O('下山遊歷','bold',['體',9],{
    g:R('你在路上遇到幾位高人，獲益匪淺。',{exp:6,金:2,人:1}),
    k:R('平安無事，賺了點盤纏。',{exp:4,金:1}),
    f:R('遇上山賊，破財消災。',{金:-2})}),
  O('經營一點小生意','careful',['人',9],{
    g:R('生意興隆，數錢數到手軟。',{金:5}),
    k:R('小賺一筆。',{金:3}),
    f:R('虧了一點。',{金:-1})}),
  O('什麼都不做，睡五年','timid',null,R('醒來發現什麼事也沒發生，這就是最大的成功。',{體:1,心:1}))
]},

{id:'ec_jade',t:'奇怪的玉簡',earth:1,a:[16,99999],rm:[0,7],text:'你在一處廢墟裡撿到一枚玉簡。神識探入，裡面只有一行字：「恢復出廠設定？是／否」',o:[
  O('選「是」','bold',['悟',10],{
    g:R('玉簡爆出一道光，一幅星空圖浮現。其中一顆藍色的星球，讓你莫名熱淚盈眶。',{悟:1,心:1},{clue:1}),
    k:R('玉簡閃了閃，投影出一小段你完全看不懂、卻莫名熟悉的符號。',{},{clue:1}),
    f:R('玉簡灰飛煙滅，什麼也沒留下。你盯著掌心的灰，有點空。',{心:-1})}),
  O('先研究它的材質','diligent',['悟',12],{
    g:R('材質不是玉，是某種你說不上來的「塑膠」。你隱約想起了什麼。',{悟:1},{clue:1}),
    k:R('材質古怪，但你把紋路抄了下來。',{},{clue:1}),
    f:R('研究半天，只確定這東西很硬。',{})}),
  O('選「否」','careful',null,R('你不敢選。玉簡慢慢暗下去，最後一行字消失了。你有種錯過了什麼的預感。',{心:1})),
  O('丟回廢墟，轉身就走','timid',null,R('「這種來歷不明的東西，絕對有毒。」你說服自己。',{}))
]},
{id:'ec_phone',t:'破損的手機殘骸',earth:1,a:[16,99999],rm:[0,7],text:'你在一位已故前輩的洞府中，找到一塊黑色的玻璃板，背面有個被咬了一口的水果圖案。神識探入，竟感到一絲熟悉的……電量不足。',o:[
  O('嘗試喚醒','diligent',['悟',11],{
    g:R('你竟然點亮了螢幕！顯示「電量 1%」，然後它永遠熄滅了。但你看見了一張照片，是你熟悉的街角。',{心:1},{clue:1}),
    k:R('螢幕閃了一下，浮現出一串日期。那個日期，你認得。',{},{clue:1}),
    f:R('螢幕碎成蜘蛛網，什麼也看不到了。',{})}),
  O('帶回去供奉','careful',null,R('你把它擺在書案上，每天上香。三年後，你覺得心靜了很多。',{心:1})),
  O('賣給收藏家','careful',null,R('賣了五百靈石。收藏家說：「這可能是上古的某種『通訊法器』。」你笑了笑，心想：快了。',{金:5})),
  O('用力砸碎，眼不見為淨','bold',null,R('你把它砸成碎片。夜深人靜時，你有點後悔。',{心:-1}))
]},
{id:'ec_mural',t:'壁畫上的火鍋',earth:1,a:[16,99999],rm:[1,7],text:'古修士洞府的牆上有一幅壁畫：一群人圍著一口冒著紅油的大鍋，熱氣升騰，旁邊刻著八個字：「人生苦短，吃辣要緊」。',o:[
  O('臨摹壁畫','diligent',['悟',10],{
    g:R('你發現壁畫背景中隱約有一座城市天際線，是你熟悉的樣子。',{悟:1},{clue:1}),
    k:R('你臨摹下來，覺得這畫風特別像某種「現代插畫」。',{},{clue:1}),
    f:R('臨摹了半天，只畫出一鍋紅色的水。',{})}),
  O('研究那八個字','careful',['心',11],{
    g:R('你突然意識到，這八個字是用簡體字刻的。',{心:1},{clue:1}),
    k:R('字跡古怪，但你猜到了一部分意思。',{},{clue:1}),
    f:R('字太古怪，你什麼也沒看出來。',{})}),
  O('肚子餓了，先離開','timid',null,R('你默默走出洞府。肚子叫得比你的修為還響。',{體:-0}))
]},
{id:'ec_laoxiang',t:'老鄉見老鄉',earth:1,a:[16,99999],rm:[1,7],text:'坊市裡有個髒兮兮的老頭，擺著攤子賣「炸雞」。你湊近一聞，眼眶瞬間紅了。他抬頭看了你一眼，壓低聲音：「今天星期四，V我五十。」',o:[
  O('掏出五靈石：「V你，五十」','bold',null,R('老頭激動得老淚縱橫，拉著你說了一整夜的故事，最後給了你一個座標。',{人:1},{clue:1}),{cost:{金:3}}),
  O('試著對暗號','diligent',['悟',9],{
    g:R('「床前明月光」「疑是地上霜」——對上了！老頭抹著淚，交給你一張殘圖。',{悟:1},{clue:1}),
    k:R('老頭愣了半天，才確認你是「自己人」。',{},{clue:1}),
    f:R('老頭把你當成瘋子，轟了出去。',{人:-1})}),
  O('假裝不認識，走開','timid',null,R('三年後，聽說那老頭暴斃了，攤子裡的炸雞配方失傳。你心裡有點空。',{心:-1}))
]},
{id:'ec_array',t:'陣法殘卷',earth:1,a:[16,99999],rm:[2,7],text:'你在藏經閣最深處找到一卷殘破的陣法圖，名為《歸墟引》——圖上的星位，與你記憶中的某個星座奇妙重合。',o:[
  O('通宵研究','diligent',['悟',14],{
    g:R('你解出了陣眼的位置，那是一個你終生難忘的座標。',{悟:1},{clue:1}),
    k:R('解出一部分，足夠推測出大致方向。',{},{clue:1}),
    f:R('看得頭痛欲裂，錯過了午飯。',{})}),
  O('抄錄後上交宗門','careful',['人',12],{
    g:R('宗門獎勵了你一筆，同時你偷偷多抄了一份。',{金:4,人:1},{clue:1}),
    k:R('宗門讚賞你的覺悟，賞了一點靈石。',{金:2}),
    f:R('被管事盤問，說你「居心叵測」。',{人:-1})}),
  O('放回原處','timid',null,R('有些東西，看了會睡不著。你把它放回原處。',{}))
]},
{id:'ec_radio',t:'虛空裂縫的廣播',earth:1,a:[16,99999],rm:[3,7],text:'虛空亂流中傳來斷斷續續的聲音：「……這裡是……中央氣象台……明天……有……大風……」',o:[
  O('強行靠近裂縫','bold',['心',14],{
    g:R('你在亂流中站穩，聽清了完整的一段廣播。那個播報員的口音，你再熟悉不過。',{心:1},{clue:1}),
    k:R('你勉強聽清了半句話。',{},{clue:1}),
    f:R('被亂流撕扯，吐血飛退。',{體:-2}),
    b:R('裂縫比你想像的更不穩定。',{},{die:'被虛空亂流撕碎，連魂魄都沒留下'})}),
  O('以神識記錄頻率','diligent',['悟',15],{
    g:R('你記錄下頻率，並推演出裂縫另一端的方位。',{悟:1},{clue:1}),
    k:R('你記下了大致頻率。',{},{clue:1}),
    f:R('神識被攪成漿糊，頭疼了三年。',{悟:-1})}),
  O('遠離，不去管','careful',null,R('「這種聲音，聽多了容易想家。」你轉身離去。',{心:1}))
]},
{id:'ef_home',t:'歸途',cl:CLUE_NEED,rep:true,w:8,a:[16,99999],rm:[0,7],text:'線索拼合的那一刻，一個巨大的法陣輪廓在你腦海中浮現。只要有一處靈氣足夠的地方，一顆足夠堅定的心，你就能撕開通往藍星的那條路。',o:[
  O('全力啟動法陣','bold',['心',14],{
    g:R('法陣亮起，空間如水面般泛起漣漪。你踏入其中，眼前是熟悉的路燈與柏油馬路。',{},{goal:'earth'}),
    k:R('法陣勉強撐住，你硬生生擠過了那道縫。回過神來，已站在熟悉的街角。',{},{goal:'earth'}),

{id:'sx_2a',path:true,t:'拜師',a:[16,200],rm:[1,6],fl:['sx1','inner','inSect'],nf:['mSword','mAlch','mForm','mElder','mNone'],w:14,

  O('拜入陣峰，賭一把「話最少的天才」','careful',['心',11],{

  O('拿著紙條，去找藏經閣的老人','careful',null,R('老人放下掃帚，慢吞吞地說：「老夫收徒，一百年只收一個。你最合適——因為你不吵。」你這才發現，他腰間掛的，是歷任掌門才有的令牌。',{悟:2,心:1,exp:10},{flag:['sx2','mElder']}),
   {fl:['sxKeeper'],flr:'需要先得到藏經閣老人的賞識'})

{id:'sx_m_alch',path:true,t:'丹峰的規矩',a:[30,500],rm:[2,6],fl:['mAlch','inSect'],w:10,

  O('也學師父，坐著不動，一言不發','timid',null,R('你們師徒二人在山頂對坐了三天。三天後，峰主起身，拍了拍你的肩。你不確定自己學到了什麼，但心裡莫名安靜了許多。',{心:2,exp:6}))
]},

 text:'你拜了藏經閣的老人為師，才知道他是天衍宗上上任掌門，百年前為避禍隱於書架之間。他今天難得沒打瞌睡，把掃帚放在一旁，說：「我教你的第一課——什麼叫『藏拙』。」',o:[

  O('追問他當年為什麼要隱居','bold',['人',12],{
    g:R('老人沉默了很久，說起了一段陳年舊事：當年的宗門內亂，他是為了保全宗門而主動退位。你聽完，心裡沉甸甸的。',{人:1,心:1,exp:12}),
    k:R('老人只是笑：「不說，說了你就要擔責任。」',{心:1,exp:6}),
    f:R('老人臉色一沉：「你問的太多了。」你被罰掃了三個月的地。',{人:-1,exp:3})}),
  O('給他倒茶，不多問','careful',null,R('老人喝了一口茶，說：「你比大多數人都懂事。」他閉上眼，輕輕嘆了口氣，像是卸下了什麼東西。',{心:2,exp:8}))
]},

    f:R('你衝得太猛，隊伍被拆散，寶物沒拿到，全隊灰頭土臉地逃了出來。',{體:-1,exp:4},{flag:'sx3'}),
    b:R('妖獸的一爪拍碎了你的護體靈氣。',{},{die:'死於宗門秘境，同門把你的名字刻在了試煉碑上'})}),
  O('讓陣峰天才佈陣，大家按計劃行動','diligent',['悟',12],{
    g:R('你把大家的特長拆開重組，一個用劍，一個用丹，一個佈陣。妖獸還沒反應過來就被困住了。師兄大呼「這才叫配合」。',{悟:1,人:1,exp:16},{flag:['sx3','sxBond']}),
    k:R('計劃有漏洞，但大家互相補救，總算過了關。',{悟:1,exp:10},{flag:['sx3','sxBond']}),
    f:R('計劃很完美，執行很混亂。妖獸沒打倒，寶物也錯過了。',{exp:4},{flag:'sx3'})}),
  O('說服大家分頭行動，各取所長','careful',['人',12],{
    g:R('你三言兩語就把隊伍的氣氛理順了，每個人都覺得自己是主角。事後師兄請你喝了三天的酒。',{人:2,exp:14},{flag:['sx3','sxBond']}),
    k:R('大家勉強聽了你的，最後各有所獲。',{人:1,exp:9},{flag:['sx3','sxBond']}),
    f:R('師兄不服，師妹發抖，天才不說話。你一個人說到嘴巴乾，沒人理你。',{人:-1,exp:3},{flag:'sx3'})}),
  O('讓隊友先上，自己在後面掩護','timid',['心',11],{
    g:R('你在後方冷靜地指出妖獸的破綻，隊友一擊得手。事後大家都說，你是隊伍的「眼睛」。',{心:1,人:1,exp:13},{flag:['sx3','sxBond']}),
    k:R('你躲在後面，有驚無險。回來時師兄打趣：「你怎麼比我還會躲？」',{exp:8},{flag:'sx3'}),
    f:R('你躲得太遠，隊友以為你跑了，從此對你有些疏遠。',{人:-1,exp:3},{flag:'sx3'})})
]},

{id:'sx_4',path:true,t:'後山的黑影',a:[60,900],rm:[3,6],fl:['sx3','inSect'],nf:['sx4'],w:13,
 text:'深夜，你在宗門後山撞見一位平日德高望重的長老，與一個蒙面黑影低聲交談。黑影的袖口，繡著魔道的暗紋。長老忽然回頭，目光正好落在你藏身的樹後。',o:[
  O('現身質問，當場揭穿','bold',['體',14],{
    g:R('你一步跨出，攔住了兩人。長老惱羞成怒，與你交手三十回合，最終被你擒下。掌門聞訊趕來，在全宗面前宣布：「此事，記你頭功。」',{體:1,人:2,exp:22},{flag:['sx4','sxHero']},),
    k:R('長老被你逼退，黑影趁亂逃走。你雖未擒下他，但掌門對你另眼相看。',{體:1,人:1,exp:14},{flag:['sx4','sxHero']}),
    f:R('長老反咬一口，說你是魔道的內應。宗門念你過往，只把你逐出山門。',{人:-2,exp:6},{flag:['sx4','sxExile','rogue'],unflag:['inSect','inner']}),
    b:R('長老眼中殺機一閃，黑影的袖中劍已經刺了過來。',{},{die:'死於後山的黑影之下，宗門史冊上只留下「失蹤」二字'})}),
  O('暗中蒐證，再向掌門告發','diligent',['悟',14],{
    g:R('你花了三個月，查到長老與魔道往來的賬目、信物與暗號。掌門看完，沉默了很久：「你做得比我想像的好。」',{悟:2,人:1,exp:22},{flag:['sx4','sxHero']}),
    k:R('證據不完整，但足夠讓掌門起了疑心。長老被調去了閒職。',{悟:1,exp:14},{flag:['sx4','sxHero']}),
    f:R('你的動作被長老察覺，賬冊一夜之間不翼而飛。他轉頭告發你「竊取機密」。',{人:-1,exp:6},{flag:['sx4','sxExile','rogue'],unflag:['inSect','inner']})}),
  O('直接向掌門密報，請他定奪','careful',['人',14],{
    g:R('掌門面色凝重：「老夫早就覺得他不對勁，但苦無證據。」你的密報成了關鍵一環。',{人:2,exp:18},{flag:['sx4','sxHero']}),
    k:R('掌門聽完，說「此事我知道了」，之後就沒了下文。但長老從此再沒出過山門。',{人:1,exp:12},{flag:['sx4','sxHero']}),
    f:R('掌門不信，反而責怪你「妄議長輩」。你被罰了三年面壁。',{心:1,人:-1,exp:5},{flag:'sx4'})}),
  O('假裝什麼都沒看見，悄悄退回去','timid',null,R('你屏住呼吸，退回山下。長老似乎沒有發現你。但那天之後，你每晚都睡不好。',{心:-1,exp:5},{flag:['sx4','sxSilent']}))
],},

{id:'sx_5',path:true,t:'護宗大戰',a:[100,2500],rm:[4,6],fl:['sx4','inSect'],nf:['sx5'],w:14,
 text:'三十年後，魔道傾巢而出，圍攻天衍宗。護山大陣在第三天出現裂縫，掌門重傷，長老們一個接一個倒下。山門前的廣場上，所有倖存的弟子都在看著你。',o:[
  O('坐鎮陣眼，以身補陣','careful',['心',17],{
    g:R('你盤坐在陣眼之中，把自己的靈氣一點一點輸入大陣。三日三夜後，裂縫合上，魔道退去。你睜開眼，發現滿山的弟子都在為你叩首。',{心:2,人:2,exp:36},{flag:['sx5','sxLegacy']}),
    k:R('大陣勉強撐住，你元氣大傷，但山門保住了。',{體:-1,人:1,exp:24},{flag:['sx5','sxLegacy']}),
    f:R('你力有不逮，大陣最終崩潰，只保住了大半弟子撤離。',{體:-2,exp:10},{flag:['sx5','sxFall'],unflag:['inSect','inner']}),
    b:R('陣眼的反噬比你想像的更猛烈。',{},{die:'以身補陣，魂飛魄散。天衍宗的護山大陣上，多了一道永遠不滅的光'})}),
  O('率領弟子出擊，主動迎戰魔修','bold',['體',17],{
    g:R('你一馬當先，領著弟子衝入魔修陣中。那一戰，你一人斬了十七名魔修。天衍宗的史書上，記下了你的名字。',{體:2,人:2,exp:36},{flag:['sx5','sxLegacy']}),
    k:R('戰況慘烈，但你們守住了山門。',{體:1,人:1,exp:24},{flag:['sx5','sxLegacy']}),
    f:R('你的隊伍被魔修分割包圍，傷亡慘重，宗門陷落。',{體:-2,人:-1,exp:10},{flag:['sx5','sxFall'],unflag:['inSect','inner']}),
    b:R('魔道的長老親自出手，一掌擊碎了你的護體靈罩。',{},{die:'戰死於山門前，天衍宗的人說，你是最後一個倒下的'})}),
  O('請藏經閣那位老前輩出手','careful',null,R('你跑到藏經閣，那位掃地的老人放下掃帚，說了句「終於輪到我了」。他走出山門的那一刻，漫天的魔氣忽然安靜了。一炷香之後，魔道退走，老人拍了拍身上的灰，回去繼續掃地。',{心:2,人:3,exp:40},{flag:['sx5','sxLegacy']}),
   {fl:['sxKeeper'],flr:'需要先得到藏經閣老人的賞識'}),
  O('以掌門信物號令全宗，統一指揮','diligent',['人',16],{
    g:R('你拿出掌門信物，聲音傳遍山門：「所有人，聽我號令。」混亂的弟子們瞬間有了主心骨。這一戰，你贏得堂堂正正。',{人:3,悟:1,exp:34},{flag:['sx5','sxLegacy']}),
    k:R('大家半信半疑，但還是聽了。雖然亂，但沒有崩。',{人:1,exp:22},{flag:['sx5','sxLegacy']}),
    f:R('號令無人響應，宗門各自為戰，最終一敗塗地。',{人:-2,exp:8},{flag:['sx5','sxFall'],unflag:['inSect','inner']})},
   {fl:['sxHero'],flr:'需要揭發叛徒、贏得全宗的信任'}),
  O('護送年輕弟子從密道撤離，保住宗門火種','timid',['心',15],{
    g:R('你帶著三百名年輕弟子，從密道安全撤出。多年後，他們在別處重建了天衍宗，尊你為「護法長老」。',{心:2,人:2,exp:28},{flag:['sx5','sxLegacy']}),
    k:R('撤離途中損失不小，但火種保住了。',{心:1,exp:16},{flag:['sx5','sxFall'],unflag:['inSect','inner']}),
    f:R('密道被魔修發現，撤退變成一場潰逃。',{心:-1,人:-1,exp:6},{flag:['sx5','sxFall'],unflag:['inSect','inner']})})
]},

// =============== 散修線：無門無派 ===============
{id:'rg_1',path:true,t:'破廟裡的老散修',a:[16,90],rm:[0,6],fl:['rogue'],nf:['inSect','rg1'],w:10,
 text:'沒有宗門的人，下雨天最難熬。你縮在一座破廟的屋簷下躲雨，裡頭已經有個人生了火——一個鬍子打結、腰間掛著八個葫蘆的老散修。他頭也不抬：「進來吧，火不收錢，但故事要收。」',o:[
  O('講講自己的故事，換一份火','careful',['人',9],{
    g:R('老人聽完，大笑三聲：「你這故事夠下酒了。」他把一個葫蘆扔給你，順口教了一套「野路子口訣」。',{人:1,悟:1,exp:8},{flag:['rg1','rgMentor']}),
    k:R('老人邊喝酒邊點頭，說：「嗯，有點意思。」你借著火烤乾了衣服，也學到了幾句小竅門。',{人:1,exp:5},{flag:['rg1']}),
    f:R('你講著講著就睡著了。老人搖搖頭，替你添了柴。',{exp:3},{flag:'rg1'})}),
  O('請教他的修行心得','diligent',['悟',9],{
    g:R('老人瞇著眼看了你半晌：「散修沒有門派，只有路。你要不要聽聽我走過的？」那一夜，你聽完了一個漂泊一生的修行者的全部心得。',{悟:2,exp:10},{flag:['rg1','rgMentor']}),
    k:R('老人隨口說了幾個竅門，你記了個大概。',{悟:1,exp:6},{flag:'rg1'}),
    f:R('老人說了一堆黑話，你一句也沒聽懂。',{exp:3},{flag:'rg1'})}),
  O('偷偷打量他腰間的八個葫蘆','bold',['體',9],{
    g:R('你伸手摸向最大的葫蘆，被老人一把抓住手腕——「小賊，手腳挺快。」他哈哈大笑，反手把葫蘆塞進你懷裡：「送你了，當酒喝。」',{體:1,exp:8},{flag:['rg1','rgMentor']}),
    k:R('你的手剛伸到一半，就被老人用葫蘆敲了一下。「看可以，摸不行。」',{exp:5},{flag:'rg1'}),
    f:R('你被老人一腳踹出了破廟，淋了一夜的雨。',{體:-1,exp:3},{flag:'rg1'})}),
  O('默默烤火，一句話不說','timid',null,R('你們隔著火堆坐了一夜。天亮時，老人遞給你半塊烤餅，說：「散修的路難走，你還是個孩子，慢點。」',{心:1,exp:4},{flag:'rg1'}))
]},

{id:'rg_2',path:true,t:'無名客棧',a:[20,600],rm:[1,6],fl:['rg1'],nf:['rg2','inSect'],w:13,
 text:'大荒深處有家沒有招牌的客棧，據說是散修的聚集地：不問出身，不收門票，只有一條規矩——「打架出去打」。老闆娘邀請你加入「散修盟」，入盟費不高，但要通過三位老前輩的考驗。',o:[
  O('接受武鬥考驗','bold',['體',11],{
    g:R('你連贏三場，老闆娘拍著桌子叫好：「這孩子，是塊料！」你成了散修盟最年輕的正式成員。',{體:1,人:1,exp:12},{flag:['rg2','rgAlliance']}),
    k:R('你打了個平手，三位前輩點了點頭：「勉強算過。」',{體:1,exp:8},{flag:['rg2','rgAlliance']}),
    f:R('你被打得鼻青臉腫，連一場都沒贏。老闆娘遞給你一杯酒：「回去練練再來。」',{體:-1,exp:4},{flag:'rg2'})}),
  O('以才藝過關，展示自己的小法術','diligent',['悟',11],{
    g:R('你的小法術讓三位前輩大開眼界：「野路子還能這麼玩？」你被當場收入盟中。',{悟:1,人:1,exp:12},{flag:['rg2','rgAlliance']}),
    k:R('法術雖然不夠華麗，但有幾分巧思，前輩們點頭同意。',{悟:1,exp:8},{flag:['rg2','rgAlliance']}),
    f:R('你的法術在半途熄火，場面一度非常尷尬。',{心:-1,exp:4},{flag:'rg2'})}),
  O('以人情過關，請客喝酒','careful',['人',11],{
    g:R('你三杯酒下肚，跟三位前輩稱兄道弟。他們笑著說：「我們考的是人，不是本事。」',{人:2,exp:12},{flag:['rg2','rgAlliance']}),
    k:R('酒喝得很開心，前輩們說你這人「沒問題」。',{人:1,金:-1,exp:8},{flag:['rg2','rgAlliance']}),
    f:R('你酒量不行，喝趴在桌上，被當作「不夠格」。',{人:-1,exp:4},{flag:'rg2'})}),
  O('婉拒，繼續單幹','timid',null,R('老闆娘笑了笑：「各人有各人的路。想通了，隨時回來。」',{心:1,exp:5},{flag:'rg2'}))
]},

{id:'rg_x',path:true,t:'逐出山門',a:[60,900],rm:[3,6],fl:['sxExile'],nf:['rg1'],w:40,
 text:'山門在你身後轟然合上。你站在山腳，回頭望了一眼那座你曾經以為會待一輩子的山。長老的陰影還罩在你頭上，你的名字被劃出了宗門名冊，連藏經閣的老人都沒來送你。你在原地站了很久，才想起——你還有手有腳，還有一條命。',o:[
  O('投奔散修盟，在無名客棧落腳','careful',['人',12],{
    g:R('老闆娘一眼認出你是「天衍宗被逐出來的那位」，卻只是給你倒了杯酒：「這裡不問出身，坐吧。」你在這裡落了腳。',{人:2,exp:14},{flag:['rg1','rg2','rgAlliance','rogue']}),
    k:R('客棧的人對你不算熱情，但也沒趕你走。你開始新的日子。',{人:1,exp:8},{flag:['rg1','rogue']}),
    f:R('你找不到客棧，在荒野走了兩個月。',{體:-1,exp:4},{flag:['rg1','rogue']})}),
  O('一個人走，哪裡都是修行','bold',['體',12],{
    g:R('你一個人走過三千里荒野，斬妖、採藥、悟道。回首時，山門的影子已經淡了。',{體:2,心:1,exp:14},{flag:['rg1','rgMentor','rogue']}),
    k:R('你一路漂泊，雖然辛苦，但日子過得自在。',{體:1,exp:9},{flag:['rg1','rogue']}),
    f:R('你在荒野中病倒，被路過的老人救下，他嘆氣：「年輕人，別逞強。」',{體:-1,exp:4},{flag:['rg1','rogue']})}),
  O('隱姓埋名，暗中收集長老的罪證','diligent',['悟',13],{
    g:R('你潛伏三年，終於拿到了長老與魔道往來的鐵證。你沒有急著回去，而是把證據藏好，等待時機。',{悟:2,心:1,exp:16},{flag:['rg1','rgMentor','rogue']}),
    k:R('你找到了一些線索，雖然還不夠定罪，但已足夠讓你自保。',{悟:1,exp:10},{flag:['rg1','rogue']}),
    f:R('你的行蹤被長老的人發現，只能再次逃亡。',{體:-1,exp:4},{flag:['rg1','rogue']})})
]},

{id:'rg_3',path:true,t:'名門的圍剿',a:[40,900],rm:[2,6],fl:['rg2'],nf:['rg3','inSect'],w:13,
 text:'某大宗門以「清剿魔修」之名，帶著一隊弟子闖進散修聚居的坊市，開始搜身、沒收「來路不明」的法寶。有人反抗，被當場打傷。有人低聲說：「散修的命，不是命嗎？」所有人都在看著你。',o:[
  O('挺身而出，擋在他們面前','bold',['體',13],{
    g:R('你一人擋在坊市入口，名門弟子竟然被你的氣勢震住。散修們歡呼，你成了他們口中的「那個站出來的人」。',{體:1,人:2,exp:20},{flag:['rg3','rgHero']}),
    k:R('你受了點傷，但把他們逼退了。坊市保住了。',{體:-1,人:1,exp:12},{flag:['rg3','rgHero']}),
    f:R('你被名門弟子打倒在地，坊市被搜了個底朝天。',{體:-2,人:-1,exp:5},{flag:'rg3'}),
    b:R('帶隊的名門長老出手，一掌震碎你的丹田。',{},{die:'死於名門長老的一掌，散修們把你葬在了坊市邊'})}),
  O('當眾講理，指出他們沒有搜查文書','diligent',['悟',13],{
    g:R('你一句一句指出他們手續的漏洞，名門弟子臉色由紅轉白，最後灰溜溜地撤走。散修們大笑：「這個書呆子！」',{悟:1,人:2,exp:20},{flag:['rg3','rgHero']}),
    k:R('你的話讓他們猶豫了，帶隊的人說「改日再查」，匆匆離去。',{悟:1,exp:12},{flag:['rg3','rgHero']}),
    f:R('名門弟子聽了半天，說：「你說完了嗎？」然後繼續搜查。',{人:-1,exp:5},{flag:'rg3'})}),
  O('暗中通知散修盟，請援兵','careful',['人',13],{
    g:R('你悄悄從後門溜出，不到一個時辰，散修盟的兄弟姐妹們趕到。名門弟子一看人數，立刻收斂了。',{人:2,exp:20},{flag:['rg3','rgHero']},),
    k:R('援兵來得有點晚，但總算解了圍。',{人:1,exp:12},{flag:['rg3']}),
    f:R('你的消息沒傳出去，援兵遲遲不到。',{人:-1,exp:5},{flag:'rg3'})},
   {fb:{rgAlliance:2}}),
  O('趁亂護著幾個老弱先走','timid',['心',12],{
    g:R('你帶著十幾個老人孩子悄悄溜出後街，一個都沒被抓。他們一路哭著給你磕頭。',{心:2,人:1,exp:16},{flag:['rg3','rgHero']}),
    k:R('你護住了大部分人，雖然有些人還是被扣下了法寶。',{心:1,exp:10},{flag:'rg3'}),
    f:R('你自己溜走了，卻被人看見。有人在背後說你膽小。',{心:-1,人:-1,exp:4},{flag:'rg3'})})
]},

{id:'rg_4',path:true,t:'自創功法',a:[80,1500],rm:[3,6],fl:['rg3'],nf:['rg4','inSect'],w:13,
 text:'多年野路子修行，你發現自己的功法與眾不同：它沒有名字，沒有傳承，也沒有人教，卻處處透著你自己的影子。是時候給它一個名字，也給它一個完整的形狀了。',o:[
