// 每次突破成功後，必定接一件這批熱梗事件（隨機）
const MEME_IDS=EVENTS.filter(e=>/^e_meme_/.test(e.id)).map(e=>e.id);
// 平時隨機出現的機率調低，讓它們主要在突破後登場
EVENTS.forEach(e=>{if(MEME_IDS.includes(e.id)&&!e.fl&&!e.cond)e.w=0.35;});
// 全部遇過時，可重逢的事件
const MEME_RE=['e_meme_awe','e_meme_stele','e_meme_monk','e_meme_backer'];
// 修為獎勵減半（突破後固定出現，避免整體難度下降太多）
EVENTS.forEach(e=>{if(!MEME_IDS.includes(e.id))return;e.o.forEach(o=>Object.values(o.r).forEach(r=>{if(r.fx&&r.fx.exp>0)r.fx.exp=Math.max(2,Math.round(r.fx.exp/2));}));});

// ===== engine.js：遊戲規則（不依賴 DOM，可在 Node 測試） =====
let RNG=Math.random;
const setRng=f=>{RNG=f;};
const rnd=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const d6=()=>rnd(1,6);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(RNG()*a.length)];
const traitOf=id=>TRAITS.find(t=>t.id===id);
// ---- 難度 ----
// 簡單＝原本的難度；普通所有檢定 +1；地獄所有檢定 +2，並有三個專屬死亡檢定
const DIFFS={
  easy:{n:'簡單',a0:0,a1:0,d:'（舊版難度，已不再提供）'},
  normal:{n:'普通',a0:1,a1:0.7,d:'閻王照章辦事。所有檢定難度 +1，境界越高越吃緊。'},
  hell:{n:'地獄',a0:2,a1:0.9,d:'閻王今天沒吃早飯。所有檢定難度大幅提高，而且一世之中會被點名三次「死亡檢定」。'}
};
const diffOf=run=>DIFFS[run&&run.diff]||DIFFS.normal;
const diffAdd=run=>{const d=diffOf(run);return d.a0+Math.floor((run.realm||0)*d.a1);};
// 第一世固定普通；第二世起可自己選擇要不要挑戰地獄（簡單難度已移除，僅保留給舊存檔）
const WAYS=[0,0,1,2,3,4,5,6,5,4,3,2,1];
// 兩顆六面骰總和 < k 的機率
function pLt(k){let c=0;for(let s=2;s<=12;s++)if(s<k)c+=WAYS[s];return c/36;}

// ---- 開局 ----
const slots=meta=>meta.runs>=1?5:3;
const basePts=meta=>meta.runs>=1?12:10;
const extraPts=sel=>Math.min(5,sel.reduce((a,id)=>a+(traitOf(id).pts||0),0));
const MAX_ALLOC=8;
// 隨機提供詞條候選：第一世 5 個，之後 7 個（含已解鎖的強力詞條）
function offerTraits(meta){
  const pool=TRAITS.filter(t=>!t.lock||meta.unlocked.includes(t.id));
  const a=pool.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a.slice(0,meta.runs>=1?7:5).map(t=>t.id);
}

function createRun(sel,alloc,legacy,gender,diff){
  const stats={};
  SKEYS.forEach(k=>stats[k]=1+(alloc[k]||0));
  sel.forEach(id=>{const t=traitOf(id);for(const k in(t.mod||{}))stats[k]+=t.mod[k];});
  const lowPool=FAMILIES.filter(f=>['hunter','orphan','temple'].includes(f.id));
  const family=pick(sel.includes('poor')?lowPool:FAMILIES),place=pick(PLACES);
  for(const k in family.mod)stats[k]+=family.mod[k];
  SKEYS.forEach(k=>stats[k]=Math.max(0,stats[k]));
  const run={gender:gender||'男',stats,traits:sel.slice(),family,place,age:0,realm:0,exp:0,persona:null,
    pScore:{勇猛:0,精進:0,膽小:0,保守:0},flags:[],done:[],clue:0,
    goals:{immortal:false,earth:false},treasure:null,partner:null,cand:null,save:0,brkWait:0,brkRoot:0,log:[],newUnlocks:[],turns:0,post:null,ended:null,
    diff:diff||'normal',src:{}};
  sel.forEach(id=>{const t=traitOf(id);if(t.save)run.save+=t.save;if(t.clue)run.clue+=t.clue;});
  if(legacy&&legacy.list){run.legacy=legacy;legacy.list.forEach(l=>{for(const k in(l.mod||{}))run.stats[k]+=l.mod[k];if(l.save)run.save+=l.save;});}
  return run;
}

const has=(run,f)=>run.flags.includes(f);
const lifespan=run=>LIFE[run.realm]+(run.stats.體)*(2+run.realm*2);

function expMul(run){
  let m=1;
  run.traits.forEach(id=>m+=(traitOf(id).expMul||0));
  if(run.persona==='精進')m+=0.2;
  if(run.partner)m+=0.1;
  return m;
}

// ---- 屬性變化 ----
function applyFx(run,fx,lines){
  for(const k in fx){
    let v=fx[k];if(!v)continue;
    if(k==='exp'){
      if(v>0)v=Math.round(v*expMul(run));
      run.exp=Math.max(0,run.exp+v);
      if(v)lines.push({txt:`修為 ${v>0?'+':''}${v}`,up:v>0});
    }else{
      if(v>0&&run.brkWait>0&&GROW_CUT&&RNG()<GROW_CUT)v--; // 暫緩突破期間靈氣躁動，屬性難以成長
      if(!v)continue;
      const before=run.stats[k];
      run.stats[k]=clamp(before+v,0,30);
      const real=run.stats[k]-before;
      if(real)lines.push({txt:`${SK[k]} ${real>0?'+':''}${real}`,up:real>0});
    }
  }
}

// ---- 回合推進 ----
function passive(run){
  if(run.realm>=7)return 0;
  const yf=Math.pow(YEARS[run.realm]/5,0.7);
  let g=(2+run.stats.悟*0.5)*run.place.aura*yf*expMul(run);
  if(run.age<16)g*=0.3;
  return Math.round(g);
}
function advance(run){
  const y=YEARS[run.realm];
  run.age+=y;run.turns++;
  const lines=[`${y}年過去了`];
  const g=passive(run);
  if(g>0){run.exp+=g;lines.push(`靈氣滋養，修為 +${g}`);}
  if(run.brkWait>0&&run.realm<7&&run.exp>NEED[run.realm+1]){run.exp=NEED[run.realm+1];lines.push('靈氣滿溢，暫緩突破期間修為無法再增加');}
  const tmp=[];
  run.traits.forEach(id=>{const t=traitOf(id);if(t.tick){applyFx(run,t.tick,tmp);}});
  if(run.persona==='保守')applyFx(run,{金:1},tmp);
  tmp.forEach(l=>lines.push(l.txt));
  if(run.post!==null)run.post++;
  return lines;
}

// ---- 事件篩選 ----
function eligible(run,e,meta){
  const[amin,amax]=e.a||[16,99999];
  if(run.age<amin||run.age>amax)return false;
  const[rmin,rmax]=e.rm||[0,6];
  if(run.realm<rmin||run.realm>rmax)return false;
  if(e.pl&&!e.pl.includes(run.place.id))return false;
  if(e.fm&&!e.fm.includes(run.family.id))return false;
  if(e.fl&&!e.fl.every(f=>has(run,f)))return false;
  if(e.nf&&e.nf.some(f=>has(run,f)))return false;
  if(e.n)for(const k in e.n)if(run.stats[k]<e.n[k])return false;
  if(e.cl&&run.clue<e.cl)return false;
  if(e.ca!==undefined&&(!run.partner||run.partner.aff<e.ca))return false;
  if(e.rare&&meta.unlocked.includes(e.rare))return false;
  if(e.earth&&(run.goals.earth||run.clue>=CLUE_MAX))return false;
  if(e.id==='ef_home'&&run.goals.earth)return false;
  if(e.hell&&run.diff!=='hell')return false;
  if(e.cond&&!e.cond(run))return false;
  if(!e.rep&&run.done.includes(e.id))return false;
  return true;
}
function weight(run,e){
  let w=e.w!==undefined?e.w:(e.rare?4:1);
  if(e.earth){
    w*=1.3;
    run.traits.forEach(id=>{const m=traitOf(id).earth;if(m)w*=m;});
  }
  return w;
}
const tlevel=run=>1+Math.max(0,Math.floor((run.realm-3)/2));
const treasureOf=run=>run.treasure?TREASURES.find(t=>t.id===run.treasure):null;
function tdesc(t){
  const b=t.tag?TAGN[t.tag]:`${STYLE_FULL[t.style]}風格選項`;
  const s=Object.keys(t.fx).map(k=>`${SK[k]} +${t.fx[k]}`).join('、');
  return `${b}加成（隨境界成長），${s}`;
}
const PATH_P=0.6; // 專屬劇情線事件優先登場的機率
const partnerChance=run=>clamp((run.stats.人-2)*0.07,0,0.75);
function pickMeme(run){
  run.memeDue=0;
  const pool=EVENTS.filter(e=>MEME_IDS.includes(e.id)&&eligible(run,e,{unlocked:[]}));
  if(!pool.length)EVENTS.forEach(e=>{if(MEME_RE.includes(e.id)&&run.realm>=e.rm[0]&&run.realm<=e.rm[1])pool.push(e);});
  if(!pool.length)return null;
  let t=RNG()*pool.reduce((a,e)=>a+weight(run,e),0);
  for(const e of pool){t-=weight(run,e);if(t<=0)return e;}
  return pool[pool.length-1];
}
function pickEvent(run,meta){
  const tm=EVENTS.find(x=>x.id==='e_tianmo');
  if(run.realm===6&&eligible(run,tm,meta))return tm; // 天魔入侵優先於突破後的熱梗事件
  if(run.memeDue){const m=pickMeme(run);if(m)return m;}
  // 道侶邂逅：30~50 歲、已有修為，人際越高越容易觸發
  const dm=EVENTS.find(x=>x.id==='d_meet');
  if(eligible(run,dm,meta)&&RNG()<partnerChance(run)){
    run.cand={name:pick(run.gender==='女'?PNAMES_M:PNAMES_F),kind:pick(PKINDS)};
    return dm;
  }
  // 專屬劇情線（宗門／散修）：條件一到就優先登場，讓一條線能走完
  const pp=EVENTS.filter(e=>e.path&&eligible(run,e,meta));
  if(pp.length&&RNG()<PATH_P){
    const ws=pp.map(e=>weight(run,e));
    let r=RNG()*ws.reduce((a,b)=>a+b,0);
    for(let i=0;i<pp.length;i++){r-=ws[i];if(r<=0)return pp[i];}
    return pp[pp.length-1];
  }
  const pool=EVENTS.filter(e=>!e.co&&eligible(run,e,meta));
  if(!pool.length)return EVENTS.find(e=>e.id===(run.realm>=7?'i_idle':'e_hermit'));
  const ws=pool.map(e=>weight(run,e));
  let r=RNG()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i];}
  return pool[pool.length-1];
}

// ---- 檢定 ----
const dcOf=(run,ev,o)=>o.c[1]+(ev.brk?0:Math.floor(run.realm*1.0))+diffAdd(run);
const fzOf=ev=>ev.brk?2:3; // 失敗帶寬：低於「難度−fz」即為大失敗
// 加成明細：[來源, 數值]（結算與「因果小字」共用）
function bonusParts(run,o){
  const P=[];
  if(run.persona){
    const PP=PERS[run.persona];
    if(o.s===PP.style)P.push([`個性・${run.persona}`,2]);else if(o.s===PP.opp)P.push([`個性・${run.persona}（逆風）`,-1]);
    if(run.persona==='勇猛'&&o.c&&o.c[0]==='體')P.push(['個性・勇猛（體質）',1]);
  }
  if(o.c){
    const tag=DEFTAG[o.c[0]];
    run.traits.forEach(id=>{const t=traitOf(id);if(t.cb&&t.cb[tag])P.push([`詞條・${t.n}`,t.cb[tag]]);});
  }
  run.traits.forEach(id=>{const t=traitOf(id);if(t.luck)P.push([`詞條・${t.n}`,t.luck]);});
  if(run.partner&&run.partner.aff>=6)P.push([`道侶 ${run.partner.name} 的好感`,1]);
  const tr=treasureOf(run);
  if(tr&&o.c){
    if(tr.tag&&DEFTAG[o.c[0]]===tr.tag)P.push([`本命法寶・${tr.n}`,tlevel(run)]);
    if(tr.style&&STYLE_FULL[tr.style]&&o.s===tr.style)P.push([`本命法寶・${tr.n}`,tlevel(run)]);
  }
  if(o.fb)for(const f in o.fb)if(has(run,f))P.push([FLAGLBL[f]||f,o.fb[f]]);
  if(o.brkOpt&&run.brkRoot)P.push(['根基穩固',run.brkRoot]);
  if(o.brkOpt&&run.realm>=5&&has(run,'sawTrib'))P.push(['觀摩過他人渡劫',1]);
  if(o.c&&!o.brkOpt&&run.brkWait>0)P.push(['靈氣躁動（暫緩突破中）',-WAIT_PEN]);
  if(o.brkOpt&&run.brkPress)P.push(['靈氣淤積',-run.brkPress]);
  return P;
}
const bonusFor=(run,o)=>bonusParts(run,o).reduce((a,x)=>a+x[1],0);
function optInfo(run,ev,i){
  const o=ev.o[i];
  const info={locked:false,reason:'',chance:null,pDie:0,deadly:false,bonus:0};
  if(o.only&&!o.only.includes(run.persona)){info.locked=true;info.reason=`需要個性：${o.only.join('／')}`;}
  if(o.need)for(const k in o.need)if(run.stats[k]<o.need[k]){info.locked=true;info.reason=`${SK[k]}需達 ${o.need[k]}`;}
  if(o.fl&&!o.fl.every(f=>has(run,f))){info.locked=true;info.reason=o.flr||'條件未達成';}
  if(o.cost)for(const k in o.cost)if(run.stats[k]<o.cost[k]){info.locked=true;info.reason=`${SK[k]}不足（需 ${o.cost[k]}）`;}
  if(o.c){
    const k=o.c[0],dc=dcOf(run,ev,o);
    const sv=run.stats[k],b=bonusFor(run,o);
    info.bonus=b;info.dc=dc;
    info.chance=Math.round((1-pLt(dc-sv-b))*100);
    const pB=pLt(dc-fzOf(ev)-sv-b);
    const pF=pLt(dc-sv-b)-pB;
    const rf=o.r.f,rb=o.r.b||o.r.f;
    info.pDie=(rf&&rf.die?pF:0)+(rb&&rb.die?pB:0);
    info.deadly=!!((rf&&rf.die)||(o.r.b&&o.r.b.die));
  }
  return info;
}

// ---- 結算 ----
function resolve(run,ev,i,meta){
  const o=ev.o[i];
  const out={lines:[],text:'',extra:'',band:null,roll:null,die:null,end:null,goal:null,unlock:null,survive:''};
  if(o.cost)for(const k in o.cost){run.stats[k]-=o.cost[k];out.lines.push({txt:`${SK[k]} −${o.cost[k]}（花費）`,up:false});}
  if(!run.persona&&o.s)run.pScore[STYLE2P[o.s]]++;
  let band='k';
  if(o.c){
    const k=o.c[0],dc=dcOf(run,ev,o);
    const b=bonusFor(run,o),d1=d6(),d2=d6();
    const total=run.stats[k]+b+d1+d2,diff=total-dc;
    band=diff>=5?'g':diff>=0?'k':diff>=-fzOf(ev)?'f':'b';
    out.roll={k,dc,b,d1,d2,total,sv:run.stats[k],parts:bonusParts(run,o)};
  }
  const res=o.r[band]||(band==='g'?o.r.k:band==='b'?o.r.f:null)||o.r.k;
  out.band=o.c?band:null;
  out.text=res.t;
  const px=res.p&&res.p[run.persona];
  if(px)out.extra=px.t;
  if(res.die){
    const fleeP=1-(1-(run.persona==='膽小'?0.25:0))*(1-run.traits.reduce((a,id)=>Math.max(a,traitOf(id).flee||0),0))*(has(run,'escArt')?0.85:1);
    if(fleeP>0&&RNG()<fleeP){
      out.survive='千鈞一髮之際，你施展了祖傳的「溜」字訣，居然真的逃過一劫。';
      applyFx(run,{體:-2},out.lines);
    }else if(run.save>0){
      run.save--;
      out.survive='護體金光閃過，你撿回了一條命（「不滅金身」已消耗）。';
      applyFx(run,{體:-1},out.lines);
    }else{
      out.die=res.die;
      run.log.push({age:run.age,t:ev.t,s:o.l,r:res.die});
      return out;
    }
  }else{
    applyFx(run,res.fx,out.lines);
    if(px&&px.fx)applyFx(run,px.fx,out.lines);
  }
  out.why=[];
  if(res.flag)[].concat(res.flag).forEach(f=>{
    if(!has(run,f)){
      run.flags.push(f);
      run.src=run.src||{};run.src[f]={age:run.age,t:ev.t,s:o.l};
      const h=hintOf(f);if(h)out.why.push(h);
    }
  });
  if(res.unflag){const u=[].concat(res.unflag);run.flags=run.flags.filter(f=>!u.includes(f))}
  if(res.partner&&!run.partner&&run.cand){
    run.partner={name:run.cand.name,kind:run.cand.kind,aff:0};
    if(!has(run,'partner'))run.flags.push('partner');
    out.lines.push({txt:`結為道侶：${run.partner.name}（${run.partner.kind}）`,up:true});
  }
  if(res.treasure){
    run.treasure=res.treasure;
    out.lines.push({txt:`獲得本命法寶：${treasureOf(run).n}`,up:true});
  }
  if(res.aff&&run.partner){
    const before=run.partner.aff;
    run.partner.aff=clamp(before+res.aff,0,10);
    const real=run.partner.aff-before;
    if(real)out.lines.push({txt:`${run.partner.name} 好感 ${real>0?'+':''}${real}（${run.partner.aff}/10）`,up:real>0});
  }
  if(res.partnerDie&&run.partner){
    out.lines.push({txt:`${run.partner.name} 離世了`,up:false});
    run.partner=null;
    run.flags=run.flags.filter(f=>f!=='partner'&&f!=='partnerWilling');
    run.flags.push('partnerLost');
  }
  if(res.save){
    run.save+=res.save;
    out.lines.push({txt:`獲得「免死」×${res.save}`,up:true});
  }
  if(res.clue){
    run.clue=Math.max(0,run.clue+res.clue);
    out.lines.push({txt:`地球線索 ${res.clue>0?'+':''}${res.clue}（${run.clue}/${CLUE_NEED}）`,up:res.clue>0});
  }
  if(res.unlock&&!meta.unlocked.includes(res.unlock)){
    meta.unlocked.push(res.unlock);run.newUnlocks.push(res.unlock);out.unlock=res.unlock;
  }
  if(res.up){
    const lv0=tlevel(run);
    run.realm++;out.realmUp=run.realm;if(/^brk\d/.test(ev.id||'')&&run.realm<7)run.memeDue=1;run.brkWait=0;run.brkRoot=0;run.brkPress=0;
    run.exp=Math.max(run.exp,NEED[run.realm]);
    ['悟','體','心'].forEach(k=>run.stats[k]=clamp(run.stats[k]+1,0,30));
    out.lines.push({txt:`境界提升：${REALMS[run.realm]}`,up:true});
    out.lines.push({txt:'悟性、體質、心性各 +1',up:true});
    const tr0=treasureOf(run);
    if(tr0&&tlevel(run)>lv0)out.lines.push({txt:`${tr0.n} 與你同步成長：加成提升至 +${tlevel(run)}`,up:true});
    if(run.realm===7){run.goals.immortal=true;out.goal='immortal';}
  }
  if(res.goBrk)out.goBrk=1;
  if(res.defer)out.defer=1;
  if(res.goal){run.goals[res.goal]=true;out.goal=res.goal;}
  if(res.end)out.end=res.end;
  if(res.cont&&run.goals.immortal&&run.post===null)run.post=0;
  if(!ev.rep&&!ev.brk&&!run.done.includes(ev.id))run.done.push(ev.id);
  run.log.push({age:run.age,t:ev.t,s:o.l,r:res.t});
  return out;
}

const BRK_WAIT=3,ROOT_STEP=1,ROOT_MAX=1,PRESS=0,GROW_CUT=1,WAIT_PEN=2;
function readyEvent(run){

  const o=[O(`立刻突破${nm}`,'bold',null,R('你閉上眼，引動全身靈氣，朝那道門檻撞了過去。',{},{goBrk:1}))];

// ---- 流程 ----
function startTurn(run,meta){
  const lines=advance(run);
  if(run.post!==null&&run.post>=10)return{end:{type:'immortal'}};
  if(run.age>=lifespan(run)){
    return{end:{type:'old',cause:run.realm===0?'凡人壽盡':`${REALMS[run.realm]}壽元耗盡，坐化於洞府`}};
  }
  return{ev:pickEvent(run,meta),passive:lines};
}
function afterEvent(run,out,ev){
  if(out.die)return{end:{type:'died',cause:out.die}};
  if(out.end)return{end:{type:out.end}};
  if(out.goal){
    if(run.goals.immortal&&run.goals.earth)return{end:{type:run.partner&&has(run,'partnerWilling')?'perfect_together':'perfect'}};
    return{ev:goalEvent(run,out.goal),passive:[]};
  }
  if(!run.persona&&run.age>=15)return{persona:true};
  if(ev&&ev.id==='brk3'&&run.realm>=3&&!run.treasure)
    return{ev:treasureEvent(run),passive:['丹成之際，天地間有物與你共鳴']};
  if(ev&&ev.id==='brk_ready'){
    if(out.goBrk)return{ev:makeBreakEvent(run),passive:['你決定立刻衝關']};
    run.brkWait=BRK_WAIT;return{next:true};
  }
  if(isBreak(ev)){run.brkWait=0;run.brkRoot=0;run.brkPress=0;}

  if(ev&&!ev.brk&&run.age>=16&&run.realm<7&&run.exp>=NEED[run.realm+1]){
    if(run.brkWait>0){
      run.brkWait--;
      run.exp=Math.min(run.exp,NEED[run.realm+1]); // 暫緩期間靈氣滿溢，多出的修為無法累積
      if(run.brkWait>0)return{next:true};
      run.brkRoot=Math.min(ROOT_MAX,(run.brkRoot||0)+ROOT_STEP);run.brkPress=(run.brkPress||0)+PRESS;
    }
    return{ev:readyEvent(run),passive:['修為已足']};
  }
  return{next:true};
}
function cont(run){if(run.goals.immortal&&run.post===null)run.post=0;}

const hintOf=f=>(typeof FLAG_HINT!=='undefined'&&FLAG_HINT[f])||null;
// 這件事「為什麼找上你」：依事件條件回推
function causeOf(run,ev){
  const L=[];
  if(!ev)return L;
  if(ev.hell)L.push('地獄難度的專屬事件：閻王翻到了你的那一頁。');
  if(ev.fl){
    const seen=new Set();
    ev.fl.forEach(f=>{
      const o=run.src&&run.src[f];
      if(!o)return;
      const key=o.age+o.t;if(seen.has(key))return;seen.add(key);
      L.push(`${o.age} 歲「${o.t}」時，你選了「${o.s}」。這件事，是那個選擇留下的後續。`);
    });
  }
  if(ev.fm&&ev.fm.includes(run.family.id))L.push(`你出身「${run.family.n}」，這種事總是先找上這樣的人家。`);
  if(ev.pl&&ev.pl.includes(run.place.id))L.push(`你生長在「${run.place.n}」，所以才碰上了它。`);
  if(ev.rare)L.push('上一世留下的執念，在這一世兌現了。');
  if(ev.earth){
    const m=run.traits.some(id=>traitOf(id).earth);
    L.push(m?'「藍星來客」讓這類線索更常出現。':'來自故鄉的線索，不時會冒出來。');
  }
  if(ev.id==='d_meet')L.push(`你的人際是 ${run.stats.人}，緣分比較容易找上有人緣的人。`);
  if(ev.brk&&/^brk\d/.test(ev.id||''))L.push(run.brkRoot?`你暫緩了突破，多穩了 ${run.brkRoot} 件事的根基。`:'修為已足，你決定立刻衝擊下一個境界。');
  return L;
}

// 顯示用文字：孤兒替換、道侶名稱
function T(run,s){
  if(!run||!s)return s;
  if(run.family.id==='orphan'){for(const[a,b]of ORPHAN_SUB)s=s.split(a).join(b);}
  for(const[a,b]of(run.gender==='女'?GENDER_F:GENDER_M))s=s.split(a).join(b);
  const p=run.partner||run.cand;
  if(p)s=s.split('{P}').join(p.name).split('{K}').join(p.kind);
  return s;
}

function makeLegacyRecord(run,cause){return{realm:run.realm,age:run.age,cause:cause||'死於非命'};}
function rollLegacy(meta,rng){
  const rec=meta.legacy;if(!rec)return null;
  const r=rng||RNG;
  if(r()>=0.75)return{missed:true,rec};
  const pool=LEGACIES.filter(l=>!l.minRealm||rec.realm>=l.minRealm);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return{rec,list:pool.slice(0,rec.realm>=3?2:1)};
}

function snapCur(){
  const c=ui.cur;if(!c)return null;
  const isStatic=EVENTS.some(e=>e.id===c.ev.id);
  return{ev:isStatic?c.ev.id:c.ev,passive:c.passive,out:c.out,pick:c.pick};
}
function saveRun(){
  try{
    if(!run||!['birth','play','persona'].includes(ui.screen))return;
    localStorage.setItem(RKEY,JSON.stringify({v:1,run,screen:ui.screen,cur:ui.screen==='play'?snapCur():null,pchoices:ui.pchoices,flash:ui.flash}));
  }catch(e){}
}
function clearRun(){try{localStorage.removeItem(RKEY);}catch(e){}}
function readSave(){
  try{
    const s=localStorage.getItem(RKEY);if(!s)return null;
    const d=JSON.parse(s);
    if(!d||d.v!==1||!d.run||!d.run.stats||!d.run.family)return null;
    return d;
  }catch(e){return null;}
}
function resumeRun(){
  const d=readSave();if(!d)return false;
  const r=d.run;r.src=r.src||{};r.diff=r.diff||'normal';r.brkWait=r.brkWait||0;r.brkRoot=r.brkRoot||0;
  let cur=null;
  if(d.screen==='play'&&d.cur){
    const ev=typeof d.cur.ev==='string'?EVENTS.find(e=>e.id===d.cur.ev):d.cur.ev;
    if(!ev){clearRun();return false;}
    cur={ev,passive:d.cur.passive||[],out:d.cur.out||null,pick:d.cur.pick};
  }
  run=r;ui.pchoices=d.pchoices||[];ui.flash=d.flash||'';
  if(cur){ui.cur=cur;ui.screen='play';}
  else ui.screen=d.screen==='persona'&&ui.pchoices.length?'persona':'birth';
  render();return true;
}
// 目前走的路線（宗門／散修）
function pathOf(r){
  const f=x=>r.flags.includes(x);
  if(f('inSect')){
    if(f('guest'))return '天衍宗客卿';
    const m=f('mSword')?'劍峰':f('mAlch')?'丹峰':f('mForm')?'陣峰':f('mElder')?'藏經閣':'';
    if(f('sxLord'))return '天衍宗掌門';
    return f('inner')?`天衍宗內門${m?'・'+m:''}`:'天衍宗外門';
  }
  if(f('sxFall'))return f('sxReborn')?'天衍宗再興者':'天衍宗遺民';
  if(f('sxExile'))return '被逐出山門的散修';
  if(f('rogue'))return f('rgLegacy')?'無門之主':'散修';
  return '';
}

function statCell(k){
  const v=run.stats[k],pv=ui.snap&&ui.snap.stats?ui.snap.stats[k]:v,dv=v-pv;
  const w=Math.min(100,v/20*100),pw=Math.min(100,pv/20*100);
  return `<div class="stat ${dv>0?'s-up':dv<0?'s-down':''}"><span>${SK[k]}</span><b>${v}${dv?`<em class="dlt">${dv>0?'+':''}${dv}</em>`:''}</b><i class="bar"><u style="--from:${pw}%;width:${w}%"></u></i></div>`;
}
function hud(){
  const next=run.realm<7?NEED[run.realm+1]:null,prev=NEED[run.realm];
  const pct=next?clamp((run.exp-prev)/(next-prev),0,1)*100:100;
  const S=ui.snap,same=S&&S.realm===run.realm;
  const from=same&&next?clamp((S.exp-prev)/(next-prev),0,1)*100:0;
  const full=next&&run.exp>=next;
  const aged=S&&S.age!==run.age;
  const wait=run.brkWait>0?`<span class="waitchip">暫緩突破・還有 ${run.brkWait} 件事</span>`:'';
  return `<header class="hud">
    <div class="hud-top">
      <div><span class="age ${aged?'tick':''}">${run.age}</span><span class="age-u">歲</span></div>
      <div class="realm ${full?'full':''} ${S&&!same?'lvup':''}"><b>${REALMS[run.realm]}</b>${wait}<i class="bar xp"><u style="--from:${from}%;width:${pct}%"></u></i><small>${next?`修為 ${run.exp} / ${next}${full?'　<span class="ready">修為圓滿</span>':''}`:'已臻極境'}</small></div>
      <div class="meta"><span>${esc(run.family.n)}・${esc(run.place.n)}</span><span>個性：${run.persona||'十五歲定性'}</span>${(meta.runs>=1||run.clue>0||run.goals.earth)?`<span>地球線索 ${run.clue}/${CLUE_NEED}${run.goals.earth?'・已歸鄉':''}</span>`:''}${run.partner?`<span>道侶：${esc(run.partner.name)}（好感 ${run.partner.aff}/10）</span>`:''}</div>
    </div>
    <div class="stats">${SKEYS.map(statCell).join('')}</div>
    <div class="chips">${diffChip(run)}${pathOf(run)?`<span class="chip path">${esc(pathOf(run))}</span>`:''}${run.traits.map(id=>`<span class="chip gold">${esc(traitOf(id).n)}</span>`).join('')}${run.save>0?'<span class="chip">免死 ×'+run.save+'</span>':''}${run.legacy?run.legacy.list.map(l=>`<span class="chip gold">遺澤：${esc(l.n)}</span>`).join(''):''}${run.flags.includes('pillZhuji')?'<span class="chip gold">築基丹</span>':''}${treasureOf(run)?`<span class="chip gold">本命法寶：${esc(treasureOf(run).n)} Lv${tlevel(run)}</span>`:''}</div>
  </header>`;
}
const tx=s=>esc(T(run,s));
function optBtn(ev,o,i){
  const f=optInfo(run,ev,i);
  const chips=[`<span class="chip st-${o.s}">${STYLE_FULL[o.s]}</span>`];
  if(o.c)chips.push(`<span class="chip">${SK[o.c[0]]}檢定・成功率 ${f.chance}%</span>`);
  else chips.push('<span class="chip">無需檢定</span>');
  if(o.cost)for(const k in o.cost)chips.push(`<span class="chip cost">花費 ${SK[k]} ${o.cost[k]}</span>`);
  if(f.pDie>=0.005)chips.push(`<span class="chip danger">致死風險 ${Math.round(f.pDie*100)}%</span>`);
  else if(f.deadly)chips.push('<span class="chip danger">致死風險 &lt;1%</span>');
  if(f.locked)chips.push(`<span class="chip lock">${esc(f.reason)}</span>`);
  if(o.warn)chips.push(`<span class="chip danger">${esc(o.warn)}</span>`);
  return `<button class="opt st-${o.s}" style="--i:${i}" data-act="pick" data-i="${i}" ${f.locked?'disabled':''}><span class="olabel">${tx(o.l)}</span><span class="ometa">${chips.join('')}</span></button>`;
}
function vResult(c){
  const out=c.out,r=out.roll;
  const rollLine=r?`<div class="rollbox"><div class="dice">${dieSvg(r.d1,0)}${dieSvg(r.d2,1)}</div><p class="roll">${SK[r.k]}檢定：${r.sv}${r.b?(r.b>0?' + ':' − ')+Math.abs(r.b):''} + 骰子 ${r.d1}+${r.d2} = <strong>${r.total}</strong>（難度 ${r.dc}）</p><span class="seal">${BAND[out.band]}</span></div>`:'';
  const parts=r?(r.parts||[]).map(([n,v])=>`${esc(n)} ${v>0?'+':'−'}${Math.abs(v)}`):[];
  const dadd=r?diffAdd(run):0;
  if(r&&dadd)parts.push(`難度・${DIFFS[run.diff].n}　檢定難度 +${dadd}`);
  const whyLine=parts.length?`<p class="why">加成與修正｜${parts.join('、')}</p>`:'';
  const hints=(out.why||[]).map(h=>`<p class="why hint">伏筆｜${esc(h)}</p>`).join('');
  return `<div class="result band-${out.band||'k'} ${c.fresh?'fresh':''} ${out.realmUp?'is-up':''}">

    <p class="rtext">${tx(out.text)}</p>
    ${out.extra?`<p class="pextra">〔${run.persona}〕${tx(out.extra)}</p>`:''}
    ${out.survive?`<p class="survive">${esc(out.survive)}</p>`:''}

    ${hints}
    ${out.unlock?`<p class="unlock">解鎖新詞條：<b>${esc(traitOf(out.unlock).n)}</b>　下次投胎就能選了。</p>`:''}

}

    </div>
    <div class="stats" style="margin:8px 0">${SKEYS.map(statCell).join('')}</div>
    <div class="chips">${run.traits.map(id=>`<span class="chip gold">${esc(traitOf(id).n)}</span>`).join('')}${endFlags}${flags}</div>
    ${unl}
    ${(run.newAch||[]).map(id=>{const a=ACH.find(x=>x.id===id);return `<p class="unlock">成就達成：<b>${esc(a.n)}</b>（${esc(a.d)}）</p>`}).join('')}
    <details class="log" open><summary>這一世的記事（${run.log.length}）</summary><ol>${run.log.map(l=>`<li><b>${l.age} 歲・${tx(l.t)}</b><br>${tx(l.s)}</li>`).join('')}</ol></details>
    <div class="btnrow"><button class="btn primary" data-act="new">再投胎一次</button><button class="btn ghost" data-act="home">回到首頁</button></div>
  </section>`;
}

// ---------- 首死劇情 ----------
function vStory(){
  return `<section class="card story"><h2 data-focus tabindex="-1">奈何橋邊</h2>
    <p>黑暗中，一個懶洋洋的聲音響起：「喲，又一個。你這一世死得挺有創意。」</p>
    <p>你面前出現一座橋，橋邊坐著一位大娘，手裡捧著一碗湯，湯碗上貼著標籤：<em>孟婆・不加香菜</em>。</p>
    <p>「喝了這碗，下輩子別想這輩子的事。」大娘挑起眉毛。你搖了搖頭。</p>
    <p>她愣了一下，笑了：「行，有骨氣。不過……」她瞇起眼，打量你的魂魄，「你這魂裡摻了點不屬於這個世界的東西。有意思。」</p>
    <p>她揮了揮手，一道光落在你額頭。你忽然覺得，自己能多帶幾個<em>詞條</em>，也多了一點可以支配的<em>潛力</em>。</p>
    <p>「去吧，再投一次。」她轉過身，聲音漸遠，「這次，多帶點行李。」</p>
    <p class="muted small">詞條欄位 3 → 5，配點 10 → 12。從這一世起，會記錄成就；若死於非命，下一世有機會獲得遺澤。</p>
    <div class="btnrow"><button class="btn primary" data-act="create">再次投胎</button></div>
  </section>`;
}

// ---------- 流程 ----------
function render(scroll=true){
  const v={title:vTitle,create:vCreate,birth:vBirth,play:vPlay,persona:vPersona,end:vEnd,story:vStory}[ui.screen]();
  app.innerHTML=v;
  ui.snap=run?{stats:Object.assign({},run.stats),exp:run.exp,age:run.age,realm:run.realm}:null;
  if(ui.cur)ui.cur.fresh=false;
  if(['birth','play','persona'].includes(ui.screen))saveRun();else if(ui.screen==='end')clearRun();
  if(scroll){
    window.scrollTo(0,0);
    const f=app.querySelector('[data-focus]');
    if(f)f.focus({preventScroll:true});
  }
}
function startCreate(){ui.diff='normal';if(meta.gender)ui.gender=meta.gender;ui.offer=offerTraits(meta);ui.sel=[];ui.alloc={悟:0,體:0,人:0,心:0,金:0};ui.screen='create';render();}
function enterTurn(s,flash){
  if(s.end)return endRun(s.end.type,s.end.cause);
  ui.cur={ev:s.ev,passive:s.passive.slice(),out:null};
  if(flash)ui.cur.passive.unshift(flash);
  ui.screen='play';render();
}
function nextTurn(flash){enterTurn(startTurn(run,meta),flash);}
function endRun(type,cause){
  run.ended={type,cause};
  run.newAch=checkAch(run,meta,type);
  meta.legacy=(type==='died'||type==='worldend')?makeLegacyRecord(run,cause):null;
  meta.runs++;
  meta.diffs=meta.diffs||[];
  if((run.goals.immortal||run.goals.earth)&&!meta.diffs.includes(run.diff||'normal'))meta.diffs.push(run.diff||'normal');
  [type].concat(run.goals.immortal?['immortal']:[],run.goals.earth?['earth']:[]).forEach(t=>{if(!meta.endings.includes(t))meta.endings.push(t);});
  meta.best=Math.max(meta.best,run.realm);
  if(run.goals.earth&&!meta.unlocked.includes('u_home')){meta.unlocked.push('u_home');run.newUnlocks.push('u_home');}
  saveMeta();
  ui.screen='end';render();
  (run.newAch||[]).forEach((id,i)=>{const a=ACH.find(x=>x.id===id);if(a)setTimeout(()=>toast('成就達成・'+a.n,a.d,'ach'),600+i*700);});
}
// 結算後的動畫回饋
function feedback(ev,out){
  const brk=/^brk\d/.test(ev.id||'');
  if(out.goal)setTimeout(()=>fxGoal(out.goal),out.realmUp?2200:200);
  if(out.realmUp)fxRealm(out.realmUp);
  else if(brk){fxBreakFail(!!out.die);}
  else if(out.die)fxDeath();
  else if(out.band==='g')fxGreat();
  else if(out.band==='b')fxShake('.event');
  if(out.unlock)setTimeout(()=>toast('解鎖新詞條・'+traitOf(out.unlock).n,'下次投胎就能選了','unlock'),400);
  if(out.survive)fxShake('.event','flashsave');
}
function afterContinue(){
  const nx=afterEvent(run,ui.cur.out,ui.cur.ev);
  if(nx.end)return endRun(nx.end.type,nx.end.cause);
  if(nx.ev){ui.cur={ev:nx.ev,passive:nx.passive,out:null};return render();}
  if(nx.persona){ui.pchoices=personaChoices(run);ui.screen='persona';return render();}
  nextTurn(ui.flash);ui.flash='';
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const a=b.dataset.act;
  switch(a){
    case 'new':
      if(meta.runs===1&&!meta.introSeen){meta.introSeen=true;saveMeta();ui.screen='story';render();}
      else startCreate();
      break;
    case 'create':startCreate();break;
    case 'resume':if(!resumeRun())render();break;
    case 'abandon':clearRun();run=null;
      if(meta.runs===1&&!meta.introSeen){meta.introSeen=true;saveMeta();ui.screen='story';render();}
      else startCreate();
      break;
    case 'home':ui.screen='title';render();break;
    case 'reset':
      meta=defaultMeta();saveMeta();clearRun();run=null;ui.screen='title';render();break;
    case 'diff':ui.diff=b.dataset.d;render(false);{const n=app.querySelector(`[data-act="diff"][data-d="${ui.diff}"]`);if(n)n.focus({preventScroll:true});}break;
    case 'gender':ui.gender=b.dataset.g;meta.gender=ui.gender;saveMeta();render(false);break;
    case 'trait':{
      const id=b.dataset.id,i=ui.sel.indexOf(id);
      if(i>=0)ui.sel.splice(i,1);else if(ui.sel.length<slots(meta))ui.sel.push(id);
      trimAlloc();render(false);
      const again=app.querySelector(`[data-id="${id}"]`);if(again)again.focus({preventScroll:true});
      break;}
    case 'alloc':{
      const k=b.dataset.k,d=+b.dataset.d;
      const bud=basePts(meta)+extraPts(ui.sel);
      if(d>0&&(ui.alloc[k]>=MAX_ALLOC||allocSum()>=bud))break;
      if(d<0&&ui.alloc[k]<=0)break;
      ui.alloc[k]+=d;render(false);
      const sel=`[data-act="alloc"][data-k="${k}"][data-d="${d}"]`;
      const n=app.querySelector(sel);if(n&&!n.disabled)n.focus({preventScroll:true});
      break;}
    case 'rand':{
      const bud=basePts(meta)+extraPts(ui.sel);
      SKEYS.forEach(k=>ui.alloc[k]=0);
      let left=bud;while(left>0){const k=SKEYS[Math.floor(Math.random()*5)];if(ui.alloc[k]<MAX_ALLOC){ui.alloc[k]++;left--;}}
      render(false);break;}
    case 'born':
      {const lg=rollLegacy(meta);meta.legacy=null;saveMeta();run=createRun(ui.sel,ui.alloc,lg&&lg.list?lg:null,ui.gender,meta.runs>=1?ui.diff:'normal');run.legacyMiss=lg&&lg.missed?lg.rec:null;}ui.snap=null;ui.screen='birth';render();break;
    case 'live':
      run.age=0;nextTurn();break;
    case 'pick':{
      const c=ui.cur;if(c.out)break;
      const i=+b.dataset.i;
      if(optInfo(run,c.ev,i).locked)break;
      c.pick=i;c.out=resolve(run,c.ev,i,meta);
      if(c.out.unlock)saveMeta();
      if(c.ev.ready){ // 修為圓滿的抉擇：不另顯示結果，直接進入突破或繼續人生
        if(c.out.defer)fxDefer();
        afterContinue();break;
      }
      c.fresh=true;
      render(false);
      feedback(c.ev,c.out);
      const nb=app.querySelector('[data-act="cont"]');if(nb)nb.focus({preventScroll:true});
      break;}
    case 'cont':afterContinue();break;
    case 'persona':
      run.persona=b.dataset.p;fxPersona(run.persona);ui.flash=`十五歲，你的性情已定：${run.persona}`;
      nextTurn(ui.flash);ui.flash='';break;
  }
});
render();

</script>
</body>
</html>
