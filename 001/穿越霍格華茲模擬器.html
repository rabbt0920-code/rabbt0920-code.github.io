<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="穿越霍格華茲模擬器：開學那天睜開眼，一個月一回合，七年學制。打敗佛地魔，或者學會時間魔法回家。">
<meta property="og:type" content="website">
<meta property="og:title" content="穿越霍格華茲模擬器">
<meta property="og:description" content="選詞條、配點、隨機出身，一個月一回合，每半年一次大事件。打敗黑暗，或回家——兩個願望，一條命。">
<meta property="og:image" content="https://rabbt0920-code.github.io/hogwarts-sim/og.png">
<meta property="og:url" content="https://rabbt0920-code.github.io/hogwarts-sim/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="穿越霍格華茲模擬器">
<meta name="twitter:image" content="https://rabbt0920-code.github.io/hogwarts-sim/og.png">
<meta name="theme-color" content="#0f1218">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f6e7ae'/%3E%3Cpath d='M4 28 L4 16 L9 16 L9 10 L12 6 L15 10 L15 16 L28 16 L28 28Z' fill='%23151b2b'/%3E%3C/svg%3E">
<title>穿越霍格華茲模擬器</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1218;--bg2:#161a23;--card:#1b202b;--card2:#222937;--line:#2d3546;
  --text:#ece6d6;--mute:#9ba2b0;--gold:#d9b45b;--gold-d:#8a7036;--jade:#6cc1a6;--red:#e2674d;--blue:#7fa6e0;
  --r:14px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);
  background:radial-gradient(1100px 520px at 50% -8%,#212a3d 0%,rgba(15,18,24,0) 70%),var(--bg);
  font:16px/1.75 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-weight:700;letter-spacing:.05em;margin:0;line-height:1.35}
p{margin:0 0 .7em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h2[tabindex]:focus{outline:none}
#app{max-width:780px;margin:0 auto;padding:18px 16px 72px}
.muted{color:var(--mute)}.small{font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:14px 0}
.card h2{font-size:1.35rem;margin-bottom:.5em}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:46px;padding:10px 22px;border-radius:999px;
  border:1px solid var(--line);background:var(--card2);transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--gold-d);background:#29324a}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#e5c570,#c49a3e);color:#1a1405;border-color:#e9cf85;font-weight:700}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#efd283,#cfa648)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* 標題頁 */
.title{text-align:center;padding:44px 0 8px}
.kicker{letter-spacing:.4em;color:var(--gold);font-size:.85rem;margin-bottom:.8em}
.title h1{font-size:clamp(2.1rem,8vw,3.2rem);margin-bottom:.4em}
.lead{max-width:34em;margin:0 auto 1.6em;color:#cfc9b8}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0;text-align:left}
.goal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.goal b{font-family:'Noto Serif TC',serif;font-size:1.1rem;display:block}
.goal.done{border-color:var(--gold-d);background:linear-gradient(180deg,#262313,var(--card))}
.goal .tag{font-size:.8rem;color:var(--gold)}
.stampline{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-size:.9rem;color:var(--mute);margin:16px 0}
details.reset{margin-top:28px;font-size:.88rem;color:var(--mute)}
details.reset summary{cursor:pointer;display:inline-block;padding:6px}

/* 詞條與配點 */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.sec-h h3{font-size:1.1rem}
.counter{color:var(--gold);font-weight:700}
.traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.trait{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:76px;transition:border-color .15s,background .15s}
.trait b{display:block;font-family:'Noto Serif TC',serif}
.trait span{font-size:.85rem;color:var(--mute);display:block;line-height:1.5}
.trait:hover:not(:disabled){border-color:var(--gold-d)}
.trait.on{border-color:var(--gold);background:#2b2a1f}
.trait.on b::after{content:' ✓';color:var(--gold)}
.trait.rare b{color:var(--gold)}
.trait:disabled{opacity:.5;cursor:not-allowed}
.trait.locked{border-style:dashed}
.alloc{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:4.2em 1fr auto;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.arow .nm{font-family:'Noto Serif TC',serif}
.arow .pv{font-size:.82rem;color:var(--mute)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);font-size:1.2rem;line-height:1}
.stepper button:hover:not(:disabled){border-color:var(--gold)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:1.6em;text-align:center;font-weight:700}

/* HUD */
.hud{position:sticky;top:0;z-index:5;background:rgba(15,18,24,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:-18px -16px 6px;padding:12px 16px}
.hud-top{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.age{font-family:'Noto Serif TC',serif;font-size:2rem;font-weight:700;color:var(--gold);line-height:1}
.age-u{font-size:.8rem;color:var(--mute);margin-left:2px}
.realm b{font-family:'Noto Serif TC',serif;font-size:1.1rem}
.realm small{color:var(--mute);display:block;font-size:.78rem;line-height:1.4}
.hud .meta{text-align:right;font-size:.78rem;color:var(--mute);line-height:1.5}
.bar{display:block;height:6px;border-radius:99px;background:#2a3142;overflow:hidden}
.bar u{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .5s}
.bar.xp u{background:linear-gradient(90deg,var(--gold-d),var(--gold))}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.stat{font-size:.82rem;color:var(--mute);line-height:1.3}
.stat b{display:block;font-size:1.15rem;color:var(--text)}
.stat .bar{height:4px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;font-size:.76rem;line-height:1.5;padding:1px 9px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--mute);white-space:nowrap}
.chip.gold{color:var(--gold);border-color:var(--gold-d)}
.chip.danger{color:#ff9a85;border-color:#7b3a2e;background:#2a1713}
.chip.lock{color:#ffd48a;border-color:#6f5a2a}
.chip.cost{color:#e8c46a}
.chip.st-bold{color:#f0a48f}.chip.st-diligent{color:#8fc9ff}.chip.st-timid{color:#c6b4f0}.chip.st-careful{color:#9bdcbc}

/* 事件 */
.event .passive{color:var(--mute);font-size:.86rem;margin-bottom:.8em}
.etext{font-size:1.04rem;color:#ddd7c6}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--gold-d);background:#283148}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt:disabled{opacity:.55;cursor:not-allowed}
.olabel{display:block;font-weight:500}
.ometa{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.result{margin-top:16px;border-top:1px dashed var(--line);padding-top:16px}
.roll{font-size:.86rem;color:var(--mute);margin-bottom:.6em}
.roll strong{color:var(--text)}
.roll b{padding:1px 10px;border-radius:99px;margin-left:6px;font-weight:700}
.band-g .roll b{background:#2d4a3d;color:#9df0cc}
.band-k .roll b{background:#2c3f53;color:#a9d1ff}
.band-f .roll b{background:#4a3f25;color:#ffd48a}
.band-b .roll b{background:#4d2a22;color:#ffa391}
.rtext{font-size:1.04rem}
.pextra{color:var(--gold);border-left:3px solid var(--gold-d);padding-left:12px;margin:.8em 0}
.survive{color:#9df0cc;border-left:3px solid #3b7a62;padding-left:12px}
.fx{list-style:none;padding:0;margin:.6em 0 0;display:flex;flex-wrap:wrap;gap:6px}
.fx li{font-size:.84rem;padding:2px 10px;border-radius:99px;border:1px solid}
.fx li.up{color:#9df0cc;border-color:#2f6a55;background:#142a23}
.fx li.down{color:#ffa391;border-color:#7b3a2e;background:#2a1713}
.unlock{margin-top:12px;padding:10px 14px;border:1px solid var(--gold-d);border-radius:12px;background:#262313;color:var(--gold)}
.dead{color:#ffa391;font-family:'Noto Serif TC',serif;font-size:1.1rem;margin-top:12px}

/* 一般元件 */
.pbox{display:grid;gap:12px;margin-top:14px}
.pcard{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pcard:hover{border-color:var(--gold)}
.pcard b{font-family:'Noto Serif TC',serif;font-size:1.2rem;color:var(--gold)}
.birth-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.birth-grid .card{margin:0}
.birth-grid h3{font-size:1.05rem;color:var(--gold);margin-bottom:.2em}
.endtitle{font-size:clamp(1.8rem,6vw,2.6rem);color:var(--gold);margin:.2em 0}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.sum div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.84rem;color:var(--mute)}
.sum b{display:block;color:var(--text);font-size:1.05rem}
.story p{font-size:1.04rem;line-height:1.95}
.story em{color:var(--gold);font-style:normal}
details.log{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px}
details.log summary{cursor:pointer;padding:10px 0;color:var(--mute)}
.log ol{margin:0;padding:0 0 10px 0;list-style:none;display:grid;gap:10px}
.log li{font-size:.9rem;color:var(--mute);border-left:2px solid var(--line);padding-left:12px}
.log li b{color:var(--text)}
.toast{color:var(--gold);font-size:.9rem}

@media (max-width:560px){
  .goals,.birth-grid{grid-template-columns:1fr}
  .hud-top{grid-template-columns:auto 1fr}
  .hud .meta{grid-column:1/3;text-align:left;display:flex;gap:12px;flex-wrap:wrap}
  .stats{gap:4px}
  .stat{font-size:.74rem}
  .arow{grid-template-columns:3.6em 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.hero{max-width:560px;margin:0 auto 18px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.hero svg{display:block;width:100%;height:auto}
.title{padding-top:20px}
[data-focus]:focus:not(:focus-visible){outline:none}
.title h1:focus{outline:none}

.courses{margin:10px 0 4px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:rgba(255,255,255,.02)}
.courses summary{cursor:pointer;color:var(--gold);font-size:.9rem}
.cgrid{display:grid;grid-template-columns:1fr;gap:4px;margin-top:8px}
.crow{display:grid;grid-template-columns:7.5em 1fr 3em;align-items:center;gap:8px;font-size:.88rem}
.crow small{margin-left:4px;color:var(--jade);font-size:.7rem}
.crow b{text-align:right;color:var(--text)}
.hrow{display:flex;flex-wrap:wrap;gap:6px}
.hcell{font-size:.8rem;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--mute)}
.hcell.me{border-color:var(--gold);color:var(--gold)}

.capnote{font-size:.74rem;color:var(--mute);margin:6px 0 0}
.resume{margin:10px auto;max-width:420px}
.stage{font-size:.78rem;letter-spacing:.08em;color:#ffcf7a;margin:0 0 6px;display:flex;align-items:center;gap:10px}
.stage.fr{color:#ffa3c4}
.pips{display:inline-flex;gap:4px}.pips i{width:18px;height:4px;border-radius:2px;background:var(--line)}.pips i.on{background:#ffcf7a}
.event.major{border-color:#7a5a2a;box-shadow:0 0 0 1px #7a5a2a55,0 8px 30px #0006}
.duel{margin:4px 0 10px;padding:10px 12px;border-radius:12px;background:#0003;border:1px solid var(--line)}
.duel-h{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--mute);margin-bottom:6px}
.duel-h b{color:#ffcf7a;letter-spacing:.15em}
.dice{display:flex;justify-content:center;gap:14px;font-size:2.4rem;line-height:1;margin:2px 0 8px}
.die{display:inline-block;animation:roll .75s cubic-bezier(.2,.8,.3,1.2) both}
.die.d2{animation-delay:.08s}
@keyframes roll{0%{transform:translateY(-18px) rotate(-540deg) scale(.6);opacity:0}70%{opacity:1}100%{transform:none}}
.tug{position:relative;height:12px;border-radius:99px;background:#5a2a24;overflow:hidden}
.tug i{position:absolute;left:0;top:0;bottom:0;width:var(--w);background:linear-gradient(90deg,#3d7bd6,#7fc4ff);animation:tug 1s .55s ease-out both;border-right:2px solid #fff}
@keyframes tug{from{width:50%}to{width:var(--w)}}
.tug-l{display:flex;justify-content:space-between;font-size:.76rem;color:var(--mute);margin-top:4px}
.duel.big .tug{height:16px}
.duel+.roll b,.duel ~ .rtext{animation:fadein .4s .9s both}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.duel.big.db-g{animation:glow 1.4s 1s both}
@keyframes glow{0%{box-shadow:0 0 0 #9df0cc00}40%{box-shadow:0 0 26px #9df0cc88}100%{box-shadow:0 0 0 #9df0cc00}}
.duel.big.db-b,.duel.big.db-f{animation:shake .5s 1s both}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.tline{list-style:none;padding:0 0 0 14px;margin:6px 0 10px;border-left:2px solid var(--line)}
.tline li{position:relative;padding:4px 0 8px 10px;display:flex;flex-direction:column;gap:1px;font-size:.88rem}
.tline li::before{content:'';position:absolute;left:-21px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tline li.b-g::before{background:#9df0cc}.tline li.b-k::before{background:#a9d1ff}.tline li.b-f::before{background:#ffd48a}.tline li.b-b::before{background:#ffa391}
.tl-m{font-size:.72rem;color:var(--mute)}
.hist summary{cursor:pointer}.life{margin:8px 0;padding:6px 0;border-top:1px solid var(--line)}.life>summary{cursor:pointer;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.die,.tug i,.duel,.duel+.roll b,.duel ~ .rtext{animation:none!important}}

</style>
</head>
<body>
<main id="app"></main>
<script>
// ===== data.js：遊戲資料（詞條、出身、常數） =====
const SK={悟:'魔法天賦',體:'體魄',人:'人緣',心:'意志',金:'家底'};
const SKEYS=['悟','體','人','心','金'];
const MONTHS=['九月','十月','十一月','十二月','一月','二月','三月','四月','五月','六月','七月','八月'];
const YEARN=['','一年級','二年級','三年級','四年級','五年級','六年級','七年級'];
const LAST_MONTH=84, POST_MAX=12;      // 七年學制；擊敗佛地魔後可再延長最多 12 個月
const CLUE_NEED=5, CLUE_MAX=7, HX_MAX=4;
const DEFTAG={悟:'learn',體:'fight',人:'social',心:'heart',金:'money'};
const STYLE_FULL={bold:'勇敢',diligent:'求知',timid:'忠誠',careful:'狡黠'};
const HOUSES=['葛來分多','雷文克勞','史萊哲林','赫夫帕夫'];
const STYLE2P={bold:'葛來分多',diligent:'雷文克勞',careful:'史萊哲林',timid:'赫夫帕夫'};
const PERS={
  葛來分多:{style:'bold',opp:'careful',d:'勇氣與膽識。勇敢風格的選項檢定 +2，體魄檢定另 +1；狡黠風格 −1。'},
  雷文克勞:{style:'diligent',opp:'timid',d:'智慧與求知。求知風格的選項檢定 +2，魔法天賦檢定另 +1；忠誠風格 −1。'},
  史萊哲林:{style:'careful',opp:'bold',d:'野心與手腕。狡黠風格的選項檢定 +2，人緣檢定另 +1；勇敢風格 −1。'},
  赫夫帕夫:{style:'timid',opp:'diligent',d:'忠誠與耐心。忠誠風格的選項檢定 +2；致命危機時有 25% 被朋友拉一把；求知風格 −1。'}
};
const HOUSE_STAT={葛來分多:'體',雷文克勞:'悟',史萊哲林:'人'};

// 孤兒／麻瓜出身：不能出現「父母」字樣的替換表（顯示時套用）
const ORPHAN_SUB=[
  ['你爸媽','孤兒院的阿姨'],['爸媽','孤兒院的阿姨'],['你爸','孤兒院的院長'],['你媽','孤兒院的阿姨'],
  ['家裡的長輩','孤兒院的阿姨'],['你家','孤兒院'],['回家','回到孤兒院'],['家人','朋友']
];

const FAMILIES=[
  {id:'pure',n:'古老純血世家',mod:{金:2,人:1,心:-1},d:'祖宅有二十個房間、十八幅會罵人的畫像，和一條「純血至上」的家訓。'},
  {id:'half',n:'混血巫師家庭',mod:{悟:1,心:1},d:'爸是巫師，媽是麻瓜（或反過來）。晚餐桌上常見的話題是「電視為什麼會動」。'},
  {id:'muggle',like:'timid',dis:'careful',n:'麻瓜家庭',mod:{心:1,體:1},d:'你家沒人知道魔法的存在，直到那封貓頭鷹信把窗戶撞破。你的優勢是：知道電話亭怎麼用。'},
  {id:'orphan',n:'孤兒院長大',mod:{體:1,心:1,金:-1,人:-1},d:'沒有父母，只有一張不太新的床。你很早就學會一件事：好東西得靠自己搶。'},
  {id:'ministry',n:'魔法部官員之家',mod:{人:2,金:1,體:-1},d:'爸媽在魔法部上班，口頭禪是「這件事得先填表格」。你從小就懂辦公室政治。'},
  {id:'shop',n:'對角巷店家',mod:{金:1,人:1},d:'家裡開魔法小店。你五歲就會分辨魔杖、坩堝和奸商。'}
];

const TRAITS=[
  {id:'book',n:'圖書館幽靈',d:'魔法天賦 +2，人緣 −1',mod:{悟:2,人:-1}},

    f:R('你怕得不敢出門，只能躲在床底。',{心:-1})})
]},
{id:'m_dementor',mm:28,t:'十二月・催狂魔',text:'三年級的冬天，監獄逃出了一個危險的人物，城堡周圍派來了一群飄浮的黑影。它們吸走快樂，只留下一個學生最不想回想的畫面。你在走廊上遇到一隻，它正朝你緩緩靠近。',o:[
  O('回想一個最快樂的瞬間','diligent',['心',15],{
    g:R('你想到了回家吃的第一頓火鍋。一道微弱的銀光從你的魔杖尖端迸出，催狂魔縮了回去。',{心:2,悟:1},{unlock:'u_patronus'}),
    k:R('你勉強想起一個快樂的回憶，催狂魔緩緩後退，你虛脫地坐在地上。',{心:1}),
    f:R('你的快樂回憶被它一口吞掉。你倒在地上，渾身冰冷。',{心:-2,體:-1}),
    b:R('催狂魔的氣息纏上了你的心臟。',{心:-3,體:-2})}),
  O('拔腿就跑','timid',['體',13],{
    g:R('你一路狂奔，在拐角處撞上了一位熟悉的教授，他一個咒語把催狂魔驅散。',{體:1,人:1}),
    k:R('你跑掉了，雖然狼狽，但保住了精神。',{體:1}),
    f:R('你被追上了，在地上蜷縮了好久才恢復。',{心:-1,體:-1})}),
  O('找朋友一起站著','careful',['人',14],{
    g:R('你拉著朋友圍成一個圈，大家同時想起快樂的事。催狂魔在圈外轉了好幾圈，終於放棄。',{人:2,心:1}),
    k:R('朋友的陪伴讓你稍稍安穩。',{人:1}),
    f:R('朋友被嚇得當場跑掉，留你一個人面對。',{人:-1,心:-1})}),
  O('硬著頭皮用咒語對抗','bold',['悟',15],{
    g:R('你硬是用一個咒語把它轟了出去。傳說中的「正面剛」，你體驗到了。',{悟:1,體:1,心:1}),
    k:R('咒語把它逼退了一點，但你的魔力也見底了。',{悟:1}),
    f:R('咒語沒起作用，你被它吸走了一大塊精神。',{心:-2})})
]},
{id:'m_shack',mm:34,t:'六月・尖叫屋與時間轉換器',text:'三年級的期末，一個長髮的男人出現在尖叫屋。事情比你想的更複雜：有人被冤枉，有人需要被救，而你的朋友手上，恰好有一個能把時間倒回幾個小時的小玩意兒。',o:[
  O('跟著主角團一起去尖叫屋','bold',['體',15],{
    g:R('你在尖叫屋裡冒死擋住了狼人，替大家爭取了寶貴的幾秒。事後，你多了一個從不認識的朋友。',{體:2,心:2,人:2},{flag:'shackHero'}),
    k:R('你跟著一起行動，雖然沒幫上大忙，但也沒添亂。',{體:1,心:1}),
    f:R('你被狼人的爪子擦傷，躺在醫療翼好幾天。',{體:-2}),
    b:R('狼人的下一擊，比你預期的更近。',{},{die:'死於尖叫屋的月圓之夜'})}),
  O('研究那個時間轉換器','diligent',['悟',15],{
    g:R('你研究了一個晚上，大致摸清了原理。「原來時間不是直線，而是很多條線在同一個點交叉。」你覺得，回家的路，也許就在這裡。',{悟:2},{clue:1}),
    k:R('你看懂了一部分，也記下了幾個重要的筆記。',{悟:1},{clue:1}),
    f:R('你太投入，差點把自己的記憶弄混。',{心:-1})}),
  O('設法讓所有人平安離開','careful',['人',14],{
    g:R('你在關鍵時刻，說服各方暫時休戰。這是你這輩子說過最有分量的一句話。',{人:3,心:1}),
    k:R('你調停了一部分，沒有人受重傷。',{人:1}),
    f:R('你的調停被所有人無視。',{人:-1})}),
  O('留在城堡，替他們掩護','timid',['心',13],{
    g:R('你替他們掩護了一整晚，費契找不到任何破綻。',{心:2,人:1}),
    k:R('你守住了城堡的後方。',{心:1}),
    f:R('你被抓到「睡過頭」，罰寫了十頁悔過書。',{心:-1})})
]},
{id:'m_ball',mm:40,t:'十二月・耶誕舞會',text:'四年級的聖誕舞會，整個城堡掛滿了彩帶，連費契都被迫打了領結。你需要一個舞伴、一件像樣的長袍，以及一個讓自己不丟臉的計畫。',o:[
  O('邀請你喜歡的人','bold',['人',16],{
    g:R('對方愣了三秒，然後笑著點頭。這支舞跳完，你的名字被整個城堡記住了。',{人:3,心:1}),
    k:R('對方猶豫了一下，但還是答應了。',{人:1}),
    f:R('對方客氣地婉拒，你在走廊上站了十分鐘。',{人:-1,心:-1})}),
  O('一個人去，帶著甜點','careful',['金',12],{
    g:R('你抱著一整盤小蛋糕，成了整個舞會的團寵。',{人:2,金:-1}),
    k:R('你吃得很開心，也認識了不少人。',{人:1}),
    f:R('甜點被搶光，你尷尬地站在牆邊。',{人:-1})}),
  O('留在公共休息室，讀書','diligent',['悟',14],{
    g:R('你讀完一本厚書，書裡夾著一張紙條，上面寫著幾個你看不懂的符號。你把它收了起來。',{悟:2}),
    k:R('你讀得很專心，魔法天賦有所長進。',{悟:1}),
    f:R('你看到一半睡著了。',{})}),
  O('陪朋友一起去，當他的後援','timid',['心',13],{
    g:R('你替朋友解圍，替他擋掉一個尷尬的瞬間。朋友後來送了你一份厚禮。',{人:2,金:1}),
    k:R('你默默陪著，沒有人注意到你，但你很開心。',{心:1}),
    f:R('你比朋友更緊張。',{})})
]},
{id:'m_grave',mm:46,t:'六月・第三項任務',text:'四年級的終點是一座迷宮。有人在裡面設了陷阱，一個你不認識的聲音說：「這次的獎盃，被動了手腳。」當你們同時伸手握住它，世界變成了一片暗綠色的墓園。',o:[
  O('立刻抓住同伴，一起逃','bold',['體',17],{
    g:R('你拖著同伴往獎盃的方向狂奔，在最後一秒把兩個人一起帶了回去。這一次，沒有人死。',{體:2,心:2,人:3},{flag:'cedricLives'}),
    k:R('你們逃出來了，但你的同伴受了重傷。',{體:-1,人:1}),
    f:R('你被咒語擊中，倒在地上，眼睜睜看著事情發生。',{體:-2,心:-2}),
    b:R('殺人咒的綠光擦過你的頭頂。',{},{die:'在墓園中被索命咒擊中'})}),
  O('設法擊倒敵人','diligent',['悟',17],{
    g:R('你一個「昏昏倒地」擊中了對方，替兩個人爭取了逃跑的時間。',{悟:2,心:1,人:1}),
    k:R('你擊退了對方，但他很快恢復。',{悟:1}),
    f:R('你的咒語被反彈，自己倒在地上。',{體:-1,悟:-1}),
    b:R('對方的魔力遠超你想像。',{},{die:'在墓園中被敵人擊殺'})}),
  O('冷靜觀察，找脫身機會','careful',['心',16],{
    g:R('你一直沒出手，等到對方分神的那一瞬間，才拉著同伴衝向獎盃。',{心:2,人:1}),
    k:R('你找到機會逃了出來，驚魂未定。',{心:1}),
    f:R('你判斷錯了時機，被抓了個正著。',{體:-2})}),
  O('把獎盃遞給對方，換取性命','timid',null,R('你舉起雙手，把獎盃放在地上。對方沒有立刻動手，你們被允許離開。這次的選擇，沒有人會誇你，但你活下來了。',{心:-1,人:-1}))
]},
{id:'m_da',mm:52,t:'十二月・鄧不利多軍',text:'五年級，魔法部派來了一位穿粉紅色開襟毛衣的新老師，她的口頭禪是「請保持安靜」。學校裡的魔法課變成了朗讀課本。有人在偷偷組織地下社團，帶頭的人看著你：「你要不要來？」',o:[
  O('立刻加入，擔任教官','bold',['悟',17],{
    g:R('你在密室裡把大家教得服服貼貼，一年後，全員的咒語水準都提升了一個層級。',{悟:2,人:3,心:1},{flag:'daLeader'}),
    k:R('你加入了，雖然只是中層幹部，但很開心。',{悟:1,人:1}),
    f:R('你的教學被當成笑話，大家一邊笑一邊練。',{人:-1})}),
  O('偷偷幫忙，不暴露身份','careful',['人',16],{
    g:R('你在暗處幫了大忙，沒有人知道是你，但你自己清楚。',{人:2,心:1}),
    k:R('你默默做事，沒有被發現。',{人:1}),
    f:R('你太低調，差點被當成臥底。',{人:-2})}),
  O('留在教室裡，繼續讀課本','diligent',['悟',15],{
    g:R('你一個人把整本課本讀完，還額外做了筆記。考試時，你的卷子成了範本。',{悟:2}),
    k:R('你的成績穩定，沒有出錯。',{悟:1}),
    f:R('你沒能抓住重點，成績不理想。',{悟:-1})}),
  O('向那位老師告密，換取好處','careful',['人',16],{
    g:R('你拿到了老師給的獎賞，但也失去了一些朋友。',{金:3,人:-3,心:-1}),
    k:R('你的消息讓老師很滿意，但你被所有人側目。',{金:1,人:-2}),
    f:R('老師不信你，反而罰你抄了一個月的書。',{人:-3,心:-2})})
]},
{id:'m_ministry',mm:58,t:'六月・神秘事務司',text:'五年級的期末，幾個朋友衝進魔法部深處，說有人被困。那裡有一個放著預言球的大廳、一間只有時間流動的房間，以及一道沒人敢碰的石拱門。你站在入口，所有人都在等你做決定。',o:[
  O('跟著衝進去，一起救人','bold',['體',18],{
    g:R('你在無數咒語中保護了幾個同伴。關鍵時刻，一位熟悉的長輩趕到，替大家擋下最後一擊。',{體:2,心:2,人:2},{flag:'ministryHero'}),
    k:R('你和同伴們一起撐了下來，雖然傷痕累累。',{體:-1,心:1,人:1}),
    f:R('你被敵人的咒語擊中，暈了過去。',{體:-2}),
    b:R('一道綠光擦身而過，你沒能躲開。',{},{die:'死於神秘事務司的混戰'})}),
  O('溜進時間之室，查看那些時鐘','diligent',['悟',17],{
    g:R('你在那個滿是時鐘的房間裡，看見了一個巨大的玻璃罩，裡面時間在倒流。你拓下了符文的樣子，這是回家的最重要線索。',{悟:2,心:1},{clue:1}),
    k:R('你研究了幾分鐘，記下了一些符文。',{悟:1},{clue:1}),
    f:R('你的手臂被時間咒語擦過，一瞬間老了十歲。',{體:-1,悟:-1}),
    b:R('時間之室的力量，遠比你想像的危險。',{},{die:'迷失在時間之室，被時間徹底吞噬'})}),
  O('留在外面，替大家望風','timid',['心',15],{
    g:R('你守在入口，替朋友擋掉了好幾波追兵。',{心:2,人:2}),
    k:R('你守住了出口，也算盡力了。',{心:1}),
    f:R('你被追兵發現，狼狽地逃了出來。',{心:-1})}),
  O('聯絡外面的援軍','careful',['人',17],{
    g:R('你用最快的速度把消息送出去，援軍趕到的時機，剛剛好。',{人:3,心:1}),
    k:R('援軍來得稍晚，但還是來了。',{人:1}),
    f:R('你的求援被擱置，一切只能靠自己。',{人:-1})})
]},
{id:'m_memory',mm:64,t:'十二月・記憶的碎片',text:'六年級的冬天，新來的魔藥學教授正在收集「有趣的學生」，他每週辦一次小型晚宴。校長悄悄把你拉到一旁：「有一段記憶，我需要你幫我拿到。」那不是一件容易的事。',o:[
  O('靠社交手腕，套出記憶','careful',['人',18],{
    g:R('你把那位教授哄得心花怒放，順利拿到了關鍵的記憶。裡面藏著一個魂器的秘密。',{人:2,悟:1,心:1},{hx:1}),
    k:R('你花了一個晚上，拿到了記憶的一部分。',{人:1},{hx:1}),
    f:R('教授看穿了你的目的，委婉地把你請了出去。',{人:-1})}),
  O('偷偷潛入他的辦公室','bold',['悟',18],{
    g:R('你用隱形咒溜進辦公室，在抽屜深處找到了那段記憶。',{悟:2,心:1},{hx:1}),
    k:R('你找到了一部分，但留下了一點痕跡。',{悟:1},{hx:1}),
    f:R('你被發現了，禁閉兩週。',{人:-2,心:-1})}),
  O('向教授坦白，請求幫助','timid',['心',16],{
    g:R('教授沉默良久，最終點了點頭，主動把記憶交給了你。',{心:2,人:1},{hx:1}),
    k:R('教授猶豫了一下，給了你一部分記憶。',{心:1},{hx:1}),
    f:R('教授拒絕了你，但沒有責罰。',{})}),
  O('找藥水解開他的心防','diligent',['悟',17],{
    g:R('你調出了一瓶完美的「幸運藥水」。教授心情大好，主動把記憶交給了你。',{悟:2,金:-1},{hx:1}),
    k:R('藥水效果一般，但還是讓他鬆了口。',{悟:1},{hx:1}),
    f:R('藥水調錯了，教授拉了三天肚子。',{人:-2})})
]},
{id:'m_tower',mm:70,t:'六月・天文塔之夜',text:'六年級的最後一夜，城堡被黑暗的印記籠罩。有人站在高塔上，等一個你熟悉的人。你知道這個夜晚，在原本的故事裡，是個誰也不願面對的結局。',o:[
  O('衝上塔頂，試圖改變結局','bold',['體',19],{
    g:R('你在最後一秒趕到，替老校長擋下了那道咒語。這一次，結局被改寫了。',{體:2,心:2,人:3},{flag:'towerSaved',unlock:'u_dumbledore'}),
    k:R('你趕到了，但還是慢了半步。你抱住受傷的老人，一起從塔頂摔下。',{體:-2,心:1}),
    f:R('你被沿途的敵人攔住，什麼也沒能改變。',{心:-2}),
    b:R('敵人的咒語，直接擊中了你。',{},{die:'死於天文塔下的黑暗之夜'})}),
  O('留在下面，阻止敵人入侵','diligent',['悟',18],{
    g:R('你在城堡的長廊上布下了最強的屏障，把追兵一個個擋了出去。',{悟:2,心:1,人:1}),
    k:R('你擋住了一部分敵人，剩下的交給其他人。',{悟:1}),
    f:R('屏障被攻破，你狼狽撤退。',{悟:-1}),
    b:R('敵人的咒語穿過屏障。',{},{die:'死於天文塔下的伏擊'})}),
  O('召集同伴，守住大門','careful',['人',18],{
    g:R('你把所有能叫來的朋友都叫來了，大家一起守住了城堡的入口。',{人:3,心:1}),
    k:R('你叫來了幾個人，勉強守住了陣線。',{人:1}),
    f:R('沒有人回應你的召集。',{人:-2})}),
  O('留在安全的地方，等一切結束','timid',null,R('你縮在被窩裡，一整夜沒睡。第二天，整個城堡都在哭。你什麼都沒做，但你也活了下來。',{心:-2}))
]},
{id:'m_hunt',mm:76,t:'十二月・逃亡',text:'七年級，沒有人再去上課。你和幾個朋友流亡在外，背包裡裝著帳篷、乾糧，和一個沉重的項鍊。你們在尋找最後的魂器，也躲避無處不在的追兵。某個深夜，營地外傳來了腳步聲。',o:[
  O('悄悄出去查看','bold',['體',20],{
    g:R('你無聲地解決了追兵，帶回了關鍵的情報：下一個魂器的位置。',{體:2,心:1},{hx:1}),
    k:R('你擊退了追兵，雖然驚動了周圍。',{體:1},{hx:1}),
    f:R('你被追兵發現，只好帶著朋友連夜搬家。',{體:-1,心:-1}),
    b:R('一道咒語從背後擊中了你。',{},{die:'死於逃亡路上的伏擊'})}),
  O('研究那條項鍊的來歷','diligent',['悟',20],{
    g:R('你解開了項鍊的秘密，順利摧毀了它。心裡的陰霾，也一起散了。',{悟:2,心:2},{hx:1}),
    k:R('你解出了一部分，項鍊的力量被削弱。',{悟:1,心:-1},{hx:1}),
    f:R('項鍊的黑暗力量侵蝕了你的情緒，你整整三天睡不著。',{心:-2})}),
  O('召集朋友，討論下一步','careful',['人',19],{
    g:R('你們圍著營火討論了一個晚上，終於釐清下一個魂器的線索。',{人:2,心:1},{hx:1}),
    k:R('大家有了共識，雖然只是一個模糊的方向。',{人:1}),
    f:R('討論變成了爭吵，朋友們各自帶著情緒離開。',{人:-2})}),
  O('原地不動，等待風頭過去','timid',['心',18],{
    g:R('你們躲了三天三夜，追兵終於走遠。你覺得，活著本身就是勝利。',{心:2}),
    k:R('你們躲了一陣，雖然糧食見底，但安全了。',{體:-1}),

  O('找朋友幫忙','timid',['人',10],{k:R('朋友們來陪你，一起做完了。',{人:2}),f:R('朋友嫌麻煩，沒人來。',{人:-1})})
]},
{id:'e_rumor',rep:true,t:'城堡的八卦',y:[2,7],w:1,text:'整座城堡都在傳一個消息：有人看見了不該看的東西。每個人說的版本都不太一樣，但都非常精彩。',o:[
  O('加入八卦，繪聲繪影','careful',['人',10],{k:R('你的版本最精彩，被大家傳了一圈。',{人:2}),f:R('你傳錯了人，鬧出一場誤會。',{人:-2})}),
  O('追查真相','diligent',['悟',11],{k:R('你查出來了，八卦是假的。你在朋友圈裡多了一個「靠譜」的稱號。',{悟:1,人:1}),f:R('你查了很久，什麼也沒查到。',{})}),
  O('不管，專心做自己的事','timid',null,R('你什麼也沒說，一個月後，大家早就換了新八卦。',{心:1}))
]},
{id:'e_dada',rep:true,t:'黑魔法防禦課',y:[1,7],w:1.3,text:'這堂課的老師，好像每年都不一樣，而且每一個都有點不對勁。今天要練習的咒語是「繳械咒」。',o:[
  O('主動示範','bold',['悟',11],{g:R('你一次成功，教授帶頭鼓掌。',{悟:2,人:1}),k:R('你示範得不錯，雖然有點慌張。',{悟:1}),f:R('你的咒語打偏了，砸到了天花板的吊燈。',{人:-1})}),
  O('認真記筆記，等別人先試','diligent',['悟',10],{k:R('你的筆記又整齊又全面，成了同學們爭相借閱的對象。',{悟:1,人:1}),f:R('輪到你的時候，你的緊張壓過了一切。',{悟:-1})}),
  O('和同伴互相練習','timid',['人',10],{k:R('你們練了一個下午，最後都學會了。',{人:1,悟:1}),f:R('同伴把你的魔杖打飛了。',{人:-1})})
]},
{id:'e_broom',t:'飛行課',y:[1,3],w:1.2,text:'一把看起來隨時會散架的掃帚躺在你腳邊。教練說：「手掌向下，大聲喊『起來』！」',o:[
  O('用盡全力大喊','bold',['體',9],{g:R('掃帚瞬間跳到你手上，你成了全班第一。',{體:2,人:1}),k:R('掃帚跳了兩下，最終乖乖到了你手裡。',{體:1}),f:R('掃帚滾到了旁邊，一直沒反應。',{人:-1})}),
  O('輕聲細語，溫柔地叫它','diligent',['心',9],{k:R('掃帚慢慢飄到你手上。你覺得它大概也有尊嚴。',{心:1}),f:R('它假裝沒聽見。',{})}),
  O('偷偷看旁邊同學怎麼做','careful',['人',9],{k:R('你學到了訣竅，順利完成。',{人:1}),f:R('同學也在看你，結果兩個人都失敗了。',{})})
]},
{id:'e_rival',t:'金髮少爺的挑釁',y:[1,5],w:1.6,text:'一個金髮、一臉「我是這裡最了不起的人」的少爺，擋住了你的路：「喂，你知道我是誰嗎？」',o:[
  O('反唇相譏','bold',['人',10],{g:R('你一句話把他嗆得面紅耳赤，周圍的人偷笑。',{人:2,心:1},{flag:'rival'}),k:R('你和他鬥了幾句，不分勝負。',{人:1},{flag:'rival'}),f:R('他的跟班們一擁而上，你吃了點小虧。',{體:-1,人:-1},{flag:'rival'})}),
  O('客氣回答，保持距離','careful',['人',9],{k:R('他愣了一下，擺擺手放你走。他看你的眼神裡多了幾分好奇。',{人:1},{flag:'rival'}),f:R('他以為你怕他，更囂張了。',{人:-1},{flag:'rival'})}),
  O('無視他，繼續走','timid',['心',9],{k:R('你頭也不回地離開，他被晾在原地。',{心:1},{flag:'rival'}),f:R('他在背後大聲嘲笑你。',{人:-1},{flag:'rival'})})
]},
{id:'x_rival1',fr:true,t:'少爺的另一面',hs:'史萊哲林',fl:['rival'],nf:['rf1'],y:[1,6],w:2.2,text:'同在史萊哲林，他想裝作不認識你也不行。公共休息室裡，他一個人坐在壁爐邊，手裡捏著一封剛拆開的家書，臉色難看得很。',o:[
  O('遞一杯熱茶，什麼都不問','timid',['人',9],{k:R('他盯著那杯茶看了很久，小聲說了句「……多謝」。這大概是他第一次對人說這兩個字。',{人:1,心:1},{flag:'rf1'}),f:R('他把茶推開：「我不需要你可憐。」但眼神軟了一下。',{},{flag:'rf1'})}),
  O('開口問怎麼了','bold',['人',10],{k:R('他嘴硬了幾句，最後還是吐出幾句：父親對他期望太高，每封信都是責備。',{人:1,心:1},{flag:'rf1'}),f:R('他惱羞成怒地瞪你：「關你什麼事！」但沒有走開。',{人:-1},{flag:'rf1'})}),
  O('假裝沒看見，在旁邊讀書','careful',['心',9],{k:R('你們各自安靜待著。他後來默默把位子往你這邊挪了一點。',{心:1},{flag:'rf1'}),f:R('他以為你在偷看信，狠狠地把信收了起來。',{},{flag:'rf1'})})
]},
{id:'x_rival2',fr:true,t:'少爺的麻煩',hs:'史萊哲林',fl:['rf1'],nf:['rf2'],y:[2,7],w:2.2,text:'他在走廊上被幾個別院的學生堵住，他們笑話他的家世，他卻嘴硬得發抖。你剛好路過。',o:[
  O('站到他身邊','bold',['體',11],{g:R('你一句話都沒多說，只是站在那裡。對方識趣地散了。他別過臉：「……我沒有要你幫忙。」嘴角卻在抖。',{人:2,心:1},{flag:'rf2',pts:2}),k:R('場面僵持了一會，對方悻悻離開。',{人:1},{flag:'rf2'}),f:R('你們雙雙吃了虧，卻在狼狽中第一次相視而笑。',{體:-1,人:1},{flag:'rf2'})}),
  O('找老師來解圍','careful',['人',11],{k:R('老師及時趕到。他不爽被人救，卻在隔天默默替你留了位子。',{人:1},{flag:'rf2'}),f:R('老師來晚了一步，他因此對你有點埋怨。',{},{flag:'rf2'})}),
  O('裝作路過，走開','timid',null,R('你走開了。他沒看你，也沒說話。有些東西，就這樣錯過了。',{人:-1},{flag:'rfx',unflag:'rf1'}))
]},
{id:'x_rival3',fr:true,key:true,t:'少爺的決定',hs:'史萊哲林',fl:['rf2'],nf:['rf3'],y:[3,7],w:2.2,text:'學年末，他把你叫到湖邊。「我父親要我選邊站。」他看著湖面，聲音很輕，「……你覺得，我該聽他的嗎？」',o:[
  O('說「做你自己認為對的」','bold',['心',12],{g:R('他沉默了很久，終於笑了：「你這個傢伙，真麻煩。」從那天起，他不再只是你的『同學』，而是真正的朋友。',{心:2,人:2},{flag:'rf3'}),k:R('他點了點頭，雖然還沒下定決心，卻說：「謝謝你聽我說。」',{心:1,人:1},{flag:'rf3'}),f:R('他苦笑：「說得容易。」但仍記著你的話。',{心:-1},{flag:'rf3'})}),
  O('說「不管你怎麼選，我都在」','timid',['人',11],{k:R('他別過頭去，肩膀輕輕抖了一下。這句話，他大概等了很久。',{人:2,心:1},{flag:'rf3'}),f:R('他似乎想說什麼，最後只擠出一個笑。',{人:1},{flag:'rf3'})}),
  O('說「這是你自己的事」','careful',null,R('他愣了一下，點頭：「也是。」你們之間隔了一道看不見的牆。',{},{flag:'rf3'}))
]},
// ---------- 時間線索（回家用）----------
{id:'t_rune',t:'古代如尼文課',y:[3,7],earth:true,w:1,text:'你選修了「古代如尼文」。老師在黑板上寫下一組奇怪的符文，你越看越覺得眼熟——它們很像你在某個故事裡見過的時間魔法。',o:[
  O('課後留下來研究','diligent',['悟',11],{g:R('你破譯了其中一段，它描述了一種能讓「過去與現在重疊」的儀式。',{悟:2},{clue:1}),k:R('你記下了符文的樣子，雖然只看懂一半。',{悟:1}),f:R('你看得頭暈眼花。',{悟:-1})}),
  O('向老師請教','timid',['人',11],{k:R('老師說：「有意思的問題。」並借了你一本書。',{人:1}),f:R('老師說：「這不在大綱範圍內。」',{})}),
  O('不理它，繼續上課','careful',null,R('你把符文當成普通的課堂內容，筆記照記，沒有深入。',{悟:1}))
]},
{id:'t_dial',t:'閣樓的古怪日晷',y:[2,7],earth:true,w:1,text:'你在城堡的閣樓角落裡，發現了一座被灰塵蓋住的日晷。指針明明沒有太陽，卻在轉動。',o:[
  O('伸手摸一下','bold',['心',11],{g:R('指針忽然倒轉了一圈，你看見了一個一閃而過的畫面：你的家。',{心:1},{clue:1}),k:R('日晷微微發燙，你的腦海中閃過一段陌生的文字。',{悟:1}),f:R('日晷突然發光，你被彈了出去。',{體:-1})}),
  O('拍下它的樣子，帶去問老師','careful',['人',10],{k:R('老師看了一眼，表情有些奇怪：「這個東西……別亂碰。」',{人:1}),f:R('老師說那只是普通的裝飾。',{})}),
  O('用咒語解析','diligent',['悟',12],{g:R('你找到了日晷的運作邏輯，筆記多了一頁寶貴的資料。',{悟:2},{clue:1}),k:R('你解開了一部分。',{悟:1}),f:R('咒語被反彈。',{體:-1})})
]},
{id:'t_book',t:'禁書區的時間之書',y:[4,7],earth:true,w:1,text:'你在禁書區的最深處，發現了一本沒有書名的舊書，書頁邊緣微微發光。',o:[
  O('偷偷帶出去讀','bold',['人',12],{k:R('你在被窩裡讀了一個通宵，了解了不少時間魔法的基礎。',{悟:1}),f:R('管理員發現了書不見了，你被逮個正著。',{人:-2})}),
  O('留在原地抄錄','diligent',['悟',12],{g:R('你抄下了最重要的三頁，筆跡工整。',{悟:2},{clue:1}),k:R('你抄了一半，但記下了關鍵的部分。',{悟:1}),f:R('手酸得快斷了，只抄到半頁。',{體:-1})}),
  O('把書放回去，當作沒看見','timid',null,R('你放回書，心裡卻一直在想：這本書到底是什麼？',{心:-1}))
]},
{id:'t_prof',t:'校長的問題',y:[4,7],earth:true,w:0.9,text:'老校長在走廊上叫住了你，眼睛藏在半月形的眼鏡後面：「你最近，似乎對『時間』很有興趣？」',o:[
  O('坦白告訴他一切','timid',['心',12],{g:R('老校長沉默了很久：「我想，我知道你要找什麼。」他遞給你一張泛黃的紙。',{心:1,人:1},{clue:1}),k:R('他點了點頭：「明白了。」他沒有多說，但給了你一個提示。',{人:1}),f:R('他笑了笑：「年輕人，有些事情要靠自己找。」',{})}),
  O('裝傻，說只是好奇','careful',['人',12],{k:R('他半信半疑地放過了你，但眼神很深。',{人:1}),f:R('他看穿了你的謊，只是嘆了口氣。',{人:-1})}),
  O('反過來問他的看法','bold',['悟',12],{g:R('他被你的問題逗樂了，很認真地給了你一個啟發。',{悟:1,人:1},{clue:1}),k:R('他給了你一個意味深長的微笑。',{悟:1}),f:R('他說：「你還太年輕。」',{})})
]},
{id:'t_ghostsage',t:'老幽靈的證言',y:[3,7],earth:true,w:0.9,text:'一位已經在城堡裡待了五百年的老幽靈，漂到了你旁邊：「年輕人，你身上有『外面』的味道。」',o:[
  O('請他說說這個世界的傳說','careful',['人',11],{k:R('他講了一個關於「迷路的旅人」的老故事。你的心跳漏了半拍。',{人:1}),f:R('他講到一半睡著了。',{})}),
  O('追問他知道什麼','bold',['心',12],{g:R('他壓低聲音：「六百年前，也有人像你一樣。他最後……找到了出口。」',{心:1},{clue:1}),k:R('他給了你一些模糊的線索。',{心:1}),f:R('他沉默地飄走了。',{})}),
  O('敷衍幾句，走開','timid',null,R('你點點頭，禮貌地離開。',{}))
]},
{id:'t_diary',t:'前人留下的筆記',y:[1,7],earth:true,w:0.7,text:'你在一本舊魔藥課本的夾頁裡，發現了一張泛黃的紙，上面用你熟悉的語言寫著：「如果你也看得懂這行字，那你也是從那邊來的。」',o:[
  O('仔細研究，找出作者','diligent',['悟',12],{g:R('你把筆記中的暗號全部破譯，上面記錄了這位前輩的回家嘗試。',{悟:2,心:1},{clue:1}),k:R('你讀懂了一部分，上面有一個很重要的地名。',{悟:1}),f:R('字跡太模糊，你只認出了幾個詞。',{})}),
  O('把筆記藏好，不告訴任何人','careful',['心',10],{k:R('你把紙條夾回課本，鎖進箱子裡。你覺得這件事，需要慎重。',{心:1}),f:R('你太緊張，反而把紙條弄丟了。',{心:-1})})
]},
// ---------- 魂器線索 ----------
{id:'h_ring',t:'被詛咒的戒指',y:[3,7],hx:true,w:1,text:'你在舊物店裡看見一枚黑色的戒指，標價出奇便宜。店主神色緊張：「別碰它，上一個碰它的人……」',o:[
  O('用咒語檢測戒指','diligent',['悟',12],{g:R('你確認了這枚戒指帶有強烈的黑魔法，並在不觸碰的情況下將它封存。',{悟:2},{hx:1}),k:R('你識別出了戒指的來歷，但選擇不去碰它。',{悟:1}),f:R('檢測咒語失敗，你被輕輕灼傷。',{體:-1})}),
  O('請教授處理','timid',['人',11],{k:R('教授接手了戒指，並表示會妥善處理。',{人:1}),f:R('教授說你只是想太多。',{})}),
  O('買下來，自己研究','bold',['心',13],{g:R('你硬生生壓下了戒指裡的低語，並找到了封印它的方法。',{心:2,悟:1},{hx:1}),k:R('你成功控制住戒指的影響，但整個人有些疲憊。',{心:-1}),f:R('戒指的力量侵蝕了你，你昏睡了三天。',{體:-2,心:-2}),b:R('戒指的詛咒過於強大。',{體:-2,心:-3}),})
]},
{id:'h_cup',t:'金庫裡的杯子',y:[4,7],hx:true,w:0.9,text:'一位老同學邀請你去古靈閣的某間金庫看看，說有一件東西「不太對勁」。你站在一堆金幣中間，面前是一個金色的杯子。',o:[
  O('用探測咒語檢查','diligent',['悟',13],{g:R('你確定這就是魂器之一，並在不驚動守衛的情況下記錄了它的位置。',{悟:2},{hx:1}),k:R('你確認了杯子的異常，但沒能帶走。',{悟:1}),f:R('探測咒觸發了陷阱，你被逮個正著。',{體:-1,金:-1})}),
  O('偷偷拍下杯子的樣子','careful',['人',13],{k:R('你畫下了杯子的外型與地點，這是寶貴的線索。',{人:1}),f:R('你被守衛發現，罰了一筆錢。',{金:-2})}),
  O('請妖精幫忙','timid',['金',12],{k:R('妖精收了你的錢，給了你一份簡短的報告。',{金:-1}),f:R('妖精說這是機密。',{})})
]},
{id:'h_room',t:'必要室',y:[5,7],hx:true,w:1,text:'在一條原本不存在的走廊裡，有一扇你從沒見過的門。門後是一座堆滿雜物的巨大倉庫，一頂古老的頭冠靜靜躺在最高的架子上。',o:[
  O('爬上去拿','bold',['體',14],{g:R('你小心翼翼地爬上去，頭冠就在你手邊。你確認了它的來歷，並把它藏在安全的地方。',{體:1,心:1},{hx:1}),k:R('你拿到了頭冠，雖然被雜物砸了一下。',{體:-1}),f:R('架子崩塌，你被埋在雜物裡。',{體:-2})}),
  O('用漂浮咒把它取下來','diligent',['悟',14],{g:R('頭冠平穩地飄到你手上，你一眼認出了它的黑暗氣息。',{悟:2},{hx:1}),k:R('頭冠晃了晃，最終落在你手上。',{悟:1}),f:R('頭冠掉下去，砸壞了旁邊的東西。',{人:-1})}),
  O('和朋友一起找','timid',['人',13],{k:R('你們輪流嘗試，終於合力拿到了頭冠。',{人:2}),f:R('大家意見不一，吵了一晚。',{人:-1})})
]},
// ---------- 稀有事件 ----------
{id:'r_patronus',t:'一個不尋常的夜晚',y:[3,7],rare:'u_patronus',w:2,text:'月光下，一隻銀色的鹿從你面前飄過。它似乎在引導你走向某個地方。',o:[
  O('跟上去','bold',['心',14],{g:R('銀鹿帶你到了一個隱蔽的角落。那裡，一個你從沒見過的守護神咒語在你腦海裡浮現。',{心:2},{unlock:'u_patronus'}),k:R('你跟了一段路，但失去了它的蹤影。',{心:1}),f:R('你被一陣迷霧包圍，失去了方向。',{心:-1})}),
  O('留在原地觀察','diligent',['悟',14],{k:R('你看著銀鹿漸行漸遠，記下了它的形態。',{悟:1}),f:R('什麼也沒有發生。',{})})

{id:'r_phoenix',t:'一根紅色的羽毛',y:[2,7],rare:'u_phoenix',w:2,text:'你在走廊上拾到一根紅得發光的羽毛。它在你手中微微發燙，像是在回應你的心跳。',o:[

{id:'c_potions',cls:true,rep:true,y:[1,7],w:1.3,t:'魔藥學：地窖裡的大鍋',text:()=>{const c=COURSES[2];return `地窖又冷又濕，${c.t}（${c.look}）在鍋與鍋之間穿梭：「今天，你們要熬一鍋像樣的藥。如果有人把它炸了，就自己負責擦乾淨。」`;},o:[

]},

  O('挑戰進階：培育一株魔鬼網','diligent',['悟',12],{g:R('你的魔鬼網長得生機勃勃，卻乖乖地沒纏任何人。教授連連稱讚。',{悟:2,心:1},{pts:12}),k:R('魔鬼網長出來了，只是有點亂。',{悟:1}),f:R('魔鬼網一長出來就纏住了你的腳踝。',{體:-1})},{sk:'herbo',needSk:{herbo:4}})
]},

  O('強打精神，認真做筆記','diligent',['心',9],{g:R('你在昏昏欲睡的氣氛中，記下了一個很有意思的細節，後來考試派上了用場。',{悟:1,心:1}),k:R('你撐到下課，筆記有一半是有效的。',{悟:1}),f:R('你不知不覺睡著了，口水滴在筆記上。',{})},{sk:'history'}),

  O('向教授請教一個冷門的問題','diligent',['悟',12],{g:R('教授愣了三秒，這是他死後第一次有人主動提問。他興奮得把整堂課的內容都改了，你學到了書上沒有的故事。',{悟:2,人:1},{pts:12}),k:R('教授給了你一個簡短但有趣的回答。',{悟:1}),f:R('教授記錯年份，講了半天，你更糊塗了。',{})},{sk:'history',needSk:{history:3}})
]},

  O('挑戰進階：推算下一次月蝕','diligent',['悟',13],{g:R('你算出了月蝕的時間，只差十分鐘。教授難得地笑了：「有天賦。」',{悟:2,心:1},{pts:12}),k:R('你的推算有點誤差，但方向對了。',{悟:1}),f:R('你算錯了一個小數點，教授委婉地說：「繼續努力。」',{})},{sk:'astro',needSk:{astro:5}})

{id:'v_divination',cls:true,rep:true,el:'divination',y:[3,7],w:1.2,t:'占卜學：悶熱的塔樓',text:()=>{const c=ELECTIVES[1];return `塔樓裡燃著香，窗簾全拉上了。${c.t}（${c.look}）拿起你的茶杯，倒過來研究了很久：「噢……我看見了……一隻黑色的……不祥的……」`;},o:[

  O('什麼也不說，專心聽','timid',null,R('你默默聽完整堂課，覺得這門課比想像中有意思。',{悟:1}))

{id:'v_runes',cls:true,rep:true,el:'runes',y:[3,7],w:1.2,t:'古代魔文：一張古老的羊皮紙',text:()=>{const c=ELECTIVES[4];return `${c.t}（${c.look}）展開一張泛黃的羊皮紙：「這是一段殘缺的古代銘文。能翻出一半，今天就算你們及格。」`;},o:[

  O('偷偷試吃免費樣品','bold',['人',10],{k:R('你吃遍了所有樣品，老闆微笑著假裝沒看見。',{體:1}),f:R('你被老闆發現，提著衣領送出門。',{人:-1})}),

// ===== engine.js：遊戲規則（不依賴 DOM，可在 Node 測試） =====
let RNG=Math.random;
const setRng=f=>{RNG=f;};
const rnd=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const d6=()=>rnd(1,6);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(RNG()*a.length)];
const traitOf=id=>TRAITS.find(t=>t.id===id);
const WAYS=[0,0,1,2,3,4,5,6,5,4,3,2,1];
function pLt(k){let c=0;for(let s=2;s<=12;s++)if(s<k)c+=WAYS[s];return c/36;}

// ---- 開局 ----
const slots=meta=>meta.runs>=1?5:3;
const basePts=meta=>meta.runs>=1?12:10;
const extraPts=sel=>Math.min(5,sel.reduce((a,id)=>a+(traitOf(id).pts||0),0));
const MAX_ALLOC=8;
function offerTraits(meta){
  const pool=TRAITS.filter(t=>!t.lock||meta.unlocked.includes(t.id));
  const a=pool.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a.slice(0,meta.runs>=1?7:5).map(t=>t.id);
}
function createRun(sel,alloc,legacy,gender){
  const stats={};
  SKEYS.forEach(k=>stats[k]=1+(alloc[k]||0));
  sel.forEach(id=>{const t=traitOf(id);for(const k in(t.mod||{}))stats[k]+=t.mod[k];});
  const fpool=sel.includes('poor')?FAMILIES.filter(f=>f.id==='orphan'||f.id==='muggle'):FAMILIES;
  const family=pick(fpool);
  for(const k in family.mod)stats[k]+=family.mod[k];
  SKEYS.forEach(k=>stats[k]=Math.max(0,stats[k]));
  const run={gender:gender||'男',stats,traits:sel.slice(),family,month:0,persona:null,mood:{v:0},flags:[],done:[],clue:0,hx:0,skill:{},elect:[],hp:{葛來分多:0,雷文克勞:0,史萊哲林:0,赫夫帕夫:0},cups:0,
    keys:[],goals:{voldemort:false,home:false},save:0,log:[],newUnlocks:[],post:null,ended:null};
  sel.forEach(id=>{const t=traitOf(id);if(t.save)run.save+=t.save;if(t.clue)run.clue+=t.clue;});
  if(legacy&&legacy.list){run.legacy=legacy;legacy.list.forEach(l=>{for(const k in(l.mod||{}))run.stats[k]+=l.mod[k];if(l.save)run.save+=l.save;});}
  return run;
}
const has=(run,f)=>run.flags.includes(f);
const lvl=(run,id)=>Math.min(10,Math.floor(run.skill[id]||0));
const skBonus=(run,id)=>{const l=lvl(run,id);return l>=9?3:l>=6?2:l>=3?1:0;};
function teacherOf(run,sk){
  if(sk==='dada')return DADA_T[yearOf(run)];
  return COURSES.concat(ELECTIVES).find(c=>c.id===sk);
}
function prefOf(run,ev,o){
  if(!ev||!ev.cls||!o.sk)return null;
  const t=teacherOf(run,o.sk);if(!t||!t.like)return null;
  return o.s===t.like?'like':o.s===t.dis?'dis':null;
}
const evText0=(run,ev)=>typeof ev.text==='function'?ev.text(run):ev.text;
// 事件變化：VAR[id]=[{y:[a,b],hs,fl,text}...]，符合條件者隨月份輪替
const VAR=typeof VARS!=='undefined'?VARS:{};
function evText(run,ev){
  const vs=(VAR[ev.id]||[]).filter(v=>(!v.y||(yearOf(run)>=v.y[0]&&yearOf(run)<=v.y[1]))&&(!v.hs||v.hs===run.persona)&&(!v.fl||v.fl.every(f=>has(run,f))));
  if(!vs.length)return evText0(run,ev);
  const all=[null].concat(vs),v=all[(run.month*7+ev.id.length)%all.length];
  return v?(v.pre?v.pre+evText0(run,ev):v.text):evText0(run,ev);
}
// 一般事件的屬性上限（每年級 +2），特殊事件不受限
const capOf=run=>8+2*yearOf(run);
const isSp=ev=>!!(ev.mm||ev.fin||ev.stg||ev.rare||ev.fr||ev.hs||ev.fm||ev.key);
const FRIENDS={rf3:'金髮少爺',fr_g3:'歐文',fr_r3:'艾莉絲',fr_s3:'薇拉',fr_h3:'湯米'};
const friendsOf=run=>Object.keys(FRIENDS).filter(f=>has(run,f)).map(f=>FRIENDS[f]);
function gainSk(run,id,v,lines){
  if(run.elect.includes(id)||v<=0)return;
  const b=lvl(run,id);run.skill[id]=Math.min(10,(run.skill[id]||0)+v);
  if(lvl(run,id)>b)lines.push({txt:`${SKNAME[id]} 進度提升：Lv${lvl(run,id)}`,up:true});
}
const yearOf=run=>Math.min(7,Math.max(1,Math.ceil(run.month/12)));
const mInYear=run=>((run.month-1)%12)+1;
const isSummer=run=>mInYear(run)>=11;
const calLabel=run=>run.month>LAST_MONTH?`畢業後第 ${run.month-LAST_MONTH} 個月`:`${YEARN[yearOf(run)]}・${MONTHS[mInYear(run)-1]}`;

// ---- 屬性變化 ----
function applyFx(run,fx,lines){
  for(const k in fx){
    const v=fx[k];if(!v)continue;
    const before=run.stats[k];
    run.stats[k]=Math.max(0,before+v);
    const real=run.stats[k]-before;
    if(real)lines.push({txt:`${SK[k]} ${real>0?'+':''}${real}`,up:real>0});
  }
}

// ---- 回合推進（一回合 = 一個月）----
function advance(run){
  run.month++;
  const lines=[calLabel(run)];
  const tmp=[];
  if(run.month>1&&run.month<=LAST_MONTH&&mInYear(run)===1){
    applyFx(run,TUNE.yearGain>1?{悟:1,[pick(SKEYS.filter(k=>k!=='悟'))]:1}:{悟:1},tmp);
    lines.push('新學年開始，你又長大了一點');
  }
  if(run.month<=LAST_MONTH&&mInYear(run)<=10){
    // 日常上課：每月各科自然進步
    const g=TUNE.studyBase+TUNE.studyPer*run.stats.悟;
    CORE.forEach(id=>{run.skill[id]=Math.min(10,(run.skill[id]||0)+g);});
    // 學院盃：各院每月自然增減
    HOUSES.forEach(h=>{run.hp[h]+=rnd(TUNE.hpMin,TUNE.hpMax);});
  }
  if(run.month<=LAST_MONTH&&mInYear(run)===11&&run.persona){
    const best=HOUSES.slice().sort((a,b)=>run.hp[b]-run.hp[a])[0];
    const mine=run.persona===best;
    lines.push(`學院盃結算：${best} 以 ${run.hp[best]} 分奪冠（你的學院 ${run.hp[run.persona]} 分）`);
    if(mine){run.cups++;(run.keys=run.keys||[]).push({m:run.month,t:'學院盃',s:'你的學院贏得了學院盃',b:'g'});applyFx(run,{人:1,心:1},tmp);lines.push('你的學院贏得了學院盃！');if(!has(run,'cup'))run.flags.push('cup');}
    HOUSES.forEach(h=>{run.hp[h]=0;});
  }
  tmp.forEach(l=>lines.push(l.txt));
  if(run.post!==null)run.post++;
  return lines;
}

// ---- 事件篩選 ----
function eligible(run,e,meta){
  const y=yearOf(run);
  const[ymin,ymax]=e.y||[1,7];
  if(y<ymin||y>ymax)return false;
  if(run.month>LAST_MONTH){if(!e.po)return false;}
  else{
    if(e.po)return false;
    if(!!e.su!==isSummer(run))return false;
  }
  if(e.fm&&!e.fm.includes(run.family.id))return false;
  if(e.hs&&!e.hs.includes(run.persona))return false;
  if(e.el&&!run.elect.includes(e.el))return false;
  if(e.cond&&!e.cond(run))return false;
  if(e.fl&&!e.fl.every(f=>has(run,f)))return false;
  if(e.nf&&e.nf.some(f=>has(run,f)))return false;
  if(e.n)for(const k in e.n)if(run.stats[k]<e.n[k])return false;
  if(e.cl&&run.clue<e.cl)return false;
  if(e.rare&&meta.unlocked.includes(e.rare))return false;
  if(e.earth&&(run.goals.home||run.clue>=CLUE_MAX))return false;
  if(e.hx&&run.hx>=HX_MAX)return false;
  if(!e.rep&&run.done.includes(e.id))return false;
  return true;
}
function weight(run,e){
  let w=e.w!==undefined?e.w:(e.rare?3:1);
  if(e.earth){w*=TUNE.earthW;run.traits.forEach(id=>{const m=traitOf(id).earth;if(m)w*=m;});}
  if(e.hx){run.traits.forEach(id=>{const m=traitOf(id).hxw;if(m)w*=m;});}
  return w;
}
function pickEvent(run,meta){
  if(run.month===1)return EVENTS.find(e=>e.id==='sorting');
  if(run.month===2)return EVENTS.find(e=>e.id==='e_timetable');
  if(run.month===25)return EVENTS.find(e=>e.id==='e_elect1');
  if(run.month===26)return EVENTS.find(e=>e.id==='e_elect2');
  if(run.month<=LAST_MONTH){const mj=EVENTS.find(e=>e.mm===run.month);if(mj)return mj;}
  if(run.clue>=CLUE_NEED&&!run.goals.home&&(!has(run,'homeSkip')||run.month>=LAST_MONTH-1))
    return EVENTS.find(e=>e.id==='ef_home');
  const pool=EVENTS.filter(e=>!e.co&&!e.mm&&!e.fx0&&e.id!=='sorting'&&e.id!==run.last&&eligible(run,e,meta));
  if(!pool.length)return EVENTS.find(e=>e.id==='e_quiet');
  const ws=pool.map(e=>weight(run,e));
  let r=RNG()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i];}
  return pool[pool.length-1];
}

// ---- 檢定 ----
const TUNE={skG:0.6,skK:0.3,studyBase:0.05,studyPer:0.004,hpMin:6,hpMax:14,softFrom:4,softSpan:14,softMin:0.1,gainP:0.5,dcYear:1.0,majorAdd:3,majorYear:2.6,earthW:0.45,yearGain:1};
const dcOf=(run,ev,o)=>o.c[1]+((ev.mm||ev.stg||ev.fin)?TUNE.majorAdd+Math.floor((yearOf(run)-1)*TUNE.majorYear):Math.floor((yearOf(run)-1)*TUNE.dcYear));
const fzOf=ev=>3;
function bonusFor(run,ev,o){
  let b=0;
  if(run.persona){
    const P=PERS[run.persona];
    if(o.s===P.style)b+=2;else if(o.s===P.opp)b-=1;
    if(o.c&&HOUSE_STAT[run.persona]===o.c[0])b+=1;
  }
  if(o.c){
    const tag=DEFTAG[o.c[0]];
    run.traits.forEach(id=>{const t=traitOf(id);if(t.cb&&t.cb[tag])b+=t.cb[tag];});
  }
  run.traits.forEach(id=>{const t=traitOf(id);if(t.luck)b+=t.luck;});
  if(o.sk)b+=skBonus(run,o.sk);
  if(ev&&ev.cls&&o.sk){
    const pf=prefOf(run,ev,o);if(pf==='like')b+=1;else if(pf==='dis')b-=1;
    if(run.mood)b+=run.mood.v;
    if(run.persona&&HEAD[run.persona]===o.sk)b+=1;
    if(run.persona==='葛來分多'&&o.sk==='potions')b-=1;
  }
  if(ev&&ev.fin)b+=run.hx+Math.min(2,friendsOf(run).length);
  if(has(run,'trio'))b+=1;
  return b;
}
function optInfo(run,ev,i){
  const o=ev.o[i];
  const info={locked:false,reason:'',chance:null,pDie:0,deadly:false,bonus:0};
  if(o.only&&!o.only.includes(run.persona)){info.locked=true;info.reason=`需要學院：${o.only.join('／')}`;}
  if(o.needSk)for(const k in o.needSk)if(lvl(run,k)<o.needSk[k]){info.locked=true;info.reason=`${SKNAME[k]}需達 Lv${o.needSk[k]}`;}
  if(o.ne&&run.elect.includes(o.ne)){info.locked=true;info.reason='已經選修了';}
  if(o.need)for(const k in o.need)if(run.stats[k]<o.need[k]){info.locked=true;info.reason=`${SK[k]}需達 ${o.need[k]}`;}
  if(o.cost)for(const k in o.cost)if(run.stats[k]<o.cost[k]){info.locked=true;info.reason=`${SK[k]}不足（需 ${o.cost[k]}）`;}
  if(o.c){
    const k=o.c[0],dc=dcOf(run,ev,o);
    const sv=run.stats[k],b=bonusFor(run,ev,o);
    info.bonus=b;info.dc=dc;info.pref=prefOf(run,ev,o);if(o.sk)info.sk={id:o.sk,lvl:lvl(run,o.sk),bonus:skBonus(run,o.sk)};
    info.chance=Math.round((1-pLt(dc-sv-b))*100);
    const pB=pLt(dc-fzOf(ev)-sv-b);
    const pF=pLt(dc-sv-b)-pB;
    const rf=o.r.f,rb=o.r.b||o.r.f;
    info.pDie=(rf&&rf.die?pF:0)+(rb&&rb.die?pB:0);
    info.deadly=!!((rf&&rf.die)||(o.r.b&&o.r.b.die));
  }
  return info;
}

// ---- 結算 ----
function resolve(run,ev,i,meta){
  const o=ev.o[i];
  const out={lines:[],notes:[],text:'',extra:'',band:null,roll:null,die:null,end:null,goal:null,unlock:null,survive:''};
  if(o.cost)for(const k in o.cost){run.stats[k]-=o.cost[k];out.lines.push({txt:`${SK[k]} −${o.cost[k]}（花費）`,up:false});}
  let band='k';
  if(o.c){
    const k=o.c[0],dc=dcOf(run,ev,o);
    const b=bonusFor(run,ev,o),d1=d6(),d2=d6();
    const total=run.stats[k]+b+d1+d2,diff=total-dc;
    band=diff>=5?'g':diff>=0?'k':diff>=-fzOf(ev)?'f':'b';
    out.roll={k,dc,b,d1,d2,total,sv:run.stats[k]};
  }
  const res=o.r[band]||(band==='g'?o.r.k:band==='b'?o.r.f:null)||o.r.k;
  out.band=o.c?band:null;
  out.text=res.t;
  if(res.die){
    const fleeP=1-(1-(run.persona==='赫夫帕夫'?0.25:0))*(1-run.traits.reduce((a,id)=>Math.max(a,traitOf(id).flee||0),0));
    if(fleeP>0&&RNG()<fleeP){
      out.survive=run.persona==='赫夫帕夫'&&RNG()<0.5?'千鈞一髮之際，有個朋友把你一把拽了回來。':'千鈞一髮之際，你憑著一股「溜」的本能躲開了致命一擊。';
      applyFx(run,{體:-2},out.lines);
    }else if(run.save>0){
      run.save--;
      out.survive='一道溫暖的光擋下了致命一擊（「免死機會」已消耗）。';
      applyFx(run,{體:-1},out.lines);
    }else{
      out.die=res.die;
      run.log.push({m:run.month,t:ev.t,s:o.l,r:res.die});
      (run.keys=run.keys||[]).push({m:run.month,t:ev.t,s:o.l+'・'+res.die,b:band});
      return out;
    }
  }else{
    let fx=res.fx;
    if(!ev.mm&&!ev.fin){fx={};for(const k in res.fx){const v=res.fx[k];fx[k]=(v>0&&RNG()>clamp(1-(run.stats[k]-TUNE.softFrom)/TUNE.softSpan,TUNE.softMin,1))?0:v;}}
    if(!isSp(ev)){const cap=capOf(run);const fx2={};for(const k in fx){let v=fx[k];if(v>0){const room=Math.max(0,cap-run.stats[k]);if(room<v){v=room;out.lines.push({txt:`${SK[k]}已達${run.month>LAST_MONTH?'':YEARN[yearOf(run)]}日常上限 ${cap}，需靠特殊事件突破`,up:false});}}fx2[k]=v;}fx=fx2;}
    applyFx(run,fx,out.lines);
  }
  if(ev.cls&&o.sk){
    const pf=prefOf(run,ev,o),t=teacherOf(run,o.sk);
    if(pf==='like'&&t){out.notes.push(`${t.t}欣賞你這種做法，滿意地點了點頭。`);if(run.persona){run.hp[run.persona]+=2;out.lines.push({txt:'學院分數 +2（教授欣賞）',up:true});}}
    else if(pf==='dis'&&t&&(band==='f'||band==='b')){out.notes.push(`${t.t}皺起眉頭，顯然不太喜歡你這種做法。`);if(run.persona){run.hp[run.persona]-=2;out.lines.push({txt:'學院分數 −2（教授不悅）',up:false});}}
    if(run.persona&&HEAD[run.persona]===o.sk&&t)out.notes.push(`身為你的院長，${t.t}對自己學院的學生總是多一分寬容。`);
  }
  if(o.sk&&(band==='g'||band==='k')){gainSk(run,o.sk,band==='g'?TUNE.skG:TUNE.skK,out.lines);}
  if(res.sk)for(const k in res.sk)gainSk(run,k,res.sk[k],out.lines);
  if(res.elect&&!run.elect.includes(res.elect)){run.elect.push(res.elect);run.skill[res.elect]=10;out.lines.push({txt:`選修「${SKNAME[res.elect]}」：滿值（Lv10）`,up:true});}
  {let p=res.pts;
   if(p===undefined&&(ev.cls||ev.mm||ev.stg||ev.fin))p=ev.stg?({g:4,k:2,f:0,b:-2})[band]:(ev.mm||ev.fin)?({g:12,k:6,f:0,b:-6})[band]:({g:6,k:3,f:-2,b:-4})[band];
   if(p&&run.persona){run.hp[run.persona]+=p;out.lines.push({txt:`學院分數 ${p>0?'+':''}${p}`,up:p>0});}}
  if(res.house){run.persona=res.house;out.lines.push({txt:`分入學院：${res.house}`,up:true});}
  if(res.flag)[].concat(res.flag).forEach(f=>{if(!has(run,f))run.flags.push(f)});
  if(res.unflag){const u=[].concat(res.unflag);run.flags=run.flags.filter(f=>!u.includes(f))}
  if(res.clue){
    run.clue=Math.max(0,run.clue+res.clue);
    out.lines.push({txt:`時間線索 ${res.clue>0?'+':''}${res.clue}（${run.clue}/${CLUE_NEED}）`,up:res.clue>0});
  }
  if(res.hx){
    run.hx=clamp(run.hx+res.hx,0,HX_MAX);
    out.lines.push({txt:`魂器線索 ${res.hx>0?'+':''}${res.hx}（${run.hx}/${HX_MAX}）`,up:res.hx>0});
  }
  if(res.unlock&&!meta.unlocked.includes(res.unlock)){
    meta.unlocked.push(res.unlock);run.newUnlocks.push(res.unlock);out.unlock=res.unlock;
  }
  if(res.home){run.goals.home=true;out.end=run.goals.voldemort?'perfect':'home';}
  if(res.goal){run.goals[res.goal]=true;out.goal=res.goal;}
  if(res.end)out.end=res.end;
  if(res.cont&&run.goals.voldemort&&run.post===null)run.post=0;
  if(!run.done.includes(ev.id))run.done.push(ev.id);
  run.last=ev.id;
  if(ev.mm||ev.fin||ev.key||ev.id==='sorting'||res.unlock||res.goal||res.home)(run.keys=run.keys||[]).push({m:run.month,t:ev.t,s:o.l,b:o.c?band:null});
  run.log.push({m:run.month,t:ev.t,s:o.l,r:res.t});
  return out;
}

// ---- 流程 ----
function startTurn(run,meta){
  const lines=advance(run);
  if(run.post!==null&&run.post>=POST_MAX)return{end:{type:'victory'}};
  if(run.post===null&&run.month>LAST_MONTH)return{end:{type:'graduate'}};
  const ev=pickEvent(run,meta);
  run.mood={v:0};
  if(ev&&ev.cls){
    const sk=(ev.o.find(o=>o.sk)||{}).sk,t=sk&&teacherOf(run,sk),r=RNG();
    if(t&&r<0.2){run.mood={v:-1};lines.push(`${t.t}今天臉色臭得像剛喝了苦藥（本堂檢定 −1）`);}
    else if(t&&r>0.85){run.mood={v:1};lines.push(`${t.t}今天心情特別好（本堂檢定 +1）`);}
  }
  return{ev,passive:lines};
}
function afterEvent(run,out,ev){
  if(out.die)return{end:{type:'died',cause:out.die}};
  if(out.end)return{end:{type:out.end}};
  if(out.goal==='voldemort')return{ev:goalEvent(run),passive:[]};
  if(ev&&ev.chain)run.q=ev.chain.slice();
  if(run.q&&run.q.length){const id=run.q.shift(),nx=EVENTS.find(x=>x.id===id),ps=[''];
    if(nx&&(nx.fin||nx.id==='m_final_b')){const fs=friendsOf(run);if(fs.length)ps.push(`${fs.join('、')}站在你身邊${nx.fin?`（決戰檢定 +${Math.min(2,fs.length)}）`:''}`);}
    return{ev:nx,passive:ps};}
  return{next:true};
}

function rollLegacy(meta,rng){

}

function optBtn(ev,o,i){
  const f=optInfo(run,ev,i);

  if(f.sk)chips.push(`<span class="chip gold">${esc(SKNAME[f.sk.id])} Lv${f.sk.lvl}${f.sk.bonus?`（+${f.sk.bonus}）`:''}</span>`);
  if(!o.c)chips.push('<span class="chip">無需檢定</span>');
  if(o.cost)for(const k in o.cost)chips.push(`<span class="chip cost">花費 ${SK[k]} ${o.cost[k]}</span>`);

// ---------- 流程 ----------
function render(scroll=true){
  const v={title:vTitle,create:vCreate,birth:vBirth,play:vPlay,end:vEnd,story:vStory}[ui.screen]();
  app.innerHTML=v;
  saveRun();
  if(scroll){
    window.scrollTo(0,0);
    const f=app.querySelector('[data-focus]');
    if(f)f.focus({preventScroll:true});
  }
}
function startCreate(){if(meta.gender)ui.gender=meta.gender;ui.offer=offerTraits(meta);ui.sel=[];ui.alloc={悟:0,體:0,人:0,心:0,金:0};ui.screen='create';render();}
function enterTurn(s,flash){
  if(s.end)return endRun(s.end.type,s.end.cause);
  ui.cur={ev:s.ev,passive:s.passive.slice(),out:null};
  if(flash)ui.cur.passive.unshift(flash);
  ui.screen='play';render();
}
function nextTurn(flash){enterTurn(startTurn(run,meta),flash);}
function endRun(type,cause){
  run.ended={type,cause};
  run.newAch=checkAch(run,meta,type);
  meta.legacy=(type==='died'||type==='worldend')?makeLegacyRecord(run,cause):null;
  meta.hist=(meta.hist||[]).concat([{n:meta.runs+1,type,house:run.persona,fam:run.family.n,at:calLabel(run),friends:friendsOf(run),keys:(run.keys||[]).slice(-16)}]).slice(-12);
  clearRun();
  meta.runs++;
  [type].forEach(t=>{if(!meta.endings.includes(t))meta.endings.push(t);});
  meta.best=Math.max(meta.best||0,yearOf(run));
  if(run.goals.home&&!meta.unlocked.includes('u_home')){meta.unlocked.push('u_home');run.newUnlocks.push('u_home');}
  saveMeta();
  ui.screen='end';render();
}
function afterContinue(){
  const nx=afterEvent(run,ui.cur.out,ui.cur.ev);
  if(nx.end)return endRun(nx.end.type,nx.end.cause);
  if(nx.ev){ui.cur={ev:nx.ev,passive:nx.passive,out:null};return render();}
  nextTurn(ui.flash);ui.flash='';
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const a=b.dataset.act;
  switch(a){
    case 'new':
      if(meta.runs===1&&!meta.introSeen){meta.introSeen=true;saveMeta();ui.screen='story';render();}
      else startCreate();
      break;
    case 'create':startCreate();break;
    case 'home':ui.screen='title';render();break;
    case 'reset':
      meta=defaultMeta();saveMeta();ui.screen='title';render();break;
    case 'gender':ui.gender=b.dataset.g;meta.gender=ui.gender;saveMeta();render(false);break;
    case 'trait':{
      const id=b.dataset.id,i=ui.sel.indexOf(id);
      if(i>=0)ui.sel.splice(i,1);else if(ui.sel.length<slots(meta))ui.sel.push(id);
      trimAlloc();render(false);
      const again=app.querySelector(`[data-id="${id}"]`);if(again)again.focus({preventScroll:true});
      break;}
    case 'alloc':{
      const k=b.dataset.k,d=+b.dataset.d;
      const bud=basePts(meta)+extraPts(ui.sel);
      if(d>0&&(ui.alloc[k]>=MAX_ALLOC||allocSum()>=bud))break;
      if(d<0&&ui.alloc[k]<=0)break;
      ui.alloc[k]+=d;render(false);
      const sel=`[data-act="alloc"][data-k="${k}"][data-d="${d}"]`;
      const n=app.querySelector(sel);if(n&&!n.disabled)n.focus({preventScroll:true});
      break;}
    case 'rand':{
      const bud=basePts(meta)+extraPts(ui.sel);
      SKEYS.forEach(k=>ui.alloc[k]=0);
      let left=bud;while(left>0){const k=SKEYS[Math.floor(Math.random()*5)];if(ui.alloc[k]<MAX_ALLOC){ui.alloc[k]++;left--;}}
      render(false);break;}
    case 'resume':resumeRun();break;
    case 'born':clearRun();
      {const lg=rollLegacy(meta);meta.legacy=null;saveMeta();run=createRun(ui.sel,ui.alloc,lg&&lg.list?lg:null,ui.gender);run.legacyMiss=lg&&lg.missed?lg.rec:null;}ui.screen='birth';render();break;
    case 'live':
      run.month=0;nextTurn();break;
    case 'pick':{
      const c=ui.cur;if(c.out)break;
      const i=+b.dataset.i;
      if(optInfo(run,c.ev,i).locked)break;
      c.pick=i;c.out=resolve(run,c.ev,i,meta);
      if(c.out.unlock)saveMeta();
      render(false);
      const nb=app.querySelector('[data-act="cont"]');if(nb)nb.focus({preventScroll:true});
      break;}
    case 'cont':afterContinue();break;
  }
});
render();

</script>
</body>
</html>
