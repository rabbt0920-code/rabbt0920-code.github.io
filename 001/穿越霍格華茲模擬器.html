<title>穿越霍格華茲模擬器</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1218;--bg2:#161a23;--card:#1b202b;--card2:#222937;--line:#2d3546;
  --text:#ece6d6;--mute:#9ba2b0;--gold:#d9b45b;--gold-d:#8a7036;--jade:#6cc1a6;--red:#e2674d;--blue:#7fa6e0;
  --r:14px;--hi:var(--hi);--tint:#212a3d;--btn1:#e5c570;--btn2:#c49a3e;--btnb:#e9cf85;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);
  background:radial-gradient(1100px 520px at 50% -8%,var(--tint) 0%,rgba(15,18,24,0) 70%),var(--bg);
  font:16px/1.75 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-weight:700;letter-spacing:.05em;margin:0;line-height:1.35}
p{margin:0 0 .7em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h2[tabindex]:focus{outline:none}
#app{max-width:780px;margin:0 auto;padding:18px 16px 72px}
.muted{color:var(--mute)}.small{font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:14px 0}
.card h2{font-size:1.35rem;margin-bottom:.5em}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:46px;padding:10px 22px;border-radius:999px;
  border:1px solid var(--line);background:var(--card2);transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--gold-d);background:#29324a}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#1a1405;border-color:var(--btnb);font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* 標題頁 */
.title{text-align:center;padding:44px 0 8px}
.kicker{letter-spacing:.4em;color:var(--gold);font-size:.85rem;margin-bottom:.8em}
.title h1{font-size:clamp(2.1rem,8vw,3.2rem);margin-bottom:.4em}
.lead{max-width:34em;margin:0 auto 1.6em;color:#cfc9b8}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0;text-align:left}
.goal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.goal b{font-family:'Noto Serif TC',serif;font-size:1.1rem;display:block}
.goal.done{border-color:var(--gold-d);background:linear-gradient(180deg,#262313,var(--card))}
.goal .tag{font-size:.8rem;color:var(--gold)}
.stampline{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-size:.9rem;color:var(--mute);margin:16px 0}
details.reset{margin-top:28px;font-size:.88rem;color:var(--mute)}
details.reset summary{cursor:pointer;display:inline-block;padding:6px}

/* 詞條與配點 */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.sec-h h3{font-size:1.1rem}
.counter{color:var(--gold);font-weight:700}
.traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.trait{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:76px;transition:border-color .15s,background .15s}
.trait b{display:block;font-family:'Noto Serif TC',serif}
.trait span{font-size:.85rem;color:var(--mute);display:block;line-height:1.5}
.trait:hover:not(:disabled){border-color:var(--gold-d)}
.trait.on{border-color:var(--gold);background:#2b2a1f}
.trait.on b::after{content:' ✓';color:var(--gold)}
.trait.rare b{color:var(--gold)}
.trait:disabled{opacity:.5;cursor:not-allowed}
.trait.locked{border-style:dashed}
.alloc{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:4.2em 1fr auto;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.arow .nm{font-family:'Noto Serif TC',serif}
.arow .pv{font-size:.82rem;color:var(--mute)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);font-size:1.2rem;line-height:1}
.stepper button:hover:not(:disabled){border-color:var(--gold)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:1.6em;text-align:center;font-weight:700}

/* HUD */
.hud{position:sticky;top:0;z-index:5;background:rgba(15,18,24,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:-18px -16px 6px;padding:12px 16px}
.hud-top{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.age{font-family:'Noto Serif TC',serif;font-size:2rem;font-weight:700;color:var(--gold);line-height:1}
.age-u{font-size:.8rem;color:var(--mute);margin-left:2px}
.realm b{font-family:'Noto Serif TC',serif;font-size:1.1rem}
.realm small{color:var(--mute);display:block;font-size:.78rem;line-height:1.4}
.hud .meta{text-align:right;font-size:.78rem;color:var(--mute);line-height:1.5}
.bar{display:block;height:6px;border-radius:99px;background:#2a3142;overflow:hidden}
.bar u{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .5s}
.bar.xp u{background:linear-gradient(90deg,var(--gold-d),var(--gold))}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.stat{font-size:.82rem;color:var(--mute);line-height:1.3}
.stat b{display:block;font-size:1.15rem;color:var(--text)}
.stat .bar{height:4px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;font-size:.76rem;line-height:1.5;padding:1px 9px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--mute);white-space:nowrap}
.chip.gold{color:var(--gold);border-color:var(--gold-d)}
.chip.danger{color:#ff9a85;border-color:#7b3a2e;background:#2a1713}
.chip.lock{color:#ffd48a;border-color:#6f5a2a}
.chip.cost{color:#e8c46a}
.chip.st-bold{color:#f0a48f}.chip.st-diligent{color:#8fc9ff}.chip.st-timid{color:#c6b4f0}.chip.st-careful{color:#9bdcbc}

/* 事件 */
.event .passive{color:var(--mute);font-size:.86rem;margin-bottom:.8em}
.etext{font-size:1.04rem;color:#ddd7c6}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--gold-d);background:#283148}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt:disabled{opacity:.55;cursor:not-allowed}
.olabel{display:block;font-weight:500}
.ometa{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.result{margin-top:16px;border-top:1px dashed var(--line);padding-top:16px}
.roll{font-size:.86rem;color:var(--mute);margin-bottom:.6em}
.roll strong{color:var(--text)}
.roll b{padding:1px 10px;border-radius:99px;margin-left:6px;font-weight:700}
.band-g .roll b{background:#2d4a3d;color:#9df0cc}
.band-k .roll b{background:#2c3f53;color:#a9d1ff}
.band-f .roll b{background:#4a3f25;color:#ffd48a}
.band-b .roll b{background:#4d2a22;color:#ffa391}
.rtext{font-size:1.04rem}
.pextra{color:var(--gold);border-left:3px solid var(--gold-d);padding-left:12px;margin:.8em 0}
.survive{color:#9df0cc;border-left:3px solid #3b7a62;padding-left:12px}
.fx{list-style:none;padding:0;margin:.6em 0 0;display:flex;flex-wrap:wrap;gap:6px}
.fx li{font-size:.84rem;padding:2px 10px;border-radius:99px;border:1px solid}
.fx li.up{color:#9df0cc;border-color:#2f6a55;background:#142a23}
.fx li.down{color:#ffa391;border-color:#7b3a2e;background:#2a1713}
.unlock{margin-top:12px;padding:10px 14px;border:1px solid var(--gold-d);border-radius:12px;background:#262313;color:var(--gold)}
.dead{color:#ffa391;font-family:'Noto Serif TC',serif;font-size:1.1rem;margin-top:12px}

/* 一般元件 */
.pbox{display:grid;gap:12px;margin-top:14px}
.pcard{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pcard:hover{border-color:var(--gold)}
.pcard b{font-family:'Noto Serif TC',serif;font-size:1.2rem;color:var(--gold)}
.birth-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.birth-grid .card{margin:0}
.birth-grid h3{font-size:1.05rem;color:var(--gold);margin-bottom:.2em}
.endtitle{font-size:clamp(1.8rem,6vw,2.6rem);color:var(--gold);margin:.2em 0}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.sum div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.84rem;color:var(--mute)}
.sum b{display:block;color:var(--text);font-size:1.05rem}
.story p{font-size:1.04rem;line-height:1.95}
.story em{color:var(--gold);font-style:normal}
details.log{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px}
details.log summary{cursor:pointer;padding:10px 0;color:var(--mute)}
.log ol{margin:0;padding:0 0 10px 0;list-style:none;display:grid;gap:10px}
.log li{font-size:.9rem;color:var(--mute);border-left:2px solid var(--line);padding-left:12px}
.log li b{color:var(--text)}
.toast{color:var(--gold);font-size:.9rem}

@media (max-width:560px){
  .goals,.birth-grid{grid-template-columns:1fr}
  .hud-top{grid-template-columns:auto 1fr}
  .hud .meta{grid-column:1/3;text-align:left;display:flex;gap:12px;flex-wrap:wrap}
  .stats{gap:4px}
  .stat{font-size:.74rem}
  .arow{grid-template-columns:3.6em 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.hero{max-width:560px;margin:0 auto 18px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.hero svg{display:block;width:100%;height:auto}
.title{padding-top:20px}
[data-focus]:focus:not(:focus-visible){outline:none}
.title h1:focus{outline:none}

.courses{margin:10px 0 4px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:rgba(255,255,255,.02)}
.courses summary{cursor:pointer;color:var(--gold);font-size:.9rem}
.cgrid{display:grid;grid-template-columns:1fr;gap:4px;margin-top:8px}
.crow{display:grid;grid-template-columns:7.5em 1fr 3em;align-items:center;gap:8px;font-size:.88rem}
.crow small{margin-left:4px;color:var(--jade);font-size:.7rem}
.crow b{text-align:right;color:var(--text)}
.hrow{display:flex;flex-wrap:wrap;gap:6px}
.hcell{font-size:.8rem;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--mute)}
.hcell.me{border-color:var(--gold);color:var(--gold)}

.capnote{font-size:.74rem;color:var(--mute);margin:6px 0 0}
.resume{margin:10px auto;max-width:420px}
.stage{font-size:.78rem;letter-spacing:.08em;color:var(--hi);margin:0 0 6px;display:flex;align-items:center;gap:10px}
.stage.fr{color:#ffa3c4}
.pips{display:inline-flex;gap:4px}.pips i{width:18px;height:4px;border-radius:2px;background:var(--line)}.pips i.on{background:var(--hi)}
.event.major{border-color:#7a5a2a;box-shadow:0 0 0 1px #7a5a2a55,0 8px 30px #0006}
.duel{margin:4px 0 10px;padding:10px 12px;border-radius:12px;background:#0003;border:1px solid var(--line)}
.duel-h{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--mute);margin-bottom:6px}
.duel-h b{color:var(--hi);letter-spacing:.15em}
.dice{display:flex;justify-content:center;gap:14px;font-size:2.4rem;line-height:1;margin:2px 0 8px}
.die{display:inline-block;animation:roll .75s cubic-bezier(.2,.8,.3,1.2) both}
.die.d2{animation-delay:.08s}
@keyframes roll{0%{transform:translateY(-18px) rotate(-540deg) scale(.6);opacity:0}70%{opacity:1}100%{transform:none}}
.tug{position:relative;height:12px;border-radius:99px;background:#5a2a24;overflow:hidden}
.tug i{position:absolute;left:0;top:0;bottom:0;width:var(--w);background:linear-gradient(90deg,#3d7bd6,#7fc4ff);animation:tug 1s .55s ease-out both;border-right:2px solid #fff}
@keyframes tug{from{width:50%}to{width:var(--w)}}
.tug-l{display:flex;justify-content:space-between;font-size:.76rem;color:var(--mute);margin-top:4px}
.duel.big .tug{height:16px}
.duel+.roll b,.duel ~ .rtext{animation:fadein .4s .9s both}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.duel.big.db-g{animation:glow 1.4s 1s both}
@keyframes glow{0%{box-shadow:0 0 0 #9df0cc00}40%{box-shadow:0 0 26px #9df0cc88}100%{box-shadow:0 0 0 #9df0cc00}}
.duel.big.db-b,.duel.big.db-f{animation:shake .5s 1s both}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.tline{list-style:none;padding:0 0 0 14px;margin:6px 0 10px;border-left:2px solid var(--line)}
.tline li{position:relative;padding:4px 0 8px 10px;display:flex;flex-direction:column;gap:1px;font-size:.88rem}
.tline li::before{content:'';position:absolute;left:-21px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tline li.b-g::before{background:#9df0cc}.tline li.b-k::before{background:#a9d1ff}.tline li.b-f::before{background:#ffd48a}.tline li.b-b::before{background:#ffa391}
.tl-m{font-size:.72rem;color:var(--mute)}
.hist summary{cursor:pointer}.life{margin:8px 0;padding:6px 0;border-top:1px solid var(--line)}.life>summary{cursor:pointer;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.die,.tug i,.duel,.duel+.roll b,.duel ~ .rtext{animation:none!important}}

.chip.item{border-color:#6a5a8a;color:#d9c8ff}
.chip.help{border-color:#2f6a55;color:#9df0cc}
.felix{margin:6px 0 10px}
.epi{margin:14px 0;padding:12px 14px;border-radius:12px;border:1px solid #7a5a2a;background:#2a22140f}
.epi h3{margin:0 0 6px;color:var(--hi)}

.notice{margin:-2px 0 12px;padding:8px 12px;border-radius:10px;border:1px solid #7a5a2a;background:#3a2c1426;color:var(--hi);font-size:.9rem}

.why{font-size:.8rem;color:var(--mute);font-style:italic;margin:-.3em 0 .8em;opacity:.9}
.result .why{margin:.2em 0 .6em}
/* 學院主題色 */
body[data-house]{transition:background .6s}
body[data-house="g"]{--gold:#e3a94a;--gold-d:#8e3a2a;--hi:#ffc27a;--tint:#3d1c1c;--btn1:#e9b158;--btn2:#b3402e;--btnb:#f0c070;--line:#3a2a2d}
body[data-house="r"]{--gold:#8fb3f0;--gold-d:#35507e;--hi:#d6ad74;--tint:#17264a;--btn1:#a9c4f2;--btn2:#4d73b5;--btnb:#c9b089;--line:#2a3550}
body[data-house="s"]{--gold:#7fd0a5;--gold-d:#2a6a4a;--hi:#cdd6de;--tint:#132c22;--btn1:#a7e0c0;--btn2:#3f8d66;--btnb:#c6d0d8;--line:#253a33}
body[data-house="h"]{--gold:#f0cb4e;--gold-d:#7a6322;--hi:#f5d873;--tint:#2f2914;--btn1:#f5d873;--btn2:#c9a032;--btnb:#f8e29a;--line:#3a3524}
body[data-house] .hud{box-shadow:inset 0 3px 0 var(--gold-d)}
body[data-house] .event.major{border-color:var(--gold-d);box-shadow:0 0 0 1px var(--gold-d),0 8px 30px #0006}
body[data-house] .pips i.on{background:var(--gold)}

.career{margin:14px 0;padding:14px 16px;border-radius:12px;border:1px solid var(--gold-d);background:linear-gradient(135deg,#ffffff08,#00000000)}
.career h3{margin:2px 0 6px;color:var(--hi);font-size:1.3rem}

/* 結局 CG */
.cg{margin:-20px -20px 16px;border-radius:var(--r) var(--r) 0 0;overflow:hidden;border-bottom:1px solid var(--line);line-height:0}
.cg svg{width:100%;height:auto;display:block;aspect-ratio:400/220}
.cg .tw{animation:cgtw 3s ease-in-out infinite}
@keyframes cgtw{50%{opacity:.25}}
.cg .float{animation:cgfl 4s ease-in-out infinite}
@keyframes cgfl{50%{transform:translateY(-4px)}}
.cg .pulse{animation:cgpu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cgpu{50%{opacity:.08;transform:scale(1.25)}}
.cg .spin{animation:cgsp 18s linear infinite}
@keyframes cgsp{to{transform:rotate(360deg)}}
.cg .burst{animation:cgbu 3.5s ease-out infinite;opacity:0}
@keyframes cgbu{0%{opacity:0;transform:scale(.3)}15%{opacity:1}60%{opacity:0;transform:scale(1.2)}100%{opacity:0}}
.cg .rise{animation:cgri 6s linear infinite;opacity:0}
@keyframes cgri{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-120px)}}
.cg .flash{animation:cgfa 5s steps(1) infinite;opacity:0}
@keyframes cgfa{0%,88%{opacity:0}90%{opacity:1}92%{opacity:0}94%{opacity:.8}96%,100%{opacity:0}}
.cg .rain{animation:cgra .8s linear infinite}
@keyframes cgra{to{transform:translate(-4px,12px)}}
@media (prefers-reduced-motion:reduce){.cg *{animation:none!important}.cg .burst,.cg .rise{opacity:.7}.cg .flash{opacity:0}}

</style>
</head>
<body>
<main id="app"></main>
<script>
// ===== data.js：遊戲資料（詞條、出身、常數） =====
const SK={悟:'魔法天賦',體:'體魄',人:'人緣',心:'意志',金:'家底'};
const SKEYS=['悟','體','人','心','金'];
const MONTHS=['九月','十月','十一月','十二月','一月','二月','三月','四月','五月','六月','七月','八月'];
const YEARN=['','一年級','二年級','三年級','四年級','五年級','六年級','七年級'];
const LAST_MONTH=84, POST_MAX=12;      // 七年學制；擊敗佛地魔後可再延長最多 12 個月
const CLUE_NEED=5, CLUE_MAX=7, HX_MAX=4;

    k:R('援兵晚了一點，但還是來了。',{人:1}),
    f:R('你找了半天找不到人，只好在原地乾著急。',{人:-1})}),
  O('留在後方，替受傷的人包紮','timid',['心',12],{

{id:'m_duel',mm:16,t:'十二月・決鬥俱樂部',text:'二年級，城堡裡忽然開了一間決鬥俱樂部，指導老師是一位笑得露出十六顆牙的金髮教授。你被拉上決鬥臺，對面是一個你不認識的高年級生。他的眼神說：「我要贏你。」',o:[

  O('主動認輸，保全顏面','timid',null,R('你舉手認輸，臺下哄堂大笑，但你的朋友替你拍了拍背：「識時務者為俊傑。」',{人:1,心:-1}))
]},
{id:'m_chamber',mm:22,t:'六月・密室',text:'城堡裡的學生一個接一個變成了石頭。牆上用血寫著：「密室已經被打開。」你手裡捏著一本不起眼的舊日記，它似乎有自己的想法。地下深處，有一頭不該存在的東西在爬行。',o:[
  O('帶著魔杖下去查探','bold',['體',16],{
    g:R('你在黑暗中找到了通往密室的入口，並用一把不起眼的劍擊敗了那條巨蛇。日記在你面前化為灰燼——一個「魂器」的秘密，你已經記住了。',{體:2,心:2,人:2},{hx:1,flag:'chamberHero',unlock:'u_phoenix'}),

  O('聯絡教授，召集隊伍','careful',['人',15],{

    k:R('教授們來得有點晚，但還是趕上了。',{人:1}),

  O('留在安全的地方，替同學護航','timid',['心',14],{
    g:R('你守在醫療翼，替每一個被送來的石像守夜。直到曼德拉草完成，你一個也沒讓人出事。',{心:2,人:2}),
    k:R('你默默守著，也算盡了一份力。',{心:1}),
    f:R('你怕得不敢出門，只能躲在床底。',{心:-1})})
]},
{id:'m_dementor',mm:28,t:'十二月・催狂魔',text:'三年級的冬天，監獄逃出了一個危險的人物，城堡周圍派來了一群飄浮的黑影。它們吸走快樂，只留下一個學生最不想回想的畫面。你在走廊上遇到一隻，它正朝你緩緩靠近。',o:[
  O('回想一個最快樂的瞬間','diligent',['心',15],{
    g:R('你想到了回家吃的第一頓火鍋。一道微弱的銀光從你的魔杖尖端迸出，催狂魔縮了回去。',{心:2,悟:1},{unlock:'u_patronus'}),
    k:R('你勉強想起一個快樂的回憶，催狂魔緩緩後退，你虛脫地坐在地上。',{心:1}),

  O('拔腿就跑','timid',['體',13],{

  O('找朋友一起站著','careful',['人',14],{
    g:R('你拉著朋友圍成一個圈，大家同時想起快樂的事。催狂魔在圈外轉了好幾圈，終於放棄。',{人:2,心:1}),
    k:R('朋友的陪伴讓你稍稍安穩。',{人:1}),
    f:R('朋友被嚇得當場跑掉，留你一個人面對。',{人:-1,心:-1})}),
  O('硬著頭皮用咒語對抗','bold',['悟',15],{

    k:R('咒語把它逼退了一點，但你的魔力也見底了。',{悟:1}),
    f:R('咒語沒起作用，你被它吸走了一大塊精神。',{心:-2})})
]},
{id:'m_shack',mm:34,t:'六月・尖叫屋與時間轉換器',text:'三年級的期末，一個長髮的男人出現在尖叫屋。事情比你想的更複雜：有人被冤枉，有人需要被救，而你的朋友手上，恰好有一個能把時間倒回幾個小時的小玩意兒。',o:[
  O('跟著主角團一起去尖叫屋','bold',['體',15],{
    g:R('你在尖叫屋裡冒死擋住了狼人，替大家爭取了寶貴的幾秒。事後，你多了一個從不認識的朋友。',{體:2,心:2,人:2},{flag:'shackHero'}),
    k:R('你跟著一起行動，雖然沒幫上大忙，但也沒添亂。',{體:1,心:1}),

    k:R('你看懂了一部分，也記下了幾個重要的筆記。',{悟:1},{clue:1}),

  O('設法讓所有人平安離開','careful',['人',14],{
    g:R('你在關鍵時刻，說服各方暫時休戰。這是你這輩子說過最有分量的一句話。',{人:3,心:1}),
    k:R('你調停了一部分，沒有人受重傷。',{人:1}),

    f:R('你被抓到「睡過頭」，罰寫了十頁悔過書。',{心:-1})})
]},
{id:'m_ball',mm:40,t:'十二月・耶誕舞會',text:'四年級的聖誕舞會，整個城堡掛滿了彩帶，連費契都被迫打了領結。你需要一個舞伴、一件像樣的長袍，以及一個讓自己不丟臉的計畫。',o:[

    f:R('甜點被搶光，你尷尬地站在牆邊。',{人:-1})}),
  O('留在公共休息室，讀書','diligent',['悟',14],{

{id:'m_grave',mm:46,t:'六月・第三項任務',text:'四年級的終點是一座迷宮。有人在裡面設了陷阱，一個你不認識的聲音說：「這次的獎盃，被動了手腳。」當你們同時伸手握住它，世界變成了一片暗綠色的墓園。',o:[

    f:R('你的咒語被反彈，自己倒在地上。',{體:-1,悟:-1}),
    b:R('對方的魔力遠超你想像。',{},{die:'在墓園中被敵人擊殺'})}),
  O('冷靜觀察，找脫身機會','careful',['心',16],{

    k:R('你找到機會逃了出來，驚魂未定。',{心:1}),
    f:R('你判斷錯了時機，被抓了個正著。',{體:-2})}),
  O('把獎盃遞給對方，換取性命','timid',null,R('你舉起雙手，把獎盃放在地上。對方沒有立刻動手，你們被允許離開。這次的選擇，沒有人會誇你，但你活下來了。',{心:-1,人:-1}))
]},
{id:'m_da',mm:52,t:'十二月・鄧不利多軍',text:'五年級，魔法部派來了一位穿粉紅色開襟毛衣的新老師，她的口頭禪是「請保持安靜」。學校裡的魔法課變成了朗讀課本。有人在偷偷組織地下社團，帶頭的人看著你：「你要不要來？」',o:[

  O('向那位老師告密，換取好處','careful',['人',16],{

{id:'m_ministry',mm:58,t:'六月・神秘事務司',text:'五年級的期末，幾個朋友衝進魔法部深處，說有人被困。那裡有一個放著預言球的大廳、一間只有時間流動的房間，以及一道沒人敢碰的石拱門。你站在入口，所有人都在等你做決定。',o:[
  O('跟著衝進去，一起救人','bold',['體',18],{
    g:R('你在無數咒語中保護了幾個同伴。關鍵時刻，一位熟悉的長輩趕到，替大家擋下最後一擊。',{體:2,心:2,人:2},{flag:'ministryHero'}),
    k:R('你和同伴們一起撐了下來，雖然傷痕累累。',{體:-1,心:1,人:1}),
    f:R('你被敵人的咒語擊中，暈了過去。',{體:-2}),

  O('留在外面，替大家望風','timid',['心',15],{

  O('聯絡外面的援軍','careful',['人',17],{

]},
{id:'m_memory',mm:64,t:'十二月・記憶的碎片',text:'六年級的冬天，新來的魔藥學教授正在收集「有趣的學生」，他每週辦一次小型晚宴。校長悄悄把你拉到一旁：「有一段記憶，我需要你幫我拿到。」那不是一件容易的事。',o:[
  O('靠社交手腕，套出記憶','careful',['人',18],{

    k:R('你花了一個晚上，拿到了記憶的一部分。',{人:1},{hx:1}),
    f:R('教授看穿了你的目的，委婉地把你請了出去。',{人:-1})}),
  O('偷偷潛入他的辦公室','bold',['悟',18],{

    k:R('你找到了一部分，但留下了一點痕跡。',{悟:1},{hx:1}),

  O('在遠處記筆記','diligent',['悟',9],{k:R('你畫了一幅漂亮的素描，教授額外加了分。',{悟:1}),f:R('你畫得太抽象，被教授批評。',{})}),
  O('找隊友一起互相照應','timid',['人',9],{k:R('你們分工合作，順利完成任務。',{人:1}),f:R('你們被火蜥蜴追得滿場跑。',{體:-1})})
]},
{id:'e_ghost',rep:true,t:'走廊上的幽靈',y:[1,7],w:1,text:'你在走廊轉角差點撞上一位半透明的先生，他正在抱怨自己的頭又掉下來了。',o:[
  O('熱情打招呼，和他聊天','careful',['人',9],{k:R('他和你聊了一整個下午，把這座城堡的八卦全告訴了你。',{人:1,悟:1}),f:R('他一句話也不想和你說。',{})}),
  O('嚇得愣在原地','timid',null,R('你在走廊上愣了三分鐘，他飄走時還友善地揮手。',{心:-1})),
  O('請教他一些歷史','diligent',['悟',10],{k:R('他講了好幾個你在書上找不到的歷史細節。',{悟:1}),f:R('他說得顛三倒四，你什麼也沒聽懂。',{})})
]},
{id:'e_exam',rep:true,t:'期中小考',y:[1,6],w:1.3,text:'這是一場「不用太緊張」的測驗，但整座城堡都在緊張。你的同桌正在念咒語，聲音大到快把你的筆都震掉。',o:[
  O('穩紮穩打，按部就班','diligent',['悟',10],{g:R('你考出了前三名，被教授點名表揚。',{悟:2,人:1}),k:R('成績不錯，沒有失誤。',{悟:1}),f:R('你粗心大意，丟了不該丟的分。',{悟:-1})}),
  O('憑直覺亂答','bold',['心',11],{k:R('居然蒙對了不少題。',{悟:1}),f:R('你的答案一片慘不忍睹。',{悟:-1,人:-1})}),
  O('找老師討要筆記重點','careful',['人',10],{k:R('老師看了你一眼，給了你一些暗示。',{悟:1,人:1}),f:R('老師說：「自己看書。」',{人:-1})})
]},
{id:'e_stairs',t:'會移動的樓梯',y:[1,2],w:1.3,text:'樓梯又換了方向。你站在半空中的平台上，旁邊的畫像笑嘻嘻地看著你：「年輕人，需要幫忙嗎？」',o:[
  O('請畫像指路','careful',['人',8],{k:R('畫像把你送到了目的地，還順便八卦了幾句。',{人:1}),f:R('畫像故意指了錯誤方向。',{})}),
  O('憑感覺跳向下一個平台','bold',['體',9],{k:R('你跳過去了，心跳得像擂鼓。',{體:1,心:1}),f:R('你摔了個屁股墩，樓梯還在你腳下動來動去。',{體:-1})}),
  O('等樓梯自己轉回來','timid',null,R('你在平台上坐了半小時，終於等到了回程的樓梯。',{心:1}))
]},
{id:'e_friend',t:'新朋友',y:[1,2],w:1.5,nf:['trio','potter'],text:'你在餐桌上，遇見了三個很特別的新生：一個戴眼鏡的男孩、一個紅頭髮的男孩、一個一直在背課本的女孩。他們正在討論某個禁止進入的走廊。你很熟悉這個畫面。',o:[
  O('主動加入他們的談話','bold',['人',10],{g:R('你自然地融入了他們的小圈子。之後的日子，你多了三個一起闖禍的朋友。',{人:2,心:1},{flag:'trio'}),k:R('他們對你不算冷淡，你成了這個小團體的邊緣成員。',{人:1},{flag:'trio'}),f:R('你說錯了一句話，氣氛瞬間尷尬。',{人:-1})}),
  O('遠遠觀察','careful',['心',9],{k:R('你看了一會兒，發現這個故事和你記憶裡的差不多。你默默收起了好奇心。',{心:1}),f:R('你被發現了，被當成偷窺狂。',{人:-1})}),
  O('走開，不想捲入主線','timid',null,R('你選擇了「路人甲」的生活，這讓你輕鬆很多。',{心:1}))
]},
{id:'e_detention',t:'禁閉室的故事',y:[2,6],w:1,text:'你因為一次小失誤被罰留校。教授給了你一堆羊皮卷，要你一份份分類。',o:[
  O('老老實實做完','diligent',['心',10],{k:R('你分類得整整齊齊，教授在清單上留下一個「還行」。',{悟:1,心:1}),f:R('你搞混了一半，整個下午白做。',{})}),
  O('偷偷看羊皮卷的內容','careful',['悟',11],{k:R('你在羊皮卷裡發現了一個很有意思的故事。',{悟:1}),f:R('你被抓到偷看，被罰多留一週。',{人:-1})}),
  O('找朋友幫忙','timid',['人',10],{k:R('朋友們來陪你，一起做完了。',{人:2}),f:R('朋友嫌麻煩，沒人來。',{人:-1})})
]},
{id:'e_rumor',rep:true,t:'城堡的八卦',y:[2,7],w:1,text:'整座城堡都在傳一個消息：有人看見了不該看的東西。每個人說的版本都不太一樣，但都非常精彩。',o:[
  O('加入八卦，繪聲繪影','careful',['人',10],{k:R('你的版本最精彩，被大家傳了一圈。',{人:2}),f:R('你傳錯了人，鬧出一場誤會。',{人:-2})}),
  O('追查真相','diligent',['悟',11],{k:R('你查出來了，八卦是假的。你在朋友圈裡多了一個「靠譜」的稱號。',{悟:1,人:1}),f:R('你查了很久，什麼也沒查到。',{})}),
  O('不管，專心做自己的事','timid',null,R('你什麼也沒說，一個月後，大家早就換了新八卦。',{心:1}))
]},
{id:'e_dada',rep:true,t:'黑魔法防禦課',y:[1,7],w:1.3,text:'這堂課的老師，好像每年都不一樣，而且每一個都有點不對勁。今天要練習的咒語是「繳械咒」。',o:[
  O('主動示範','bold',['悟',11],{g:R('你一次成功，教授帶頭鼓掌。',{悟:2,人:1}),k:R('你示範得不錯，雖然有點慌張。',{悟:1}),f:R('你的咒語打偏了，砸到了天花板的吊燈。',{人:-1})}),
  O('認真記筆記，等別人先試','diligent',['悟',10],{k:R('你的筆記又整齊又全面，成了同學們爭相借閱的對象。',{悟:1,人:1}),f:R('輪到你的時候，你的緊張壓過了一切。',{悟:-1})}),
  O('和同伴互相練習','timid',['人',10],{k:R('你們練了一個下午，最後都學會了。',{人:1,悟:1}),f:R('同伴把你的魔杖打飛了。',{人:-1})})
]},
{id:'e_broom',t:'飛行課',y:[1,3],w:1.2,text:'一把看起來隨時會散架的掃帚躺在你腳邊。教練說：「手掌向下，大聲喊『起來』！」',o:[
  O('用盡全力大喊','bold',['體',9],{g:R('掃帚瞬間跳到你手上，你成了全班第一。',{體:2,人:1}),k:R('掃帚跳了兩下，最終乖乖到了你手裡。',{體:1}),f:R('掃帚滾到了旁邊，一直沒反應。',{人:-1})}),
  O('輕聲細語，溫柔地叫它','diligent',['心',9],{k:R('掃帚慢慢飄到你手上。你覺得它大概也有尊嚴。',{心:1}),f:R('它假裝沒聽見。',{})}),
  O('偷偷看旁邊同學怎麼做','careful',['人',9],{k:R('你學到了訣竅，順利完成。',{人:1}),f:R('同學也在看你，結果兩個人都失敗了。',{})})
]},
{id:'e_rival',t:'金髮少爺的挑釁',y:[1,5],w:1.6,text:'一個金髮、一臉「我是這裡最了不起的人」的少爺，擋住了你的路：「喂，你知道我是誰嗎？」',o:[
  O('反唇相譏','bold',['人',10],{g:R('你一句話把他嗆得面紅耳赤，周圍的人偷笑。',{人:2,心:1},{flag:'rival'}),k:R('你和他鬥了幾句，不分勝負。',{人:1},{flag:'rival'}),f:R('他的跟班們一擁而上，你吃了點小虧。',{體:-1,人:-1},{flag:'rival'})}),
  O('客氣回答，保持距離','careful',['人',9],{k:R('他愣了一下，擺擺手放你走。他看你的眼神裡多了幾分好奇。',{人:1},{flag:'rival'}),f:R('他以為你怕他，更囂張了。',{人:-1},{flag:'rival'})}),
  O('無視他，繼續走','timid',['心',9],{k:R('你頭也不回地離開，他被晾在原地。',{心:1},{flag:'rival'}),f:R('他在背後大聲嘲笑你。',{人:-1},{flag:'rival'})})
]},
{id:'x_rival1',fr:true,t:'少爺的另一面',hs:'史萊哲林',fl:['rival'],nf:['rf1'],y:[1,6],w:2.2,text:'同在史萊哲林，他想裝作不認識你也不行。公共休息室裡，他一個人坐在壁爐邊，手裡捏著一封剛拆開的家書，臉色難看得很。',o:[
  O('遞一杯熱茶，什麼都不問','timid',['人',9],{k:R('他盯著那杯茶看了很久，小聲說了句「……多謝」。這大概是他第一次對人說這兩個字。',{人:1,心:1},{flag:'rf1'}),f:R('他把茶推開：「我不需要你可憐。」但眼神軟了一下。',{},{flag:'rf1'})}),
  O('開口問怎麼了','bold',['人',10],{k:R('他嘴硬了幾句，最後還是吐出幾句：父親對他期望太高，每封信都是責備。',{人:1,心:1},{flag:'rf1'}),f:R('他惱羞成怒地瞪你：「關你什麼事！」但沒有走開。',{人:-1},{flag:'rf1'})}),
  O('假裝沒看見，在旁邊讀書','careful',['心',9],{k:R('你們各自安靜待著。他後來默默把位子往你這邊挪了一點。',{心:1},{flag:'rf1'}),f:R('他以為你在偷看信，狠狠地把信收了起來。',{},{flag:'rf1'})})
]},
{id:'x_rival2',fr:true,t:'少爺的麻煩',hs:'史萊哲林',fl:['rf1'],nf:['rf2'],y:[2,6],w:2.2,text:'他在走廊上被幾個別院的學生堵住，他們笑話他的家世，他卻嘴硬得發抖。你剛好路過。',o:[
  O('站到他身邊','bold',['體',11],{g:R('你一句話都沒多說，只是站在那裡。對方識趣地散了。他別過臉：「……我沒有要你幫忙。」嘴角卻在抖。',{人:2,心:1},{flag:'rf2',pts:2}),k:R('場面僵持了一會，對方悻悻離開。',{人:1},{flag:'rf2'}),f:R('你們雙雙吃了虧，卻在狼狽中第一次相視而笑。',{體:-1,人:1},{flag:'rf2'})}),
  O('找老師來解圍','careful',['人',11],{k:R('老師及時趕到。他不爽被人救，卻在隔天默默替你留了位子。',{人:1},{flag:'rf2'}),f:R('老師來晚了一步，他因此對你有點埋怨。',{},{flag:'rf2'})}),
  O('裝作路過，走開','timid',null,R('你走開了。他沒看你，也沒說話。有些東西，就這樣錯過了。',{人:-1},{flag:'rfx',unflag:'rf1'}))
]},
{id:'x_rival3',fr:true,key:true,t:'少爺的決定',hs:'史萊哲林',fl:['rf2'],nf:['rf3'],y:[3,6],w:2.2,text:'學年末，他把你叫到湖邊。「我父親要我選邊站。」他看著湖面，聲音很輕，「……你覺得，我該聽他的嗎？」',o:[
  O('說「做你自己認為對的」','bold',['心',12],{g:R('他沉默了很久，終於笑了：「你這個傢伙，真麻煩。」從那天起，他不再只是你的『同學』，而是真正的朋友。',{心:2,人:2},{flag:'rf3'}),k:R('他點了點頭，雖然還沒下定決心，卻說：「謝謝你聽我說。」',{心:1,人:1},{flag:'rf3'}),f:R('他苦笑：「說得容易。」但仍記著你的話。',{心:-1},{flag:'rf3'})}),
  O('說「不管你怎麼選，我都在」','timid',['人',11],{k:R('他別過頭去，肩膀輕輕抖了一下。這句話，他大概等了很久。',{人:2,心:1},{flag:'rf3'}),f:R('他似乎想說什麼，最後只擠出一個笑。',{人:1},{flag:'rf3'})}),
  O('說「這是你自己的事」','careful',null,R('他愣了一下，點頭：「也是。」你們之間隔了一道看不見的牆。',{},{flag:'rf3'}))
]},
// ---------- 時間線索（回家用）----------
{id:'t_rune',t:'古代如尼文課',y:[3,7],earth:true,w:1,text:'你選修了「古代如尼文」。老師在黑板上寫下一組奇怪的符文，你越看越覺得眼熟——它們很像你在某個故事裡見過的時間魔法。',o:[
  O('課後留下來研究','diligent',['悟',11],{g:R('你破譯了其中一段，它描述了一種能讓「過去與現在重疊」的儀式。',{悟:2},{clue:1}),k:R('你記下了符文的樣子，雖然只看懂一半。',{悟:1}),f:R('你看得頭暈眼花。',{悟:-1})}),
  O('向老師請教','timid',['人',11],{k:R('老師說：「有意思的問題。」並借了你一本書。',{人:1}),f:R('老師說：「這不在大綱範圍內。」',{})}),
  O('不理它，繼續上課','careful',null,R('你把符文當成普通的課堂內容，筆記照記，沒有深入。',{悟:1}))
]},
{id:'t_dial',t:'閣樓的古怪日晷',y:[2,7],earth:true,w:1,text:'你在城堡的閣樓角落裡，發現了一座被灰塵蓋住的日晷。指針明明沒有太陽，卻在轉動。',o:[
  O('伸手摸一下','bold',['心',11],{g:R('指針忽然倒轉了一圈，你看見了一個一閃而過的畫面：你的家。',{心:1},{clue:1}),k:R('日晷微微發燙，你的腦海中閃過一段陌生的文字。',{悟:1}),f:R('日晷突然發光，你被彈了出去。',{體:-1})}),
  O('拍下它的樣子，帶去問老師','careful',['人',10],{k:R('老師看了一眼，表情有些奇怪：「這個東西……別亂碰。」',{人:1}),f:R('老師說那只是普通的裝飾。',{})}),
  O('用咒語解析','diligent',['悟',12],{g:R('你找到了日晷的運作邏輯，筆記多了一頁寶貴的資料。',{悟:2},{clue:1}),k:R('你解開了一部分。',{悟:1}),f:R('咒語被反彈。',{體:-1})})
]},
{id:'t_book',t:'禁書區的時間之書',y:[4,7],earth:true,w:1,text:'你在禁書區的最深處，發現了一本沒有書名的舊書，書頁邊緣微微發光。',o:[
  O('偷偷帶出去讀','bold',['人',12],{k:R('你在被窩裡讀了一個通宵，了解了不少時間魔法的基礎。',{悟:1}),f:R('管理員發現了書不見了，你被逮個正著。',{人:-2})}),
  O('留在原地抄錄','diligent',['悟',12],{g:R('你抄下了最重要的三頁，筆跡工整。',{悟:2},{clue:1}),k:R('你抄了一半，但記下了關鍵的部分。',{悟:1}),f:R('手酸得快斷了，只抄到半頁。',{體:-1})}),
  O('把書放回去，當作沒看見','timid',null,R('你放回書，心裡卻一直在想：這本書到底是什麼？',{心:-1}))
]},
{id:'t_prof',dalive:true,t:'校長的問題',y:[4,6],earth:true,w:0.9,text:'老校長在走廊上叫住了你，眼睛藏在半月形的眼鏡後面：「你最近，似乎對『時間』很有興趣？」',o:[
  O('坦白告訴他一切','timid',['心',12],{g:R('老校長沉默了很久：「我想，我知道你要找什麼。」他遞給你一張泛黃的紙。',{心:1,人:1},{clue:1}),k:R('他點了點頭：「明白了。」他沒有多說，但給了你一個提示。',{人:1}),f:R('他笑了笑：「年輕人，有些事情要靠自己找。」',{})}),
  O('裝傻，說只是好奇','careful',['人',12],{k:R('他半信半疑地放過了你，但眼神很深。',{人:1}),f:R('他看穿了你的謊，只是嘆了口氣。',{人:-1})}),
  O('反過來問他的看法','bold',['悟',12],{g:R('他被你的問題逗樂了，很認真地給了你一個啟發。',{悟:1,人:1},{clue:1}),k:R('他給了你一個意味深長的微笑。',{悟:1}),f:R('他說：「你還太年輕。」',{})})
]},
{id:'t_ghostsage',t:'老幽靈的證言',y:[3,7],earth:true,w:0.9,text:'一位已經在城堡裡待了五百年的老幽靈，漂到了你旁邊：「年輕人，你身上有『外面』的味道。」',o:[
  O('請他說說這個世界的傳說','careful',['人',11],{k:R('他講了一個關於「迷路的旅人」的老故事。你的心跳漏了半拍。',{人:1}),f:R('他講到一半睡著了。',{})}),
  O('追問他知道什麼','bold',['心',12],{g:R('他壓低聲音：「六百年前，也有人像你一樣。他最後……找到了出口。」',{心:1},{clue:1}),k:R('他給了你一些模糊的線索。',{心:1}),f:R('他沉默地飄走了。',{})}),
  O('敷衍幾句，走開','timid',null,R('你點點頭，禮貌地離開。',{}))
]},
{id:'t_diary',t:'前人留下的筆記',y:[1,7],earth:true,w:0.7,text:'你在一本舊魔藥課本的夾頁裡，發現了一張泛黃的紙，上面用你熟悉的語言寫著：「如果你也看得懂這行字，那你也是從那邊來的。」',o:[

  })};
}

  O('收下，發誓遵守規定','diligent',null,R('你把時光器掛在脖子上，冰涼的金屬貼著皮膚。你忍不住想：這玩意兒，也許是回家的線索之一。',{悟:1},{item:'turner'})),
  O('婉拒，你想靠自己','bold',null,R('院長看了你很久，點點頭：「有骨氣。」',{心:2}))
]},
{id:'cq_book',t:'二手的課本',y:[6,6],w:1.6,text:'新學期的魔藥課本不夠，教授讓你從櫃子裡挑一本舊的。你翻開其中一本，頁邊密密麻麻寫滿了手寫的改良配方，扉頁上寫著：「混血王子的財產」。',o:[
  O('就拿這本','careful',null,R('你照著頁邊的筆記熬藥，效果好得不可思議。只是有幾個手寫的咒語，旁邊標著「對付敵人用」，讓你有點發毛。',{悟:1},{item:'book'})),
  O('拿一本乾淨的新課本','timid',null,R('你選了一本乾淨的課本。有些祕密，還是不要碰比較好。',{心:1}))
]},
{id:'cq_black',t:'長髮男人的來信',y:[4,5],fl:['blackFriend'],w:2.6,text:'一隻色彩鮮豔的熱帶大鳥把一個包裹扔在你的早餐盤上。信是那個長髮男人寫的：「謝謝你當時站出來替我說話。這東西你留著，有麻煩就對著它喊我的名字。」包裹裡是一面小小的方鏡。',o:[
  O('立刻試試看','bold',null,R('你對著鏡子喊了一聲，鏡面裡出現一張咧嘴笑的臉：「這麼快就有麻煩啦？」',{心:1,人:1},{item:'mirror'})),
  O('回一封長長的信','diligent',null,R('你寫了三頁的信，連學院盃的分數都報告了。他回信說：「你比我當年乖多了。」',{人:1},{item:'mirror'}))
]},
{id:'cq_giant',t:'巨人的祕密',y:[4,6],fl:['giantFriend'],w:2.2,text:'當年在森林裡一起找生物的巨人，神祕兮兮地把你拉進他的小屋。壁爐裡，一顆黑色的大蛋正在微微晃動：「別告訴別人，好嗎？牠快孵出來了。」',o:[
  O('陪他一起等蛋孵化','timid',null,R('凌晨三點，一隻小火龍打了個噴嚏，燒掉了巨人的鬍子。你們笑到天亮。從此以後，他說你是他最好的朋友。',{人:1,心:1})),
  O('提醒他這是違法的，幫他想辦法','careful',['人',11],{k:R('你們聯絡到一位養龍的專家，小龍被平安送走了。巨人哭得像個孩子，說他欠你一次。',{人:2}),f:R('事情還是被發現了，你們一起被罰。巨人覺得很對不起你。',{人:-1})}),
  O('趁機學一點照顧魔法生物的知識','diligent',['悟',10],{k:R('你學會了怎麼辨認龍的情緒，這比課本有用多了。',{悟:1},{sk:{creatures:1}}),f:R('小龍咬了你一口。',{體:-1})})
]},
{id:'cq_ban',t:'禁足通知',y:[3,5],cond:r=>cntOf(r,'trouble')>=3,nf:['banned','pardoned'],w:3.5,text:'院長把一疊違規記錄摔在桌上：夜遊、惡作劇、作業沒交……「你知道這是第幾次了嗎？」他冷冷地說，「再這樣下去，活米村就別想去了。」',o:[
  O('誠懇道歉，保證改過','timid',['人',11],{g:R('院長沉默了很久，嘆了口氣：「最後一次。」他把記錄扔進了壁爐。',{人:1},{flag:'pardoned'}),k:R('院長勉強接受了，但說會盯著你。',{},{flag:'pardoned'}),f:R('院長不為所動：「這學期，你哪裡都別想去。」',{人:-1},{flag:'banned'})}),
  O('據理力爭：都是情有可原','bold',['心',12],{k:R('你說得頭頭是道，院長居然被說服了一半。',{心:1},{flag:'pardoned'}),f:R('院長聽完，又在你的記錄上多寫了一條。',{人:-1},{flag:'banned'})}),
  O('表面認錯，反正有地圖','careful',null,R('你乖乖低頭。院長禁止你去活米村——但你口袋裡的地圖，標著一條通往糖果店地下室的密道。',{},{flag:['banned','sneaky']}),{needItem:'map'})
]},
{id:'cq_kid2',t:'當年的新生',y:[5,6],fl:['helpedKid'],w:2.2,text:'一個高高瘦瘦的四年級生在走廊上攔住你：「你不記得我了嗎？我就是那個在樓梯上哭的一年級！」他壓低聲音，「我在禁書區打掃時，發現了一些你可能會想知道的東西。」',o:[
  O('仔細聽他說','diligent',['悟',12],{g:R('他找到的是一本記載古老黑魔法的書，其中一頁被人撕走了——你知道那一頁寫的是什麼。',{悟:1},{hx:1,flag:'kidAlly'}),k:R('他給了你一些零碎的線索。你謝謝他，他說：「該謝的是我。」',{悟:1},{flag:'kidAlly'}),f:R('他記得不太清楚，但你看得出他很想幫忙。',{},{flag:'kidAlly'})}),
  O('叫他別冒險，好好讀書','timid',null,R('他點點頭，但眼神很堅定：「如果有一天你需要幫忙，我一定會來。」',{人:1},{flag:'kidAlly'}))
]},
{id:'cq_elf2',flee:true,y:[7,7],fl:['elfFriend'],w:2.4,t:'逃亡・啪的一聲',text:'營地裡忽然「啪」的一聲，一個瘦小的身影出現在你面前——是當年廚房裡那個家庭小精靈。牠抱著一大籃熱騰騰的食物：「主人……不，朋友！我終於找到您了！」',o:[
  O('請牠坐下一起吃','timid',null,R('牠哭著吃完了一整塊派，然後告訴你一個在廚房裡聽到的祕密：某個敵人的據點位置。',{人:1,體:1},{hx:1,flag:'elfAlly'})),
  O('拜託牠幫忙打聽消息','careful',['人',11],{k:R('牠用小精靈的方式在各處的廚房打聽，帶回了寶貴的情報。',{人:1},{hx:1,flag:'elfAlly'}),f:R('牠帶回的消息有點混亂，但牠說會一直幫你。',{},{flag:'elfAlly'})})
]},
{id:'cq_diary',t:'當年的日記抄本',y:[5,6],fl:['diaryNotes'],hx:true,w:2.4,text:'整理行李時，你翻出二年級那年從日記上抄下的段落。現在重讀，你突然看懂了一件當年不明白的事：那本日記，從來就不只是一本日記。',o:[
  O('徹夜比對所有線索','diligent',['悟',12],{g:R('你確定了：他把靈魂的碎片藏在不同的物品裡。而你知道其中一件在哪裡。',{悟:1},{hx:1}),k:R('你拼出了大致的輪廓。',{悟:1},{hx:1}),f:R('字跡太模糊，你只看懂了一半。',{})}),
  O('拿去問值得信任的老師','careful',['人',11],{k:R('老師看完臉色發白，把你的抄本收進了保險箱：「你做得很好。」',{人:1},{hx:1}),f:R('老師說這太危險，叫你別再碰。',{})})
]},
{id:'cq_date',t:'舞會之後',y:[5,6],fl:['ballDate'],w:2.2,text:'當年舞會上的舞伴，在圖書館的書架後面攔住你，臉有點紅：「那天……我玩得很開心。你，要不要週末一起去散步？」',o:[
  O('答應','bold',null,R('你們沿著湖邊走了一整個下午，什麼都聊，又好像什麼都沒聊。回去時，你們的手不知不覺牽在一起。',{心:2},{flag:'partner'})),
  O('說你們還是當好朋友比較好','timid',null,R('對方愣了一下，笑著說：「好啊，那就說好了，一輩子的好朋友。」',{人:1,心:1},{flag:'partner'})),
  O('說現在局勢太亂，不想拖累人','careful',null,R('對方沉默了一會兒：「那等一切結束，你欠我一次散步。」',{心:1}))
]},
{id:'cq_feud',t:'死對頭的麻煩',y:[5,6],fl:['feudFoe'],w:1.8,text:'那個從一年級就跟你吵到現在的別院學生，被幾個高年級生堵在角落——他們嘲笑他的家人是「叛徒」。他看到你，表情像是在說：你也是來看笑話的吧。',o:[
  O('站到他那一邊','bold',['人',12],{g:R('你一句話就把那群人趕走了。他瞪著你很久，最後擠出一句：「……我不會說謝謝的。」但他從此再也沒找過你麻煩。',{人:2},{flag:'feudAlly'}),k:R('你們一起把那群人罵跑了。他彆扭地點了點頭。',{人:1},{flag:'feudAlly'}),f:R('你們兩個一起被揍了一頓。躺在醫療翼時，他居然笑了。',{體:-1},{flag:'feudAlly'})}),
  O('在一旁看熱鬧','careful',null,R('你看著他被羞辱，心裡卻沒有想像中痛快。',{人:-2}))
]},
{id:'cq_duel',t:'決鬥對手的邀約',y:[4,6],fl:['duelFriend'],w:1.8,text:'當年決鬥俱樂部的那個對手，現在已經是七年級了。他把你拉到空教室：「我畢業前想再跟你打一場——這次不是比賽，是教你幾招真的能保命的。」',o:[
  O('認真學','diligent',['體',11],{g:R('他教你的三個招式，比一整年的課都有用。分別時他說：「以後有事，叫我。」',{體:2},{flag:'duelAlly'}),k:R('你學會了其中一招。',{體:1},{flag:'duelAlly'}),f:R('你被打得滿地找牙，但他還是說「有進步」。',{體:-1},{flag:'duelAlly'})}),
  O('正面跟他再打一場','bold',['體',13],{g:R('你們打了一個小時，最後一起累倒在地上大笑。',{體:2,心:1},{flag:'duelAlly'}),k:R('你輸了，但輸得很漂亮。',{體:1},{flag:'duelAlly'}),f:R('你被他一招撂倒。',{體:-1})})
]},
{id:'cq_teacher',t:'教授的私人指導',y:[5,6],cond:r=>cntOf(r,'like')>=5,w:2.5,text:'好幾位教授都在教職員會議上提起你。最後，其中一位把你叫到辦公室：「我們都覺得，你值得學點課本以外的東西。」',o:[
  O('請教進階魔法','diligent',null,R('你在教授的指導下學會了一個連七年級都很少人會的咒語。',{悟:2},{flag:'teacherAlly'})),
  O('請教時間魔法的事','careful',['人',12],{g:R('教授猶豫了很久，終於從書架上抽出一本禁書：「只看這一章。」',{悟:1},{clue:1,flag:'teacherAlly'}),k:R('教授給了你一些模糊的提示。',{悟:1},{flag:'teacherAlly'}),f:R('教授說：「這不是學生該問的。」',{})})
]},
{id:'cq_cedric',t:'墓園裡的那個人',y:[5,6],fl:['cedricLives'],w:2.2,text:'那個你從墓園拖回來的勇士，現在是傲羅的實習生了。他特地回學校找你：「我欠你一條命。至少，讓我教你怎麼保住你自己的。」',o:[
  O('跟他學實戰技巧','bold',['體',11],{k:R('他教你的閃避步伐，後來救了你好幾次。',{體:2}),f:R('你練到全身痠痛，但學到了不少。',{體:1})}),
  O('跟他聊聊外面的局勢','careful',null,R('他告訴你魔法部裡誰可信、誰不可信。這些資訊，比任何咒語都珍貴。',{悟:1,人:1}))
]},
{id:'cq_daquit',t:'練習會的冷眼',y:[6,6],fl:['daQuit'],w:2.2,text:'當年你決定暫停練習會之後，有些成員再也沒跟你說過話。今天在走廊上，有人故意撞了你一下。',o:[
  O('主動找他們道歉，解釋當時的考量','timid',['人',12],{g:R('大家聽完你的解釋，沉默了一會兒。有人說：「其實……那時候你是對的。」',{人:2},{unflag:'daQuit'}),k:R('有一半的人原諒了你。',{人:1},{unflag:'daQuit'}),f:R('他們不想聽。',{人:-1})}),
  O('用行動證明：重新召集練習會','bold',['心',13],{k:R('第一次集合，來了一半的人。第二次，全員到齊。',{心:1,人:1},{unflag:'daQuit'}),f:R('沒有人來。',{心:-1})})
]}
);

 ['破解敵人的腐蝕咒','diligent','悟',15,'你算出了咒語的節律，在它最弱的瞬間反轉了它。塔門亮起藍光，敵人被彈了出去。','你減緩了腐蝕，撐到了援軍趕來。','你算錯了一步，防護咒裂開了一道縫。'],

const HOUSE_EPI={

  O('補充幾個有趣的例子','diligent',['悟',10],{g:R('你加進去幾個親身經歷的例子，教授在旁邊畫了個笑臉。',{悟:2}),k:R('你的例子讓作業變得更有說服力。',{悟:1}),f:R('例子寫偏了，教授問：「這跟主題有什麼關係？」',{})}),
  O('向教授申請多寬限一天','timid',['人',10],{k:R('教授想了想，點了點頭。你得到了一天的緩衝。',{人:1}),f:R('教授冷冷地說：「截止日期就是截止日期。」',{人:-1})})
]},
{id:'e_book',rep:true,t:'咬人的書',y:[1,5],w:1.1,text:'你從書架上抽出一本厚厚的舊書，封面一動，突然張開了一排牙齒，朝你的手咬了過來。圖書館另一頭，管理員已經抬起了頭，目光銳利。',o:[
  O('用外袍把書包起來，安撫它','careful',['悟',10],{g:R('你用袍子裹住了書，低聲念了一個安撫咒，書就乖乖安靜了下來。你順便學到了這本書的真正用途。',{悟:2}),k:R('書勉強被你包住，你悄悄把它放回了架上。',{悟:1}),f:R('書從袍子裡掙脫出來，一路追著你咬。',{體:-1},{inc:'trouble'})}),
  O('立刻把書放下，跑去求助管理員','timid',['人',9],{k:R('管理員板著臉走過來，三兩下把書制住，順手給你記了一筆「很有常識」。',{人:1}),f:R('管理員瞪著你：「你怎麼連書都管不好？」',{人:-1})}),
  O('和它搏鬥一番，贏得這場戰鬥','bold',['體',10],{g:R('你和書纏鬥了五分鐘，終於把它壓在地上。管理員看在你這麼拼命的份上，沒有追究。',{體:1,人:1}),k:R('你勉強制服了它，手背上多了幾道牙印。',{體:1}),f:R('書在你的袖子上咬出一個洞，你被趕出了圖書館。',{體:-1,人:-1},{inc:'trouble'})})
]},
{id:'e_jinx',rep:true,t:'走廊上的小咒語',y:[2,5],w:1.1,text:'下課後的走廊一片混亂，你突然覺得兩條腿黏在了一起，一步也邁不開。前方一個壞笑著的別院學生舉著魔杖，周圍有人開始起鬨。',o:[
  O('用反咒解開，反手也回他一個','diligent',['悟',11],{g:R('你一個反咒把自己的腿解開，再一個魔杖揮過去，對方的鞋帶全部綁成了死結。圍觀的人喝采。',{悟:1,人:1}),k:R('你解開了咒語，對方也被你嚇了一跳，兩邊都沒討到便宜。',{悟:1}),f:R('反咒打偏，把旁邊同學的書包炸開了。',{悟:-1,人:-1},{inc:'trouble'})}),
  O('一蹦一跳去找院長告狀','careful',['人',10],{k:R('你一蹦一跳走進辦公室。院長看見你的樣子，嘴角抽了一下，嚴肅地處理了這件事。',{人:1}),f:R('你還沒走到辦公室，咒語就失效了。大家覺得你在小題大作。',{人:-1})}),
  O('乾脆不理，單腳蹦著去下一堂課','bold',['體',9],{k:R('你蹦蹦跳跳地去上課，跳得比平常還快。同學們看得哈哈大笑，連教授都忍不住笑了。',{體:1,人:1}),f:R('你在樓梯口摔了一跤，滾下三級台階。',{體:-1})})
]},

// ---------- 課外活動 ----------
{id:'e_squid',rep:true,cond:W_SPRING,t:'黑湖邊的午後',y:[1,7],w:1.2,text:'春天的陽光暖洋洋的，你和朋友躺在黑湖邊的草地上。湖面忽然泛起一圈圈漣漪，一條巨大的觸手慢悠悠地伸出水面，像在和岸邊的人打招呼。',o:[
  O('走到岸邊，和它握握手','bold',['心',9],{g:R('你小心地握住那根觸手，它輕輕晃了晃，像是回應。湖邊的人都在鼓掌。',{心:1,人:2}),k:R('你和觸手握了一下，雖然黏糊糊的，卻很有意思。',{心:1,人:1}),f:R('觸手一甩，把你整個人拋進了湖裡。',{體:-1,人:1})}),
  O('丟幾塊麵包給它','careful',['人',8],{k:R('觸手接住了麵包，還禮貌地揮了揮。大家都說你很會跟動物相處。',{人:1}),f:R('你丟太遠，麵包被一隻水鳥搶走了。',{})}),
  O('躺在草地上，繼續曬太陽','timid',null,R('你什麼都不想，只看著天空，聽著遠處的笑聲。這是一個很好的午後。',{心:1}))
]},
{id:'e_kitchen',rep:true,t:'深夜的廚房',y:[2,6],w:1,text:'半夜肚子餓得咕咕叫，你想起有人說過：「搔一搔畫著水果盤的畫裡那顆梨，門就會開。」你站在一幅畫前，半信半疑。',o:[
  O('搔梨子，進去看看','bold',['心',9],{g:R('門開了，裡面是一整座熱氣騰騰的廚房，小精靈們歡天喜地給你端出了一桌熱食。你成了這裡的常客。',{人:1,體:1},{flag:'kitchenFriend'}),k:R('你進去吃了一碗熱湯，小精靈們悄悄塞了你一袋點心。',{人:1},{flag:'kitchenFriend'}),f:R('你搔了半天，什麼都沒發生，反而驚動了巡夜的管理員。',{人:-1},{inc:'trouble'})}),
  O('請同學院的老生帶你去','careful',['人',9],{k:R('學長笑著帶你去了，還教你怎麼用最禮貌的方式向小精靈道謝。',{人:1,悟:1},{flag:'kitchenFriend'}),f:R('學長說：「自己找，這是傳統。」然後轉身走了。',{})}),
  O('忍著餓回宿舍睡覺','timid',null,R('你抱著咕咕叫的肚子睡著了，夢見了一整桌烤雞。',{體:-1,心:1}))
]},
{id:'e_trophy',cond:r=>cntOf(r,'trouble')>=1,t:'獎盃室的禁閉',y:[2,6],w:2,text:'因為你最近的違規，被罰到獎盃室擦獎盃。房間裡堆滿了幾百年來的金銀獎盃，每一座都積著灰。管理員丟給你一塊抹布：「全部擦完才准走。」',o:[
  O('老老實實擦，一座也不漏','diligent',['心',9],{g:R('你擦到最後一座，發現角落裡有一面很舊的獎牌，名字被灰蓋住了一半。你悄悄用袖子擦了擦。',{心:1,悟:1},{flag:'plaque'}),k:R('你擦完了所有的獎盃，管理員冷哼一聲：「還算勤快。」',{心:1}),f:R('你擦到一半睡著了，被罰多留了一個晚上。',{體:-1})}),
  O('邊擦邊看那些獎盃上的名字','careful',['悟',10],{g:R('有一個名字重複出現在好幾座獎盃上，你把它記了下來。',{悟:2},{flag:'plaque'}),k:R('你看到了幾個熟悉的名字，原來教授們年輕時也得過獎。',{悟:1}),f:R('你看得太入迷，打翻了一座獎盃。',{金:-1,人:-1})}),
  O('找朋友偷偷幫忙','bold',['人',10],{k:R('朋友們溜進來幫你擦，三下兩下就結束了。你們在獎盃室笑成一團。',{人:2}),f:R('管理員抓到你們全部，大家一起被罰。',{人:-1},{inc:'trouble'})})
]},
{id:'e_plaque',fl:['plaque'],t:'那面獎牌的主人',y:[3,7],w:2.2,text:'你一直惦記著獎盃室裡那面被灰蓋住一半的舊獎牌。今天，你特地找了個理由溜進去，用手帕仔細擦乾淨了它。名字顯現出來的那一刻，你愣了好一陣子。',o:[
  O('去圖書館查這個人的資料','diligent',['悟',11],{g:R('你翻遍舊年鑑，發現他是百年前的一位傑出學生。年鑑旁還夾著一份手寫的學習筆記。你把它讀了一個晚上，收穫不少。',{悟:2,心:1},{flag:'oldRecord'}),k:R('你找到了一些零碎的資料，讓你對這位前輩多了幾分敬意。',{悟:1},{flag:'oldRecord'}),f:R('你查了一個下午，只查到他的名字出現在畢業名單裡。',{})}),
  O('問問幽靈們有沒有聽過他','careful',['人',10],{g:R('一位老幽靈說：「他啊，我還記得他在這裡打翻過一鍋魔藥呢。」他講了半個小時，你聽得津津有味。',{人:1,悟:1},{flag:'oldRecord'}),k:R('幽靈們模模糊糊地記得他，給了你一點線索。',{人:1}),f:R('幽靈們想了半天，只說：「有點耳熟。」',{})}),
  O('把獎牌擦亮，放回原處，不再追究','timid',null,R('你把獎牌擦得閃閃發亮，輕輕放回原位。有些事，知道就夠了。',{心:2}))
]},
{id:'e_points',rep:true,cond:r=>cntOf(r,'trouble')>=1,t:'被扣分的那一天',y:[1,6],w:1.4,text:'院長在早餐桌邊停下腳步，用不帶感情的聲音宣布：「因為昨天的事，學院被扣了十分。」大禮堂裡的沙漏，一顆紅寶石緩緩落了下來。全桌的眼神都轉向了你。',o:[
  O('當眾道歉，並承諾彌補','careful',['人',10],{g:R('你站起來，誠懇地向全學院道歉。大家的臉色緩和了下來，有人拍著你的肩說：「下次一起想辦法。」',{人:2,心:1},{flag:'amends'}),k:R('你說了幾句軟話，大家嘆了口氣，沒有繼續追究。',{人:1},{flag:'amends'}),f:R('你的道歉聽起來太敷衍，大家的臉色更難看了。',{人:-1})}),
  O('找機會多做功課，把分數賺回來','diligent',['悟',10],{g:R('你接下來的幾堂課表現亮眼，教授多給了你好幾分。一個星期後，學院的沙漏回升了。',{悟:1,人:1},{pts:8}),k:R('你努力表現，慢慢把扣掉的分數賺回了一半。',{悟:1},{pts:4}),f:R('你越緊張越出錯，反而又被扣了分。',{悟:-1},{pts:-2})}),
  O('嘴硬，說這是別人的錯','bold',['心',11],{g:R('你有理有據地反駁，連院長都愣住了。他沉吟片刻，把一半的扣分撤回了。',{心:1,人:1},{pts:5}),k:R('你的辯解沒起什麼作用，但大家覺得你有骨氣。',{心:1}),f:R('你的辯解讓院長更不悅，又追加了五分的處罰。',{人:-2},{pts:-5})})
]},
{id:'e_prefect',rep:true,t:'級長的巡邏',y:[2,6],w:1.1,text:'你在宵禁後的走廊上遇見了一個佩著級長徽章的高年級生，他手電筒似的魔杖光正一寸一寸地掃過牆壁。你只有三秒鐘決定要怎麼辦。',o:[
  O('躲到雕像後面','careful',['心',9],{g:R('你屏住呼吸，級長的光束從你面前擦過，什麼都沒發現。你甚至聽見他在嘀咕：「怪了。」',{心:1}),k:R('他走過去了，你鬆了一大口氣。',{}),f:R('你的鞋跟碰響了雕像，級長聽見聲音，把你抓了個正著。',{人:-1},{inc:'trouble',pts:-3})}),
  O('主動走過去，說自己在找廁所','bold',['人',10],{g:R('你笑著說自己迷路了，級長居然親自把你送回了宿舍。',{人:1}),k:R('級長半信半疑，叮囑你快回去，放你走了。',{}),f:R('級長一眼看穿了你的謊話：「廁所在反方向。」',{人:-1},{inc:'trouble',pts:-3})}),
  O('立刻回宿舍，不給他抓的機會','timid',['體',9],{k:R('你轉頭就跑，連頭都沒回。級長只看到一道影子溜走。',{體:1}),f:R('你跑得太急，撞翻了一排盔甲，聲音響徹整層樓。',{人:-1},{inc:'trouble',pts:-2})})
]},

// ---------- 宿舍與日常 ----------
{id:'e_infirm',rep:true,t:'醫護室的一夜',y:[1,7],w:1,text:'你在課堂上出了點意外，被送進了醫護室。醫護員一邊嘮叨一邊遞給你一杯冒著煙的深綠色藥水：「全部喝完，一滴都不准剩。」',o:[
  O('捏著鼻子，一口氣灌下去','bold',['心',8],{k:R('藥水的味道讓你的眼淚直流，但你第二天早上就能下床了。',{體:1}),f:R('藥水的味道讓你當場噴了出來，噴得醫護員滿臉。',{人:-1})}),
  O('和隔壁病床的人聊天','careful',['人',8],{k:R('隔壁的病人也是被魔咒傷到的，你們互相交流了一晚上的「受傷經歷」，成了朋友。',{人:2}),f:R('隔壁的人一直在打呼，你一夜沒睡。',{體:-1})}),
  O('想溜出去，被醫護員逮個正著','bold',['體',10],{g:R('你趁醫護員不注意溜了出去，回到宿舍後美美地睡了一覺。',{體:1}),k:R('你溜回了宿舍，沒人發現。',{}),f:R('醫護員站在門口，眼神可怕：「回去躺好。」',{體:-1})})
]},
{id:'e_fireside',rep:true,cond:W_WINTER,t:'爐火邊的夜談',y:[1,7],w:1.2,text:'冬夜，公共休息室的壁爐燒得很旺，幾個同學各自窩在最舒服的扶手椅裡，有人在翻書，有人在下巫師棋。不知是誰起了個頭：「你們覺得，畢業之後會做什麼？」',o:[
  O('認真說出自己的夢想','diligent',['心',9],{k:R('你把心裡的想法說出來，意外有人認真點頭，說：「這很適合你。」',{心:1,人:1}),f:R('你的夢想被大家笑了半天，但也有人偷偷記住了。',{心:1})}),
  O('開玩笑，把氣氛炒熱','bold',['人',9],{g:R('你的玩笑話讓大家笑得前仰後合，這一晚成了本學期最歡樂的夜晚。',{人:2}),k:R('大家笑了一會兒，又繼續討論。',{人:1}),f:R('玩笑開過頭，有人臉色變了。',{人:-1})}),
  O('靜靜地聽別人說','timid',['心',8],{k:R('你聽完了每個人的故事，覺得自己比以前更了解他們一點。',{心:1,人:1}),f:R('你聽著聽著睡著了，被人搖醒時天都快亮了。',{})})
]},
{id:'e_chore',rep:true,t:'魔法洗衣機',y:[1,3],w:1,text:'你試著用剛學會的咒語整理宿舍。衣服堆成一座小山，你想：「把它們自己折好，不就行了？」你揮動魔杖，念出咒語。',o:[
  O('一件一件，仔細地施咒','diligent',['悟',9],{g:R('衣服一件一件整整齊齊地疊好，連襪子都成雙成對。你的室友看呆了。',{悟:1,人:1}),k:R('大部分衣服都折好了，只是有幾件被折成了奇怪的形狀。',{悟:1}),f:R('衣服全都縮成了手帕大小。',{金:-1})}),
  O('一次全部丟進去，賭運氣','bold',['心',10],{g:R('衣服在空中飛了一圈，全都落在了正確的抽屜裡。你自己都不敢相信。',{心:1,人:1}),k:R('衣服勉強疊好了，只是分不清誰的是誰的。',{}),f:R('衣服像一群飛鳥一樣四處亂竄，把整個宿舍弄得一團糟。',{人:-1})}),
  O('放棄，老老實實用手疊','timid',null,R('你認認真真疊了半個小時，覺得手工果然最可靠。',{體:1}))
]},
{id:'e_beans',rep:true,t:'什麼口味都有的豆子',y:[1,5],w:1.1,text:'朋友遞給你一盒花花綠綠的豆子：「千萬別挑，隨便抓一顆就好，這是規矩。」你看著盒子上的標籤，心裡七上八下。',o:[
  O('閉著眼，抓一顆吃下去','bold',['心',9],{g:R('你抓到了一顆「焦糖布丁」味的，還意外地好吃。你嚇了一跳，連忙再抓第二顆。',{心:1,人:1}),k:R('是一顆很普通的薄荷口味，沒有什麼驚喜。',{心:1}),f:R('你咬下去的瞬間，整張臉皺成了一團：「這是……泥土口味？」',{人:1})}),
  O('讓朋友先試','timid',['人',9],{k:R('朋友抓到了一顆耳屎口味，臉色鐵青，你在旁邊笑到肚子疼。',{人:1}),f:R('朋友什麼事都沒有，反而笑你膽小。',{人:-1})}),
  O('和朋友打賭，輸的人吃三顆','careful',['悟',9],{k:R('你賭贏了，朋友含著淚吞下了三顆。',{人:1,金:1}),f:R('你賭輸了，閉著眼吞了三顆，這輩子再也不想吃豆子了。',{體:-1})})
]},
{id:'e_train',su:true,rep:true,cond:r=>mInYear(r)===11,t:'回家的列車',y:[1,6],w:6,text:'學期結束了。蒸汽火車噴著白煙，載著滿車的行李和喧鬧的聲音，慢慢駛離霍格華茲。你靠在車窗邊，看著那座城堡越來越小，最後被山丘擋住。',o:[
  O('和同車廂的人聊整個學期','careful',['人',8],{k:R('你們一路聊到站台，互相約好明年再見。',{人:2}),f:R('大家都睏了，沒人說話。',{心:1})}),
  O('一個人看著窗外發呆','timid',null,R('你看著窗外的景色一一閃過，心裡想著下一個學年的事。',{心:2})),

const FLEE_FROM=73,FLEE_TO=81;

function optInfo(run,ev,i){

  const o=ev.o[i];
  const out={why:[],lines:[],notes:[],text:'',extra:'',band:null,roll:null,die:null,end:null,goal:null,unlock:null,survive:''};
  if(o.cost)for(const k in o.cost){run.stats[k]-=o.cost[k];out.lines.push({txt:`${SK[k]} −${o.cost[k]}（花費）`,up:false});}
  out.why=helpsFor(run,ev,o).filter(h=>h.why).map(h=>whyText(run,h.why));
  let band='k';
  if(o.c){
    const k=o.c[0],dc=dcOf(run,ev,o);
    const b=bonusFor(run,ev,o),d1=d6(),d2=d6();
    const total=run.stats[k]+b+d1+d2,diff=total-dc;
    band=diff>=5?'g':diff>=0?'k':diff>=-fzOf(ev)?'f':'b';
    out.roll={k,dc,b,d1,d2,total,sv:run.stats[k]};
  }
  const res=o.r[band]||(band==='g'?o.r.k:band==='b'?o.r.f:null)||o.r.k;
  out.band=o.c?band:null;
  out.text=res.t;
  if(res.die){
    const fleeP=1-(1-(run.persona==='赫夫帕夫'?0.25:0))*(1-run.traits.reduce((a,id)=>Math.max(a,traitOf(id).flee||0),0));
    if(fleeP>0&&RNG()<fleeP){
      out.survive=run.persona==='赫夫帕夫'&&RNG()<0.5?'千鈞一髮之際，有個朋友把你一把拽了回來。':'千鈞一髮之際，你憑著一股「溜」的本能躲開了致命一擊。';
      applyFx(run,{體:-2},out.lines);
    }else if(hasItem(run,'decoy')){
      run.items=run.items.filter(x=>x!=='decoy');
      out.survive='你扔出誘餌炸彈，趁著一片混亂逃過了致命一擊（「誘餌炸彈」已用完）。';
      applyFx(run,{體:-1},out.lines);
    }else if(run.save>0){
      run.save--;
      out.survive='一道溫暖的光擋下了致命一擊（「免死機會」已消耗）。';
      applyFx(run,{體:-1},out.lines);
    }else{
      out.die=res.die;
      run.log.push({m:run.month,t:ev.t,s:o.l,r:res.die});
      (run.keys=run.keys||[]).push({m:run.month,t:ev.t,s:o.l+'・'+res.die,b:band});
      return out;
    }
  }else{
    let fx=res.fx;
    if(!ev.mm&&!ev.fin){fx={};for(const k in res.fx){const v=res.fx[k];fx[k]=(v>0&&RNG()>clamp(1-(run.stats[k]-TUNE.softFrom)/TUNE.softSpan,TUNE.softMin,1))?0:v;}}
    if(!isSp(ev)){const cap=capOf(run);const fx2={};for(const k in fx){let v=fx[k];if(v>0){const room=Math.max(0,cap-run.stats[k]);if(room<v){v=room;out.lines.push({txt:`${SK[k]}已達${run.month>LAST_MONTH?'':YEARN[yearOf(run)]}日常上限 ${cap}，需靠特殊事件突破`,up:false});}}fx2[k]=v;}fx=fx2;}
    applyFx(run,fx,out.lines);
  }
  if(ev.cls&&o.sk){
    const pf=prefOf(run,ev,o),t=teacherOf(run,o.sk);
    if(pf==='like'&&t){run.cnt=run.cnt||{};run.cnt.like=(run.cnt.like||0)+1;out.notes.push(`${t.t}欣賞你這種做法，滿意地點了點頭。`);if(run.persona){run.hp[run.persona]+=2;out.lines.push({txt:'學院分數 +2（教授欣賞）',up:true});}}
    else if(pf==='dis'&&t&&(band==='f'||band==='b')){out.notes.push(`${t.t}皺起眉頭，顯然不太喜歡你這種做法。`);if(run.persona){run.hp[run.persona]-=2;out.lines.push({txt:'學院分數 −2（教授不悅）',up:false});}}
    if(run.persona&&HEAD[run.persona]===o.sk&&t)out.notes.push(`身為你的院長，${t.t}對自己學院的學生總是多一分寬容。`);
  }
  if(o.sk&&(band==='g'||band==='k')){gainSk(run,o.sk,band==='g'?TUNE.skG:TUNE.skK,out.lines);}
  if(res.sk)for(const k in res.sk)gainSk(run,k,res.sk[k],out.lines);
  if(res.elect&&!run.elect.includes(res.elect)){run.elect.push(res.elect);run.skill[res.elect]=10;out.lines.push({txt:`選修「${SKNAME[res.elect]}」：滿值（Lv10）`,up:true});}
  {let p=res.pts;
   if(p===undefined&&(ev.cls||ev.mm||ev.stg||ev.fin))p=ev.stg?({g:4,k:2,f:0,b:-2})[band]:(ev.mm||ev.fin)?({g:12,k:6,f:0,b:-6})[band]:({g:6,k:3,f:-2,b:-4})[band];
   if(p>0)run.traits.forEach(id=>{const t=traitOf(id);if(t.hpb)p+=t.hpb;});
   if(p&&run.persona){run.hp[run.persona]+=p;out.lines.push({txt:`學院分數 ${p>0?'+':''}${p}`,up:p>0});}}
  if(res.house){run.persona=res.house;out.lines.push({txt:`分入學院：${res.house}`,up:true});}
  if(o.c&&run.felixOn&&hasItem(run,'felix')){run.items=run.items.filter(x=>x!=='felix');run.felixOn=false;out.lines.push({txt:'幸運藥水已用完',up:false});}
  if(res.item&&!hasItem(run,res.item)){run.items.push(res.item);out.lines.push({txt:`獲得道具：${ITEMS[res.item].n}`,up:true});(run.keys=run.keys||[]).push({m:run.month,t:'獲得道具',s:ITEMS[res.item].n,b:null});}
  if(res.inc)[].concat(res.inc).forEach(k=>{run.cnt=run.cnt||{};run.cnt[k]=(run.cnt[k]||0)+1;});
  if(res.flag)[].concat(res.flag).forEach(f=>{if(!has(run,f)){run.flags.push(f);(run.fm=run.fm||{})[f]=run.month;}});
  if(res.unflag){const u=[].concat(res.unflag);run.flags=run.flags.filter(f=>!u.includes(f))}
  if(res.clue){
    run.clue=Math.max(0,run.clue+res.clue);
    out.lines.push({txt:`時間線索 ${res.clue>0?'+':''}${res.clue}（${run.clue}/${CLUE_NEED}）`,up:res.clue>0});
  }
  if(res.hx){
    run.hx=clamp(run.hx+res.hx,0,HX_MAX);
    out.lines.push({txt:`魂器線索 ${res.hx>0?'+':''}${res.hx}（${run.hx}/${HX_MAX}）`,up:res.hx>0});
  }
  if(res.unlock&&!meta.unlocked.includes(res.unlock)){
    meta.unlocked.push(res.unlock);run.newUnlocks.push(res.unlock);out.unlock=res.unlock;
  }
  if(res.home){run.goals.home=true;out.end=run.goals.voldemort?'perfect':'home';}
  if(res.goal){run.goals[res.goal]=true;out.goal=res.goal;}
  if(res.end)out.end=res.end;
  if(res.cont&&run.goals.voldemort&&run.post===null)run.post=0;
  if(!run.done.includes(ev.id))run.done.push(ev.id);
  run.last=ev.id;
  if(ev.mm||ev.fin||ev.key||ev.id==='sorting'||res.unlock||res.goal||res.home)(run.keys=run.keys||[]).push({m:run.month,t:ev.t,s:o.l,b:o.c?band:null});
  if(ev.fin&&out.survive&&!out.goal&&!out.end){out.end='dark';out.survive+='……你活了下來，但在你倒下的那一刻，防線也跟著崩潰了。';}
  run.log.push({m:run.month,t:ev.t,s:o.l,r:res.t});
  return out;
}

// ---- 流程 ----
function startTurn(run,meta){
  const lines=advance(run);
  if(run.post!==null&&run.post>=POST_MAX)return{end:{type:'victory'}};
  if(run.post===null&&run.month>LAST_MONTH)return{end:{type:'graduate'}};
  const ev=pickEvent(run,meta);
  run.mood={v:0};
  if(ev&&ev.cls){
    const sk=(ev.o.find(o=>o.sk)||{}).sk,t=sk&&teacherOf(run,sk),r=RNG();
    if(t&&r<0.2){run.mood={v:-1};lines.push(`${t.t}今天臉色臭得像剛喝了苦藥（本堂檢定 −1）`);}
    else if(t&&r>0.85){run.mood={v:1};lines.push(`${t.t}今天心情特別好（本堂檢定 +1）`);}
  }
  return{ev,passive:lines};
}
function afterEvent(run,out,ev){
  if(out.die)return{end:{type:'died',cause:out.die}};
  if(out.end)return{end:{type:out.end}};
  if(out.goal==='voldemort')return{ev:goalEvent(run),passive:[]};
  if(ev&&ev.chain)run.q=chainOf(run,ev).slice();
  if(run.q&&run.q.length){const id=run.q.shift(),nx=EVENTS.find(x=>x.id===id),ps=[''];
    if(nx&&(nx.fin||nx.id==='m_final_b')){const fs=friendsOf(run);if(fs.length)ps.push(`${fs.join('、')}站在你身邊${nx.fin?`（決戰檢定 +${Math.min(2,fs.length)}）`:''}`);if(has(run,'towerSaved'))ps.push(`老校長與你並肩作戰${nx.fin?'（決戰檢定 +1）':''}`);const al=alliesOf(run);if(al.length)ps.push(`趕來支援的人：${al.join('、')}${nx.fin?`（決戰檢定 +${Math.min(2,Math.floor(al.length/3))}）`:''}`);if(nx.fin&&has(run,'houseStand'))ps.push('你的學院守住了自己的戰線（決戰檢定 +1）');}
    return{ev:nx,passive:ps};}
  return{next:true};
}

function rollLegacy(meta,rng){
  const rec=meta.legacy;if(!rec)return null;
  const r=rng||RNG;
  if(r()>=0.75)return{missed:true,rec};
  const pool=LEGACIES.filter(l=>!l.minYear||rec.year>=l.minYear);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return{rec,list:pool.slice(0,rec.year>=5?2:1)};
}

// ---------- 創角 ----------
const allocSum=()=>SKEYS.reduce((a,k)=>a+ui.alloc[k],0);
const modSum=k=>ui.sel.reduce((a,id)=>a+((traitOf(id).mod||{})[k]||0),0);
function trimAlloc(){
  const b=basePts(meta)+extraPts(ui.sel);
  while(allocSum()>b){let m=SKEYS[0];SKEYS.forEach(k=>{if(ui.alloc[k]>ui.alloc[m])m=k;});ui.alloc[m]--;}
}
function vCreate(){
  const sl=slots(meta),bud=basePts(meta)+extraPts(ui.sel),left=bud-allocSum();
  const tr=ui.offer.map(id=>{
    const t=traitOf(id),on=ui.sel.includes(id),full=!on&&ui.sel.length>=sl;
    return `<button class="trait ${on?'on':''} ${t.lock?'rare':''}" data-act="trait" data-id="${t.id}" aria-pressed="${on}" ${full?'disabled':''}><b>${esc(t.n)}${t.lock?'　（強力）':''}</b><span>${esc(t.d)}</span></button>`;
  }).join('');
  const lockedList=TRAITS.filter(t=>t.lock&&!meta.unlocked.includes(t.id));
  const hints=(meta.runs>=1&&lockedList.length)?`<details class="reset" style="margin-top:12px"><summary>尚未解鎖的強力詞條（${lockedList.length}）</summary><ul class="small">${lockedList.map(t=>`<li>${esc(t.hint)}</li>`).join('')}</ul></details>`:'';
  const rows=SKEYS.map(k=>{
    const a=ui.alloc[k],m=modSum(k),tot=Math.max(0,1+a+m);
    return `<div class="arow"><span class="nm">${SK[k]}</span>
      <span class="pv">基礎 1 + 配點 ${a}${m?` ${m>0?'+':'−'} 詞條 ${Math.abs(m)}`:''} → <b style="color:var(--text)">${tot}</b></span>
      <span class="stepper"><button data-act="alloc" data-k="${k}" data-d="-1" aria-label="${SK[k]}減少" ${a<=0?'disabled':''}>−</button><output>${a}</output><button data-act="alloc" data-k="${k}" data-d="1" aria-label="${SK[k]}增加" ${(a>=MAX_ALLOC||left<=0)?'disabled':''}>＋</button></span></div>`;
  }).join('');
  return `<section class="card"><h2 data-focus tabindex="-1">投胎前的準備</h2>
    <p class="muted small">出身（家庭與地方）會在你投胎後隨機決定。${meta.runs>=1?'輪迴之後，你能帶的行李變多了。':''}</p>
    <div class="sec-h"><h3>性別</h3></div>
    <div class="btnrow" style="margin:0 0 6px"><button class="btn ${ui.gender==='男'||ui.sel.includes('u_potter')?'primary':''}" data-act="gender" data-g="男" aria-pressed="${ui.gender==='男'||ui.sel.includes('u_potter')}">男</button><button class="btn ${ui.gender==='女'&&!ui.sel.includes('u_potter')?'primary':''}" data-act="gender" data-g="女" ${ui.sel.includes('u_potter')?'disabled':''} aria-pressed="${ui.gender==='女'}">女</button></div>${ui.sel.includes('u_potter')?'<p class="small muted" style="margin:0 0 6px">選了「我就是波特」，性別固定為男。</p>':''}
    <div class="sec-h"><h3>命運給你的詞條</h3><span class="counter">從 ${ui.offer.length} 個中選 ${sl} 個　${ui.sel.length} / ${sl}</span></div>
    <div class="traits">${tr}</div>${hints}
    <div class="sec-h" style="margin-top:22px"><h3>配點</h3><span class="counter">剩餘 ${left} 點　<span class="muted small">（共 ${bud} 點${extraPts(ui.sel)?`，詞條加成 +${extraPts(ui.sel)}`:''}；單項上限 ${MAX_ALLOC}）</span></span></div>
    <div class="alloc">${rows}</div>
    <div class="btnrow">
      <button class="btn primary" data-act="born" ${left!==0?'disabled':''}>投胎！</button>
      <button class="btn" data-act="rand">隨機配點</button>
      <button class="btn ghost" data-act="home">返回</button>
    </div>
    ${left!==0?'<p class="muted small" style="margin-top:10px">需要把所有點數分配完，才能投胎。</p>':''}
  </section>`;
}

// ---------- 遊戲 ----------
function statCell(k){
  const v=run.stats[k];
  return `<div class="stat"><span>${SK[k]}</span><b>${v}</b></div>`;
}
function courseHtml(){
  const rows=CORE.concat(run.elect).map(id=>{const l=lvl(run,id),el=run.elect.includes(id);
    return `<div class="crow"><span>${esc(SKNAME[id])}${el?'<small>選修</small>':''}</span><i class="bar"><u style="width:${l*10}%"></u></i><b>Lv${l}</b></div>`;}).join('');
  const hs=run.persona?HOUSES.slice().sort((a,b)=>run.hp[b]-run.hp[a]).map(h=>`<span class="hcell ${h===run.persona?'me':''}">${h} <b>${run.hp[h]}</b></span>`).join(''):'';
  return `<details class="courses"><summary>課程進度${run.persona?`・學院盃${run.cups?`（本世 ${run.cups} 座）`:''}`:''}</summary>
    <div class="cgrid">${rows}</div>${hs?`<p class="small muted" style="margin:.6em 0 .3em">本學年學院分數（六月結算）</p><div class="hrow">${hs}</div>`:''}
    <p class="small muted" style="margin:.6em 0 0">課程等級每 3 級為相關檢定多一點加成；部分進階選項需要達到指定等級。</p></details>`;
}
function hud(){
  const showClue=meta.runs>=1||run.clue>0||run.goals.home,showHx=meta.runs>=1||run.hx>0;
  const pct=clamp(run.month/LAST_MONTH,0,1)*100;
  return `<header class="hud">
    <div class="hud-top">
      <div><span class="age">${run.month>LAST_MONTH?'畢業後':YEARN[yearOf(run)]}</span></div>
      <div class="realm"><b>${run.month>LAST_MONTH?`第 ${run.month-LAST_MONTH} 個月`:MONTHS[mInYear(run)-1]}</b><i class="bar xp"><u style="width:${pct}%"></u></i><small>${run.month>LAST_MONTH?'戰後的日子':`第 ${Math.max(run.month,1)} / ${LAST_MONTH} 個月`}</small></div>
      <div class="meta"><span>${esc(run.family.n)}</span><span>學院：${run.persona||'尚未分院'}</span>${showClue?`<span>時間線索 ${run.clue}/${CLUE_NEED}</span>`:''}${showHx?`<span>魂器線索 ${run.hx}/${HX_MAX}</span>`:''}</div>
    </div>
    <div class="stats">${SKEYS.map(statCell).join('')}</div>
    <p class="capnote">日常事件屬性上限 ${capOf(run)}（每升一年級 +2）；重大冒險、學院／家庭事件與好友路線不受限。</p>
    ${courseHtml()}
    <div class="chips">${run.traits.map(id=>`<span class="chip gold">${esc(traitOf(id).n)}</span>`).join('')}${run.save>0?'<span class="chip">免死 ×'+run.save+'</span>':''}${(run.items||[]).map(id=>`<span class="chip item" title="${esc(ITEMS[id].d)}">🎒 ${esc(ITEMS[id].n)}</span>`).join('')}${run.legacy?run.legacy.list.map(l=>`<span class="chip gold">遺澤：${esc(l.n)}</span>`).join(''):''}</div>
  </header>`;
}
const tx=s=>esc(T(run,s));
const logLabel=m=>m>LAST_MONTH?`畢業後 ${m-LAST_MONTH} 月`:`${YEARN[Math.min(7,Math.ceil(m/12))]}${MONTHS[(m-1)%12]}`;
function optBtn(ev,o,i){
  const f=optInfo(run,ev,i);
  const chips=[`<span class="chip st-${o.s}">${STYLE_FULL[o.s]}</span>`];
  if(o.c)chips.push(`<span class="chip">${SK[o.c[0]]}檢定・成功率 ${f.chance}%</span>`);
  (f.helps||[]).forEach(h=>chips.push(`<span class="chip ${h.b>0?'help':'danger'}"${h.why?` title="${esc(whyText(run,h.why))}"`:''}>${esc(h.n)} ${h.b>0?'+':''}${h.b}</span>`));
  if(f.pref)chips.push(`<span class="chip ${f.pref==='like'?'gold':'danger'}">${f.pref==='like'?'教授欣賞這種做法':'教授不喜歡這種做法'}</span>`);
  if(f.sk)chips.push(`<span class="chip gold">${esc(SKNAME[f.sk.id])} Lv${f.sk.lvl}${f.sk.bonus?`（+${f.sk.bonus}）`:''}</span>`);
  if(!o.c)chips.push('<span class="chip">無需檢定</span>');
  if(o.cost)for(const k in o.cost)chips.push(`<span class="chip cost">花費 ${SK[k]} ${o.cost[k]}</span>`);
  if(f.pDie>=0.005)chips.push(`<span class="chip danger">致死風險 ${Math.round(f.pDie*100)}%</span>`);
  else if(f.deadly)chips.push('<span class="chip danger">致死風險 &lt;1%</span>');
  if(f.locked)chips.push(`<span class="chip lock">${esc(f.reason)}</span>`);
  return `<button class="opt" data-act="pick" data-i="${i}" ${f.locked?'disabled':''}><span class="olabel">${tx(o.l)}</span><span class="ometa">${chips.join('')}</span></button>`;
}
function vResult(c){
  const out=c.out,r=out.roll;
  const ev=c.ev,big=ev.mm||ev.stg||ev.fin;
  const DIE='⚀⚁⚂⚃⚄⚅';
  const me=r?Math.max(8,Math.min(92,50+(r.total-r.dc)*4)):50;
  const duel=r?`<div class="duel ${big?'big':''} db-${out.band}" style="--w:${me}%">
      ${big?`<div class="duel-h"><span>你</span><b>⚔ 對決</b><span>${ev.fin?'佛地魔':'險境'}</span></div>`:''}
      <div class="dice"><span class="die">${DIE[r.d1-1]}</span><span class="die d2">${DIE[r.d2-1]}</span></div>
      <div class="tug"><i></i></div>
      <div class="tug-l"><span>${SK[r.k]} ${r.total}</span><span>難度 ${r.dc}</span></div>
    </div>`:'';
  const rollLine=r?`${duel}<p class="roll">${SK[r.k]}檢定：${r.sv}${r.b?(r.b>0?' + ':' − ')+Math.abs(r.b):''} + 骰子 ${r.d1}+${r.d2} = <strong>${r.total}</strong>（難度 ${r.dc}）<b>${BAND[out.band]}</b></p>`:'';
  return `<div class="result band-${out.band||'k'}">
    ${rollLine}
    <p class="rtext">${tx(out.text)}</p>
    ${(out.why||[]).filter(Boolean).map(w=>`<p class="why">↳ 因果：${tx(w)}</p>`).join('')}
    ${(out.notes||[]).map(n=>`<p class="pextra">${tx(n)}</p>`).join('')}
    ${out.extra?`<p class="pextra">〔${run.persona}〕${tx(out.extra)}</p>`:''}
    ${out.survive?`<p class="survive">${esc(out.survive)}</p>`:''}
    ${out.lines.length?`<ul class="fx">${out.lines.map(l=>`<li class="${l.up?'up':'down'}">${esc(l.txt)}</li>`).join('')}</ul>`:''}
    ${out.unlock?`<p class="unlock">解鎖新詞條：<b>${esc(traitOf(out.unlock).n)}</b>　下次投胎就能選了。</p>`:''}
    ${out.die?`<p class="dead">${tx(out.die)}</p>`:''}
    <div class="btnrow"><button class="btn primary" data-act="cont" data-focus>${out.die?'魂歸輪迴':'繼續'}</button></div>
  </div>`;
}
function logHtml(){
  if(!run.log.length)return '';
  return `<details class="log"><summary>人生記事（${run.log.length}）</summary><ol>${run.log.slice().reverse().map(l=>`<li><b>${logLabel(l.m)}・${tx(l.t)}</b><br>${tx(l.s)}</li>`).join('')}</ol></details>`;
}
function stageTag(ev){
  let i=0,n=0;
  if(ev.chain){i=1;n=chainOf(run,ev).length+1;}
  else{const P=EVENTS.find(e=>e.chain&&chainOf(run,e).includes(ev.id));if(P){const ch=chainOf(run,P);i=ch.indexOf(ev.id)+2;n=ch.length+1;}}
  if(!n)return ev.fr?'<p class="stage fr">♥ 好友路線</p>':'';
  return `<p class="stage">⚔ 重大冒險・第 ${i} / ${n} 段<span class="pips">${Array.from({length:n},(_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</span></p>`;
}
function vPlay(){
  const c=ui.cur,ev=c.ev;
  const felix=!c.out&&hasItem(run,'felix')&&ev.o.some(o=>o.c)?`<div class="felix"><button class="btn ${run.felixOn?'primary':'ghost'}" data-act="felix">${run.felixOn?'✨ 已喝下幸運藥水（下一次檢定 +6）':'🧪 喝下幸運藥水'}</button></div>`:'';
  const body=c.out?vResult(c):`${felix}<div class="opts">${ev.o.map((o,i)=>optBtn(ev,o,i)).join('')}</div>`;
  return `${hud()}
    <article class="card event ${(ev.mm||ev.stg||ev.fin)?'major':''}" aria-live="polite">${stageTag(ev)}
      <p class="passive">【${calLabel(run)}】${c.passive.slice(1).filter(s=>!String(s).startsWith('✦')).map(tx).join('・')}</p>
      ${c.passive.slice(1).filter(s=>String(s).startsWith('✦')).map(s=>`<p class="notice">${tx(s)}</p>`).join('')}
      <h2 data-focus tabindex="-1">${tx(ev.t)}</h2>${ev.why&&whyText(run,ev.why)?`<p class="why">↳ ${tx(whyText(run,ev.why))}</p>`:''}
      <p class="etext" style="white-space:pre-line">${tx(evText(run,ev))}</p>
      ${body}
    </article>${logHtml()}`;
}

    ${friendsOf(run).length?`<p class="unlock">這一世的好友：<b>${esc(friendsOf(run).join('、'))}</b></p>`:''}
    ${(()=>{const h=meta.hist||[],p=h[h.length-2];if(!p)return '';return `<p class="small muted">上一世（第 ${p.n} 世）：${esc(ENDINGS[p.type]?ENDINGS[p.type].n:p.type)}・${esc(p.house||'未分院')}・走到${esc(p.at)}</p>`;})()}
    <details class="log"><summary>這一世的記事（${run.log.length}）</summary><ol>${run.log.map(l=>`<li><b>${logLabel(l.m)}・${tx(l.t)}</b><br>${tx(l.s)}</li>`).join('')}</ol></details>
    <div class="btnrow"><button class="btn primary" data-act="new">再投胎一次</button><button class="btn ghost" data-act="home">回到首頁</button></div>
  </section>`;
}

// ---------- 首死劇情 ----------
function vStory(){
  return `<section class="card story"><h2 data-focus tabindex="-1">時間的盡頭</h2>
    <p>黑暗中，一個懶洋洋的聲音響起：「喲，又一個。你這一世，死得挺有創意。」</p>
    <p>你面前出現一座老舊的月台，鐵軌兩側是無數條交錯的時間線，有些亮著，有些熄了。月台邊坐著一位戴著半月形眼鏡的老人，正在剝一顆糖。</p>
    <p>「別擔心，」他笑瞇瞇地說，「失敗是一種資料。你這個孩子身上帶著不屬於這裡的東西，也許這是一次能做得更好的機會。」</p>
    <p>他彈了彈手指，一道光落在你額頭。你忽然覺得，自己能多帶幾個<em>詞條</em>，也多了一點可以支配的<em>潛力</em>。</p>
    <p>「去吧，再試一次。這次，多帶點行李。」</p>
    <p class="muted small">詞條欄位 3 → 5，配點 10 → 12。從這一世起，會記錄成就；若死於非命，下一世有機會獲得遺澤。</p>
    <div class="btnrow"><button class="btn primary" data-act="create">再次穿越</button></div>
  </section>`;
}

// ---------- 流程 ----------
function render(scroll=true){
  const v={title:vTitle,create:vCreate,birth:vBirth,play:vPlay,end:vEnd,story:vStory}[ui.screen]();
  const th=(ui.screen==='play'||ui.screen==='end')&&run&&run.persona?({葛來分多:'g',雷文克勞:'r',史萊哲林:'s',赫夫帕夫:'h'})[run.persona]:'';
  document.body.dataset.house=th||'';
  app.innerHTML=v;
  saveRun();
  if(scroll){
    window.scrollTo(0,0);
    const f=app.querySelector('[data-focus]');
    if(f)f.focus({preventScroll:true});
  }
}
function startCreate(){if(meta.gender)ui.gender=meta.gender;ui.offer=offerTraits(meta);ui.sel=[];ui.alloc={悟:0,體:0,人:0,心:0,金:0};ui.screen='create';render();}
function enterTurn(s,flash){
  if(s.end)return endRun(s.end.type,s.end.cause);
  ui.cur={ev:s.ev,passive:s.passive.slice(),out:null};
  if(flash)ui.cur.passive.unshift(flash);
  ui.screen='play';render();
}
function nextTurn(flash){enterTurn(startTurn(run,meta),flash);}
function endRun(type,cause){
  run.ended={type,cause};
  run.newAch=checkAch(run,meta,type);
  meta.legacy=(type==='died'||type==='worldend')?makeLegacyRecord(run,cause):null;
  meta.hist=(meta.hist||[]).concat([{n:meta.runs+1,type,house:run.persona,fam:run.family.n,at:calLabel(run),career:type==='victory'&&run.goals.voldemort?CAREERS[careerOf(run)].n:null,friends:friendsOf(run),keys:(run.keys||[]).slice(-16)}]).slice(-12);
  clearRun();
  meta.runs++;
  [type].forEach(t=>{if(!meta.endings.includes(t))meta.endings.push(t);});
  meta.best=Math.max(meta.best||0,yearOf(run));
  if(run.goals.voldemort&&has(run,'love')&&!meta.unlocked.includes('u_potter')){meta.unlocked.push('u_potter');run.newUnlocks.push('u_potter');}
  if(run.goals.home&&!meta.unlocked.includes('u_home')){meta.unlocked.push('u_home');run.newUnlocks.push('u_home');}
  saveMeta();
  ui.screen='end';render();
}
function afterContinue(){
  const nx=afterEvent(run,ui.cur.out,ui.cur.ev);
  if(nx.end)return endRun(nx.end.type,nx.end.cause);
  if(nx.ev){ui.cur={ev:nx.ev,passive:nx.passive,out:null};return render();}
  nextTurn(ui.flash);ui.flash='';
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const a=b.dataset.act;
  switch(a){
    case 'new':
      if(meta.runs===1&&!meta.introSeen){meta.introSeen=true;saveMeta();ui.screen='story';render();}
      else startCreate();
      break;
    case 'create':startCreate();break;
    case 'home':ui.screen='title';render();break;
    case 'reset':
      meta=defaultMeta();saveMeta();ui.screen='title';render();break;
    case 'gender':ui.gender=b.dataset.g;meta.gender=ui.gender;saveMeta();render(false);break;
    case 'trait':{
      const id=b.dataset.id,i=ui.sel.indexOf(id);
      if(i>=0)ui.sel.splice(i,1);else if(ui.sel.length<slots(meta))ui.sel.push(id);
      trimAlloc();render(false);
      const again=app.querySelector(`[data-id="${id}"]`);if(again)again.focus({preventScroll:true});
      break;}
    case 'alloc':{
      const k=b.dataset.k,d=+b.dataset.d;
      const bud=basePts(meta)+extraPts(ui.sel);
      if(d>0&&(ui.alloc[k]>=MAX_ALLOC||allocSum()>=bud))break;
      if(d<0&&ui.alloc[k]<=0)break;
      ui.alloc[k]+=d;render(false);
      const sel=`[data-act="alloc"][data-k="${k}"][data-d="${d}"]`;
      const n=app.querySelector(sel);if(n&&!n.disabled)n.focus({preventScroll:true});
      break;}
    case 'rand':{
      const bud=basePts(meta)+extraPts(ui.sel);
      SKEYS.forEach(k=>ui.alloc[k]=0);
      let left=bud;while(left>0){const k=SKEYS[Math.floor(Math.random()*5)];if(ui.alloc[k]<MAX_ALLOC){ui.alloc[k]++;left--;}}
      render(false);break;}
    case 'resume':resumeRun();break;
    case 'born':clearRun();
      {const lg=rollLegacy(meta);meta.legacy=null;saveMeta();run=createRun(ui.sel,ui.alloc,lg&&lg.list?lg:null,ui.gender);run.legacyMiss=lg&&lg.missed?lg.rec:null;}ui.screen='birth';render();break;
    case 'live':
      run.month=0;nextTurn();break;
    case 'pick':{
      const c=ui.cur;if(c.out)break;
      const i=+b.dataset.i;
      if(optInfo(run,c.ev,i).locked)break;
      c.pick=i;c.out=resolve(run,c.ev,i,meta);
      if(c.out.unlock)saveMeta();
      render(false);
      const nb=app.querySelector('[data-act="cont"]');if(nb)nb.focus({preventScroll:true});
      break;}
    case 'cont':afterContinue();break;
    case 'felix':run.felixOn=!run.felixOn;render(false);break;
  }
});
render();

</script>
</body>
</html>
