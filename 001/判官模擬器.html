<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>閻羅殿夜班</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#120d0d;--panel:#1c1414;--line:#3a2a26;--red:#b3261e;--red2:#e0574c;--gold:#c9a45c;--paper:#efe6d0;--ink:#2a1f17;--txt:#e9e1d6;--dim:#9c8f84;--good:#6fae7a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0707;color:var(--txt);font-family:"Source Han Serif TC","Noto Serif TC","思源宋體","思源明體",serif;-webkit-tap-highlight-color:transparent}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
body{overflow:hidden}
.serif{font-family:"Noto Serif TC",serif}
#app{height:100dvh;max-width:820px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:radial-gradient(ellipse at top,#2a1414 0%,var(--bg) 65%);border-left:1px solid #1f1616;border-right:1px solid #1f1616;overflow:hidden}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;image-rendering:pixelated;opacity:.32;pointer-events:none;transition:background-image .4s}
#app>*:not(#bg){position:relative}
#ov,#scene,#toast,#hitfx,.stampfx{position:absolute!important}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{padding:10px 16px;border:1px solid var(--gold);color:var(--gold);border-radius:6px;background:rgba(201,164,92,.06);transition:.15s;font-size:15px}
.btn:hover{background:rgba(201,164,92,.16)}
.btn.red{border-color:var(--red2);color:#fff;background:var(--red)}
.btn.red:hover{background:#c8342b}
.btn.ghost{border-color:var(--line);color:var(--dim)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:7px 11px;font-size:13px}
#hud{display:none;padding:10px 14px 8px;border-bottom:1px solid var(--line);background:rgba(18,13,13,.9)}
.hud-row{display:flex;gap:14px;align-items:baseline;font-size:14px;flex-wrap:wrap}
.hud-row b{font-size:17px;color:var(--gold)}
.hud-row .ot{color:var(--red2)}
.bars{display:flex;gap:12px;margin-top:6px}
.bar{flex:1;font-size:12px;color:var(--dim)}
.bar .tr{height:6px;background:#2b211e;border-radius:3px;overflow:hidden;margin-top:3px}
.bar .fl{height:100%;transition:width .3s}
#main{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
#foot{border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(18,13,13,.95);display:none}
/* title */
.title-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.title-wrap h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:52px;letter-spacing:10px;color:#e8d6b0;text-shadow:0 0 24px rgba(179,38,30,.6)}
.title-wrap .sub{color:var(--dim);letter-spacing:4px}
.title-wrap .seal{width:70px;height:70px;border:3px solid var(--red);color:var(--red2);font-family:"Noto Serif TC",serif;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:22px;transform:rotate(-8deg);border-radius:6px;line-height:1.1}
.title-wrap .ver{position:absolute;bottom:12px;font-size:12px;color:#5f524a}
.col{display:flex;flex-direction:column;gap:10px;min-width:220px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.card h3{font-family:"Noto Serif TC",serif;color:var(--gold);margin-bottom:10px}
input[type=text]{width:100%;padding:10px;background:#0e0a0a;border:1px solid var(--line);color:var(--txt);border-radius:6px;font-size:16px}
.radio{display:flex;gap:10px;margin-top:8px}
.radio button{flex:1;padding:10px;border:1px solid var(--line);border-radius:6px}
.radio button.on{border-color:var(--gold);color:var(--gold);background:rgba(201,164,92,.1)}
/* case */
.soul{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.soul .nm{font-family:"Noto Serif TC",serif;font-size:22px;font-weight:700}
.soul .mt{color:var(--dim);font-size:13px;margin-top:2px}
.soul .q{font-size:12px;color:var(--dim);text-align:right}
.tabs{display:flex;gap:4px;margin-bottom:12px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:2}
.tabs button{flex:1;padding:8px 4px;border-bottom:2px solid var(--line);color:var(--dim);font-size:14px}
.tabs button.on{border-color:var(--red2);color:var(--txt)}
.paper{background:var(--paper);color:var(--ink);border-radius:4px;padding:14px 16px;margin-bottom:12px;font-family:"Noto Serif TC",serif;line-height:2;font-size:15.5px;box-shadow:0 2px 0 #b9a985,inset 0 0 40px rgba(120,90,40,.18);position:relative}
.paper.book{background:#e6d5a8}
.paper.book:after{content:"生死簿";position:absolute;right:12px;top:10px;border:2px solid #a52a1e;color:#a52a1e;font-size:12px;padding:0 4px;transform:rotate(6deg);opacity:.75;font-weight:700;line-height:1.5}
.paper.special{background:#dfe4ea}
.paper.soup{background:#ead9cf}
.paper h4{font-size:13px;color:#8a2a1e;letter-spacing:2px;margin-bottom:6px;border-bottom:1px dashed #b9a985;padding-bottom:4px}
.kw{border-bottom:2px dotted #b3261e;cursor:pointer;padding:0 2px;border-radius:2px;transition:.12s}
.kw:hover{background:rgba(179,38,30,.12)}
.kw.got{background:rgba(179,38,30,.16)}
.kw.sel{background:#b3261e;color:#fff;border-color:#b3261e}
.hazebox{position:relative}
.hazebox .paper{filter:blur(6px);pointer-events:none;user-select:none}
.hazebox .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#d9ccf5;text-shadow:0 0 6px #000;z-index:1}
.find{padding:10px 12px;border-left:3px solid var(--red2);background:#211717;margin-bottom:8px;border-radius:0 6px 6px 0;font-size:14.5px;line-height:1.7}
.muted{color:var(--dim);font-size:13px}
.tray{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;min-height:32px;flex-wrap:wrap}
.chip{background:#2b1f1c;border:1px solid var(--red);padding:3px 8px;border-radius:12px;color:#f0c9c4}
.chip.empty{border-style:dashed;border-color:var(--line);color:#5f524a}
.tools{display:flex;gap:8px}
.tools .btn{flex:1;padding:10px 6px;font-size:14px}
/* modal */
#ov{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#ov.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;padding:18px}
.modal h2{font-family:"Noto Serif TC",serif;color:var(--gold);margin-bottom:12px;font-size:21px}
.modal p{line-height:1.85;margin-bottom:10px}
.vg{margin-bottom:12px}
.vg .lb{font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:2px}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vbtn{border:1px solid var(--line);border-radius:6px;padding:9px 4px;text-align:center;font-size:14px;background:#160f0f}
.vbtn small{display:block;font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.3}
.vbtn.on{border-color:var(--red2);background:#3a1714}
.vbtn:disabled{opacity:.3}
.bribe{display:flex;align-items:center;gap:10px;padding:10px;border:1px dashed #8a6a2a;border-radius:6px;margin-bottom:12px;font-size:14px;color:#e2c58a}
.bribe.on{background:rgba(201,164,92,.15);border-style:solid}
.res-ok{color:var(--good)}.res-part{color:#d9b25a}.res-bad{color:var(--red2)}
.delta{font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:8px;margin-top:6px;line-height:1.8}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.hb li{margin:0 0 6px 18px;line-height:1.7;font-size:14px}
.hb b{color:var(--gold)}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.grade{font-family:"Noto Serif TC",serif;font-size:56px;font-weight:900;color:var(--red2);text-align:center;margin:6px 0}
.night-opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#170f0f}
.night-opt:hover{border-color:var(--gold)}
.night-opt b{color:var(--gold);font-family:"Noto Serif TC",serif}
.night-opt span{display:block;font-size:12.5px;color:var(--dim);margin-top:2px}
/* scene */
#scene{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;justify-content:flex-end;background:linear-gradient(to bottom,rgba(10,6,6,.55),rgba(10,6,6,.92));cursor:pointer;padding:16px}
#scene.on{display:flex}
.dlg{background:rgba(28,20,20,.97);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-height:150px;position:relative;margin-bottom:env(safe-area-inset-bottom)}
.dlg .who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pt{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px;border:2px solid rgba(255,255,255,.25)}
.dlg .nm{font-family:"Noto Serif TC",serif;font-weight:700;color:var(--gold);font-size:16px}
.dlg .tx{font-size:16.5px;line-height:1.9;font-family:"Noto Serif TC",serif}
.dlg .tx.nar{color:#cfc3b6;font-style:normal}
.dlg .hint{position:absolute;right:14px;bottom:8px;font-size:11px;color:#6a5d55}
.skip{position:absolute;top:14px;right:14px;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:12px;padding:4px 10px;background:rgba(0,0,0,.4)}
#toast{position:absolute;left:50%;top:88px;transform:translateX(-50%);z-index:40;max-width:90%;pointer-events:none}
.tst{background:#2a1d1a;border:1px solid var(--line);padding:10px 14px;border-radius:8px;font-size:14px;line-height:1.6;margin-bottom:6px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .2s}
.tst.good{border-color:var(--red2);background:#3a1714}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.soul .pf{width:92px;height:92px;border:2px solid #5a2a22;border-radius:6px;background:#1a1010;flex:none;margin-right:12px;overflow:hidden;box-shadow:0 0 18px rgba(120,200,140,.12)}
.soul .pf img{width:100%;height:100%;display:block}
.soul .lft{display:flex;align-items:center}
.pt.img{background:#1a1010!important;overflow:hidden;width:96px;height:96px;border-radius:8px;border:2px solid #5a2a22;margin-top:-58px;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.pt.img img{width:100%;height:100%;display:block}
.coach{background:#1f1a10;border:1px solid #6a5420;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.75;color:#ead9a8}
.coach b{color:var(--gold)}
.goal{font-size:12px;color:var(--dim);margin-top:4px}
.dx{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.dx .it{text-align:center;font-size:12px;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:6px 4px;background:#160f0f}
.dx .it img{width:100%;aspect-ratio:1;display:block;border-radius:4px;margin-bottom:4px;background:#1a1010}
.dx .it.lock{opacity:.35;cursor:default}
.clue{padding:9px 12px;border-left:3px solid var(--gold);background:#1d1712;margin-bottom:8px;border-radius:0 6px 6px 0;font-size:14.5px;line-height:1.75}
.clue.q{border-color:#8a68c4;background:#191422}
.clue small{display:block;color:var(--dim);font-size:11.5px}
.ctabs{display:flex;gap:4px;margin-bottom:12px}
.ctabs button{flex:1;padding:7px 2px;border-bottom:2px solid var(--line);color:var(--dim);font-size:14px}
.ctabs button.on{border-color:var(--gold);color:var(--txt)}
.chr{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.chr img{width:72px;height:72px;border-radius:6px;flex:none;background:#1a1010}
.chr b{color:var(--gold)}
.chr p{font-size:13.5px;line-height:1.7;margin:2px 0 0;color:#d8cfc4}
.chr .lv{font-size:11.5px;color:var(--dim)}
.title-art{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55;image-rendering:pixelated}
.title-wrap{position:relative}
.title-wrap>*:not(.title-art):not(.ver){position:relative}
.ico{width:20px;height:20px;vertical-align:-4px;margin-right:4px;image-rendering:pixelated}
.tscreen{position:absolute;inset:0;overflow:hidden;cursor:pointer;background:#050303}
.tbg{position:absolute;inset:-4%;background:url(img/title.png) center/cover;image-rendering:pixelated;animation:tdrift 30s ease-in-out infinite alternate}
@keyframes tdrift{to{transform:scale(1.06) translate(-1%,1%)}}
.tfog{position:absolute;left:-20%;right:-20%;bottom:0;height:45%;background:radial-gradient(ellipse at 30% 80%,rgba(120,200,160,.22),transparent 60%),radial-gradient(ellipse at 75% 90%,rgba(120,200,160,.18),transparent 55%);animation:tfogm 14s linear infinite alternate;pointer-events:none}
@keyframes tfogm{to{transform:translateX(8%)}}
.tshade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,3,3,.25),rgba(5,3,3,.15) 35%,rgba(5,3,3,.9) 78%)}
.tfire{position:absolute;width:6px;height:6px;border-radius:50%;background:#8ff0b8;box-shadow:0 0 12px 4px rgba(120,240,170,.6);animation:tfl 6s ease-in-out infinite;pointer-events:none}
@keyframes tfl{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-30px);opacity:1}}
.tti{position:absolute;top:13%;left:0;right:0;text-align:center;pointer-events:none}
.tti .pre{font-size:13px;letter-spacing:10px;color:#9fd9b5;text-shadow:0 0 8px rgba(80,200,140,.6)}
.tti h1{font-size:clamp(40px,12vw,64px);font-weight:900;letter-spacing:10px;color:#f4e6c8;margin-top:6px;text-shadow:0 0 30px rgba(200,40,30,.9),0 0 4px #000,0 4px 0 #2a0806}
.tti .sub{margin-top:10px;font-size:14px;color:#cdbfb0;letter-spacing:2px;text-shadow:0 1px 4px #000}
.tmenu{position:absolute;left:0;right:0;bottom:14%;display:flex;flex-direction:column;align-items:center;gap:4px}
.tm{font-size:19px;letter-spacing:6px;padding:9px 40px;color:#d8ccbd;position:relative;text-shadow:0 2px 6px #000;transition:color .15s}
.tm.on{color:#ffe7b5}
.tm.on:before,.tm.on:after{content:"";position:absolute;top:50%;width:14px;height:20px;margin-top:-10px;border-radius:6px 6px 4px 4px;background:radial-gradient(circle at 50% 60%,#ffd27a,#d2432b 60%,#6a140e);box-shadow:0 0 14px rgba(255,140,60,.8);animation:tlant 1.6s ease-in-out infinite}
.tm.on:before{left:8px}.tm.on:after{right:8px}
@keyframes tlant{50%{box-shadow:0 0 22px rgba(255,160,80,1)}}
.tm small{display:block;text-align:center;font-size:11px;letter-spacing:2px;color:#a8988a;margin-top:2px}
.tctr{position:absolute;top:16px;right:16px;font-size:11px;color:#c9a45c;text-align:right;letter-spacing:1px;text-shadow:0 1px 3px #000;white-space:nowrap;pointer-events:none}
.tctr b{display:block;font-size:17px;color:#e8d6b0;letter-spacing:2px;font-variant-numeric:tabular-nums}
.thint{position:absolute;bottom:6%;left:0;right:0;text-align:center;font-size:12px;color:#7d6f64;letter-spacing:3px;pointer-events:none;animation:tblink 2.4s ease-in-out infinite}
@keyframes tblink{50%{opacity:.35}}
.tver{position:absolute;bottom:12px;left:14px;font-size:10.5px;color:#5f524a;pointer-events:none}
.end-wrap{padding:30px 6px;text-align:center}
.sug{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0f1c1b;border:1px solid #2a6d66;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13.5px}
.sug b{color:#7fd6c9}
.arcol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.arlab{font-size:12px;color:var(--gold);margin-bottom:4px}
table.arch{width:100%;border-collapse:collapse;font-size:12.5px;background:#e6d5a8;color:#2a1f17}
table.arch th{background:#5a2a22;color:#f0e0c0;font-weight:600;padding:4px 2px}
table.arch td{border:1px solid #b9a985;padding:5px 2px;text-align:center}
table.arch td.pk{cursor:pointer;background:#dfe7e6}
table.arch td.pk:hover{background:#c9dedb}
table.arch td.gt{background:#b3261e!important;color:#fff}
.artime{height:6px;background:#2b211e;border-radius:3px;overflow:hidden;margin-top:8px}
.artime div{height:100%;background:#2a9d8f;transition:width 1s linear}
.arwarn{background:#3a1714;border:1px solid #e0574c;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#ffd0c8;animation:shake .4s}
.arwarn.hid{background:#161a22;border-color:#4a5a7a;color:#b8c4dd;animation:none}
/* v0.3 fx */
.stampfx{position:absolute;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(0,0,0,.25)}
.stampfx .s{border:6px double #c8261b;color:#d8301f;font-weight:900;font-size:46px;padding:8px 20px;border-radius:8px;letter-spacing:8px;background:rgba(230,210,180,.06);animation:stampIn .42s cubic-bezier(.2,1.5,.4,1) both;text-shadow:0 0 2px rgba(0,0,0,.6)}
.stampfx .s small{display:block;font-size:13px;letter-spacing:4px;text-align:center;color:#e8a89f;font-weight:700}
@keyframes stampIn{0%{transform:scale(3.2) rotate(-28deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(-10deg);opacity:1}}
#app.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,3px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
#hitfx{position:absolute;inset:0;pointer-events:none;z-index:25;box-shadow:inset 0 0 0 rgba(224,87,76,0);opacity:0}
#hitfx.on{animation:hit .6s ease-out}
@keyframes hit{0%{opacity:1;box-shadow:inset 0 0 110px rgba(224,87,76,.85)}100%{opacity:0;box-shadow:inset 0 0 0 rgba(224,87,76,0)}}
.kw.got{animation:gotPulse .8s ease-out 1}
@keyframes gotPulse{0%{background:rgba(224,87,76,.7);color:#fff}100%{background:rgba(179,38,30,.16)}}
.tray.miss{animation:shake .3s}
.hud-row .set{margin-left:auto;padding:3px 9px;font-size:12px;border:1px solid var(--line);border-radius:12px;color:var(--dim)}
.seg{display:flex;gap:6px;margin:6px 0 14px}
.seg button{flex:1;padding:8px 4px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.seg button.on{border-color:var(--gold);color:var(--gold);background:rgba(201,164,92,.1)}
.rng{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.rng input{flex:1;accent-color:#b3261e}
.paper{font-size:calc(15.5px*var(--fs,1))!important}
.dlg .tx{font-size:calc(16.5px*var(--fs,1))!important}
.modal p,.find,.clue,.coach,.hb li,.chr p,.night-opt{font-size:calc(14.5px*var(--fs,1))!important}
.night-opt span,.chr .lv{font-size:calc(12.5px*var(--fs,1))!important}
.end-wrap h1{font-family:"Noto Serif TC",serif;font-size:30px;color:var(--red2);margin:10px 0 16px;letter-spacing:4px}
.end-wrap p{line-height:2;text-align:left;margin-bottom:12px;font-family:"Noto Serif TC",serif}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <div id="hud"></div>
  <div id="main"></div>
  <div id="foot"></div>
  <div id="ov"></div>
  <div id="scene" onclick="sceneNext()"></div>
  <div id="toast"></div>
  <div id="hitfx"></div>
</div>
<script>
'use strict';
const VERSION='v0.4.1';
const KEY='yama_night_v01';
const $=s=>document.querySelector(s);

/* ========== 判決 ========== */
const V={
  tongue:['拔舌獄','說謊、欺騙、詐騙、造假'],
  oil:['油鍋獄','貪財、收賄、為錢害人'],
  blade:['刀山獄','暴力傷人、害命'],

/* ========== 音樂與音效（WebAudio 合成） ========== */
const AU={ctx:null,bgm:null,sfx:null,master:null,on:false,timer:null,
 init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();}catch(e){return;}
  const x=this.ctx;this.master=x.createGain();this.master.connect(x.destination);
  this.bgm=x.createGain();this.sfx=x.createGain();this.bgm.connect(this.master);this.sfx.connect(this.master);
  // echo for plucks
  this.dly=x.createDelay(1.5);this.dly.delayTime.value=.42;this.fb=x.createGain();this.fb.gain.value=.38;const lp=x.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;
  this.dly.connect(lp);lp.connect(this.fb);this.fb.connect(this.dly);lp.connect(this.bgm);
  this.setVol();this.startBgm();},
 setVol(){if(!this.ctx)return;const t=this.ctx.currentTime;this.bgm.gain.setTargetAtTime(CFG.bgm*.55,t,.1);this.sfx.gain.setTargetAtTime(CFG.sfx*.9,t,.05);},
 startBgm(){const x=this.ctx;if(this.on)return;this.on=true;
  // drone
  const f=x.createBiquadFilter();f.type='lowpass';f.frequency.value=260;f.Q.value=3;
  const g=x.createGain();g.gain.value=.16;f.connect(g);g.connect(this.bgm);
  [[55,'sawtooth',0],[55.4,'sawtooth',0],[82.4,'triangle',0],[27.5,'sine',0]].forEach(([fr,ty])=>{const o=x.createOscillator();o.type=ty;o.frequency.value=fr;const og=x.createGain();og.gain.value=ty==='sine'?.9:.35;o.connect(og);og.connect(f);o.start();});
  const lfo=x.createOscillator();lfo.frequency.value=.05;const lg=x.createGain();lg.gain.value=140;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
  // wind noise
  const nb=x.createBuffer(1,x.sampleRate*3,x.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const ns=x.createBufferSource();ns.buffer=nb;ns.loop=true;const nf=x.createBiquadFilter();nf.type='bandpass';nf.frequency.value=500;nf.Q.value=.7;const ng=x.createGain();ng.gain.value=.025;
  const nl=x.createOscillator();nl.frequency.value=.08;const nlg=x.createGain();nlg.gain.value=300;nl.connect(nlg);nlg.connect(nf.frequency);nl.start();
  ns.connect(nf);nf.connect(ng);ng.connect(this.bgm);ns.start();
  const scale=[220,261.6,293.7,329.6,392,440,523.3,587.3];
  const loop=()=>{if(!this.ctx)return;const now=x.currentTime;
   const n=scale[Math.floor(Math.random()*scale.length)]*(Math.random()<.25?.5:1);this.pluck(n,now);
   if(Math.random()<.35)this.pluck(n*1.5,now+.18,.5);
   if(Math.random()<.12)this.bell(110,now+.05);
   this.timer=setTimeout(loop,1600+Math.random()*2600);};
  this.timer=setTimeout(loop,800);},
 pluck(fr,t,amp=1){const x=this.ctx;const o=x.createOscillator();o.type='triangle';o.frequency.value=fr;const o2=x.createOscillator();o2.type='sine';o2.frequency.value=fr*2.01;
  const g=x.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12*amp,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+2.2);
  const g2=x.createGain();g2.gain.value=.25;o2.connect(g2);g2.connect(g);o.connect(g);g.connect(this.bgm);g.connect(this.dly);o.start(t);o2.start(t);o.stop(t+2.3);o2.stop(t+2.3);},
 bell(fr,t){const x=this.ctx;[1,2.76,5.4].forEach((m,i)=>{const o=x.createOscillator();o.type='sine';o.frequency.value=fr*m;const g=x.createGain();g.gain.setValueAtTime(.09/(i+1),t);g.gain.exponentialRampToValueAtTime(.0005,t+5);o.connect(g);g.connect(this.bgm);o.start(t);o.stop(t+5.1);});},
 noise(t,dur,freq,q,amp,dest,type='bandpass'){const x=this.ctx;const b=x.createBuffer(1,Math.ceil(x.sampleRate*dur),x.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=x.createBufferSource();s.buffer=b;const f=x.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=x.createGain();g.gain.value=amp;s.connect(f);f.connect(g);g.connect(dest||this.sfx);s.start(t);},
 tone(t,f1,f2,dur,amp,type='sine'){const x=this.ctx;const o=x.createOscillator();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=x.createGain();g.gain.setValueAtTime(amp,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g);g.connect(this.sfx);o.start(t);o.stop(t+dur+.02);}
};
function sfx(k){if(!AU.ctx)return;const t=AU.ctx.currentTime;
 if(k==='click')AU.tone(t,900,700,.05,.05,'square');
 if(k==='page')AU.noise(t,.18,2600,.8,.35);
 if(k==='stamp'){AU.tone(t,120,38,.35,.9);AU.noise(t,.12,600,.6,1.2,null,'lowpass');AU.tone(t+.01,60,30,.5,.5,'triangle');}
 if(k==='hit'){[880,1320,1760].forEach((f,i)=>AU.tone(t+i*.06,f,f*.995,1.2,.12));AU.tone(t,220,218,1.6,.12);}
 if(k==='miss'){AU.tone(t,140,90,.28,.18,'sawtooth');}
 if(k==='ghost'){AU.tone(t,620,180,1.4,.12,'sine');AU.tone(t+.1,660,200,1.4,.06,'triangle');}
 if(k==='coin'){AU.tone(t,1200,1180,.12,.08,'square');AU.tone(t+.08,1600,1580,.18,.07,'square');}
 if(k==='tool'){AU.noise(t,.6,1400,4,.25);AU.tone(t,500,1100,.5,.07);}
}

 if(sp==='旁'){html=`<div class="dlg"><div class="tx nar">${T(tx)}</div><div class="hint">點擊繼續</div></div>`;}
 else{let name,color,glyph;const info=SP[sp];

  else if(info){name=info[0];color=info[1];glyph=sp==='妹'?'晴':sp;}

  html=`<div class="dlg"><div class="who">${pt}<div class="nm">${name}</div></div><div class="tx">${T(tx)}</div><div class="hint">點擊繼續</div></div>`;}
 $('#scene').innerHTML='<button class="skip" onclick="event.stopPropagation();sceneSkip()">跳過</button>'+html;
 const el=$('#scene .tx');const full=el.innerHTML;const sp2=SPEEDS[CFG.speed];
 if(sp2>0){const toks=full.split(/(<[^>]+>)/).flatMap(p=>p.startsWith('<')?[p]:[...p]);el.innerHTML='';let i=0,acc='';
  SC.typing=true;clearInterval(SC.tm);SC.full=full;
  SC.tm=setInterval(()=>{if(!SC){return;}let n=0;while(i<toks.length&&n<1){acc+=toks[i];if(!toks[i].startsWith('<'))n++;i++;}el.innerHTML=acc;if(i>=toks.length){clearInterval(SC.tm);SC.typing=false;}},sp2);}}

function buildQueue(d){const fixed=CASES.filter(c=>c.fixed===d).map(c=>c.id);if(d===1)return fixed;
 const need=COUNTS[d]-fixed.length;const pool=shuffle(CASES.filter(c=>!c.fixed&&c.min<=d&&!S.used.includes(c.id)));
 const pick=pool.slice(0,need).map(c=>c.id);pick.forEach(id=>S.used.push(id));const q=[...pick];
 if(d===8)return [...fixed,...q];
 fixed.forEach(id=>{if(d===7||d===14)q.push(id);else q.splice(Math.floor(Math.random()*(q.length+1)),0,id);});return q;}
function startDay(d){S.day=d;S.phase='shift';S.nightDone=false;const pre=[];
 if(d>1){S.stress=clamp(S.stress-5,0,100);S.grudge=clamp(S.grudge-5,0,100);
  let c=0;for(let i=0;i<S.pend;i++)if(Math.random()<.35)c++;S.pend=0;
  if(c){S.caught+=c;S.coin=Math.max(0,S.coin-150*c);S.stress=clamp(S.stress+15*c,0,100);
   pre.push(['崔','昨晚的「心意」，我都看見了。全數沒收，記過一次。']);
   if(S.caught<2)pre.push(['崔','再有下次，你就自己去油鍋裡泡。']);}}
 const haze=S.grudge>=30;if(haze){setTimeout(()=>sfx('ghost'),300);}if(haze)pre.push(['冤魂','……你……判錯了……我記得你……'],['旁','候審大廳飄著一股陰冷的冤氣。今晚，部分證物會被冤氣遮蔽。（到孟婆飲料站買「往生咒」可以降低冤氣）']);
 S.today={mirror:d>=2?S.up.mirror+S.bonusMirror:0,soup:d>=3?S.up.soup+S.bonusSoup:0,limit:480+S.bonusTime,haze};
 S.bonusMirror=0;S.bonusSoup=0;S.bonusTime=0;
 const queue=buildQueue(d);
 if(S.caught>=2){playScene(pre,()=>ending('bribe'));return;}
 save({queue,idx:0,time:0,scores:[],mirror:S.today.mirror,soup:S.today.soup});
 ({4:'d4',5:'d5',6:'hei',10:'jiang'})[d]&&addClue(({4:'d4',5:'d5',6:'hei',10:'jiang'})[d]);
 if(d>8)S.sus=clamp((S.sus||0)-2,0,100);
 const lines=[['旁',`第 ${d} 夜・23:00　候審亡魂：${queue.length} 位<br>試用期第 ${d} 天／30 天　｜　今晚目標：判完全部亡魂，07:00 前下班`],...(typeof DAYSTART[d]==='function'?DAYSTART[d]():(DAYSTART[d]||[])),...pre];
 const go=()=>beginShift({queue,idx:0,time:0,scores:[],mirror:S.today.mirror,soup:S.today.soup});
 playScene(lines,d===12?()=>choiceMa(go):go);}

/* ========== 判案畫面 ========== */
function kwHtml(text,c){const st=R.cur;const got=new Set();st.found.forEach(i=>{got.add(c.contra[i][0]);got.add(c.contra[i][1]);});
 return text.replace(/\{(\w+)\|([^}]+)\}/g,(m,k,l)=>`<span class="kw${st.sel.includes(k)?' sel':''}${got.has(k)?' got':''}" data-k="${k}" onclick="pickKw('${k}')">${l}</span>`).replace(/\n/g,'<br>');}
function docsOf(c){const st=R.cur;const L=c.docs.map(d=>({tab:d[0],title:d[1],text:d[2]}));
 if(st.soup)L.push({tab:'say',title:'孟婆湯・真話',text:c.soup||SOUP_GENERIC[c.id.charCodeAt(1)%SOUP_GENERIC.length],cls:'soup'});
 if(st.mirror)L.push({tab:'ev',title:'業鏡回放',text:c.mirror||'畫面平凡無奇，只是一段普通的日常……沒有新的線索。',cls:'special'});return L;}
function kwLabel(c,k){for(const d of docsOf(c)){const m=d.text.match(new RegExp('\\{'+k+'\\|([^}]+)\\}'));if(m)return m[1];}return k;}
function renderShift(){const c=cur(),st=R.cur;hud();
 const docs=docsOf(c);const nEv=docs.filter(d=>d.tab==='ev').length;
 const tabs=[['book','生死簿'],['say','陳述'],['ev',`證物 ${nEv}`],['find',`發現 ${st.found.length}/${c.contra.length}`]];
 let body='';
 if(st.tab==='find'){body=st.found.length?st.found.map(i=>`<div class="find">${c.contra[i][2]}</div>`).join(''):'<div class="muted" style="padding:10px 0">尚未發現任何矛盾。點選兩個關鍵字（紅色虛線）來「對質」。</div>';
  body+=`<div class="muted" style="margin-top:8px">本案可對質之處：${c.contra.length} 處</div>`;}
 else{let evIdx=0;docs.filter(d=>d.tab===st.tab).forEach(d=>{let cls='paper'+(d.tab==='book'?' book':'')+(d.cls?' '+d.cls:'');
  const p=`<div class="${cls}"><h4>${d.title}</h4>${kwHtml(d.text,c)}</div>`;
  if(d.tab==='ev'&&!d.cls&&st.haze&&evIdx===0){body+=`<div class="hazebox">${p}<div class="cover"><img class="px" src="img/s_grudge.png" alt="" style="width:64px;border-radius:6px;opacity:.85" onerror="this.remove()"><div>冤氣遮蔽了這份證物</div><button class="btn sm" onclick="clearHaze()">驅散（20 分鐘）</button></div></div>`;}
  else body+=p;if(d.tab==='ev')evIdx++;});}
 const coach=COACH[c.id]&&!(S.seenCoach||[]).includes(c.id)?`<div class="coach">${COACH[c.id]}</div>`:'';
 $('#main').innerHTML=`<div class="soul"><div class="lft"><div class="pf"><img class="px" src="img/s_${c.id}.png" alt="" onerror="this.remove()"></div><div><div class="nm">${c.name}</div><div class="mt">${c.meta}</div></div></div><div class="q">候審 ${R.idx+1} / ${R.queue.length}</div></div>
 ${coach}${sugHtml(c)}<div class="tabs">${tabs.map(t=>`<button class="${st.tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>${body}`;
 const s1=st.sel[0]?`<span class="chip">${kwLabel(c,st.sel[0])}</span>`:'<span class="chip empty">關鍵字 1</span>';
 const s2=st.sel[1]?`<span class="chip">${kwLabel(c,st.sel[1])}</span>`:'<span class="chip empty">關鍵字 2</span>';
 const mOk=S.day>=2,sOk=S.day>=3;
 setFoot(`<div class="tray"><span class="muted">對質</span>${s1}<span class="muted">×</span>${s2}<button class="btn sm" style="margin-left:auto" ${st.sel.length<2?'disabled':''} onclick="confront()">對質（${S.up.speed?10:15} 分）</button></div>
 <div class="tools"><button class="btn" ${!mOk||st.mirror||R.mirror<=0?'disabled':''} onclick="useMirror()"><img class="ico px" src="img/i_mirror.png" alt="" onerror="this.remove()">業鏡 ${mOk?R.mirror:'—'}</button><button class="btn" ${!sOk||st.soup||R.soup<=0?'disabled':''} onclick="useSoup()"><img class="ico px" src="img/i_soup.png" alt="" onerror="this.remove()">試劑 ${sOk?R.soup:'—'}</button><button class="btn ghost" onclick="openDossier()"><img class="ico px" src="img/i_file.png" alt="" onerror="this.remove()">卷宗</button><button class="btn red" onclick="openVerdict()"><img class="ico px" src="img/i_judge.png" alt="" onerror="this.remove()">判決</button></div>`);}
function sugHtml(c){if(S.day<8)return '';const v=c.sug||c.ans;const conf=c.anom?'99.7%':(c.sug&&c.sug!==c.ans?'94.1%':'91.8%');
 return `<div class="sug"><div><span class="muted">智慧判決建議</span>　<b>${V[v][0]}</b>　<span class="muted">信心 ${conf}${c.anom?'・異常件已自動修正':''}</span></div><button class="btn sm" onclick="adoptSug()">採用建議（10 分）</button></div>`;}
function adoptSug(){const c=cur();VSEL=c.sug||c.ans;VBRIBE=false;R.time-=30;R.adopt=1;doVerdict();}
function setTab(t){if(R.cur.tab!==t)sfx('page');R.cur.tab=t;renderShift();}
function pickKw(k){const s=R.cur.sel;const i=s.indexOf(k);if(i>=0)s.splice(i,1);else{s.push(k);if(s.length>2)s.shift();}renderShift();}
function confront(){const st=R.cur,c=cur();if(st.sel.length<2)return;const [x,y]=st.sel;
 const i=c.contra.findIndex(p=>(p[0]===x&&p[1]===y)||(p[0]===y&&p[1]===x));
 if(i>=0&&st.found.includes(i)){toast('這一處已經對質過了。');st.sel=[];return renderShift();}
 R.time+=S.up.speed?10:15;
 if(i>=0){st.found.push(i);toast('發現矛盾｜'+c.contra[i][2],'good',4200);}
 else{S.stress=clamp(S.stress+2,0,100);toast('兩者之間看不出關聯……（壓力 +2）');}
 st.sel=[];renderShift();if(i>=0){sfx('hit');fxHit();}else{sfx('miss');const tr=$('.tray');tr&&tr.classList.add('miss');}checkEnd();}
function clearHaze(){R.cur.haze=false;R.time+=20;sfx('ghost');renderShift();}
function useMirror(){const st=R.cur,c=cur();if(st.mirror||R.mirror<=0)return;R.mirror--;st.mirror=true;R.time+=20;sfx('tool');st.tab='ev';renderShift();toast(c.mirror?'業鏡亮起，浮現出一段生前畫面。':'業鏡裡的畫面平凡無奇。',c.mirror?'good':'');}
function useSoup(){const st=R.cur,c=cur();if(st.soup||R.soup<=0)return;R.soup--;st.soup=true;R.time+=20;sfx('tool');st.tab='say';renderShift();toast(c.soup?'亡魂的眼神一變，說出了一句真話。':'亡魂說了一句真話……但似乎與案情無關。',c.soup?'good':'');}

/* ========== 判決 ========== */
function openVerdict(){VSEL=null;VBRIBE=false;renderVerdict();}
function renderVerdict(){const c=cur();const showBribe=c.bribe&&S.day>=5;
 let h='<h2>判決</h2>';
 VGROUP.forEach(([lb,ks])=>{h+=`<div class="vg"><div class="lb">${lb}</div><div class="vgrid">`;
  ks.forEach(k=>{const lock=k==='back'&&S.day<4;h+=`<button class="vbtn${VSEL===k?' on':''}" ${lock?'disabled':''} onclick="pickV('${k}')">${V[k][0]}<small>${lock?'第 4 夜開放':V[k][1]}</small></button>`;});h+='</div></div>';});
 if(showBribe)h+=`<div class="bribe${VBRIBE?' on':''}" onclick="VBRIBE=!VBRIBE;renderVerdict()"><b>${VBRIBE?'■':'□'}</b>收下「心意」（冥幣 ${c.bribe}）・陰德會下降，也可能被抓到</div>`;
 h+=`<div class="row"><button class="btn ghost" onclick="closeModal()">再看看</button><button class="btn red" ${VSEL?'':'disabled'} onclick="doVerdict()">蓋章定案</button></div>`;
 modal(h);}
function pickV(k){VSEL=k;renderVerdict();}
function scoreOf(c,v){if(v===c.ans)return 100;if(c.part&&c.part[v]!=null)return Math.round(c.part[v]*100);if(v==='hold')return 30;return 0;}
function doVerdict(){const c=cur(),st=R.cur,v=VSEL;if(!v||R.busy)return;R.busy=true;closeModal();const bribe=VBRIBE&&c.bribe&&S.day>=5;
 R.time+=40;const sc=scoreOf(c,v);const found=st.found.length,total=c.contra.length;
 const bonus=sc>0?Math.round(found/total*20):0;const fin=Math.min(100,(sc>=100?80:Math.round(sc*.8))+bonus);
 const tier=sc>=100?'ok':(sc>=50?'part':'bad');const d={coin:0,karma:0,stress:2,grudge:0};
 if(tier==='ok'){d.coin=20+found*5;d.karma=['heaven','back'].includes(c.ans)?5:3;}
 else if(tier==='part'){d.coin=10+found*3;d.karma=1;}
 else{if(v==='hold'){d.stress+=1;}else{d.grudge=['back','heaven','human','hold'].includes(c.ans)?20:12;d.karma=-3;d.stress+=5;}}
 if(bribe){d.coin+=c.bribe;d.karma-=10;S.pend++;S.stats.bribes++;}
 S.coin+=d.coin;S.karma+=d.karma;S.stress=clamp(S.stress+d.stress,0,100);S.grudge=clamp(S.grudge+d.grudge,0,100);
 S.stats.judged++;if(tier==='ok')S.stats.correct++;S.stats.finds+=found;R.scores.push(fin);
 if(c.id==='F9')S.flags.f9=v;
 if(S.day>=8){if(R.adopt){S.sus=clamp((S.sus||0)-3,0,100);}
  if(c.anom&&(v==='back'||v==='hold')){const inc=c.anom===2?15:c.anom===3?10:8;S.sus=clamp((S.sus||0)+inc,0,100);d.sus=inc;}}
 R.adopt=0;
 if(c.id==='G6'&&v==='back')addClue('kid');if(c.id==='G7')addClue('trap');if(c.id==='Q13')addClue('taxi');if(c.id==='G1')addClue('g1');if(c.id==='G3')addClue('g3');if(c.id==='G4')addClue('g4');
 if(c.id==='G6')S.flags.kid=v;if(c.id==='G7')S.flags.trap=v;
 S.seenCoach=S.seenCoach||[];if(!S.seenCoach.includes(c.id))S.seenCoach.push(c.id);
 S.dex=S.dex||{};S.dex[c.id]={v,tier};
 ({F4:'f4',F8:'f8',F9:'f9'})[c.id]&&addClue(({F4:'f4',F8:'f8',F9:'f9'})[c.id]);
 const head={ok:['res-ok','判決正確'],part:['res-part','判決尚可'],bad:['res-bad','判決錯誤']}[tier];
 let txt;if(tier==='bad')txt=(c.wt&&c.wt[v])||`${c.name}帶著不甘離開了審判殿。你隱約聽見身後傳來一聲嘆息。`;else txt=c.review;
 if(bribe)txt+='<br><span style="color:#e2c58a">你把那份「心意」收進了抽屜。</span>';
 const dl=[];if(d.coin)dl.push(`冥幣 ${d.coin>0?'+':''}${d.coin}`);if(d.karma)dl.push(`陰德 ${d.karma>0?'+':''}${d.karma}`);dl.push(`壓力 +${d.stress}`);if(d.grudge)dl.push(`冤氣 +${d.grudge}`);if(d.sus)dl.push(`懷疑 +${d.sus}`);
 const last=R.idx>=R.queue.length-1;
 const html=`<h2 class="${head[0]}">${head[1]}</h2><p class="muted">你的判決：${V[v][0]}${tier!=='ok'?`　｜　崔判官批註：正解應為「${V[c.ans][0]}」`:''}</p>
 <div class="soul" style="margin-bottom:6px"><div class="lft"><div class="pf" style="width:64px;height:64px"><img class="px" src="img/s_${c.id}.png" alt="" onerror="this.remove()"></div><div class="muted" style="line-height:1.7">【生平】${LIFE[c.id]||''}</div></div></div>
 <p class="serif">${txt}</p><div class="delta">本案評分 ${fin}　｜　發現矛盾 ${found}/${total}<br>${dl.join('　')}</div>
 <div class="row"><button class="btn red" onclick="nextCase()">${last?'結束今晚的夜班':'下一位'}</button></div>`;
 stampThen(V[v][0],bribe?'收受心意':'定案',()=>{modal(html);if(tier==='bad')sfx('ghost');});}
function nextCase(){closeModal();R.busy=false;if(checkEnd())return;R.idx++;save();if(R.idx>=R.queue.length)endShift();else loadCase();}

/* ========== 下班 ========== */
function endShift(){const over=Math.max(0,R.time-S.today.limit);const avg=R.scores.reduce((a,b)=>a+b,0)/R.scores.length;
 const pen=Math.min(30,Math.floor(over/6))+(S.day===12&&S.flags.maGive?20:0);const kpi=Math.max(0,Math.round(avg-pen));S.stats.kpi.push(kpi);
 const ost=Math.floor(over/20);S.stress=clamp(S.stress+ost,0,100);S.coin+=40;hud();
 const t=23*60+R.time;const end=String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
 let cm=kpi>=90?'崔判官：「……還行。」（這是他的最高評價）':kpi>=70?'崔判官：「普通。明天繼續。」':kpi>=50?'崔判官：「你是來地府度假的嗎？」':'崔判官：「再這樣下去，你的試用期會很短。」';
 modal(`<h2>第 ${S.day} 夜・結算</h2><div class="stat"><span>下班時間</span><span>${end}${over?`（加班 ${over} 分）`:''}</span></div>
 <div class="stat"><span>案件平均分</span><span>${Math.round(avg)}</span></div>${pen?`<div class="stat"><span>加班扣分</span><span>-${pen}</span></div>`:''}
 <div class="stat"><span><b>今日 KPI</b></span><span><b>${kpi}</b></span></div><div class="stat"><span>夜班津貼</span><span>冥幣 +40</span></div>${ost?`<div class="stat"><span>加班疲勞</span><span>壓力 +${ost}</span></div>`:''}
 <p class="serif" style="margin-top:12px">${cm}</p><div class="row"><button class="btn red" onclick="afterSummary()">下班</button></div>`);}
function afterSummary(){closeModal();if(checkEnd())return;R=null;S.phase='night';save(null);if(S.day===1){afterNight();return;}nightMenu();}
function nightMenu(){hud();setFoot('');setBg('bg_tea');
 $('#main').innerHTML=`<div class="card"><h3>夜間行動（擇一）<button class="btn sm" style="float:right" onclick="openDossier('plot')">卷宗</button></h3><div class="muted" style="margin-bottom:12px">天快亮了，地府的「晚上」才剛開始。</div>
 <button class="night-opt" onclick="nightDo('meng')"><b>孟婆茶水間・聊八卦</b><span>孟婆的故事 ${Math.min(S.rel.meng,3)}／3・可能獲得主線線索</span></button>
 <button class="night-opt" onclick="nightDo('niu')"><b>找牛頭摸魚</b><span>壓力 -15・牛頭的故事 ${Math.min(S.rel.niu,3)}／3</span></button>
 <button class="night-opt" onclick="nightDo('ma')"><b>向馬面請教效率</b><span>明晚工時 +30 分鐘・壓力 +5・馬面的故事 ${Math.min(S.rel.ma,3)}／3</span></button>
 <button class="night-opt" onclick="studyMenu()"><b>判官研習班</b><span>花冥幣永久升級能力</span></button>
 ${S.day>=9?`<button class="night-opt" onclick="archStart()" style="border-color:#2a9d8f"><b>潛入檔案室・名單比對</b><span>蒐集證據・壓力 +8・被抓到懷疑 +15</span></button>`:''}
 <button class="night-opt" onclick="nightDo('rest')"><b>回宿舍睡覺</b><span>壓力 -30</span></button></div>
 <div class="card"><h3>孟婆湯飲料站</h3><div class="muted" style="margin-bottom:10px">購物不消耗行動${S.day>=8?'<br><span style="color:#e0574c">陽間紙錢燒太多，冥幣通膨中：全品項 ×3</span>':''}</div>
 <button class="night-opt" onclick="buy('tea')"><b>安神茶・${price(25)} 冥幣</b><span>壓力 -20</span></button>
 <button class="night-opt" onclick="buy('sutra')"><b>往生咒・${price(40)} 冥幣</b><span>冤氣 -25</span></button>
 <button class="night-opt" onclick="buy('mirror')"><b>業鏡碎片・${price(30)} 冥幣</b><span>明晚業鏡 +1（第 2 夜起有效）</span></button>
 <button class="night-opt" onclick="buy('soup')"><b>濃縮試劑・${price(30)} 冥幣</b><span>明晚試劑 +1（第 3 夜起有效）</span></button></div>`;}
function price(n){return S&&S.day>=8?n*3:n;}
function buy(k){const P={tea:price(25),sutra:price(40),mirror:price(30),soup:price(30)};if(S.coin<P[k])return toast('冥幣不夠。孟婆：「本店不賒帳。」');
 S.coin-=P[k];sfx('coin');if(k==='tea')S.stress=clamp(S.stress-20,0,100);if(k==='sutra')S.grudge=clamp(S.grudge-25,0,100);if(k==='mirror')S.bonusMirror++;if(k==='soup')S.bonusSoup++;
 toast('購買成功。');nightMenu();}
function nightDo(k){let title,text;const i=S.day-1;
 if(k==='rest'){S.stress=clamp(S.stress-30,0,100);setBg('bg_dorm');nightResult('回宿舍睡覺','你倒頭就睡。地府的床意外地軟。<br><span class="muted">壓力 -30</span>');return;}
 const eff={meng:'',niu:'壓力 -15',ma:'明晚工時 +30 分鐘・壓力 +5'}[k];
 if(k==='niu')S.stress=clamp(S.stress-15,0,100);
 if(k==='ma'){S.bonusTime=30;S.stress=clamp(S.stress+5,0,100);}
 const stage=S.rel[k];S.rel[k]++;const who={meng:'孟婆',niu:'牛頭',ma:'馬面'}[k];
 const pool={meng:MENG,niu:NIU,ma:MA}[k];
 if(k==='meng')setBg('bg_tea');
 if(SUB[k][stage]){const s=SUB[k][stage];
  playScene(s.L,()=>{let tx=`你和${who}度過了一段時間。<br><span class="muted">${who}的故事 ${stage+1}／3：〈${s.t}〉</span>`;
   if(s.clue){addClue(s.clue);tx+=`<br><span style="color:var(--gold)">卷宗新增線索：${CLUES[s.clue][1]}</span>`;}
   if(eff)tx+=`<br><span class="muted">${eff}</span>`;nightResult(who,tx);});}
 else nightResult(who,`${who}：「${pool[i%pool.length]}」${eff?`<br><span class="muted">${eff}</span>`:''}`);}
function addClue(id){S.clues=S.clues||[];if(!S.clues.includes(id)){S.clues.push(id);if(R||document.querySelector('#hud').style.display==='block')toast('卷宗新增線索','good');}}
function setBg(name){$('#bg').style.backgroundImage=name?`url(img/${name}.png)`:'none';}
function studyMenu(){const U=[['mirror','業鏡上限 +1',price(120),`目前 ${S.up.mirror}`],['soup','試劑上限 +1',price(120),`目前 ${S.up.soup}`],['speed','速讀術',price(80),S.up.speed?'已習得':'對質耗時 15→10 分']];
 modal(`<h2>判官研習班</h2><p class="muted">研習會占用今晚的行動。目前冥幣：${S.coin}</p>${U.map(u=>`<button class="night-opt" ${(u[0]==='speed'&&S.up.speed)||S.coin<u[2]?'disabled style="opacity:.4"':''} onclick="study('${u[0]}',${u[2]})"><b>${u[1]}・${u[2]} 冥幣</b><span>${u[3]}</span></button>`).join('')}<div class="row"><button class="btn ghost" onclick="closeModal()">先不要</button></div>`);}
function study(k,cost){if(S.coin<cost)return;S.coin-=cost;if(k==='speed')S.up.speed=1;else S.up[k]++;closeModal();nightResult('判官研習班','你在研習班熬了一整晚，筆記寫滿了三本。<br><span class="muted">能力已提升</span>');}
function nightResult(title,text){S.nightDone=true;save(null);hud();$('#main').innerHTML=`<div class="card"><h3>${title}</h3><p class="serif" style="line-height:2">${text}</p><div class="row"><button class="btn red" onclick="afterNight()">回宿舍</button></div></div>`;checkEnd();}
function afterNight(){const go=()=>{if(S.day===7||S.day===14)actEnd();else startDay(S.day+1);};const sc=DAYEND[S.day];if(sc)playScene(sc,go);else go();}

/* ========== 結局 / 幕末 ========== */
function checkEnd(){if((S.sus||0)>=100){ending('recycle');return true;}if(S.stress>=100){ending('burnout');return true;}if(S.grudge>=100){ending('grudge');return true;}return false;}
const ENDINGS={
burnout:['二次過勞','你在審判桌前睡著了，再也沒有醒來。\n崔判官說，這是他在地府三百年來，第一次看到有人在地府過勞。\n你的魂魄化成一縷青煙，連投胎的隊伍都排不上。\n陸主任在你的人事檔案上寫下最後一行：「抗壓性不足」。'],
grudge:['冤魂索命','被你判錯的亡魂們聯名告上了第一殿。\n審判很快，判決更快。\n你被押往一座你親手判過別人的地獄。\n押送你的白無常小聲說：「新人，我們本來很看好你的。」'],

/* ========== 卷宗 ========== */
let DTAB='plot';
function openDossier(t){if(t)DTAB=t;if(!S){openHandbook();return;}
 const tabs=[['plot','主線'],['chars','角色'],['dex','亡魂'],['rule','手冊']];
 let body='';
 if(DTAB==='plot'){const cl=(S.clues||[]).filter(k=>CLUES[k]);
  body='<div class="muted" style="margin-bottom:8px">目前查到的事</div>'+cl.map(k=>`<div class="clue"><small>${CLUES[k][0]}</small>${CLUES[k][1]}</div>`).join('');
  const qs=QUESTIONS.filter(q=>S.day>=q[0]);if(qs.length)body+='<div class="muted" style="margin:14px 0 8px">尚未解開的疑點</div>'+qs.map(q=>`<div class="clue q">${q[1]}</div>`).join('');
  if((S.evid||[]).length)body+='<div class="muted" style="margin:14px 0 8px">檔案室證據（第四幕審判用）</div>'+S.evid.map(e=>`<div class="clue" style="border-color:#2a9d8f">${e}</div>`).join('');
  const hid=Object.keys(CLUES).length-cl.length;body+=`<div class="muted" style="margin-top:10px">還有 ${hid} 條線索未取得。孟婆、牛頭、馬面的故事裡，也藏著線索。</div>`;}
 if(DTAB==='chars'){body=CHARS.filter(c=>!c.from||S.day>=c.from).map(c=>{let ln='';
  if(c.sub){const n=Math.min(S.rel[c.sub],3);ln=`<div class="lv">個人故事 ${n}／3</div>`+SUB[c.sub].slice(0,n).map(s=>`<p>〈${s.t}〉</p>`).join('')+(c.line||[]).filter(l=>S.day>=l[0]).map(l=>`<p>・${l[1]}</p>`).join('');}
  else ln=(c.line||[]).filter(l=>S.day>=l[0]).map(l=>`<p>・${l[1]}</p>`).join('');
  return `<div class="chr"><img class="px" src="img/${PIMG[c.sp]}.png" alt="" onerror="this.style.visibility='hidden'"><div><b>${c.name}</b>　<span class="lv">${c.role}</span><p>${c.bio}</p>${ln}</div></div>`;}).join('');}
 if(DTAB==='dex'){const ids=CASES.filter(c=>S.day>=8||!(c.fixed>7||c.min>=8)).map(c=>c.id);const dx=S.dex||{};
  body=`<div class="muted" style="margin-bottom:8px">已審判 ${Object.keys(dx).length}／${ids.length}　點擊可看生平</div><div class="dx">`+ids.map(id=>{const c=CMAP[id],d=dx[id];
   return d?`<div class="it" onclick="dexOne('${id}')"><img class="px" src="img/s_${id}.png" alt="">${c.name}</div>`:`<div class="it lock"><img class="px" src="img/s_ghost.png" alt="" onerror="this.style.visibility='hidden'">？？？</div>`;}).join('')+'</div>';}
 if(DTAB==='rule')body=handbookHtml();
 modal(`<h2>卷宗</h2><div class="ctabs">${tabs.map(t=>`<button class="${DTAB===t[0]?'on':''}" onclick="openDossier('${t[0]}')">${t[1]}</button>`).join('')}</div>${body}<div class="row"><button class="btn" onclick="closeModal()">關閉</button></div>`);}
function dexOne(id){const c=CMAP[id],d=S.dex[id];const res={ok:'判決正確',part:'判決尚可',bad:'判決錯誤'}[d.tier];
 modal(`<h2>${c.name}</h2><div class="soul"><div class="lft"><div class="pf" style="width:120px;height:120px"><img class="px" src="img/s_${id}.png" alt=""></div><div><div class="mt">${c.meta}</div><div class="mt">你的判決：${V[d.v][0]}（${res}）</div></div></div></div><p>${LIFE[id]||''}</p>${d.tier!=='bad'?`<p class="muted">${c.review}</p>`:''}<div class="row"><button class="btn" onclick="openDossier('dex')">返回</button></div>`);}

const ARCH_FILL=['陳美蘭','王志明','黃淑貞','李家豪','劉怡君','張俊宏','蔡淑芬','楊志偉','許雅雯','鄭明哲','謝佩珊','郭建宏','曾怡婷','邱文傑','洪麗華','廖國明','賴秀琴','周宗翰','游淑惠','簡志豪'];

let AR=null;
function archStart(){if(S.today&&S.today.archDone)return;
 const vic=shuffle(ARCH_VIC.filter(v=>!(S.evid||[]).some(e=>e.startsWith(v[0])))).slice(0,3);
 const fill=shuffle([...ARCH_FILL]).slice(0,6-vic.length).map(n=>[n,20+Math.floor(Math.random()*60)]);
 const rows=[...vic.map(v=>({n:v[0],age:v[1],life:v[2],bad:1})),...fill.map(f=>({n:f[0],age:f[1],life:f[1]+5+Math.floor(Math.random()*40),bad:0}))];
 rows.forEach(r=>{r.yr=2026+(r.life-r.age);r.sLife=r.bad?r.age:r.life;r.sYr=r.bad?2026:r.yr;});
 AR={rows:shuffle([...rows]),sys:shuffle([...rows]),found:[],t:45,alert:0,hid:0,over:false,tm:null,patrol:[8+Math.floor(Math.random()*10),24+Math.floor(Math.random()*10)]};
 setBg('bg_archive');archRender();AR.tm=setInterval(archTick,1000);}
function archTick(){if(!AR||AR.over)return;
 if(AR.hid>0){AR.hid--;if(AR.hid===0)toast('腳步聲走遠了。');archRender();return;}
 if(AR.alert>0){AR.alert--;if(AR.alert===0){archEnd(true);return;}archRender();return;}
 AR.t--;const el=45-AR.t;if(AR.patrol.includes(el)){AR.alert=3;sfx('ghost');}
 if(AR.t<=0){archEnd(false);return;}archRender();}
function archHide(){if(!AR||AR.alert<=0)return;AR.alert=0;AR.hid=3;sfx('page');archRender();}
function archPick(i,f){if(!AR||AR.over||AR.alert>0||AR.hid>0)return;const r=AR.sys[i];const key=r.n+f;
 if(AR.found.includes(key))return;
 if(r.bad){AR.found.push(key);sfx('hit');fxHit();}else{AR.t=Math.max(1,AR.t-4);sfx('miss');toast('兩份資料是一樣的……（時間 -4 秒）');}
 if(AR.rows.filter(x=>x.bad).every(x=>AR.found.includes(x.n+'life')||AR.found.includes(x.n+'yr')))archEnd(false);else archRender();}
function archRender(){const tb=(L,sys)=>`<table class="arch"><tr><th>姓名</th><th>陽壽</th><th>死期</th></tr>${L.map((r,i)=>{
  const lf=sys?r.sLife:r.life,yr=sys?r.sYr:r.yr;const gl=AR.found.includes(r.n+'life'),gy=AR.found.includes(r.n+'yr');
  return `<tr><td>${r.n}</td><td class="${sys?'pk':''}${gl?' gt':''}" ${sys?`onclick="archPick(${i},'life')"`:''}>${lf} 歲</td><td class="${sys?'pk':''}${gy?' gt':''}" ${sys?`onclick="archPick(${i},'yr')"`:''}>${yr}</td></tr>`;}).join('')}</table>`;
 const need=AR.rows.filter(x=>x.bad).length;const got=AR.rows.filter(x=>x.bad&&(AR.found.includes(x.n+'life')||AR.found.includes(x.n+'yr'))).length;
 let warn='';if(AR.alert>0)warn=`<div class="arwarn">腳步聲靠近了！<button class="btn red" onclick="archHide()">躲起來（${AR.alert}）</button></div>`;
 if(AR.hid>0)warn=`<div class="arwarn hid">躲在書架後面，屏住呼吸……（${AR.hid}）</div>`;
 modal(`<h2>檔案室・名單比對</h2><div class="muted">點出「系統名單」裡和紙本不一樣的格子。聽到腳步聲要立刻躲起來。</div>
 <div class="artime"><div style="width:${AR.t/45*100}%"></div></div><div class="muted" style="margin:4px 0 8px">剩餘 ${AR.t} 秒　｜　已找到 ${got}／${need}</div>${warn}
 <div class="arcol"><div><div class="arlab">紙本名單（崔判官）</div>${tb(AR.rows,false)}</div><div><div class="arlab">系統名單（陸主任）</div>${tb(AR.sys,true)}</div></div>`);}
function archEnd(caught){if(!AR)return;AR.over=true;clearInterval(AR.tm);S.today.archDone=1;S.evid=S.evid||[];
 const newE=[];AR.rows.filter(x=>x.bad&&(AR.found.includes(x.n+'life')||AR.found.includes(x.n+'yr'))).forEach(x=>{const e=`${x.n}：紙本陽壽 ${x.life} 歲，系統被改成 ${x.age} 歲`;if(!S.evid.includes(e)){S.evid.push(e);newE.push(e);}});
 if(newE.length)addClue('arch');
 S.stress=clamp(S.stress+8,0,100);let tx;
 if(caught){S.sus=clamp((S.sus||0)+15,0,100);S.stress=clamp(S.stress+10,0,100);tx='手電筒的光照到了你的臉。<br>「這麼晚了，判官還在加班啊？」——是陸主任的聲音。<br><span class="muted">懷疑 +15・壓力 +18</span>';}
 else tx='你在巡邏回來前溜出了檔案室。<br><span class="muted">壓力 +8</span>';
 if(newE.length)tx+='<br><br><span style="color:var(--gold)">取得證據：</span><br>'+newE.join('<br>');else tx+='<br><br>這次沒有找到新的證據。';
 AR=null;closeModal();nightResult('潛入檔案室',tx);}
