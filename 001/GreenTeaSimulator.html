  /* ---------- 存檔 ---------- */
  openSaves(mode = "save") {
    const inGame = !!State.get() && !$("#game").classList.contains("hidden");
    const slot = (k, label) => { const i = Save.info(k); return `<div class="box" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><b>${label}</b><br><small>${i ? `${Utils.esc(i.name)}・${i.persona}・第 ${i.week} 週 Day ${i.day}・${new Date(i.savedAt).toLocaleString()}${i.ver ? "・v" + i.ver : ""}` : "空"}</small></div>
      ${mode === "save" && k !== "auto" && k !== "checkpoint" ? `<button class="btn sm primary" data-s="${k}">存檔</button>` : ""}${i ? `<button class="btn sm" data-l="${k}">讀取</button>` : ""}${i && k !== "checkpoint" && k !== "auto" && k !== "prev" ? `<button class="btn sm ghost" data-d="${k}">刪除</button>` : ""}</div>`; };
    const html = `${slot("auto", "自動存檔")}${slot("prev", "上一份自動存檔（備份）")}${slot("checkpoint", "章節節點備份（每週開始）")}${[0, 1, 2].map(i => slot(i, "手動存檔 " + (i + 1))).join("")}
      <div style="display:flex;gap:8px;flex-wrap:wrap">${inGame ? `<button class="btn sm" id="exp">匯出 JSON 備份</button>` : ""}<label class="btn sm" style="cursor:pointer">匯入 JSON 備份<input type="file" id="imp" accept=".json,application/json" hidden></label></div>`;
    const m = this.modal(mode === "save" ? "存檔／讀檔" : "讀取存檔", html, {});
    $$("[data-s]", m).forEach(b => b.onclick = () => { if (Save.saveGame(+b.dataset.s)) { this.toast("存檔成功"); this.openSaves(mode); } });
    $$("[data-l]", m).forEach(b => b.onclick = () => { const k = b.dataset.l; if (Save.loadGame(isNaN(+k) ? k : +k)) { m.remove(); Game.afterLoad(); } });
    $$("[data-d]", m).forEach(b => b.onclick = () => { Save.deleteSave(+b.dataset.d); this.openSaves(mode); });
    const e = $("#exp", m); if (e) e.onclick = () => Save.exportSave();
    $("#imp", m).onchange = ev => { const f = ev.target.files[0]; if (f) Save.importSave(f, ok => { if (ok) { m.remove(); Game.afterLoad(); } }); };
  },

  /* ---------- 圖鑑／成就／設定 ---------- */
  openGallery() {
    const meta = Save.meta();
    const html = `<h4 style="font-family:var(--serif);color:var(--pink-d);margin-top:0">人物圖鑑</h4><div class="gal">${NPC_IDS.map(id => `<div class="g">${this.imgTag(id)}<b>${NPCS[id].name}</b><br><small>${NPCS[id].role}・${NPCS[id].traits}</small></div>`).join("")}</div>
      <h4 style="font-family:var(--serif);color:var(--pink-d)">結局圖鑑（${meta.endings.length}/4）</h4><div class="gal">${Object.entries(ENDINGS).map(([k, e]) => `<div class="g ${meta.endings.includes(k) ? "" : "lock"}"><img src="${e.cg}" onerror="this.style.background='linear-gradient(135deg,#3a1f4d,#c9558b)';this.removeAttribute('src')"><b>${meta.endings.includes(k) ? e.name : "？？？"}</b></div>`).join("")}</div>`;
    this.modal("圖鑑", html, {});
  },
  openAchievements() {
    const meta = Save.meta(), cur = State.get()?.achievements.unlocked || [];
    const html = Object.entries(ACHIEVEMENTS).map(([k, a]) => { const on = meta.achievements.includes(k) || cur.includes(k); return `<div class="box" style="opacity:${on ? 1 : .5}"><b>${on ? "🏆" : "🔒"} ${a.name}</b><br><small>${a.desc}</small></div>`; }).join("");
    this.modal("成就", html, {});
  },
  openSettings() {
    const st = Save.settings();
    const fsOpts = [["small", "小"], ["normal", "標準"], ["large", "大"], ["xlarge", "特大"]];
    const m = this.modal("設定", `<div class="box"><b>字體大小</b><div class="opt-grid" style="grid-template-columns:repeat(4,1fr);margin:8px 0 6px">${fsOpts.map(([k, n]) => `<button data-fs="${k}" class="${st.fontScale === k ? "on" : ""}">${n}</button>`).join("")}</div><p style="margin:0;color:var(--ink-l)">預覽：「我只是想幫忙而已嘛……」</p></div>
      <label class="box" style="display:flex;justify-content:space-between;align-items:center">音效 <input type="checkbox" id="sSnd" ${st.sound ? "checked" : ""}></label>
      <div class="box"><b>遊戲說明</b><p style="font-size:calc(13px * var(--fs));margin:6px 0 0">每天兩次行動。好感與信任分開計算；「個別懷疑」是每個人對妳的戒心（80 開始調查、100 拆穿），「鑑茶警報」是整個社交圈的風聲（100 直接 Game Over）。戰鬥中看清 NPC 的意圖，用對標籤的卡牌提升氣氛。私下行動比公開行動安全，顧知夏在場時一切可疑行為都會被放大。</p></div>
      <button class="btn sm ghost" id="sReset">清除所有資料（存檔、成就、圖鑑）</button>`, { small: true });
    $("#sSnd", m).onchange = e => { st.sound = e.target.checked; Save.saveSettings(st); };
    $$("[data-fs]", m).forEach(b => b.onclick = () => { st.fontScale = b.dataset.fs; Save.saveSettings(st); this.applyFontScale(); this.openSettings(); });
    $("#sReset", m).onclick = () => { if ($("#sReset", m).dataset.c) { try { Object.keys(localStorage).filter(k => k.startsWith("gts_")).forEach(k => localStorage.removeItem(k)); } catch (e) { } this.toast("已清除所有資料"); m.remove(); this.showTitle(); } else { $("#sReset", m).dataset.c = 1; $("#sReset", m).textContent = "再按一次確認清除"; } };
  },
  applyFontScale() {
    const k = Save.settings().fontScale, v = CONFIG.fontScales[k] || 1;
    document.documentElement.style.setProperty("--fs", v);
  },
  openMenu() {
    const m = this.modal("選單", `<div class="menu" style="max-width:none">
      <button class="btn" data-m="journal">日誌（任務／情報／紀錄）</button><button class="btn" data-m="npc">人際關係</button><button class="btn" data-m="cards">卡牌收藏／牌組</button><button class="btn" data-m="tal">天賦</button>
      <button class="btn" data-m="social">社群</button><button class="btn" data-m="shop">商店</button><button class="btn" data-m="save">存檔／讀檔</button>
      <button class="btn" data-m="ach">成就</button><button class="btn" data-m="set">設定</button><button class="btn ghost" data-m="title">回到主選單</button></div>`, { small: true });
    $$("[data-m]", m).forEach(b => b.onclick = () => { m.remove(); ({ journal: () => this.openJournal(), npc: () => this.openNPC(), cards: () => this.openCards(), tal: () => this.openTalents(), social: () => this.openSocial(), shop: () => this.openShop(), save: () => this.openSaves(), ach: () => this.openAchievements(), set: () => this.openSettings(), title: () => { Save.autoSave(); this.showTitle(); } })[b.dataset.m](); });
  },

  /* ---------- 結局 ---------- */
  showEnding(id) {
    const e = ENDINGS[id], s = State.get(); this.hideDialogue(); this.closeBattle(); this.closeModal();
    const epi = id === "exposed" ? [] : EPILOGUES.filter(x => { try { return x.cond(s); } catch (err) { return false; } }).map(x => x.t);
    const el = $("#ending"); el.classList.remove("hidden");
    el.innerHTML = `<div class="cg" style="${id === "exposed" ? "filter:grayscale(1) contrast(1.2) brightness(.7);" : ""}background:url('${e.cg}') center/cover, ${id === "exposed" ? "linear-gradient(135deg,#200,#000)" : "linear-gradient(135deg,#3a1f4d,#c9558b)"}"></div><div class="end-wrap">
      <div class="end-sub">ENDING・${e.sub}</div><div class="end-name">${e.name}</div><div class="end-text">${Utils.esc(Utils.fmt(e.t))}</div>
      ${epi.length ? `<div class="end-epi">${epi.map(Utils.esc).join("<br>")}</div>` : ""}
      <div class="end-stats"><div><b>${s.status.pureAura}</b>純潔氣場</div><div><b>${s.status.globalSuspicion}</b>鑑茶警報</div><div><b>${s.status.clubSupport}</b>社團支持</div><div><b>${s.statistics.cardsPlayed}</b>出牌數</div><div><b>${s.statistics.schemeUsed}</b>心機用量</div><div><b>${s.story.hiddenGoals.length}/5</b>隱藏目標</div><div><b>${Object.keys(s.intel).length}</b>情報</div><div><b>Day ${s.calendar.day}</b>到達日</div></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn primary" id="eNG">NG+ 重玩</button><button class="btn" id="eTitle">回到主選單</button></div></div>`;
    Sfx.play(id === "exposed" ? "bad" : "good");
    $("#eNG").onclick = () => { el.classList.add("hidden"); this.showCreate(true); };
    $("#eTitle").onclick = () => { el.classList.add("hidden"); this.showTitle(); };
  }
};

/* ============================================================
 * GameManager：遊戲主流程
 * ============================================================ */
const Game = {
  startNewGame(opt) {
    State.resetState();
    const s = State.get(), p = PERSONAS[opt.persona] || PERSONAS.good_newcomer;
    s.player.name = opt.name; s.player.nickname = opt.nickname; s.player.persona = opt.persona; s.player.direction = opt.direction;
    s.player.schemePoints = p.scheme; s.status.pureAura = p.pureAura; s.status.globalSuspicion = 0;
    Talents.unlockTalent(TALENT_DIRECTIONS[opt.direction].first, true);
    if (opt.ngPlus) {
      const m = Save.meta(); s.meta.ngPlus = (m.clears || 0);
      s.deck.collection = [...new Set([...s.deck.collection, ...(m.collection || [])])].filter(id => CARD_MAP[id]);
      s.deck.cardLevels = { ...(m.cardLevels || {}) }; s.player.talentPoints += 1;
    }
    const seed = Number.isFinite(opt.seed) ? opt.seed : Number.isFinite(window.__GTS_SEED) ? window.__GTS_SEED : (Date.now() ^ (Math.random() * 1e9)) & 0x7fffffff;
    s.meta.seed = seed; s.meta.rng = seed;
    s.log = []; GameLog.add(`${s.player.name}（${p.name}）踏入了星光公關社。`);
    UI.showGame(); UI.setBackground("campus"); Schedule.startDay();
  },
  continueGame() { if (Save.loadGame("auto")) this.afterLoad(); },
  afterLoad() {
    const s = State.get(); Battle.active = null; Story.cur = null; UI.hideDialogue(); UI.closeBattle();
    if (s.gameOver && s.ending) { UI.showEnding(s.ending); return; }
    UI.showGame(); UI.setBackground("clubroom"); UI.lock(false);
    // 若讀檔時有未完成的事件，重新檢查
    Schedule.runDayEvents();
    UI.toast(`讀取成功：第 ${s.calendar.week} 週 Day ${s.calendar.day}`);
  },
  pauseGame() { Save.autoSave(); }, resumeGame() { UI.refresh(); },
  advanceDay() { Schedule.endDay(); },
  endGame() { Ending.finalize(); },
  restartGame() { UI.showCreate(false); }
};

/* 全域錯誤保護：任何錯誤都不讓畫面永久卡住 */
window.addEventListener("error", e => { console.error(e.error || e.message); try { UI.lock(false); UI.toast("發生錯誤，已自動恢復操作：" + (e.message || ""), "bad"); } catch (x) { } });
window.addEventListener("unhandledrejection", e => { console.error(e.reason); try { UI.lock(false); } catch (x) { } });

document.addEventListener("DOMContentLoaded", () => {
  // 花瓣
  const pet = $("#title .petals"); for (let i = 0; i < 18; i++) { const sp = document.createElement("span"); sp.style.left = Math.random() * 100 + "%"; sp.style.animationDuration = 6 + Math.random() * 8 + "s"; sp.style.animationDelay = -Math.random() * 10 + "s"; pet.appendChild(sp); }
  $("#btnNew").onclick = () => UI.showCreate(false);
  $("#btnNGPlus").onclick = () => UI.showCreate(true);
  $("#btnContinue").onclick = () => Game.continueGame();
  $("#btnLoad").onclick = () => UI.openSaves("load");
  $("#btnGallery").onclick = () => UI.openRelations();
  $("#btnStory").onclick = () => UI.openStoryReview();
  $("#btnStats").onclick = () => UI.openStats();
  $("#btnExtra").onclick = () => UI.openExtras();
  $("#btnHelp").onclick = () => UI.openHelp();
  $("#btnSound").onclick = () => { const st = Save.settings(); st.sound = !st.sound; Save.saveSettings(st); $("#btnSound").classList.toggle("off", !st.sound); };
  $("#btnCards").onclick = () => UI.openCards();
  $("#btnAch").onclick = () => { const m = Save.meta(); m.achSeen = m.achievements.length; Save.saveMeta(m); $("#achDot").classList.add("hidden"); UI.openAchievements(); };
  $("#btnSet").onclick = () => UI.openSettings();
  $("#vn").addEventListener("click", () => UI.vnClick());
  document.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !$("#vn").classList.contains("hidden") && !$(".modal")) { e.preventDefault(); UI.vnClick(); } });
  $$("[data-nav]").forEach(b => b.onclick = () => { if (UI.isLocked() && b.dataset.nav !== "menu") return; ({ npc: () => UI.openNPC(), cards: () => UI.openCards(), tal: () => UI.openTalents(), social: () => UI.openSocial(), shop: () => UI.openShop(), save: () => UI.openSaves(), journal: () => UI.openJournal(), menu: () => UI.openMenu() })[b.dataset.nav](); });
  $("#vnSkipLog").onclick = e => { e.stopPropagation(); UI.openNPC(); };
  window.addEventListener("beforeunload", () => { try { if (State.get() && !Battle.active && !Story.cur) Save.autoSave(); } catch (e) { } });

  UI.applyFontScale();
  UI.showTitle();
});

</script>
