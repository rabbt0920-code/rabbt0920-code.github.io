/* ---------- 卡牌效果計算（GDD 5.1 / 5.2） ---------- */
const CardMath = {
  auraMult() { const a = State.get().status.pureAura; return a >= 80 ? CONFIG.auraHigh : a >= 40 ? CONFIG.auraMid : CONFIG.auraLow; },
  repeatMult(tags) {
    const recent = State.get().statistics.recentTags.slice(-5);
    let worst = 0; tags.forEach(t => { const n = recent.filter(x => x === t).length + 1; worst = Math.max(worst, n); });
    return CONFIG.repeatMult[Math.min(worst, CONFIG.repeatMult.length - 1)];
  },
  witnessMult(ctx, observers) {
    if (ctx !== "private" && observers.includes("gu")) return CONFIG.witness.expert;
    return CONFIG.witness[ctx] || 1;
  },
  intentMult(card, intent) {
    if (!intent) return { m: 1, good: false, bad: false };
    const it = INTENTS[intent]; const good = card.tags.some(t => it.good.includes(t)), bad = card.tags.some(t => it.bad.includes(t));
    if (good && !bad) return { m: 1.3, good: true, bad: false };
    if (bad && !good) return { m: 0.7, good: false, bad: true };
    return { m: 1, good: false, bad: false };
  },
  // 預覽或結算單張卡牌效果
  compute(cardId, targetId, opt = {}) {
    const s = State.get(), card = Cards.getCard(cardId); if (!card) return null;
    const npc = NPCS[targetId], rel = s.npcRelations[targetId]; if (!npc || !rel) return null;
    const lv = Cards.level(cardId), lm = CONFIG.levelMult[lv];
    const mem = Memory.evaluateMemoryImpact(targetId, { tags: card.tags });
    let aff = Math.max(...card.tags.map(t => npc.cardAffinity[t] ?? 1.0));
    const resist = rel.emotion < -20 || rel.suspicion >= 60 || mem.resist;
    if (resist) aff = Math.min(aff, CONFIG.affinityResist);
    const aura = card.type === "WHITE_LOTUS" ? this.auraMult() : 1;
    const im = this.intentMult(card, opt.intent);
    // 予辰 ♥ 若晴：感情好時，在若晴面前對予辰示好會打折；冷戰／分手後反而更容易趁虛而入
    let coupleMult = 1;
    if (targetId === "lin" && card.tags.includes("FLIRT")) { const cs = Relations.coupleState().k; if ((cs === "stable" || cs === "friction") && (opt.observers || []).includes("shen")) coupleMult = 0.8; else if (cs === "cold" || cs === "broken") coupleMult = 1.2; }
    const tal = 1 + Talents.tagBonus(card.tags, targetId);
    const favor = Math.max(0, Utils.round(card.fx.favor * aff * aura * im.m * lm * tal * mem.favorMult * coupleMult));
    const pureAura = Utils.round(card.fx.pureAura > 0 ? card.fx.pureAura * lm : card.fx.pureAura);
    const ctx = opt.context || "small", observers = opt.observers || [];
    let susInc = 0, susRed = 0, globalInc = 0;
    const base = card.fx.targetSuspicion;
    if (base > 0) {
      const sens = 0.5 + npc.attributes.sensitivity / 100;
      let v = base * sens * this.witnessMult(ctx, observers) * this.repeatMult(card.tags) * mem.susMult * (im.bad ? 1.2 : 1);
      if (opt.firstSus && Talents.has("t_lotus4")) v *= 0.8;
      let def = 0; if (opt.firstScheme && Talents.has("t_scheme3") && card.cost > 0) def += 5;
      susInc = Math.max(0, Utils.round(v - def));
      globalInc = Math.min(8, Utils.round(susInc * ({ private: 0.06, small: 0.12, public: 0.2 }[ctx] || 0.12)));
    } else if (base < 0) {
      susRed = Utils.round(base * lm);
      if (card.eye && Talents.has("t_lotus2")) susRed -= 5;
      if (lv >= 3 && card.type === "WHITE_LOTUS") susRed -= 5;
    }
    const mood = Utils.round(favor * 0.7 - susInc * 0.6 + Math.abs(susRed) * 0.8 + (im.good ? 8 : im.bad ? -5 : 0));
    return { card, favor, pureAura, susInc, susRed, globalInc, mood, aff, resist, intent: im, level: lv, cost: Cards.costOf(cardId), coupleMult };
  }
};

/* ---------- NPCManager ---------- */
const NPCManager = {
  getNPC(id) { const n = NPCS[id]; if (!n) console.warn("NPC 資料缺失", id); return n; },
  updateNPCEmotion(id, n) { return Status.addEmotion(id, n); },
  getNPCReaction(id, ctx = {}) {
    const r = Status.rel(id), lines = NPC_LINES[id]; if (!lines) return "……";
    // 記憶優先：具體引用某次事件，其次是記憶類型的台詞
    if (Utils.chance(0.4)) { const ln = Memory.lineFor(id); if (ln) return ln; }
    const mems = Memory.getMemories(id).slice().reverse();
    for (const m of mems) { if (lines.mem[m.type] && Utils.chance(0.45)) return lines.mem[m.type]; }
    const band = r.emotion <= -21 || r.suspicion >= 70 ? "upset" : r.emotion >= 21 || r.favor >= 60 ? "happy" : "calm";
    return Utils.pick(lines[band]);
  },
  evaluateNPCBehavior(id) {
    const list = (NPC_DAILY[id] || []).filter(a => Effects.check(a.cond));
    return list.length ? Utils.weighted(list) : null;
  },
  executeNPCAction(id) {
    const a = this.evaluateNPCBehavior(id); if (!a) return null;
    Effects.apply(a.fx);
    // 情報在 NPC 之間流動：分享懷疑
    if (a.share) {
      const [x, y] = a.share; const sx = Status.rel(x).suspicion; if (sx >= 40) Status.addSuspicion(y, Math.round((sx - 30) * 0.1));
      // 交換情報：把自己知道、對方還不知道的最嚴重一件事告訴對方
      const known = new Set(Memory.getMemories(y).map(m => m.origin));
      const m = Memory.getMemories(x).filter(m => m.evidence && !known.has(m.origin) && m.how !== "told").sort((p, q) => q.severity - p.severity)[0];
      if (m && Utils.chance(0.5)) { Memory.spread(x, y, m); return a.t + `（${NPCS[x].name}跟${NPCS[y].name}提到了「${m.label || "某件事"}」）`; }
    }
    if (a.gossip) {
      // 許沐橙散播：若玩家曾挑撥他人，相關記憶會被傳開
      // 許沐橙把她知道的事傳出去（被妳收服時不會）
      const s = State.get();
      if (!s.story.flags.trusted_xu_mucheng && !s.story.flags.xu_blackmailed) {
        const pool = Memory.getMemories("xu").filter(m => m.evidence);
        if (pool.length && Utils.chance(0.4)) {
          const m = Utils.pick(pool), to = Utils.pick(["shen", "gu", "lin"]);
          if (Memory.spread("xu", to, m)) { Status.addSuspicion(to, 3); Status.addGlobalSuspicion(1); s.calendar.publicIncident = true; return a.t + `（她把「${m.label || "妳的事"}」講給了${NPCS[to].name}聽）`; }
        }
      }
    }
    return a.t;
  },
  dailyUpdate() {
    const s = State.get(), news = [];
    NPC_IDS.forEach(id => {
      const r = s.npcRelations[id];
      // 情緒回歸。懷疑度：0～49 每天 -1；50～79 不自然下降，但信任 60 以上可每天修復 -1；80 以上（調查中）不下降
      r.emotion = Utils.round(r.emotion * 0.8);
      const investigating = id === "gu" && s.story.flags.gu_zhixia_investigating;
      if (!investigating && r.suspicion < 50) r.suspicion = Math.max(0, r.suspicion - 1);
      else if (!investigating && r.suspicion < CONFIG.investigateAt && r.trust >= 60) r.suspicion -= 1;
      // 久未互動的好感會慢慢淡化
      // 好感衰退：3 天內有互動不變；4～6 天 -1；7 天以上 -2（好感 40 以下不再下降）
      const gap = s.calendar.day - (r.lastChatDay || 0);
      if (r.favor > 40 && !r.exposed) { if (gap >= 7) r.favor -= 2; else if (gap >= 4) r.favor -= 1; }
      const t = this.executeNPCAction(id); if (t) news.push({ id, t });
    });
    return news;
  }
};

/* ---------- SocialManager ---------- */
const Social = {
  canSee(npcId, post) {
    const s = State.get();
    switch (post.visibility) {
      case "all": return true;
      case "friends": return s.npcRelations[npcId].favor >= 30;
      case "only": return post.targets.includes(npcId);
      case "exclude": return !post.targets.includes(npcId);
    }
    return false;
  },
  getVisiblePosts(npcId) { return State.get().social.posts.filter(p => this.canSee(npcId, p)); },
  createPost(data) {
    const s = State.get(), type = POST_TYPES[data.type]; if (!type) return null;
    const post = { id: s.social.nextId++, day: s.calendar.day, type: data.type, text: data.text || Utils.pick(type.samples), visibility: data.visibility || "all", targets: data.targets || [], likes: [], comments: [], leaked: false, viewers: [] };
    let mult = 1; if (s.player.persona === "lively_sweet") mult += 0.15; if (Talents.has("t_social3")) mult += 0.15;
    const viewers = NPC_IDS.filter(id => this.canSee(id, post)); post.viewers = viewers;
    const prevCtx = Memory.setContext("post", `妳的動態「${post.text.length > 14 ? post.text.slice(0, 13) + "…" : post.text}」`, []);
    const notes = [];
    viewers.forEach(id => {
      const npc = NPCS[id], likes = type.likes.includes(id);
      const f = Utils.round(type.base.favor * mult * (likes ? 1.5 : 1));
      if (f) Status.addFavor(id, f);
      let sus = type.base.sus * type.sens * (0.5 + npc.attributes.sensitivity / 100);
      if (data.type === "flirt" && id === "shen" && s.npcRelations.lin.favor >= 40) { sus += 8; Status.addRelation("shen", "lin", -3); Romance.log("post", true); }
      if (data.type === "flirt" && post.visibility === "only" && post.targets.length === 1 && post.targets[0] === id) { Status.addFavor(id, 4); sus *= 0.5; }
      if (data.type === "snark" && post.targets.includes(id) && post.visibility === "exclude") sus *= 0; // 被排除者不直接看到
      sus = Utils.round(sus); if (sus > 0) { Status.addSuspicion(id, sus); if (npc.attributes.sensitivity >= 60) Memory.addMemory(id, { type: "sus_post" }); }
      if (data.type === "growth") Status.addTrust(id, id === "gu" ? 4 : 1);
      if (s.npcRelations[id].favor >= 35 && s.npcRelations[id].emotion > -20 && s.npcRelations[id].suspicion < 60) post.likes.push(id);
    });
    Memory.restoreContext(prevCtx);
    if (type.base.aura) Status.addPureAura(Utils.round(type.base.aura * mult));
    if (type.base.rep) Status.addReputation(type.base.rep);
    if (type.base.scheme) Status.addSchemePoints(type.base.scheme);
    if (post.visibility === "all" && type.base.sus >= 5) Status.addGlobalSuspicion(Utils.round(type.base.sus * 0.25));
    Status.addInfluence(Utils.round((2 + viewers.length) * mult));
    // 留言
    const commenters = Utils.shuffle(post.likes).slice(0, 2);
    commenters.forEach(id => post.comments.push({ id, t: this.commentLine(id, data.type) }));
    s.social.posts.unshift(post);
    // 情報外流檢查
    const leak = this.checkPostLeak(post.id); if (leak) notes.push(leak);
    if (type.base.sus >= 6) Achievements.progress && 0;
    GameLog.add(`發布動態「${post.text}」（${VISIBILITY[post.visibility]}）`, "social");
    return { post, notes };
  },
  setPostVisibility(postId, vis) { const p = State.get().social.posts.find(x => x.id === postId); if (p) p.visibility = vis; },
  likePost(npcId, postId) { const p = State.get().social.posts.find(x => x.id === postId); if (p && !p.likes.includes(npcId)) p.likes.push(npcId); },
  commentPost(npcId, postId, t) { const p = State.get().social.posts.find(x => x.id === postId); if (p) p.comments.push({ id: npcId, t }); },
  commentLine(id, type) {
    const L = {
      lin: { selfie: "很適合妳！", latenight: "怎麼了？要不要聊聊？", flirt: "（按了讚）", complain: "妳還好嗎？", growth: "辛苦了，很棒！", snark: "……？" },
      shen: { selfie: "裙子不錯。", latenight: "早點睡。", flirt: "寫給誰的啊？", complain: "有事就說出來。", growth: "下次活動也拜託了。", snark: "在說誰？" },
      gu: { selfie: "", latenight: "", flirt: "", complain: "", growth: "持續努力。", snark: "" },
      chen: { selfie: "好可愛！", latenight: "我也還沒睡……", flirt: "（盯著螢幕發呆）", complain: "有需要幫忙跟我說！", growth: "加油加油！", snark: "嗯？" },
      xu: { selfie: "寶貝好美！！", latenight: "抱抱🫂", flirt: "欸欸欸是誰！？我要知道！", complain: "誰欺負妳了！", growth: "幫妳分享到社團 IG～", snark: "懂的都懂😏" }
    };
    return (L[id] && L[id][type]) || "（按讚）";
  },
  checkPostLeak(postId) {
    const s = State.get(), post = s.social.posts.find(p => p.id === postId); if (!post) return "";
    const type = POST_TYPES[post.type]; if (type.base.sus < 3 && post.type !== "snark") return "";
    const hidden = NPC_IDS.filter(id => !post.viewers.includes(id)); if (!hidden.length) return "";
    for (const h of hidden) {
      for (const v of post.viewers) {
        const p = Relations.getRelationship(v, h) / 100 * (v === "xu" ? 0.6 : 0.22);
        if (Utils.chance(p)) {
          post.leaked = true;
          const inc = Utils.round(type.base.sus * 1.5 + 6);
          Status.addSuspicion(h, inc); Status.addGlobalSuspicion(3); Memory.addMemory(h, { type: "sus_post", major: true, source: "post", label: `妳的動態「${post.text.slice(0, 13)}」`, detail: `${NPCS[v].name}把截圖傳了出去`, involved: [v] });
          const msg = `截圖外流！${NPCS[v].name} 把妳的動態截圖給了 ${NPCS[h].name}（${NPCS[h].name} 懷疑 +${inc}）`;
          GameLog.add(msg, "bad"); return msg;
        }
      }
    }
    return "";
  },
  sendMessage(npcId, optId) {
    const s = State.get(), r = s.npcRelations[npcId], opt = DM_OPTIONS.find(o => o.id === optId);
    if (!opt) return null;
    if (r.dmDay === s.calendar.day) { UI.toast("今天已經私訊過他／她了", "bad"); return null; }
    if (this.dmLeft() <= 0) { UI.toast("今天的私訊次數用完了", "bad"); return null; }
    if (s.player.energy < CONFIG.dmEnergy) { UI.toast(`精力不足（私訊需要 ${CONFIG.dmEnergy}）`, "bad"); return null; }
    Status.addEnergy(-CONFIG.dmEnergy);
    r.dmDay = s.calendar.day; s.calendar.dmCount = (s.calendar.dmCount || 0) + 1;
    const aff = Math.max(...opt.tags.map(t => NPCS[npcId].cardAffinity[t] ?? 1));
    Status.addFavor(npcId, Utils.round(opt.fx.favor * aff)); Status.addTrust(npcId, opt.fx.trust || 0);
    if (opt.fx.sus) Status.addSuspicion(npcId, Utils.round(opt.fx.sus * (0.5 + NPCS[npcId].attributes.sensitivity / 100)));
    if (opt.night && npcId === "lin") { Romance.log("night_dm", false); Status.addSuspicion("shen", Utils.chance(0.3) ? 4 : 0); }
    const reply = NPCManager.getNPCReaction(npcId);
    s.social.messages.push({ npc: npcId, day: s.calendar.day, out: opt.text, reply });
    return reply;
  },
  dmLimit() { return CONFIG.dmPerDay + (Talents.has("t_social2") ? 1 : 0); },
  dmLeft() { return this.dmLimit() - (State.get().calendar.dmCount || 0); },
  followers() { return 20 + State.get().status.socialInfluence * 3 + State.get().social.posts.length * 2; }
};

/* ---------- StoryManager ---------- */
const Story = {
  cur: null,
  setFlag(f, v = true) { State.get().story.flags[f] = v; },
  loadStory(id) { return STORIES[id] || null; },
  getStoryNode(nodeId) { return this.cur && this.cur.story.nodes[nodeId]; },
  play(storyId, onDone) {
    const st = this.loadStory(storyId);
    if (!st) { console.warn("劇情不存在", storyId); onDone && onDone(); return; }
    this.cur = { id: storyId, story: st, nodeId: st.start, onDone };
    State.get().story.currentNode = storyId + ":" + st.start;
    Memory.setContext(storyId, STORY_LABELS[storyId] || null, []);
    this.enterNode(st.start);
  },
  playDynamic(story, onDone, src = "dyn", label = null, involved = []) { this.cur = { id: src, story, nodeId: story.start, onDone }; Memory.setContext(src, label, involved); this.enterNode(story.start); },
  enterNode(nodeId) {
    if (!this.cur) return;
    let node = this.cur.story.nodes[nodeId];
    if (!node) { console.warn("節點不存在", nodeId); return this.finish(); }
    if (node.cond && !Effects.check(node.cond)) {
      const nx = node.else || node.n || (node.ch && node.ch[node.ch.length - 1].n);
      return nx ? this.enterNode(nx) : this.finish();
    }
    this.cur.nodeId = nodeId; State.get().story.currentNode = this.cur.id + ":" + nodeId;
    if (node.bg) UI.setBackground(node.bg);
    const notes = node.fx ? Effects.apply(node.fx) : [];
    if (node.special && SpecialNodes[node.special]) { const res = SpecialNodes[node.special](node); if (res && res.redirect) return this.enterNode(res.redirect); if (res && res.notes) notes.push(...res.notes); if (res && res.stop) return; }
    UI.showNode(node, notes);
  },
  advanceStory() {
    const node = this.getStoryNode(this.cur?.nodeId); if (!node) return;
    if (node.battle) { const def = node.battle; return Battle.startBattle(def, key => { const nx = def.result[key] || def.result.win; this.enterNode(nx); }); }
    if (node.end) return this.finish();
    if (node.n) return this.enterNode(node.n);
    this.finish();
  },
  resolveStoryChoice(idx) {
    const node = this.getStoryNode(this.cur?.nodeId); if (!node || !node.ch) return;
    const c = node.ch[idx]; if (!c || !Effects.check(c.cond)) return;
    State.get().story.choices.push({ day: State.get().calendar.day, story: this.cur.id, node: this.cur.nodeId, choice: idx });
    if (c.inner) { UI.flashDark(); Sfx.play("evil"); }
    Memory.lastChoice = c.t;
    const notes = Effects.apply(c.fx || []);
    Memory.lastChoice = null;
    if (notes.length) UI.toast(notes.join("　"), c.inner ? "dark" : "");
    if (c.special && SpecialNodes[c.special]) SpecialNodes[c.special](c);
    if (c.end) return this.finish();
    if (c.n) this.enterNode(c.n); else this.finish();
  },
  checkStoryConditions(cond) { return Effects.check(cond); },
  finish() {
    const cb = this.cur && this.cur.onDone; this.cur = null; State.get().story.currentNode = null; Memory.ctx = null;
    UI.hideDialogue(); cb && cb();
  }
};

/* 特殊節點（需要程式運算的劇情點） */
const SpecialNodes = {
  vote_tally() {
    const s = State.get(), f = s.story.flags; let mine = Math.round(s.status.clubSupport / 10), theirs = 5;
    const voters = [];
    ["lin", "gu", "chen", "xu"].forEach(id => {
      const r = s.npcRelations[id]; let forMe = r.favor >= 50 && r.trust >= 40 && r.suspicion < 60;
      if (id === "gu") forMe = (r.trust >= 45 && r.suspicion < 50) || !!f.debate_perfect;
      // 感情穩定時，予辰會站在女友那邊，除非他非常喜歡妳
      if (id === "lin" && Relations.couple() >= 60 && r.favor < 70) forMe = false;
      if (id === "chen" && f.promise_chen) forMe = true;
      if (id === "xu" && (f.trusted_xu_mucheng || f.xu_blackmailed)) forMe = true;
      if (forMe) { mine += 2; voters.push(NPCS[id].name); } else theirs += 2;
    });
    if (f.debate_perfect) mine += 3; else if (f.debate_win) mine += 1;
    if (f.vote_bonus) mine += 4;
    const won = mine > theirs;
    const notes = [`得票：小茶 ${mine} 票 ／ 沈若晴 ${theirs} 票`, voters.length ? `投給妳的幹部：${voters.join("、")}` : "沒有幹部投給妳"];
    if (won) { Story.setFlag("won_club_support_vote"); Effects.apply([["support", 12], ["rep", 6], ["emo", "shen", -30], ["sus", "shen", 8]]); notes.push("妳的企劃勝出了！"); }
    else { Effects.apply([["support", 3], ["favor", "shen", 4]]); notes.push("若晴的企劃勝出。妳還有機會在評選中翻盤。"); }
    if (f.promise_broken) { Effects.apply([["trust", "shen", -20], ["mem", "shen", "lied", true]]); notes.push("若晴不會忘記妳答應過她的事。"); }
    return { notes };
  },
  leak_branch() {

  },
  leak_after() {

    if (unk.length && Utils.chance(0.55)) { const id = Utils.pick(unk); Intel.gain(id); UI.toast("獲得情報：" + INTEL[id].name, "dark"); }
    else UI.toast("聽了半天，都是些無關緊要的事。");
  },

    if (s.status.clubReputation >= 15) { Effects.apply([["trust", "gu", 5]]); return { notes: ["妳流暢地報告了負責的工作。知夏信任 +5"] }; }
    Effects.apply([["sus", "gu", 5]]); return { notes: ["妳支支吾吾說不出幾件事。知夏懷疑 +5"] };
  },
  ending() { Ending.queueAfterJudgment = true; return null; },
  breakup_branch() {
    const s = State.get(), f = s.story.flags;
    const blame = s.npcRelations.shen.suspicion >= 45 || f.fanned_leak || f.group_chat_backstab || f.lin_walked_home;
    return { redirect: blame ? "cb2a" : "cb2b" };
  },

/* ---------- EventManager ---------- */
const Events = {
  completed(id) { return State.get().story.completedEvents.includes(id); },
  markDone(id) { const s = State.get(); if (!s.story.completedEvents.includes(id)) s.story.completedEvents.push(id); },
  checkEventConditions() {
    const s = State.get(), due = [];
    EVENTS.forEach(ev => { if (!this.completed(ev.id) && s.calendar.day >= ev.minDay && Effects.check(ev.trigger)) due.push({ kind: "event", ev }); });
    // 主線優先，其次條件、NPC 事件；每天最多一個非主線事件
    const main = due.filter(d => d.ev.type === "MAIN"), other = due.filter(d => d.ev.type !== "MAIN").slice(0, 1);
    const list = [...main, ...other];
    // 個別拆穿事件
    NPC_IDS.forEach(id => { const r = s.npcRelations[id]; if (r.suspicion >= CONFIG.exposeAt && !r.exposed) list.push({ kind: "expose", id }); });
    // 自動修羅場：兩名 NPC 懷疑 ≥ 60
    const hot = NPC_IDS.filter(id => s.npcRelations[id].suspicion >= CONFIG.shurabaAt && !s.npcRelations[id].exposed);
    const wk = "w" + s.calendar.week;
    if (hot.length >= 2 && !s.story.shurabaLog[wk] && !main.length) list.push({ kind: "shuraba", ids: hot.slice(0, 2) });
    return list;
  },
  getAvailableEvents() { return this.checkEventConditions(); },
  runQueue(list, done) {
    if (!list.length) return done && done();
    const item = list.shift(), next = () => { UI.refresh(); this.runQueue(list, done); };
    if (State.get().gameOver) return;
    if (item.kind === "event") { this.markDone(item.ev.id); GameLog.add("事件：" + (item.ev.id), "event"); Story.play(item.ev.story, next); }
    else if (item.kind === "expose") this.triggerExpose(item.id, next);
    else if (item.kind === "shuraba") this.triggerShuraba(item.ids, next);
  },
  triggerEvent(eventId, done) { const ev = EVENTS.find(e => e.id === eventId); if (!ev) return done && done(); this.markDone(ev.id); Story.play(ev.story, done); },
  resolveEventChoice(idx) { Story.resolveStoryChoice(idx); },
  updateEventFlags(flag, value) { Story.setFlag(flag, value); },
  // 隨機事件：每天最多判定一次、同事件冷卻、依目前局勢調整權重
  randomWeight(r) {
    const s = State.get(), R = s.npcRelations; let w = r.w ?? 1;
    if (r.id === "r_audit" && R.gu.suspicion >= 40) w += 2;
    if ((r.id === "r_rain" || r.id === "r_photo") && R.lin.favor >= 55) w += 1;
    if (r.id === "r_gossip" && R.xu.trust >= 40) w += 1;
    if (r.id === "r_anon" && s.status.globalSuspicion >= 30) w += 1;
    if (r.id === "r_notes" && R.shen.trust >= 40) w += 0.5;
    return w;
  },
  maybeRandom(done) {
    const s = State.get();
    if (s.calendar.randomRolled) return done();
    s.calendar.randomRolled = true;
    if (!Utils.chance(CONFIG.randomEventChance)) return done();
    const log = s.story.randomLog;
    const majorUsed = s.story.randomMajorWeek === s.calendar.week;
    const pool = RANDOM_EVENTS.filter(r => Effects.check(r.cond) && !(r.once && this.completed(r.id)) && !(r.major && majorUsed) && !(log[r.id] && s.calendar.day - log[r.id] < CONFIG.randomCooldown))
      .map(r => ({ ...r, w: this.randomWeight(r) }));
    if (!pool.length) return done();
    const r = Utils.weighted(pool); if (r.once) this.markDone(r.id); if (r.major) s.story.randomMajorWeek = s.calendar.week;
    log[r.id] = s.calendar.day;
    Story.play(r.story, done);
  },
  triggerExpose(id, done) {
    const s = State.get(), r = s.npcRelations[id], n = NPCS[id]; r.exposed = true;
    Story.setFlag("exposed_by_" + id); Achievements.unlock("a_exposed_one");

      e2: { sp: id, ex: "angry", t: `「我都知道了。妳一直在演，對吧？」`, n: "e3" },
      e3: { sp: "narr", t: "被拆穿了。要怎麼面對？", ch: [
        { t: "坦白道歉：「對不起……我只是太想被大家喜歡」", fx: [["aura", -10], ["sus", id, -35], ["favor", id, -10], ["trust", id, 5], ["global", 6], ["support", -5]], n: "e4" },
        { t: "死不承認：「你在說什麼？我聽不懂」", fx: [["global", 12], ["favor", id, -25], ["trust", id, -30], ["support", -8], ["mem", id, "lied", true]], n: "e4" },
        { t: "反過來堵住對方：「那你的秘密，要不要也讓大家知道？」", cond: { intel: Intel.aboutNPC(id)[0] || "__none" }, fx: [["sus", id, -45], ["favor", id, -30], ["scheme", 2], ["global", 3], ["emo", id, -50]], n: "e4", inner: true, hint: "使用情報威脅" }
      ] },

/* ---------- ActionManager ---------- */
const Actions = {
  getAvailableActions() { return Object.keys(ACTIONS); },
  calculateActionCost(id) { return ACTIONS[id] ? ACTIONS[id].energy : 0; },
  canExecuteAction(id, target) {
    const s = State.get(), a = ACTIONS[id]; if (!a) return "未知行動";
    if (s.calendar.remainingActions <= 0 && !(id === "chat" && this.freeChatAvailable())) return "今天的行動次數已用完";
    if (s.player.energy < a.energy) return `精力不足（需要 ${a.energy}）`;
    if (a.needTarget && !target) return "請選擇對象";
    if (id === "date" && target && Status.rel(target).favor < 40) return `${NPCS[target].name} 好感不足 40，還約不出來`;
    if (target && Status.rel(target).exposed && (id === "date")) return "對方已經看穿妳了";
    if (id === "mediate") {
      if (s.story.flags.lin_shen_broke_up) return "兩人已經分手了";
      if (Relations.couple() >= 80) return "兩人現在感情很好，不需要撮合";
      if (s.story.mediateDay && s.calendar.day - s.story.mediateDay < CONFIG.mediateCooldown) return `剛撮合過，${CONFIG.mediateCooldown - (s.calendar.day - s.story.mediateDay)} 天後再試`;
    }
    return "";
  },
  freeChatAvailable() { const s = State.get(); return Talents.has("t_social2") && s.weekly.freeChat < 1; },
  executeAction(id, target, done) {
    const err = this.canExecuteAction(id, target); if (err) { UI.toast(err, "bad"); return false; }
    const s = State.get(), a = ACTIONS[id];
    // 先檢查再扣資源
    const useFree = id === "chat" && this.freeChatAvailable() && s.calendar.remainingActions <= 0;
    Status.addEnergy(-a.energy);
    // 取消（例如發文視窗按取消）：不扣行動、不進入行動後的事件流程
    const fin = (consume = true) => { if (!consume) { UI.lock(false); UI.refresh(); return; } if (useFree) s.weekly.freeChat++; else s.calendar.remainingActions = Math.max(0, s.calendar.remainingActions - 1); done && done(); };
    this.applyActionEffects(id, target, fin);
    return true;
  },
  applyActionEffects(id, target, fin) {
    const s = State.get();
    switch (id) {
      case "club": {
        let sup = 3; if (Talents.has("t_social4") && !s.weekly.clubBonusUsed) { sup += 5; s.weekly.clubBonusUsed = true; }
        const two = Utils.shuffle(NPC_IDS).slice(0, 2);
        const notes = Effects.apply([["rep", 4], ["support", sup], ["gold", 30], ["favor", two[0], 2], ["favor", two[1], 2]]);
        UI.result("社團活動", Utils.pick(["幫忙佈置攤位，被學長姊稱讚手很巧。", "參加幹部會議，認真做筆記。", "跟大家一起排練迎新晚會的開場。", "協助宣傳組發傳單，發完了一整疊！"]), notes, fin);
        GameLog.add("參加社團活動"); break;
      }
      case "chat": Battle.startBattle({ memLabel: `和${NPCS[target].name}聊天的時候`, title: `與${NPCS[target].name}聊天`, participants: [target], context: "small", rounds: 1, type: "chat", goal: 0 }, () => { Status.addTrust(target, 2); s.npcRelations[target].lastChatDay = s.calendar.day; fin(); }); break;
      case "date": Battle.startBattle({ memLabel: `和${NPCS[target].name}私下約會那次`, title: `與${NPCS[target].name}私下約會`, participants: [target], context: "private", rounds: 2, type: "date", goal: 55 }, key => {
          const notes = [];
          if (key !== "fail") { notes.push(...Effects.apply([["favor", target, 6], ["trust", target, 5], ["emo", target, 15]])); }
          if (target === "lin") { Romance.log("date", false); Status.addRelation("lin", "shen", -3); Status.addRelation("shen", "lin", -2); if (Utils.chance(0.5)) notes.push(...Effects.apply([["sus", "shen", 5], ["global", 1]])); }
          if (notes.length) UI.toast(notes.join("　")); fin();
        }); break;
      case "intel": {
        let p = 0.45; if (s.player.persona === "mysterious") p *= 1.15; if (s.story.flags.trusted_xu_mucheng) p += 0.1;
        let risk = 0.2; if (s.player.persona === "mysterious") risk *= 0.85;
        const notes = Effects.apply([["scheme", 1]]); let text;
        const unk = Intel.unknown();
        if (unk.length && Utils.chance(p)) { const k = Utils.pick(unk); Intel.gain(k); text = `妳從零碎的對話和照片裡拼湊出了一條情報：「${INTEL[k].name}」——${INTEL[k].desc}`; notes.push("獲得情報"); }
        else { text = unk.length ? "翻了半天群組紀錄，只找到一些蛛絲馬跡。" : "妳已經掌握了社團裡幾乎所有的秘密。"; notes.push(...Effects.apply([["frag", 1]])); }
        if (Utils.chance(risk)) { const w = Utils.pick(["xu", "gu"]); notes.push(...Effects.apply([["sus", w, 5], ["global", 2]])); text += `\n……糟糕，${NPCS[w].name}好像注意到妳在打聽了。`; }
        UI.result("蒐集情報", text, notes, fin, true); GameLog.add("蒐集情報"); break;
      }
      case "social": UI.openComposer(ok => fin(ok)); break;
      case "practice": { const notes = Effects.apply([["frag", 2], ["scheme", 1]]); UI.result("練習話術", "對著鏡子練習眨眼、嘆氣和欲言又止。演技又精進了一點。", notes, fin, true); GameLog.add("練習話術"); break; }
      case "mediate": {
        s.story.mediateDay = s.calendar.day; Story.setFlag("mediated_couple");
        let notes, text;
        if (Status.rel("shen").suspicion >= 60) { notes = Effects.apply([["rel", "lin", "shen", 3], ["sus", "shen", 3]]); text = "妳約兩人一起吃飯，若晴全程盯著妳：「妳為什麼這麼關心我們？」氣氛只好了一點點。"; }
        else { notes = Effects.apply([["rel", "lin", "shen", 8], ["rel", "shen", "lin", 6], ["aura", 3], ["trust", "lin", 3], ["trust", "shen", 4]]); text = "妳「剛好」多了兩張電影票，又「剛好」臨時有事不能去。散場時，兩人是牽著手走出來的。"; }
        UI.result("撮合予辰與若晴", text, notes, fin); GameLog.add("撮合予辰與若晴"); break;
      }
      case "rest": { const notes = Effects.apply([["energy", CONFIG.restEnergyBonus]]); UI.result("休息", "窩在宿舍追劇、敷面膜。偶爾也要放過自己。", notes, fin); break; }
    }
  }

/* ---------- ScheduleManager ---------- */
const Schedule = {
  getCurrentDay() { return State.get().calendar.day; },
  getCurrentWeek() { return State.get().calendar.week; },
  getRemainingActions() { return State.get().calendar.remainingActions; },
  getWeeklySchedule() { return [["第一週", "迎新聚餐", 3], ["第二週", "深夜社團群組", 10], ["第三週", "火鍋店宵夜場", 17], ["第四週", "迎新企劃投票", 24], ["第五週", "匿名爆料", 31], ["第六週", "迎新晚會・最終評選", 41]]; },
  syncCalendar() { const c = State.get().calendar; c.week = Math.min(6, Math.floor((c.day - 1) / 7) + 1); c.weekday = ((c.day - 1) % 7) + 1; },
  startDay() {
    const s = State.get(); this.syncCalendar(); s.calendar.remainingActions = CONFIG.actionsPerDay; s.calendar.weather = Utils.pick(WEATHERS);
    s.calendar.dmCount = 0; s.calendar.randomRolled = false; s.calendar.suspicious = false; s.calendar.publicIncident = false; s.calendar.npcEvidence = false;
    if (s.weekly.week !== s.calendar.week) {
      s.weekly = { week: s.calendar.week, freeChat: 0, clubBonusUsed: false };
      s.player.talentPoints += 1; UI.toast(`第 ${s.calendar.week} 週開始：${WEEK_THEMES[s.calendar.week]}（天賦點 +1）`, "gold");
      Save.checkpoint();
    }
    const cs = Relations.coupleState();
    if (s.story.coupleLast && s.story.coupleLast !== cs.k) { const msg = `予辰與若晴的感情：${COUPLE_STATES.find(c => c.k === s.story.coupleLast).n} → ${cs.n}`; GameLog.add(msg, "event"); UI.toast(msg, cs.min < 60 ? "dark" : ""); }
    s.story.coupleLast = cs.k;
    UI.refresh(); UI.setBackground(s.calendar.day % 7 === 0 ? "courtyard" : "clubroom");
    this.runDayEvents();
  },
  runDayEvents(done) {
    if (State.get().gameOver) return;
    UI.lock(true);
    Events.runQueue(Events.checkEventConditions(), () => {
      UI.lock(false);
      if (Ending.queueAfterJudgment) { Ending.queueAfterJudgment = false; return Ending.finalize(); }
      UI.refresh(); UI.showDailyBrief(); Save.autoSave(); done && done();
    });
  },
  executeDailyAction(actionId, target) {
    if (UI.isLocked()) return;
    UI.lock(true);
    const ok = Actions.executeAction(actionId, target, () => this.afterAction());
    if (!ok) UI.lock(false);
  },
  afterAction() {
    const s = State.get(); if (s.gameOver) return;
    Status.clampAllStats(); HiddenGoals.check(); Achievements.checkPassive(); UI.refresh();
    Events.maybeRandom(() => {
      if (s.gameOver) return;
      // 行動後檢查條件事件（拆穿 / 修羅場）
      Events.runQueue(Events.checkEventConditions().filter(x => x.kind !== "event" || x.ev.type !== "MAIN"), () => {
        UI.lock(false); UI.refresh(); Save.autoSave();
        if (s.calendar.remainingActions <= 0 && !Actions.freeChatAvailable()) this.endDay();
      });
    });
  },
  endDay() {
    const s = State.get(); if (s.gameOver) return;
    UI.lock(true);
    // 風聲平息：被正式調查時不恢復；今天沒做可疑的事 -1，且純潔氣場 85 以上再 -1
    if (!s.story.flags.gu_zhixia_investigating) { let rec = 0; if (!s.calendar.suspicious) { rec += 1; if (s.status.pureAura >= 85) rec += 1; } if (rec) Status.addGlobalSuspicion(-rec); }
    const news = NPCManager.dailyUpdate();
    Relations.calculateRelationshipEffects();
    Memory.decayMemories();
    Status.addEnergy(CONFIG.dailyEnergyRegen); Economy.addGold(CONFIG.dailyAllowance);
    if (s.status.pureAura > 80) Status.addPureAura(-1);
    HiddenGoals.check(); Achievements.checkPassive();
    s.lastNews = news;
    if (s.calendar.day >= CONFIG.totalDays) { UI.lock(false); return Ending.finalize(); }
    UI.showNightSummary(news, () => { s.calendar.day += 1; Save.autoSave(); UI.lock(false); this.startDay(); });
  },
  startNextDay() { this.endDay(); }
};

/* ---------- BattleManager ---------- */
const Battle = {
  active: null,
  startBattle(def, onEnd) {
    const s = State.get();
    const prevCtx = Memory.ctx;
    Memory.ctx = { src: (prevCtx && prevCtx.src) || "battle", label: def.memLabel || (prevCtx && prevCtx.label) || def.title, involved: [...new Set([...(def.participants || []), ...(def.witnesses || [])])] };
    const deck = Cards.getDeck().filter(id => CARD_MAP[id]);
    const b = this.active = {
      def, type: def.type || "normal", participants: def.participants.filter(id => NPCS[id]), witnesses: def.witnesses || [], context: def.context || "small",
      rounds: def.rounds || 3, round: 0, goal: def.goal ?? 60, mood: def.type === "shuraba" ? 45 : 48,
      draw: Cards.shuffleDeck(deck), discard: [], hand: [], log: [], intents: {}, speaker: null, target: def.participants[0],
      firstSus: true, firstScheme: true, usedAdmit: false, usedCounter: false, counterOk: false, manipUsed: 0, onEnd, ended: false, cleanStreak: 0,
      startSus: Object.fromEntries(NPC_IDS.map(id => [id, s.npcRelations[id].suspicion])), prevCtx
    };
    if (b.type === "boss") this.initBoss(b);
    Cards.drawCards(b, CONFIG.handStart);
    if (!b.participants.length) { this.endBattle("win"); return; }
    UI.openBattle(b);
    this.startBattleTurn();
  },
  observers(b) { return [...new Set([...b.participants, ...b.witnesses])]; },
  startBattleTurn() {
    const b = this.active; if (!b || b.ended) return;
    b.busy = false; b.round++;
    if (b.round > 1) { Cards.drawCards(b, 1); if (b.hand.length < CONFIG.handStart) Cards.drawCards(b, CONFIG.handStart - b.hand.length); }
    if (b.type === "boss") { this.bossTurn(b); UI.renderBattle(b); return; }
    // NPC 意圖：懷疑度高／嫉妒心強者優先發言
    const s = State.get();
    const weights = b.participants.map(id => ({ id, w: 1 + s.npcRelations[id].suspicion / 25 + (id === "shen" && b.participants.includes("lin") ? 2 : 0) }));
    b.speaker = Utils.weighted(weights).id;
    let pool = NPC_INTENT_POOL[b.speaker] || ["chat"];
    if (b.type === "chat" || b.type === "date") pool = ["chat", "chat", "probe"];
    if (s.npcRelations[b.speaker].suspicion >= 50 && b.type !== "chat") pool = pool.concat(["question", "question"]);
    b.intent = Utils.pick(pool);
    b.target = b.participants.includes(b.target) ? b.target : b.speaker;
    // 修羅場：NPC 互相交換情報
    if (b.type === "shuraba" && b.round === 2 && b.participants.length >= 2) {
      const [x, y] = Utils.shuffle(b.participants); const sx = s.npcRelations[x].suspicion;
      if (sx >= 30) { const d = Status.addSuspicion(y, Math.round(sx * 0.12)); b.log.push({ t: `${NPCS[x].name}向${NPCS[y].name}使了個眼色……（${NPCS[y].name} 懷疑 +${d}）`, k: "bad" }); }
    }
    b.log.push({ t: `第 ${b.round} 回合：${NPCS[b.speaker].name}【${INTENTS[b.intent].name}】${INTENTS[b.intent].desc}`, k: "sys" });
    UI.renderBattle(b);
  },
  getAvailableCards() { const b = this.active; return b ? b.hand.map(id => ({ id, playable: Cards.costOf(id) <= State.get().player.schemePoints })) : []; },
  preview(cardId, targetId) {
    const b = this.active; if (!b) return null;
    return CardMath.compute(cardId, targetId || b.target, { context: b.context, observers: this.observers(b), intent: targetId === b.speaker || !targetId || targetId === b.target ? b.intent : null, firstSus: b.firstSus, firstScheme: b.firstScheme });
  },
  playCard(cardId) {
    const b = this.active; if (!b || b.ended || b.busy) return;
    if (!b.hand.includes(cardId)) { UI.toast("這張卡不在手牌中", "bad"); return; }
    const cost = Cards.costOf(cardId);
    if (State.get().player.schemePoints < cost) { UI.toast("心機點數不足", "bad"); return; }
    b.busy = true;
    if (b.type === "boss") { this.bossCard(b, cardId); return; }
    this.resolveCardEffect(cardId, b.target);
    Cards.discardCard(b, cardId);
    this.resolveNPCReaction(CARD_MAP[cardId]);
    this.checkBattleResult();
  },
  resolveCardEffect(cardId, targetId) {
    const b = this.active, s = State.get(), r = this.preview(cardId, targetId); if (!r) return;
    const card = r.card, npc = NPCS[targetId];
    Status.addSchemePoints(-r.cost); if (r.cost > 0) { s.statistics.schemeUsed += r.cost; b.firstScheme = false; }
    s.statistics.cardsPlayed++; card.tags.forEach(t => { s.statistics.tagCounts[t] = (s.statistics.tagCounts[t] || 0) + 1; s.statistics.recentTags.push(t); });
    s.statistics.recentTags = s.statistics.recentTags.slice(-8);
    const fav = Status.addFavor(targetId, r.favor);
    const aura = Status.addPureAura(r.pureAura);
    let sus = 0;
    if (r.susInc > 0) { sus = Status.addSuspicion(targetId, r.susInc); b.firstSus = false; }
    if (r.susRed < 0) { sus = Status.addSuspicion(targetId, r.susRed); if (sus < 0) Achievements.unlock("a_innocent"); }
    if (r.globalInc) Status.addGlobalSuspicion(r.globalInc);
    let lotusCalm = 0;
    if (card.type === "WHITE_LOTUS" && r.level >= 3 && !b.lotusCalmUsed) { b.lotusCalmUsed = true; lotusCalm = -Status.addGlobalSuspicion(-2); }
    // 目擊者：其他在場且敏銳的 NPC 也會起疑
    let witnessSus = 0;
    if (r.susInc > 0 && b.context !== "private") this.observers(b).filter(id => id !== targetId).forEach(id => {
      const ws = Utils.round(r.susInc * 0.25 * NPCS[id].attributes.sensitivity / 100); if (ws > 0) { Status.addSuspicion(id, ws); witnessSus += ws; }
    });
    const said = `妳對${npc.name}說了「${card.name}」`;
    // 在場且敏銳的人會親眼記下挑撥與曖昧（非私下場合）
    if (b.context !== "private" && (card.tags.includes("MANIPULATE") || (card.tags.includes("FLIRT") && targetId === "lin"))) {
      const eyes = this.observers(b).filter(id => id !== targetId && NPCS[id].attributes.sensitivity >= 50);
      if (eyes.length) Memory.witness(eyes, { type: card.tags.includes("MANIPULATE") ? "manipulated" : "sus_post", detail: said, severity: card.cost >= 2 ? 2 : 1, evidence: true });
    }
    if (card.tags.includes("WEAKNESS") && b.context === "public") this.observers(b).filter(id => NPCS[id].attributes.sensitivity >= 60).forEach(id => Memory.addMemory(id, { type: "public_weak", detail: said }));
    if (card.tags.includes("CRISIS")) Memory.addMemory(targetId, { type: "protected_self", detail: said });
    // 信任、情緒
    if (r.susInc > 8) Status.addTrust(targetId, -2); else Status.addTrust(targetId, Utils.round(r.favor * 0.25));
    Status.addEmotion(targetId, Utils.round(r.favor * 0.5) - (r.intent.bad ? 6 : 0));
    // 對予辰示好：若晴在場會直接受傷，不在場也會從別人口中聽說
    if (targetId === "lin" && card.tags.includes("FLIRT")) Romance.log("flirt", this.observers(b).includes("shen"));
    if (targetId === "lin" && card.tags.includes("FLIRT") && !s.story.flags.lin_shen_broke_up) { const hit = this.observers(b).includes("shen") ? 4 : 2; Status.addRelation("shen", "lin", -hit); Status.addRelation("lin", "shen", -Math.ceil(hit / 2)); }
    // 挑撥：傷害目標與其最親近者的關係
    if (card.tags.includes("MANIPULATE")) {
      // 被挑撥的對象：優先選在場、且和目標最親近的人
      const present = this.observers(b).filter(x => x !== targetId).sort((x, y) => Relations.getRelationship(targetId, y) - Relations.getRelationship(targetId, x));
      const victim = present[0] || Relations.closest(targetId, [targetId]);
      if (victim) { const couple = (targetId === "lin" && victim === "shen") || (targetId === "shen" && victim === "lin"); Status.addRelation(targetId, victim, couple ? -7 : -4); }
      Memory.addMemory(targetId, { type: "manipulated", detail: said + (victim ? `，話裡帶著${NPCS[victim].name}` : ""), severity: card.cost >= 2 ? 2 : 1 }); b.manipUsed++;
    }
    b.mood = Utils.clamp(b.mood + r.mood, 0, 100);
    if (r.susInc > 0 || witnessSus > 0) b.cleanStreak = 0; else { b.cleanStreak++; if (b.cleanStreak >= 3) Achievements.unlock("a_clean3"); }
    const parts = [`好感 ${fav >= 0 ? "+" : ""}${fav}`];
    if (aura) parts.push(`純潔 ${aura > 0 ? "+" : ""}${aura}`);
    if (sus) parts.push(`懷疑 ${sus > 0 ? "+" : ""}${sus}`);
    if (witnessSus) parts.push(`旁人懷疑 +${witnessSus}`);
    if (r.globalInc) parts.push(`警報 +${r.globalInc}`);
    if (lotusCalm) parts.push(`警報 -${lotusCalm}`);
    parts.push(`氣氛 ${r.mood >= 0 ? "+" : ""}${r.mood}`);
    b.log.push({ t: `妳對${npc.name}使出「${card.name}」${r.intent.good ? "（正中下懷！）" : r.intent.bad ? "（不合時宜…）" : ""}${r.resist ? "（對方抗拒）" : ""}：${parts.join("、")}`, k: r.susInc > 0 ? "warn" : "good" });
    b.lastInner = card.inner;
    UI.showInner(card.inner, card.type !== "WHITE_LOTUS");
    Sfx.play(card.type === "WHITE_LOTUS" ? "card" : "evil");
  },
  resolveNPCReaction(card) {
    const b = this.active, s = State.get(); if (!b) return;
    const it = INTENTS[b.intent]; const countered = card && card.tags.some(t => it.good.includes(t));
    if (!countered && b.type !== "chat") {
      let dmg = Math.round(it.dmg * (b.type === "shuraba" ? 1 : 0.8)) + (s.npcRelations[b.speaker].suspicion >= 60 ? 3 : 0);
      const backed = b.speaker === "shen" && b.participants.includes("lin") && Relations.couple() >= 60;
      if (backed) dmg += 2;
      b.mood = Utils.clamp(b.mood - dmg, 0, 100);
      b.log.push({ t: `${NPCS[b.speaker].name}：「${this.npcLine(b.speaker, b.intent)}」（氣氛 -${dmg}）${backed ? "　予辰站在若晴那邊。" : ""}`, k: "bad" });
    } else {
      b.log.push({ t: `${NPCS[b.speaker].name}：「${NPCManager.getNPCReaction(b.speaker)}」`, k: "npc" });
    }
  },
  npcLine(id, intent) {
    const L = { question: ["妳到底想說什麼？", "這跟妳之前說的不一樣吧？"], jealous: ["妳們很熟嘛？", "他怎麼什麼都告訴妳？"], accuse: ["妳是故意的吧！", "大家都看到了喔。"], observe: ["……（她在筆記本上寫了一行字）", "繼續說，我在聽。"], probe: ["那妳自己怎麼想？", "妳真的這樣覺得？"], gossip: ["欸所以到底是怎樣！", "妳一定知道什麼吧～"], chat: ["哈哈，是喔？", "然後呢？"] };
    return Utils.pick(L[intent] || ["……"]);
  },
  // 玩家其他行動
  admit() {
    const b = this.active; if (!b || b.busy || b.ended || b.usedAdmit || b.type === "boss") return;
    b.usedAdmit = true; b.mood = Utils.clamp(b.mood + 8, 0, 100);

    this.resolveNPCReaction({ tags: ["CRISIS"] }); this.checkBattleResult();
  },
  counter() {
    const b = this.active; if (!b || b.busy || b.ended || b.usedCounter || b.type === "boss") return;
    const intel = b.participants.flatMap(id => Intel.aboutNPC(id)); if (!intel.length) { UI.toast("沒有可用的情報", "bad"); return; }
    const key = intel[0], who = INTEL[key].about; b.usedCounter = true; b.counterOk = true;
    Status.addSuspicion(who, -15); Status.addEmotion(who, -25); Status.addSchemePoints(1); Status.addGlobalSuspicion(2);
    b.mood = Utils.clamp(b.mood + 15, 0, 100);

  },
  pass() {

    b.mood = Utils.clamp(b.mood - 3, 0, 100); b.log.push({ t: "妳保持沉默。（氣氛 -3）", k: "sys" });

  },
  normalChat() {
    const b = this.active; if (!b || b.busy || b.ended || b.type !== "chat") return;
    const id = b.target; const f = Status.addFavor(id, 3), t = Status.addTrust(id, 4); Status.addEmotion(id, 5);
    b.log.push({ t: `妳和${NPCS[id].name}真誠地聊了聊。（好感 +${f}、信任 +${t}）`, k: "good" });

  checkBattleResult() {
    const b = this.active; if (!b || b.ended) return;

  endBattle(force) {
    const b = this.active; if (!b || b.ended) return; b.ended = true;
    const s = State.get(); let key = force;
    b.participants.forEach(id => { s.npcRelations[id].lastChatDay = s.calendar.day; });
    if (b.type === "boss") s.story.bossCited = (b.boss.cited || []).slice();
    if (!key) {
      if (b.type === "boss") key = b.boss.cred >= 80 ? "perfect" : b.boss.cred >= 50 ? "win" : "fail";
      else if (b.type === "chat") key = "win";
      else if (b.mood >= 90) key = b.counterOk && b.type === "shuraba" ? "counter" : "perfect";
      else if (b.mood >= b.goal) key = b.counterOk && b.type === "shuraba" ? "counter" : "win";
      else if (b.mood >= b.goal - 15) key = "sacrifice";
      else key = "fail";
    }
    const labels = { perfect: b.type === "shuraba" ? "完美化解" : "大成功", win: b.type === "shuraba" ? "成功化解" : "成功", sacrifice: b.type === "shuraba" ? "犧牲式勝利" : "勉強過關", counter: "反客為主", fail: b.type === "shuraba" ? "危機失敗" : "失敗" };
    const notes = [];
    if (b.type !== "chat" && b.type !== "boss") {
      if (key === "perfect" || key === "win" || key === "counter") { s.statistics.successfulBattles++; notes.push(...Effects.apply([["gold", key === "perfect" ? 60 : 40], ["frag", key === "perfect" ? 2 : 1]])); }
      else if (key === "fail") { s.statistics.failedBattles++; notes.push(...Effects.apply([["global", 6]])); b.participants.forEach(id => Memory.addMemory(id, { type: "lied", major: b.type === "shuraba", detail: "妳的說法前後對不上", severity: b.type === "shuraba" ? 3 : 2 })); }

    HiddenGoals.check();
    UI.showBattleResult(b, key, labels[key] || key, [...dsus, ...notes], () => {
      UI.closeBattle(); this.active = null; Memory.ctx = b.prevCtx; b.onEnd && b.onEnd(key);

  /* ----- 首領戰：鑑茶女王的審判 ----- */
  initBoss(b) {
    const s = State.get(), g = s.npcRelations.gu;
    const allies = this.allies().length;
    let cred = 35 + Math.round((s.status.clubSupport - 50) / 5) + allies * 2 - Math.round((g.suspicion - 30) / 3) - Math.round(s.status.globalSuspicion / 4) + Math.round((g.trust - 40) / 6);
    if (g.exposed) cred -= 10;
    if (s.story.flags.won_club_support_vote || s.story.flags.vote_ally_shen) cred += 4;
    const pick = (phase, n) => {
      const pool = BOSS_ACCUSATIONS.filter(a => a.phase === phase && (a.always || (a.cond && a.cond(s))));
      const cond = Utils.shuffle(pool.filter(a => !a.always)), alw = pool.filter(a => a.always);
      return [...cond, ...alw].slice(0, n);
    };
    let p1 = pick(1, 2); if (p1.length < 2) p1 = p1.concat(BOSS_ACCUSATIONS.filter(a => a.id === "acc_history")).slice(0, 2);
    const p2 = pick(2, 2), p3 = pick(3, 2);
    b.boss = { cred: Utils.clamp(cred, 10, 60), accs: [...p1, ...p2, ...p3].slice(0, 6), usedIntel: [], usedAllies: [], usedMem: [], current: null, evidence: null, phase: 1, liedMem: Memory.findMemory("gu", "lied").length };
    while (b.boss.accs.length < 6) b.boss.accs.push(BOSS_ACCUSATIONS.find(a => a.id === "acc_history"));
    b.rounds = 6; b.mood = b.boss.cred;

  allies() {
    const s = State.get(); return ["lin", "shen", "chen", "xu"].filter(id => { const r = s.npcRelations[id]; return !r.exposed && r.suspicion < 60 && ((r.favor >= 60 && r.trust >= 45) || (id === "xu" && s.story.flags.xu_blackmailed)); });
  },
  bossTurn(b) {
    const acc = b.boss.accs[b.round - 1]; b.boss.current = acc; b.speaker = "gu";
    const phase = b.round <= 2 ? 1 : b.round <= 4 ? 2 : 3;
    if (phase !== b.boss.phase || b.round === 1) { b.boss.phase = phase; b.log.push({ t: ["", "【第一階段：觀察與提問】", "【第二階段：過往情報揭露】", "【第三階段：公開審判】"][phase], k: "phase" }); UI.flashDark(); }
    if (b.boss.liedMem >= 2 && b.round > 1) { b.boss.cred = Utils.clamp(b.boss.cred - 2, 0, 100); b.log.push({ t: "（她記得妳說過的每一個謊。可信度 -2）", k: "bad" }); }
    b.log.push({ t: `顧知夏：「${Utils.fmt(acc.t)}」`, k: "boss" });
    // 讀取六週紀錄：引用一筆具體記憶當作證據
    b.boss.evidence = null;
    if (acc.mem && b.round > 1) {
      const m = Memory.evidence(acc.mem, b.boss.usedMem, "gu");
      if (m) {
        b.boss.usedMem.push(m.origin); const d = Memory.describe(m);
        const src = m.how === "witness" ? "我親眼看到的" : m.how === "screenshot" ? "我看過截圖" : `這是${NPCS[m.from]?.name || "有人"}告訴我的`;
        const hit = m.cred >= 90 ? 4 : m.cred >= 70 ? 3 : 2;
        b.boss.evidence = `${d.when}${d.detail ? "，" + d.detail : ""}${d.who}。——${src}。`;
        b.boss.evidenceCred = m.cred; (b.boss.cited = b.boss.cited || []).push({ day: m.day, how: m.how, cred: m.cred });
        b.boss.cred = Utils.clamp(b.boss.cred - hit, 0, 100);
        b.log.push({ t: `顧知夏翻開筆記本：「${b.boss.evidence}」（證據可信度 ${m.cred}，可信度 -${hit}）`, k: "boss" });
      }
    }
    // 予辰與若晴分手、若晴懷恨：公開審判時她會站出來指證
    if (b.round === 5 && State.get().story.flags.lin_shen_broke_up && Status.rel("shen").suspicion >= 40 && !Status.rel("shen").exposed) {
      b.boss.cred = Utils.clamp(b.boss.cred - 5, 0, 100); b.log.push({ t: "沈若晴站了起來：「她就是讓我們分手的人。」（可信度 -5）", k: "bad" });
    }
    b.mood = b.boss.cred;
  },
  bossOptionState(key) {
    const b = this.active; if (!b || !b.boss) return { ok: false };
    if (key === "intel") { const left = Intel.owned().filter(k => !b.boss.usedIntel.includes(k)); return { ok: left.length > 0, reason: left.length ? `剩 ${left.length} 條情報` : "沒有可用情報" }; }
    if (key === "ally") { const left = this.allies().filter(a => !b.boss.usedAllies.includes(a)); return { ok: left.length > 0, reason: left.length ? `可請 ${left.map(i => NPCS[i].name).join("、")}` : "沒有願意幫妳的盟友" }; }
    return { ok: true };
  },
  bossStrategy(key) {
    const b = this.active; if (!b || !b.boss || b.ended || b.busy) return;
    const st = this.bossOptionState(key); if (!st.ok) { UI.toast(st.reason, "bad"); return; }
    b.busy = true;
    const s = State.get(), acc = b.boss.current, phase = b.boss.phase;
    let d = acc.weak.includes(key) ? 12 : acc.strong.includes(key) ? -14 : 2, text = "";
    switch (key) {
      case "admit": Status.addPureAura(-4); if (phase === 3) d += 6; if (b.boss.evidence) d += (b.boss.evidenceCred >= 70 ? 5 : 2); text = "妳深吸一口氣：「……有些事，我確實做得不對。」"; break;
      case "explain": text = "妳把當時的來龍去脈，一件一件說清楚。"; if (b.boss.evidence && b.boss.evidenceCred < 70) { d += 4; text += "（傳聞的證據，澄清起來容易得多）"; } break;
      case "deflect": if (phase === 3) d -= 8; if (b.boss.evidence) d -= (b.boss.evidenceCred >= 70 ? 5 : 1); if (d < 0) Status.addGlobalSuspicion(2); text = "「學姊，比起我，大家是不是更該關心……」"; break;
      case "intel": {
        const left = Intel.owned().filter(k => !b.boss.usedIntel.includes(k));
        const rel = { acc_vote: "intel_shen_rival", acc_leak: "intel_xu_account", acc_history: "intel_gu_project", acc_motive: "intel_gu_past", acc_public: "intel_gu_project", acc_groupchat: "intel_chen_broken" }[acc.id];
        const k = left.includes(rel) ? rel : left.sort((x, y) => INTEL[y].power - INTEL[x].power)[0];
        b.boss.usedIntel.push(k); d += INTEL[k].power * 2 + (k === rel ? 8 : 0);

        text = `妳拿出了情報：「${INTEL[k].name}」。`; break;
      }
      case "ally": {
        const left = this.allies().filter(a => !b.boss.usedAllies.includes(a)).sort((x, y) => s.npcRelations[y].favor - s.npcRelations[x].favor);
        const a = left[0]; b.boss.usedAllies.push(a); d += Math.round((s.npcRelations[a].favor - 60) / 5);
        text = `${NPCS[a].name}站了出來：「${{ lin: "知夏，小茶不是那種人。我可以作證。", shen: "……我跟她吵過，但這件事我站她這邊。", chen: "小茶幫過我很多次，我相信她！", xu: "我、我也可以作證啦！" }[a]}」`;
        // 感情穩定的情侶會一起表態

        if (partner && Relations.couple() >= 60 && left.includes(partner)) { b.boss.usedAllies.push(partner); d += 4; text += `　${NPCS[partner].name}也跟著點頭。`; }
        break;
      }
    }
    b.boss.cred = Utils.clamp(b.boss.cred + d, 0, 100); b.mood = b.boss.cred;
    b.log.push({ t: `${text}（可信度 ${d >= 0 ? "+" : ""}${d}）`, k: d >= 0 ? "good" : "bad" });
    b.log.push({ t: "顧知夏：「" + (d >= 12 ? "……繼續。" : d >= 0 ? "嗯。" : "妳覺得這樣就能帶過去？") + "」", k: "boss" });
    Sfx.play(d >= 0 ? "good" : "bad");
    this.checkBattleResult();
  },
  bossCard(b, cardId) {
    const r = CardMath.compute(cardId, "gu", { context: "public", observers: this.observers(b), intent: "observe", firstSus: b.firstSus, firstScheme: b.firstScheme });

    const d = Utils.round(r.mood * 0.5 + (r.card.tags.includes("CRISIS") || r.card.tags.includes("PUBLIC") ? 4 : 0));
    b.boss.cred = Utils.clamp(b.boss.cred + d, 0, 100); b.mood = b.boss.cred;
    b.log.push({ t: `審判中使出卡牌，可信度 ${d >= 0 ? "+" : ""}${d}`, k: d >= 0 ? "good" : "bad" });
    this.checkBattleResult();

/* ---------- EndingManager ---------- */
const Ending = {
  queueAfterJudgment: false,
  calculateEndingScore() {
    const s = State.get(), st = s.status, R = s.npcRelations;
    const maxFavor = Math.max(...NPC_IDS.map(id => R[id].favor));
    const good = NPC_IDS.filter(id => R[id].favor >= 55 && R[id].trust >= 40 && R[id].suspicion < 60).length;
    return {
      lotus: st.pureAura * 0.5 + (100 - st.globalSuspicion) * 0.35 + maxFavor * 0.15 + (s.statistics.schemeUsed <= 10 ? 25 : 0),
      queen: st.clubSupport * 0.35 + st.clubReputation * 0.2 + st.socialInfluence * 0.15 + good * 5 + (s.story.flags.won_club_support_vote ? 10 : 0),
      schemer: Math.min(60, s.statistics.schemeUsed * 1.5) + s.story.hiddenGoals.length * 12 + Object.keys(s.intel).length * 2,
      reqLotus: st.pureAura >= 70 && st.globalSuspicion < 40 && st.clubSupport >= 40 && s.statistics.schemeUsed <= 10,
      reqQueen: st.clubSupport >= 55 && (s.story.flags.won_club_support_vote || st.clubSupport >= 75) && good >= 2,
      reqSchemer: s.statistics.schemeUsed >= 25 && s.story.hiddenGoals.length >= 3
    };
  },
  evaluateEnding() {
    const s = State.get();
    if (s.status.globalSuspicion >= 100 || s.story.flags.failed_judgment || !s.story.flags.passed_judgment) return "exposed";
    const sc = this.calculateEndingScore();
    const cands = [["lotus", sc.lotus, sc.reqLotus], ["queen", sc.queen, sc.reqQueen], ["schemer", sc.schemer, sc.reqSchemer]];
    const ok = cands.filter(c => c[2]).sort((a, b) => b[1] - a[1]);
    if (ok.length) return ok[0][0];
    // 都未達門檻：社團支持 50 以上歸社交女王，否則取分數最高者
    if (s.status.clubSupport >= 50) return "queen";
    if (s.statistics.schemeUsed >= 15 && s.story.hiddenGoals.length >= 2) return "schemer";
    return cands.sort((a, b) => b[1] - a[1])[0][0];
  },
  getEndingResult() { return State.get().ending; },
  unlockEnding(id) {
    const s = State.get(); s.ending = id; s.gameOver = true;
    if (!s.statistics.endingsUnlocked.includes(id)) s.statistics.endingsUnlocked.push(id);
    Achievements.unlock({ lotus: "a_end_lotus", schemer: "a_end_schemer", queen: "a_end_queen", exposed: "a_end_exposed" }[id]);
    const m = Save.meta(); if (!m.endings.includes(id)) m.endings.push(id); m.clears++;
    m.collection = [...new Set([...(m.collection || []), ...s.deck.collection])];
    Object.entries(s.deck.cardLevels).forEach(([k, v]) => m.cardLevels[k] = Math.max(m.cardLevels[k] || 1, v));
    if (s.story.flags.gala_done) m.judgmentSeen = true;
    (m.history = m.history || []).push({ date: new Date().toLocaleDateString(), ending: id, aura: s.status.pureAura, global: s.status.globalSuspicion, support: s.status.clubSupport, scheme: s.statistics.schemeUsed });
    if (m.history.length > 20) m.history.shift();
    Save.saveMeta(m);
    try { localStorage.removeItem(CONFIG.autoSaveKey); } catch (e) { }
  },
  finalize() {
    const s = State.get(); if (s.ending) return;
    if (!s.story.flags.passed_judgment && !s.story.flags.failed_judgment && s.status.globalSuspicion < 100 && s.calendar.day >= CONFIG.totalDays && !s.story.flags.gala_done) {
      // 安全網：日程走完卻未觸發審判時，直接進入審判
      Story.setFlag("gala_done"); Events.triggerEvent("ev_judgment", () => { if (this.queueAfterJudgment) { this.queueAfterJudgment = false; this.finalize(); } });
      return;
    }
    const id = this.evaluateEnding(); this.unlockEnding(id); UI.showEnding(id);
  },
  gameOverExposed() {
    const s = State.get(); if (!s || s.gameOver) return;
    s.gameOver = true; s.ending = null;
    setTimeout(() => { if (Battle.active) { UI.closeBattle(); Battle.active = null; } Story.cur = null; UI.hideDialogue(); s.gameOver = false; this.unlockEnding("exposed"); UI.showEnding("exposed"); }, 600);
  }
};
EventBus.on("game:exposed", () => Ending.gameOverExposed());

    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg).replace(/'/g, "%27");

  renderActions() {

    const defs = [["club", "社團活動"], ["chat", "聊天"], ["date", "私下約會"], ["intel", "蒐集情報", 1], ["social", "經營社群"], ["practice", "練習話術", 1], ["rest", "休息"]];
    $("#actions").innerHTML = defs.map(([k, n, night]) => {
      const a = ACTIONS[k], dis = (out && !(k === "chat" && Actions.freeChatAvailable())) || s.player.energy < a.energy;
      return `<button class="act ${night ? "night" : ""}" data-a="${k}" ${dis ? "disabled" : ""}><b>${n}</b><small>${a.energy ? "精力 " + a.energy : "恢復精力"}</small></button>`;
    }).join("") + `<button class="act" data-a="end"><b>${out ? "結束今天 ›" : "提早結束"}</b><small>進入夜晚</small></button>`;
    $$("#actions .act").forEach(b => b.onclick = () => this.onAction(b.dataset.a));
  },
  onAction(k) {
    if (this.isLocked()) return;
    Sfx.play("click");
    if (k === "end") {
      const s = State.get();
      if (s.calendar.remainingActions <= 0) return Schedule.endDay();
      return this.modal("提早結束今天？", `<p>今天還有 <b>${s.calendar.remainingActions}</b> 次行動沒有使用，結束後就會直接進入夜晚。</p>`, { small: true, foot: [{ t: "取消", fn: m => m.remove() }, { t: "結束今天", cls: "primary", fn: m => { m.remove(); Schedule.endDay(); } }] });
    }
    if (ACTIONS[k].needTarget) return this.openTargetPicker(k);
    Schedule.executeDailyAction(k);
  },
  journalTabs: [["quest", "主線"], ["side", "支線"], ["intel", "情報"], ["log", "紀錄"], ["hidden", "隱藏目標"]],
  journalBody(tab) {
    const s = State.get();
    if (tab === "side") {
      return `<div class="quest"><p style="margin:0 0 6px">NPC 專屬與條件事件。條件達成後，會在隔天早上觸發。</p><ul style="padding-left:18px;margin:0">${Object.entries(EVENT_INFO).map(([id, [n, h]]) => Events.completed(id) ? `<li class="done">${n}（已完成）</li>` : `<li><b>${n}</b>　<span style="color:var(--ink-l)">${h}</span></li>`).join("")}</ul></div>`;
    }
    if (tab === "hidden") {
      return `<div class="quest"><p style="margin:0 0 6px">腹黑操盤手結局需要完成至少 2 個隱藏目標。</p><ul style="padding-left:18px;margin:0">${HIDDEN_GOALS.map(h => s.story.hiddenGoals.includes(h.id) ? `<li style="color:var(--violet)">✔ ${h.name}：${h.desc}</li>` : `<li style="color:#bba">？？？</li>`).join("")}</ul></div>`;
    }
    return this.sideBody(tab);
  },
  openJournal(tab = "quest") {

    const m = this.modal("日誌", html, {});
    $$("[data-j]", m).forEach(b => b.onclick = () => this.openJournal(b.dataset.j));
  },
  sideBody(tab) {
    const s = State.get(); let body = "";
    if (tab === "quest") {
      const sch = Schedule.getWeeklySchedule();
      body = `<div class="quest"><b>主線目標</b><p style="margin:4px 0 8px">第六週結束前，在顧知夏的審判中取得社團核心位置。</p><ul style="padding-left:18px;margin:0">${sch.map(([w, n, d]) => `<li class="${s.calendar.day > d ? "done" : ""}">${w}：${n}（Day ${d}）</li>`).join("")}</ul>
        <p style="margin:10px 0 4px"><b>隱藏目標</b>（腹黑路線）</p><ul style="padding-left:18px;margin:0">${HIDDEN_GOALS.map(h => s.story.hiddenGoals.includes(h.id) ? `<li style="color:var(--violet)">✔ ${h.name}：${h.desc}</li>` : `<li style="color:#bba">？？？</li>`).join("")}</ul>
        <p style="margin:10px 0 0">人際動態：予辰 ♥ 若晴 <b style="color:${Relations.coupleState().c}">${State.get().story.flags.lin_shen_broke_up ? "已分手" : Relations.coupleState().n}</b></p>
        <p style="margin:6px 0 0;font-size:calc(12px * var(--fs));color:var(--ink-l)">社群影響力 ${s.status.socialInfluence}・社團聲望 ${s.status.clubReputation}・天賦點 ${s.player.talentPoints}・卡牌碎片 ${s.player.cardFragments}</p></div>`;
    } else if (tab === "intel") {
      const own = Intel.owned();
      body = own.length ? own.map(k => `<div class="log-item intel"><b>${INTEL[k].name}</b><br>${INTEL[k].desc}</div>`).join("") : `<p class="quest">還沒有掌握任何情報。試試「蒐集情報」或和大家多聊聊。</p>`;
    } else body = s.log.slice(0, 60).map(l => `<div class="log-item ${l.kind}"><span class="d">D${l.day}</span>${Utils.esc(l.text)}</div>`).join("") || `<p class="quest">尚無紀錄</p>`;

  renderSide() {

    const s = State.get(); if (!s) return;

  showNightSummary(news, cb) {

    const html = `<p style="font-family:var(--serif)">夜深了。社團裡的每個人，也都在各自行動——</p>
      ${news.map(n => `<div style="display:flex;gap:8px;align-items:center;margin:6px 0">${this.ava(n.id)}<span>${Utils.esc(n.t)}</span></div>`).join("")}

    this.modal(`Day ${s.calendar.day} 結束・NPC 動態`, html, { small: true, dark: true, noClose: true, foot: [{ t: "迎接明天 ›", cls: "dark", fn: m => { m.remove(); cb(); } }] });

  /* ---------- 劇情（VN） ---------- */
  showNode(node, notes = []) {
    const vn = $("#vn"); vn.classList.remove("hidden");
    const sp = node.sp || "narr", isNpc = !!NPCS[sp], isPlayer = sp === "player", inner = sp === "inner";
    vn.classList.toggle("dark", inner || node.ex === "dark");
    const stage = $("#vnStage");
    const showId = isNpc ? sp : isPlayer || inner ? "player" : this._vnLast;
    if (showId && (isNpc || isPlayer || inner)) {
      this._vnLast = showId;
      const ex = isNpc ? (node.ex || Status.emotionExpr(sp)) : inner ? "dark" : "normal";
      const changed = stage.dataset.who !== showId; stage.dataset.who = showId;
      const exChanged = stage.dataset.ex !== ex; stage.dataset.ex = ex;
      stage.innerHTML = this.imgTag(showId, `vn-portrait ex-${ex} ${changed || exChanged ? "enter" : ""}`, "", ex) + (ex !== "normal" ? `<div class="emote">${{ angry: "怒", sad: "…", suspect: "？", shy: "♡", smile: "♪", dark: "♠" }[ex] || ""}</div>` : "");
    } else if (sp === "narr" && node.bg) { stage.innerHTML = ""; stage.dataset.who = ""; this._vnLast = null; }
    const box = $("#vnBox");
    box.className = "vn-box" + (inner ? " inner" : "") + (sp === "narr" ? " narr" : "");
    const nm = isNpc ? NPCS[sp].name : isPlayer ? State.get().player.name : inner ? "內心OS" : "";
    box.style.setProperty("--c", isNpc ? NPCS[sp].color : "#f48fb1");
    $("#vnName").textContent = nm;
    $("#vnText").textContent = Utils.fmt(node.t);
    $("#vnNotes").innerHTML = notes.map(n => `<span class="chip ${inner ? "dark" : ""}">${Utils.esc(n)}</span>`).join("");
    const ch = $("#vnChoices"); ch.innerHTML = "";
    if (node.ch) {
      $("#vnNext").classList.add("hidden");
      let any = false;
      node.ch.forEach((c, i) => {
        const ok = Effects.check(c.cond); if (ok) any = true;
        const lock = !ok ? (c.cond?.intel ? `需要情報：${INTEL[c.cond.intel]?.name || "？"}` : c.cond?.minScheme ? `需要心機點數 ${c.cond.minScheme}` : c.cond?.minFavor ? "好感不足" : c.cond?.minGold ? "金幣不足" : "條件不足") : c.hint;
        const b = document.createElement("button"); b.className = "choice" + (c.inner ? " inner" : ""); b.disabled = !ok;
        b.innerHTML = `${Utils.esc(Utils.fmt(c.t))}${lock ? `<span class="hint">${Utils.esc(lock)}</span>` : ""}`;
        b.onclick = e => { e.stopPropagation(); if (this._choiceBusy) return; this._choiceBusy = true; setTimeout(() => this._choiceBusy = false, 300); Sfx.play("click"); Story.resolveStoryChoice(i); };
        ch.appendChild(b);
      });
      if (!any) { const b = document.createElement("button"); b.className = "choice"; b.textContent = "（沉默）"; b.onclick = () => Story.finish(); ch.appendChild(b); }
    } else $("#vnNext").classList.remove("hidden");
    $("#vnNext").textContent = node.battle ? "▶ 進入社交戰鬥" : node.end ? "▶ 結束" : "▶ 點擊繼續";
    if (inner) Sfx.play("evil");
    requestAnimationFrame(() => this.placeToasts());
  },
  hideDialogue(_) { this._hideDialogue(); this.placeToasts(); },
  _hideDialogue() { $("#vn").classList.add("hidden"); $("#vnStage").innerHTML = ""; $("#vnStage").dataset.who = ""; },
  vnClick() {
    if (!Story.cur) return; const node = Story.getStoryNode(Story.cur.nodeId); if (!node || node.ch) return;
    if (this._vnBusy) return; this._vnBusy = true; setTimeout(() => this._vnBusy = false, 250);
    Story.advanceStory();
  },

  /* ---------- 目標選擇 ---------- */
  openTargetPicker(actionId) {
    const s = State.get(), a = ACTIONS[actionId];
    const html = `<p style="margin-top:0">${a.name}：${a.desc}</p><div class="target-grid">${NPC_IDS.map(id => {
      const err = Actions.canExecuteAction(actionId, id), r = s.npcRelations[id];
      return `<button class="target" data-id="${id}" ${err ? "disabled" : ""} title="${Utils.esc(err)}">${this.imgTag(id)}<b>${NPCS[id].name}</b><small>♡${r.favor}・信${r.trust}・${Status.suspicionLabel(r.suspicion)}</small>${err ? `<small style="color:var(--bad);display:block">${Utils.esc(err)}</small>` : ""}</button>`;
    }).join("")}</div>`;
    const m = this.modal("選擇對象", html, {});
    $$(".target", m).forEach(b => b.onclick = () => { m.remove(); Schedule.executeDailyAction(actionId, b.dataset.id); });
  },

  /* ---------- 卡牌 ---------- */
  cardHTML(id, o = {}) {
    const c = CARD_MAP[id]; if (!c) return "";
    const lv = State.get() ? Cards.level(id) : (Save.meta().cardLevels[id] || 1), cost = State.get() ? Cards.costOf(id) : c.cost;
    const pv = o.preview, it = o.intent ? INTENTS[o.intent] : null;
    const tags = c.tags.map(t => `<span class="${it ? (it.good.includes(t) ? "hit" : it.bad.includes(t) ? "miss" : "") : ""}">${TAG_NAMES[t]}</span>`).join("");
    const f = (v, lbl, inv) => v ? `<span class="${(v > 0) !== !!inv ? "up" : "dn"}">${lbl}${v > 0 ? "+" : ""}${v}</span> ` : "";
    const fx = pv ? `${f(pv.favor, "好感")}${f(pv.pureAura, "純潔")}${f(pv.susInc || pv.susRed, "懷疑", true)}${pv.globalInc ? f(pv.globalInc, "警報", true) : ""}<br><b>氣氛 ${pv.mood >= 0 ? "+" : ""}${pv.mood}</b>`
      : `${f(c.fx.favor, "好感")}${f(c.fx.pureAura, "純潔")}${f(c.fx.targetSuspicion, "懷疑", true)}`;
    return `<button class="card ${c.type} ${o.cls || ""}" data-card="${id}" ${o.disabled ? "disabled" : ""}>${cost ? `<span class="cost">${cost}</span>` : ""}
      <div class="ct"><span>${CARD_TYPES[c.type]}・${c.rarity}</span><span class="lv">Lv.${lv}</span></div><div class="cn">${c.name}</div><div class="tags">${tags}</div><div class="fx">${fx}</div></button>`;
  },

  /* ---------- 戰鬥 ---------- */
  openBattle(b) {
    const el = $("#battle"); el.classList.remove("hidden"); el.classList.toggle("boss", b.type === "boss");
    this.setBackground(this._bg || "clubroom"); this._selCard = null;
    requestAnimationFrame(() => this.placeToasts());
  },
  closeBattle() { $("#battle").classList.add("hidden"); this.closeModal("bres"); this.placeToasts(); },
  renderBattle(b) {
    if (!b) return; const s = State.get();
    const typeName = { normal: "社交戰鬥", shuraba: "修羅場", boss: "首領戰", chat: "交流", date: "約會" }[b.type];
    $("#bTitle").innerHTML = `${Utils.esc(b.def.title)}<small>${typeName}・第 ${Math.min(b.round, b.rounds)} / ${b.rounds} 回合・${{ private: "私下", small: "少數人在場", public: "公開場合" }[b.context]}</small>`;
    const isBoss = b.type === "boss", val = isBoss ? b.boss.cred : b.mood, goal = isBoss ? 50 : b.goal;
    $("#bMood").innerHTML = b.type === "chat" ? "" : `<div class="lbl"><span>${isBoss ? "可信度" : "氣氛值"} ${val}</span><span>${isBoss ? "通過 50／完美 80" : `目標 ${goal}`}</span></div><div class="track"><div class="fill" style="width:${val}%"></div><div class="goal" style="left:${goal}%"></div></div>`;
    $("#bFoes").innerHTML = b.participants.map(id => {
      const r = s.npcRelations[id];
      return `<div class="foe ${id === b.target ? "tgt" : ""} ${id === b.speaker ? "speaker" : ""}" data-id="${id}">${(() => { const ex = isBoss ? "dark" : Status.emotionExpr(id); return this.imgTag(id, `ex-${ex}`, "", ex); })()}
        <div class="foe-card"><div class="n"><span>${NPCS[id].name}</span><span>${Status.emotionLabel(r.emotion)}</span></div>
        <div class="fbar"><span>好感</span><div class="t"><b style="width:${r.favor}%;background:#ff9ec3"></b></div>${r.favor}</div>
        <div class="fbar"><span>懷疑</span><div class="t"><b style="width:${r.suspicion}%;background:${r.suspicion >= 60 ? "#e0476b" : "#ffb347"}"></b></div>${r.suspicion}</div></div></div>`;
    }).join("");
    $$("#bFoes .foe").forEach(f => f.onclick = () => { if (isBoss) return; b.target = f.dataset.id; this.renderBattle(b); });
    // 意圖 / 指控
    if (isBoss) $("#bIntent").innerHTML = b.boss.current ? `<div class="boss-acc">「${Utils.esc(Utils.fmt(b.boss.current.t))}」${b.boss.evidence ? `<div class="evidence">證據：${Utils.esc(b.boss.evidence)}</div>` : ""}</div>` : "";
    else $("#bIntent").innerHTML = b.intent ? `<div class="intent"><b>${NPCS[b.speaker].name}的意圖：${INTENTS[b.intent].name}</b>　${INTENTS[b.intent].desc}<br><small>有效標籤：${INTENTS[b.intent].good.map(t => TAG_NAMES[t]).join("、")}　｜　不利標籤：${INTENTS[b.intent].bad.map(t => TAG_NAMES[t]).join("、")}　｜　目前目標：${NPCS[b.target].name}</small></div>` : "";
    $("#bLog").innerHTML = b.log.slice(-40).map(l => `<p class="${l.k}">${Utils.esc(l.t)}</p>`).join(""); $("#bLog").scrollTop = 1e6;
    // 額外行動
    let extra = "";
    if (isBoss) extra = `<div class="boss-opts">${Object.entries(BOSS_STRATEGIES).map(([k, v]) => { const st = Battle.bossOptionState(k); return `<button class="btn dark" data-bs="${k}" ${st.ok && !b.ended ? "" : "disabled"}>${v.name}<small>${st.reason || v.desc}</small></button>`; }).join("")}</div>`;
    else {
      const intelOk = b.participants.some(id => Intel.aboutNPC(id).length);
      if (b.type === "chat") extra += `<button class="btn sm" data-ex="normal">真誠閒聊（不用卡）</button>`;
      else extra += `<button class="btn sm" data-ex="admit" ${b.usedAdmit ? "disabled" : ""}>承認部分事實</button><button class="btn sm dark" data-ex="counter" ${b.usedCounter || !intelOk ? "disabled" : ""} title="需要掌握在場者的情報">情報反擊</button><button class="btn sm ghost" data-ex="pass">保持沉默</button>`;
    }
    $("#bExtra").innerHTML = extra;
    $$("#bExtra [data-ex]").forEach(e => e.onclick = () => { if (b.ended) return; ({ admit: () => Battle.admit(), counter: () => Battle.counter(), pass: () => Battle.pass(), normal: () => Battle.normalChat() })[e.dataset.ex](); });
    $$("#bExtra [data-bs]").forEach(e => e.onclick = () => Battle.bossStrategy(e.dataset.bs));
    // 手牌
    const scheme = s.player.schemePoints;
    if (!b.hand.length) $("#bHand").innerHTML = `<div class="card-detail">手牌已空，牌庫與棄牌堆也沒有卡了。請使用上方的行動。</div>`;
    else $("#bHand").innerHTML = b.hand.map(id => {
      const pv = isBoss ? CardMath.compute(id, "gu", { context: "public", observers: ["gu"], intent: "observe" }) : Battle.preview(id, b.target);
      return this.cardHTML(id, { preview: pv, intent: isBoss ? "observe" : (b.target === b.speaker ? b.intent : null), disabled: Cards.costOf(id) > scheme || b.ended, cls: this._selCard === id ? "sel" : "" });
    }).join("");
    $$("#bHand .card").forEach(c => {
      c.onclick = () => {
        if (b.ended) return; const id = c.dataset.card;
        if (this._selCard === id) { this._selCard = null; Battle.playCard(id); return; }
        this._selCard = id; this.renderBattle(b); this.cardDetail(id, b);
      };
      c.onmouseenter = () => { if (matchMedia("(hover:hover)").matches) this.cardDetail(c.dataset.card, b); };
    });
    if (!this._selCard) $("#bDetail").innerHTML = `<span style="color:#e9bcd0">點一下卡牌查看效果，再點一次打出。${b.participants.length > 1 && !isBoss ? "點選上方角色可切換目標。" : ""}</span>`;
  },
  cardDetail(id, b) {
    const c = CARD_MAP[id]; if (!c) return;
    const pv = b.type === "boss" ? CardMath.compute(id, "gu", { context: "public", observers: ["gu"], intent: "observe" }) : Battle.preview(id, b.target);
    $("#bDetail").innerHTML = `<b style="color:#ffc1d8">${c.name}</b>（心機 ${Cards.costOf(id)}）${c.desc}<br><span style="color:#ff8db5">內心：${c.inner}</span>${pv ? `<br><small>對 ${NPCS[b.type === "boss" ? "gu" : b.target].name}：好感 +${pv.favor}　懷疑 ${pv.susInc ? "+" + pv.susInc : pv.susRed}　氣氛 ${pv.mood >= 0 ? "+" : ""}${pv.mood}${pv.resist ? "（對方正在抗拒）" : ""}${pv.aff >= 1.2 ? "（符合性格）" : ""}</small>` : ""}${this._selCard === id ? `　<button class="btn sm primary" id="playSel">打出</button>` : ""}`;
    const ps = $("#playSel"); if (ps) ps.onclick = () => { this._selCard = null; Battle.playCard(id); };
  },
  showBattleResult(b, key, label, notes, cb) {
    const good = ["perfect", "win", "counter"].includes(key), sac = key === "sacrifice";
    const html = `<div class="res-title ${good ? "good" : sac ? "" : "bad"}">${label}</div>${b.type !== "chat" ? `<p style="text-align:center">${b.type === "boss" ? "最終可信度" : "最終氣氛"}：${b.type === "boss" ? b.boss.cred : b.mood}</p>` : ""}<div class="notes">${notes.map(n => `<span>${Utils.esc(n)}</span>`).join("")}</div>`;
    Sfx.play(good ? "good" : "bad");
    setTimeout(() => this.modal(b.def.title, html, { id: "bres", small: true, dark: true, noClose: true, foot: [{ t: "繼續", cls: "dark", fn: m => { m.remove(); cb(); } }] }), 200);
  },

        <b>誰可以看到</b><div class="opt-grid">${Object.entries(VISIBILITY).map(([k, v]) => `<button data-v="${k}" class="${st.vis === k ? "on" : ""}">${v}</button>`).join("")}</div>
        ${st.vis === "only" || st.vis === "exclude" ? `<div class="npc-pick">${NPC_IDS.map(id => `<button data-n="${id}" class="${st.targets.includes(id) ? "on" : ""}">${this.ava(id)}${NPCS[id].name}</button>`).join("")}</div>` : ""}
        <p style="font-size:calc(12px * var(--fs));color:var(--ink-l)">提示：敏銳的人比較容易察覺可疑動態；被排除的人仍可能透過朋友截圖看到。${st.vis === "friends" ? "（好感 30 以上才算好友）" : ""}</p></div>`;
    };
    const m = this.modal("發布動態", draw(), { small: true, foot: [{ t: "取消", fn: mm => { mm.remove(); State.get().player.energy += 0; cb(false); } }, { t: "發布", cls: "primary", fn: mm => {

      st.text = ($("#pTxt", mm).value || "").trim();
      const res = Social.createPost({ type: st.type, text: st.text, visibility: st.vis, targets: st.targets });
      mm.remove();
      const p = res.post;
      this.result("動態已發布", `「${p.text}」\n\n看到的人：${p.viewers.map(i => NPCS[i].name).join("、") || "沒有人"}\n按讚：${p.likes.map(i => NPCS[i].name).join("、") || "還沒有人"}${p.comments.length ? "\n留言：" + p.comments.map(c => `${NPCS[c.id].name}「${c.t}」`).join("　") : ""}`, res.notes, () => cb(true), !!p.leaked);
    } }] });
    const bind = () => {
      $$("[data-t]", m).forEach(b => b.onclick = () => { st.text = $("#pTxt", m).value; st.type = b.dataset.t; st.text = ""; re(); });
      $$("[data-v]", m).forEach(b => b.onclick = () => { st.text = $("#pTxt", m).value; st.vis = b.dataset.v; st.targets = []; re(); });
      $$("[data-n]", m).forEach(b => b.onclick = () => { st.text = $("#pTxt", m).value; const i = st.targets.indexOf(b.dataset.n); i >= 0 ? st.targets.splice(i, 1) : st.targets.push(b.dataset.n); re(); });
      $$("[data-s]", m).forEach(b => b.onclick = () => { $("#pTxt", m).value = b.dataset.s; });
    };
    const re = () => { $(".modal-body", m).innerHTML = draw(); bind(); };
    bind();
    // 取消時退還精力（未實際執行行動）
    const cancel = $(".modal-foot .btn", m); cancel.onclick = () => { m.remove(); Status.addEnergy(ACTIONS.social.energy); cb(false); };

      <div class="txt">${Utils.esc(p.text)}</div><div class="meta"><span>♡ ${p.likes.length}${p.likes.length ? "（" + p.likes.map(i => NPCS[i].name).join("、") + "）" : ""}</span><span>${VISIBILITY[p.visibility]}${p.targets.length ? "：" + p.targets.map(i => NPCS[i].name).join("、") : ""}</span>${p.leaked ? `<span class="leaked">截圖外流</span>` : ""}</div>
      ${p.comments.map(c => `<div class="cm"><b>${NPCS[c.id].name}</b>：${Utils.esc(c.t)}</div>`).join("")}</div>`).join("") : `<p style="padding:20px;text-align:center;color:var(--ink-l)">還沒有發過動態。使用「經營社群」行動來發文吧！</p>`;

    const html = `<div class="npc-tabs">${NPC_IDS.map(k => `<button data-n="${k}" class="${k === id ? "on" : ""}">${this.ava(k)}${NPCS[k].name}</button>`).join("")}</div>
      <div class="npc-detail"><div>${this.imgTag(id)}</div><div>
        <div class="box"><h4>${n.name}（${n.age}）・${n.role}</h4><p style="margin:0 0 6px;font-size:calc(13px * var(--fs))">${n.traits}</p><p style="margin:0;font-size:calc(13px * var(--fs));color:var(--ink-l)">${n.bio}</p></div>
        <div class="box">${meter("好感度", r.favor, "linear-gradient(90deg,#ffc1d8,#f48fb1)")}${meter("信任度", r.trust, "linear-gradient(90deg,#c9e7ff,#7aa7e8)")}
          ${meter("懷疑度　" + Status.suspicionLabel(r.suspicion), r.suspicion, "linear-gradient(90deg,#ffd28a,#e0476b)", showSus)}
          <p style="font-size:calc(12px * var(--fs));margin:4px 0 0">情緒：${Status.emotionLabel(r.emotion)}${r.exposed ? `　<b style="color:var(--bad)">已拆穿妳</b>` : ""}${!showSus ? "　（信任 50 以上或掌握其情報才能看清懷疑度）" : ""}</p></div>
        ${id === "lin" || id === "shen" ? this.coupleBox() : ""}
        <div class="box"><h4>人際網</h4>${rels}</div>
        <div class="box"><h4>已解鎖情報</h4>${intel.length ? `<ul class="intel-list">${intel.map(k => `<li><b>${INTEL[k].name}</b>：${INTEL[k].desc}</li>`).join("")}</ul>` : `<span style="font-size:calc(13px * var(--fs));color:var(--ink-l)">尚無</span>`}</div>
        <div class="box"><h4>最近互動紀錄（她/他記得的事）</h4>${mems.length ? `<ul class="mem-list">${mems.map(m => `<li>D${m.day}${m.label ? "・" + Utils.esc(m.label) : ""}：${Memory.labels[m.type] || m.type}${m.major ? "（深刻）" : ""}<span class="chip lav" style="margin-left:4px">${m.how === "told" ? `聽${NPCS[m.from]?.name || "別人"}說・可信 ${m.cred}` : m.how === "screenshot" ? "看過截圖・可信 85" : "親眼目擊"}</span>${m.detail ? `<br><span style="color:var(--ink-l)">${Utils.esc(m.detail)}${m.involved && m.involved.length ? `（${m.involved.map(i => NPCS[i]?.name).join("、")}在場）` : ""}</span>` : ""}</li>`).join("")}</ul>` : `<span style="font-size:calc(13px * var(--fs));color:var(--ink-l)">還沒有特別的回憶</span>`}</div>
        <div class="box"><h4>送禮</h4>${giftInv.length ? giftInv.map(g => `<button class="btn sm" data-g="${g}">${GIFTS[g].name} ×${s.player.items[g]}</button>`).join(" ") : `<span style="font-size:calc(13px * var(--fs));color:var(--ink-l)">沒有禮物，可在商店購買（喜歡的禮物：${GIFTS[n.gift].name}）</span>`}<p style="font-size:calc(12px * var(--fs));margin:4px 0 0;color:var(--ink-l)">每人每週一次，送錯禮物效果較低。</p></div>
      </div></div>`;

  coupleBox() {

      ${f.lin_shen_broke_up ? "" : `<button class="btn sm" id="mediateBtn" ${err ? "disabled" : ""} title="${Utils.esc(err)}">撮合兩人（1 次行動・精力 15）</button>${err ? `<span style="font-size:calc(12px * var(--fs));color:var(--ink-l)"> ${Utils.esc(err)}</span>` : ""}`}
      <p style="margin:4px 0 0;font-size:calc(12px * var(--fs));color:var(--ink-l)">${{ stable: "兩人會一起行動、互相幫忙，在若晴面前對予辰示好效果打折，投票時予辰會挺女友。", friction: "偶爾鬧彆扭，但仍會站在彼此那邊。", tense: "開始在人前爭吵，誰都不讓誰。", cold: "群組裡互不回應，此時對予辰示好效果提高。", broken: "感情已經破裂，若晴可能會把帳算在妳頭上。" }[cs.k]}</p></div>`;
  },

  /* ---------- 卡牌收藏 ---------- */
  openCards(filter = "ALL") {
    const s = State.get(), meta = Save.meta();
    const inGame = !!s, coll = inGame ? s.deck.collection : [...new Set([...INITIAL_COLLECTION, ...(meta.collection || [])])];
    const deck = inGame ? s.deck.activeDeck : [];
    const list = CARDS.filter(c => filter === "ALL" || c.type === filter || c.rarity === filter);
    const html = `<div class="tabs">${[["ALL", "全部"], ["WHITE_LOTUS", "白蓮"], ["BACKSTAB", "背刺"], ["TEA_TALK", "茶語"], ["SPECIAL", "禁術"], ["SR", "SR"], ["SSR", "SSR"]].map(([k, n]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${n}</button>`).join("")}</div>
      ${inGame ? `<p style="margin:0 0 10px;font-size:calc(13px * var(--fs))">牌組 <b>${deck.length}</b> / ${CONFIG.deckMax}（至少 ${CONFIG.deckMin}）　卡牌碎片 <b>${s.player.cardFragments}</b>　金幣 <b>${s.player.gold}</b>　｜　綠框 = 在牌組中。點卡片查看詳情、升級、加入／移出牌組。</p>` : ""}
      <div class="grid-cards">${list.map(c => this.cardHTML(c.id, { cls: (deck.includes(c.id) ? "indeck " : "") + (coll.includes(c.id) ? "" : "locked") })).join("")}</div><div id="cardInfo" style="margin-top:12px"></div>`;
    const m = this.modal("卡牌收藏", html, {});
    $$("[data-f]", m).forEach(b => b.onclick = () => this.openCards(b.dataset.f));
    $$(".grid-cards .card", m).forEach(el => el.onclick = () => {
      const id = el.dataset.card, c = CARD_MAP[id], owned = coll.includes(id), lv = inGame ? Cards.level(id) : 1, nx = CONFIG.upgradeCost[lv + 1];
      $("#cardInfo", m).innerHTML = `<div class="box"><h4>${c.name}（${CARD_TYPES[c.type]}・${c.rarity}・Lv.${lv}）</h4><p style="margin:0">${c.desc}</p><p style="margin:4px 0;color:var(--crimson)">內心：${c.inner}</p>
        <p style="font-size:calc(12px * var(--fs));margin:0">標籤：${c.tags.map(t => TAG_NAMES[t]).join("、")}　心機消耗：${Cards.costOf ? (inGame ? Cards.costOf(id) : c.cost) : c.cost}　Lv.2 效果 +20%／Lv.3 效果 +40% 並解鎖特殊效果（白蓮卡額外 -5 懷疑，且每場戰鬥第一次使用時鑑茶警報 -2；其他卡心機消耗 -1）</p>
        ${!owned ? `<p style="color:var(--bad)">尚未取得${c.special ? "（需要天賦「雙面人生」）" : ""}</p>` : inGame ? `<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" id="tgl">${deck.includes(id) ? "移出牌組" : "加入牌組"}</button>${lv < 3 ? `<button class="btn sm primary" id="upg">升級至 Lv.${lv + 1}（碎片 ${nx.frag}・金幣 ${nx.gold}）</button>` : `<span class="chip">已滿級</span>`}</div>` : ""}</div>`;
      const t = $("#tgl", m); if (t) t.onclick = () => { Cards.toggleInDeck(id); this.openCards(filter); };
      const u = $("#upg", m); if (u) u.onclick = () => { if (Cards.upgradeCard(id)) { this.refresh(); this.openCards(filter); } };
    });
  },
