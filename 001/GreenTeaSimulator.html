<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>綠茶模擬器 Green Tea Simulator｜第一章・大學社團篇</title>
<meta name="description" content="以人際關係為戰場、以言語為武器、以純潔形象為偽裝的社交心理博弈遊戲。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='40' fill='%23f48fb1'/><path d='M50 15 q20 10 0 30 q-20 -20 0 -30' fill='%237cc48f'/></svg>">
<style>
/* ===== theme ===== */
:root{--fs:1;
  --pink:#f48fb1;--pink-d:#d9608f;--pink-l:#ffe3ee;--cream:#fff8f0;--lav:#d9c8f5;--lav-d:#8e6cc9;
  --ink:#4a3550;--ink-l:#8a7390;--card:#fffdfb;--line:#f1d6e3;--good:#3fae7a;--bad:#e0476b;--gold:#e8a93a;
  --dark:#140b16;--dark-2:#2a0f22;--crimson:#c2185b;--blood:#e53961;--violet:#5b2a86;
  --r:16px;--shadow:0 6px 24px rgba(180,90,140,.15);
  --sans:"Source Han Sans TC","Source Han Sans","思源黑體","思源黑体","Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:var(--sans);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--sans);font-feature-settings:"palt" 0;color:var(--ink);background:var(--cream);font-size:calc(15px * var(--fs));line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;background:radial-gradient(circle at 50% 50%,transparent 40%,rgba(80,0,40,.55));opacity:0;transition:opacity .35s}
body.flash::before{opacity:1}

/* ===== buttons ===== */
.btn{background:linear-gradient(180deg,#fff,#ffeef5);border:1.5px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:600;color:var(--pink-d);box-shadow:0 2px 0 #f3c6d9;transition:transform .12s,box-shadow .12s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 10px rgba(217,96,143,.25)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn.primary{background:linear-gradient(135deg,#f6a5c4,#d9608f);color:#fff;border-color:transparent;box-shadow:0 3px 0 #b84676}
.btn.dark{background:linear-gradient(135deg,#3b0f2c,#14060f);color:#ff9ec3;border-color:#6d1f48;box-shadow:0 3px 0 #000}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:5px 12px;font-size:calc(13px * var(--fs))}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:calc(12px * var(--fs));background:var(--pink-l);color:var(--pink-d);font-weight:600}
.chip.dark{background:#2b0d20;color:#ff8db5}
.chip.lav{background:#efe6ff;color:var(--lav-d)}

/* ===== title ===== */
#title{background:radial-gradient(ellipse at 30% 20%,#fff 0,#ffe3ee 40%,#e8dcff 100%);align-items:center;justify-content:center;overflow:hidden}
#title .petals span{position:absolute;top:-30px;width:14px;height:14px;background:radial-gradient(circle at 30% 30%,#fff,#f8b7cf);border-radius:70% 0 70% 0;animation:fall linear infinite;opacity:.8}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.title-wrap{position:relative;z-index:2;display:flex;align-items:center;gap:40px;max-width:1100px;padding:20px}
.title-hero{width:min(42vw,420px);filter:drop-shadow(0 20px 30px rgba(180,80,130,.3));animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-10px)}}
.logo{font-family:var(--serif);font-size:calc(clamp(40px,7vw,76px) * var(--fs));font-weight:900;letter-spacing:.08em;color:#fff;-webkit-text-stroke:2px var(--pink-d);text-shadow:4px 4px 0 #f6b7cf,8px 8px 0 rgba(142,108,201,.35);line-height:1.1}
.logo small{display:block;font-size:.3em;-webkit-text-stroke:0;color:var(--lav-d);letter-spacing:.4em;text-shadow:none;margin-top:6px}
.tagline{font-family:var(--serif);color:var(--ink-l);margin:14px 0 22px}
.tagline b{color:var(--crimson)}
.menu{display:flex;flex-direction:column;gap:10px;max-width:280px}
.menu .btn{text-align:left;padding:11px 22px}
.ver{position:absolute;bottom:10px;right:16px;font-size:calc(12px * var(--fs));color:var(--ink-l)}

/* ===== create ===== */
#create{background:linear-gradient(160deg,#fff4f8,#f1eaff);overflow:auto}
.create-box{max-width:960px;margin:auto;padding:24px;width:100%}
.create-box h2{font-family:var(--serif);color:var(--pink-d);margin:0 0 14px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field input{width:100%;max-width:320px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:calc(15px * var(--fs));background:#fff;color:var(--ink)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pick{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;transition:.15s}
.pick.on{border-color:var(--pink-d);box-shadow:0 0 0 4px rgba(244,143,177,.25);background:#fff7fa}
.pick h4{margin:0 0 4px;font-family:var(--serif);color:var(--pink-d)}
.pick p{margin:0;font-size:calc(13px * var(--fs));color:var(--ink-l)}
.pick .stats{margin-top:8px;font-size:calc(12px * var(--fs));display:flex;flex-wrap:wrap;gap:4px}

/* ===== game layout ===== */
#game{background:var(--cream)}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(90deg,#fff,#fff0f6 50%,#f4ecff);border-bottom:1.5px solid var(--line);flex-wrap:wrap;z-index:5}
.date{font-family:var(--serif);font-weight:800;color:var(--pink-d);white-space:nowrap}
.date small{font-family:var(--sans);font-weight:500;color:var(--ink-l);margin-left:6px}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.stat{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:calc(13px * var(--fs));white-space:nowrap}
.stat i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:calc(12px * var(--fs));color:#fff;font-weight:800}
.stat .bar{width:54px;height:6px;border-radius:9px;background:#f3e6ee;overflow:hidden}
.stat .bar b{display:block;height:100%;border-radius:9px}
.stat.alert i{background:var(--bad)} .stat.alert .bar b{background:linear-gradient(90deg,#ffb199,#e0476b)}
.stat.alert.hot{animation:pulse 1s infinite;border-color:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(224,71,107,.25)}}
.stat.aura i{background:linear-gradient(135deg,#ffd1e3,#c9a6ff)} .stat.aura .bar b{background:linear-gradient(90deg,#ffd1e3,#c9a6ff)}
.stat.sup i{background:var(--gold)} .stat.sup .bar b{background:var(--gold)}
.stat.scheme i{background:linear-gradient(135deg,#5b2a86,#14060f)}
.stat.energy i{background:#6cc3a0} .stat.gold i{background:#e8b84a}

.main{flex:1;display:grid;grid-template-columns:260px 1fr 300px;gap:12px;padding:12px;min-height:0}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;min-height:0}
.panel h3{margin:0;padding:10px 14px;font-family:var(--serif);font-size:calc(15px * var(--fs));color:var(--pink-d);border-bottom:1px dashed var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.npc-mini{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid #f7e9f0;align-items:center;cursor:pointer}
.npc-mini:hover{background:#fff5f9}
.ava{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;border:2px solid #fff;box-shadow:0 0 0 2px var(--c,#f48fb1);background:var(--c,#f48fb1)}
.ava img{width:100%;height:auto;object-position:top;transform:scale(1.9) translateY(18%)}
.npc-mini .nm{font-weight:700;font-size:calc(14px * var(--fs))}
.npc-mini .rl{font-size:calc(11px * var(--fs));color:var(--ink-l)}
.mini-bars{display:flex;gap:6px;font-size:calc(11px * var(--fs));margin-top:2px;color:var(--ink-l)}
.mini-bars span b{color:var(--ink)}
.susp{font-size:calc(11px * var(--fs));padding:0 6px;border-radius:6px;background:#f4eef6}
.susp.l2{background:#fff1d6;color:#a86a00}.susp.l3{background:#ffe0e6;color:var(--bad)}.susp.l4{background:var(--bad);color:#fff}

.scene{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:#eee;min-height:300px;display:flex;flex-direction:column}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:background .5s,filter .5s}
.scene .portrait{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:92%;max-width:70%;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.2));transition:opacity .3s}
.scene-info{position:relative;z-index:2;margin-top:auto;padding:14px;background:linear-gradient(transparent,rgba(255,248,252,.95) 30%)}
.brief{font-size:calc(14px * var(--fs))}
.brief .title{font-family:var(--serif);font-weight:800;color:var(--pink-d);font-size:calc(17px * var(--fs))}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.act{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;transition:.15s;min-height:62px}
.act:hover:not(:disabled){border-color:var(--pink);transform:translateY(-2px);box-shadow:0 6px 14px rgba(244,143,177,.25)}
.act b{display:block;font-size:calc(14px * var(--fs))}
.act small{font-size:calc(11px * var(--fs));color:var(--ink-l)}
.act.night{background:linear-gradient(135deg,#2b0d20,#140b16);color:#ff9ec3;border-color:#6d1f48}
.act.night small{color:#d78aa9}
.side-tabs{display:flex;gap:4px;padding:8px;border-bottom:1px dashed var(--line);position:sticky;top:0;background:var(--card);z-index:1;flex-wrap:wrap}
.side-tabs button{background:#fff3f8;border-radius:999px;padding:4px 10px;font-size:calc(12px * var(--fs));font-weight:700;color:var(--pink-d)}
.side-tabs button.on{background:var(--pink-d);color:#fff}
.quest{padding:10px 14px;font-size:calc(13px * var(--fs))}
.quest li{margin-bottom:6px}
.quest .done{color:var(--ink-l);text-decoration:line-through}
.log-item{padding:6px 14px;font-size:calc(12.5px * var(--fs));border-bottom:1px solid #f9eef3}
.log-item .d{color:var(--ink-l);font-size:calc(11px * var(--fs));margin-right:4px}
.log-item.bad{color:var(--bad)} .log-item.intel{color:var(--violet)} .log-item.good{color:var(--good)}

.bottom-nav{display:none}

/* ===== VN dialogue ===== */
#vn{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;background:#000}
#vn .bg{opacity:.95}
#vn .stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.vn-portrait{height:88vh;max-height:900px;max-width:90vw;object-fit:contain;filter:drop-shadow(0 12px 30px rgba(0,0,0,.35));transition:all .35s}
.vn-portrait.enter{animation:slideUp .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}}
.emote{position:absolute;top:16%;left:58%;font-family:var(--serif);font-size:calc(30px * var(--fs));font-weight:900;color:var(--bad);text-shadow:0 2px 0 #fff;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.ex-angry{animation:shake .4s;filter:drop-shadow(0 0 18px rgba(224,71,107,.6))!important}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ex-sad{filter:saturate(.6) brightness(.95) drop-shadow(0 10px 20px rgba(0,0,0,.3))!important;transform:translateY(8px)}
.ex-suspect{filter:drop-shadow(0 0 0 #000) contrast(1.05) saturate(.85)!important;transform:rotate(-1.5deg)}
.ex-shy{filter:drop-shadow(0 0 22px rgba(255,140,180,.75))!important}
.ex-smile{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-12px)}}
.ex-dark{filter:brightness(.55) saturate(1.3) drop-shadow(0 0 24px rgba(160,0,60,.9))!important}
.vn-box{position:relative;z-index:3;margin:0 auto 18px;width:min(980px,96vw);background:rgba(255,252,254,.95);border:2px solid #fff;border-radius:22px;box-shadow:0 0 0 3px var(--pink),0 18px 40px rgba(0,0,0,.25);padding:18px 24px 16px;min-height:150px}
.vn-name{position:absolute;top:-18px;left:24px;background:linear-gradient(135deg,var(--c,#f48fb1),#fff 220%);color:#fff;padding:4px 18px;border-radius:999px;font-family:var(--serif);font-weight:900;letter-spacing:.1em;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.vn-text{font-size:calc(17px * var(--fs));line-height:1.85;white-space:pre-wrap;min-height:60px}
.vn-notes{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.vn-next{position:absolute;right:20px;bottom:10px;font-size:calc(12px * var(--fs));color:var(--pink-d);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.vn-choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choice{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;font-size:calc(15px * var(--fs));transition:.15s}
.choice:hover:not(:disabled){border-color:var(--pink-d);background:#fff5f9;transform:translateX(4px)}
.choice .hint{display:block;font-size:calc(12px * var(--fs));color:var(--ink-l)}
.choice.inner{background:linear-gradient(90deg,#2b0d20,#3d1030);color:#ffd0e2;border-color:#7a1f50}
.choice.inner .hint{color:#ff8db5}
.choice:disabled .hint::before{content:"🔒 "}
/* inner (dark) mode */
.vn-box.inner{background:rgba(20,6,16,.94);color:#ffd6e6;box-shadow:0 0 0 3px var(--crimson),0 0 40px rgba(194,24,91,.5)}
.vn-box.inner .vn-name{background:linear-gradient(135deg,#7a0e3c,#2b0d20);color:#ff9ec3}
.vn-box.narr .vn-name{display:none}
.vn-box.narr{font-family:var(--serif)}
#vn.dark .bg{filter:brightness(.35) saturate(1.4) hue-rotate(-20deg)!important}
.vn-tools{position:absolute;top:12px;right:12px;z-index:4;display:flex;gap:6px}

/* ===== battle ===== */
#battle{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:#1a0c18;color:#fff}
#battle .bg{filter:brightness(.55) saturate(1.1)}
.b-head{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(90deg,rgba(40,8,30,.85),rgba(70,20,60,.6));gap:10px;flex-wrap:wrap}
.b-title{font-family:var(--serif);font-size:calc(20px * var(--fs));font-weight:900;letter-spacing:.08em;color:#ffc1d8}
.b-title small{font-family:var(--sans);font-size:calc(12px * var(--fs));color:#e7b9cf;margin-left:8px;letter-spacing:0}
.mood{flex:1;max-width:420px;min-width:180px}
.mood .lbl{display:flex;justify-content:space-between;font-size:calc(12px * var(--fs));color:#ffd6e6}
.mood .track{position:relative;height:14px;border-radius:9px;background:rgba(255,255,255,.15);overflow:visible}
.mood .fill{height:100%;border-radius:9px;background:linear-gradient(90deg,#ff9ec3,#f6d365);transition:width .4s}
.mood .goal{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff}
.b-body{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px;min-height:0}
.b-stage{display:flex;flex-direction:column;min-height:0}
.foes{display:flex;justify-content:center;gap:12px;flex:1;min-height:0;align-items:flex-end}
.foe{position:relative;flex:1;max-width:260px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-height:0;height:100%}
.foe img{width:100%;flex:1;min-height:0;object-fit:contain;object-position:bottom;transition:.3s}
.foe.tgt img{filter:drop-shadow(0 0 14px #ff6fa3)}
.foe.speaker::after{content:"發言中";position:absolute;top:4px;left:50%;transform:translateX(-50%);background:var(--crimson);font-size:calc(11px * var(--fs));padding:2px 8px;border-radius:999px}
.foe-card{width:100%;background:rgba(20,6,16,.85);border:1.5px solid #6d1f48;border-radius:12px;padding:6px 8px;font-size:calc(12px * var(--fs))}
.foe.tgt .foe-card{border-color:#ff6fa3;box-shadow:0 0 0 2px rgba(255,111,163,.4)}
.foe-card .n{font-weight:800;color:#ffc1d8;display:flex;justify-content:space-between}
.fbar{display:flex;align-items:center;gap:4px;margin-top:3px}
.fbar span{width:30px;color:#e9bcd0}
.fbar .t{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.fbar .t b{display:block;height:100%}
.intent{margin-top:8px;background:rgba(194,24,91,.25);border:1px solid #c2185b;border-radius:12px;padding:8px 12px;font-size:calc(13px * var(--fs))}
.intent b{color:#ffb3cf}
.b-side{display:flex;flex-direction:column;gap:8px;min-height:0}
.b-log{flex:1;overflow:auto;background:rgba(20,6,16,.8);border:1px solid #4d1838;border-radius:12px;padding:8px 10px;font-size:calc(13px * var(--fs));min-height:120px}
.b-log p{margin:0 0 6px}
.b-log .good{color:#8ff0bd}.b-log .bad{color:#ff8fa8}.b-log .warn{color:#ffd28a}.b-log .sys{color:#c8a8d8}.b-log .npc{color:#ffe0ee}.b-log .dark{color:#ff6fa3}.b-log .boss{color:#d8c2ff;font-family:var(--serif)}.b-log .phase{color:#fff;font-weight:900;text-align:center;letter-spacing:.2em}
.b-extra{display:flex;gap:6px;flex-wrap:wrap}
.hand{position:relative;z-index:3;display:flex;gap:10px;justify-content:center;padding:10px 12px 14px;background:linear-gradient(transparent,rgba(10,2,8,.9) 30%);overflow-x:auto}
.card{flex:none;width:150px;min-height:200px;border-radius:14px;padding:10px;background:linear-gradient(170deg,#fff,#ffe8f1);color:var(--ink);border:2px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.35);text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .15s,box-shadow .15s;position:relative}
.card:hover:not(:disabled),.card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px #ff6fa3,0 14px 24px rgba(0,0,0,.4)}
.card.BACKSTAB{background:linear-gradient(170deg,#fff,#efe3ff)}
.card.TEA_TALK{background:linear-gradient(170deg,#fff4e0,#ffd9e6)}
.card.SPECIAL{background:linear-gradient(170deg,#2b0d20,#5b1640);color:#ffd6e6;border-color:#ff6fa3}
.card .cn{font-family:var(--serif);font-weight:900;font-size:calc(15px * var(--fs));line-height:1.3}
.card .ct{display:flex;justify-content:space-between;font-size:calc(11px * var(--fs))}
.card .cost{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#5b2a86,#14060f);color:#ff9ec3;font-weight:900;display:grid;place-items:center;border:2px solid #fff;font-size:calc(13px * var(--fs))}
.card .tags{display:flex;flex-wrap:wrap;gap:3px}
.card .tags span{font-size:calc(10px * var(--fs));background:rgba(217,96,143,.15);color:var(--pink-d);padding:0 5px;border-radius:5px}
.card .tags span.hit{background:#3fae7a;color:#fff}.card .tags span.miss{background:#e0476b;color:#fff}
.card .fx{font-size:calc(11.5px * var(--fs));margin-top:auto;line-height:1.5}
.card .fx .up{color:var(--good)}.card .fx .dn{color:var(--bad)}
.card.SPECIAL .tags span{background:rgba(255,111,163,.2);color:#ff9ec3}
.card .lv{font-size:calc(10px * var(--fs));color:var(--gold);font-weight:900}
.card-detail{position:relative;z-index:3;margin:0 12px;background:rgba(20,6,16,.92);border:1px solid #7a1f50;border-radius:12px;padding:8px 12px;font-size:calc(13px * var(--fs));min-height:44px}
.inner-pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:90;background:linear-gradient(135deg,#14060f,#3d1030);color:#ffd0e2;border:2px solid var(--crimson);border-radius:16px;padding:12px 20px;font-family:var(--serif);font-size:calc(16px * var(--fs));box-shadow:0 0 40px rgba(194,24,91,.6);max-width:90vw;animation:innerIn .3s;pointer-events:none}
.inner-pop::before{content:"內心OS";display:block;font-size:calc(11px * var(--fs));letter-spacing:.3em;color:#ff6fa3;font-family:var(--sans)}
.inner-pop.lotus{background:linear-gradient(135deg,#fff,#ffe3ee);color:var(--ink);border-color:var(--pink)}
@keyframes innerIn{from{opacity:0;transform:translate(-50%,10px) scale(.95)}}
.boss-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.boss-opts .btn{font-size:calc(13px * var(--fs));padding:8px 10px;text-align:left;border-radius:12px}
.boss-opts .btn small{display:block;font-weight:400;font-size:calc(11px * var(--fs));opacity:.8}
.boss-acc{font-family:var(--serif);font-size:calc(18px * var(--fs));color:#e6d6ff;text-align:center;padding:10px;background:rgba(40,10,60,.7);border:1px solid #8e6cc9;border-radius:12px;margin-top:8px}
#battle.boss .bg{filter:brightness(.35) saturate(1.3) hue-rotate(-30deg)}
#battle.boss .b-title{color:#d8c2ff}

/* ===== modal ===== */
.modal{position:fixed;inset:0;z-index:70;background:rgba(60,20,50,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px}
.modal-box{background:var(--card);border-radius:20px;width:min(940px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(60,20,50,.4);border:2px solid #fff;overflow:hidden}
.modal-box.small{width:min(480px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:linear-gradient(90deg,#ffeaf2,#f3ebff);border-bottom:1.5px solid var(--line)}
.modal-head h2{margin:0;font-family:var(--serif);font-size:calc(19px * var(--fs));color:var(--pink-d)}
.modal-body{padding:16px 18px;overflow:auto}
.modal-foot{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal.dark .modal-box{background:#1a0a16;color:#ffd6e6;border-color:#5b1640}
.modal.dark .modal-head{background:linear-gradient(90deg,#2b0d20,#140b16);border-color:#5b1640}
.modal.dark .modal-head h2{color:#ff9ec3}
.close{background:none;font-size:calc(22px * var(--fs));color:var(--ink-l);width:36px;height:36px;border-radius:50%}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{padding:6px 14px;border-radius:999px;background:#fff3f8;color:var(--pink-d);font-weight:700;font-size:calc(13px * var(--fs))}
.tabs button.on{background:var(--pink-d);color:#fff}
.grid-cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.grid-cards .card{cursor:pointer}
.grid-cards .card.indeck{box-shadow:0 0 0 3px var(--good),0 6px 16px rgba(0,0,0,.2)}
.grid-cards .card.locked{filter:grayscale(1);opacity:.5}

.npc-detail{display:grid;grid-template-columns:220px 1fr;gap:16px}
.npc-detail img{width:100%;max-height:420px;object-fit:contain;background:linear-gradient(180deg,#fff0f6,#f0e8ff);border-radius:16px}
.npc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.npc-tabs button{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:calc(13px * var(--fs))}
.npc-tabs button.on{border-color:var(--pink-d);background:#fff3f8}
.npc-tabs .ava{width:28px;height:28px}
.meter{margin:6px 0}
.meter .l{display:flex;justify-content:space-between;font-size:calc(13px * var(--fs))}
.meter .t{height:9px;background:#f6e7ef;border-radius:9px;overflow:hidden}
.meter .t b{display:block;height:100%;border-radius:9px}
.mem-list,.intel-list{font-size:calc(13px * var(--fs));padding-left:18px;margin:4px 0}
.box{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.box h4{margin:0 0 6px;font-family:var(--serif);color:var(--pink-d);font-size:calc(15px * var(--fs))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:calc(13px * var(--fs))}

/* talents */
.tal-tree{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tal-col h4{text-align:center;font-family:var(--serif);margin:0 0 8px}
.tal{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;text-align:left;width:100%;position:relative}
.tal.on{border-color:var(--gold);background:#fffaf0}
.tal.on::after{content:"已習得";position:absolute;top:6px;right:8px;font-size:calc(11px * var(--fs));color:var(--gold);font-weight:900}
.tal b{font-family:var(--serif)}
.tal p{margin:2px 0 0;font-size:calc(12px * var(--fs));color:var(--ink-l)}

/* phone (social) */
.phone{width:min(420px,100%);margin:0 auto;background:#fff;border-radius:34px;border:10px solid #2b2230;box-shadow:0 20px 40px rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column;height:min(78vh,720px)}
.phone-top{background:linear-gradient(90deg,#ffd1e3,#e3d4ff);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--pink-d)}
.phone-tabs{display:flex;border-bottom:1px solid #f0dce6}
.phone-tabs button{flex:1;padding:8px;background:#fff;font-weight:700;font-size:calc(13px * var(--fs));color:var(--ink-l)}
.phone-tabs button.on{color:var(--pink-d);box-shadow:inset 0 -3px 0 var(--pink-d)}
.phone-body{flex:1;overflow:auto;background:#fdf7fa}
.post{background:#fff;margin:8px;border-radius:14px;padding:10px 12px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.post .who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(13px * var(--fs))}
.post .who .ava{width:32px;height:32px}
.post .txt{margin:8px 0;font-size:calc(14px * var(--fs))}
.post .meta{font-size:calc(12px * var(--fs));color:var(--ink-l);display:flex;gap:10px;flex-wrap:wrap}
.post .cm{font-size:calc(12.5px * var(--fs));margin-top:4px;padding:4px 8px;background:#fdf1f6;border-radius:8px}
.leaked{color:var(--bad);font-weight:800}
.dm-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #f4e6ec;cursor:pointer;background:#fff}
.bubble{max-width:80%;padding:7px 12px;border-radius:14px;margin:6px 10px;font-size:calc(13.5px * var(--fs))}
.bubble.me{margin-left:auto;background:var(--pink);color:#fff;border-bottom-right-radius:4px}
.bubble.them{background:#fff;border:1px solid #f0dce6;border-bottom-left-radius:4px}
.composer select,.composer textarea{width:100%;padding:8px;border-radius:10px;border:1.5px solid var(--line);font-family:inherit;font-size:calc(14px * var(--fs));margin-bottom:8px;background:#fff;color:var(--ink)}
.opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.opt-grid button{padding:8px 6px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-size:calc(13px * var(--fs));font-weight:600}
.opt-grid button.on{border-color:var(--pink-d);background:#fff3f8;color:var(--pink-d)}
.npc-pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.npc-pick button{display:flex;align-items:center;gap:4px;padding:3px 10px 3px 3px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:calc(12px * var(--fs));font-weight:700}
.npc-pick button.on{border-color:var(--pink-d);background:#ffe3ee}
.npc-pick .ava{width:24px;height:24px}

/* target picker / result */
.target-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.target{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.target:hover:not(:disabled){border-color:var(--pink-d)}
.target img{width:100%;height:120px;object-fit:cover;object-position:top;border-radius:10px;background:linear-gradient(#fff0f6,#efe6ff)}
.target b{display:block;font-size:calc(14px * var(--fs))}
.target small{font-size:calc(11px * var(--fs));color:var(--ink-l)}
.res-title{font-family:var(--serif);font-size:calc(34px * var(--fs));font-weight:900;text-align:center;letter-spacing:.15em;margin:6px 0}
.res-title.good{color:var(--pink-d)}.res-title.bad{color:var(--bad)}
.notes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.notes span{font-size:calc(12.5px * var(--fs));background:#fff3f8;color:var(--pink-d);padding:3px 10px;border-radius:999px;font-weight:600}
.modal.dark .notes span{background:#2b0d20;color:#ff9ec3}

/* toast */
#toasts{position:fixed;top:64px;right:14px;z-index:200;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--pink);padding:8px 14px;border-radius:12px;font-size:calc(13.5px * var(--fs));box-shadow:0 6px 16px rgba(0,0,0,.12);max-width:340px;animation:tin .25s}
.toast.bad{border-left-color:var(--bad)}.toast.gold{border-left-color:var(--gold)}
.toast.dark{background:#1a0a16;color:#ffd6e6;border-color:#5b1640;border-left-color:var(--crimson)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}}

/* ending */
#ending{position:fixed;inset:0;z-index:120;background:#000;color:#fff;overflow:auto}
#ending .cg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:.55}
.end-wrap{position:relative;max-width:760px;margin:0 auto;padding:8vh 22px 40px;text-align:center}
.end-sub{letter-spacing:.5em;font-size:calc(13px * var(--fs));color:#ffb3cf}
.end-name{font-family:var(--serif);font-size:calc(clamp(40px,8vw,72px) * var(--fs));font-weight:900;letter-spacing:.15em;text-shadow:0 0 30px rgba(255,111,163,.8)}
.end-text{font-family:var(--serif);font-size:calc(17px * var(--fs));line-height:2.1;white-space:pre-wrap;background:rgba(0,0,0,.45);padding:18px;border-radius:16px;text-align:left}
.end-epi{text-align:left;font-size:calc(14px * var(--fs));line-height:1.9;margin-top:12px;background:rgba(40,10,30,.6);padding:12px 16px;border-radius:12px}
.end-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:16px 0}
.end-stats div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px;font-size:calc(13px * var(--fs))}
.end-stats b{display:block;font-size:calc(20px * var(--fs));color:#ffc1d8}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gal .g{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;text-align:center;padding-bottom:8px}
.gal .g img{width:100%;height:200px;object-fit:cover;object-position:top;background:linear-gradient(#fff0f6,#efe6ff)}
.gal .g.lock img{filter:brightness(0) opacity(.25)}

/* ===== responsive ===== */
@media (max-width:1199px){
  .main{grid-template-columns:220px 1fr;}
  .main .right{display:none}
  .b-body{grid-template-columns:1fr 280px}
}
@media (max-width:767px){
  body{font-size:calc(14px * var(--fs))}
  .topbar{padding:6px 8px;gap:4px}
  .date{font-size:calc(14px * var(--fs));width:100%;display:flex;justify-content:space-between}
  .stats-row{justify-content:flex-start;gap:4px;flex-wrap:nowrap;overflow-x:auto}
  .stat{padding:2px 7px 2px 2px;font-size:calc(11.5px * var(--fs))}
  .stat .bar{display:none}
  .stat i{width:18px;height:18px;font-size:calc(10px * var(--fs))}
  .main{grid-template-columns:1fr;padding:6px;gap:6px;overflow:auto}
  .main .left{display:none}
  .scene{min-height:calc(100vh - 160px)}
  .scene .portrait{height:62%;max-width:90%}
  .actions{grid-template-columns:repeat(4,1fr);gap:5px}
  .act{min-height:54px;padding:6px 2px}
  .act b{font-size:calc(12.5px * var(--fs))}.act small{display:none}
  .bottom-nav{display:flex;border-top:1.5px solid var(--line);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
  .bottom-nav button{flex:1;padding:8px 0 6px;background:none;font-size:calc(11.5px * var(--fs));font-weight:700;color:var(--ink-l);display:flex;flex-direction:column;align-items:center;gap:2px}
  .bottom-nav button i{font-style:normal;font-size:calc(17px * var(--fs));font-family:var(--serif);color:var(--pink-d)}
  .title-wrap{flex-direction:column;gap:10px;text-align:center}
  .title-hero{width:56vw;max-height:40vh;object-fit:contain}
  .menu{margin:0 auto;width:100%}
  .vn-portrait{height:70vh}
  .vn-box{padding:16px 14px 14px;margin-bottom:8px;min-height:130px}
  .vn-text{font-size:calc(15px * var(--fs))}
  .b-body{grid-template-columns:1fr;padding:6px;gap:6px;overflow:auto}
  .foes{min-height:200px;max-height:34vh}
  .foe-card{font-size:calc(11px * var(--fs));padding:4px 6px}
  .b-log{max-height:22vh;min-height:90px}
  .hand{justify-content:flex-start;padding:8px;scroll-snap-type:x mandatory}
  .card{width:128px;min-height:172px;scroll-snap-align:start}
  .card .cn{font-size:calc(13.5px * var(--fs))}
  .npc-detail{grid-template-columns:1fr}
  .npc-detail img{max-height:240px}
  .tal-tree{grid-template-columns:1fr}
  .phone{border-width:6px;border-radius:24px;height:72vh}
  .boss-acc{font-size:calc(15px * var(--fs))}
  .modal{padding:0}
  .modal-box{max-height:100vh;height:100%;border-radius:0}
  .modal-box.small{height:auto;border-radius:20px;margin:12px}
  .b-title{font-size:calc(16px * var(--fs))}
}
#battle .btn.ghost{color:#e9bcd0;border-color:#6d1f48}
@media (max-width:767px){
  #battle .card{min-height:150px;width:122px}
  .b-log{max-height:16vh;min-height:70px}
  .intent small{display:none}
}
#toasts{top:64px;right:auto;left:50%;transform:translateX(-50%);align-items:center}
@media (max-width:767px){ .desk-nav{display:none!important} #toasts{top:auto;bottom:70px;width:92vw} .toast{max-width:92vw} }
@media (max-width:767px){ #battle:not(.hidden) ~ #toasts{top:56px;bottom:auto} }

.tablet-only{display:none}
@media (max-width:1199px){ .tablet-only{display:inline-block} }
@media (max-width:767px){ .bottom-nav button{font-size:calc(10.5px * var(--fs))} }
/* v1.0.2 版面修正 */
@media (max-width:1199px) and (min-width:768px){
  .topbar{flex-wrap:wrap}
  .stats-row{order:3;flex:1 1 100%;justify-content:flex-start}
  .desk-nav{margin-left:auto}
}
@media (max-width:767px){
  .foes{height:auto;max-height:none;min-height:0;align-items:flex-start}
  .foe{height:auto}
  .foe img{flex:none;height:20vh;width:100%}
}
.fbar span{width:auto;white-space:nowrap}
@media (max-width:767px){
  .b-body{display:flex;flex-direction:column}
  .b-stage,.b-side{min-height:auto;flex:none}
}

/* v1.1.0：表情立繪、內心 OS 頭像、審判證據 */
.real-ex.ex-suspect{transform:none;filter:drop-shadow(0 10px 20px rgba(0,0,0,.2))!important}
.real-ex.ex-angry{filter:drop-shadow(0 0 14px rgba(224,71,107,.45))!important}
.real-ex.ex-dark{filter:brightness(.75) saturate(1.2) drop-shadow(0 0 24px rgba(160,0,60,.8))!important}
.inner-pop{display:flex;align-items:center;gap:12px}
.inner-pop .inner-ava{width:64px;height:64px;object-fit:cover;object-position:top;border-radius:50%;border:2px solid var(--crimson);background:#2b0d20;flex:none}
.boss-acc .evidence{margin-top:8px;font-family:var(--sans);font-size:calc(13px * var(--fs));color:#ffb3cf;background:rgba(120,10,50,.35);border-radius:8px;padding:6px 10px;text-align:left}
.inner-pop{padding-top:22px}.inner-pop::before{position:absolute;top:5px;left:20px}
#battle.boss .foe img{visibility:hidden;flex:1}

/* ===== v1.1.2 主選單 ===== */
#title{background:#2a1530;display:block;overflow:hidden}
#title .t-bg{position:absolute;inset:0;background:url('assets/title_bg.jpg') center/cover no-repeat,url('assets/bg_clubroom.jpg') center/cover no-repeat;filter:saturate(1.05)}
#title.has-kv .t-hero{display:none}
#title:not(.has-kv) .t-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,220,235,.35),rgba(60,20,70,.15) 55%,rgba(40,10,50,.55))}
#title .t-bg::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 45%,rgba(40,12,48,.45) 70%,rgba(30,8,38,.65));z-index:1}
.t-hero{position:absolute;left:14%;bottom:0;height:96%;max-width:46vw;object-fit:contain;object-position:bottom;filter:drop-shadow(0 20px 40px rgba(120,40,90,.45));animation:floaty 6s ease-in-out infinite;z-index:2}
.t-polaroids{position:absolute;inset:0;pointer-events:none;z-index:3}
.t-pol{position:absolute;width:clamp(96px,10.5vw,170px);background:#fff;padding:7px 7px 22px;box-shadow:0 8px 22px rgba(0,0,0,.35);border-radius:3px;pointer-events:auto;transition:transform .25s;cursor:pointer}
.t-pol:hover{transform:rotate(0deg) scale(1.08)!important;z-index:5}
.t-pol .ph{aspect-ratio:1/1;overflow:hidden;background:#f3e6f0}
.t-pol img{width:100%;height:auto;transform:scale(1.9) translateY(19%)}
.t-pol span{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:calc(11px * var(--fs));color:#8a5a7a;font-weight:700}
.t-pol::before{content:"";position:absolute;top:-9px;left:50%;width:44px;height:16px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,190,215,.75)}
.t-note{position:absolute;left:2.5%;bottom:13%;z-index:4;width:clamp(170px,15vw,230px);background:#fff8e6;padding:12px 14px;transform:rotate(-4deg);box-shadow:0 8px 20px rgba(0,0,0,.3);font-size:calc(13.5px * var(--fs));color:#5a3a4a}
.t-note b{font-size:calc(16px * var(--fs));color:#c2446f}
.t-note ul{list-style:none;padding:0;margin:6px 0 0}
.t-note li{margin:4px 0;padding-left:20px;position:relative}
.t-note li::before{content:"☑";position:absolute;left:0;color:#c2446f}
.t-note u{text-decoration-color:#e86a92;text-decoration-thickness:2px}
.t-ver{position:absolute;top:12px;left:16px;z-index:5;color:#fff;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5);font-size:calc(14px * var(--fs))}
.t-top{position:absolute;top:12px;right:16px;z-index:6;display:flex;gap:8px}
.t-icon,.t-pill{background:rgba(30,10,36,.55);border:1px solid rgba(255,220,240,.6);color:#fff;border-radius:999px;height:36px;padding:0 14px;font-weight:700;backdrop-filter:blur(4px)}
.t-icon{width:36px;padding:0}
.t-icon.off{opacity:.45;text-decoration:line-through}
.t-side{position:absolute;right:4%;top:7%;bottom:15%;width:min(42vw,560px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:2.2vh}
.t-logo{position:relative;text-align:center;width:100%}
.t-logo img{max-width:100%;max-height:26vh;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}
.t-logo.has-img .t-logo-text,.t-logo.has-img .t-ribbon{display:none}
.t-logo-text{font-family:var(--serif);font-weight:900;font-size:calc(clamp(42px,6vw,88px) * var(--fs));line-height:1.05;color:#fff;letter-spacing:.06em;-webkit-text-stroke:2px #c2446f;text-shadow:0 0 18px rgba(255,150,200,.8),4px 4px 0 #8e3c6a}
.t-logo-text span{display:block;font-family:"Brush Script MT","Segoe Script",cursive;font-weight:400;font-size:.38em;-webkit-text-stroke:0;color:#ffe3f0;letter-spacing:.04em;text-shadow:0 2px 8px rgba(194,68,111,.9)}
.t-ribbon{display:inline-block;margin-top:6px;padding:4px 30px;background:linear-gradient(180deg,#fff4e6,#f6d8c6);color:#6b2f4f;font-family:var(--serif);font-weight:900;font-size:calc(clamp(16px,1.7vw,24px) * var(--fs));clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);box-shadow:0 3px 8px rgba(0,0,0,.25)}
.t-menu{display:flex;flex-direction:column;align-items:center;gap:1.3vh;width:100%}

/* ============================================================
 * 核心：工具、EventBus、StateManager、StatusManager、SaveManager
 * ============================================================ */
const Utils = {
  clamp(v, min, max) { v = Number(v); if (!Number.isFinite(v)) v = min; return Math.max(min, Math.min(max, v)); },
  round(v) { return Math.round(Number(v) || 0); },
  // 可設定種子的亂數（mulberry32）；狀態存在存檔裡，讀檔後亂數序列可延續、測試可重現
  random() {
    const s = State.get(); if (!s || typeof s.meta.rng !== "number") return Math.random();
    let t = (s.meta.rng = (s.meta.rng + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  },
  rand(n) { return Math.floor(Utils.random() * n); },
  pick(arr) { return arr[Math.floor(Utils.random() * arr.length)]; },
  chance(p) { return Utils.random() < p; },
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Utils.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  weighted(list) { const tot = list.reduce((s, x) => s + (x.w ?? 1), 0); let r = Utils.random() * tot; for (const x of list) { r -= (x.w ?? 1); if (r <= 0) return x; } return list[list.length - 1]; },
  deepClone(o) { return JSON.parse(JSON.stringify(o)); },
  deepMerge(base, over) {
    if (Array.isArray(base)) return Array.isArray(over) ? over : base;
    if (base && typeof base === "object") {
      const out = { ...base };
      if (over && typeof over === "object" && !Array.isArray(over)) {
        for (const k of Object.keys(over)) out[k] = (k in base) ? Utils.deepMerge(base[k], over[k]) : over[k];
      }
      return out;
    }
    return over === undefined || over === null ? base : over;
  },
  esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); },
  fmt(t) { const s = State.get(); return String(t || "").replace(/\{name\}/g, s ? s.player.name : "小茶"); }
};

const EventBus = {
  map: {},
  on(evt, fn) { (this.map[evt] = this.map[evt] || []).push(fn); },
  emit(evt, data) { (this.map[evt] || []).forEach(fn => { try { fn(data); } catch (e) { console.error("[EventBus]", evt, e); } }); }
};

/* ---------- StateManager ---------- */
function createDefaultState() {
  const npcRelations = {}, npcMemories = {}, relationships = {};
  NPC_IDS.forEach(id => {
    npcRelations[id] = { ...NPCS[id].initialRelationship, exposed: false, lastChatDay: 0, giftWeek: 0, dmDay: 0 };
    npcMemories[id] = [];
    relationships[id] = { ...RELATIONSHIPS[id] };
  });
  return {
    meta: { schemaVersion: CONFIG.schemaVersion, gameVersion: CONFIG.gameVersion, createdAt: new Date().toISOString(), updatedAt: null, ngPlus: 0, seed: 0, rng: 0 },
    player: { name: "小茶", nickname: "", persona: "good_newcomer", direction: "lotus", level: 1, exp: 0, energy: 100, gold: 500, schemePoints: 3, talentPoints: 0, cardFragments: 0, items: {} },
    calendar: { day: 1, week: 1, weekday: 1, remainingActions: CONFIG.actionsPerDay, weather: "晴", dmCount: 0, randomRolled: false, suspicious: false, publicIncident: false, npcEvidence: false },
    status: { pureAura: 70, globalSuspicion: 0, clubSupport: 0, clubReputation: 0, socialInfluence: 0 },
    npcRelations, npcMemories, relationships,
    deck: { collection: INITIAL_COLLECTION.slice(), activeDeck: INITIAL_DECK.slice(), cardLevels: {} },
    social: { posts: [], messages: [], followers: [], nextId: 1 },
    talents: { unlocked: [], selected: [] },
    intel: {},
    story: { currentChapter: "university", currentNode: null, flags: {}, choices: [], completedEvents: [], shurabaLog: {}, hiddenGoals: [], randomLog: {}, romance: [], mediateDay: 0, randomMajorWeek: 0 },
    weekly: { week: 1, freeChat: 0, clubBonusUsed: false },
    log: [],
    achievements: { unlocked: [], progress: {} },
    statistics: { cardsPlayed: 0, schemeUsed: 0, totalSuspicionGenerated: 0, successfulBattles: 0, failedBattles: 0, endingsUnlocked: [], tagCounts: {}, cleanStreak: 0, recentTags: [] },
    ending: null,
    gameOver: false
  };
}

const State = {
  _s: null,
  get() { return this._s; },
  set(s) { this._s = s; },
  getPath(path) { return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), this._s); },
  setState(path, value) {
    const keys = path.split("."); let o = this._s;
    for (let i = 0; i < keys.length - 1; i++) { if (o[keys[i]] == null) o[keys[i]] = {}; o = o[keys[i]]; }
    o[keys[keys.length - 1]] = value;
    EventBus.emit("state:changed", path);
  },
  updateState(path, amount) { const cur = Number(this.getPath(path)) || 0; this.setState(path, cur + amount); },
  resetState() { this._s = createDefaultState(); },
  validateState() {
    // 遷移/補齊欄位，避免缺欄崩潰
    this._s = Utils.deepMerge(createDefaultState(), this._s || {});
    const s = this._s;
    NPC_IDS.forEach(id => {
      if (!s.npcRelations[id]) s.npcRelations[id] = { ...NPCS[id].initialRelationship };
      if (!Array.isArray(s.npcMemories[id])) s.npcMemories[id] = [];
      if (!s.relationships[id]) s.relationships[id] = { ...RELATIONSHIPS[id] };
    });
    s.deck.collection = s.deck.collection.filter(id => CARD_MAP[id]);
    s.deck.activeDeck = s.deck.activeDeck.filter(id => CARD_MAP[id] && s.deck.collection.includes(id));
    if (s.deck.activeDeck.length < CONFIG.deckMin) s.deck.activeDeck = INITIAL_DECK.slice();
    Status.clampAllStats();
    return true;
  }
};

/* ---------- StatusManager：所有數值更新必經此處 ---------- */
const Status = {
  getStatus() { return State.get().status; },
  rel(id) { return State.get().npcRelations[id]; },
  _npcStat(id, key, amount, min = 0, max = 100) {
    const r = this.rel(id); if (!r) { console.warn("NPC 資料缺失", id); return 0; }
    const before = r[key];
    // 邊際遞減：好感／信任越高越難再往上推
    if (amount > 0 && (key === "favor" || key === "trust")) amount = Math.max(1, amount * Math.max(0.1, 1 - before / 110));
    r[key] = Utils.clamp(Utils.round(before + amount), min, max);
    const d = r[key] - before;
    if (d) EventBus.emit("stat:npc", { id, key, d, value: r[key] });
    return d;
  },
  addFavor(id, n) { if (n > 0 && this.rel(id)) this.rel(id).lastChatDay = State.get().calendar.day; return this._npcStat(id, "favor", n); },
  addTrust(id, n) { return this._npcStat(id, "trust", n); },
  addSuspicion(id, n) {
    const d = this._npcStat(id, "suspicion", n);
    if (d > 0) State.get().statistics.totalSuspicionGenerated += d;
    return d;
  },
  addEmotion(id, n) { return this._npcStat(id, "emotion", n, -100, 100); },
  addGlobalSuspicion(n) {
    const s = State.get().status, b = s.globalSuspicion;
    s.globalSuspicion = Utils.clamp(Utils.round(b + n), 0, 100);
    const d = s.globalSuspicion - b;
    if (d > 0) State.get().calendar.suspicious = true; // 今天做了可疑的事 → 晚上不會自然平息
    if (d) EventBus.emit("stat:global", { d, value: s.globalSuspicion });
    if (s.globalSuspicion >= 100) EventBus.emit("game:exposed");
    return d;
  },
  _g(key, n) { const s = State.get().status, b = s[key]; if (n > 0 && key === "pureAura") n = Math.max(1, n * Math.max(0.15, 1 - b / 110)); s[key] = Utils.clamp(Utils.round(b + n), 0, 100); const d = s[key] - b; if (d) EventBus.emit("stat:status", { key, d }); return d; },
  addPureAura(n) { return this._g("pureAura", n); },
  addClubSupport(n) { return this._g("clubSupport", n); },
  addReputation(n) { if (n > 0 && Talents.has("t_social1")) n = n * 1.1; return this._g("clubReputation", n); },
  addInfluence(n) { return this._g("socialInfluence", n); },
  addSchemePoints(n) { const p = State.get().player, b = p.schemePoints; p.schemePoints = Utils.clamp(Utils.round(b + n), 0, CONFIG.maxScheme); return p.schemePoints - b; },
  addEnergy(n) { const p = State.get().player, b = p.energy; p.energy = Utils.clamp(Utils.round(b + n), 0, CONFIG.maxEnergy); return p.energy - b; },
  addRelation(a, b, n) {
    const r = State.get().relationships; if (!r[a] || r[a][b] == null) return 0;
    const before = r[a][b]; r[a][b] = Utils.clamp(Utils.round(before + n), 0, 100);
    if (n < 0 && r[a][b] < before) Achievements.unlock("a_manip");
    return r[a][b] - before;
  },
  clampAllStats() {
    const s = State.get();
    ["pureAura", "globalSuspicion", "clubSupport", "clubReputation", "socialInfluence"].forEach(k => s.status[k] = Utils.clamp(s.status[k], 0, 100));
    NPC_IDS.forEach(id => { const r = s.npcRelations[id];
      ["favor", "trust", "suspicion"].forEach(k => r[k] = Utils.clamp(r[k], 0, 100));
      r.emotion = Utils.clamp(r.emotion, -100, 100); });
    s.player.energy = Utils.clamp(s.player.energy, 0, CONFIG.maxEnergy);
    s.player.schemePoints = Utils.clamp(s.player.schemePoints, 0, CONFIG.maxScheme);
    s.player.gold = Math.max(0, Utils.round(s.player.gold));
    s.player.cardFragments = Math.max(0, Utils.round(s.player.cardFragments));
    s.player.talentPoints = Math.max(0, Utils.round(s.player.talentPoints));
  },
  suspicionLabel(v) { return v >= 80 ? "高度警戒" : v >= 60 ? "明顯起疑" : v >= 35 ? "有點在意" : v >= 15 ? "略感違和" : "毫無察覺"; },
  emotionLabel(v) { return v <= -61 ? "極度不滿" : v <= -21 ? "不高興" : v <= 20 ? "平靜" : v <= 60 ? "愉快" : "非常開心"; },
  emotionExpr(id) { const r = this.rel(id); if (r.suspicion >= 70) return "suspect"; if (r.emotion <= -40) return "angry"; if (r.emotion <= -21) return "sad"; if (r.emotion >= 41) return "smile"; return "normal"; }
};

/* ---------- 效果與條件（劇情、事件共用） ---------- */
const Effects = {
  apply(list, ctx = {}) {
    if (!Array.isArray(list)) return [];
    const notes = [];
    for (const e of list) {
      const [op, a, b, c] = e;
      try {
        switch (op) {
          case "favor": notes.push(this._n(NPCS[a].name + " 好感", Status.addFavor(a, b))); break;
          case "trust": notes.push(this._n(NPCS[a].name + " 信任", Status.addTrust(a, b))); break;
          case "sus": notes.push(this._n(NPCS[a].name + " 懷疑", Status.addSuspicion(a, b), true)); break;
          case "emo": Status.addEmotion(a, b); break;
          case "global": notes.push(this._n("鑑茶警報", Status.addGlobalSuspicion(a), true)); break;
          case "aura": notes.push(this._n("純潔氣場", Status.addPureAura(a))); break;
          case "support": notes.push(this._n("社團支持", Status.addClubSupport(a))); break;
          case "rep": notes.push(this._n("社團聲望", Status.addReputation(a))); break;
          case "infl": notes.push(this._n("社群影響力", Status.addInfluence(a))); break;
          case "scheme": notes.push(this._n("心機點數", Status.addSchemePoints(a))); break;
          case "energy": notes.push(this._n("精力", Status.addEnergy(a))); break;
          case "gold": Economy.addGold(a); notes.push(this._n("金幣", a)); break;
          case "frag": Economy.addCardFragment(a); notes.push(this._n("卡牌碎片", a)); break;
          case "tp": State.get().player.talentPoints += a; notes.push(this._n("天賦點", a)); break;
          case "flag": Story.setFlag(a, b === undefined ? true : b); break;
          case "unflag": delete State.get().story.flags[a]; break;
          case "mem": Memory.addMemory(a, { type: b, major: !!c }); break; // 來源與細節由 Memory.ctx 自動帶入
          case "rel": { const d = Status.addRelation(a, b, c); Status.addRelation(b, a, Math.round(c * 0.6)); if (d) notes.push(`${NPCS[a].name}→${NPCS[b].name} 關係 ${d > 0 ? "+" : ""}${d}`); break; }
          case "intel": if (Intel.gain(a)) notes.push("獲得情報：" + INTEL[a].name); break;
          case "achieve": Achievements.unlock(a); break;
          default: console.warn("未知效果", op);
        }
      } catch (err) { console.error("效果執行失敗", e, err); }
    }
    return notes.filter(Boolean);
  },
  _n(label, d, bad) { if (!d) return ""; return `${label} ${d > 0 ? "+" : ""}${d}`; },
  check(cond) {
    if (!cond) return true;
    const s = State.get(), f = s.story.flags;
    if (cond.flags && !cond.flags.every(x => f[x])) return false;
    if (cond.notFlags && cond.notFlags.some(x => f[x])) return false;
    if (cond.intel && !s.intel[cond.intel]) return false;
    const cmp = (obj, key, ge) => !obj || Object.entries(obj).every(([id, v]) => ge ? s.npcRelations[id][key] >= v : s.npcRelations[id][key] <= v);
    if (!cmp(cond.minFavor, "favor", true)) return false;
    if (!cmp(cond.minTrust, "trust", true)) return false;
    if (!cmp(cond.minSus, "suspicion", true)) return false;
    if (!cmp(cond.maxSus, "suspicion", false)) return false;
    if (cond.minAura != null && s.status.pureAura < cond.minAura) return false;
    if (cond.maxGlobal != null && s.status.globalSuspicion > cond.maxGlobal) return false;
    if (cond.minScheme != null && s.player.schemePoints < cond.minScheme) return false;
    if (cond.minSupport != null && s.status.clubSupport < cond.minSupport) return false;
    if (cond.minGold != null && s.player.gold < cond.minGold) return false;
    if (cond.minDay != null && s.calendar.day < cond.minDay) return false;
    if (cond.coupleMin != null && Relations.couple() < cond.coupleMin) return false;
    if (cond.coupleMax != null && Relations.couple() > cond.coupleMax) return false;
    return true;
  }
};

/* ---------- SaveManager ---------- */
const Save = {
  keyOf(slot) { return slot === "auto" ? CONFIG.autoSaveKey : slot === "prev" ? CONFIG.autoSaveKey + "_prev" : slot === "checkpoint" ? CONFIG.checkpointKey : CONFIG.slotKeys[slot]; },
  _write(key, data) {
    try { localStorage.setItem(key, JSON.stringify(data)); return true; }
    catch (e) { console.error("存檔失敗", e); UI.toast("存檔失敗：瀏覽器儲存空間不足或被停用", "bad"); return false; }
  },
  _read(key) {
    try { const raw = localStorage.getItem(key); if (!raw) return null; return JSON.parse(raw); }
    catch (e) { console.error("讀檔失敗", e); return null; }
  },
  pack() {
    const s = State.get(); s.meta.updatedAt = new Date().toISOString(); s.meta.gameVersion = CONFIG.gameVersion;
    return { schemaVersion: CONFIG.schemaVersion, gameVersion: CONFIG.gameVersion, savedAt: new Date().toISOString(), payload: Utils.deepClone(s) };
  },
  // 逐欄檢查型態；回傳錯誤清單（空陣列代表通過）
  deepValidate(p) {
    const errs = [];
    const num = (v, path) => { if (typeof v !== "number" || !Number.isFinite(v)) errs.push(path); };
    const obj = (v, path) => { if (!v || typeof v !== "object" || Array.isArray(v)) { errs.push(path); return false; } return true; };
    const arr = (v, path) => { if (!Array.isArray(v)) errs.push(path); };
    if (!obj(p, "payload")) return errs;
    if (obj(p.player, "player")) {
      ["energy", "gold", "schemePoints"].forEach(k => num(p.player[k], "player." + k));
      if (typeof p.player.name !== "string") errs.push("player.name");
      if (!PERSONAS[p.player.persona]) errs.push("player.persona");
    }
    if (obj(p.calendar, "calendar")) { num(p.calendar.day, "calendar.day"); if (p.calendar.day < 1 || p.calendar.day > CONFIG.totalDays) errs.push("calendar.day（超出範圍）"); }
    if (obj(p.status, "status")) ["pureAura", "globalSuspicion", "clubSupport"].forEach(k => num(p.status[k], "status." + k));
    if (obj(p.npcRelations, "npcRelations")) NPC_IDS.forEach(id => { const r = p.npcRelations[id]; if (obj(r, "npcRelations." + id)) ["favor", "trust", "suspicion", "emotion"].forEach(k => num(r[k], `npcRelations.${id}.${k}`)); });
    if (p.npcMemories !== undefined && obj(p.npcMemories, "npcMemories")) NPC_IDS.forEach(id => { if (p.npcMemories[id] !== undefined) arr(p.npcMemories[id], "npcMemories." + id); });
    if (p.relationships !== undefined && obj(p.relationships, "relationships")) NPC_IDS.forEach(id => { if (p.relationships[id] !== undefined) obj(p.relationships[id], "relationships." + id); });
    if (obj(p.deck, "deck")) { arr(p.deck.collection, "deck.collection"); arr(p.deck.activeDeck, "deck.activeDeck"); }
    if (obj(p.story, "story")) { obj(p.story.flags, "story.flags"); arr(p.story.completedEvents, "story.completedEvents"); }
    if (p.social !== undefined && obj(p.social, "social")) arr(p.social.posts, "social.posts");
    if (p.intel !== undefined) obj(p.intel, "intel");
    // 陣列內容：記憶、貼文、牌組
    if (p.npcMemories && typeof p.npcMemories === "object") NPC_IDS.forEach(id => (Array.isArray(p.npcMemories[id]) ? p.npcMemories[id] : []).forEach((m, i) => { if (!m || typeof m !== "object" || typeof m.type !== "string" || typeof m.day !== "number") errs.push(`npcMemories.${id}[${i}]`); }));
    if (p.social && Array.isArray(p.social.posts)) p.social.posts.forEach((x, i) => { if (!x || !POST_TYPES[x.type] || !Array.isArray(x.viewers || [])) errs.push(`social.posts[${i}]`); });
    if (p.deck && Array.isArray(p.deck.activeDeck) && p.deck.activeDeck.some(x => typeof x !== "string")) errs.push("deck.activeDeck（內容）");
    return errs;
  },
  validate(data) {
    if (!(data && typeof data === "object" && typeof data.schemaVersion === "number" && data.payload)) return false;
    if (data.schemaVersion > CONFIG.schemaVersion) return false; // 來自更新版本的存檔
    return this.deepValidate(data.payload).length === 0;
  },
  saveGame(slotId) {
    if (!State.get() || Battle.active) { UI.toast("戰鬥或劇情中無法存檔", "bad"); return false; }
    const data = this.pack();
    if (!this.validate(data)) { UI.toast("存檔資料異常，已取消以免覆蓋", "bad"); return false; }
    const key = this.keyOf(slotId);
    // 自動存檔覆蓋前，先把上一份成功的存檔留作備份
    if (slotId === "auto") { const old = this._read(key); if (old && this.validate(old)) this._write(this.keyOf("prev"), old); }
    return this._write(key, data);
  },
  loadGame(slotId) {
    const data = this._read(this.keyOf(slotId));
    if (!data) { UI.toast("存檔不存在或已損壞", "bad"); return false; }
    return this.applyData(data);
  },
  applyData(data) {
    if (!data || typeof data !== "object" || !data.payload) { UI.toast("存檔格式錯誤", "bad"); return false; }
    if (typeof data.schemaVersion === "number" && data.schemaVersion > CONFIG.schemaVersion) { UI.toast("這是較新版本的存檔，目前版本無法讀取", "bad"); return false; }
    const errs = this.deepValidate(data.payload);
    if (errs.length) { UI.toast("存檔內容不完整或已損壞（" + errs.slice(0, 3).join("、") + "），已保留目前進度", "bad"); return false; }
    const prev = State.get();
    try {
      const migrated = this.migrateSave(Utils.deepClone(data));
      State.set(migrated.payload); State.validateState();
      // 試跑主要系統，任何例外都視為壞檔並還原
      Status.clampAllStats(); Ending.calculateEndingScore(); Events.checkEventConditions(); Cards.validateDeck();
      return true;
    } catch (e) {
      console.error("讀檔試跑失敗", e); State.set(prev);
      UI.toast("存檔無法載入，已保留目前進度", "bad"); return false;
    }
  },
  deleteSave(slotId) { try { localStorage.removeItem(this.keyOf(slotId)); } catch (e) { } },
  autoSave() { if (State.get() && !State.get().gameOver) this.saveGame("auto"); },
  checkpoint() { const d = this.pack(); if (this.validate(d)) this._write(CONFIG.checkpointKey, d); },
  info(slotId) {
    const d = this._read(this.keyOf(slotId)); if (!d || !d.payload || this.deepValidate(d.payload).length) return null;
    const p = d.payload; return { name: p.player.name, day: p.calendar.day, week: Math.min(6, Math.floor((p.calendar.day - 1) / 7) + 1), savedAt: d.savedAt, persona: PERSONAS[p.player.persona]?.name || "", ver: d.gameVersion || "" };
  },
  exportSave() {
    if (!State.get()) { UI.toast("目前沒有進行中的遊戲", "bad"); return; }
    const blob = new Blob([JSON.stringify(this.pack(), null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `green-tea-save-day${State.get().calendar.day}.json`; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    UI.toast("已匯出存檔備份");
  },
  importSave(file, cb) {
    const reader = new FileReader();
    reader.onload = () => {
      let data; try { data = JSON.parse(reader.result); } catch (e) { UI.toast("JSON 解析錯誤，匯入失敗（目前進度未受影響）", "bad"); cb && cb(false); return; }
      if (this.applyData(data)) { UI.toast("匯入成功"); cb && cb(true); } else cb && cb(false);
    };
    reader.onerror = () => UI.toast("檔案讀取失敗", "bad");
    reader.readAsText(file);
  },
  migrateSave(data) {
    // schemaVersion 1：v1.0.0～v1.0.2 共用。缺少的新欄位（rng、randomLog、dmCount…）由 validateState 以預設值補齊
    if (data.payload.meta && typeof data.payload.meta.rng !== "number") { data.payload.meta.seed = (Date.now() & 0x7fffffff); data.payload.meta.rng = data.payload.meta.seed; }
    // v1.1.1：舊記憶補上分層與知情欄位
    const mem = data.payload.npcMemories || {};
    Object.values(mem).forEach(list => Array.isArray(list) && list.forEach(m => { if (m && m.evidence === undefined) { m.evidence = ["lied", "manipulated", "sus_post", "public_weak"].includes(m.type) && !!(m.label || m.detail); m.how = m.how || "witness"; m.cred = m.cred ?? 100; m.origin = m.origin || m.id; } }));
    data.schemaVersion = CONFIG.schemaVersion;
    return data;
  },
  // 跨周目資料（NG+、圖鑑、成就）與本周目存檔分開存放
  meta() { const m = this._read(CONFIG.metaKey); return Object.assign({ endings: [], achievements: [], cardLevels: {}, collection: [], clears: 0 }, m && typeof m === "object" ? m : {}); },
  saveMeta(m) { this._write(CONFIG.metaKey, m); },
  settings() { return Object.assign({ sound: true, fontScale: "normal" }, this._read(CONFIG.settingsKey) || {}); },

/* ---------- 音效（Web Audio 合成，無外部檔案；失敗不影響遊戲） ---------- */
const Sfx = {
  ctx: null,
  play(kind) {
    try {
      if (!Save.settings().sound) return;
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx, now = c.currentTime;
      const seq = {
        chime: [[880, 0, .12], [1320, .08, .18]], card: [[660, 0, .06], [990, .04, .08]],
        good: [[784, 0, .1], [988, .08, .1], [1175, .16, .16]], bad: [[220, 0, .2], [180, .12, .25]],
        evil: [[392, 0, .09], [349, .09, .09], [311, .18, .09], [262, .27, .22]], click: [[1200, 0, .03]]
      }[kind] || [[600, 0, .05]];
      seq.forEach(([f, t, d]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = kind === "evil" || kind === "bad" ? "sawtooth" : "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now + t); g.gain.exponentialRampToValueAtTime(0.08, now + t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now + t + d);
        o.connect(g).connect(c.destination); o.start(now + t); o.stop(now + t + d + 0.02);
      });
    } catch (e) { /* 音效失敗忽略 */ }
  }
};

const STORY_LABELS = {

  gala: "迎新晚會", judgment: "評選會議", chen_help: "器材室", lin_worry: "中庭談心", xu_trust: "茶水間的秘密", gu_tea: "社長的茶會",
  shen_confront: "走廊對峙", gu_investigate: "社辦", chen_hope: "便利商店", couple_fight: "走廊上的爭吵", couple_cold: "沉默的群組",
  couple_breakup: "分手的那晚", couple_makeup: "和好之後",
  r_store: "便利商店", r_library: "圖書館", r_gossip: "中庭閒聊", r_rain: "下雨天", r_spill: "社辦打翻飲料那次", r_notes: "借筆記那次",
  r_anon: "匿名私訊", r_scholar: "那天", r_blackout: "停電那晚", r_audit: "社長抽查", r_photo: "被沐橙拍照那次"
};
const Memory = {
  ctx: null,          // 目前的事件來源 {src, label, involved, detail}
  lastChoice: null,   // 劇情選項文字，作為記憶細節
  setContext(src, label, involved = []) { const prev = this.ctx; this.ctx = { src, label, involved }; return prev; },
  restoreContext(prev) { this.ctx = prev; },
  choiceDetail(t) {
    if (!t) return null;
    let x = String(t).replace(/^【[^】]*】/, "").replace(/（[^）]*）/g, "").trim();
    const q = x.match(/「[^」]+」/);
    if (q) return `妳說了${q[0].length > 26 ? q[0].slice(0, 24) + "…」" : q[0]}`;
    return "妳選擇" + (x.length > 24 ? x.slice(0, 24) + "…" : x);
  },
  addMemory(npcId, data) {
    const list = State.get().npcMemories[npcId]; if (!list) return;
    const s = State.get(), ctx = this.ctx || {};
    const detail = data.detail !== undefined ? data.detail : (this.lastChoice ? this.choiceDetail(this.lastChoice) : ctx.detail || null);
    s.story.memSeq = (s.story.memSeq || 0) + 1;
    const severity = data.severity || (data.major ? 3 : 1);
    const how = data.how || "witness";
    const entry = {
      id: "m" + s.story.memSeq, origin: data.origin || "m" + s.story.memSeq, type: data.type, major: !!data.major, day: data.day || s.calendar.day, weight: data.major ? 999 : 3,
      source: data.source || ctx.src || null, label: data.label || ctx.label || null, detail,
      involved: (data.involved || ctx.involved || []).filter(x => x !== npcId), severity,
      // 分層：會被當證據的事件（說謊、挑撥、可疑動態、公開示弱）保存到章節結束，只有情緒影響會淡化
      evidence: data.evidence ?? (EVIDENCE_TYPES.includes(data.type) && (!!(data.label || detail))),
      how, cred: data.cred ?? HOW_CRED[how], from: data.from || null
    };
    if (list.some(m => m.origin === entry.origin)) return; // 同一件事不重複記
    list.push(entry);
    if (list.length > 60) { const i = list.findIndex(m => !m.major && !m.evidence); if (i >= 0) list.splice(i, 1); }
    // NPC 取得新證據（非親眼）：當天標記，調查者懷疑上升
    if (how !== "witness" && entry.evidence) { s.calendar.npcEvidence = true; if (npcId === "gu") Status.addSuspicion("gu", 2); }
    return entry;
  },
  // 把一筆記憶轉述給另一名 NPC（可信度打折）
  spread(fromId, toId, mem, how = "told") {
    if (!mem || fromId === toId) return null;
    const cred = how === "screenshot" ? 85 : Math.round((mem.cred || 100) * 0.6);
    return this.addMemory(toId, { type: mem.type, major: mem.major, origin: mem.origin, day: mem.day, source: mem.source, label: mem.label, detail: mem.detail, involved: mem.involved, severity: mem.severity, evidence: mem.evidence, how, cred, from: fromId });
  },
  // 目擊：在場者各自記下一份
  witness(observers, data) { observers.forEach(id => this.addMemory(id, { ...data, how: "witness" })); },
  // 把一筆記憶寫成具體的一句話（給對話與審判引用）
  describe(m, npcId) {
    const wk = Math.min(6, Math.floor((m.day - 1) / 7) + 1);
    const when = m.label ? `第${["", "一", "二", "三", "四", "五", "六"][wk]}週的${m.label}` : `第 ${m.day} 天`;
    const who = m.involved && m.involved.length ? `，當時${m.involved.map(i => NPCS[i]?.name).filter(Boolean).join("和")}也在場` : "";
    return { when, detail: m.detail, who, text: `${when}${m.detail ? "，" + m.detail : ""}${who}` };
  },
  // 只從「知道這件事的人」的記憶裡找證據（預設：顧知夏本人）
  evidence(types, used = [], knower = "gu") {
    const all = this.getMemories(knower).map(m => ({ ...m, npc: knower })).filter(m => types.includes(m.type) && (m.label || m.detail) && !used.includes(m.origin));
    all.sort((a, b) => (b.severity * b.cred - a.severity * a.cred) || (b.day - a.day));
    return all[0] || null;
  },
  getMemories(npcId) { return State.get().npcMemories[npcId] || []; },
  findMemory(npcId, tag) { return this.getMemories(npcId).filter(m => m.type === tag); },
  decayMemories() {
    const s = State.get();
    // 情緒影響會淡化；被標記為證據的事件只淡化情緒權重，不會被刪除
    NPC_IDS.forEach(id => { s.npcMemories[id] = s.npcMemories[id].filter(m => { if (m.major) return true; m.weight = Math.max(0, m.weight - 0.15); return m.weight > 0 || m.evidence; }); });
  },
  evaluateMemoryImpact(npcId, ctx = {}) {
    const c = t => this.findMemory(npcId, t).filter(m => m.major || m.weight > 0).length, tags = ctx.tags || [];
    let favorMult = 1, susMult = 1, resist = false;
    favorMult *= Math.min(1.15, 1 + 0.05 * c("helped"));
    susMult *= 1 + 0.15 * Math.min(4, c("lied"));
    if (c("manipulated") >= 2 && tags.includes("MANIPULATE")) { favorMult *= 0.7; susMult *= 1.3; resist = true; }
    if (c("public_weak") >= 1 && tags.includes("WEAKNESS") && NPCS[npcId].attributes.sensitivity >= 60) susMult *= 1.2;
    if (c("sus_post") >= 1) susMult *= 1.1;
    return { favorMult, susMult, resist };
  },
  lineFor(npcId) {
    const mems = this.getMemories(npcId).filter(m => m.label || m.detail).slice(-6).reverse();
    const m = mems.find(x => x.major) || mems[0]; if (!m) return null;
    const lb = m.label || "那次";
    const T = {
      helped: `${lb}那次，真的謝謝妳。`, lied: `${lb}的事，我還記得。妳那時候說的，是真的嗎？`,
      manipulated: `妳在${lb}跟我說的那些……我後來想了很久。`, public_weak: `${lb}那時候，妳的眼淚來得真剛好。`,
      protected_self: `${lb}那時候，妳躲得真快呢。`, sus_post: m.source === "post" ? `${m.label}——那篇是寫給誰看的？` : `${lb}那篇動態，是寫給誰看的？`
    };
    return T[m.type] || null;
  },
  labels: { helped: "曾被妳幫助", lied: "發現妳說謊", public_weak: "看過妳公開示弱", manipulated: "聽妳說過別人的閒話", sus_post: "看過妳的可疑動態", protected_self: "看過妳在危機中自保" }
};

/* ---------- RelationshipManager（有向） ---------- */
const Relations = {
  getRelationship(a, b) { return State.get().relationships[a]?.[b] ?? 0; },
  updateRelationship(a, b, n) { return Status.addRelation(a, b, n); },
  getRelatedNPCs(id) { const r = State.get().relationships[id] || {}; return Object.entries(r).sort((x, y) => y[1] - x[1]).map(([k]) => k); },
  couple() { const r = State.get().relationships; return Math.round(((r.lin?.shen ?? 85) + (r.shen?.lin ?? 88)) / 2); },
  coupleState(v = this.couple()) { return COUPLE_STATES.find(c => v >= c.min) || COUPLE_STATES[COUPLE_STATES.length - 1]; },
  closest(id, exclude = []) { return this.getRelatedNPCs(id).find(k => !exclude.includes(k)); },
  calculateRelationshipEffects() {
    // 每日：小摩擦會慢慢修復；傷得太深（低於原本 20 以上）不會自己好；分手後兩人關係封頂 30
    const s = State.get(), r = s.relationships;
    NPC_IDS.forEach(a => NPC_IDS.forEach(b => { if (a !== b && r[a][b] != null && !((a === "lin" && b === "shen") || (a === "shen" && b === "lin"))) { const base = RELATIONSHIPS[a][b]; if (r[a][b] >= base - 20 && r[a][b] < base) r[a][b] += 1; } }));
    // 予辰 ♥ 若晴：若晴起疑、予辰的心飄向妳，感情就會慢慢磨損；兩人都安心時才會自然修復（不超過原本）
    // 壓力來源：若晴起疑、若晴情緒低落、最近 7 天妳和予辰有明確的曖昧行為（單純友好不算）
    const R = s.npcRelations, recent = Romance.recent(7);
    const pressure = (R.shen.suspicion >= 50 ? 1 : 0) + (R.shen.emotion <= -30 ? 1 : 0) + (recent >= 2 ? 1 : 0) + (recent >= 5 ? 1 : 0);
    if (pressure) { Status.addRelation("lin", "shen", -pressure); Status.addRelation("shen", "lin", -pressure); }
    else if (R.shen.suspicion < 35) { if (r.lin.shen < RELATIONSHIPS.lin.shen && r.lin.shen >= RELATIONSHIPS.lin.shen - 20) r.lin.shen += 1; if (r.shen.lin < RELATIONSHIPS.shen.lin && r.shen.lin >= RELATIONSHIPS.shen.lin - 20) r.shen.lin += 1; }
    if (s.story.flags.lin_shen_broke_up) { r.lin.shen = Math.min(r.lin.shen, 30); r.shen.lin = Math.min(r.shen.lin, 30); }
  }
};

/* ---------- CardManager ---------- */
const Cards = {
  getCard(id) { const c = CARD_MAP[id]; if (!c) console.warn("卡牌 ID 不存在", id); return c || null; },
  level(id) { return State.get().deck.cardLevels[id] || 1; },
  getDeck() { return State.get().deck.activeDeck.slice(); },
  validateDeck(ids) {
    const s = State.get(); ids = ids || s.deck.activeDeck;
    if (ids.length < CONFIG.deckMin) return `牌組至少需要 ${CONFIG.deckMin} 張`;
    if (ids.length > CONFIG.deckMax) return `牌組最多 ${CONFIG.deckMax} 張`;
    if (ids.some(id => !s.deck.collection.includes(id) || !CARD_MAP[id])) return "牌組含有未持有的卡";
    if (new Set(ids).size !== ids.length) return "同一張卡只能放一張";

  },
  setDeck(ids) { const err = this.validateDeck(ids); if (err) { UI.toast(err, "bad"); return false; } State.get().deck.activeDeck = ids.slice(); return true; },
  toggleInDeck(id) {
    const d = State.get().deck.activeDeck.slice(), i = d.indexOf(id);
    if (i >= 0) { if (d.length <= CONFIG.deckMin) { UI.toast(`牌組至少要 ${CONFIG.deckMin} 張`, "bad"); return; } d.splice(i, 1); }
    else { if (d.length >= CONFIG.deckMax) { UI.toast(`牌組上限 ${CONFIG.deckMax} 張`, "bad"); return; } d.push(id); }
    this.setDeck(d);
  },
  upgradeCard(id) {
    const s = State.get(), lv = this.level(id); if (lv >= 3) { UI.toast("已達最高等級"); return false; }
    const cost = CONFIG.upgradeCost[lv + 1];
    if (s.player.cardFragments < cost.frag) { UI.toast(`卡牌碎片不足（需要 ${cost.frag}）`, "bad"); return false; }
    if (s.player.gold < cost.gold) { UI.toast(`金幣不足（需要 ${cost.gold}）`, "bad"); return false; }
    s.player.cardFragments -= cost.frag; s.player.gold -= cost.gold; s.deck.cardLevels[id] = lv + 1;
    const m = Save.meta(); m.cardLevels[id] = Math.max(m.cardLevels[id] || 1, lv + 1); Save.saveMeta(m);
    UI.toast(`「${CARD_MAP[id].name}」升級至 Lv.${lv + 1}！`, "gold"); Sfx.play("good"); return true;
  },
  costOf(id) { const c = CARD_MAP[id]; if (!c) return 0; let cost = c.cost; if (this.level(id) >= 3 && c.type !== "WHITE_LOTUS") cost = Math.max(0, cost - 1); return cost; },
  // 戰鬥內抽牌（作用於 Battle 的牌堆）
  shuffleDeck(arr) { return Utils.shuffle(arr); },
  drawCards(b, count) {
    let drawn = 0;
    for (let i = 0; i < count; i++) {
      if (b.hand.length >= CONFIG.handMax) break;
      if (!b.draw.length) { if (!b.discard.length) break; b.draw = this.shuffleDeck(b.discard); b.discard = []; b.log.push({ t: "牌庫耗盡，棄牌堆洗回牌庫。", k: "sys" }); }
      b.hand.push(b.draw.pop()); drawn++;

    return drawn;
  },
  discardCard(b, id) { const i = b.hand.indexOf(id); if (i >= 0) { b.hand.splice(i, 1); b.discard.push(id); } }
