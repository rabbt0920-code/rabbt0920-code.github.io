<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>盜墓人生模擬器</title>
<style>
:root{--bg:#120f0b;--bg2:#1d1812;--bg3:#262016;--ink:#eadfc4;--dim:#9c917a;--gold:#e0a940;--red:#c4513a;--jade:#58a08a;--line:#3a3124}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:"Noto Serif TC","Source Han Serif TC","PingFang TC","Microsoft JhengHei",serif;line-height:1.75}
html{background:#120f0b}
body{background:radial-gradient(ellipse at 50% -10%,#3b2a14 0,#120f0b 58%) fixed;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:14px 14px 70px}
h1,h2,h3{margin:0;font-weight:700}
.title{text-align:center;padding:48px 0 18px}
.title h1{font-size:40px;letter-spacing:.18em;color:var(--gold);text-shadow:0 0 24px #e0a94055}
.title p{color:var(--dim);margin:8px 0 0;letter-spacing:.3em}
.lantern{width:46px;height:62px;margin:0 auto 18px;border-radius:10px 10px 22px 22px;background:radial-gradient(circle at 50% 55%,#ffd98a,#e0a940 45%,#7a4a14 100%);box-shadow:0 0 40px 10px #e0a94055;animation:flick 3s infinite}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.82}50%{opacity:.95}70%{opacity:.78}}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;position:sticky;top:0;z-index:5;background:linear-gradient(#120f0bf2,#120f0bd9);padding:8px 0;backdrop-filter:blur(4px)}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px}
.chip b{display:block;font-size:15px;color:var(--ink)}
.chip small{color:var(--dim)}
.meter{height:4px;background:#000;border-radius:3px;margin-top:2px;overflow:hidden}
.meter i{display:block;height:100%}
.hp i{background:var(--red)}.san i{background:#7e88d8}.oil i{background:var(--gold)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 16px 12px;margin-bottom:12px}
.card h2{font-size:20px;color:var(--gold);margin-bottom:6px}
.card .sub{color:var(--dim);font-size:13px;margin-bottom:8px}
.card p{margin:6px 0}
.btn{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);color:var(--ink);font:inherit;font-size:16px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:scale(.99)}
.btn.main{background:linear-gradient(#e0a940,#b9812a);color:#1a1209;border:none;font-weight:700;text-align:center}
.btn.ghost{background:transparent;text-align:center;color:var(--dim)}
.btn.warn{border-color:#7a3a2c}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn small{color:var(--dim);display:block;font-size:12px}
.btn.main small{color:#4a3510;font-weight:400}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--dim)}
.tag.e{color:var(--jade);border-color:var(--jade)}.tag.m{color:var(--gold);border-color:var(--gold)}.tag.h{color:var(--red);border-color:var(--red)}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fx span{font-size:13px;padding:1px 8px;border-radius:99px;background:#000a;border:1px solid var(--line)}
.fx .up{color:var(--jade)}.fx .dn{color:var(--red)}.fx .it{color:var(--gold)}
.chk{font-size:13px;color:var(--dim);border-left:2px solid var(--gold);padding-left:8px;margin:8px 0}
.tablet{background:#2b2a27;background-image:linear-gradient(135deg,#ffffff08,#00000030);border:2px solid #4a463f;border-radius:6px;padding:12px 16px;margin:10px 0;font-size:17px;letter-spacing:.06em;box-shadow:inset 0 0 30px #000a}
.tablet h3{text-align:center;color:#bdb49d;margin-bottom:6px;letter-spacing:.3em;font-size:15px}
.tablet div{padding:2px 0}
.tablet .gone{color:#6a665c;text-decoration:line-through}
.hint{color:var(--jade);font-size:14px;margin:6px 0}
.shake .tablet div{animation:jit .25s infinite alternate}
@keyframes jit{from{transform:translate(0,0)}to{transform:translate(1px,-1px)}}
.row{display:flex;gap:8px}.row .btn{flex:1}
.mate{display:flex;justify-content:space-between;align-items:center}
.sel{border-color:var(--gold)!important;background:#2f2412!important}
.dim{color:var(--dim)}
.cat{font-size:12px;letter-spacing:.2em;color:var(--dim)}
.big{font-size:28px;color:var(--gold);letter-spacing:.1em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.cell.lock{color:#5d5545}
#modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
#modal .box{max-width:420px;width:100%;text-align:center}
#modal img{width:100%;border-radius:10px;border:1px solid var(--line)}
.pzg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px auto;max-width:300px}
.pzg.pz4{grid-template-columns:repeat(2,1fr)}
.pzc{aspect-ratio:1;font:inherit;font-size:26px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);color:var(--ink);cursor:pointer;min-height:56px}
.pz4 .pzc{aspect-ratio:auto;padding:16px 0;font-size:20px}
.pzc.g{color:var(--gold)}.pzc.sel{border-color:var(--gold);box-shadow:0 0 0 2px #e0a94066}
.pzc.on{background:#3a2c12;color:var(--gold)}.pzc.hl{outline:3px solid var(--jade)}.pzc.blank{background:#000;border-style:dashed}
.pzp{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-width:420px;margin:0 auto}
.pzp .pzc{font-size:18px;aspect-ratio:auto;padding:8px 0;min-height:40px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}
.tabs .btn{margin:0;padding:10px 0;text-align:center;font-size:14px}
.owned{font-size:13px;color:var(--dim);background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 8px}
.rule{color:var(--jade);font-size:14px;margin-top:6px}
.dock{position:sticky;bottom:0;z-index:4;background:linear-gradient(#120f0b00,#120f0b 28%);padding:22px 0 6px;margin-top:6px}
.dock .btn{margin:6px 0 0}
@media(max-width:380px){.title h1{font-size:32px}.btn{font-size:15px}}
</style>

<style id="upgrade-theme-v2">

{l:"倒影眨眼了,你也眨眼",r:{san:-3,x:"你眨了眼。倒影也眨了。睜開眼時,是它在看你。"}},
{l:"閉眼憋氣,摸牆前進",r:{hp:-2,oil:-1,x:"你摸著牆壁一格一格地摸索,終於衝出迴廊,差點嗆死。"}}

{l:"保持沉默,並隨著人影下行,後退一步",ok:1,r:{loot:1,virtue:1,x:"你一聲不吭,人影走下一階,你就後退一步。最後,它在原地停了下來,慢慢地轉身,上去了。"}},
{l:"保持沉默,但站著不動",r:{hp:-2,san:-1,x:"人影一步一步地下來,從你身上穿了過去。你冷得發抖。"}},
{l:"低聲數階梯",r:{san:-3,x:"你數到第九階,才發現階梯一共只有七階。"}}
],{rules:["石階上的人影每走下一階,請後退一步。","被點到名字時,請應答。","應答三次之後,請不要再應答。","請勿數階梯。"],fake:[],rt:"點名廳須知"});
ev("r5","長明燈","通道兩側的燈一盞一盞地亮起。你手上有火摺子。前方有一盞熄滅的燈,正好擋在路中。",[
{l:"重新點燃那盞燈",r:{san:-3,hp:-1,x:"燈亮了。接著,所有的燈同時亮了,然後同時熄滅。"}},
{l:"繞過熄滅的燈,沿著亮燈的方向前進",ok:1,r:{virtue:1,san:1,loot:1,x:"你繞開了熄燈,跟著亮燈一路往前。燈全亮的時候,你已經站在出口。"}},
{l:"吹滅身後亮起的燈",r:{san:-2,oil:-1,x:"你剛吹滅一盞,另一盞就在你背後亮了。"}},
{l:"停在原地等",r:{oil:-3,x:"你們等了很久,燈油一滴一滴地見底。"}}
],{rules:["每盞燈只點一次。","熄滅的燈,請不要重新點燃。","你身後的燈會自己亮起,不是你點的。","若所有燈都亮了,請立刻出去。"],fake:[],rt:"長明燈須知"});

{l:"不開棺,從旁邊繞過去",ok:1,r:{virtue:1,san:1,x:"你們繞開了棺。身後傳來三聲很輕的敲擊,漸漸遠了。"}},
{l:"你自己開棺",r:{san:-4,hp:-2,x:"棺蓋被推開的一瞬間,你看見裡面的人睜著眼睛。"}},
{l:"讓隊友先確認",r:{lose:1,x:"隊友俯身去看,從此沒有再起來。"}}
],{rules:["棺中有人時,請不要開棺。","棺中無人時,請務必開棺。","開棺者不得為隊伍最後一人。","第一條與第二條,至少一條為真。"],fake:[],rt:"空棺須知"});

{l:"留下自己",r:{end:"G2",x:"你把燈放在棺邊,坐了下來。"}},

{l:"讀出棺蓋內側的名字",need:{marked:1},r:function(S){return(S.virtue>=3||S.st.truth>=1)?{end:"G5",x:"你輕聲念出了自己的名字。"}:{end:"G2",x:"你念出了名字,但棺蓋沒有回應。燈火一盞一盞地熄了。"}}},

{l:"把第四條的拓片,遞給門縫外的裴先生",need:{st:{pei:2,rub:1}},r:{end:"M1",x:"門縫外的人影彎下腰,說:「交給我,我替你把它寫完。」"}},
{l:"帶著燈簿和筆記,轉身往外走,去找文物單位",need:{st:{truth:2,book:1},virtue:3},r:{end:"M3",x:"你背對著棺,把燈簿抱在胸前。身後,所有的燈,同時安靜了。"}}

/* ===== 結局(27) ===== */
const ENDINGS={
W1:{n:"富可敵國隱姓埋名",c:"財富線",t:"你把最後一批貨換成一張看不出來歷的存摺,搬到沒人認識你的海邊小鎮。每晚你仍會在黑暗中點一盞燈,只是從此再沒有人問你為什麼。"},
W2:{n:"開古董店洗白",c:"財富線",t:"你在老街盤下一間小店,櫥窗裡擺著來路「乾淨」的老東西。客人誇你眼力好,你只是笑笑,沒說這雙眼睛是在地底下練出來的。"},
W3:{n:"小有積蓄的平凡人生",c:"財富線",t:"錢不多,但足夠你在城裡租個有陽光的房間。你再也沒下過墓,只是每次聞到泥土味,手指還是會不自覺地動一動。"},
W4:{n:"回到起點",c:"財富線",t:"你收了手,口袋裡卻沒剩下什麼。這一行讓你看清了不少東西,唯獨沒有讓你變有錢。"},
W5:{n:"樂極生悲",c:"財富線",t:"錢來得快,散得更快。賭桌、酒局、名錶,一樣樣把你從地底下的人變成地面上的笑話。最後你又回到原點,只是這次沒有師父拉你一把。"},
W6:{n:"黑吃黑",c:"財富線",t:"你的財富成了最大的招牌,也成了催命符。某天夜裡,有人敲了你家的門,說是來談一筆「合作」。"},
L1:{n:"被捕入獄",c:"法律線",t:"通緝令貼滿了各個車站。你被帶走的那天,天很藍,你看了很久。"},
L2:{n:"自首並協助追回文物",c:"法律線",t:"你走進派出所,把能交的東西全交了出來。你被判了刑,但那批文物回到了博物館的玻璃櫃裡,標籤上沒有你的名字。"},
L3:{n:"轉當考古學家",c:"法律線",t:"你放下洛陽鏟,拿起了毛刷和探方記錄本。同樣的墓,這一次你是「合法地」把它挖開,並且讓每一件東西都有了名字。"},
L4:{n:"亡命海外",c:"法律線",t:"你搭上一艘不問乘客身分的船,從此在別人的城市裡改名換姓。偶爾看到新聞裡的出土文物,你會想起那是誰的東西。"},
L5:{n:"文物英雄",c:"法律線",t:"你把一件又一件東西送到了該去的地方。報紙給了你一個很大的標題,你卻只想知道那盞燈有沒有人替你點著。"},
G1:{n:"在黑暗裡說話的人",c:"詭異線",t:"你開始在黑暗中跟自己說話,然後是跟別人。被人找到時,你說:「他們剛剛還在。」"},

G3:{n:"不是原來的人",c:"詭異線",t:"你走出了無名墓,所有人都說你回來了。只有你知道,鏡子裡的那個人,笑得比你早了半拍。"},
G4:{n:"多出來的那個人是你",c:"詭異線",t:"清點人數時,你終於明白多出來的那個人是誰。大家都在等你先走,而你,已經走了很久了。"},
G5:{n:"第四條",c:"詭異線",t:"你讀出了棺蓋內側的名字,那是你的。第四條規則的末尾自己浮現:「名字的主人,可以離開。」燈亮了,墓門開了,你是第一個走出無名墓的人。"},
G7:{n:"壁畫裡的人",c:"詭異線",t:"後來有人在唐墓壁畫的儀仗隊尾巴,看到了一個新添的人影,穿著你下墓時那件衣服。"},
G8:{n:"水中倒影",c:"詭異線",t:"水面平靜以後,上來的是你的倒影。他替你撐完了這一生。"},
G9:{n:"多一個,少一個",c:"詭異線",t:"明代藩王墓的人殉坑裡,多了一具從未登記過的新骨。清點的人說,少了一個,又多了一個,數字剛好對得上。"},
J1:{n:"被隊友背叛",c:"江湖線",t:"光線是從身後熄滅的。你聽見繩子被割斷的聲音,以及一句很輕的「對不起」。"},
J2:{n:"新一代的老鬼",c:"江湖線",t:"你帶著一支信得過的隊伍金盆洗手,轉而教新人怎麼活著出來。他們叫你「老鬼」,你笑著說:「我還沒死呢。」"},
J3:{n:"追債",c:"江湖線",t:"債主不急著要你的命,他們只是一天天地等,直到你什麼都不剩。"},

M3:{n:"封墓",c:"主線",t:"你把燈簿和師父的筆記,交給了文物單位。無名墓被列為保護遺址,每一個名字都被封進了檔案。燈沒有滅,只是從此有人看著它。"},
J5:{n:"用別人換來的天亮",c:"江湖線",t:"你走出了無名墓,身後的門合上了,一個人的腳步聲被留在了裡面。你帶出了所有的東西,卻再也沒有睡過一整夜。"}

/* ===== 主線劇情(原創):三十年一換的燈 ===== */
ev("s0","燈叔的遺物",function(S){return "辦完師父的後事,你在他枕邊找到一個油布包:半張手繪地圖、一本寫滿字的舊筆記,和一枚刻著三道痕的銅牌。"+(S.flags.notebook?"你認得那本筆記的字跡,和你少年時藏起來的那本,出自同一個人之手。":"")},[
{l:"把筆記從頭讀到尾",r:{sk:{a:1},san:-1,clue:"師父年輕時,曾與另外六人進過一座沒有名字的墓。回來的只有三個,他是其中之一。",x:"字寫得很密,越往後越潦草。最後一頁只有一句話:別讓人替你點燈。"}},
{l:"只留下銅牌,其餘封起來",r:{virtue:1,clue:"三道刻痕的銅牌:師父說,見到相同刻痕的人,是自己人。",x:"你把油布包封進了箱底。銅牌貼著胸口,冰涼。"}},
{l:"把地圖賣給古董圈",r:{money:300,virtue:-1,st:{pei:1},clue:"半張地圖被一位姓裴的古董商買走了,他出價出得很快。",x:"買主姓裴,戴金絲眼鏡,付錢的時候連價都沒還。"}}
],{vol:"序 · 燈叔的遺物"});

ev("s1","三道刻痕","你爬出盜洞,洞口蹲著一個穿長衫的男人,正用手帕擦一副金絲眼鏡。「裴某,做古董的。」他說,「令師的事,我略知一二。」",[
{l:"請他說下去",r:{st:{pei:1},money:100,clue:"裴先生說:師父當年那支隊伍,一共七個人,只有三個走出了那座墓。",x:"他請你喝了一杯茶,把當年的事說了一半。另一半,他說,要看你值不值得聽。"}},
{l:"盯著他的袖口看",c:K("a",7),ok:{st:{truth:1},clue:"裴先生的袖釦刻著燈紋,和師父的銅牌上的花樣相似。",x:"你看出袖釦上的紋路。那不是裝飾,是一個記號。"},ng:{x:"你看不出什麼。他笑著把袖口放了下去。"}},
{l:"轉身就走",r:{st:{pei:-1},x:"你沒回頭。身後傳來一聲輕輕的、像是惋惜的笑。"}}
],{vol:"卷一 · 三道刻痕"});

ev("s2","七人出行圖","你舉高手電。壁畫上的儀仗隊,一共七個人。六個人的臉被刮去了,只剩一個清晰的,是年輕時的師父。隊伍末尾有個戴斗笠的背影,你覺得很眼熟。你一回頭,墓口靠牆坐著一個年輕人,正啃一塊乾餅。「你來得比我預期的晚。」他說。你從沒見過他。",[
{l:"分他一口水",r:{st:{jin:1},clue:"年輕人說他叫燼。他說他在各座墓口,等一個人等了很久。",x:"他接過水壺,說了句「謝了」,眼神卻像是在看很遠的地方。"}},
{l:"追問他是誰",c:K("n",7),ok:{st:{jin:1},clue:"燼說:「我認得你師父。他欠我的,比你想的多。」",x:"他想了很久,說了自己的名字,又說了半句話。"},ng:{x:"他閉上眼睛,不再回答。"}},
{l:"握緊工具,保持距離",r:{st:{jin:-1},x:"他笑了笑,把乾餅吃完,在牆上畫了三道刻痕,然後離開了。"}}
],{vol:"卷二 · 七人出行圖"});

ev("s3","先到的人","你回到旅店,房間被人翻過。桌上放著一張名片:洪三爺。隔天,三個人在巷口堵你,要你交出師父的筆記。",[
{l:"交出一本抄本",r:{x:"你交出了抄本。他們翻了翻,臉色難看,但還是走了。"}},
{l:"說筆記早就燒了",c:K("n",8),ok:{x:"他們搜了搜你的行李,什麼也沒搜到,悻悻地走了。"},ng:{hp:-2,st:{hong:1},x:"他們不信,把你按在牆上打了一頓。"}},
{l:"動手",c:K("b",9),ok:{money:200,st:{hong:1},virtue:-1,x:"你放倒了兩個,搶了他們的錢袋。洪三爺會記住這件事。"},ng:{hp:-3,st:{hong:2},x:"你被圍毆,洪三爺的名字在你耳邊被反覆提起。"}},
{l:"打電話給裴先生",need:{st:{pei:1}},r:{st:{pei:1},money:-100,x:"裴先生的車半個小時就到了。他什麼都沒問,只說:「這個人情,我記著。」"}}
],{vol:"卷三 · 先到的人"});

ev("s4","你的名字",function(S){return "夜裡,你在營火邊翻出師父的筆記,發現有一頁被人用墨塗黑了。你用燈火烤了烤,浮出幾行字。"+(S.marked?"你想起城門上那三個字。":"")},[
{l:"把那幾行字讀完",r:function(S){return S.marked?{st:{truth:1},san:-2,clue:"師父寫道:為了逃出無名墓,我把一個孩子的名字寫進了燈簿。那個孩子,是你。",x:"你把那幾行字讀了三遍。燈火在你手心裡輕輕發抖。"}:{st:{truth:1},san:-1,clue:"師父寫道:我本想把你的名字寫進燈簿。最後一筆,我劃掉了。可是那個位置,後來還是被人填上了。",x:"那幾行字讀起來像一封沒有寄出的信。"}}},
{l:"把筆記蓋上,不讀了",r:{san:1,x:"有些事,知道了就回不去了。你把筆記塞回懷裡,望著營火燒完。"}},
{l:"拿給燼看",need:{st:{jin:1}},r:{st:{jin:1,truth:1},clue:"燼看完那一頁,說:「這是三十年前,他在我面前寫下的。」",x:"燼沉默了很久。火光映在他臉上,看不出他在想什麼。"}}
],{vol:"卷四 · 你的名字"});

ev("s5","水底的油布包","氣室的石縫裡塞著一個油布包,和師父留給你的那個一模一樣。裡面是筆記的最後幾頁,以及一張拓片。",[
{l:"把最後幾頁全部讀完",r:{st:{truth:1},san:-1,clue:"最後幾頁寫道:第四條不是要你留下誰,而是讓名字的主人離開。燈三十年一換,今年輪到了。",x:"師父的字在最後幾頁裡變得很輕、很小,像是怕被誰聽見。"}},
{l:"收起拓片,其餘不看",r:{st:{rub:1},clue:"油布包裡有一張第四條的拓片。",x:"你把拓片摺好放進懷裡,油布包又塞回了石縫。"}},
{l:"把油布包交給裴先生",need:{st:{pei:1}},r:{st:{pei:2,rub:1},money:500,virtue:-1,clue:"裴先生看到那張拓片時,眼睛亮了一下。",x:"裴先生把油布包握在手裡,說了一句「謝謝你」,語氣真誠得讓你有點不安。"}}

{l:"找到燼的名字,用手指按住",need:{st:{jin:1}},r:{st:{jin:1},san:-1,clue:"你按住了燼的名字,墨跡在你指下微微發燙。",x:"墨跡一下子燙了你的手。身後傳來很輕的一聲嘆息。"}},

ev("p_mirror","鏡面迷陣","九面銅鏡排成方陣。轉動任何一面,它和上下左右相鄰的鏡子都會一起翻面。只有九面都朝向燈光時,光才會照到牆上的暗門。",[

{l:"不碰,繼續走",r:{x:"你繞過了鏡陣。"}}

ev("p_beast","四神碑","一座石碑上刻著青龍、朱雀、白虎、玄武四個獸首,每個都能按下去。碑座上刻著一段話。",[

{l:"捏一個師父,送給他",r:{virtue:1,loyal:{old:1},x:"他嘴上說醜,卻把泥人擺在床頭擺了好多年。"}}

ev("g12","趕集走丟","六歲,你在集市上走丟了,天就快黑了。",[

ev("g13","抄碑","八歲,一個讀書人在村口抄一塊老碑,你在旁邊看了一下午。",[

ev("g14","第一把鎖","十歲,鄰居家的木箱上了一把銅鎖,大家都說打不開。",[

ev("g15","說書人","十歲,茶館裡來了一個說書人,專講盜墓的故事。",[

{l:"盯著莊家的手",c:K("a",7),ok:{money:60,sk:{n:1},x:"你看穿了他出千的手法。他塞錢給你,要你閉嘴。"},ng:{x:"你什麼都沒看出來。"}},

function retireEnding(){
 const m=S.money,w=S.wanted,v=S.virtue;
 if(S.donated>=2)return"L5";
 if(w>=8)return"L4";
 if(v>=6&&S.sk.a>=4)return"L3";

 if(m>=6000)return w>=5?"W6":"W1";

 return"W4";

function goTomb(){
 const cost=prepCost();S.money-=cost;

function nextRoom(){

 if(S.tomb.delve)delveNext();
 let note="";

 else if(S.tomb.oxy){S.dark++;S.hp-=2;note="氧氣耗盡了。你憋著最後一口氣往前游,胸口像要炸開。(體力 -2)"}
 else{S.dark++;S.hp--;note="燈已經滅了。你在黑暗中摸索,撞傷了自己。(體力 -1)"}

 if(m){

  if(m.k==="echo"){S.tm++;if(S.tm>=5){S.san--;ad("回聲越來越近,裡面混著你的名字。(理智 -1)")}}
 }
 if(S.team.indexOf("yao")>=0&&S.hp>0&&S.hp<hpMax()){S.hp++;note+=(note?" ":"")+"阿瑤替你包紮了一下。(體力 +1)"}
 if(S.team.indexOf("lian")>=0&&S.san<=3&&S.loyal.lian>0&&Math.random()<.2){S.loyal.lian=Math.max(0,S.loyal.lian-1);note+=(note?" ":"")+"阿蓮被低語刺激得有些失控。(阿蓮好感 -1)"}

PZ.magic=function(e,ctx){
 let sq=[[4,9,2],[3,5,7],[8,1,6]];
 for(let k=rnd(4);k>0;k--)sq=[0,1,2].map(i=>[0,1,2].map(j=>sq[2-j][i]));
 if(rnd(2))sq=sq.map(r=>r.slice().reverse());
 const sol=sq[0].concat(sq[1],sq[2]),giv=shuffle([0,1,2,3,4,5,6,7,8]).slice(0,3);
 const cur=sol.map((v,i)=>giv.indexOf(i)>=0?v:0);
 let sel=-1,tries=3,msg="";
 const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 function draw(){
  const acts=[],B=Bk(acts),P=pzKit(acts);
  let h=pzHead(e,ctx,"把 1 到 9 填進方格,讓每一橫、每一豎、兩條斜線的和都是 15。先點格子,再點數字;點已填的格子可以清掉重填。")+'<div class="pzg">';
  for(let i=0;i<9;i++){const g=giv.indexOf(i)>=0;h+=P(cur[i]||"",function(){if(g)return;cur[i]=0;sel=i;draw()},(g?"g ":"")+(sel===i?"sel":""))}
  h+='</div><div class="pzp">';
  for(let n=1;n<=9;n++){const used=cur.indexOf(n)>=0;h+=P(n,function(){if(sel>=0&&!used){cur[sel]=n;sel=cur.indexOf(0);draw()}},used?"on":"")}
  h+='</div><div class="chk">'+(msg||"剩餘驗證次數:"+tries)+'</div></div>';
  h+=B("驗證",function(){
   if(cur.indexOf(0)>=0){msg="還有空格沒填。";return draw()}
   if(L.every(l=>l.reduce((a,i)=>a+cur[i],0)===15))return pzEnd(e,ctx,true);
   tries--;if(tries<=0)return pzEnd(e,ctx,false);
   msg="有一條線的和不對,還剩 "+tries+" 次驗證。";draw();
  },"main");
  h+=B("提示 <small>耗 1 格燈油,補上一格正確的石片</small>",function(){
   if(S.oil<=0)return;const w=[];for(let i=0;i<9;i++)if(cur[i]!==sol[i])w.push(i);if(!w.length)return;
   const i=pick(w);for(let j=0;j<9;j++)if(cur[j]===sol[i]&&giv.indexOf(j)<0)cur[j]=0;
   cur[i]=sol[i];S.oil--;msg="一片石片自己滑進了格子裡。";sel=cur.indexOf(0);draw();
  },"ghost",S.oil<=0);
  h+=B("放棄",function(){pzEnd(e,ctx,false)},"ghost");

 }

};

PZ.slide=function(e,ctx){
 const goal=[1,2,3,4,5,6,7,8,0];
 let t=goal.slice(),prev=-1;
 const nbs=z=>{const o=[],r=Math.floor(z/3),c=z%3;if(r>0)o.push(z-3);if(r<2)o.push(z+3);if(c>0)o.push(z-1);if(c<2)o.push(z+1);return o};
 do{t=goal.slice();prev=-1;for(let k=0;k<24;k++){const z=t.indexOf(0),n=pick(nbs(z).filter(x=>x!==prev));prev=z;t[z]=t[n];t[n]=0}}while(t.join()===goal.join());
 let left=60;
 const NUM=["","壹","貳","參","肆","伍","陸","柒","捌"];
 function draw(){
  const acts=[],B=Bk(acts),P=pzKit(acts);
  let h=pzHead(e,ctx,"點擊空格旁的石磚,把它推進空格。把石磚依「壹」到「捌」的順序排好,空格留在右下角。")+'<div class="pzg">';
  const z=t.indexOf(0),can=nbs(z);
  for(let i=0;i<9;i++){
   h+=P(t[i]?NUM[t[i]]:"",function(){
    if(can.indexOf(i)<0)return;
    t[z]=t[i];t[i]=0;left--;
    if(t.join()===goal.join())return pzEnd(e,ctx,true);
    if(left<=0)return pzEnd(e,ctx,false);
    draw();
   },t[i]?(t[i]===goal[i]?"g":""):"blank");
  }
  h+='</div><div class="chk">剩餘步數:'+left+'</div></div>';
  h+=B("放棄",function(){pzEnd(e,ctx,false)},"ghost");
  show(h,acts);
 }
 draw();
};

PZ.mirror=function(e,ctx){
 const on=[true,true,true,true,true,true,true,true,true],pc=[0,0,0,0,0,0,0,0,0];
 const pr=shuffle([0,1,2,3,4,5,6,7,8]).slice(0,4);
 function flip(i){const r=Math.floor(i/3),c=i%3;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){const rr=r+d[0],cc=c+d[1];if(rr>=0&&rr<3&&cc>=0&&cc<3)on[rr*3+cc]=!on[rr*3+cc]})}
 pr.forEach(flip);
 if(on.every(x=>x)){flip(4);pr.push(4)}
 let left=12,hl=-1,msg="";
 function need(){const o=[];for(let i=0;i<9;i++){const inPr=pr.filter(x=>x===i).length%2;if((inPr+pc[i])%2)o.push(i)}return o}

  h+=B("提示 <small>耗 1 格燈油,照亮一面該轉的鏡子</small>",function(){if(S.oil<=0)return;const n=need();if(!n.length)return;hl=pick(n);S.oil--;msg="燈光在其中一面鏡子上停了一下。";draw()},"ghost",S.oil<=0);
  h+=B("放棄",function(){pzEnd(e,ctx,false)},"ghost");

 }
 draw();
};

 const mate=S.team.some(id=>TEAM[id].sk===c.s&&S.loyal[id]>0)?1:0;

 return {base,gear,cover,mate,dark,dc,bonus:base+gear+cover+mate+dark};
}

  h+='<div class="relation-card" style="animation-delay:'+(i*.04)+'s"><div class="relation-top"><div><div class="relation-name">'+m.n+'</div><div class="relation-role">'+SK[m.sk]+'專長 · '+(m.d||'同行夥伴')+'</div></div><div class="relation-score">'+v+'/9 · '+relationLevel(v)+'</div></div><div class="rel-meter"><i style="width:'+(v/9*100)+'%"></i></div><div class="relation-quote">'+quote+'</div><div class="relation-desc">'+(v>=7?'你們已建立深厚默契，危急時更願意互相照應。':v>=4?'彼此仍在觀察，但已有基本合作基礎。':v>=2?'對方對你有所保留，分配利益時務必謹慎。':'關係岌岌可危，對方可能在關鍵時刻離隊。')+'</div><div class="relation-actions"><button class="btn" data-rel-talk="'+id+'" '+(used?'disabled':'')+'>談心 · 信任 +1</button><button class="btn" data-rel-gift="'+id+'" '+(used||S.money<80?'disabled':'')+'>送上心意 · 80 元／信任 +2</button></div><div class="relation-note">'+(used?'本輪已互動，下一輪再來聊聊。':'尚未進行本輪互動。')+'</div></div>';
 });
 h+='</div><div class="card"><div class="section-title"><span>江湖熟人</span><span>尚未同行</span></div>';
 ids.filter(id=>!active.includes(id)).forEach(function(id){const m=TEAM[id],v=S.loyal[id]===undefined?5:S.loyal[id];h+='<div class="cell" style="margin:7px 0"><div class="relation-top"><b>'+m.n+'</b><span class="relation-score">'+v+'/9 · '+relationLevel(v)+'</span></div><small class="dim">'+m.d+'</small></div>'});
 h+='</div>'+B('返回備戰',function(){PTAB='team';renderPrep()},'main');
 show(h,acts);
 document.querySelectorAll('[data-rel-talk]').forEach(function(el){el.addEventListener('click',function(){const id=this.getAttribute('data-rel-talk');if(S.relationActions[id]===S.round)return;S.loyal[id]=Math.min(9,(S.loyal[id]===undefined?5:S.loyal[id])+1);S.relationActions[id]=S.round;saveProgress();renderRelationships()})});
 document.querySelectorAll('[data-rel-gift]').forEach(function(el){el.addEventListener('click',function(){const id=this.getAttribute('data-rel-gift');if(S.relationActions[id]===S.round||S.money<80)return;S.money-=80;S.loyal[id]=Math.min(9,(S.loyal[id]===undefined?5:S.loyal[id])+2);S.relationActions[id]=S.round;saveProgress();renderRelationships()})});
}
const __renderPrepRelations=renderPrep;
renderPrep=function(){
 __renderPrepRelations();
 const tabs=document.querySelector('#app .tabs');
 if(tabs&&!document.getElementById('relationship-entry')){
  const b=document.createElement('button');b.id='relationship-entry';b.className='btn relationship-link';b.textContent='人物關係 · 查看夥伴信任與互動';b.addEventListener('click',renderRelationships);tabs.insertAdjacentElement('afterend',b);
 }
};

/* 版本標記與小型狀態修正 */
if(S){S.history=S.history||[]}

if(typeof document!=="undefined"&&document.getElementById("app")&&!window.__TEST__)renderTitle();
</script>
