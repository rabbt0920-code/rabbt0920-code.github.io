<style>
:root{--bg:#120f0b;--bg2:#1d1812;--bg3:#262016;--ink:#eadfc4;--dim:#9c917a;--gold:#e0a940;--red:#c4513a;--jade:#58a08a;--line:#3a3124}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:"Noto Serif TC","Source Han Serif TC","PingFang TC","Microsoft JhengHei",serif;line-height:1.75}
html{background:#120f0b}
body{background:radial-gradient(ellipse at 50% -10%,#3b2a14 0,#120f0b 58%) fixed;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:14px 14px 70px}
h1,h2,h3{margin:0;font-weight:700}
.title{text-align:center;padding:48px 0 18px}
.title h1{font-size:40px;letter-spacing:.18em;color:var(--gold);text-shadow:0 0 24px #e0a94055}
.title p{color:var(--dim);margin:8px 0 0;letter-spacing:.3em}
.lantern{width:46px;height:62px;margin:0 auto 18px;border-radius:10px 10px 22px 22px;background:radial-gradient(circle at 50% 55%,#ffd98a,#e0a940 45%,#7a4a14 100%);box-shadow:0 0 40px 10px #e0a94055;animation:flick 3s infinite}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.82}50%{opacity:.95}70%{opacity:.78}}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;position:sticky;top:0;z-index:5;background:linear-gradient(#120f0bf2,#120f0bd9);padding:8px 0;backdrop-filter:blur(4px)}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px}
.chip b{display:block;font-size:15px;color:var(--ink)}
.chip small{color:var(--dim)}
.meter{height:4px;background:#000;border-radius:3px;margin-top:2px;overflow:hidden}
.meter i{display:block;height:100%}
.hp i{background:var(--red)}.san i{background:#7e88d8}.oil i{background:var(--gold)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 16px 12px;margin-bottom:12px}
.card h2{font-size:20px;color:var(--gold);margin-bottom:6px}
.card .sub{color:var(--dim);font-size:13px;margin-bottom:8px}
.card p{margin:6px 0}
.btn{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);color:var(--ink);font:inherit;font-size:16px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--gold)}

.btn.main{background:linear-gradient(#e0a940,#b9812a);color:#1a1209;border:none;font-weight:700;text-align:center}
.btn.ghost{background:transparent;text-align:center;color:var(--dim)}
.btn.warn{border-color:#7a3a2c}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn small{color:var(--dim);display:block;font-size:12px}
.btn.main small{color:#4a3510;font-weight:400}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--dim)}
.tag.e{color:var(--jade);border-color:var(--jade)}.tag.m{color:var(--gold);border-color:var(--gold)}.tag.h{color:var(--red);border-color:var(--red)}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fx span{font-size:13px;padding:1px 8px;border-radius:99px;background:#000a;border:1px solid var(--line)}
.fx .up{color:var(--jade)}.fx .dn{color:var(--red)}.fx .it{color:var(--gold)}
.chk{font-size:13px;color:var(--dim);border-left:2px solid var(--gold);padding-left:8px;margin:8px 0}
.tablet{background:#2b2a27;background-image:linear-gradient(135deg,#ffffff08,#00000030);border:2px solid #4a463f;border-radius:6px;padding:12px 16px;margin:10px 0;font-size:17px;letter-spacing:.06em;box-shadow:inset 0 0 30px #000a}

.tablet div{padding:2px 0}

.hint{color:var(--jade);font-size:14px;margin:6px 0}
.shake .tablet div{animation:jit .25s infinite alternate}
@keyframes jit{from{transform:translate(0,0)}to{transform:translate(1px,-1px)}}
.row{display:flex;gap:8px}.row .btn{flex:1}
.mate{display:flex;justify-content:space-between;align-items:center}
.sel{border-color:var(--gold)!important;background:#2f2412!important}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.cell.lock{color:#5d5545}
#modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
#modal .box{max-width:420px;width:100%;text-align:center}
#modal img{width:100%;border-radius:10px;border:1px solid var(--line)}
.pzg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px auto;max-width:300px}
.pzg.pz4{grid-template-columns:repeat(2,1fr)}
.pzc{aspect-ratio:1;font:inherit;font-size:26px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);color:var(--ink);cursor:pointer;min-height:56px}
.pz4 .pzc{aspect-ratio:auto;padding:16px 0;font-size:20px}
.pzc.g{color:var(--gold)}.pzc.sel{border-color:var(--gold);box-shadow:0 0 0 2px #e0a94066}
.pzc.on{background:#3a2c12;color:var(--gold)}.pzc.hl{outline:3px solid var(--jade)}.pzc.blank{background:#000;border-style:dashed}
.pzp{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-width:420px;margin:0 auto}
.pzp .pzc{font-size:18px;aspect-ratio:auto;padding:8px 0;min-height:40px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}
.tabs .btn{margin:0;padding:10px 0;text-align:center;font-size:14px}
.owned{font-size:13px;color:var(--dim);background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 8px}
.rule{color:var(--jade);font-size:14px;margin-top:6px}
.dock{position:sticky;bottom:0;z-index:4;background:linear-gradient(#120f0b00,#120f0b 28%);padding:22px 0 6px;margin-top:6px}

</style>

<style id="addons">
/* ===== 擴充樣式(v2.3 之後的功能,依版本排列) ===== */
/* ---------- v23-sanity ---------- */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:25;opacity:0;transition:opacity 1.2s;background:radial-gradient(ellipse at 50% 40%,transparent 40%,#0009 85%,#000c 100%)}
body.san-low::after{opacity:.7}
body.san-crit::after{opacity:1;background:radial-gradient(ellipse at 50% 40%,transparent 30%,#1c0505aa 74%,#000d 100%);animation:sanPulse 1.15s infinite}
@keyframes sanPulse{0%,100%{opacity:.9}12%{opacity:1}24%{opacity:.82}}
body.san-low #app{filter:saturate(.72)}
body.san-crit #app{filter:saturate(.45) contrast(1.06)}
body.san-crit .card h2{text-shadow:2px 0 #c4513a66,-2px 0 #6c8be066}
.gl{display:inline-block;color:#e2a9a0;animation:glx 2.6s infinite}
@keyframes glx{0%,88%,100%{transform:none;opacity:1}91%{transform:translate(1px,-1px);opacity:.35}95%{transform:translate(-1px,1px);opacity:.8}}
@media(prefers-reduced-motion:reduce){body.san-crit::after{animation:none}.gl{animation:none}}
/* ---------- v24-rulewhy ---------- */
.rule-why .tablet div{position:relative}
.rule-why .rw-bad{color:#f0a296}
.rule-why .gone{text-decoration:line-through;text-decoration-color:#c4513a}
.rw-tag{display:inline-block;margin-left:8px;font-size:11px;letter-spacing:0;padding:0 6px;border-radius:99px;border:1px solid var(--line);color:var(--dim);text-decoration:none;vertical-align:2px}
.rw-tag.bad{color:#f0a296;border-color:#c4513a;background:#c4513a22}
.rw-tag.good{color:#8fd3bd;border-color:#58a08a;background:#58a08a22}
.rule-why.good{border-color:#58a08a}.rule-why.bad{border-color:#c4513a}.rule-why.mid{border-color:#a8873e}
/* ---------- v25-feel ---------- */
/* 卜卦 */
.gua{display:flex;align-items:center;gap:14px;margin:10px 0 6px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#2a1f12,#15100a)}
.gua-tube{width:36px;height:50px;flex:none;border:2px solid #8b6a35;border-radius:6px 6px 10px 10px;background:#3a2a14;display:flex;justify-content:center;gap:3px;margin-top:12px}
.gua-tube i{width:3px;height:28px;background:#d9b46a;border-radius:2px;margin-top:-14px}
#app.gua-pending .gua-tube{animation:tubeShake .12s infinite alternate}
#app.gua-pending .gua-tube i{animation:stick .16s infinite alternate}
#app.gua-pending .gua-tube i:nth-child(2n){animation-delay:.07s}
@keyframes tubeShake{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes stick{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.gua-body{flex:1;min-width:0}
.gua-name{font-size:30px;font-weight:700;letter-spacing:.2em;color:var(--ink);line-height:1.3}
.gua-line{font-size:13px;color:var(--dim)}
.gua.done .gua-name{animation:guaPop .35s}
.gua.lucky .gua-name{color:#f5cf75;text-shadow:0 0 18px #f0c56a88}
.gua.plain .gua-name{color:#d8ccb0}
.gua.ill .gua-name{color:#ef7a64;text-shadow:0 0 16px #c4513a88}
.gua-stamp{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;opacity:0;transform:scale(2) rotate(-20deg)}
.gua.done .gua-stamp{opacity:1;transform:scale(1) rotate(-12deg);transition:all .25s cubic-bezier(.2,1.6,.4,1)}
.gua-stamp.ok{color:#8fd3bd;border:3px solid #58a08a}.gua-stamp.ng{color:#f0a296;border:3px solid #c4513a}
@keyframes guaPop{0%{transform:scale(1.5);opacity:.3}100%{transform:scale(1);opacity:1}}
#app .res-card .chk,#app .res-card > p,#app .res-card .fx,#app .res-card ~ *{transition:opacity .35s}
#app.gua-pending .res-card .chk,#app.gua-pending .res-card > p,#app.gua-pending .res-card .fx,#app.gua-pending .res-card ~ *{visibility:hidden;opacity:0}
#app .bar{transition:opacity .3s,filter .3s}
#app.gua-pending .bar{opacity:.3;filter:blur(2px)}
/* 數值跳動、震動、閃光 */
#app .bar .chip{position:relative}
.pop{position:absolute;right:8px;top:2px;font-weight:700;font-size:17px;pointer-events:none;animation:popUp 1.2s ease-out forwards}
.pop.up{color:#8fd3bd}.pop.dn{color:#ff8a76}
@keyframes popUp{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-24px)}}
.chip.flash-dn{animation:chipDn .7s}.chip.flash-up{animation:chipUp .7s}

W6:{n:"黑吃黑",c:"財富線",t:"你的財富成了最大的招牌,也成了催命符。某天夜裡,有人敲了你家的門,說是來談一筆「合作」。"},

G11:{n:"被陰兵收編",c:"詭異線",t:"黑暗裡響起號角,你站起來,跟上了隊伍。後來的盜墓賊說,將軍墓的兵俑多了一尊,手裡沒有戈,只握著一盞熄掉的燈。"},

ev("s0","燈叔的遺物",function(S){return "辦完師父的後事,你在他枕邊找到一個油布包:半張手繪地圖、一本寫滿字的舊筆記,和一枚刻著三道痕的銅牌。"+(S.flags.notebook?"你認得那本筆記的字跡,和你少年時藏起來的那本,出自同一個人之手。":"")},[
{l:"把筆記從頭讀到尾",r:{sk:{a:1},san:-1,clue:"師父年輕時,曾與另外六人進過一座沒有名字的墓。回來的只有三個,他是其中之一。",x:"字寫得很密,越往後越潦草。最後一頁只有一句話:別讓人替你點燈。"}},
{l:"只留下銅牌,其餘封起來",r:{virtue:1,clue:"三道刻痕的銅牌:師父說,見到相同刻痕的人,是自己人。",x:"你把油布包封進了箱底。銅牌貼著胸口,冰涼。"}},
{l:"把地圖賣給古董圈",r:{money:300,virtue:-1,st:{pei:1},clue:"半張地圖被一位姓裴的古董商買走了,他出價出得很快。",x:"買主姓裴,戴金絲眼鏡,付錢的時候連價都沒還。"}}
],{vol:"序 · 燈叔的遺物"});

ev("s1","三道刻痕","你爬出盜洞,洞口蹲著一個穿長衫的男人,正用手帕擦一副金絲眼鏡。「裴某,做古董的。」他說,「令師的事,我略知一二。」",[
{l:"請他說下去",r:{st:{pei:1},money:100,clue:"裴先生說:師父當年那支隊伍,一共七個人,只有三個走出了那座墓。",x:"他請你喝了一杯茶,把當年的事說了一半。另一半,他說,要看你值不值得聽。"}},
{l:"盯著他的袖口看",c:K("a",7),ok:{st:{truth:1},clue:"裴先生的袖釦刻著燈紋,和師父的銅牌上的花樣相似。",x:"你看出袖釦上的紋路。那不是裝飾,是一個記號。"},ng:{x:"你看不出什麼。他笑著把袖口放了下去。"}},
{l:"轉身就走",r:{st:{pei:-1},x:"你沒回頭。身後傳來一聲輕輕的、像是惋惜的笑。"}}
],{vol:"卷一 · 三道刻痕"});

ev("s2","七人出行圖","你舉高手電。壁畫上的儀仗隊,一共七個人。六個人的臉被刮去了,只剩一個清晰的,是年輕時的師父。隊伍末尾有個戴斗笠的背影,你覺得很眼熟。你一回頭,墓口靠牆坐著一個年輕人,正啃一塊乾餅。「你來得比我預期的晚。」他說。你從沒見過他。",[
{l:"分他一口水",r:{st:{jin:1},clue:"年輕人說他叫燼。他說他在各座墓口,等一個人等了很久。",x:"他接過水壺,說了句「謝了」,眼神卻像是在看很遠的地方。"}},
{l:"追問他是誰",c:K("n",7),ok:{st:{jin:1},clue:"燼說:「我認得你師父。他欠我的,比你想的多。」",x:"他想了很久,說了自己的名字,又說了半句話。"},ng:{x:"他閉上眼睛,不再回答。"}},
{l:"握緊工具,保持距離",r:{st:{jin:-1},x:"他笑了笑,把乾餅吃完,在牆上畫了三道刻痕,然後離開了。"}}
],{vol:"卷二 · 七人出行圖"});

ev("s3","先到的人","你回到旅店,房間被人翻過。桌上放著一張名片:洪三爺。隔天,三個人在巷口堵你,要你交出師父的筆記。",[
{l:"交出一本抄本",r:{x:"你交出了抄本。他們翻了翻,臉色難看,但還是走了。"}},
{l:"說筆記早就燒了",c:K("n",8),ok:{x:"他們搜了搜你的行李,什麼也沒搜到,悻悻地走了。"},ng:{hp:-2,st:{hong:1},x:"他們不信,把你按在牆上打了一頓。"}},
{l:"動手",c:K("b",9),ok:{money:200,st:{hong:1},virtue:-1,x:"你放倒了兩個,搶了他們的錢袋。洪三爺會記住這件事。"},ng:{hp:-3,st:{hong:2},x:"你被圍毆,洪三爺的名字在你耳邊被反覆提起。"}},
{l:"打電話給裴先生",need:{st:{pei:1}},r:{st:{pei:1},money:-100,x:"裴先生的車半個小時就到了。他什麼都沒問,只說:「這個人情,我記著。」"}}
],{vol:"卷三 · 先到的人"});

ev("s4","你的名字",function(S){return "夜裡,你在營火邊翻出師父的筆記,發現有一頁被人用墨塗黑了。你用燈火烤了烤,浮出幾行字。"+(S.marked&&S.flags.seen?"你想起城門上那三個字。":S.marked?"你忽然覺得,這幾行字你早就看過。":"")},[

{l:"把筆記蓋上,不讀了",r:{san:1,x:"有些事,知道了就回不去了。你把筆記塞回懷裡,望著營火燒完。"}},
{l:"拿給燼看",need:{st:{jin:1}},r:{st:{jin:1,truth:1},clue:"燼看完那一頁,說:「這是三十年前,他在我面前寫下的。」",x:"燼沉默了很久。火光映在他臉上,看不出他在想什麼。"}}
],{vol:"卷四 · 你的名字"});

ev("s5","石縫裡的油布包","出墓前,你在一處石縫裡摸到一個油布包,和師父留給你的那個一模一樣。裡面是筆記的最後幾頁,以及一張拓片。",[

{l:"收起拓片,其餘不看",r:{st:{rub:1},clue:"油布包裡有一張第四條的拓片。",x:"你把拓片摺好放進懷裡,油布包又塞回了石縫。"}},
{l:"把油布包交給裴先生",need:{st:{pei:1}},r:{st:{pei:2,rub:1},money:500,virtue:-1,clue:"裴先生看到那張拓片時,眼睛亮了一下。",x:"裴先生把油布包握在手裡,說了一句「謝謝你」,語氣真誠得讓你有點不安。"}}
],{vol:"卷五 · 石縫裡的油布包"});

ev("t6_s","燈簿","一張石案上攤著一本厚厚的簿子,每一頁都是一個名字,墨跡有深有淺。最後一頁的墨,還是濕的。",[
{l:"把整本燈簿帶走",r:{st:{book:1},san:-2,clue:"燈簿記著每三十年換一次點燈人的名字。",x:"你合上簿子塞進包裡,簿子比看上去沉得多。"}},
{l:"抄下第四條",r:{st:{rub:1},san:-1,clue:"你在燈簿前抄下了第四條。",x:"你一個字一個字抄下來,手抖得很厲害。"}},
{l:"找到燼的名字,用手指按住",need:{st:{jin:1}},r:{st:{jin:1},san:-1,clue:"你按住了燼的名字,墨跡在你指下微微發燙。",x:"墨跡一下子燙了你的手。身後傳來很輕的一聲嘆息。"}},
{l:"不碰,繞過石案",r:{x:"你沒有碰那本簿子,繞過了石案。"}}
],{ghost:1});

/* ===== 機關解謎房 ===== */
ev("p_magic","洛書石板","一塊刻著九個方格的石板,有三格已經嵌上數字石片。旁邊刻著一行字:「戴九履一,左三右七,二四為肩,六八為足,五居中央。」",[
{l:"動手排列石片",puz:"magic"},
{l:"強行砸開",c:K("b",9),ok:{loot:1,hp:-1,tm:1,x:"石板裂開,暗格裡的東西也碎了一半。"},ng:{hp:-3,x:"石板紋絲不動,反震讓你虎口發麻。"}},
{l:"不碰,繼續走",r:{x:"你記下了那行字,沒有動石板。"}}
],{win:{loot:2,mat:1,sk:{m:1},x:"最後一片石片嵌進去,石板發出一聲悶響,暗格緩緩打開。"},lose:{hp:-2,san:-1,x:"石片全部彈了出來,砸在你的手背上。"}});
ev("p_slide","移位石磚","一面牆上嵌著九格石磚,其中一格是空的。磚上的花紋被打散了,拼回原樣,似乎就能打開後面的暗門。",[
{l:"動手推石磚",puz:"slide"},
{l:"用撬棍硬撬",c:K("m",9),ok:{loot:1,x:"你撬開了一道縫,伸手摸出了一件東西。"},ng:{hp:-2,oil:-1,x:"撬棍斷了,碎石劈頭蓋臉砸下來。"}},
{l:"不碰,繼續走",r:{x:"你看了一會兒,決定不浪費燈油。"}}
],{win:{loot:2,mat:1,x:"最後一塊磚歸位,暗門向內滑開。"},lose:{oil:-2,san:-1,x:"石磚卡死了。你推了太久,燈油耗掉不少。"}});
ev("p_mirror","鏡面迷陣","九面銅鏡排成方陣。轉動任何一面,它和上下左右相鄰的鏡子都會一起翻面。只有九面都朝向燈光時,光才會照到牆上的暗門。",[
{l:"動手轉動銅鏡",puz:"mirror"},
{l:"砸碎銅鏡",r:{loot:1,san:-2,virtue:-1,x:"銅鏡碎了一地,每一片裡都有一張你的臉。"}},
{l:"不碰,繼續走",r:{x:"你繞過了鏡陣。"}}
],{win:{loot:2,san:1,x:"九面銅鏡同時亮起,一道光打在牆上,暗門應聲而開。"},lose:{san:-3,x:"鏡子裡的光一下子全滅了。黑暗中,有東西在鏡子裡眨了眨眼。"},ghost:1});
ev("p_beast","四神碑","一座石碑上刻著青龍、朱雀、白虎、玄武四個獸首,每個都能按下去。碑座上刻著一段話。",[
{l:"按順序按下獸首",puz:"beast"},
{l:"四個一起按",c:K("g",9),ok:{loot:1,x:"碑座晃了晃,掉出一件東西。"},ng:{hp:-2,san:-1,x:"碑頂噴出一股灰,嗆得你眼淚直流。"}},
{l:"不碰,繼續走",r:{x:"你看了碑文一眼,繼續往前。"}}
],{win:{loot:2,virtue:1,x:"四個獸首依序亮起,碑座下方打開一個暗格。"},lose:{hp:-2,san:-2,x:"獸首同時暗了下去,碑後傳來低低的吼聲。"}});

/* 魔窟營地 */
ev("dv_camp","營地遺跡","一處前人留下的營地,火堆的灰還是溫的,旁邊有一個黑商留下的貨箱。",[
{l:"好好休息一陣",r:{hp:3,san:2,oil:3,x:"你睡了一小會兒,醒來時燈火還亮著。"}},
{l:"翻找貨箱",r:{food:1,herb:1,mat:1,x:"貨箱裡有乾糧、藥材,還有一些能用的零件。"}},
{l:"搜刮營地",r:{loot:1,oil:1,x:"你在火堆旁找到一件前人沒帶走的東西。"}}
]);

/* ===== v0.4 成長期擴充(每個年齡從 2~3 張中抽 1 張) ===== */
ev("g11","捏泥人","六歲,你蹲在河邊捏泥人。大人們說,你捏的東西長得跟墓裡挖出來的一模一樣。",[
{l:"照著家裡的陶俑捏",r:{sk:{a:1},x:"你捏出了衣褶和髮髻,連大人都看愣了。"}},
{l:"捏一隻沒人見過的怪獸",r:{sk:{g:1},x:"你給牠取了名字,從此夜裡就不怕黑了。"}},
{l:"捏一個師父,送給他",r:{virtue:1,loyal:{old:1},x:"他嘴上說醜,卻把泥人擺在床頭擺了好多年。"}}
],{age:6});
ev("g12","趕集走丟","六歲,你在集市上走丟了,天就快黑了。",[
{l:"循著糖炒栗子的味道走回家",r:{sk:{f:1},x:"你的鼻子比眼睛還好用,大人們嘖嘖稱奇。"}},
{l:"找個面善的大人問路",r:{sk:{n:1},x:"你挑對了人,被一路送到家門口。"}},
{l:"找個角落坐著,等人來找",r:{virtue:1,x:"你等了很久,來找你的人哭得比你還兇。"}}
],{age:6});
ev("g13","抄碑","八歲,一個讀書人在村口抄一塊老碑,你在旁邊看了一下午。",[
{l:"跟著他一起抄",r:{sk:{a:1},x:"他教你認了十幾個古字,說你眼力好。"}},
{l:"爬上碑頂往遠處看",r:{sk:{b:1,f:1},x:"從碑頂往遠處看,你第一次發現山的走勢像一條龍。"}},
{l:"撿走碑下供奉的銅錢",r:{money:30,virtue:-1,x:"你攢下了人生第一筆私房錢。"}}
],{age:8});
ev("g14","第一把鎖","十歲,鄰居家的木箱上了一把銅鎖,大家都說打不開。",[
{l:"偷偷試著打開",c:K("m",6),ok:{sk:{m:1},x:"咔噠一聲,鎖開了。你把它原樣鎖了回去。"},ng:{wanted:1,x:"你被當場抓住,鄰居到現在都還記得你。"}},
{l:"把自家的舊鎖拆開研究",r:{sk:{m:1},x:"你拆了裝、裝了拆,連彈簧都認得了。"}},
{l:"不碰別人的東西",r:{virtue:1,x:"你只是遠遠看了一眼。"}}
],{age:10});
ev("g15","說書人","十歲,茶館裡來了一個說書人,專講盜墓的故事。",[
{l:"一場不漏地聽完",r:{sk:{g:1},x:"故事裡的粽子和機關,你夜裡都夢過一遍,醒來反而不怕了。"}},
{l:"偷走他的話本",r:{sk:{a:1},virtue:-1,x:"話本裡夾著一張草圖,畫的居然是真的墓。"}},
{l:"把攢的錢都打賞給他",r:{money:-10,sk:{n:1},x:"他記住了你,以後見面都會跟你多聊兩句。"}}
],{age:10});
ev("g16","地窖裡的聲音","十二歲,家裡的地窖夜裡傳出敲擊聲,一下一下,很有規律。",[
{l:"拿著蠟燭下去看",c:K("g",7),ok:{sk:{g:1},x:"是一隻困在罈子裡的老鼠。你笑自己膽小,也笑自己膽大。"},ng:{x:"蠟燭滅了,你連滾帶爬地逃上來。"}},
{l:"叫醒大人",r:{virtue:1,x:"大人下去看了一眼,上來後臉色很難看,什麼也沒說。"}},
{l:"把地窖門釘死",r:{sk:{m:1},x:"你釘了一整夜。敲擊聲在天亮前停了。"}}
],{age:12});
ev("g17","賭桌","十三歲,你在巷口看人擲骰子,有人招手讓你也押一把。",[
{l:"押上身上所有的錢",r:function(S){return Math.random()<.5?{money:150,x:"你贏了。那天你請了半條街的孩子吃糖。"}:{money:-40,x:"你輸光了,回家的路特別長。"}}},
{l:"盯著莊家的手",c:K("a",7),ok:{money:60,sk:{n:1},x:"你看穿了他出千的手法。他塞錢給你,要你閉嘴。"},ng:{x:"你什麼都沒看出來。"}},
{l:"轉身走開",r:{virtue:1,x:"你沒碰骰子。身後傳來一陣叫罵聲。"}}
],{age:13});
ev("g18","看星","十三歲,一個雲遊的道士在村裡借住,夜裡總是坐在屋頂上看星。",[
{l:"跟他學看星辨方位",r:{sk:{f:1},x:"他教你從星斗找南北,從山勢找龍脈。"}},
{l:"跟他學算命的話術",r:{sk:{n:1},money:60,virtue:-1,x:"你學會了說人想聽的話,也靠這個賺了些錢。"}}
],{age:13});
ev("g19","被冤枉","十四歲,店裡少了一件東西,所有人都看向你。",[
{l:"冷靜地辯解",c:K("n",7),ok:{sk:{n:1},x:"你說出了東西真正的下落。老闆向你賠了不是。"},ng:{money:-30,x:"沒人相信你,你賠了錢。"}},
{l:"認了,把錢賠上",r:{money:-50,virtue:1,x:"後來東西找到了。老闆一直記得這件事。"}},
{l:"連夜逃走",r:{sk:{b:1},wanted:1,x:"你跑了一整夜。從此那條街,你再也沒回去過。"}}
],{age:14});
ev("g20","第一次去黑市","十五歲,大人第一次帶你去黑市,要你只看不說話。",[
{l:"記住每一張臉",r:{sk:{n:1},x:"你記住了誰是買家,誰是眼線,誰是來釣魚的。"}},
{l:"偷學行話",r:{sk:{a:1},x:"「粽子」、「明器」、「倒鬥」,你在心裡默念了一整晚。"}},
{l:"趁亂順走一件貨",r:{money:120,wanted:1,x:"你的手很快,但不夠快。有人看見了。"}}
],{age:15});
ev("g21","河邊","十五歲,河裡有人落水,岸邊一群人在喊。",[
{l:"跳下去救人",c:K("b",7),ok:{virtue:2,sk:{b:1},x:"你把人拖上了岸。他的家人跪著向你道謝。"},ng:{virtue:1,x:"你沒能游到他身邊,最後是船夫把人撈起來的。"}},
{l:"跑去找船夫",r:{sk:{n:1},virtue:1,x:"你喊來了船,人得救了。"}},
{l:"站在岸邊看",r:{virtue:-1,x:"你看著,一直看到人群散去。"}}
],{age:15});
ev("g22","小土堆","十六歲,朋友在城外發現一個奇怪的小土堆,約你晚上一起去挖。",[
{l:"去,而且由你來找位置",c:K("f",7),ok:{money:200,sk:{f:1},x:"你下了第一鏟,就碰到了磚。那一晚你們分到了不少錢。"},ng:{wanted:1,x:"挖了一夜什麼都沒有,還被巡夜的人看見了。"}},
{l:"拒絕",r:{virtue:1,x:"朋友罵你膽小。三天後,他被抓了。"}},
{l:"去報官",r:{money:50,virtue:-2,x:"你拿到了賞錢,但從此沒人願意跟你說話。"}}
],{age:16});
ev("g23","離家","十六歲,有人勸你去城裡讀書,有人勸你跟商隊出遠門。",[
{l:"去城裡讀書",r:{sk:{a:1,n:1},money:-50,x:"你讀了兩年書,認識了很多以後用得上的人。"}},
{l:"留下來跟師父學手藝",r:{sk:{m:1,f:1},x:"師父把壓箱底的本事,一點一點教給了你。"}},
{l:"跟商隊出遠門",r:{sk:{b:1},money:80,x:"你走過沙漠,也見過海。腳底的繭比手上的還厚。"}}
],{age:16});
const GROWTH_SLOTS=[["g1","g11","g12"],["g2","g13"],["g3","g14","g15"],["g4","g16"],["g5","g17","g18"],["g6","g19"],["g7","g20","g21"],["g8","g22","g23"],["g9"],["g10"]];

/* ===== 荒丘漢墓:塌方 ===== */
ev("t1_g","前人的屍骨","盜洞旁靠著一具骸骨,身上還背著工具袋,手裡攥著一張發黃的紙。",[
{l:"搜他的工具袋",r:{mat:1,food:1,virtue:-1,x:"工具袋裡有幾根撬棍和一包硬得像石頭的乾糧。"}},
{l:"讀那張紙",r:{sk:{f:1},x:"紙上畫著這座墓的走向,有幾處被他用指甲狠狠劃掉了。"}},
{l:"把他埋了",r:{virtue:2,oil:-1,x:"你花了一點時間,替他堆了一個小土堆。"}}
]);
ev("t1_h","半塌的耳室","耳室的頂塌了一半,碎土縫裡露出一角陶器。土還在一點一點往下掉。",[
{l:"側身鑽進去",c:K("b",7),ok:{loot:1,x:"你屏住呼吸鑽進去,又一寸一寸退了出來,手裡多了一件東西。"},ng:{hp:-2,tm:1,x:"你的肩膀撞到了土牆,頭頂落下一大塊土。"}},
{l:"用材料撐住頂再進去",need:{mat:1},r:{mat:-1,loot:1,tm:-1,x:"你用撬棍和木條撐住了墓頂,穩穩地取出東西。"}},
{l:"用鏟子硬挖開",r:{loot:1,tm:2,x:"你挖出了東西,也挖鬆了整面牆。"}},
{l:"放棄",r:{x:"你決定不拿命換一個罐子。"}}
]);
ev("t1_i","朱砂封門","一道小門被朱砂封著,朱砂畫成一個你看不懂的符。",[
{l:"刮掉朱砂進去",r:{loot:1,san:-2,x:"朱砂刮下來的時候是濕的。門後的東西你拿了,但手心一直發燙。"}},
{l:"辨認符的意思",c:K("a",7),ok:{loot:1,sk:{a:1},x:"你認出這是「鎮」字的變體。你從側面找到了不必破符的入口。"},ng:{san:-1,x:"你盯著符看了太久,眼前的紅開始晃動。"}},
{l:"一腳踹開",r:{loot:1,hp:-1,tm:1,x:"門開了,門框上的土嘩啦啦往下掉。"}}
]);
ev("t1_j","牆上的箭頭","牆上有人用炭畫了一個箭頭,旁邊寫著三個字:此路通。炭跡還很新。",[
{l:"跟著箭頭走",r:function(S){return Math.random()<.5?{oil:1,x:"箭頭指的果然是一條近路,你省下了不少燈油。"}:{hp:-2,tm:1,x:"箭頭盡頭是一面一碰就掉土的死牆。有人在騙後來的人。"}}},
{l:"往反方向找",c:K("f",7),ok:{loot:1,x:"你沒信那個箭頭,反而在另一頭找到了好東西。"},ng:{oil:-1,x:"你繞了一大圈,什麼也沒找到。"}},
{l:"在旁邊再畫一個問號",r:{virtue:1,x:"你替下一個人留了一個提醒。"}}
]);

/* ===== 唐代貴族合葬墓:注視 ===== */
ev("t2_g","仕女圖","一整面仕女圖,十幾個侍女捧著器物。你走到哪裡,她們的眼睛就跟到哪裡。",[
{l:"用布把她們的眼睛遮住",r:{tm:-1,oil:-1,x:"你一面一面地遮。遮到最後一個時,布底下好像眨了一下。"}},
{l:"盯回去",c:K("g",7,"ghost"),ok:{tm:-1,san:1,x:"你盯著她們,直到她們先移開了視線。"},ng:{tm:2,san:-1,x:"你先移開了視線。之後的路,你一直覺得背後有人。"}},
{l:"刮下她們手上的金箔",r:{loot:1,tm:2,virtue:-1,x:"金箔刮下來了。所有侍女的眼睛,都轉向了你的手。"}}
],{ghost:1});
ev("t2_h","胡人牽駝俑","一組胡人牽駝俑,駱駝背上馱著一個小木箱,木箱居然還完好。",[
{l:"打開小木箱",c:K("m",7),ok:{loot:2,x:"箱裡是一包西域的香料和幾枚金幣。"},ng:{hp:-1,x:"箱子一碰就散了,木刺扎進了你的手。"}},
{l:"整組搬走",r:{loot:1,tm:1,oil:-1,x:"陶俑很沉。搬動的時候,壁畫上的人好像都轉過頭來看。"}},
{l:"只看不拿",r:{sk:{a:1},x:"你仔細看了陶俑的釉色和胎土,記在了心裡。"}}
]);
ev("t2_i","沒燒完的香","供桌上的香爐裡,還插著半截沒燒完的香。",[
{l:"把香點上",r:{tm:-2,san:1,oil:-1,x:"香煙升起來的時候,墓裡好像鬆了一口氣。"}},
{l:"拿走香爐",r:{loot:1,tm:1,x:"香爐入手冰涼。供桌後面傳來一聲很輕的嘆息。"}},
{l:"雙手合十拜一拜",r:{tm:-1,x:"你拜了三拜,繼續往前走。"}}
]);
ev("t2_j","夫人的墓誌","一塊小一些的墓誌,屬於合葬的夫人。字寫得很秀氣,最後一句是:願後來者,替我讀一遍。",[
{l:"念出來",r:{virtue:1,tm:-2,san:1,x:"你一字一字地念完了。最後一個字落下時,燈火輕輕晃了一下。"}},
{l:"拓下來拿去賣",c:K("a",6),ok:{money:150,x:"拓片拓得很清楚,能賣個好價錢。"},ng:{x:"你拓壞了,只得到一團墨。"}},
{l:"把墓誌整塊帶走",r:{loot:1,tm:2,san:-1,x:"墓誌很重,你一路都聽到有人在耳邊低聲念著什麼。"}}
]);

/* ===== 明代藩王墓:警戒 ===== */
ev("t3_g","銅鈴長廊","長廊頂上掛滿了銅鈴。工匠的記號寫著:鈴響則門閉。",[
{l:"屏住呼吸,慢慢走過",c:K("b",8,"trap"),ok:{x:"你一步一步挪過長廊,一個鈴也沒響。"},ng:{hp:-1,x:"一個鈴輕輕響了。遠處傳來石門落下的聲音。"}},
{l:"把鈴舌一個個綁住",r:{oil:-2,x:"你綁了很久,燈油燒掉不少,但長廊安靜得像沒人來過。"}},
{l:"乾脆把鈴全部搖響",r:{tm:2,loot:1,x:"鈴聲在整座墓裡迴盪。機關全醒了,你趁亂摸走了一件東西。"}}
]);
ev("t3_h","龍紋大棺","一口刻滿龍紋的大棺,擺在最顯眼的位置,看起來就是主棺。",[
{l:"直接開棺",r:{hp:-3,tm:2,x:"棺裡是空的。棺蓋底下連著弩機,箭擦著你的耳朵飛過去。"}},
{l:"先看棺底的磨痕",c:K("a",8),ok:{tm:-1,sk:{a:1},x:"棺底沒有一點磨痕,這口棺從沒被抬過。是假棺。你順手拆掉了連著的機關。"},ng:{x:"你看不出什麼,決定不碰它。"}},
{l:"繞過去",r:{x:"你繞過了大棺。太顯眼的東西,往往不是好東西。"}}
]);
ev("t3_i","工匠的刻字","牆角有幾行很淺的刻字,是當年被封在墓裡的工匠留下的。",[
{l:"照著刻字找機關的位置",r:{tm:-2,sk:{m:1},x:"刻字裡藏著幾處機關的位置。工匠們早就為後來的人留了路。"}},
{l:"把工匠的名字抄下來",r:{virtue:2,x:"你一個一個抄下了他們的名字。這些名字從來沒有人念過。"}},
{l:"看看就走",r:{x:"你看不懂那些刻字,繼續往前。"}}
]);
ev("t3_j","兵器庫","一整間屋子的鐵甲和刀槍,早已鏽成一團。",[
{l:"翻找能用的東西",c:K("a",8),ok:{loot:2,x:"你在鏽鐵堆裡找到兩件鑲金的禮器。"},ng:{hp:-1,x:"你被鏽鐵割傷了手。"}},
{l:"拆下還能用的零件",r:{mat:2,oil:-1,x:"你拆下了一些銅件和鐵片,回去可以派上用場。"}},
{l:"不碰",r:{x:"鏽鐵堆裡,好像有一副鎧甲是站著的。你沒有多看。"}}
]);

/* ===== 沙漠古城墓:缺水 ===== */
ev("t4_e","乾井","一口乾井,井底的沙子顏色比別處深一點。",[
{l:"下去往下挖",c:K("f",7),ok:{tm:3,x:"挖到第三尺,沙子開始變濕。你接到了半囊渾水。"},ng:{hp:-1,oil:-1,x:"你挖了很久,只挖出更乾的沙。"}},
{l:"用繩索吊人下去打水",need:{gear:"rope"},r:{tm:2,oil:-1,x:"繩子放到底,拉上來時,水囊是沉的。"}},
{l:"不浪費時間",r:{x:"你看了一眼井底,繼續往前。"}}
]);
ev("t4_f","商隊遺骸","幾具裹著布的遺骸靠著牆坐成一排,身邊散落著皮水囊。",[
{l:"拿走他們的水囊",r:{tm:2,san:-1,x:"水囊裡還有水。你喝的時候,總覺得他們在看你。"}},
{l:"拿走他們的貨物",r:{loot:1,virtue:-1,x:"貨物包得很好,是一卷西域的錦緞。"}},
{l:"替他們念幾句",r:{virtue:1,san:1,x:"你替他們念了幾句往生的話。風好像小了一點。"}}
]);
ev("t4_g","綠洲","城牆的缺口外,忽然出現一片綠洲,水波閃著光。",[
{l:"跑過去",r:{tm:-1,oil:-2,san:-1,x:"你跑了很遠,綠洲一直在前面。那是海市蜃樓。"}},
{l:"先看清楚再說",c:K("g",7),ok:{x:"你看出水面的倒影不會晃。是假的,你沒上當。"},ng:{tm:-1,san:-1,x:"你猶豫了很久,最後還是走過去看了一眼。白白曬掉了半囊水。"}},
{l:"不理會",r:{x:"你低頭繼續趕路。沙漠裡,看得見的水大多是假的。"}}
]);
ev("t4_h","水在城北","一塊被風沙磨平的石碑,只剩下幾個字還看得清:水在城北。",[
{l:"往城北走",r:{tm:2,oil:-2,x:"你在城北找到了一口還有水的暗渠。"}},
{l:"拓下石碑",c:K("a",7),ok:{money:120,x:"這塊碑的拓片在圈內很搶手。"},ng:{x:"風沙太大,拓片糊成了一片。"}},
{l:"不理會",r:{x:"你記住了這幾個字,沒有改道。"}}
]);
ev("t4_i","蠍群","沙縫裡爬出一大群黑蠍,把路堵得嚴嚴實實。",[
{l:"用燈油燒出一條路",r:{oil:-2,x:"火光一起,蠍群退進了沙縫。"}},
{l:"直接衝過去",c:K("b",8),ok:{x:"你衝了過去,鞋底踩碎了好幾隻。"},ng:{hp:-3,x:"你被蟄了好幾下,半條腿都麻了。"}},
{l:"撒藥材驅蠍",need:{herb:1},r:{herb:-1,x:"藥材的氣味一散開,蠍群就退了。"}}
]);

/* ===== 水下沉墓:氧氣 ===== */
ev("t5_e","石像下的氣泡","一尊倒下的石像底下,不斷冒出一串串氣泡。",[
{l:"推開石像",c:K("b",8),ok:{oil:3,x:"石像下面是一個小氣穴。你大口換了幾口氣。"},ng:{hp:-2,oil:-1,x:"石像太重,你白白耗掉了一口氣。"}},
{l:"從縫隙裡吸幾口",r:{oil:1,san:-1,x:"縫隙裡的空氣有一股鐵鏽味。"}}
]);
ev("t5_f","前人的氣囊","一個破了洞的皮氣囊卡在石縫裡,主人不知去向。",[
{l:"拆下來當材料",r:{mat:2,x:"皮料和銅嘴都還能用。"}},
{l:"補好再用",c:K("m",7),ok:{oil:2,x:"你補好了破洞,裡面還剩一點氣。"},ng:{oil:-1,x:"補不上。你在這裡浪費了一口氣。"}},
{l:"順著它找主人",r:{san:-2,loot:1,x:"你找到了他。他的手裡,還緊緊抓著一件東西。"}}
]);
ev("t5_g","水底的鐘","一口青銅鐘倒扣在水底,鐘裡困著一團空氣。",[
{l:"鑽進鐘裡換氣",r:{oil:2,san:-1,x:"鐘的內壁刻著兩個字:別敲。"}},
{l:"敲鐘",r:{san:-3,loot:1,x:"鐘聲在水裡傳得很慢、很遠。有東西從遠處回應了它。"}},
{l:"取下鐘舌",c:K("m",7),ok:{loot:1,x:"鐘舌是鎏金的。"},ng:{hp:-1,x:"鐘舌脫落時砸到了你的手。"}}
]);
ev("t5_h","鰻群","一群長鰻繞著你的燈光打轉,越游越近。",[
{l:"用刀驅趕",c:K("b",7,"water"),ok:{x:"你揮了幾刀,鰻群散開了。"},ng:{hp:-2,x:"一條鰻咬住了你的小腿。"}},
{l:"丟下乾糧引開牠們",need:{food:1},r:{food:-1,x:"鰻群追著乾糧遊走了。"}},
{l:"熄掉燈,摸黑游過去",r:{san:-2,x:"黑暗裡,有好幾次,有東西擦過你的臉。"}}
]);
ev("t5_i","頭頂的光","頭頂有一圈亮光,看起來像是水面。",[
{l:"往上游",r:{oil:-2,san:-2,x:"你游上去,撞到的是一面銅鏡。鏡子裡的你,還在往上游。"}},
{l:"先看清楚",c:K("a",7),ok:{oil:1,x:"光是從側面折過來的。你順著光源,找到了真正的氣室。"},ng:{oil:-1,x:"你看了很久,還是分不清。"}}
]);

/* ===== 無名墓:回聲(隨機兩間) ===== */
ev("t6_c","鏡中的隊伍","一面落地銅鏡。鏡子裡的隊伍,比你們多一個人,走在最後面。",[
{l:"回頭看",r:{san:-3,x:"你回頭了。身後什麼都沒有。再看鏡子,那個人往前走了一步。"}},
{l:"對鏡子裡的人點點頭",r:{virtue:1,san:-1,st:{jin:1},x:"鏡子裡的人也點了點頭。他戴著斗笠。"}},
{l:"打碎鏡子",r:{hp:-1,san:-1,x:"鏡子碎了。每一片碎片裡,都只有他一個人。"}}
],{ghost:1});
ev("t6_d","師父的燈","台階上擺著一盞熟悉的油燈,燈座上刻著三道痕。燈還亮著。",[
{l:"拿起燈",r:{oil:4,san:1,x:"燈握在手裡是溫的,就像剛有人放下。"}},
{l:"吹熄它",r:{san:-2,x:"燈滅了。黑暗裡,你聽見有人很輕地嘆了口氣。"}},
{l:"留著它",r:{virtue:1,x:"你沒碰它。走出很遠以後,回頭還看得到那一點光。"}}
]);
ev("t6_e","七張椅子","一張石桌,七張椅子。四張椅子上坐著骸骨,身上是三十年前的衣服;另外三張是空的。",[
{l:"坐上一張空椅子",r:{hp:2,san:-3,x:"你坐下來,疲憊一下子全消了。你差點就不想再站起來。"}},
{l:"數一數骸骨",r:{st:{truth:1},san:-1,clue:"無名墓的石桌旁坐著四具三十年前的骸骨。七人隊裡走出去的,只有三個。",x:"四具。加上三張空椅子,正好七個。"}},
{l:"繞過石桌",r:{x:"你們誰都沒有坐下。"}}
],{ghost:1});


/* ===== v2.3 江湖事件擴充(6 → 15) ===== */
ev("j7","茶館裡的傳聞","茶館的說書人今天講的,是一個「從古墓裡全身而退的年輕人」。你聽著聽著,發現他講的就是你。",[
{l:"上前塞錢,請他別再講了",r:{money:-60,wanted:-1,x:"說書人收了錢,下一場改講狐仙。"}},
{l:"坐著聽完,順便記下他從哪聽來的",c:K("n",7),ok:{sk:{n:1},x:"你順藤摸瓜,找出了在外面替你吹噓的同行。"},ng:{wanted:1,x:"你問得太多,反而讓旁人起了疑心。"}},
{l:"由他去講",r:{wanted:1,money:80,x:"名聲傳開了,找上門的生意也多了。只是,盯著你的人也多了。"}}
]);
ev("j8","門縫裡的包裹",function(S){return "清晨,門縫裡塞著一個油紙包。打開來是一小罐燈油,罐底刻著三道痕。"+(S.st&&S.st.jin>=1?"你想起了燼。":"")},[
{l:"收下燈油",r:{flag:"extraOil",st:{jin:1},x:"燈油的味道很淡,點起來幾乎沒有煙。"}},
{l:"把罐子放回門口",r:{virtue:1,x:"第二天,罐子不見了。門口留下一小撮泥土。"}},
{l:"順著泥腳印找過去",c:K("f",7),ok:{st:{jin:1},clue:"送燈油的人在城外的破廟落腳。牆上同樣刻著三道痕。",x:"腳印在城外的破廟前斷了。廟牆上,刻著三道痕。"},ng:{x:"腳印在大路上就斷了。"}}
]);
ev("j9","古董圈的鑑定會","古董圈辦了一場私下的鑑定會,有人拿出一件「漢代玉璧」,現場叫價已經喊到一千。",[
{l:"上前細看",c:K("a",8),ok:{money:200,sk:{a:1},x:"你當眾指出那是仿品。藏家們記住了你的眼力,私下塞了你一筆謝禮。"},ng:{money:-100,x:"你看走了眼,還跟著喊了價。"}},
{l:"跟著喊價",r:function(S){return Math.random()<.35?{money:600,x:"你買下後轉手,賺了一筆。"}:{money:-300,x:"你買下的,是一塊染過色的石頭。"}}},
{l:"只看不說",r:{sk:{n:1},x:"你在角落把每個買家的臉都記了下來。"}}
]);
ev("j10","高燒","上一趟下墓回來,你發了三天高燒,夢裡全是墓道。",[
{l:"好好休養",r:{hp:4,san:2,money:-80,x:"你在床上躺了好幾天。醒來的時候,窗外已經換了季節。"}},
{l:"硬撐著繼續準備",r:{hp:-2,money:100,x:"你接了一筆小生意。身體在抗議,但錢是真的。"}},
{l:"找郎中開藥",need:{herb:1},r:{herb:-1,hp:3,san:1,x:"藥很苦,但第二天你就能下床了。"}}
]);
ev("j11","拜師的少年","一個十四五歲的少年跪在你門口,說他想學「地底下的本事」。",[
{l:"收他當跑腿,不教真本事",r:{money:-30,sk:{n:1},x:"少年很勤快,替你打聽了不少消息。"}},
{l:"勸他去讀書",r:{virtue:2,money:-50,x:"你塞給他一點學費。他走的時候,回頭看了你好幾次。"}},
{l:"把你會的都教給他",r:{virtue:-1,loyal:{zhou:2},x:"他學得很快。快得讓你有點害怕。"}}
]);
ev("j12","文物單位的人","一個戴眼鏡的年輕人上門,自稱是文物單位的研究員。他說,他想找懂行的人幫忙。",[
{l:"幫他看幾件東西",c:K("a",7),ok:{virtue:1,wanted:-1,money:100,x:"你替他鑑定了幾件文物。臨走前,他說:「有需要,隨時來找我。」"},ng:{x:"你看了半天,說不出所以然。他客氣地道謝離開了。"}},
{l:"推說不懂",r:{x:"他看了你一眼,沒有拆穿你。"}},
{l:"跟他說你知道一座墓",r:{virtue:2,wanted:-2,money:-50,x:"你把一座小墓的位置告訴了他。那座墓,後來被好好地保護了起來。"}}
]);
ev("j13","隊友家裡出事",function(S){return "你常合作的夥伴託人捎來口信:家裡出了事,急需一筆錢。"},[
{l:"二話不說,送錢過去",r:{money:-200,virtue:1,loyal:{old:1,lian:1,prof:1,fat:1,mo:1,zhou:1,tie:1,yao:1},x:"消息傳得很快。行裡的人都知道,你是講義氣的。"}},
{l:"借他,但要他下次少分一點",r:{money:-200,loyal:{fat:-1,tie:-1},x:"他答應了,只是笑得有點勉強。"}},
{l:"說最近手頭也緊",r:{loyal:{old:-1,lian:-1,prof:-1,fat:-1,mo:-1,zhou:-1,tie:-1,yao:-1},x:"你省下了錢。下次組隊時,有幾個人回訊息回得特別慢。"}}
]);
ev("j14","藏寶圖","市集角落,一個老頭兜售一張「祖傳藏寶圖」,開價三百。",[
{l:"買下",r:function(S){return Math.random()<.25?{money:-300,flag:"intel",x:"圖居然是真的,上面畫的是下一座墓的捷徑。"}:{money:-300,x:"圖上的地形,跟你家巷口一模一樣。"}}},
{l:"先驗紙張和墨色",c:K("a",7),ok:{x:"紙是新的,墨是今年的。你把圖還給了他。"},ng:{money:-300,x:"你被老頭的說詞打動,買了下來。後來才發現,那是一張舊地圖的影印本。"}},
{l:"轉身離開",r:{x:"老頭在你背後喊:「後悔別來找我!」"}}
]);
ev("j15","雨夜敲門","下大雨的夜裡,有人敲你的門。一下,兩下,三下。停了很久,又是三下。",[
{l:"開門",r:function(S){return S.st&&S.st.jin>=1?{st:{jin:1},san:-1,clue:"雨夜裡來敲門的是燼。他說:「今年的燈,快燒完了。」",x:"門外站著燼,渾身濕透。他什麼也沒說,只是借了你的屋簷站到天亮。"}:{san:-2,x:"門外沒有人。門檻上,有三道濕淋淋的刻痕。"}}},
{l:"隔著門問是誰",r:{san:-1,x:"沒有人回答。敲門聲停了,地板上,水從門縫一點一點滲進來。"}},
{l:"點亮所有的燈,坐到天亮",r:{san:1,money:-20,x:"你一夜沒睡。天亮時,雨停了,門口什麼都沒有。"}}
]);

/* ===== v2.3 主線後續(每卷多一段) ===== */
ev("s1b","裴先生的鋪子","幾天後,裴先生請你到他的古董鋪喝茶。內室的牆上,掛滿了刻著燈紋的物件。「這些,都是我花了二十年,一件一件收回來的。」",[
{l:"答應替他找一件燈紋物件",r:{st:{pei:1},money:200,x:"他預付了一筆錢,笑得很溫和:「不急,下墓的時候留意就好。」"}},
{l:"問他為什麼收這些",c:K("n",7),ok:{st:{truth:1},clue:"裴先生收藏的燈紋物件,全都出自三十年前那支七人隊。",x:"他沉默了一下:「我父親,也是那七個人之一。」"},ng:{x:"他笑而不答,替你斟滿了茶。"}},
{l:"藉口有事,先走了",r:{st:{pei:-1},x:"你走出門時,背後的風鈴響了很久。"}}
],{vol:"卷一 · 三道刻痕(續)"});
ev("s2b","窗外的人","那天夜裡,你醒來時,看見燼坐在窗台上,望著月亮。「你師父也常這樣睡不著。」他說。",[
{l:"把剩下的乾糧分給他",r:{st:{jin:1},food:-1,x:"他接過乾糧,咬了一口,說:「三十年沒吃過熱的了。」"}},
{l:"問他三十年前發生了什麼",c:K("g",7),ok:{st:{truth:1,jin:1},clue:"燼說:七個人進了無名墓,出來三個。他留下了,是因為有人把他的名字寫進了燈簿。",x:"他講得很慢,像是在回想一個很久以前的夢。"},ng:{san:-1,x:"他轉頭看你。月光底下,他的影子是空的。你沒敢再問。"}},
{l:"悄悄寫信告訴裴先生",need:{st:{pei:1}},r:{st:{pei:1,jin:-1},x:"天亮時,窗台上多了三道刻痕,很深,像是用指甲刻的。"}}
],{vol:"卷二 · 七人出行圖(續)"});
ev("s3b","洪三爺的宴","洪三爺派人送來請帖,說要請你吃頓飯,「把誤會說開」。宴席擺在城裡最大的酒樓。",[
{l:"赴宴,當面把話說清楚",c:K("n",8),ok:{st:{hong:-1},money:150,x:"你們喝了三杯。洪三爺拍著你的肩說:「年輕人,有種。」"},ng:{st:{hong:1},hp:-1,x:"話不投機。你走出酒樓時,後巷有人在等你。"}},
{l:"託病不去",r:{st:{hong:1},x:"洪三爺的人把請帖原封不動地退了回來,上面多了一個指印。"}},
{l:"帶裴先生一起去",need:{st:{pei:1}},r:{st:{pei:1,hong:-1},x:"裴先生和洪三爺像是舊識。整頓飯,他們聊的都是三十年前的事。"}}

  S.karmaDone=1;const k=S.tm;let t;

  else if(k>=3){S.san=Math.max(1,S.san-1);t="你走出墓門,背後的經幡一齊停了下來。你說不上來哪裡不對。(理智 -1)";AUD.sanity()}
  else if(k<=1){S.virtue=Math.min(10,S.virtue+2);S.hp=hpMax();S.san=Math.min(sanMax(),S.san+3);t="加持。走出墓門時雪停了,陽光照在山頂上,身上的傷都不痛了。(陰德 +2、體力回滿、理智 +3)";AUD.gong()}
  else t="你走出墓門,風雪如常。山沒有怪你,也沒有謝你。";
  return interlude("業力 "+k+" · "+t,tombExit,"下山");
 }
 if(fatSkim(tombExit))return;
 S.phase="exit";saveProgress();
 S.tombsDone++;
 lifeExit();

 h+='<div class="cat">交給誰?</div>';

 h+=B('黑商換物 <small>不拿錢,換乾糧、藥材、材料(每 200 估價 1 點)</small>',function(){barter(total)});
 h+=B('文物單位 <small>只拿補助(×0.3),通緝 -1,陰德 +2</small>',function(){chooseChannel("mus",total)});
 show(h,acts);

let ACH_Q=[],ACH_T=null;
function achOf(id){return ACH.filter(function(a){return a.id===id})[0]}
function unlock(id){
 CODEX.ach=CODEX.ach||{};if(CODEX.ach[id]||!achOf(id))return;
 CODEX.ach[id]=Date.now();if(!CODEX.title)CODEX.title=id;saveCodex();
 if(S){S.achRun=S.achRun||[];S.achRun.push(id)}
 ACH_Q.push(id);if(!ACH_T)nextToast();
}
function nextToast(){
 const t=$("achToast"),id=ACH_Q.shift();
 if(!t||!id){ACH_T=null;return}
 const a=achOf(id);
 t.innerHTML='<div class="at-k">成就解鎖</div><div class="at-n">'+a.n+'</div><div class="at-d">'+a.d+' · 獲得稱號「'+a.t+'」</div>';
 t.classList.add("on");AUD.gong(.05);
 ACH_T=setTimeout(function(){t.classList.remove("on");ACH_T=setTimeout(nextToast,350)},2600);
}
function titleBadge(){const a=CODEX.title&&achOf(CODEX.title);return a?'<div class="title-badge">稱號 · '+a.t+'</div>':""}
function achResult(e,out,chk,roll){
 if(out.why&&out.why.ok){CODEX.ruleOk=CODEX.ruleOk||{};CODEX.ruleOk[e.id]=1;saveCodex();if(e.id==="r1")unlock("noturn");if(["r1","r2","r3","r4","r5","r6","r8"].every(function(r){return CODEX.ruleOk[r]}))unlock("rules")}
 if(chk==="機關破解成功"&&PZKIND){CODEX.pz=CODEX.pz||{};CODEX.pz[PZKIND]=1;saveCodex();if(["magic","slide","mirror","beast"].every(function(k){return CODEX.pz[k]}))unlock("puzzles")}
 if(roll){
  S.dajiStreak=roll.roll===6?(S.dajiStreak||0)+1:0;if(S.dajiStreak>=2)unlock("daji");
  if(roll.roll===1){S.daxiong=(S.daxiong||0)+1;if(S.daxiong>=3)unlock("daxiong")}
 }
}
function achHtml(){
 CODEX.ach=CODEX.ach||{};
 const got=ACH.filter(function(a){return CODEX.ach[a.id]}).length;
 return'<p class="dim">已解鎖 '+got+'/'+ACH.length+'。點選已解鎖的成就,可以把它的稱號掛在名字前面。</p>';
}

/* ===== v2.7 路線:前三座固定,第 4~6 座從其餘五座隨機抽,無名墓第七座 ===== */
const FIXED_FIRST=3;
function makeRoute(){
 const last=TOMBS.length-1,mid=[];for(let i=FIXED_FIRST;i<last;i++)mid.push(i);
 return [0,1,2].concat(shuffle(mid).slice(0,3),[last]);
}
function legacyRoute(){return [0,1,2,3,4,5+rnd(3),TOMBS.length-1]}
function curTomb(){if(!S.route)S.route=legacyRoute();return TOMBS[S.route[Math.min(S.round,S.route.length)-1]]}
function routeLine(){
 if(!S.route)return"";
 return'<div class="route">'+S.route.map(function(ti,i){
  const t=TOMBS[ti],r=i+1,c=r<S.round?"done":r===S.round?"cur":"todo";
  const nm=(r<=S.round||i<FIXED_FIRST||i===S.route.length-1)?t.n.replace(/\(.*\)/,""):"？？？";
  return'<span class="rt '+c+'">'+nm+'</span>';
 }).join('<i>›</i>')+'</div>';
}


/* ==========================================================
   v2.9 隊友人生線
   遊戲會記住你和每位隊友之間發生的事(一起下過幾座墓、分帳、
   冷落、賣黑市),條件成熟時,他們的人生事件會在江湖階段出現。
   ========================================================== */
const CP_STATUS={left:"已離隊",expelled:"被你趕走",broke:"與你決裂",dead:"已過世",retired:"歸隱"};
function cp(id){S.cp=S.cp||{};return S.cp[id]=S.cp[id]||{tombs:0,neglect:0,fair:0,solo:0,hired:0,mem:[]}}
function cpMem(id,t){const c=cp(id);c.mem.push({r:S.round,t:t.replace("{tomb}",S.tomb?S.tomb.n:"墓裡")});if(c.mem.length>12)c.mem.shift()}
function cpGone(id){return !!(S.cp&&S.cp[id]&&S.cp[id].gone)}
function cpApply(o,ch){
 for(const id in o){
  const c=cp(id),v=o[id];
  if(v.mem)cpMem(id,v.mem);
  if(v.fate)c.fate=v.fate;
  if(v.set)Object.assign(c,v.set);
  if(v.returnLoot&&c.stolen){S.loot.push(c.stolen);ch.push('<span class="it">取回 '+c.stolen.n+'</span>');c.stolen=null}
  if(v.gone){c.gone=v.gone;const i=S.team.indexOf(id);if(i>=0)S.team.splice(i,1);ch.push('<span class="dn">'+TEAM[id].n+' · '+CP_STATUS[v.gone]+'</span>')}
 }
}
/* 出發時:一起下墓的次數、被冷落的次數 */
function cpOnDepart(){
 Object.keys(TEAM).forEach(function(id){
  const c=cp(id);if(c.gone)return;
  if(S.team.indexOf(id)>=0){c.tombs++;c.hired=1;c.neglect=0;c.lastRound=S.round;if(c.tombs===1){c.firstTomb=S.tomb.n;cpMem(id,"第一次和你一起下墓,去的是{tomb}。")}}
  else if(c.hired)c.neglect++;
 });
 S.fatChecked=0;
}
function cpShare(kind){S.team.forEach(function(id){const c=cp(id);if(kind==="fair")c.fair++;else c.solo++})}
function cpBlack(){S.blackSales=(S.blackSales||0)+1;const c=cp("prof");if(c.promise&&!c.broken){c.broken=1;cpMem("prof","你答應過教授不再賣給黑市,但你還是賣了。")}}

/* 每輪江湖階段:檢查有沒有隊友的人生事件該發生(一輪最多一件) */
function cpPending(){
 S.cpDone=S.cpDone||{};
 const c=cp,L=function(id){return S.loyal[id]===undefined?5:S.loyal[id]},done=function(k){return S.cpDone[k]};
 const rules=[
  ["c_old_legacy",function(){return S.round>=5&&!cpGone("old")&&c("old").tombs>=3&&L("old")>=6}],
  ["c_old_letter",function(){return S.round>=5&&!cpGone("old")&&c("old").tombs>=1&&!done("c_old_legacy")}],
  ["c_fat_reveal",function(){return !cpGone("fat")&&c("fat").stage==="hidden"&&S.round>c("fat").stolenRound}],
  ["c_prof_break",function(){return !cpGone("prof")&&c("prof").tombs>=1&&((S.blackSales||0)>=3||c("prof").broken)}],
  ["c_lian_leave",function(){return !cpGone("lian")&&c("lian").hired&&c("lian").neglect>=2}],
  ["c_mo_secret",function(){return !cpGone("mo")&&c("mo").tombs>=3}],
  ["c_prof_warn",function(){return !cpGone("prof")&&c("prof").tombs>=1&&(S.blackSales||0)>=2&&!done("c_prof_break")}],
  ["c_prof_teach",function(){return !cpGone("prof")&&c("prof").tombs>=2&&(S.donated||0)>=2}],
  ["c_lian_quest",function(){return !cpGone("lian")&&c("lian").tombs>=3&&L("lian")>=6}],
  ["c_fat_good",function(){return !cpGone("fat")&&!c("fat").stolenEver&&(c("fat").fair>=3||c("fat").stage==="forgiven")}],
  ["c_zhou_grow",function(){return !cpGone("zhou")&&c("zhou").tombs>=2}],
  ["c_tie_injury",function(){return !cpGone("tie")&&c("tie").tombs>=2}],
  ["c_yao_clinic",function(){return !cpGone("yao")&&c("yao").tombs>=2}]
 ];
 for(const r of rules)if(!done(r[0])&&r[1]()){S.cpDone[r[0]]=1;return r[0]}
 return null;
}

/* 胖叔私吞:出墓時檢查 */
function fatSkim(next){
 const f=cp("fat");
 if(S.fatChecked||S.team.indexOf("fat")<0||f.gone||S.loot.length<2||(S.cpDone&&(S.cpDone.c_fat_caught||f.stolenEver)))return false;
 if(!(f.solo>=1||(S.loyal.fat!==undefined&&S.loyal.fat<=3)))return false;
 S.fatChecked=1;if(Math.random()>.7)return false;
 let bi=0;S.loot.forEach(function(it,i){if(it.v>S.loot[bi].v)bi=i});
 f.stolen=S.loot.splice(bi,1)[0];f.stolenEver=1;f.stolenRound=S.round;
 const chk=doCheck({s:"a",d:7});
 S.cpDone=S.cpDone||{};
 if(chk.ok){S.cpDone.c_fat_caught=1;playEvent(E.c_fat_caught,{head:function(){return'<div class="cat" style="margin-top:6px">人情 · 胖叔</div>'},sub:chk.txt,nav:function(){return[{l:"走出墓穴",cls:"main",f:next}]}});return true}
 f.stage="hidden";cpMem("fat","在{tomb},你帶出來的東西少了一件,但你沒有發現。");
 return false;
}

}

PZ.slide=function(e,ctx){

 do{t=goal.slice();prev=-1;for(let k=0;k<24;k++){const z=t.indexOf(0),n=pick(nbs(z).filter(x=>x!==prev));prev=z;t[z]=t[n];t[n]=0}}while(t.join()===goal.join());
 let left=60;
 const NUM=["","壹","貳","參","肆","伍","陸","柒","捌"];
 function draw(){SCREEN_KEY="pz";
  const acts=[],B=Bk(acts),P=pzKit(acts);

  const z=t.indexOf(0),can=nbs(z);

function checkMods(c){

 let cover=c.t&&coverTags().indexOf(c.t)>=0?2:0;
 if(S.flags.cross&&["poison","trap","water"].indexOf(c.t)>=0)cover+=1;
 const mate=S.team.some(id=>TEAM[id].sk===c.s&&S.loyal[id]>0)?1:0;

 const dc=c.d+(S.tomb&&S.tomb.dc?S.tomb.dc:0)+alert;
 return {base,gear,cover,mate,dark,dc,bonus:base+gear+cover+mate+dark};
}

 let p=Math.max(0,Math.min(1,(7-need)/6));

 return Math.round(p*100);
}

 }
 LASTROLL={roll:roll,ok:ok};
 let alx="";
 if(!ok&&TM()&&TM().k==="alert"&&S.tm<TM().max){S.tm++;alx="(警戒 +1)"}
 const parts=[SK[c.s]+" "+z.base];
 if(z.gear)parts.push("裝備 +"+z.gear);
 if(z.cover)parts.push("護具 +"+z.cover);

/* ==========================================================
   v2.2 氛圍音樂與音效層(Web Audio 即時合成,不需任何音檔)
   - 每個場景有自己的背景音:標題、江湖、九座墓各一種、結局
   - 判定、骰子、戰利品、受傷、理智下降、燈滅、塌方、規則房低語等音效

   - 右下角喇叭按鈕可開關、調整音樂與音效音量(會記住設定)
   ========================================================== */
const AUD=(function(){
 const KEY="tomb_sim_audio_v1";
 const cfg={on:true,music:.55,sfx:.8};
 try{Object.assign(cfg,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
 let ctx=null,master,musicBus,sfxBus,verb,analyser,NB=null,cur=null,sceneName="",pending="title",dread=null;
 const api={mode:""};
 function save(){try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}}
 function now(){return ctx.currentTime}
 function ready(){return ctx&&cfg.on&&ctx.state==="running"}

 /* ---------- 基礎 ---------- */
 function init(){
  if(ctx){if(cfg.on&&ctx.state==="suspended")ctx.resume();return true}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  try{ctx=new AC()}catch(e){return false}
  master=ctx.createGain();master.gain.value=1;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=4;
  comp.connect(master);master.connect(ctx.destination);
  analyser=ctx.createAnalyser();analyser.fftSize=512;master.connect(analyser);
  musicBus=ctx.createGain();musicBus.gain.value=cfg.music;musicBus.connect(comp);
  sfxBus=ctx.createGain();sfxBus.gain.value=cfg.sfx;sfxBus.connect(comp);
  verb=ctx.createConvolver();verb.buffer=impulse(3.2,2.6);
  const vg=ctx.createGain();vg.gain.value=.4;verb.connect(vg);vg.connect(comp);
  if(!cfg.on)ctx.suspend();else if(ctx.state==="suspended")ctx.resume();
  setScene(pending);updateDread();
  return true;
 }
 function nbuf(){
  if(NB)return NB;
  const len=ctx.sampleRate*2;NB=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  return NB;
 }
 function impulse(sec,dec){
  const r=ctx.sampleRate,len=Math.floor(r*sec),b=ctx.createBuffer(2,len,r);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec)}
  return b;
 }
 function send(v){const g=ctx.createGain();g.gain.value=v;g.connect(verb);return g}
 function env(g,t,a,peak,dur){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
 function osc(type,f,t,dur,peak,dest,o){
  o=o||{};const s=ctx.createOscillator(),g=ctx.createGain();
  s.type=type;s.frequency.setValueAtTime(f,t);
  if(o.to)s.frequency.exponentialRampToValueAtTime(o.to,t+(o.glide||dur));
  if(o.detune)s.detune.value=o.detune;
  env(g,t,o.a||.005,peak,dur);s.connect(g);let out=g;
  if(o.lp){const fl=ctx.createBiquadFilter();fl.type="lowpass";fl.frequency.value=o.lp;g.connect(fl);out=fl}
  out.connect(dest||sfxBus);if(o.verb)out.connect(send(o.verb));
  s.start(t);s.stop(t+dur+.1);
 }
 function nz(t,dur,peak,type,freq,q,dest,o){
  o=o||{};const s=ctx.createBufferSource();s.buffer=nbuf();s.loop=true;
  const f=ctx.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);
  if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);f.Q.value=q||1;
  const g=ctx.createGain();env(g,t,o.a||.005,peak,dur);
  s.connect(f);f.connect(g);g.connect(dest||sfxBus);if(o.verb)g.connect(send(o.verb));
  s.start(t,Math.random()*1.5);s.stop(t+dur+.1);
 }

 /* ---------- 樂器與環境聲 ---------- */
 const PENTA=[146.83,174.61,196,220,261.63,293.66,349.23,392];
 function pluck(f,t,v,dest){
  osc("triangle",f,t,2.4,v,dest||musicBus,{a:.004,lp:1500,verb:.6,to:f*.996});
  osc("sine",f*2,t,1.1,v*.3,dest||musicBus,{a:.004,verb:.4});
 }
 function bell(t,base,v,dest){[1,2.76,5.4,8.93].forEach(function(p,i){osc("sine",base*p,t,3.2/(1+i*.6),v/(1+i*1.4),dest,{a:.003,verb:.7})})}
 function drip(t,dest){const f=1300+Math.random()*1000;osc("sine",f,t,.14,.07,dest,{to:f*.45,glide:.1,verb:.9})}
 function bubbles(t,dest){const n=2+Math.floor(Math.random()*4);for(let i=0;i<n;i++){const f=250+Math.random()*350;osc("sine",f,t+i*.07,.09,.05,dest,{to:f*3.5,glide:.08})}}
 function whisperAt(t,dest,v){nz(t,1.8,v||.05,"bandpass",1300+Math.random()*1200,4,dest,{a:.7,verb:.6,to:900+Math.random()*900})}
 function metal(t,dest){const n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++)nz(t+i*.11,.05,.05,"bandpass",3500+Math.random()*2500,8,dest,{verb:.7})}
 function crumble(t,dest){nz(t,.8,.08,"lowpass",420,1,dest,{a:.05,verb:.5})}

 function drone(c,freqs,type,vol,lp,rate){
  freqs.forEach(function(f,i){
   const s=ctx.createOscillator();s.type=type||"sine";s.frequency.value=f;s.detune.value=i%2?7:-7;
   const fl=ctx.createBiquadFilter();fl.type="lowpass";fl.frequency.value=lp||600;
   const g=ctx.createGain();g.gain.value=vol;
   const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=(rate||.07)*(1+i*.31);lg.gain.value=vol*.6;
   l.connect(lg);lg.connect(g.gain);s.connect(fl);fl.connect(g);g.connect(c.g);
   s.start();l.start();c.srcs.push(s,l);
  });
 }
 function wind(c,vol,center,q){
  const s=ctx.createBufferSource();s.buffer=nbuf();s.loop=true;
  const f=ctx.createBiquadFilter();f.type="bandpass";f.frequency.value=center;f.Q.value=q||.7;
  const g=ctx.createGain();g.gain.value=vol;
  const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=.04+Math.random()*.05;lg.gain.value=center*.45;l.connect(lg);lg.connect(f.frequency);
  const l2=ctx.createOscillator(),lg2=ctx.createGain();l2.frequency.value=.09+Math.random()*.05;lg2.gain.value=vol*.7;l2.connect(lg2);lg2.connect(g.gain);
  s.connect(f);f.connect(g);g.connect(c.g);s.start();l.start();l2.start();c.srcs.push(s,l,l2);
 }
 function every(c,min,max,fn){
  const tick=function(){if(c.dead)return;if(ready())fn(now()+.05);c.timers.push(setTimeout(tick,(min+Math.random()*(max-min))*1000))};
  c.timers.push(setTimeout(tick,(min*.4+Math.random()*min)*1000));
 }

 /* ---------- 場景配樂 ---------- */
 const SCENES={
  title:function(c){drone(c,[73.42,110],"triangle",.05,480,.05);every(c,3,6.5,function(t){const n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++)pluck(PENTA[Math.floor(Math.random()*PENTA.length)],t+i*.42,.09,c.g)})},
  surface:function(c){drone(c,[98,146.83],"sine",.04,420,.06);every(c,4.5,9,function(t){pluck(PENTA[2+Math.floor(Math.random()*6)],t,.07,c.g)})},
  story:function(c){drone(c,[73.42,110,146.83],"triangle",.035,520,.04);every(c,2.5,5,function(t){pluck(PENTA[Math.floor(Math.random()*5)],t,.08,c.g)})},
  end:function(c){drone(c,[55,82.4],"triangle",.045,380,.04);every(c,6,11,function(t){pluck(PENTA[Math.floor(Math.random()*4)],t,.06,c.g)})},
  /* 荒丘漢墓:土、水滴、偶爾落土 */
  tomb0:function(c){drone(c,[41.2,61.7],"sawtooth",.024,210);wind(c,.05,380);every(c,2.5,6,function(t){drip(t,c.g)});every(c,8,16,function(t){crumble(t,c.g)})},
  /* 唐墓:壁畫與鐘磬 */
  tomb1:function(c){drone(c,[46.25,69.3],"sawtooth",.02,240);wind(c,.035,340);every(c,3,7,function(t){drip(t,c.g)});every(c,7,14,function(t){bell(t,330+Math.random()*190,.035,c.g)});every(c,9,18,function(t){pluck(PENTA[Math.floor(Math.random()*4)],t,.05,c.g)})},
  /* 明墓:機關的金屬聲 */
  tomb2:function(c){drone(c,[43.65,65.4,92.5],"sawtooth",.018,220);wind(c,.03,300);every(c,2,5,function(t){drip(t,c.g)});every(c,4,9,function(t){metal(t,c.g)})},
  /* 沙漠:風沙與駝鈴 */
  tomb3:function(c){drone(c,[49,73.4],"triangle",.032,300);wind(c,.09,650,.5);wind(c,.035,1800,1.2);every(c,10,20,function(t){for(let i=0;i<3;i++)bell(t+i*.55,520,.025,c.g)})},
  /* 水下:悶住的低頻與氣泡 */
  tomb4:function(c){const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=700;c.g.disconnect();c.g.connect(lp);lp.connect(musicBus);
   drone(c,[36.7,55],"sine",.07,200,.05);wind(c,.045,240);every(c,.8,3,function(t){bubbles(t,c.g)});every(c,7,13,function(t){osc("sine",190,t,4,.03,c.g,{to:120,a:1.2,verb:.8})})},
  /* 無名墓:不和諧的低鳴與低語 */
  tomb5:function(c){drone(c,[41.2,43.65,58.27],"sawtooth",.02,260,.05);wind(c,.03,480);every(c,4,9,function(t){whisperAt(t,c.g,.045)});every(c,5,10,function(t){drip(t,c.g)});every(c,12,22,function(t){bell(t,196,.03,c.g)})}
  /* 戰國將軍墓:戰鼓、兵器、遠處的號角 */
  ,war:function(c){drone(c,[38.9,58.3],"sawtooth",.022,200);wind(c,.03,300);every(c,3.5,7,function(t){osc("sine",72,t,.5,.22,c.g,{to:44});nz(t,.3,.1,"lowpass",160,1,c.g);osc("sine",72,t+.36,.45,.16,c.g,{to:44})});every(c,5,11,function(t){metal(t,c.g)});every(c,12,24,function(t){osc("sawtooth",110,t,2.8,.022,c.g,{lp:520,a:.8,verb:.8,to:103})})}
  /* 蓬萊墓:浪聲與東洋音階 */
  ,penglai:function(c){drone(c,[55,82.4],"sine",.04,300,.05);every(c,4,7,function(t){nz(t,3.2,.08,"lowpass",520,1,c.g,{a:1.3,verb:.4,to:200})});every(c,3,7,function(t){const s=[146.83,155.56,196,220,233.08,293.66];pluck(s[Math.floor(Math.random()*s.length)],t,.06,c.g)});every(c,7,13,function(t){bell(t,880,.018,c.g)})}
  /* 藏王墓:低沉的誦聲、頌缽與風雪 */
  ,tibet:function(c){drone(c,[49,73.4,98],"sawtooth",.016,180,.03);drone(c,[65.4],"triangle",.03,300,.04);wind(c,.06,900,.6);every(c,6,12,function(t){osc("sine",293.7,t,4.8,.04,c.g,{a:.02,verb:.8});osc("sine",293.7*2.71,t,3,.014,c.g,{a:.02,verb:.8})});every(c,9,18,function(t){for(let k=0;k<3;k++)osc("sine",1250+k*90,t+k*.12,.9,.012,c.g,{verb:.7})})}
 };
 function setScene(name){
  if(!ctx){pending=name;return}
  if(name===sceneName)return;
  sceneName=name;
  const old=cur;
  if(old){old.dead=true;old.timers.forEach(clearTimeout);old.g.gain.setTargetAtTime(0,now(),.7);setTimeout(function(){old.srcs.forEach(function(s){try{s.stop()}catch(e){}});try{old.g.disconnect()}catch(e){}},4000)}
  const g=ctx.createGain();g.gain.value=.0001;g.gain.setTargetAtTime(name.indexOf("tomb")===0?2.4:1,now()+.1,1.2);g.connect(musicBus);
  cur={g:g,srcs:[],timers:[],dead:false,name:name};
  (SCENES[name]||SCENES.surface)(cur);
 }
 function sceneFor(){
  if(api.mode)return api.mode;
  if(typeof S==="undefined"||!S)return"title";
  if(S.tomb){
   if(S.tomb.delve)return"tomb"+(Math.floor((S.ri||0)/4)%6);
   if(S.tomb.snd)return S.tomb.snd;const i=TOMBS.indexOf(S.tomb);return"tomb"+(i<0?0:i);
  }
  return"surface";
 }

 /* ---------- 理智過低:心跳與耳鳴 ---------- */
 function beat(t,v){osc("sine",58,t,.16,v||.3,sfxBus,{to:38});osc("sine",52,t+.24,.14,(v||.3)*.7,sfxBus,{to:36})}
 function updateDread(){
  const want=!!(ctx&&!api.mode&&typeof S!=="undefined"&&S&&S.tomb&&S.san>0&&S.san<=3);
  if(want&&!dread){
   const s=ctx.createOscillator(),g=ctx.createGain();s.frequency.value=5200;g.gain.value=.0001;g.gain.setTargetAtTime(.006,now(),1.5);
   const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=.3;lg.gain.value=.004;l.connect(lg);lg.connect(g.gain);
   s.connect(g);g.connect(sfxBus);s.start();l.start();
   const iv=setInterval(function(){if(ready())beat(now()+.02,.22)},1150);
   dread={s:s,l:l,g:g,iv:iv};
  }else if(!want&&dread){
   const d=dread;dread=null;clearInterval(d.iv);d.g.gain.setTargetAtTime(0,now(),.4);
   setTimeout(function(){try{d.s.stop();d.l.stop()}catch(e){}},2000);
  }
 }

 /* ---------- 音效 ---------- */
 const fx={
  click:function(t){nz(t,.035,.05,"bandpass",2600,2)},
  stone:function(t){osc("sine",170,t,.14,.18,sfxBus,{to:85});nz(t,.06,.08,"lowpass",900)},
  shake:function(t){for(let i=0;i<10;i++)nz(t+i*.075+Math.random()*.02,.035,.11,"bandpass",1300+Math.random()*900,6)},
  dice:function(t){for(let i=0;i<5;i++)nz(t+i*.055+Math.random()*.025,.03,.12,"bandpass",2600+Math.random()*2200,3)},
  ok:function(t){[293.66,349.23,440].forEach(function(f,i){pluck(f,t+i*.11,.13,sfxBus)})},
  fail:function(t){osc("triangle",220,t,.6,.13,sfxBus,{to:104,lp:900});nz(t,.12,.08,"lowpass",300)},
  coin:function(t){osc("sine",1568,t,.5,.06,sfxBus,{verb:.4});osc("sine",2093,t+.07,.55,.05,sfxBus,{verb:.4});osc("sine",2637,t+.13,.4,.03,sfxBus,{verb:.4})},
  hurt:function(t){osc("sine",95,t,.35,.32,sfxBus,{to:42});nz(t,.18,.12,"lowpass",520)},
  sanity:function(t){[440,466.16,622.25].forEach(function(f){osc("sine",f,t,1.4,.04,sfxBus,{to:f*.7,a:.25,verb:.7})})},
  lampOut:function(t){nz(t,.5,.11,"highpass",3200,1,sfxBus,{to:700});osc("sine",80,t+.05,.45,.14,sfxBus,{to:50})},
  step:function(t){nz(t,.09,.11,"lowpass",230);nz(t+.33,.09,.09,"lowpass",210)},
  rumble:function(t){nz(t,1.9,.24,"lowpass",170,1,sfxBus,{a:.15,verb:.5});osc("sine",42,t,1.9,.18,sfxBus,{a:.15})},
  door:function(t){nz(t,1.1,.16,"lowpass",260,1,sfxBus,{a:.2,verb:.6});osc("sine",62,t,1.1,.12,sfxBus,{a:.2,to:48})},
  whisper:function(t){whisperAt(t,sfxBus,.08);whisperAt(t+.5,sfxBus,.06)},
  gong:function(t){[1,1.5,2.1,2.9,3.7].forEach(function(p,i){osc("sine",98*p,t,5/(1+i*.4),.12/(1+i),sfxBus,{a:.004,verb:.7})})},
  doom:function(t){osc("sine",58,t,3,.32,sfxBus,{to:28,a:.02});nz(t,2.2,.18,"lowpass",130,1,sfxBus,{verb:.8});[233.08,246.94].forEach(function(f){osc("sawtooth",f,t+.2,2.6,.03,sfxBus,{lp:700,a:.4,verb:.7})})},
  resolve:function(t){[220,261.63,293.66,392].forEach(function(f,i){pluck(f,t+i*.28,.12,sfxBus)})},
  phrase:function(t){[293.66,261.63,220,196].forEach(function(f,i){pluck(f,t+i*.38,.11,musicBus)})},

 };
 Object.keys(fx).forEach(function(k){api[k]=function(delay){if(!ready())return;try{fx[k](now()+.02+(delay||0))}catch(e){}}});

 /* ---------- 狀態變化 → 音效 ---------- */
 api.snap=function(){return(typeof S==="undefined"||!S)?null:{hp:S.hp,san:S.san,oil:S.oil,tm:S.tm,loot:(S.loot||[]).length,inTomb:!!S.tomb}};
 api.react=function(b,chk){
  if(!b||!ready())return;let d=0;chk=chk||"";
  if(chk.indexOf("判定")>=0){api.shake();d=.88;if(chk.indexOf("成功")>=0)api.ok(d);else api.fail(d);d+=.2}
  else if(chk.indexOf("機關破解成功")>=0){api.gong();d=.3}
  else if(chk.indexOf("機關破解失敗")>=0){api.fail();d=.2}
  if((S.loot||[]).length>b.loot)api.coin(d);
  if(S.hp<b.hp)api.hurt(d+.05);
  if(S.san<b.san)api.sanity(d+.1);
  if(b.inTomb&&b.oil>0&&S.oil<=0)api.lampOut(d);
 };
 api.sync=function(){const n=sceneFor();if(!ctx){pending=n;return}setScene(n);updateDread()};
 api.unlock=function(){if(!cfg.on)return;init()};
 api.level=function(){if(!analyser)return 0;const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);let s=0;for(const x of a)s+=x*x;return Math.sqrt(s/a.length)};
 api.state=function(){return{ctx:ctx?ctx.state:"none",scene:sceneName,dread:!!dread,cfg:Object.assign({},cfg)}};
 api.cfg=cfg;
 api.ending=function(id){if(["M1","M2","M3","G5"].indexOf(id)>=0)api.gong();else if(["W1","W2","W3","W4","L2","L3","L4","L5","J2"].indexOf(id)>=0)api.resolve();else api.doom()};
 api.room=function(b,cave){api.step();if(!b)return;if(cave)api.rumble(.2);else if(S.hp<b.hp)api.hurt(.35);if(S.san<b.san)api.sanity(.4);if(b.oil>0&&S.oil<=0)api.lampOut(.3)};
 api.setOn=function(v){cfg.on=!!v;save();if(cfg.on){init();if(ctx)ctx.resume()}else if(ctx)ctx.suspend();paintBtn()};
 api.setVol=function(k,v){cfg[k]=v;save();if(ctx){(k==="music"?musicBus:sfxBus).gain.setTargetAtTime(v,now(),.05)}};

 /* ---------- 喇叭按鈕與設定面板 ---------- */
 const ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
 const ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>';
 function paintBtn(){
  const b=document.getElementById("sndBtn"),t=document.getElementById("sndToggle");
  if(b){b.innerHTML=cfg.on?ICON_ON:ICON_OFF;b.classList.toggle("off",!cfg.on);b.setAttribute("aria-label",cfg.on?"聲音:開啟":"聲音:關閉")}
  if(t)t.textContent=cfg.on?"關閉聲音":"開啟聲音";
 }
 function buildUI(){
  const st=document.createElement("style");
  st.textContent="#sndBtn{position:fixed;right:12px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:30;width:42px;height:42px;border-radius:50%;border:1px solid #6b5533;background:#19140dd9;color:#efbd5b;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 4px 14px #0008;padding:0}#sndBtn svg{width:20px;height:20px}#sndBtn.off{color:#7d725f}#sndBtn:focus-visible{outline:3px solid #f0c56a;outline-offset:2px}"+
  "#sndPanel{position:fixed;right:12px;bottom:calc(154px + env(safe-area-inset-bottom));z-index:30;width:230px;background:#19140df5;border:1px solid #6b5533;border-radius:12px;padding:12px 14px;display:none;box-shadow:0 10px 30px #000b;font-size:13px;color:#e8dcc0}#sndPanel.on{display:block}#sndPanel b{color:#f0c56a;font-size:14px}#sndPanel label{display:flex;justify-content:space-between;margin:10px 0 2px;color:#c7b896}#sndPanel input[type=range]{width:100%;accent-color:#efbd5b}#sndPanel .sp-row{display:flex;justify-content:space-between;align-items:center}#sndPanel button{font:inherit;font-size:12px;border-radius:8px;border:1px solid #6b5533;background:#2a2116;color:#efd08a;padding:4px 10px;cursor:pointer}#sndPanel p{margin:8px 0 0;font-size:11px;color:#9f937b;line-height:1.5}";
  document.head.appendChild(st);
  const btn=document.createElement("button");btn.id="sndBtn";btn.type="button";
  const pn=document.createElement("div");pn.id="sndPanel";pn.setAttribute("role","dialog");pn.setAttribute("aria-label","聲音設定");
  pn.innerHTML='<div class="sp-row"><b>聲音</b><button type="button" id="sndToggle"></button></div>'+
   '<label for="sndMusic"><span>背景音樂</span><span id="sndMusicV"></span></label><input id="sndMusic" type="range" min="0" max="1" step="0.05">'+
   '<label for="sndSfx"><span>音效</span><span id="sndSfxV"></span></label><input id="sndSfx" type="range" min="0" max="1" step="0.05">'+
   '<p>聲音由瀏覽器即時合成。手機若沒有聲音,請確認沒有開啟靜音模式。</p>';
  document.body.appendChild(pn);document.body.appendChild(btn);
  const m=pn.querySelector("#sndMusic"),s=pn.querySelector("#sndSfx"),mv=pn.querySelector("#sndMusicV"),sv=pn.querySelector("#sndSfxV");
  const pct=function(v){return Math.round(v*100)+"%"};
  m.value=cfg.music;s.value=cfg.sfx;mv.textContent=pct(cfg.music);sv.textContent=pct(cfg.sfx);
  m.addEventListener("input",function(){api.setVol("music",+m.value);mv.textContent=pct(+m.value)});
  s.addEventListener("input",function(){api.setVol("sfx",+s.value);sv.textContent=pct(+s.value)});
  s.addEventListener("change",function(){api.coin()});
  pn.querySelector("#sndToggle").addEventListener("click",function(){api.setOn(!cfg.on)});
  btn.addEventListener("click",function(){pn.classList.toggle("on")});
  document.addEventListener("click",function(ev){if(!pn.contains(ev.target)&&ev.target!==btn&&!btn.contains(ev.target))pn.classList.remove("on")});
  paintBtn();
  const unlock=function(){api.unlock()};
  ["pointerdown","touchend","click","keydown"].forEach(function(n){document.addEventListener(n,unlock,true)});
  document.addEventListener("pointerdown",function(ev){
   const el=ev.target&&ev.target.closest?ev.target.closest(".pzc,.btn"):null;
   if(!el||el.disabled)return;
   if(el.classList.contains("pzc"))api.stone();else api.click();
  },true);
  document.addEventListener("visibilitychange",function(){if(!ctx)return;if(document.hidden)ctx.suspend();else if(cfg.on)ctx.resume()});
 }
 if(typeof document!=="undefined"&&document.body&&document.head&&typeof window!=="undefined"&&!window.__TEST__)buildUI();
 return api;
})();


if(typeof document!=="undefined"&&document.getElementById("app")&&!window.__TEST__)renderTitle();
</script>
</body>
</html>
