<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>冒險者的人生 Adventurer's Life</title>
<meta name="description" content="奇幻人生模擬 × RPG × 抽卡 × 經營 × Roguelike">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#111827; --card:#1F2937; --card2:#273244; --gold:#D4AF68; --gold2:#b8934f; --text:#F3EBDD; --sub:#AAB4C4;
  --danger:#B94A48; --ok:#4F956B; --magic:#8876D8; --line:rgba(212,175,104,.22); --shadow:0 6px 24px rgba(0,0,0,.35);
  --N:#9aa3b2; --R:#4f956b; --SR:#4a7fc1; --SSR:#8876D8; --UR:#D4AF68;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif; --title:'Cinzel','Noto Serif TC',serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--serif);font-size:15px;line-height:1.55}
body{background:radial-gradient(1200px 600px at 70% -10%,rgba(136,118,216,.13),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(212,175,104,.08),transparent 60%),var(--bg);background-attachment:fixed}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;background:#0d1320;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:14px}
h1,h2,h3,h4{font-family:var(--title);font-weight:700;margin:0 0 .5em;color:var(--gold);letter-spacing:.04em}
h2{font-size:1.35rem}h3{font-size:1.08rem}h4{font-size:.95rem;color:var(--text)}
a{color:var(--gold)}
.sub{color:var(--sub)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.good{color:#7fc79a}.bad{color:#e07a77}.warn{color:#e6b76a}.mag{color:#a99af0}.goldc{color:var(--gold)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mt{margin-top:14px}.mb{margin-bottom:12px}

/* ===== layout ===== */
#app{display:grid;grid-template-columns:210px 1fr 300px;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
#top{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#151d2c,#111827);position:relative;z-index:5}
.brand{font-family:var(--title);color:var(--gold);font-size:1.15rem;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand small{display:block;font-size:10px;color:var(--sub);letter-spacing:.2em}
.topinfo{display:flex;gap:14px;align-items:center;flex:1;flex-wrap:wrap;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.2);white-space:nowrap}
.ap{display:inline-flex;gap:3px}.ap i{width:11px;height:11px;border-radius:50%;border:1px solid var(--gold);display:inline-block}.ap i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
#nav{border-right:1px solid var(--line);padding:10px 8px;overflow:auto;background:rgba(0,0,0,.15)}
#nav button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:9px 12px;border-radius:8px;text-align:left;font-size:14.5px;color:var(--sub)}
#nav button:hover{background:rgba(212,175,104,.07);color:var(--text)}
#nav button.on{background:linear-gradient(90deg,rgba(212,175,104,.18),transparent);color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
#nav button svg,#bottom button svg{width:18px;height:18px;flex:none}
#nav .lock{opacity:.4}
#main{overflow:auto;padding:18px 22px 40px}
#side{border-left:1px solid var(--line);overflow:auto;padding:14px;background:rgba(0,0,0,.15)}
#bottom{display:none}

/* ===== components ===== */
.card{background:linear-gradient(180deg,var(--card),#1a2331);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);position:relative}
.card.flat{box-shadow:none}
.card .corner{position:absolute;inset:5px;border:1px solid rgba(212,175,104,.12);border-radius:9px;pointer-events:none}
.btn{background:linear-gradient(180deg,#2d3a50,#222c3d);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--gold);box-shadow:0 0 0 1px rgba(212,175,104,.3)}
.btn.primary{background:linear-gradient(180deg,#e2c27f,#b8934f);color:#1b1408;border-color:#e8cf95;font-weight:700}
.btn.danger{background:linear-gradient(180deg,#a8504e,#7d3533);border-color:#c66}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn .cost{font-size:11px;opacity:.8}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--sub)}
.tabs button.on{background:rgba(212,175,104,.16);color:var(--gold);border-color:var(--gold)}
.bar{height:8px;border-radius:5px;background:#0c111b;overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#7fc79a);border-radius:5px}
.bar.hp>i{background:linear-gradient(90deg,#9d3d3b,#d9625f)}.bar.mp>i{background:linear-gradient(90deg,#4a5fb8,#8876D8)}.bar.gold>i{background:linear-gradient(90deg,#9b7a3c,var(--gold))}.bar.mood>i{background:linear-gradient(90deg,#4a7fc1,#79b3e0)}
.stat{display:grid;grid-template-columns:48px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv b{color:var(--sub);font-weight:400}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sub);margin:2px 3px 2px 0}
.tag.r-N{color:var(--N);border-color:var(--N)}.tag.r-R{color:var(--R);border-color:var(--R)}.tag.r-SR{color:#79a6e0;border-color:var(--SR)}.tag.r-SSR{color:#b0a2ff;border-color:var(--SSR)}.tag.r-UR{color:var(--UR);border-color:var(--UR);box-shadow:0 0 8px rgba(212,175,104,.35)}
.tag.ok{color:#7fc79a;border-color:var(--ok)}.tag.no{color:#e07a77;border-color:var(--danger)}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:12px 0}
.logline{font-size:13px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.05);display:flex;gap:10px}
.logline .d{color:var(--sub);flex:none;width:68px;font-size:12px}
.logline.major{color:var(--gold)}.logline.good{color:#9ed7b1}.logline.bad{color:#e9908d}.logline.world{color:#b3a7f3}
.hero{display:flex;gap:14px;align-items:center}
.crest{width:64px;height:72px;flex:none}
.empty{color:var(--sub);text-align:center;padding:24px;font-size:13.5px}
.notice{border:1px solid rgba(230,183,106,.4);background:rgba(230,183,106,.07);border-radius:10px;padding:10px 12px;font-size:13.5px}
.notice.bad{border-color:rgba(185,74,72,.6);background:rgba(185,74,72,.1)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{color:var(--sub);font-weight:400;text-align:left;border-bottom:1px solid var(--line);padding:6px}
table.t td{padding:6px;border-bottom:1px solid rgba(255,255,255,.04)}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.actgrid .btn{flex-direction:column;padding:10px 6px;gap:2px;min-height:58px}
.actgrid .btn b{font-weight:600}

/* ===== cards (gacha) ===== */
.gcard{width:132px;height:188px;border-radius:12px;position:relative;perspective:800px;flex:none}
.gcard .in{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.gcard.flip .in{transform:rotateY(180deg)}
.gcard .face,.gcard .back{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;overflow:hidden}
.gcard .back{background:repeating-linear-gradient(45deg,#1b2333 0 8px,#202a3d 8px 16px);border:2px solid var(--gold2);display:grid;place-items:center}
.gcard .face{transform:rotateY(180deg);border:2px solid var(--rc);background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--rc) 35%,transparent),#141b28 70%);padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 0 18px color-mix(in srgb,var(--rc) 40%,transparent)}
.gcard .face .rr{font-family:var(--title);font-weight:900;color:var(--rc);font-size:15px;letter-spacing:.08em;align-self:flex-start}
.gcard .face .ic{width:58px;height:58px;margin:2px 0 6px}
.gcard .face .nm{font-weight:700;font-size:13.5px;line-height:1.25}
.gcard .face .ty{font-size:11px;color:var(--sub)}
.gcard .face .nt{font-size:10.5px;color:var(--sub);margin-top:auto;line-height:1.3}
.gcard .new{position:absolute;top:7px;right:7px;background:var(--danger);color:#fff;font-size:10px;padding:0 6px;border-radius:6px}
.gcard.r-UR .face{animation:urglow 2s infinite alternate}
@keyframes urglow{to{box-shadow:0 0 34px rgba(212,175,104,.85)}}
.cardrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pool{cursor:pointer;transition:.15s}.pool.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),var(--shadow)}
.pity{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px}

/* ===== modal ===== */
#modal-root .mask{position:fixed;inset:0;background:rgba(5,8,14,.72);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#1f2a3b,#161e2c);border:1px solid var(--gold2);border-radius:14px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative}
.modal.wide{width:min(900px,100%)}
.modal .orn{text-align:center;color:var(--gold);letter-spacing:.5em;font-size:12px;margin-bottom:4px;opacity:.8}
.modal .desc{font-size:15px;line-height:1.75;margin:10px 0 16px}
.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14.5px}
.choice:hover:not(:disabled){border-color:var(--gold);background:rgba(212,175,104,.08)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice .meta{display:block;font-size:12px;color:var(--sub);margin-top:2px}
details.blog{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px}
details.blog summary{cursor:pointer;color:var(--gold)}
details.blog .lines{max-height:260px;overflow:auto;margin-top:6px;color:var(--sub);line-height:1.6}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#0e1522;border:1px solid var(--gold2);padding:8px 16px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);animation:fade .2s}
#toast div.err{border-color:var(--danger);color:#f0a4a1}

/* ===== title & creation ===== */
.title-screen{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.title-screen h1{font-size:clamp(2.2rem,6vw,3.6rem);margin:0;text-shadow:0 0 28px rgba(212,175,104,.35)}
.title-screen .en{font-family:var(--title);letter-spacing:.45em;color:var(--sub);font-size:13px;margin:6px 0 18px}
.title-screen .motto{color:var(--sub);font-style:italic;margin-bottom:26px}
.title-art{width:min(420px,80vw);margin:0 auto 10px;display:block}
.create{max-width:980px;margin:0 auto;padding:20px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:rgba(255,255,255,.02);transition:.15s;text-align:left}
.opt:hover{border-color:var(--gold2)}.opt.on{border-color:var(--gold);background:rgba(212,175,104,.1);box-shadow:0 0 0 1px var(--gold)}
.opt b{color:var(--gold)}
.deathbox{text-align:center}
.deathbox .ending{font-family:var(--title);font-size:2rem;color:var(--gold);margin:6px 0}

/* ===== responsive ===== */
@media (max-width:1180px){ #app{grid-template-columns:190px 1fr} #side{display:none} .showside{display:inline-flex!important} }
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  #top{grid-column:1;padding:7px 10px;gap:8px}
  .brand span.full{display:none}
  .topinfo{gap:6px;font-size:12px}
  .pill{padding:2px 7px}
  #nav{display:none}
  #main{padding:12px 12px 90px}
  #bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0f1622;border-top:1px solid var(--line);z-index:20;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}
  #bottom button{flex:1 0 64px;background:none;border:0;color:var(--sub);font-size:10.5px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
  #bottom button.on{color:var(--gold)}
  .cardrow.scroll{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:8px;scroll-snap-type:x mandatory}
  .cardrow.scroll .gcard{scroll-snap-align:center}
  .gcard{width:118px;height:170px}
  .g2,.g3{grid-template-columns:1fr}
  .modal{padding:16px}
  .hide-m{display:none!important}
}
.showside{display:none!important}
</style></head><body>
<script>
/* ===================== 《冒險者的人生》資料庫 DB-01 (MVP) ===================== */
const GAME_VERSION = "1.0.0";
const RARITIES = ['N','R','SR','SSR','UR'];

  elf:{name:'精靈',life:300,growth:0.75,mods:{int:2,spi:2,vit:-1,str:-1},desc:'魔力高、壽命長、成長較慢',mag:0.1},
  dwarf:{name:'矮人',life:150,growth:0.9,mods:{vit:2,str:1,agi:-1},desc:'體質優秀、鍛造能力強（鍛造+15%）',forge:0.15},
  beast:{name:'獸人',life:75,growth:1.0,mods:{str:2,vit:2,int:-1,cha:-1},desc:'力量與生命力高（HP+10%）',hp:0.1},

const BACKGROUNDS = {

  artisan:{name:'工匠家庭',gold:70,desc:'製作效率+20%、初始鍛造術',craft:0.2,skills:{smithing:1},parentJob:'鐵匠',parentIncome:40,tag:'craft'},

};

const PERSONALITIES = {
  brave:{name:'勇敢',desc:'戰鬥士氣提升（傷害+5%）'},
  timid:{name:'膽小',desc:'危險探索時容易退縮（提早撤退）'},
  greedy:{name:'貪財',desc:'交易收益+10%'},
  generous:{name:'慷慨',desc:'好感提升速度+30%'},

/* ---------- 天賦 30 + 負面特質 ---------- */
const TALENTS = {
  T001:{name:'天生神力',r:'SSR',desc:'力量訓練效果+35%',fx:{train:{str:.35}}},

/* ===================== 核心：狀態、隨機數、角色、時間 ===================== */
let G = null;               // 全域 GameState（所有資源變化都經過這裡）
const Bus = { h:{}, on(e,f){(this.h[e]=this.h[e]||[]).push(f)}, emit(e,d){(this.h[e]||[]).forEach(f=>f(d))} };

/* ---------- 統一隨機數服務（可重現 Seed） ---------- */
function rand(){
  if(!G) return Math.random();
  let t = (G.rng = (G.rng + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (a,b)=>Math.floor(rand()*(b-a+1))+a;
const pick = arr => arr[Math.floor(rand()*arr.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const chance = p => rand() < p;
function wpick(items, wf){ let tot=0; const ws=items.map(i=>{const w=Math.max(0,wf(i));tot+=w;return w}); if(tot<=0) return null; let r=rand()*tot; for(let i=0;i<items.length;i++){ r-=ws[i]; if(r<=0) return items[i]; } return items[items.length-1]; }
const uid = p => (p||'U') + (++G.uidc);
const fmt = n => Math.floor(n).toLocaleString('en-US');
const rIdx = r => RARITIES.indexOf(r);

/* ---------- 便利查詢 ---------- */
const P = () => G.player;
function flag(id){ return !!(G.player.flags[id] || G.world.flags[id]); }
function setFlag(id, v=true){ const worldFlags=['abyssMain','demonDefeated','ruinsFound','abyssSealed']; (worldFlags.includes(id)?G.world.flags:G.player.flags)[id]=v; }
function activeTalents(){ return [...G.player.talents, ...G.player.neg].map(id=>TALENTS[id]||NEG_TRAITS[id]).filter(Boolean); }
function tfx(key){ let s=0; activeTalents().forEach(t=>{ if(typeof t.fx[key]==='number') s+=t.fx[key]; }); return s; }
function tTrain(attr){ let s=tfx('trainAll'); activeTalents().forEach(t=>{ if(t.fx.train&&t.fx.train[attr]) s+=t.fx.train[attr]; }); return s; }
function tSpec(spec){ let s=0; activeTalents().forEach(t=>{ if(t.fx.spec&&t.fx.spec[spec]) s+=t.fx.spec[spec]; }); return s; }
function hasPers(k){ return G.player.personality.includes(k); }
function skLv(id, who){ const s=(who||G.player).skills[id]; return s? s.lv:0; }
function prof(){ return G.player.profession? PROFESSIONS[G.player.profession]:null; }
function pbon(k){ const p=prof(); let v = p&&p.bon[k]? p.bon[k]:0; if(p){ const m=G.player.profMastery[G.player.profession]||0; v*= (1+Math.min(m,500)/1000); } return v; }
function eqItems(who){ const w=who||G.player; return ['weapon','armor','acc'].map(s=>w.equip[s]).filter(Boolean).map(u=>G.inv.items.find(i=>i.uid===u)).filter(Boolean); }
function eqSum(k, who){ let s=0; eqItems(who).forEach(it=>{ const d=EQUIPMENT[it.id]; let v=d[k]||0; if(['atk','matk','def','hp','mp'].includes(k)) v*= (1+it.enh*0.1)*(it.dur<=0?0.5:1); s+=v; }); return s; }
function luck(){ return tfx('luck') + eqSum('luck'); }
function tradeBonus(){ const bg=BACKGROUNDS[G.player.background]; let b=(bg.trade||0)+tfx('trade')+skLv('negotiation')*0.02+pbon('trade')+(hasPers('greedy')?0.1:0)+(G.player.buffs.trade10?0.1:0); return clamp(b,0,0.6); }
function socialMult(){ const bg=BACKGROUNDS[G.player.background]; return 1+(bg.social||0)+tfx('social')+(hasPers('generous')?0.3:0)+skLv('eloquence')*0.03; }

/* ---------- 年齡與人生階段 ---------- */
function lifeSpanOf(race){ return (RACES[race]||{life:5000}).life; }
function effAge(age, race){ const L=lifeSpanOf(race||G.player.race); if(age<=18) return age; return 18 + (age-18)*62/(L-18); }
function stageOf(age, race){ const e=effAge(age,race); let s=LIFE_STAGES[0][1]; LIFE_STAGES.forEach(([a,n])=>{ if(e>=a) s=n; }); return s; }
function apFor(){ const e=effAge(G.player.age); let ap = e<6?0: e<12?1: e<18?2: e<50?3:2; if(ap>0) ap += tfx('ap'); return Math.min(5, ap); }
function seasonOf(m){ return m<=3?'春':m<=6?'夏':m<=9?'秋':'冬'; }
function guildRank(){ let r='F'; GUILD_RANKS.forEach(([n,p])=>{ if(G.player.gp>=p && rankIdx(n)<=rankIdx(G.player.rankOk)) r=n; }); return r; }
function rankIdx(r){ return GUILD_RANKS.findIndex(x=>x[0]===r); }
function nextRank(){ const i=rankIdx(G.player.rankOk); return GUILD_RANKS[i+1]||null; }

/* ---------- 衍生數值 ---------- */
function pStats(){
  const p=G.player, a=p.attrs, race=RACES[p.race];
  const hpB = tfx('hp')+pbon('hp')+(race.hp||0);
  const hpMax = Math.floor((50 + a.vit*5 + p.level*6 + eqSum('hp'))*(1+hpB));
  const mpMax = Math.floor((20 + a.spi*4 + a.int*2 + eqSum('mp'))*(1+tfx('mp')));
  const atk = Math.floor(a.str*2 + eqSum('atk'));
  const matk = Math.floor(a.int*2 + eqSum('matk'));
  const def = Math.floor((a.vit + eqSum('def'))*(1+pbon('def')));
  const mdef = Math.floor(a.spi + eqSum('def')*0.3);
  const spd = Math.floor(a.agi + eqSum('spd'));
  const hit = clamp(0.8 + a.agi*0.002 + pbon('hit') + tfx('hit') + eqSum('hit') + (hasPers('calm')?0.05:0), 0.5, 0.98);
  const eva = clamp(a.agi*0.0025 + pbon('eva') + tfx('eva'), 0, 0.35);
  const crit = clamp(0.05 + a.agi*0.0015 + pbon('crit') + eqSum('crit'), 0, 0.4);
  const load = 20 + a.str*2;
  return {hpMax,mpMax,atk,matk,def,mdef,spd,hit,eva,crit,load};
}
function npcStats(n){
  const a=n.st; const eqHp=eqSum('hp',n);
  const pb = n.prof&&PROFESSIONS[n.prof]? PROFESSIONS[n.prof].bon:{};
  return {
    hpMax: Math.floor((50+a.vit*5+n.lv*6+eqHp)*(1+(pb.hp||0))), mpMax: Math.floor(20+a.spi*4+a.int*2+eqSum('mp',n)),
    atk: Math.floor(a.str*2+eqSum('atk',n)+n.lv*1.5), matk: Math.floor(a.int*2+eqSum('matk',n)+n.lv*1.5),
    def: Math.floor((a.vit+eqSum('def',n))*(1+(pb.def||0))), mdef: Math.floor(a.spi+eqSum('def',n)*0.3), spd: Math.floor(a.agi+eqSum('spd',n)),
    hit: clamp(0.8+a.agi*0.002+(pb.hit||0),0.5,0.98), eva: clamp(a.agi*0.0025+(pb.eva||0),0,0.35), crit: clamp(0.05+a.agi*0.0015+(pb.crit||0),0,0.4)
  };
}
function partyLimit(){ let n=4 + (tfx('party')>0?1:0); if(rankIdx(guildRank())>=rankIdx('A')) n=Math.max(n,5); return Math.min(5,n); }

function createCharacter(opt){
  initState(opt.seed || (Math.floor(Math.random()*4294967295)));
  const p=G.player;
  p.name=opt.name||genName(opt.gender); p.gender=opt.gender||'男'; p.race=opt.race; p.background=opt.background;
  p.familyName = opt.familyName || pick(SURNAMES);
  const bg=BACKGROUNDS[p.background], race=RACES[p.race];
  p.home = p.background==='elftribe'?'moonforest': ['noble','merchant','scholar'].includes(p.background)?'capital':'greenfield';
  p.region=p.home; p.stats.visited[p.home]=1;
  G.world.flags.unlocked = ['greenfield']; if(!G.world.flags.unlocked.includes(p.home)) G.world.flags.unlocked.push(p.home);
  ATTR_KEYS.forEach(k=>{ p.attrs[k] = ri(2,5) + (race.mods[k]||0); if(p.attrs[k]<1) p.attrs[k]=1; });
  p.gold = bg.gold;
  // 性格：1主要+0~1次要
  const pk=Object.keys(PERSONALITIES); p.personality=[pick(pk)]; if(chance(.6)){ let s=pick(pk); if(!p.personality.includes(s)) p.personality.push(s); }
  // 背景技能
  if(bg.skills) Object.entries(bg.skills).forEach(([k,v])=>{ p.skills[k]={lv:v,exp:0}; });
  // 出生天賦（命運判定）
  const rolls = bg.talentRolls||1;
  for(let i=0;i<rolls;i++){ const r=rollRarity(); const pool=Object.keys(TALENTS).filter(t=>TALENTS[t].r===r && !p.talents.includes(t)); if(pool.length) gainTalent(pick(pool), true); }
  if(chance(.25)) p.neg.push(pick(Object.keys(NEG_TRAITS)));
  seedMainNPCs();
  // 家庭
  if(!bg.noParents){
    const fa = makeNPC({name:genName('男')+'・'+p.familyName, gender:'男', race:p.race, age:ri(22,35)*(p.race==='elf'?3:1), job:bg.parentJob, region:p.home, rel:'父親', aff:70, trust:60, respect:50, met:true, income:bg.parentIncome});
    const mo = makeNPC({name:genName('女')+'・'+p.familyName, gender:'女', race:p.race, age:ri(20,33)*(p.race==='elf'?3:1), job:bg.parentJob==='貴族'?'貴族夫人':'持家', region:p.home, rel:'母親', aff:75, trust:60, respect:45, met:true, income:Math.floor(bg.parentIncome*0.5)});
    fa.spouse=mo.id; mo.spouse=fa.id; p.parents=[fa.id,mo.id];
  } else { p.housing='family'; }
  // 起始裝備（冒險者家庭）
  if(p.background==='adventurer') addItem('E001');
  p.hp=pStats().hpMax; p.mp=pStats().mpMax;
  genPrices();
  G.pending.push({id:'EVT001', ctx:{}});
  history(`${p.familyName}家的${p.name}誕生於${bg.name}（${race.name}）。`);
  return G;
}

/* ---------- 天賦 ---------- */
function gainTalent(id, silent){
  const p=G.player, t=TALENTS[id]; if(!t) return '';
  if(p.talents.includes(id) || p.talentBank.includes(id)){ G.gacha.shards += RARITY_SHARD[t.r]; return `重複天賦「${t.name}」轉換為 ${RARITY_SHARD[t.r]} 天賦碎片`; }
  if(p.talents.length<3) p.talents.push(id); else p.talentBank.push(id);
  if(t.flag) p.flags[t.flag]=true;
  if(!silent) history(`獲得天賦【${t.r}】${t.name}`);
  return `獲得天賦【${t.r}】${t.name}${p.talents.includes(id)?'':'（已存入天賦庫，可在角色頁替換）'}`;
}
function swapTalent(active, bank){
  const p=G.player; const i=p.talents.indexOf(active), j=p.talentBank.indexOf(bank);
  if(i<0||j<0) return;
  p.talents[i]=bank; p.talentBank[j]=active; log(`天賦配置變更：${TALENTS[bank].name} 取代 ${TALENTS[active].name}`);
}

function spendGold(v){ if(G.player.gold < v) return false; G.player.gold -= v; return true; }

/* ---------- 能力與技能成長 ---------- */
function moodMult(){ const m=G.player.mood; return m<20?0.7: m<40?0.85: m>80?1.05:1; }
function trainAttr(k, base){
  const p=G.player, e=effAge(p.age), race=RACES[p.race];
  const ageF = e<12?0.35: e<18?0.55: e<50?1: e<65?0.6:0.35;
  const dim = p.attrs[k]>40? Math.max(0.2, 1-(p.attrs[k]-40)/70):1;
  let mult = (1+tTrain(k)) * race.growth * ageF * dim * moodMult() * (hasPers('lazy')?0.85:1);
  if(['int','spi'].includes(k)){ const bg=BACKGROUNDS[p.background]; mult*= 1+(bg.study||0)+tfx('study')+(hasPers('smart')?0.1:0); }
  const g = (base||(0.4+rand()*0.6))*mult;
  p.attrs[k] = Math.min(100, p.attrs[k]+g);
  return g;
}
function skillMult(id){
  const p=G.player, s=SKILLS[id]; let m=1+tfx('skillExp')+(RACES[p.race].exp||0)+(hasPers('smart')?0.1:0)+(hasPers('stubborn')?0.15:0);
  if(s && s.dom==='magic') m+=tfx('magicExp');
  if(s && s.spec) m+=tSpec(s.spec);
  return Math.max(0.2,m);
}
function addSkillExp(id, amt, who){
  const w=who||G.player; if(!SKILLS[id]) return '';
  if(!w.skills[id]) w.skills[id]={lv:1,exp:0};
  const s=w.skills[id]; if(s.lv>=10) return '';
  s.exp += amt*(who?1:skillMult(id));
  let up=false; while(s.lv<10 && s.exp >= s.lv*100){ s.exp -= s.lv*100; s.lv++; up=true; }
  if(up && !who){ log(`技能「${SKILLS[id].name}」提升至 Lv${s.lv}（${skillTitle(s.lv)}）`,'good'); if(s.lv===10) history(`技能「${SKILLS[id].name}」達到傳奇境界！`); }
  return up;
}
function skillTitle(lv){ let t=''; SKILL_TITLES.forEach(([l,n])=>{ if(lv>=l) t=n; }); return t; }
function learnSkill(id, who){ const w=who||G.player; if(w.skills[id]) return false; w.skills[id]={lv:1,exp:0}; if(!who) log(`學會新技能「${SKILLS[id].name}」`,'good'); return true; }
function gainExp(v){
  const p=G.player; p.exp += v*(1+(RACES[p.race].exp||0));
  let need = Math.floor(60*Math.pow(p.level,1.6));
  while(p.exp>=need && p.level<99){ p.exp-=need; p.level++; const mains = prof()? prof().main : ['str','vit']; mains.forEach(k=>p.attrs[k]=Math.min(100,p.attrs[k]+1)); p.attrs[pick(ATTR_KEYS)]=Math.min(100,p.attrs[pick(ATTR_KEYS)]+0.5); log(`等級提升至 Lv${p.level}！`,'good'); need=Math.floor(60*Math.pow(p.level,1.6)); }
}
function npcGainExp(n, v){ n.exp=(n.exp||0)+v; let need=Math.floor(60*Math.pow(n.lv,1.6)); while(n.exp>=need && n.lv<99){ n.exp-=need; n.lv++; const mains=n.prof&&PROFESSIONS[n.prof]?PROFESSIONS[n.prof].main:['str','vit']; mains.forEach(k=>n.st[k]=Math.min(100,n.st[k]+1)); need=Math.floor(60*Math.pow(n.lv,1.6)); } }

/* ---------- 職業 ---------- */
function profReqStatus(id){
  const d=PROFESSIONS[id], p=G.player; const hasCard = d.card && p.quals.includes(d.card);
  const ease = hasCard?0.85:1; const rows=[];
  Object.entries(d.req).forEach(([k,v])=>{ const need=Math.ceil(v*ease); rows.push({t:`${ATTR[k]} ${need}`, ok:p.attrs[k]>=need}); });
  if(d.base) rows.push({t:`曾就任${PROFESSIONS[d.base].name}`, ok:p.profHistory.includes(d.base)||p.profession===d.base});
  if(d.skill){ const need=Math.max(1,d.skill[1]-(hasCard?2:0)); rows.push({t:`${SKILLS[d.skill[0]].name} Lv${need}`, ok:skLv(d.skill[0])>=need}); }
  if(d.needSkill) rows.push({t:`${SKILLS[d.needSkill[0]].name} Lv${d.needSkill[1]}`, ok:skLv(d.needSkill[0])>=d.needSkill[1]});
  if(d.needMagic) rows.push({t:'學會任一魔法技能', ok:Object.keys(p.skills).some(s=>SKILLS[s].dom==='magic')});
  if(d.needCard) rows.push({t:`持有「${CLASS_CARDS[d.needCard].name}」`, ok:p.quals.includes(d.needCard)});
  if(d.flag) rows.push({t:flagLabel(d.flag), ok:flag(d.flag)});
  if(d.flagAny) rows.push({t:d.flagAny.map(flagLabel).join(' 或 '), ok:d.flagAny.some(flag)});
  if(d.trial && !hasCard) rows.push({t:`通過${d.name}試煉`, ok:!!p.trials[id], trial:true});
  return {rows, ok:rows.every(r=>r.ok), hasCard};
}
function flagLabel(f){ return ({knighted:'受封騎士',elffriend:'成為精靈之友',killedDragon:'討伐龍族',ancientlang:'通曉古代語言',dragonblood:'龍族血脈',dragonContract:'龍族契約'})[f]||f; }
function changeProfession(id){
  const p=G.player, st=profReqStatus(id); if(!st.ok) return '條件未達成';
  if(p.ap<1) return '行動點不足';
  p.ap--; if(p.profession && !p.profHistory.includes(p.profession)) p.profHistory.push(p.profession);
  p.profession=id; if(!p.profHistory.includes(id)) p.profHistory.push(id);
  const d=PROFESSIONS[id];
  if(d.tier>=2){ G.gacha.tickets++; history(`晉升為進階職業【${d.name}】！獲得命運券×1`); } else history(`就任職業【${d.name}】`);
  if(d.dark) p.dark+=15;
  return '';
}

/* ===================== 抽卡系統 ===================== */
function rollRarity(){ let r=rand()*100, acc=0; for(const k of RARITIES){ acc+=RARITY_RATE[k]; if(r<acc) return k; } return 'N'; }
function poolCards(pool){
  switch(pool){
    case 'destiny': return [...Object.keys(TALENTS).map(id=>({id,r:TALENTS[id].r})), ...Object.keys(OPP_CARDS).map(id=>({id,r:OPP_CARDS[id].r}))];
    case 'class': return Object.keys(CLASS_CARDS).map(id=>({id,r:CLASS_CARDS[id].r}));
    case 'skill': return SKILL_CARD_IDS.map(id=>({id:'S:'+id,r:SKILLS[id].r}));
    case 'equip': return EQUIP_CARD_IDS.map(id=>({id,r:EQUIPMENT[id].r}));
    case 'people': return Object.keys(NPCS).map(id=>({id,r:NPCS[id].r}));
    case 'adventure': return Object.keys(ADV_CARDS).map(id=>({id,r:ADV_CARDS[id].r}));
  } return [];
}
function cardInfo(cid){
  if(cid.startsWith('S:')){ const s=SKILLS[cid.slice(2)]; return {name:s.name,r:s.r,type:'技能',desc:s.desc,icon:s.dom}; }
  if(TALENTS[cid]) return {name:TALENTS[cid].name,r:TALENTS[cid].r,type:'天賦',desc:TALENTS[cid].desc,icon:'destiny'};
  if(OPP_CARDS[cid]) return {name:OPP_CARDS[cid].name,r:OPP_CARDS[cid].r,type:'機遇',desc:OPP_CARDS[cid].desc,icon:'destiny'};
  if(CLASS_CARDS[cid]){ const c=CLASS_CARDS[cid]; return {name:c.name,r:c.r,type:'職業',desc:`取得【${PROFESSIONS[c.prof].name}】資格（免試煉、條件-15%）`,icon:'class'}; }
  if(EQUIPMENT[cid]){ const e=EQUIPMENT[cid]; return {name:e.name,r:e.r,type:'裝備',desc:equipDesc(e),icon:e.slot}; }
  if(NPCS[cid]){ const n=NPCS[cid]; return {name:n.name,r:n.r,type:'人物',desc:`${RACES[n.race]?RACES[n.race].name:'龍族'}・${n.job}（相遇線索）`,icon:'people'}; }
  if(ADV_CARDS[cid]) return {name:ADV_CARDS[cid].name,r:ADV_CARDS[cid].r,type:'奇遇',desc:ADV_CARDS[cid].desc,icon:'adventure'};
  return {name:cid,r:'N',type:'?',desc:'',icon:'destiny'};
}
function equipDesc(e){ const a=[]; if(e.atk) a.push(`攻擊${e.atk>0?'+':''}${e.atk}`); if(e.matk) a.push(`魔攻+${e.matk}`); if(e.def) a.push(`防禦+${e.def}`); if(e.spd) a.push(`速度${e.spd>0?'+':''}${e.spd}`); if(e.hp) a.push(`HP+${e.hp}`); if(e.mp) a.push(`MP+${e.mp}`); if(e.affix) a.push(e.affix); return a.join('、')+`｜Lv${e.lv}`; }
function gachaAllowed(pool){ const a=G.player.age; if(a<12) return '12歲後開放命運抽卡'; if(a<18 && pool!=='destiny') return '18歲後開放完整六大卡池'; return ''; }
function gachaPull(pool, cur, count){
  const block=gachaAllowed(pool); if(block) return {err:block};
  if(!G.player.alive) return {err:'角色已死亡'};
  const cost = cur==='ticket'? count : (count===10?3000:300*count);
  if(cur==='ticket' && G.gacha.tickets<cost) return {err:'命運券不足'};
  if(cur==='gold' && G.player.gold<cost) return {err:'金幣不足'};
  const snapshot = JSON.stringify(G); // 原子性交易
  try{
    if(cur==='ticket') G.gacha.tickets-=cost; else G.player.gold-=cost;

      for(let i=0;i<n;i++) mobs.push(pick(d.mobs));
      const A=partyUnits(); let B=mobs.map(m=>monsterUnit(m,scale));
      if(isElite){ B[0]=monsterUnit(pick(d.mobs),scale,true); f.text='⚠ 精英魔物出現！'; }
      if(isBoss){ B=[monsterUnit(d.boss, risk.lv), ...mobs.slice(0,2).map(m=>monsterUnit(m,scale))]; f.text='👑 樓層首領！'; }
      const res=runBattle(A,B); const out=settleBattle(A,res,G.risk,B, risk.reward*(1+(tac.reward||0))*(hasPers('impulsive')&&G.risk==='lethal'?1.15:1), true);
      f.battle=res.log; f.text+= res.win?`擊敗 ${B.map(b=>b.name).join('、')}。`+out.join('；'):(res.fled?'撤退了。':'戰敗。')+out.join('；');
      rep.floors.push(f);
      if(!res.win){ rep.result=res.fled?'撤退':'戰敗'; break; }
      if(isBoss){ p.stats.cleared[id]=(p.stats.cleared[id]||0)+1; G.gacha.tickets++; f.text+=' 🎉 地下城制霸！獲得命運券×1';
        if(id==='abyssthrone'){ setFlag('demonDefeated'); G.world.abyss=Math.max(0,G.world.abyss-50); p.stats.abyssBoss++; p.fame+=50; history('擊敗魔王之影，深淵之門再度封印！'); news(`${p.name}擊敗魔王之影！`); }
        else if(id==='mistmaze'){ G.world.abyss=Math.max(0,G.world.abyss-15); p.stats.abyssBoss++; setFlag('abyssMain'); unlockRegion('abyssgate'); history('擊敗黑霧女王，深淵之門現身。'); }
        else history(`制霸地下城「${d.name}」`);
        if(id==='ruins') { addSkillExp('fireball',100); }
        G.dungeon[id]=d.floors; rep.result='制霸'; break; }
    } else if(roll<0.78 || chestBuff){
      const g=Math.floor(ri(20,60)*floor*risk.reward*(1+luck())*(hasPers('curious')?1.2:1)); addGold(g); f.text=`發現寶箱：${g}G`;
      if(chance(0.25+luck())){ const pool=EQUIP_CARD_IDS.filter(e=>EQUIPMENT[e].lv<=Math.max(5,floor*1.5+ (id==='goblincave'?0:10))); const e=pick(pool); addItem(e); f.text+=`、${EQUIPMENT[e].name}`; }
      rep.floors.push(f);
    } else if(roll<0.9){
      const avoid = 0.4 + skLv('trapdisarm')*0.06 + skLv('stealth')*0.04 + tfx('explore') + tfx('stealth');
      if(chance(avoid)){ f.text='察覺陷阱並安全通過。'; addSkillExp('trapdisarm',10); }
      else { const dmg=Math.floor(pStats().hpMax*0.15*risk.lv); p.hp=Math.max(1,p.hp-dmg); f.text=`觸發陷阱！受到 ${dmg} 傷害。`; }
      rep.floors.push(f);
    } else {
      if(chance(0.5)){ p.hp=pStats().hpMax; G.party.forEach(i=>{const n=G.npcs[i]; if(n) n.hp=npcStats(n).hpMax;}); f.text='發現治癒之泉，全隊HP回滿。'; }
      else { const m=pick(['magicstone','relic','mithril','herb']); addMat(m, ri(1,2)); f.text=`發現隱藏房間：${MATERIALS[m].name}`; }
      rep.floors.push(f);
    }
    G.dungeon[id]=Math.max(G.dungeon[id]||0, floor);
    // 撤退判定
    const A=partyUnits(); const ratio=A.reduce((s,u)=>s+u.hp,0)/A.reduce((s,u)=>s+u.maxhp,0);
    const th=tac.retreat + (hasPers('timid')?0.1:0);
    if(floor<d.floors && ratio<th){ rep.result='撤退'; rep.floors.push({n:floor,text:`隊伍狀態不佳（HP ${Math.round(ratio*100)}%），依戰術撤退。`}); break; }
  }
  if(!rep.result) rep.result='結束';
  rep.end=floor; addSkillExp('survival',10);
  log(`探索${d.name}：抵達第${floor}層（${rep.result}）`, rep.result==='制霸'?'major':'info');
  return rep;
}

function doQuest(qid){

  if(!flag('guildMember')) return {err:'需先登記成為冒險者'}; if(p.ap<1) return {err:'行動點不足'}; if(p.region!==q.region) return {err:`需前往${REGIONS[q.region].name}`}; if(p.age<14) return {err:'年齡不足'};

function travel(r){

function genPrices(){ REGION_ORDER.forEach(r=>{ G.world.prices[r]=G.world.prices[r]||{}; Object.keys(TRADE_GOODS).forEach(g=>{ const cur=G.world.prices[r][g]||1; G.world.prices[r][g]=clamp(cur*(0.93+rand()*0.14),0.75,1.35); }); }); if(G.world.shock){ G.world.shock.left--; if(G.world.shock.left<=0) G.world.shock=null; } }
function worldPriceMult(key){ const e=G.world.event; if(!e) return 1; const w=WORLD_EVENTS[e.id]; return (w.price&&w.price[key])||1; }
function goodPrice(g, r){ const R=REGIONS[r]; let p=TRADE_GOODS[g].base*R.prices[g]*G.world.prices[r][g]*worldPriceMult(g); if(G.world.shock&&G.world.shock.good===g) p*=G.world.shock.v; return p; }

function sellPrice(base){ return Math.max(1,Math.round(base*0.85*(1+tradeBonus()))); }
function equipPrice(id){ const e=EQUIPMENT[id]; return buyPrice(e.price*(e.slot==='weapon'?worldPriceMult('weapon'):1)); }
function consPrice(id){ return buyPrice(CONSUMABLES[id].price*(['potion','hipotion','medicine','elixir'].includes(id)?worldPriceMult('potion'):1)); }
function livingCost(){
  const p=G.player; if(p.age<18) return 0;
  let h=HOUSING[p.housing].cost; if(p.housing==='family') h=0;

function bizReqOk(type){ const b=BUSINESSES[type], r=b.req||{}; if(r.skill && skLv(r.skill[0])<r.skill[1]) return `需要${SKILLS[r.skill[0]].name} Lv${r.skill[1]}`; if(r.rank && rankIdx(guildRank())<rankIdx(r.rank)) return `需要公會 ${r.rank} 級`; if(r.bizCount && G.businesses.length<r.bizCount) return `需要擁有${r.bizCount}家事業`; return ''; }
function buyBusiness(type){ const p=G.player, b=BUSINESSES[type]; if(p.age<18) return '需成年'; const e=bizReqOk(type); if(e) return e; if(!spendGold(b.cost)) return '資金不足'; G.businesses.push({uid:uid('B'),type,region:p.region,level:1,staff:1,rep:40,price:'normal',last:0,manager:null,months:0}); history(`在${REGIONS[p.region].name}開設了「${b.name}」`); G.gacha.tickets++; return ''; }
function bizRevenue(b){
  const d=BUSINESSES[b.type], p=G.player; const e=G.world.event?WORLD_EVENTS[G.world.event.id]:null;
  let wm=1; if(e&&e.biz){ wm=(e.biz[d.tag||b.type]||e.biz[b.type]||1)*(e.biz.all||1); }
  const staffF=Math.min(1.2, 0.5+b.staff/(b.level*2)*0.7);
  const mgr=b.manager&&G.npcs[b.manager]&&G.npcs[b.manager].alive?0.15+G.npcs[b.manager].st.cha/400:0;
  const priceF={low:0.8,normal:1,high:1.2}[b.price];
  return d.base*(1+(b.level-1)*0.35)*(0.5+b.rep/200)*staffF*(1+p.attrs.cha/250+skLv('management')*0.04+skLv('leadership')*0.02+tfx('business')+pbon('business')+(p.buffs.biz15?0.15:0)+mgr)*wm*priceF;
}
function bizCost(b){ const d=BUSINESSES[b.type]; return d.monthly*(1+(b.level-1)*0.3)+b.staff*25; }
function settleBusinesses(){
  let total=0; const lines=[];
  G.businesses.forEach(b=>{
    const d=BUSINESSES[b.type]; let rev=bizRevenue(b)*(0.8+rand()*0.4); const cost=bizCost(b);
    if(chance(0.03)){ rev*=0.4; lines.push(`${d.name}遭竊，收益大減`); }
    if(d.risk && G.world.event&&G.world.event.id==='war' && chance(d.risk*3)){ rev=0; lines.push(`${d.name}在戰亂中遇襲`); }
    const profit=Math.floor(rev-cost); b.last=profit; b.months++; total+=profit;
    const dr={low:1.2,normal:0.2,high:-1}[b.price] + (b.staff<b.level?-2:0) + (b.manager?0.5:0); b.rep=clamp(b.rep+dr+(rand()-0.5),0,100);
  });
  if(G.businesses.length){ addGold(total); G.player.lastBizIncome=total; }
  return {total, lines};
}

function npcDie(n, cause){ if(!n.alive) return; n.alive=false; n.cause=cause; G.party=G.party.filter(x=>x!==n.id); const p=G.player;
  if(p.parents.includes(n.id)) { history(`${n.rel}${n.name}過世了（${cause}）。`); p.mood=Math.max(0,p.mood-30*(1-tfx('mental'))); }

  else if(p.children.includes(n.id)){ history(`孩子${n.name}不幸離世（${cause}）。`); p.mood=Math.max(0,p.mood-40); }
  else if(n.met && n.aff>=40){ log(`${n.name}過世了（${cause}）`,'bad'); }
  G.businesses.forEach(b=>{ if(b.manager===n.id) b.manager=null; });
  if(n.met||n.card) news(`${n.name}（${n.job}）${cause}，享年${n.age}歲。`);
}
function npcMonthly(){

    if(n.injured>0) n.injured--;

    if(n.sick){ n.sick--; if(chance(0.04)) return npcDie(n,'病逝'); }
    // 好感自然變化

      const cand=Object.values(G.npcs).filter(m=>m.alive&&!m.spouse&&m.id!==n.id&&m.gender!==n.gender&&m.age>=20&&!m.romance&&m.id!==G.player.spouse&&!G.player.parents.includes(m.id)&&!m.isChild);

/* ===================== 事件系統 ===================== */
function reqOk(r, ev){
  if(!r) return true; const p=G.player;
  if(r.flags && !r.flags.every(flag)) return false;
  if(r.flagsAny && !r.flagsAny.some(flag)) return false;
  if(r.notFlags && r.notFlags.some(flag)) return false;
  if(r.parents && !p.parents.some(id=>G.npcs[id]&&G.npcs[id].alive)) return false;
  if(r.hasFriend && !(p.friendId&&G.npcs[p.friendId]&&G.npcs[p.friendId].alive)) return false;
  if(r.hasParty && !G.party.length) return false;
  if(r.ageMin && p.age<r.ageMin) return false;
  if(r.minGold && p.gold<r.minGold) return false;
  if(r.abyssMin && G.world.abyss<r.abyssMin) return false;
  if(r.fameMin && p.fame<r.fameMin) return false;
  if(r.darkMin && p.dark<r.darkMin) return false;
  if(r.fateMin && p.fate<r.fateMin) return false;
  if(r.rankMin && rankIdx(guildRank())<rankIdx(r.rankMin)) return false;
  if(r.debt && p.debt<=0) return false;
  if(r.workCount && p.workCount<r.workCount) return false;
  if(r.notRegion && regionUnlocked(r.notRegion)) return false;
  if(r.item && !G.inv.cons[r.item]) return false;
  if(r.childAdult && !p.children.some(c=>G.npcs[c]&&G.npcs[c].alive&&G.npcs[c].age>=18)) return false;
  if(r.respectAny && !mentorCandidate()) return false;
  return true;
}
function mentorCandidate(){ return Object.values(G.npcs).find(n=>n.alive&&n.met&&n.respect>=40&&(n.teach||Object.keys(n.skills).length)&&!G.player.children.includes(n.id)); }
function eventEligible(ev, cats){
  const p=G.player; if(ev.forced||!ev.weight) return false; if(cats && !cats.includes(ev.cat)) return false;
  if(p.age<ev.ageMin||p.age>ev.ageMax) return false; if(ev.lateOnly && effAge(p.age)<ev.ageMin) return false;
  if(ev.loc && !ev.loc.includes(p.region)) return false;
  const done=G.completed[ev.id]; if(done!=null){ if(!ev.repeatable) return false; if(G.mi-done < (ev.cd||12)) return false; }
  if(G.pending.some(x=>x.id===ev.id)) return false;
  return reqOk(ev.req, ev);
}
function rollEvent(cats, force){
  const cands=EVENTS.filter(e=>eventEligible(e,cats)); if(!cands.length) return null;
  return wpick(cands, e=>e.weight*(e.luck?1+luck():1)*(e.id==='EVT013'&&hasPers('kind')?1.5:1)*(e.cat==='adventure'&&hasPers('curious')?1.2:1));
}

function checkChance(c){ if(!c) return 1; const p=G.player; const av=c.a?p.attrs[c.a]:0; const sl=c.skill?skLv(c.skill):0;
  return clamp((av*1.6 + sl*8 + 25 - c.dc)/100 + luck()*0.2 + (hasPers('cunning')&&c.a==='cha'?0.08:0), 0.05, 0.95); }
function choiceAvailable(ch){ const p=G.player; if(ch.cost&&ch.cost.ap&&p.ap<ch.cost.ap) return '行動點不足'; if(ch.cost&&ch.cost.gold&&p.gold<ch.cost.gold) return `需要${ch.cost.gold}G`; if(ch.req && !reqOk(ch.req)) return '條件不足'; if(ch.req&&ch.req.ageMin&&p.age<ch.req.ageMin) return '年紀不足'; return ''; }

    case 'children': return p.children.map(i=>G.npcs[i]).filter(n=>n&&n.alive);
    case 'crush': { const c=Object.values(G.npcs).filter(n=>n.alive&&n.met&&n.age>=16&&!p.parents.includes(n.id)&&!p.children.includes(n.id)).sort((a,b)=>b.aff-a.aff); return c.slice(0,1); }
    default: return G.npcs[key]?[G.npcs[key]]:[];
  }
}
function applyOutcomes(list, ctx){
  const p=G.player, out=[];
  (list||[]).forEach(o=>{
    switch(o.t){
      case 'gold': addGold(o.v); out.push(`${o.v>=0?'+':''}${o.v}G`); break;
      case 'goldRand': { const v=ri(o.min,o.max); addGold(v); out.push(`+${v}G`); break; }
      case 'goldPct': { const v=Math.floor(p.gold*o.v); addGold(v); out.push(`${v}G`); break; }
      case 'attr': p.attrs[o.k]=clamp(p.attrs[o.k]+o.v,1,100); out.push(`${ATTR[o.k]}${o.v>0?'+':''}${o.v}`); break;
      case 'attrRand': { const k=pick(ATTR_KEYS); p.attrs[k]=Math.min(100,p.attrs[k]+o.v); out.push(`${ATTR[k]}+${o.v}`); break; }
      case 'skill': addSkillExp(o.id,o.exp); out.push(`${SKILLS[o.id].name}經驗+${o.exp}`); break;
      case 'learn': if(learnSkill(o.id)) out.push(`學會${SKILLS[o.id].name}`); break;
      case 'talent': out.push(gainTalent(o.id)); break;
      case 'talentRand': { const min=rIdx(o.min||'N'); let r=rollRarity(); if(rIdx(r)<min) r=RARITIES[min]; const pool=Object.keys(TALENTS).filter(t=>TALENTS[t].r===r); out.push(gainTalent(pick(pool))); break; }
      case 'flag': setFlag(o.id); break;
      case 'unflag': delete p.flags[o.id]; break;
      case 'ticket': G.gacha.tickets+=o.v; out.push(`命運券+${o.v}`); break;
      case 'health': p.health=clamp(p.health+o.v,0,healthCap()); out.push(`健康${o.v>0?'+':''}${o.v}`); break;
      case 'mood': p.mood=clamp(p.mood+(o.v<0?o.v*(1-tfx('mental')):o.v),0,100); out.push(`心情${o.v>0?'+':''}${o.v}`); break;
      case 'fame': p.fame=Math.max(0,p.fame+o.v); out.push(`名聲${o.v>0?'+':''}${o.v}`); break;
      case 'gp': p.gp+=o.v; out.push(`公會點數+${o.v}`); break;
      case 'dark': p.dark=Math.max(0,p.dark+o.v); if(o.v>0) out.push('黑暗值上升'); break;
      case 'fatePoint': p.fate+=o.v; out.push(`命運干涉 ${p.fate}`); break;
      case 'badge': G.gacha.badges+=o.v; out.push(`英雄徽章+${o.v}`); break;
      case 'abyss': G.world.abyss=clamp(G.world.abyss+o.v,0,100); out.push(`深淵威脅${o.v>0?'+':''}${o.v}`); break;
      case 'relation': relTargets(o.npc,ctx).forEach(n=>{ n.aff=clamp(n.aff+(o.aff||0),0,100); n.trust=clamp(n.trust+(o.trust||0),0,100); n.met=true; out.push(`${n.name} 好感${o.aff>=0?'+':''}${o.aff||0}`); }); break;
      case 'meet': { const n=G.npcs[o.npc]; if(n&&n.alive){ const was=n.met; n.met=true; n.aff=Math.max(n.aff,20); if(!was) out.push(`結識了${n.name}`); } break; }
      case 'meetRand': out.push(meetRandom()); break;
      case 'friend': { const n=makeChildhoodFriend(); out.push(`和${n.name}成為好朋友`); break; }
      case 'item': for(let i=0;i<(o.n||1);i++) addItem(o.id); out.push(`獲得${itemName(o.id)}×${o.n||1}`); break;
      case 'itemRand': { const id=pick(['potion','medicine','herb','ore','magicstone']); addItem(id); out.push(`獲得${itemName(id)}`); break; }
      case 'region': unlockRegion(o.id); break;
      case 'regionRep': p.regionRep[o.id]=(p.regionRep[o.id]||0)+o.v; out.push(`${REGIONS[o.id].name}聲望+${o.v}`); break;
      case 'card': { const pc=poolCards(o.pool).filter(c=>rIdx(c.r)>=rIdx(o.min)); const c=pick(pc); out.push(`獲得【${c.r}】${cardInfo(c.id).name}：${applyCard(c.id)}`); G.gacha.collection[c.id]=(G.gacha.collection[c.id]||0)+1; break; }
      case 'pers': if(o.add && chance(o.chance||1) && !p.personality.includes(o.add) && p.persCd<=G.mi){ if(p.personality.length>=3) p.personality.pop(); p.personality.push(o.add); p.persCd=G.mi+36; out.push(`性格產生變化：${PERSONALITIES[o.add].name}`); } break;
      case 'disease': p.disease={name:o.name, sev:o.sev}; out.push(`罹患${o.name}`); break;
      case 'buff': p.buffs[o.k]=o.v; break;
      case 'followup': G.scheduled.push({id:o.id, at:G.mi+o.delay}); break;
      case 'text': out.push(o.v); break;
      case 'parentHeal': relTargets('parents',ctx).forEach(n=>n.sick=0); break;
      case 'parentSick': if(ctx.parent&&G.npcs[ctx.parent]) G.npcs[ctx.parent].sick=ri(4,10); break;
      case 'mentorSkill': { const m=relTargets('mentor',ctx)[0]; if(m){ const sk=m.teach||Object.keys(m.skills)[0]; learnSkill(sk); addSkillExp(sk,120); out.push(`跟隨${m.name}學習${SKILLS[sk].name}`); } break; }
      case 'childSkill': p.children.forEach(c=>{ const n=G.npcs[c]; if(n&&n.alive){ const s=Object.keys(p.skills).sort((a,b)=>skLv(b)-skLv(a))[0]; if(s) addSkillExp(s,60,n); } }); out.push('子女習得你的技藝'); break;
      case 'priceShock': G.world.shock={good:ctx.good||'spice', v:o.v, left:3}; out.push(`${TRADE_GOODS[ctx.good||'spice'].name}價格暴漲（3個月）`); break;
      case 'sellAll': { let s=0; Object.entries(G.inv.mats).forEach(([k,v])=>{ s+=MATERIALS[k].price*v*0.6; G.inv.mats[k]=0; }); s=Math.floor(s); addGold(s); repayDebt(); out.push(`變賣素材得 ${s}G 並還債`); break; }
      case 'useItem': G.inv.cons[o.id]--; p.disease=null; out.push('使用萬能藥化解詛咒'); break;
      case 'freeBiz': G.businesses.push({uid:uid('B'),type:o.id,region:p.region,level:2,staff:3,rep:60,price:'normal',last:0,manager:null,months:0}); break;
      case 'visitAll': unlockedRegions().forEach(r=>p.stats.visited[r]=1); break;
      case 'battle': { if(p.age<12){ out.push('你還太小，被大人保護著逃走了。'); break; } const r=quickBattle(o.mobs); ctx.battles.push(r.log); out.push(r.win?'戰鬥勝利！':'戰鬥失敗……', ...r.out); if(p.alive) out.push(...applyOutcomes(r.win?o.win:o.lose, ctx)); break; }
    }
  });
  return out.filter(Boolean);
}

/* ===================== 人生時鐘：月度結算 ===================== */
function healthCap(){ const e=effAge(G.player.age); return Math.floor(clamp(100 - Math.max(0,e-55)*1.2, 30, 100)); }
function endMonth(){
  const p=G.player; if(!p.alive) return {err:'角色已死亡'}; if(G.pending.length) return {err:'請先處理目前的事件'};
  const rep=[]; const w=G.world;
  G.mi++; w.month++; if(w.month>12){ w.month=1; w.year++; }
  p.ageM++; let birthday=false; if(p.ageM>=12){ p.ageM=0; p.age++; birthday=true; }
  // 自然成長（未成年）
  if(p.age<18) ATTR_KEYS.forEach(k=>p.attrs[k]=Math.min(100,p.attrs[k]+0.07*RACES[p.race].growth*(1+tTrain(k)*0.5)));
  // 老化
  const e=effAge(p.age); if(e>55 && chance(0.05)){ const k=pick(['str','agi','vit']); p.attrs[k]=Math.max(1,p.attrs[k]-1); }
  // 生活成本
  const cost=livingCost(); if(cost){ addGold(-cost); rep.push(`生活開銷 -${cost}G`); }
  if(p.debt>0){ const it=Math.ceil(p.debt*0.02); p.debt+=it; rep.push(`債務利息 +${it}G（債務 ${fmt(p.debt)}G）`); p.mood=Math.max(0,p.mood-3); if(p.debt>600 && p.housing!=='inn' && p.housing!=='family'){ p.housing='inn'; rep.push('因負債被迫搬到普通旅館'); } }
  // 事業
  const bz=settleBusinesses(); if(G.businesses.length) rep.push(`事業損益 ${bz.total>=0?'+':''}${fmt(bz.total)}G`); rep.push(...bz.lines);
  // 健康
  const H=HOUSING[p.housing]; let regen=3+tfx('regen')+H.health;
  if(p.disease){ p.health-=p.disease.sev*0.6; p.disease.m=(p.disease.m||0)+1;
    if(p.age<18 && p.parents.some(i=>G.npcs[i]&&G.npcs[i].alive) && p.disease.m>=2){ rep.push(`家人帶你求醫，${p.disease.name}痊癒了`); p.disease=null; }
    else if(chance(0.25+p.attrs.vit/200)){ rep.push(`${p.disease.name}自然痊癒了`); p.disease=null; }
    if(p.health<25) rep.push('⚠ 健康狀況危急，請盡快就醫或休息！'); }
  else p.health=Math.min(healthCap(), p.health+regen);
  if(w.event&&WORLD_EVENTS[w.event.id].sick && !p.disease && chance(0.06*(1+tfx('sick')))) { p.disease={name:'瘟疫',sev:5}; rep.push('你感染了瘟疫！'); }
  if(!p.disease && p.health<35 && p.age>=18 && chance(0.03*(1+tfx('sick')))) { p.disease={name:'虛弱症',sev:2}; }
  p.mood=clamp(p.mood + (p.mood<60?2:-1) + H.mood + (w.event&&WORLD_EVENTS[w.event.id].mood?3:0) + (p.retired?1:0), 0, 100);
  const s=pStats(); p.hp=Math.min(s.hpMax, p.hp+s.hpMax*0.6); p.mp=s.mpMax;
  // 增益時效
  ['trade10'].forEach(k=>{ if(p.buffs[k]){ p.buffs[k]--; if(p.buffs[k]<=0) delete p.buffs[k]; } });
  // 年度免費命運券、成年禮
  if(birthday){ G.gacha.tickets++; rep.push(`${p.age}歲生日！獲得年度命運券×1`); if(p.age===18) G.pending.push({id:'EVT008',ctx:{}}); if(p.age===6) history('進入兒童期，可以開始學習與交朋友了。'); if(p.age===12) history('進入少年期，命運卡池開放了！'); }
  // 世界、NPC
  worldMonthly(); npcMonthly(); tryBirth();
  // 委託刷新
  if(p.age>=14) genQuests();
  // 排程事件
  G.scheduled.filter(x=>x.at<=G.mi).forEach(x=>{ const ev=eventById(x.id); if(ev && reqOk(ev.req)) queueEvent(ev); }); G.scheduled=G.scheduled.filter(x=>x.at>G.mi);
  // 隨機事件
  const ec = p.age<6?0.22: p.age<18?0.3:0.33;
  if(!G.pending.length && chance(ec)){ const ev=rollEvent(null); if(ev) queueEvent(ev); }
  p.stats.maxNet=Math.max(p.stats.maxNet, netWorth());
  // 死亡判定
  deathCheck();
  p.ap=apFor();
  if(p.alive) saveGame();
  return {rep, birthday};
}
function deathCheck(){
  const p=G.player; if(!p.alive) return;
  if(p.health<=0){ p.health=0; if(chance(0.35)) return playerDeath(p.disease?`病逝（${p.disease.name}）`:'衰弱而逝'); }
  const L=lifeSpanOf(p.race)*(1+tfx('life'))*(1+(p.health-60)/400); const ratio=p.age/L;
  if(ratio>0.75 && chance(0.002+Math.pow((ratio-0.75)*1.6,3)*0.25)) return playerDeath('壽終正寢');
  if(p.age>=12 && chance(0.00008)) return playerDeath('意外身亡');
}

/* ===================== 死亡、結局與傳承 ===================== */
function computeEndings(){
  const p=G.player, st=p.stats; const r=rankIdx(p.rankOk); const res=[];
  const add=(id,ok)=>{ if(ok) res.push(id); };
  add('beyond', flag('beyondFate'));
  add('darklord', flag('darklordPath') && p.dark>=60);
  add('demonslayer', flag('demonDefeated') && (st.cleared.abyssthrone||0)>0);
  add('guardian', st.abyssBoss>=1 && G.world.abyss<=25);
  add('hero', r>=rankIdx('S') || (st.bossKills>=8 && p.fame>=60));
  add('dragon', flag('dragonContract'));
  add('swordsaint', p.profession==='swordsaint' || p.profHistory.includes('swordsaint'));
  add('archmage', p.profession==='archmage' || p.profHistory.includes('archmage') || (p.attrs.int>=60 && Object.keys(p.skills).some(s=>SKILLS[s].dom==='magic'&&skLv(s)>=10)));
  add('weaver', flag('fateseer') && p.fate>=2);
  add('tycoon', st.maxNet>=40000 || G.businesses.some(b=>b.type==='alliance'));
  add('noble', flag('nobleTitle'));
  add('guildfounder', G.businesses.some(b=>b.type==='guildbranch'));
  add('craftsman', skLv('smithing')>=10 || flag('masterpiece'));
  add('strongest', r>=rankIdx('A') && st.quests>=60);
  add('traveler', REGION_ORDER.every(x=>st.visited[x]));
  add('elffriend', flag('elffriend') || Object.values(G.npcs).some(n=>n.race==='elf'&&n.alive&&n.aff>=90&&n.met));
  const kids=p.children.filter(c=>G.npcs[c]&&G.npcs[c].alive).length;
  add('founder', kids>=2 || p.generation>=3);
  const close=Object.values(G.npcs).filter(n=>n.alive&&n.met&&n.aff>=60).length;
  add('lonely', r>=rankIdx('A') && !p.spouse && close<2);
  if(!res.length){ add(p.age>=55?'ordinary':'forgotten', true); }
  else if(p.fame<5 && res.length<=1 && res[0]==='founder') res.push('ordinary');
  return res;
}
function lifeTitles(){ const p=G.player, st=p.stats; const t=[];
  if(st.quests>=40) t.push('優秀冒險者'); if(flag('demonDefeated')||st.bossKills>=10) t.push('傳奇英雄'); if(st.maxNet>=30000) t.push('商業巨擘');
  if(p.attrs.int>=60 && Object.keys(p.skills).some(s=>SKILLS[s].dom==='magic'&&skLv(s)>=10)) t.push('魔法賢者'); if(p.children.length>=2) t.push('家族始祖'); if(st.abyssBoss) t.push('世界守護者');
  if(flag('darklordPath')) t.push('黑暗傳說'); if(flag('beyondFate')) t.push('命運之外'); if(!t.length) t.push(p.age>=60?'平凡人生':'無名之人'); return t; }
function playerDeath(cause){
  const p=G.player; if(!p.alive) return; p.alive=false; p.cause=cause; G.pending=[];
  const ends=computeEndings(); G.ending={main:ends[0], extra:ends.slice(1), titles:lifeTitles()};
  history(`${p.name}於${p.age}歲時${cause}。`);
  const rec={ id:uid('L'), seed:G.seed, name:p.name, family:p.familyName, gen:p.generation, race:RACES[p.race].name, bg:BACKGROUNDS[p.background].name, age:p.age, cause,
    prof:p.profession?PROFESSIONS[p.profession].name:'無', profHistory:p.profHistory.map(x=>PROFESSIONS[x].name), talents:p.talents.map(t=>TALENTS[t].name), attrs:Object.fromEntries(ATTR_KEYS.map(k=>[k,Math.floor(p.attrs[k])])),
    level:p.level, gold:p.gold, net:Math.floor(netWorth()), rank:p.rankOk, fame:p.fame, spouse:p.spouse&&G.npcs[p.spouse]?G.npcs[p.spouse].name:null, children:p.children.map(c=>G.npcs[c]&&G.npcs[c].name).filter(Boolean),
    ending:ENDINGS.find(e=>e.id===G.ending.main).name, extra:G.ending.extra.map(id=>ENDINGS.find(e=>e.id===id).name), titles:G.ending.titles, history:p.history.slice(-60), stats:p.stats, year:G.world.year, at:Date.now() };
  G.familyLine.push({name:p.name, gen:p.generation, age:p.age, ending:rec.ending});
  const ch=loadChronicle(); ch.unshift(rec); saveChronicle(ch.slice(0,100));
  saveGame(); Bus.emit('death', rec);
}
function heirCandidates(){ return G.player.children.map(c=>G.npcs[c]).filter(n=>n&&n.alive); }
function inheritAs(cid){
  const old=G.player, c=G.npcs[cid]; if(!c||!c.alive) return '無法繼承';
  const np=blankPlayer();
  Object.assign(np, { name:c.name.split('・')[0], gender:c.gender, race:c.race==='dragon'?'human':c.race, age:c.age, ageM:c.ageM||0, background:old.background, familyName:old.familyName,
    personality:[c.pers], talents:(c.talents||[]).slice(0,3), attrs:{...c.st}, level:Math.max(1,c.lv||1), region:old.region, home:old.home, generation:old.generation+1,
    skills:JSON.parse(JSON.stringify(c.skills||{})), housing:old.housing==='family'?'family':old.housing });
  // 遺產結算
  const net=old.gold-old.debt; np.gold = net>0? Math.floor(net*0.75):0; np.debt = net<0? Math.floor(-net*0.5):0;
  np.fame=Math.floor(old.fame*0.4); np.quals=[]; np.stats.visited[np.region]=1;
  np.talents.forEach(t=>{ if(TALENTS[t]&&TALENTS[t].flag) np.flags[TALENTS[t].flag]=true; });
  // 家族關係
  const spouse=old.spouse&&G.npcs[old.spouse]&&G.npcs[old.spouse].alive? G.npcs[old.spouse]:null;
  np.parents = spouse? [spouse.id]:[]; if(spouse){ spouse.rel=spouse.gender==='男'?'父親':'母親'; spouse.spouse=null; spouse.aff=Math.max(spouse.aff,70); }
  old.children.filter(x=>x!==cid).forEach(x=>{ const s=G.npcs[x]; if(s&&s.alive){ s.rel='手足'; s.aff=Math.max(40,s.aff-20); } });
  Object.values(G.npcs).forEach(n=>{ if(n.alive&&n.met&&n.id!==cid){ n.aff=Math.floor(n.aff*0.5); n.romance=false; } if(n.spouse==='PLAYER') n.spouse=null; });
  delete G.npcs[cid];
  // 裝備保留在背包、卸下
  G.inv.items.forEach(()=>{}); np.equip={weapon:null,armor:null,acc:null};
  G.party=[]; G.player=np; np.hp=pStats().hpMax; np.mp=pStats().mpMax; np.ap=apFor();
  G.ending=null; G.pending=[]; G.scheduled=[];
  history(`第${np.generation}代家主${np.name}繼承了${old.name}的遺產（${fmt(np.gold)}G、事業${G.businesses.length}家）。`);
  if(np.age<18) np.housing='family';
  saveGame(); return '';
}

/* ===================== 存檔系統 ===================== */
const SAVE_KEY = n => `AL_slot_${n}`;
function saveGame(slot){
  if(!G) return; slot=slot||G.slot||1; G.slot=slot;
  try{
    const old=localStorage.getItem(SAVE_KEY(slot)); if(old) localStorage.setItem(SAVE_KEY(slot)+'_bak', old);
    const p=G.player; const data={meta:{version:GAME_VERSION, name:p.name, family:p.familyName, age:p.age, gen:p.generation, alive:p.alive, year:G.world.year, savedAt:Date.now()}, state:G};
    localStorage.setItem(SAVE_KEY(slot), JSON.stringify(data)); localStorage.setItem('AL_current', String(slot));
  }catch(e){ console.warn('save failed',e); }
}
function readSlot(slot, bak){ try{ const s=localStorage.getItem(SAVE_KEY(slot)+(bak?'_bak':'')); return s?JSON.parse(s):null; }catch(e){ return {corrupt:true}; } }
function validateState(s){ if(!s||typeof s!=='object') return '資料格式錯誤'; const need=['player','world','gacha','inv','npcs']; for(const k of need) if(!s[k]) return `缺少欄位：${k}`; if(!s.player.attrs||!s.gacha.pity) return '角色或抽卡資料損毀'; if(!s.gacha.pity.ticket||!s.gacha.pity.gold) return '保底紀錄損毀'; return ''; }
function migrate(s){
  // 版本遷移：補齊新欄位，不破壞舊存檔
  const base=blankPlayer(); Object.keys(base).forEach(k=>{ if(s.player[k]===undefined) s.player[k]=base[k]; });
  Object.keys(base.stats).forEach(k=>{ if(s.player.stats[k]===undefined) s.player.stats[k]=base.stats[k]; });
  s.inv.cons=Object.assign({potion:0,hipotion:0,ether:0,medicine:0,elixir:0}, s.inv.cons);
  s.familyLine=s.familyLine||[]; s.scheduled=s.scheduled||[]; s.pending=s.pending||[]; s.dungeon=s.dungeon||{}; s.quests=s.quests||{list:[],month:-1,done:0};
  s.version=GAME_VERSION; return s;
}
function loadSlot(slot, bak){
  const d=readSlot(slot,bak); if(!d) return '此欄位沒有存檔'; if(d.corrupt) return '存檔損毀，可嘗試還原備份';
  const v=validateState(d.state); if(v) return `存檔檢查失敗：${v}`;
  G=migrate(d.state); G.slot=slot; try{ localStorage.setItem('AL_current',String(slot)); }catch(e){} return '';
}
function deleteSlot(slot){ try{ localStorage.removeItem(SAVE_KEY(slot)); localStorage.removeItem(SAVE_KEY(slot)+'_bak'); }catch(e){} }
function exportSave(){ return JSON.stringify({meta:{version:GAME_VERSION, exported:Date.now()}, state:G}, null, 1); }
function importSave(text, slot){ let d; try{ d=JSON.parse(text); }catch(e){ return 'JSON 格式錯誤'; } const st=d.state||d; const v=validateState(st); if(v) return v; G=migrate(st); G.slot=slot; saveGame(slot); return ''; }
function loadChronicle(){ try{ return JSON.parse(localStorage.getItem('AL_chronicle')||'[]'); }catch(e){ return []; } }

function bar(v,max,cls=''){ const w=clamp(max?v/max*100:0,0,100); return `<div class="bar ${cls}"><i style="width:${w}%"></i></div>`; }
function btn(label, call, o={}){ return `<button class="btn ${o.cls||''}" ${o.dis?'disabled':''} ${o.title?`title="${esc(o.title)}"`:''} onclick="${call}">${label}${o.cost?`<span class="cost">${o.cost}</span>`:''}</button>`; }
function rtag(r){ return `<span class="tag r-${r}">${r}</span>`; }
function toast(msg, err){ const t=$('#toast'); const d=document.createElement('div'); if(err) d.className='err'; d.textContent=msg; t.appendChild(d); while(t.children.length>3) t.firstChild.remove(); setTimeout(()=>d.remove(), err?3200:2400); }
function crest(name, race){ const col={human:'#4a7fc1',elf:'#4f956b',dwarf:'#a0643c',beast:'#B94A48',halfelf:'#8876D8',dragon:'#333'}[race]||'#666'; const ch=esc((name||'?').slice(0,1));
  return `<svg class="crest" viewBox="0 0 64 72"><defs><linearGradient id="cg${race}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><path d="M32 3l27 9v20c0 19-12 31-27 37C17 63 5 51 5 32V12z" fill="url(#cg${race})" stroke="#D4AF68" stroke-width="2"/><path d="M32 9l21 7v16c0 15-9 25-21 30-12-5-21-15-21-30V16z" fill="none" stroke="rgba(212,175,104,.35)"/><text x="32" y="44" text-anchor="middle" font-size="24" fill="#F3EBDD" font-family="serif" font-weight="700">${ch}</text></svg>`; }

/* ---------- Modal ---------- */
function openModal(html, opt={}){ const root=$('#modal-root'); const m=document.createElement('div'); m.className='mask'; m.innerHTML=`<div class="modal ${opt.wide?'wide':''}">${html}</div>`; if(opt.dismiss!==false) m.addEventListener('click',e=>{ if(e.target===m) closeModal(); }); root.appendChild(m); UI.modal.push({el:m, opt}); }
function askConfirm(msg, yes){ openModal(`<h3>確認</h3><p>${esc(msg)}</p><div class="row mt" style="justify-content:flex-end">${btn('取消','closeModal(true)')}${btn('確定','A._yes()',{cls:'primary'})}</div>`); A._yes=()=>{ closeModal(true); yes(); }; }
function closeModal(silent){ const m=UI.modal.pop(); if(m){ m.el.remove(); if(m.opt.onClose) m.opt.onClose(); } if(!silent) afterAction(); }
function modalOpen(){ return UI.modal.length>0; }
function closeAll(){ while(UI.modal.length) closeModal(true); }

/* ---------- 行動結果處理 ---------- */
function handle(r){
  if(r==null){ }
  else if(typeof r==='string'){ if(r) toast(r,true); }
  else if(r.err) toast(r.err,true);
  else if(r.res&&r.res.log){ showResult({title:r.name||r.msg||'戰鬥', lines:r.out||r.res.out||[], battles:[r.res.log], ok:r.res.win}); return; }
  else if(r.out){ showResult({title:r.name||'結果', lines:r.out, ok:r.ok}); return; }
  else if(r.msg) toast(r.msg);
  afterAction();
}
function afterAction(){
  if(!G){ return; }
  if(!G.player.alive){ render(); if(!modalOpen()) showDeath(); return; }
  if(G.pending.length && !modalOpen()) showEvent();
  render();
}
function showResult({title, sub, lines=[], battles=[], ok}){
  const bl = battles.filter(Boolean).map((b,i)=>`<details class="blog"><summary>戰鬥紀錄 ${battles.length>1?i+1:''}（${b.length} 行）</summary><div class="lines">${b.map(esc).join('<br>')}</div></details>`).join('');
  openModal(`<div class="orn">✦ ✦ ✦</div><h2>${esc(title)}</h2>${sub?`<div class="sub">你選擇：${esc(sub)}</div>`:''}${ok===true?'<div class="good small">✔ 判定成功</div>':ok===false?'<div class="bad small">✘ 判定失敗</div>':''}
   <div class="desc">${lines.length?lines.map(l=>`• ${esc(l)}`).join('<br>'):'<span class="sub">沒有特別的變化。</span>'}</div>${bl}<div class="row mt" style="justify-content:flex-end">${btn('繼續','closeModal()',{cls:'primary'})}</div>`);
}

/* ---------- 事件 ---------- */
function showEvent(){
  const pe=G.pending[0]; if(!pe) return; const ev=eventById(pe.id); if(!ev){ G.pending.shift(); return afterAction(); }
  const cat={birth:'出生與家庭',child:'兒童與學習',job:'職業與工作',adventure:'冒險與探索',social:'人物與社交',economy:'經濟與交易',crisis:'疾病與危機',legend:'傳奇與神秘',late:'晚年與傳承'}[ev.cat]||'';
  const ch=ev.choices.map((c,i)=>{ const why=choiceAvailable(c); const meta=[]; if(c.cost&&c.cost.ap) meta.push(`消耗 ${c.cost.ap} 行動點`); if(c.cost&&c.cost.gold) meta.push(`花費 ${c.cost.gold}G`);
    if(c.check){ meta.push(`判定：${c.check.skill?SKILLS[c.check.skill].name+'／':''}${c.check.a?ATTR[c.check.a]:''}（成功率 ${Math.round(checkChance(c.check)*100)}%）`); }
    if(why) meta.push(`<span class="bad">${why}</span>`);
    return `<button class="choice" ${why?'disabled':''} onclick="A.choose(${i})">${esc(c.text)}${meta.length?`<span class="meta">${meta.join('　')}</span>`:''}</button>`; }).join('');
  openModal(`<div class="orn">${cat} ・ ${ev.id}</div><h2>${esc(ev.title)}</h2><div class="desc">${esc(eventText(ev, pe.ctx||{}))}</div>${ch}`, {dismiss:false});
}

}

/* ---------- 頁面：人物關係 ---------- */
function pRel(){
  const p=G.player; const f=UI.rel;
  let list=Object.values(G.npcs).filter(n=>n.met);
  if(f==='family') list=list.filter(n=>p.parents.includes(n.id)||p.children.includes(n.id)||p.spouse===n.id||n.rel==='手足');
  if(f==='party') list=list.filter(n=>G.party.includes(n.id));
  if(f==='here') list=list.filter(n=>n.alive&&npcHere(n));
  if(f==='dead') list=list.filter(n=>!n.alive); else list=list.filter(n=>n.alive);
  list.sort((a,b)=>b.aff-a.aff);
  const unmet=Object.values(G.npcs).filter(n=>n.card&&!n.met&&n.alive).length;
  return `<h2>人物關係</h2><p class="sub small">NPC 有自己的年齡、工作、關係與人生進度，會老去、結婚、離世。互動需在同一地區（家人與隊友除外）。尚有 ${unmet} 位重要人物未曾相遇——透過人物卡池、事件與探索結識。</p>
  <div class="tabs">${[['all','全部'],['here','此地'],['family','家人'],['party','隊伍'],['dead','已故']].map(([k,l])=>`<button class="${f===k?'on':''}" onclick="A.relf('${k}')">${l}</button>`).join('')}</div>
  <div class="grid g2">${list.map(npcCard).join('')||'<div class="empty">沒有符合的人物</div>'}</div>`;
}
function npcCard(n){
  const p=G.player, here=npcHere(n), r=NPCS[n.id]?NPCS[n.id].r:null; const inParty=G.party.includes(n.id); const noAP=p.ap<1;
  const rel = p.parents.includes(n.id)?n.rel: p.spouse===n.id?'伴侶': p.children.includes(n.id)?'孩子': n.rel || (inParty?'隊友':n.aff>=60?'好友':'熟人');
  const btns = !n.alive? '' : [btn('聊天',`A.rel('${n.id}','chat')`,{cls:'sm',dis:noAP||!here}),btn('送禮 50G',`A.rel('${n.id}','gift')`,{cls:'sm',dis:noAP||!here}),btn('一起訓練',`A.rel('${n.id}','train')`,{cls:'sm',dis:noAP||!here}),
    (n.teach||Object.keys(n.skills).length)&&!n.isChild?btn('請求指導',`A.rel('${n.id}','mentor')`,{cls:'sm',dis:noAP||!here||n.respect<40,title:'尊敬度40以上'}):'',

  const p=G.player; const tgt=UI.eqT==='PLAYER'?p:G.npcs[UI.eqT]; if(!tgt){ UI.eqT='PLAYER'; return pInv(); }

  return `<h2>裝備與背包</h2><div class="tabs">${who.map(w=>`<button class="${UI.eqT===w.id?'on':''}" onclick="A.eqt('${w.id}')">${esc(w.name)}</button>`).join('')}</div>
  <div class="grid g3">${['weapon','armor','acc'].map(s=>{ const u=tgt.equip[s]; const it=u&&G.inv.items.find(i=>i.uid===u); const d=it&&EQUIPMENT[it.id];
    return `<div class="card flat"><div class="sub small">${slotN[s]}</div>${it?`<h4 style="margin:2px 0">${rtag(d.r)} ${d.name}${it.enh?` +${it.enh}`:''}</h4><div class="tiny sub">${equipDesc(d)}｜耐久 ${it.dur}/100</div>${btn('卸下',`A.uneq('${s}')`,{cls:'sm mt'})}`:'<div class="empty">空</div>'}</div>`; }).join('')}</div>

  ${items.length?`<table class="t"><tr><th>名稱</th><th class="hide-m">屬性</th><th>狀態</th><th></th></tr>${items.map(it=>{ const d=EQUIPMENT[it.id]; const own=eqOwner(it.uid); const er=equipCheck(it, tgt);
   return `<tr><td>${rtag(d.r)} ${d.name}${it.enh?` <span class="goldc">+${it.enh}</span>`:''}<div class="tiny sub">${{weapon:'武器',armor:'防具',acc:'飾品'}[d.slot]}・需求Lv${d.lv}${d.profs?'・限定職業':''}</div></td><td class="small hide-m">${equipDesc(d)}</td><td class="small">耐久 ${it.dur}${own?`<div class="tiny goldc">${esc(own)}裝備中</div>`:''}</td>

  <div class="grid g2 mt"><div class="card"><h3>消耗品</h3>${Object.entries(G.inv.cons).map(([k,v])=>`<div class="logline" style="align-items:center"><span style="flex:1">${CONSUMABLES[k].name} ×${v}<div class="tiny sub">${CONSUMABLES[k].desc}</div></span>${CONSUMABLES[k].health&&v?btn('使用',`A.do(()=>useCons('${k}'))`,{cls:'sm'}):''}</div>`).join('')}</div>
   <div class="card"><h3>素材</h3>${Object.entries(G.inv.mats).filter(([,v])=>v>0).map(([k,v])=>`<div class="logline"><span style="flex:1">${MATERIALS[k].name} ×${v}</span><span class="tiny sub">參考價 ${MATERIALS[k].price}G</span></div>`).join('')||'<div class="empty">沒有素材</div>'}
   ${Object.entries(G.inv.goods).filter(([,v])=>v>0).length?`<div class="small sub mt">貿易商品</div>${Object.entries(G.inv.goods).filter(([,v])=>v>0).map(([k,v])=>`<div class="logline"><span>${TRADE_GOODS[k].name} ×${v}</span></div>`).join('')}`:''}</div></div>`;
}
function equipCheck(it, tgt){ const d=EQUIPMENT[it.id]; const lv=tgt===G.player?G.player.level:tgt.lv; if(lv<d.lv) return `需要等級${d.lv}`; const pf=tgt===G.player?G.player.profession:tgt.prof; if(d.profs&&!d.profs.includes(pf)) return '職業不符'; if(d.races&&!d.races.includes(tgt.race)) return '種族不符'; if(tgt.equip[d.slot]===it.uid) return '已裝備'; return ''; }
function repairCost(it){ return skLv('smithing')>=3?0:Math.ceil((100-it.dur)*EQUIPMENT[it.id].price*0.003+5); }

/* ---------- 行動入口 ---------- */
const A = {
  go(p){ UI.page=p; UI.sideOpen=false; render(); $('#main').scrollTop=0; },
  side(){ openModal(sideHTML()+`<div class="row mt" style="justify-content:flex-end">${btn('關閉','closeModal()')}</div>`); },
  do(fn){ if(!G.player.alive) return; handle(fn()); },
  choose(i){ const r=resolveEvent(i); if(!r) return; if(r.err) return toast(r.err,true); closeModal(true); showResult({title:r.title, sub:r.choice, ok:r.ok, lines:r.lines, battles:r.battles}); render(); },
  month(){ if(!G.player.alive) return showDeath(); if(G.pending.length) return showEvent(); const r=endMonth(); if(r.err) return toast(r.err,true); r.rep.slice(0,3).forEach(l=>toast(l)); r.rep.forEach(l=>log(l)); afterAction(); },
  skip(){ if(!G.player.alive) return showDeath(); if(G.pending.length) return showEvent(); let n=0; while(n<12 && G.player.alive && !G.pending.length){ const r=endMonth(); if(r.err) break; r.rep.forEach(l=>log(l)); n++; } toast(`度過了 ${n} 個月`); afterAction(); },
  housing(v){ G.player.housing=v; log(`搬到${HOUSING[v].name}`); saveGame(); render(); },
  retire(){ const p=G.player; p.retired=!p.retired; if(p.retired) history('正式退休，開始享受人生。'); render(); },
  gpool(id){ UI.gPool=id; render(); },
  pull(cur,n){ const r=gachaPull(UI.gPool,cur,n); if(r.err) return toast(r.err,true); render(); showPull(r); },
  flipAll(){ document.querySelectorAll('.gcard').forEach(e=>e.classList.add('flip')); },
  shard(t){ const e=shardExchange(t); if(e) toast(e,true); else toast(`兌換天賦「${TALENTS[t].name}」`); render(); },
  travel(r){ const e=travel(r); if(e) return toast(e,true); toast(`抵達${REGIONS[r].name}`); afterAction(); },
  join(){ setFlag('guildMember'); G.player.gp=Math.max(G.player.gp,1); history('登記成為F級冒險者'); genQuests(); render(); },
  quest(id){ handle(doQuest(id)); },
  row(id){ if(id==='PLAYER'){ G.player.row=(G.player.row||'front')==='front'?'back':'front'; } else { const n=G.npcs[id]; n.row=(n.row||'front')==='front'?'back':'front'; } render(); },
  tactic(v){ G.tactic=v; render(); }, risk(v){ G.risk=v; render(); },
  dungeon(id){ const r=runDungeon(id); if(r.err) return toast(r.err,true); render(); showDungeon(r); },
  relf(f){ UI.rel=f; render(); },
  rel(id,k){ handle(interact(id,k)); },
  prof(id){ const e=changeProfession(id); if(e) return toast(e,true); toast(`就任${PROFESSIONS[id].name}`); afterAction(); },
  trial(id){ handle(profTrial(id)); },
  swapT(a,b){ if(!a) return; swapTalent(a,b); render(); },
  eqt(id){ UI.eqT=id; render(); },
  equip(u){ const tgt=UI.eqT==='PLAYER'?G.player:G.npcs[UI.eqT]; const it=G.inv.items.find(i=>i.uid===u); const er=equipCheck(it,tgt); if(er) return toast(er,true);
    [G.player,...Object.values(G.npcs)].forEach(w=>{ if(w.equip) Object.keys(w.equip).forEach(s=>{ if(w.equip[s]===u) w.equip[s]=null; }); });
    tgt.equip[EQUIPMENT[it.id].slot]=u; toast(`裝備${EQUIPMENT[it.id].name}`); render(); },
  uneq(s){ const tgt=UI.eqT==='PLAYER'?G.player:G.npcs[UI.eqT]; tgt.equip[s]=null; render(); },
  enh(u){ const it=G.inv.items.find(i=>i.uid===u); const need=(it.enh+1)*2, cost=100*(it.enh+1); if((G.inv.mats.enhance||0)<need) return toast(`強化素材不足（需${need}）`,true); if(!spendGold(cost)) return toast(`金幣不足（需${cost}G）`,true);
    G.inv.mats.enhance-=need; if(chance(Math.max(.3,1-it.enh*.1))){ it.enh++; toast(`強化成功！+${it.enh}`); } else toast('強化失敗……',true); saveGame(); render(); },
  repair(u){ const it=G.inv.items.find(i=>i.uid===u); const c=repairCost(it); if(!spendGold(c)) return toast('金幣不足',true); it.dur=100; toast(c?`修理完成（${c}G）`:'以鍛造術修理完成'); render(); },
  sellEq(u){ const it=G.inv.items.find(i=>i.uid===u); const v=sellPrice(EQUIPMENT[it.id].price*0.45); G.inv.items=G.inv.items.filter(i=>i.uid!==u); addGold(v); toast(`售出得 ${v}G`); render(); },
  buyEq(id){ const pr=equipPrice(id); if(!spendGold(pr)) return toast('金幣不足',true); addItem(id); toast(`購買${EQUIPMENT[id].name}`); render(); },
  buyC(id,n){ const pr=consPrice(id)*n; if(!spendGold(pr)) return toast('金幣不足',true); G.inv.cons[id]=(G.inv.cons[id]||0)+n; toast(`購買${CONSUMABLES[id].name}×${n}`); render(); },
  sellM(k,n){ n=Math.min(n,G.inv.mats[k]||0); const v=sellPrice(MATERIALS[k].price)*n; G.inv.mats[k]-=n; addGold(v); toast(`售出得 ${v}G`); render(); },
  trade(g,n){ const p=G.player; const here=goodPrice(g,p.region); if(n>0){ const c=buyPrice(here)*n; if(!spendGold(c)) return toast('金幣不足',true); G.inv.goods[g]=(G.inv.goods[g]||0)+n; toast(`買入${TRADE_GOODS[g].name}×${n}（${c}G）`); }
    else { n=-n; if((G.inv.goods[g]||0)<n||n<=0) return; const v=sellPrice(here*0.95)*n; G.inv.goods[g]-=n; addGold(v); addSkillExp('negotiation',n*2); toast(`賣出${TRADE_GOODS[g].name}×${n}（${v}G）`); } render(); },
  bizBuy(k){ const e=buyBusiness(k); if(e) return toast(e,true); toast(`開設${BUSINESSES[k].name}！`); afterAction(); },
  bizPrice(u,v){ G.businesses.find(b=>b.uid===u).price=v; render(); },
  bizMgr(u,v){ G.businesses.forEach(b=>{ if(b.manager===v&&v) b.manager=null; }); G.businesses.find(b=>b.uid===u).manager=v||null; render(); },
  bizUp(u){ const b=G.businesses.find(x=>x.uid===u); const c=Math.round(BUSINESSES[b.type].cost*0.6*b.level); if(!spendGold(c)) return toast('資金不足',true); b.level++; toast(`升級至Lv${b.level}`); render(); },
  bizStaff(u,d){ const b=G.businesses.find(x=>x.uid===u); b.staff=clamp(b.staff+d,0,b.level*2+1); render(); },
  bizSell(u){ const b=G.businesses.find(x=>x.uid===u); const v=Math.floor(BUSINESSES[b.type].cost*0.5*(1+(b.level-1)*0.5)*(0.5+b.rep/100)); askConfirm(`以 ${fmt(v)}G 出售${BUSINESSES[b.type].name}？`, ()=>{ G.businesses=G.businesses.filter(x=>x.uid!==u); addGold(v); log(`出售${BUSINESSES[b.type].name}，得 ${v}G`); saveGame(); render(); }); },
  kids(){ G.player.wantChildren=!G.player.wantChildren; render(); },
  heir(id){ setWill(id); toast('已指定繼承人'); render(); },
  edu(id,k){ handle(educateChild(id,k)); },
  chron(t){ UI.chron=t; render(); },
  saveTo(n){ G.slot=n; saveGame(n); toast(`已儲存到欄位 ${n}`); render(); },
  load(n,bak){ const e=loadSlot(n,bak); if(e) return toast(e,true); closeAll(); document.body.innerHTML=''; UI.page='home'; render(); toast(bak?'已還原備份':'讀取完成'); if(!G.player.alive) showDeath(); else afterAction(); },
  del(n){ askConfirm(`確定刪除欄位 ${n}？此動作無法復原。`, ()=>{ deleteSlot(n); render(); }); },
  export(){ openModal(`<h2>匯出存檔</h2><p class="small sub">複製下方 JSON 保存，或下載為檔案（部分內嵌環境不允許下載，請改用複製）。</p><textarea id="expTxt" readonly style="width:100%;height:220px;background:#0d1320;color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:11px">${esc(exportSave())}</textarea><div class="row mt" style="justify-content:flex-end">${btn('複製','A.copyExp()',{cls:'primary'})}${btn('下載檔案','A.dlExp()')}${btn('關閉','closeModal()')}</div>`); },
  copyExp(){ const t=$('#expTxt'); try{ navigator.clipboard.writeText(t.value).then(()=>toast('已複製到剪貼簿'),()=>{ t.select(); toast('請手動複製（已全選）'); }); }catch(e){ t.select(); toast('請手動複製（已全選）'); } },
  dlExp(){ try{ const b=new Blob([exportSave()],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`adventurers-life_${G.player.name}_${G.player.age}歲.json`; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ toast('此環境不支援下載，請使用複製',true); } },
  pasteImp(){ openModal(`<h2>貼上存檔 JSON</h2><textarea id="impTxt" style="width:100%;height:200px;background:#0d1320;color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:11px"></textarea><div class="row mt" style="justify-content:flex-end">${btn('匯入','A.doPaste()',{cls:'primary'})}${btn('取消','closeModal()')}</div>`); },
  doPaste(){ const txt=$('#impTxt').value; const slot=G?G.slot:1; const e=importSave(txt, slot); if(e) return toast('匯入失敗：'+e,true); closeAll(); document.body.innerHTML=''; render(); toast('匯入成功'); if(!G.player.alive) showDeath(); else afterAction(); },
  import(inp){ const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ const slot=G?G.slot:1; const e=importSave(rd.result, slot); if(e) return toast('匯入失敗：'+e,true); closeAll(); document.body.innerHTML=''; render(); toast('匯入成功'); if(!G.player.alive) showDeath(); }; rd.readAsText(f); },
  title(){ closeAll(); if(G) saveGame(); G=null; renderTitle(); },

  chronOnly(){ const ch=loadChronicle(); openModal(`<h2>冒險者編年史</h2>${ch.map(r=>`<div class="logline"><span class="d">第${r.gen}代</span><span>${esc(r.family)}家・${esc(r.name)}｜${r.race}｜享年${r.age}｜<span class="goldc">${esc(r.ending)}</span><div class="tiny sub">${r.titles.join('、')}・${esc(r.cause)}</div></span></div>`).join('')||'<div class="empty">尚無紀錄</div>'}`,{wide:true}); },
  toChron(){ closeAll(); UI.page='chron'; UI.chron='all'; render(); setTimeout(()=>{ if(!G.player.alive) {} },0); },

  newLife(){ const slot=G?G.slot:(+lsGet('AL_current')||1); closeAll(); G=null; UI.create={name:genNameSafe('男'), fam:SURNAMES[Math.floor(Math.random()*SURNAMES.length)], gender:'男', race:'human', bg:'farmer', slot}; renderCreate(); },
  cSet(k,v){ UI.create[k]=v; if(k==='gender') UI.create.name=genNameSafe(v); renderCreate(); },
  cRand(w){ const c=UI.create; const r=a=>a[Math.floor(Math.random()*a.length)]; c.name=genNameSafe(c.gender); if(w==='all'){ c.gender=r(['男','女']); c.name=genNameSafe(c.gender); c.race=r(Object.keys(RACES)); c.bg=r(Object.keys(BACKGROUNDS)); c.fam=r(SURNAMES);} renderCreate(); },
  start(){ const c=UI.create; const sv=$('#cseed').value.trim(); const seed= sv? (parseInt(sv,10)||[...sv].reduce((h,ch)=>Math.imul(h^ch.charCodeAt(0),16777619)>>>0,2166136261)) : undefined;
    createCharacter({name:(c.name||'無名').trim(), familyName:(c.fam||'').trim(), gender:c.gender, race:c.race, background:c.bg, seed}); G.slot=c.slot||1; G.player.ap=apFor(); saveGame(G.slot);
    document.body.innerHTML=''; UI.page='home'; render(); afterAction(); }
};
function genNameSafe(g){ const a=g==='女'?NAMES_F:NAMES_M; return a[Math.floor(Math.random()*a.length)]; }
Bus.on('death', ()=>{});

/* ---------- 啟動 ---------- */
window.addEventListener('DOMContentLoaded', ()=>{
  const cur=+lsGet('AL_current');
  if(cur && readSlot(cur) && !loadSlot(cur)){ render(); if(!G.player.alive) showDeath(); else afterAction(); }
  else renderTitle();
});

</script></body></html>
