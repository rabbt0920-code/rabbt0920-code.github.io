<div id="app"><div id="screen"></div><div id="modal-root"></div><div id="toast-root"></div></div>
<script>
'use strict';
/* ===== core.js ===== */
/* =========================================================
 * CORE 模組：工具、日曆、存檔、共用模擬公式、UI 基礎
 * ========================================================= */
const VER = 1;

const U = (() => {
  function mul(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const o = {
    r: Math.random,
    seed(n) { o.r = mul(n); },
    ri(a, b) { return Math.floor(o.r() * (b - a + 1)) + a; },
    rf(a, b) { return a + o.r() * (b - a); },
    pick(arr) { return arr[Math.floor(o.r() * arr.length)]; },
    chance(p) { return o.r() < p; },
    clamp(v, a = 0, b = 100) { return v < a ? a : v > b ? b : v; },
    gauss() { return (o.r() + o.r() + o.r() + o.r() - 2) * 1.732; },
    shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(o.r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    wpick(items, wf) {
      let t = 0; const ws = items.map(x => { const w = Math.max(0, wf(x)); t += w; return w; });
      if (t <= 0) return null; let r = o.r() * t;
      for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
      return items[items.length - 1];
    },
    esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
    // 金錢：1 單位 = ₩100
    money(n) {
      const w = Math.round(n * 100), a = Math.abs(w), sg = w < 0 ? '-' : '';
      if (a >= 1e8) return `${sg}₩${(a / 1e8).toFixed(a >= 1e9 ? 0 : 1)}億`;
      if (a >= 1e4) return `${sg}₩${Math.round(a / 1e4).toLocaleString()}萬`;
      return `${sg}₩${a.toLocaleString()}`;
    },
    num(n) {
      n = Math.round(n); const a = Math.abs(n);
      if (a >= 1e8) return (n / 1e8).toFixed(1) + '億';
      if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e5 ? 0 : 1) + '萬';
      return n.toLocaleString();
    },
    f1(n) { return (Math.round(n * 10) / 10).toString(); },
    deep(o2) { return JSON.parse(JSON.stringify(o2)); }
  };
  return o;
})();

const Cal = {
  start: Date.UTC(2026, 2, 2), // 遊戲開始日：2026/3/2（星期一，韓國新學年）
  WD: ['日', '一', '二', '三', '四', '五', '六'],
  date(day) { const d = new Date(Cal.start + day * 864e5); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), wd: d.getUTCDay() }; },
  dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); },
  str(day) { const t = Cal.date(day); return `${t.y}年${t.m}月${t.d}日（${Cal.WD[t.wd]}）`; },
  short(day) { const t = Cal.date(day); return `${t.y}/${t.m}/${t.d}`; },
  isLastSat(day) { const t = Cal.date(day); return t.wd === 6 && t.d + 7 > Cal.dim(t.y, t.m); },
  dayOf(y, m, d) { return Math.round((Date.UTC(y, m - 1, d) - Cal.start) / 864e5); },
  nextExam(day) { for (let i = 0; i < 40; i++) if (Cal.isLastSat(day + i)) return day + i; return day + 30; },
  holiday(day) { const t = Cal.date(day); return DATA.HOLIDAYS[`${t.m}-${t.d}`] || null; }
};

/* ---------- 存檔：自動檔 + 備份檔 + 3 個手動欄位，含版本欄位 ---------- */
const Store = {
  mem: {}, // localStorage 不可用時的記憶體備援
  _ls() { try { return window.localStorage; } catch (e) { return null; } },
  key: (mode, slot) => `kpopsim.v1.${mode}.${slot}`,
  _set(k, v) { const ls = Store._ls(); try { if (ls) ls.setItem(k, v); else Store.mem[k] = v; return true; } catch (e) { Store.mem[k] = v; return false; } },
  _get(k) { const ls = Store._ls(); try { return (ls ? ls.getItem(k) : Store.mem[k]) ?? null; } catch (e) { return Store.mem[k] ?? null; } },
  _del(k) { const ls = Store._ls(); try { if (ls) ls.removeItem(k); } catch (e) { } delete Store.mem[k]; },
  put(mode, slot, state, label) {
    try { return Store._set(Store.key(mode, slot), JSON.stringify({ ver: VER, t: Date.now(), label: label || '', state })); } catch (e) { return false; }
  },
  get(mode, slot) {
    try {
      const raw = Store._get(Store.key(mode, slot)); if (!raw) return null;
      const p = JSON.parse(raw);
      if (!p || typeof p !== 'object' || !p.state || typeof p.state !== 'object' || p.ver > VER) return null;
      return p;
    } catch (e) { return null; }
  },
  info(mode, slot) { const p = Store.get(mode, slot); return p ? { t: p.t, label: p.label } : null; },
  del(mode, slot) { Store._del(Store.key(mode, slot)); },
  autosave(mode, state, label) {
    const cur = Store._get(Store.key(mode, 'auto'));
    if (cur) Store._set(Store.key(mode, 'bak'), cur); // 上一份自動檔作為備份，避免寫入中斷造成損毀
    return Store.put(mode, 'auto', state, label);
  },
  latest(mode) {
    let best = null;
    for (const sl of ['auto', 'bak', '1', '2', '3']) { const p = Store.get(mode, sl); if (p && (!best || p.t > best.p.t)) best = { slot: sl, p }; }
    return best;
  },
  exportJSON(mode, state) { return JSON.stringify({ ver: VER, mode, state }); },
  importJSON(txt) {
    try { const p = JSON.parse(txt); if (p && p.state && (p.mode === 'idol' || p.mode === 'mgr')) return p; } catch (e) { }
    return null;
  }
};

/* ---------- 共用模擬公式（偶像與經紀人模式共用）---------- */
const Sim = {
  val(c, key) {
    if (c.ab && c.ab[key] !== undefined) return c.ab[key];
    if (c.st && c.st[key] !== undefined) return c.st[key];
    if (c.hid && c.hid[key] !== undefined) return c.hid[key];
    if (c.car && c.car[key] !== undefined) return c.car[key];
    return 0;
  },
  // 檢定：g 大成功 / k 成功 / f 失敗 / b 大失敗
  roll(c, check) {
    const luckAdj = ((c.hid.luck ?? 50) - 50) / 5;
    const m = Sim.val(c, check.st) + U.rf(-18, 18) + luckAdj - check.diff;
    return m >= 22 ? 'g' : m >= 0 ? 'k' : m >= -22 ? 'f' : 'b';
  },
  // 狀態對表現的修正（舞台、考核用）
  form(c) {
    let f = 1;
    if (c.st.stress > 70) f -= .06; if (c.st.mood < 30) f -= .05; if (c.st.stam < 40) f -= .06;
    if (c.injury > 0) f -= .10; if (c.st.health < 40) f -= .05;
    return f;
  },
  weighted(c, w) { let t = 0; for (const k in w) t += w[k] * c.ab[k]; return t; },
  // 單次訓練成長：天賦、邊際遞減、狀態、重複行動懲罰
  gain(c, k, base, o = {}) {
    const tal = c.hid.tal[k] ?? 1, cur = c.ab[k];
    let e = .30 * base * tal * Math.pow(Math.max(.05, 1 - cur / 105), 1.4);
    e *= U.clamp((Math.min(100, 50 + 38 * tal) - cur) / 18, .06, 1); // 天賦決定能力上限
    if (c.st.stress > 70) e *= .78; else if (c.st.stress > 50) e *= .92;
    if (c.st.stam < 30) e *= .7; else if (c.st.stam < 50) e *= .9;
    if (c.st.mood > 70) e *= 1.08; else if (c.st.mood < 30) e *= .85;
    if ((c.hid.fatigue || 0) > 60) e *= .85;
    if (c.pers === 'diligent') e *= 1.08;
    if (c.traits && c.traits.includes('perfect')) e *= 1.1;
    if (c.pers === 'rebel' && (k === 'rap' || k === 'charm')) e *= 1.12;
    if (c.flags && c.flags.rebound) e *= 1.15;
    const age = c.age || 14; e *= age <= 13 ? 1 : age <= 17 ? 1.05 : .9;
    if (o.rep) e *= Math.max(.55, 1 - .12 * o.rep);
    if (o.mult) e *= o.mult;
    return e;
  },
  rank(arr, key) { return arr.slice().sort((a, b) => b[key] - a[key]); }
};

/* ---------- UI 基礎 ---------- */
const ACT = {}; // data-act 分派表
const UI = {
  bar(label, val, max = 100, cls = '', txt) {
    const p = U.clamp(val / max * 100, 0, 100);
    return `<div class="bar ${cls}"><div class="bar-top"><span>${label}</span><b>${txt ?? Math.round(val)}</b></div><div class="bar-bg"><i style="width:${p}%"></i></div></div>`;
  },
  chip(t, cls = '') { return `<span class="chip ${cls}">${t}</span>`; },
  modal(html, o = {}) {
    const r = document.getElementById('modal-root'); if (!r) return;
    r.innerHTML = `<div class="overlay"><div class="modal ${o.cls || ''}">${html}</div></div>`;
    r.firstChild.scrollTop = 0;
  },
  close() { const r = document.getElementById('modal-root'); if (r) r.innerHTML = ''; },
  isOpen() { const r = document.getElementById('modal-root'); return !!(r && r.innerHTML); },
  toast(msg, kind = '') {
    const r = document.getElementById('toast-root'); if (!r) return;
    const d = document.createElement('div'); d.className = 'toast ' + kind; d.textContent = msg; r.appendChild(d);
    setTimeout(() => d.classList.add('out'), 2200); setTimeout(() => d.remove(), 2700);
  },
  confirm(msg, act, data = {}, yes = '確定') {
    const attrs = Object.entries(data).map(([k, v]) => `data-${k}="${U.esc(v)}"`).join(' ');
    UI.modal(`<h3>請確認</h3><p>${msg}</p><div class="btn-row"><button class="btn ghost" data-act="u.close">取消</button><button class="btn danger" data-act="${act}" ${attrs}>${yes}</button></div>`, { cls: 'small' });
  },
  alert(title, msg) { UI.modal(`<h3>${title}</h3><p class="pre">${msg}</p><div class="btn-row"><button class="btn" data-act="u.close">好</button></div>`, { cls: 'small' }); },
  fmtDelta(k, v) {
    const lab = DATA.LABEL[k] || k, sg = v > 0 ? '+' : '', n = Math.abs(v) >= 100 ? U.num(v) : U.f1(v);
    return `<span class="delta ${v > 0 ? (k === 'stress' || k === 'scandal' || k === 'fatigue' ? 'bad' : 'up') : (k === 'stress' || k === 'scandal' || k === 'fatigue' ? 'up' : 'bad')}">${lab} ${sg}${k === 'money' ? U.money(v) : n}</span>`;
  }
};
document.addEventListener && document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { try { f(el.dataset, el, e); } catch (err) { console.error(err); UI.toast('發生錯誤：' + err.message, 'bad'); } }
});
ACT['u.close'] = () => UI.close();

/* ===== idol.js ===== */
/* =========================================================
 * IDOL 模組：偶像模式引擎（狀態、每日行動、考核、出道、宣傳、結局）
 * 全域狀態 I；UI 在 idol_ui.js
 * ========================================================= */
let I = null;
const Idol = {};
const ST4 = ['stam', 'mood', 'stress', 'health'];
const CAR = ['fans', 'fame', 'pop', 'eval', 'money'];
const GROUP_NAMES = ['LUMENA', 'PRISM7', 'ECHOES', 'AURUM', 'STELLA.B', 'HALCYON', 'VELOCITY', 'MOONLIT'];
const DEBUT_SLOTS = 5;

/* ---------- 文字代號 ---------- */
Idol.fmt = function (t) {
  if (typeof t === 'function') t = t(I);
  return String(t ?? '').replace(/\{([a-z]+)(\.p)?\}/g, (m, id, p) => {
    if (id === 'me') return U.esc(I.name);
    if (id === 'co') return DATA.CO;
    if (id === 'rival') return DATA.RIVAL;
    if (id === 'family') return I.familyName;
    if (id === 'mate') return U.esc(I._mate || '隊友');
    if (id === 'npc') id = I._npc || 'xiaen';
    const n = I.npc[id]; if (!n) return m;
    return p ? (n.g === 'm' ? '他' : '她') : n.name;
  });
};
Idol.log = function (txt, kind = '') { I.logs.unshift({ day: I.day, txt, kind }); if (I.logs.length > 250) I.logs.length = 250; };

/* ---------- 競爭者（練習生池） ---------- */
Idol.rAge = r => r.age0 + Math.floor((I.day - r.day0) / 365);
Idol.mkRival = function (o) {
  const focus = o.focus || U.shuffle(DATA.ABK).slice(0, U.ri(1, 2));
  const ab = {}, tal = {};
  DATA.ABK.forEach(k => {
    ab[k] = U.clamp(U.ri(4, 10) + (o.age - 11) * 2.2 + U.gauss() * 1.5, 2, 90);
    tal[k] = U.rf(.85, 1.2) + (focus.includes(k) ? .15 : 0);
    if (focus.includes(k)) ab[k] += U.ri(4, 9);
  });
  return { id: o.id || ('r' + U.ri(1000, 99999)), name: o.name, g: o.g, age0: o.age, day0: I.day, ab, tal, eff: U.rf(.7, 1.08), focus, eval: U.ri(35, 65), looks: U.ri(30, 85), luck: U.ri(20, 80), npc: o.npc || null, sc: [] };
};
Idol.fillerName = function () {
  const used = new Set(I.pool.map(r => r.name).concat([I.name]));
  const pool = DATA.FILLER_NAMES.filter(n => !used.has(n));
  return pool.length ? U.pick(pool) : '練習生' + U.ri(10, 99);
};
Idol.rivalMonth = function (r) {
  DATA.ABK.forEach(k => {
    const n = r.focus.includes(k) ? 22 : 11; let a = r.ab[k];
    for (let i = 0; i < n; i++) a += .30 * r.tal[k] * Math.pow(Math.max(.05, 1 - a / 105), 1.4) * r.eff * U.clamp((Math.min(100, 50 + 38 * r.tal[k]) - a) / 18, .06, 1);
    r.ab[k] = a;
  });
  r.eval = U.clamp(r.eval + U.rf(-2, 2.5), 10, 95);
};

/* ---------- 新遊戲 ---------- */
Idol.newGame = function (o) {
  const fam = DATA.FAMILIES.find(f => f.id === o.family) || U.pick(DATA.FAMILIES);
  const s = {
    mode: 'idol', ver: VER, name: o.name, g: o.g, age: 12, bd: { m: U.ri(1, 12), d: U.ri(1, 28) },
    day: 0, apMax: 3, ap: 3, family: fam.id, familyName: fam.n, allow: fam.allow, traits: o.traits.slice(), pers: null,
    ab: {}, st: { stam: 100, mood: 70, stress: 15, health: 85 }, car: { fans: 0, fame: 0, pop: 0, eval: 40, money: fam.money },
    hid: { tal: {}, luck: 30 + U.ri(0, 50), grit: 30 + U.ri(0, 40), res: 30 + U.ri(0, 40), looks: 30 + U.ri(0, 50), scandal: 0, acad: 30 + U.ri(0, 40), team: 20, fatigue: 0, support: U.clamp(fam.support + U.ri(-8, 8)), fit: 0, p: { diligent: 0, social: 0, rebel: 0, gentle: 0 } },
    rev: { tal: {}, stats: {} }, stage: 0, flags: {}, met: {}, rel: {}, npc: {}, cd: {}, done: {}, hist: [], today: [], injury: 0, lesson: false, shopDay: -1,
    exams: [], warn: 0, debutPts: 0, debutTries: 0, queue: [], logs: [], sns: [], awards: [], grp: null, promo: null, lastConcert: -999, adCount: 0, over: null, concept: null, ranks: [], arcQ: [], arc: null, arcDone: {}, arcCd: -999
  };
  DATA.ABK.forEach(k => { s.ab[k] = 7 + U.ri(0, 5); s.hid.tal[k] = U.rf(.85, 1.15); });
  for (const k in (fam.tal || {})) s.hid.tal[k] += fam.tal[k];
  for (const k in fam.fx) {
    if (DATA.HID.includes(k)) s.hid[k] = U.clamp(s.hid[k] + fam.fx[k]);
    else if (k === 'stress') s.st.stress += fam.fx[k]; else if (k === 'fame') s.car.fame += fam.fx[k];
  }
  I = s;
  o.traits.forEach(id => DATA.TRAITS.find(t => t.id === id).ap(s));
  DATA.ABK.forEach(k => s.ab[k] = U.clamp(s.ab[k]));
  // 角色姓名
  const same = U.shuffle(DATA.NAMES[o.g].filter(n => n !== o.name)), oth = U.shuffle(DATA.NAMES[o.g === 'm' ? 'f' : 'm']);
  for (const id in DATA.NPCS) {
    const d = DATA.NPCS[id];
    if (d.name) s.npc[id] = { name: d.name, g: d.g };
    else if (d.same) s.npc[id] = { name: same.pop(), g: o.g };
    else { const g = U.chance(.5) ? o.g : (o.g === 'm' ? 'f' : 'm'); s.npc[id] = { name: (g === o.g ? same : oth).pop(), g }; }
  }
  ['xiaen', 'zhihao', 'yiqing', 'meiling', 'baiyu', 'xiaole'].forEach(id => s.met[id] = true);
  s.rel = { xiaen: 10, zhihao: 5, yiqing: 3, meiling: 10, baiyu: 0, xiaole: 25, jiangyun: 0, shuyan: 0 };
  // 練習生池
  s.pool = [];
  const peers = [['xiaen', 13, ['dance']], ['zhihao', 14, ['vocal', 'acting']], ['yiqing', 12, ['rap']]];
  peers.forEach(([id, age, focus]) => s.pool.push(Idol.mkRival({ id, name: s.npc[id].name, g: o.g, age, focus, npc: id })));
  for (let i = 0; i < 9; i++) s.pool.push(Idol.mkRival({ name: Idol.fillerName(), g: o.g, age: U.ri(11, 15) }));
  s.queue.push({ t: 'ev', id: 'intro' });
  Idol.log(`簽約成為 ${DATA.CO} 的練習生。`, 'story');
  Idol.snapMonth(s);
  return s;
};

/* 舊存檔補齊欄位 */
Idol.fix = function (s) {
  const d = { logs: [], sns: [], awards: [], queue: [], hist: [], today: [], done: {}, cd: {}, flags: {}, exams: [], ranks: [], warn: 0, debutPts: 0, debutTries: 0, lastConcert: -999, adCount: 0, arcQ: [], arc: null, arcDone: {}, arcCd: -999, rev: { tal: {}, stats: {} } };
  for (const k in d) if (s[k] === undefined) s[k] = d[k];
  if (s.grp && !s.grp.contractEnd) { s.grp.contractEnd = s.grp.debutDay + 365 * 7; s.grp.contractNo = 1; }
  if (!s.ms) Idol.snapMonth(s);
  return s;
};

/* ---------- 數值套用 ---------- */
Idol.addAff = function (id, v) {
  if (v > 0) { let m = 1; if (I.pers === 'social') m += .4; if (I.traits.includes('socialite')) m += .5; v *= m; }
  I.rel[id] = U.clamp((I.rel[id] || 0) + v);
  for (const ev of DATA.NPC_EVENTS) {
    if (ev.npc === id && I.rel[id] >= ev.need && !I.done[ev.id] && I.met[id] && !I.queue.some(q => q.id === ev.id) && !(I.cd['nq_' + ev.id] > I.day - 3)) {
      I.cd['nq_' + ev.id] = I.day; I.queue.push({ t: 'nev', id: ev.id });
    }
  }
  return v;
};
Idol.doReveal = function (k) {
  if (k === 'all') { DATA.ABK.forEach(a => I.rev.tal[a] = true); DATA.HID.forEach(h => I.rev.stats[h] = true); I.rev.stats.fit = true; }
  else I.rev.tal[k] = true;
};
Idol.applyFx = function (fx) {
  const out = []; let hidden = false;
  for (const [k, raw] of Object.entries(fx || {})) {
    let v = typeof raw === 'function' ? raw(I) : raw;
    if (DATA.ABK.includes(k)) { const b = I.ab[k]; I.ab[k] = U.clamp(b + v); out.push([k, I.ab[k] - b]); }
    else if (ST4.includes(k)) {
      if (k === 'mood' && I.traits.includes('glass')) v *= 1.4;
      if (k === 'stress' && v > 0 && I.traits.includes('perfect')) v *= 1.3;
      if (k === 'stress' && v < 0 && I.pers === 'gentle') v *= 1.2;
      const b = I.st[k]; I.st[k] = U.clamp(b + v); out.push([k, I.st[k] - b]);
    } else if (k === 'fans' || k === 'fame') {
      if (v > 0 && I.traits.includes('topic')) v *= 1.25; if (v > 0 && I.traits.includes('face')) v *= 1.1;
      if (k === 'fans' && v > 0 && I.stage >= 2) v *= U.clamp(1 - I.car.fans / (2e6 + I.car.pop * 5e4), .03, 1); // 粉絲數有市場天花板
      const b = I.car[k]; I.car[k] = k === 'fans' ? Math.max(0, b + v) : U.clamp(b + v); out.push([k, I.car[k] - b]);
    } else if (k === 'pop' || k === 'eval') { if (k === 'pop' && v > 0 && I.stage >= 2) v *= U.clamp(1 - I.car.pop / 115, .1, 1); const b = I.car[k]; I.car[k] = U.clamp(b + v); out.push([k, I.car[k] - b]); }
    else if (k === 'money') { I.car.money = Math.max(0, I.car.money + v); out.push([k, v]); }
    else if (DATA.HID.includes(k)) { let w = v; if (k === 'scandal' && w > 0) { if (I.pers === 'rebel') w *= 1.3; if (I.traits.includes('topic')) w *= 2; } I.hid[k] = U.clamp(I.hid[k] + w); hidden = true; }
    else if (k === 'aff') for (const id in v) { const key = id === '$npc' ? I._npc : id; if (key) Idol.addAff(key, v[id]); }

Idol.evById = id => DATA.EVENTS.find(e => e.id === id) || DATA.NPC_EVENTS.find(e => e.id === id) || DATA.ARC_EVENTS.find(e => e.id === id);
Idol.eligible = function (ev) {

Idol.queueEvent = function (id, npc) { if (!I.queue.some(q => q.t === 'ev' && q.id === id)) I.queue.push({ t: 'ev', id, npc }); };

Idol.repCount = function (id) { return I.hist.slice(-4).filter(h => h === id).length; };

  s = s || I; s.ms = { day: s.day, ab: Object.assign({}, s.ab), st: Object.assign({}, s.st), car: { fans: s.car.fans, fame: s.car.fame, pop: s.car.pop, eval: s.car.eval, money: s.car.money }, exam: null, acts: {} };
};
Idol.monthReport = function () {
  const m = I.ms; if (!m) return Idol.snapMonth();
  const ab = DATA.ABIL.map(([k, n, ic]) => ({ n, ic, d: I.ab[k] - m.ab[k] })).filter(x => Math.abs(x.d) >= .05);
  const car = [['粉絲', I.car.fans - m.car.fans, 1], ['知名度', I.car.fame - m.car.fame], ['人氣', I.car.pop - m.car.pop], ['公司評價', I.car.eval - m.car.eval], ['金錢', I.car.money - m.car.money, 2]].filter(x => Math.abs(x[1]) >= .05);
  const acts = Object.entries(m.acts).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, n]) => `${DATA.ACTIONS[id] ? DATA.ACTIONS[id].n : id}×${n}`);
  const evs = I.logs.filter(l => l.day >= m.day && l.day < I.day).map(l => l.txt).reverse().slice(-8);
  const prev = Cal.date(I.day - 1);
  I.queue.push({ t: 'month', y: prev.y, mo: prev.m, ab, car, acts, evs, exam: m.exam, st: { stam: I.st.stam - m.st.stam, mood: I.st.mood - m.st.mood, stress: I.st.stress - m.st.stress } });
  Idol.snapMonth();
};
Idol.runMonth = function (plan) {
  const m0 = Cal.date(I.day).m; let g = 0;
  while (!I.over && !I.queue.length && Cal.date(I.day).m === m0 && g++ < 40) Idol.autoDays(1, plan);
  return I.over || Cal.date(I.day).m !== m0;
};
Idol.monthly = function () {
  if (I.stage >= 2) {
    const sal = [0, 0, 12000, 50000, 200000][I.stage] + Math.round((I.lastSales || 0) * 4) - 4000;
    I.car.money += sal; Idol.log(`💰 本月薪資與分紅：${U.money(sal)}`);
  }
};
Idol.endDay = function () {
  if (I.over) return;
  const examToday = Cal.isLastSat(I.day);
  Idol.nightly();
  if (examToday) Idol.runExam();
  I.day++; I.ap = I.apMax; I.today = []; I._npc = null;
  const t = Cal.date(I.day);
  if (t.m === I.bd.m && t.d === I.bd.d) Idol.birthday();
  if (t.d === 1) { Idol.monthly(); Idol.monthReport(); }
  if (t.wd === 1 && I.stage < 2) I.car.money += Math.round(I.allow / 4);
  const h = Cal.holiday(I.day); if (h) { I.st.mood = U.clamp(I.st.mood + 3); Idol.log(`今天是 ${h}。`); }
  if (t.m === 12 && t.d === 28 && I.stage >= 2) Idol.awards();
  Idol.advancePromo();
  Idol.arcTick();
  Idol.checkStage();
  // 黑料引爆
  if (I.hid.scandal >= 55 && I.stage >= 2 && I.day - (I.cd.scandal_burst ?? -999) > 90 && U.chance(.25)) Idol.queueEvent('scandal_burst');
  if (I.flags.secret_crush && I.stage >= 2 && I.day - (I.cd.crush_leak ?? -999) > 400 && U.chance(.012 + I.car.fame / 6000)) { Idol.queueEvent('crush_leak'); }
  Idol.rollRandomEvent();
  Idol.checkConditions();
  if (!I.over) Idol.save('auto');
};
Idol.awards = function () {
  const lines = []; const y = Cal.date(I.day).y;
  const score = I.car.pop * .5 + I.car.fame * .25 + (I.lastSales ? Math.min(25, Math.log10(I.lastSales + 1) * 5) : 0) - I.hid.scandal * .3;
  const debutRecent = I.grp && I.day - I.grp.debutDay < 400;
  const won = [];
  if (debutRecent && U.chance(U.clamp(score / 70, .05, .9))) won.push('最佳新人獎');
  if (I.stage >= 2 && score > 38 && U.chance(U.clamp((score - 30) / 60, .05, .8))) won.push('本賞（唱片）');
  if (I.stage >= 3 && score > 66 && U.chance(U.clamp((score - 58) / 50, .05, .5))) won.push('年度大賞');
  const r = Idol.applyFx(won.length ? { pop: 2 + won.length * 1.5, fame: 2 + won.length, fans: 5000 * won.length * (1 + I.stage), eval: 4, mood: 12 } : { mood: -2 });
  won.forEach(n => I.awards.push({ y, n }));
  I.queue.push({ t: 'msg', title: `🏆 ${y} 年終頒獎典禮`, text: won.length ? `你獲得了：${won.join('、')}！\n站在台上，你想起第一次走進練習室的那天。` : '今年的典禮上，你只是坐在台下鼓掌。但你告訴自己：明年，換我。', chips: Idol.chips(r) });
  if (won.length) Idol.log(`🏆 ${y} 年終頒獎：${won.join('、')}`, 'win');
  Idol.checkStage();
};

/* ---------- 結局 ---------- */
Idol.ending = function (key) {
  if (I.over) return;
  I.over = key; I.queue = [];
  const meta = Store.get('idol', 'meta'); const m = (meta && meta.state) || { endings: {} };
  m.endings[key] = (m.endings[key] || 0) + 1; Store.put('idol', 'meta', m);
  Idol.save('auto');
};
Idol.save = function (slot) { return Store.put('idol', slot, I, `${I.name}｜${DATA.STAGES[I.stage]}｜${Cal.short(I.day)}`) && (slot !== 'auto' || true); };

/* ---------- 自動排程 ---------- */
Idol.autoPick = function (plan) {
  const st = I.st;
  if (I.injury > 0) return I.ap >= 1 ? 'rest' : null;
  if (st.stam < 38 || st.stress > 78 || st.health < 35) return 'rest';
  if (I.stage >= 2) {
    if (Idol.canAct('musicshow') === null && plan !== 'train') return 'musicshow';
    if (I.flags.adPending && I.ap >= 2) return 'ad';
    if (plan === 'work' && I.ap >= 2 && !I.today.some(t => t.id === 'fanmeet') && U.chance(.3)) return 'fanmeet';
  }
  if (I.stage === 1 && U.chance(.25) && Idol.canAct('group') === null) return 'group';
  const ex = Idol.examTheme(Cal.nextExam(I.day)), w = DATA.EXAMS[ex].w;
  const abs = DATA.ABK.filter(k => ['vocal', 'dance', 'rap', 'acting', 'variety'].includes(k));
  let pick;
  if (DATA.ABK.includes(plan)) pick = U.chance(.7) ? plan : null;
  if (!pick) {
    const score = k => (w[k] || .05) * (100 - I.ab[k]) + U.rf(0, 4) - Idol.repCount(k) * 6;
    pick = abs.slice().sort((a, b) => score(b) - score(a))[0];
  }
  if (I.stage >= 2 && plan !== 'train' && U.chance(.25)) return 'social';
  if (Idol.repCount(pick) >= 3) return U.chance(.5) ? 'rest' : 'gym';
  return pick;
};
Idol.autoDays = function (n, plan, untilExam) {
  let done = 0;
  while (done < n && !I.over && !I.queue.length) {
    let guard = 0;
    while (I.ap > 0 && guard++ < 6) {
      let id = Idol.autoPick(plan); if (!id) break;
      if (Idol.canAct(id)) { id = Idol.canAct('rest') ? null : 'rest'; if (!id) break; }
      if (!Idol.doAct(id)) break;
    }
    const wasExam = Cal.isLastSat(I.day);
    Idol.endDay(); done++;
    if (untilExam && wasExam) break;
  }
  return done;
};

  if (s.stage === 1) return { t: '通過季度出道評估', d: `預備組每季（3、6、9、12 月）月考後會公布出道名單，名額 ${DEBUT_SLOTS} 人。已參加 ${s.debutTries} 次。十七歲生日前未出道將被淘汰。`, p: Math.min(1, .3 + s.debutTries * .15) };
  if (s.stage === 2) return { t: '成為人氣偶像', d: `拿下首個音樂節目一位，且人氣 ≥ 45、粉絲 ≥ 5 萬。目前 一位 ${s.grp ? s.grp.wins : 0} 次、人氣 ${Math.round(s.car.pop)}、粉絲 ${U.num(s.car.fans)}。`, p: Math.min(1, (s.car.pop / 45 + s.car.fans / 50000 + (s.grp && s.grp.wins ? 1 : 0)) / 3) };
  if (s.stage === 3) return { t: '登上頂點', d: `人氣 ≥ 80、粉絲 ≥ 60 萬，並累積 2 座以上獎項。目前 人氣 ${Math.round(s.car.pop)}、粉絲 ${U.num(s.car.fans)}、獎項 ${s.awards.length}。`, p: Math.min(1, (s.car.pop / 80 + s.car.fans / 600000 + s.awards.length / 2) / 3) };

/* ---------- 能力 ---------- */
const talGrade = v => v >= 1.18 ? 'S' : v >= 1.05 ? 'A' : v >= .93 ? 'B' : 'C';

  const ab = DATA.ABIL.map(([k, n, ic]) => `<div class="abrow">${UI.bar(`${ic} ${n}`, s.ab[k], 100, 'ab', U.f1(s.ab[k]))}<span class="tal">${s.rev.tal[k] ? '天賦 ' + talGrade(s.hid.tal[k]) : '天賦 ？'}</span></div>`).join('');
  const hid = DATA.HID.concat(['fit']).map(k => { const lab = k === 'fit' ? '體能' : DATA.LABEL[k]; return `<div class="hrow"><span>${lab}</span><b>${s.rev.stats[k] ? Math.round(s.hid[k]) : '？？？'}</b></div>`; }).join('');
  const mods = []; if (s.st.stress > 70) mods.push('壓力過高：訓練效率 -22%、考核 -6%'); if (s.st.stam < 40) mods.push('體力偏低：訓練與考核表現下降'); if (s.st.mood < 30) mods.push('心情低落：效率下降'); if (s.injury > 0) mods.push('受傷：考核 -10%'); if (s.hid.fatigue > 60) mods.push('（疲勞累積，受傷風險上升）'.replace('（', '').replace('）', ''));
  return `<div class="grid2"><div class="col">${card('基本能力', ab)}${card('目前狀態修正', mods.length ? '<ul class="notes">' + mods.map(m => `<li>⚠️ ${m}</li>`).join('') + '</ul>' : '<p class="sub">狀態良好，沒有負面修正。</p>')}</div>
  <div class="col">${card('個性與詞條', `<p>${s.pers ? `<b>${DATA.PERS[s.pers].n}</b>：${DATA.PERS[s.pers].d}` : '十五歲時會依你過往的選擇決定個性。'}</p>` + s.traits.map(t => { const d = DATA.TRAITS.find(x => x.id === t); return `<div class="trait"><b>${d.n}</b><small>${d.d}</small></div>`; }).join(''))}
    ${card('隱藏數值', `<p class="sub">這些數值不會直接顯示。透過事件、前輩與經紀人的指點才會逐漸揭曉；人生結束時會全數公開。</p><div class="hgrid">${hid}</div>`)}</div></div>`;
}

/* ---------- 日曆 ---------- */
function tCal() {
  const t = Cal.date(I.day); if (!IdolUI.cal) IdolUI.cal = { y: t.y, m: t.m };
  const { y, m } = IdolUI.cal, dim = Cal.dim(y, m), first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  let cells = ''; for (let i = 0; i < first; i++) cells += '<div class="cd empty"></div>';
  for (let d = 1; d <= dim; d++) {
    const day = Cal.dayOf(y, m, d), tt = Cal.date(day), tags = [];
    if (Cal.isLastSat(day)) tags.push('<i class="tg ex">考核</i>');
    const hd = Cal.holiday(day); if (hd) tags.push(`<i class="tg hd">${hd}</i>`);
    if (m === I.bd.m && d === I.bd.d) tags.push('<i class="tg bd">生日</i>');
    if (I.promo && day >= I.promo.start && day <= I.promo.end) tags.push('<i class="tg pr">宣傳</i>');
    if (m === 12 && d === 28 && I.stage >= 2) tags.push('<i class="tg aw">頒獎</i>');
    cells += `<div class="cd ${day === I.day ? 'today' : ''} ${day < I.day ? 'past' : ''}"><b>${d}</b>${tags.join('')}</div>`;
  }
  return card(`${y} 年 ${m} 月`, `<div class="btn-row"><button class="btn ghost sm" data-act="i.cal" data-d="-1">◀ 上月</button><button class="btn ghost sm" data-act="i.cal" data-d="0">今天</button><button class="btn ghost sm" data-act="i.cal" data-d="1">下月 ▶</button></div>
   <div class="cal"><div class="cw">${Cal.WD.map(w => `<span>${w}</span>`).join('')}</div><div class="cg">${cells}</div></div>
   <p class="sub">每月最後一個週六是月考日；${I.stage >= 2 ? '十二月二十八日為年終頒獎典禮；' : ''}宣傳期的週四～日可以打歌。</p>`);
}

/* ---------- 公司 ---------- */
function tCo() {
  const s = I, steps = DATA.STAGES.map((n, i) => `<li class="${i < s.stage ? 'done' : i === s.stage ? 'cur' : ''}">${i < s.stage ? '✔' : i === s.stage ? '▶' : '○'} ${n}</li>`).join('');
  const rows = [{ name: s.name, me: true, score: Sim.weighted(s, DATA.EXAMS.all.w) }].concat(s.pool.map(r => ({ name: r.name, score: Sim.weighted(r, DATA.EXAMS.all.w), age: Idol.rAge(r), npc: r.npc }))).sort((a, b) => b.score - a.score);
  const last = s.exams.slice(-6).reverse();
  return `<div class="grid2"><div class="col">${card(DATA.CO + ' · 公司資訊', `<p>你是 ${DATA.CO} 的${DATA.STAGES[s.stage]}。公司評價 <b>${Math.round(s.car.eval)}</b>（低於 8 會被解約）。</p>${UI.bar('公司評價', s.car.eval, 100)}<ul class="steps">${steps}</ul>`)}
    ${card('近期考核', last.length ? `<ul class="notes">${last.map(e => `<li>${Cal.short(e.day)} ${DATA.EXAMS[e.theme].n}　第 <b>${e.rank}</b> / ${e.total} 名　${UI.chip(e.tier, e.tier === 'S' || e.tier === 'A' ? 'pink' : '')}</li>`).join('')}</ul><p class="sub">連續 3 次墊底將被淘汰（目前警告 ${s.warn}/3）。</p>` : '<p class="sub">還沒有考核紀錄。</p>')}</div>
    <div class="col">${card('練習生排名（綜合實力）', `<ol class="rank">${rows.map((r, i) => `<li class="${r.me ? 'me' : ''}"><span>${i + 1}</span><b>${U.esc(r.name)}</b><small>${r.me ? '你' : r.age + '歲' + (r.npc ? ' · ' + DATA.NPCS[r.npc].role : '')}</small><em>${U.f1(r.score)}</em></li>`).join('')}</ol>`)}
    ${s.grp ? card((s.grp.kind ? DATA.DEBUT_FORMS[s.grp.kind].ic + DATA.DEBUT_FORMS[s.grp.kind].n + '：' : '團體：') + s.grp.name, `<p>${s.grp.kind === 'solo' ? '單人藝人' : '成員：' + ''}${s.grp.kind === 'solo' ? '' : ''}${s.grp.kind === 'solo' ? '' : s.grp.members.map(U.esc).join('、')}</p><p>📜 專屬合約：第 ${s.grp.contractNo || 1} 期，至 ${Cal.short(s.grp.contractEnd)} 到期</p><p>音樂節目一位：${s.grp.wins} 次　累計銷量：${U.num(s.grp.sales)} 張</p><ul class="notes">${s.grp.albums.slice(-4).reverse().map(a => `<li>${Cal.short(a.day)} ${U.esc(a.name)}　首週 ${U.num(a.sales)}　榜單 #${a.pos}</li>`).join('')}</ul>`) : ''}
    ${s.stage >= 3 ? card('功成身退', `<p class="sub">人氣偶像之後，你可以隨時選擇結束偶像生涯，迎接結局（否則會一路玩到三十歲）。</p><button class="btn ghost" data-act="i.retire">結束偶像生涯</button>`) : ''}
    ${s.awards.length ? card('獲獎紀錄', `<ul class="notes">${s.awards.map(a => `<li>🏆 ${a.y} ${a.n}</li>`).join('')}</ul>`) : ''}</div></div>`;
}

      ${UI.bar('好感度', v, 100)}<p class="sub">${v >= 20 ? Idol.fmt(d.bg) : '還不太熟，不知道對方的故事。'}</p>

/* ---------- 工作 ---------- */

    ${card('工作', `<div class="acts">${ids.map(actCard).join('')}</div>`)}</div>
    <div class="col">${card('活動規則', '<ul class="notes"><li>打歌只在宣傳期的週四～日，成績取決於舞台、專輯品質、人氣與粉絲。</li><li>演唱會需人氣偶像階段、體力 60 以上，每 60 天一次。</li><li>廣告需先在事件中簽下合約。</li><li>薪水每月 1 日入帳，會依銷量有分紅。</li></ul>')}</div></div>`;
}

/* ---------- 存檔 ---------- */
function tSave() {

  <div class="col">${card('匯出／匯入', `<p class="sub">複製下方文字可備份存檔；貼上別處的存檔文字後按匯入。</p><textarea id="exp" rows="5" placeholder="存檔文字">${''}</textarea><div class="btn-row wrap"><button class="btn sm" data-act="i.export">匯出到文字框</button><button class="btn sm ghost" data-act="i.import">匯入</button></div>`)}
  ${card('重新開始', `<p class="sub">放棄目前的偶像人生，回到主選單重新開始（會要求確認）。</p><button class="btn danger" data-act="i.restart">重新開始</button>`)}</div></div>`;
}

/* ---------- 事件／考核流程 ---------- */
Idol.flush = function () {
  if (!I || UI.isOpen()) return;
  const q = I.queue[0];
  if (!q) {
    if (IdolUI.run && !I.over) { if (Idol.runMonth(IdolUI.plan)) IdolUI.run = false; Idol.save('auto'); Idol.render(); if (I.queue.length) return Idol.flush(); return; }
    IdolUI.run = false; if (I.over) Idol.render(); return;
  }
  if (q.t === 'month') {
    const sg = v => (v > 0 ? '+' : '') + (Math.abs(v) >= 1000 ? U.num(Math.round(v)) : U.f1(v));
    const chip = (l, v, cls) => `<span class="delta ${v >= 0 ? 'up' : 'down'}">${l} ${sg(v)}</span>`;
    return UI.modal(`<div class="ev-tag">📅 ${q.y} 年 ${q.mo} 月 · 月度結算</div><h3>本月成果</h3>
      ${q.exam ? `<p class="you">📝 月考「${q.exam.theme}」：第 ${q.exam.rank} 名 / ${q.exam.total} 人<br><small>${q.exam.comment || ''}</small></p>` : '<p class="sub">本月沒有月考。</p>'}
      ${q.acts.length ? `<p class="sub">主要行程：${q.acts.join('、')}</p>` : ''}
      <h4>能力變化</h4><div class="chips">${q.ab.length ? q.ab.map(x => chip(x.ic + x.n, x.d)).join('') : '<span class="delta hint">沒有明顯變化</span>'}</div>
      <h4>事業與狀態</h4><div class="chips">${q.car.map(x => `<span class="delta ${x[1] >= 0 ? 'up' : 'down'}">${x[0]} ${x[2] === 2 ? (x[1] >= 0 ? '+' : '-') + U.money(Math.abs(x[1])) : sg(x[1])}</span>`).join('')}${chip('體力', q.st.stam)}${chip('心情', q.st.mood)}${chip('壓力', q.st.stress)}</div>
      ${q.evs.length ? `<h4>本月大事</h4><ul class="notes">${q.evs.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
      <div class="btn-row"><button class="btn pink" data-act="i.next">進入下個月</button></div>`, { cls: 'event' });
  }
  const done = () => { I.queue.shift(); Idol.save('auto'); };
  if (q.t === 'ev' || q.t === 'nev') {
    const ev = q.id === 'personality' ? Idol.personalityEvent() : Idol.evById(q.id);
    if (!ev) { done(); return Idol.flush(); }
    I._npc = q.npc || null; I._mate = q.mate || null; ev._choices = ev.choices; IdolUI.cur = { ev, q };
    const ch = ev.choices.map((c, i) => {
      const off = c.req && !c.req(I);
      return `<button class="choice" data-act="i.choose" data-i="${i}" ${off ? 'disabled' : ''}>${Idol.fmt(c.t)}${c.check ? `<small>🎲 檢定：${DATA.LABEL[c.check.st] || c.check.st}</small>` : ''}${off ? '<small>條件不足</small>' : ''}</button>`;
    }).join('');
    UI.modal(`<div class="ev-tag">${q.t === 'nev' ? '💞 專屬劇情' : ev.arc ? '📰 風波' : '📖 事件'}</div><h3>${Idol.fmt(ev.title)}</h3><p class="pre">${Idol.fmt(ev.text)}</p><div class="choices">${ch}</div>`, { cls: 'event' });
    return;
  }
  if (q.t === 'exam') {
    const r = q.r;
    UI.modal(`<div class="ev-tag">📝 月考結果</div><h3>${r.theme}</h3><div class="rankbig ${r.tier}"><b>${r.rank}</b><span>/ ${r.total} 名</span><em>${r.tier}</em></div>
      <ol class="rank mini">${r.top.map((t, i) => `<li class="${t.me ? 'me' : ''}"><span>${i + 1}</span><b>${U.esc(t.name)}</b><em>${t.score}</em></li>`).join('')}</ol>
      <p class="quote">${r.comment}</p><div class="chips">${r.chips}</div>
      ${r.pts ? `<p>出道積分 ${r.pts > 0 ? '+' : ''}${r.pts}（累計 ${r.pts_total}）</p>` : ''}
      ${r.promoted ? '<div class="banner">🎉 你升上了「出道預備組」！從現在起，每季月考後會有出道評估。</div>' : ''}
      ${r.cutName ? `<p class="sub">半年度淘汰：${U.esc(r.cutName)} 離開了公司。</p>` : ''}${r.warn ? `<p class="warn">⚠️ 連續墊底警告 ${r.warn}/3</p>` : ''}
      <div class="btn-row"><button class="btn" data-act="i.next">繼續</button></div>`, { cls: 'event' });
    return;
  }
  if (q.t === 'debut') {
    const info = q.info;
    UI.modal(`<div class="ev-tag">📣 出道評估</div><h3>${info.success ? '出道名單公布' : '出道名單公布'}</h3><p>評估委員會依月考表現、公司評價、外貌、團隊默契與製作人好感，選出 ${info.slots} 名成員。</p>
      <ol class="rank mini">${info.list.map(x => `<li class="${x.me ? 'me' : ''}"><span>${x.in ? '✔' : '✘'}</span><b>${U.esc(x.name)}</b><em>${x.in ? '入選' : '落選'}</em></li>`).join('')}</ol>
      ${info.success ? '<div class="banner">🎉 你入選了出道組！</div>' : `<p class="warn">這次沒有你的名字。${info.friends && info.friends.length ? '你的好友 ' + info.friends.map(U.esc).join('、') + ' 出道了。' : ''}下一季還有機會。</p>`}
      <div class="btn-row"><button class="btn" data-act="i.next" data-debut="${info.success ? 1 : 0}">繼續</button></div>`, { cls: 'event' });
    return;
  }
  if (q.t === 'concept') {
    const list = DATA.CONCEPTS.map(c => { const f = Idol.groupQuality(c); const t = f >= 40 ? '高' : f >= 24 ? '中' : '低'; return `<button class="choice" data-act="i.concept" data-id="${c.id}"><b>${c.n}</b><small>主打：${Object.keys(c.w).map(k => DATA.ABN[k]).join('、')} · 適合度 ${t}</small></button>`; }).join('');
    UI.modal(`<div class="ev-tag">💿 回歸企劃</div><h3>選擇下一張專輯的概念</h3><p>${Idol.fmt('{baiyu}')}製作人遞來四份企劃書：「選一個能發揮你們優勢的。」</p><div class="choices">${list}</div>`, { cls: 'event' });
    return;
  }
  if (q.t === 'end') { done(); Idol.ending(q.key); return Idol.render(); }
  // msg
  UI.modal(`<div class="ev-tag">📢 通知</div><h3>${q.title}</h3><p class="pre">${Idol.fmt(q.text)}</p><div class="chips">${q.chips || ''}</div><div class="btn-row"><button class="btn" data-act="i.next">繼續</button></div>`, { cls: 'event' });
};

ACT['i.tab'] = d => { IdolUI.tab = d.t; Idol.render(); };
ACT['i.next'] = d => {
  const q = I.queue.shift(); UI.close();
  if (q && q.t === 'debut' && d.debut === '1') Idol.doDebut(q.info);
  Idol.save('auto'); Idol.render(); Idol.flush();
};
ACT['i.choose'] = d => {
  const { ev } = IdolUI.cur; I.queue.shift();
  const res = Idol.resolveChoice(ev, +d.i);
  if (ev.id === 'personality') { const ch = ev.choices[+d.i]; I.pers = ch.pers; I.done.personality = true; Idol.log(`個性確定：${DATA.PERS[ch.pers].n}`, 'story'); }
  const g = res.grade ? { g: '✨ 大成功', k: '👍 成功', f: '😓 失敗', b: '💥 大失敗' }[res.grade] : '';
  UI.modal(`<div class="ev-tag">${g || '結果'}</div><h3>${Idol.fmt(ev.title)}</h3><p class="you">你選擇了：${Idol.fmt(res.ch.t)}</p><p class="pre">${res.txt}</p><div class="chips">${res.chips}</div><div class="btn-row"><button class="btn" data-act="i.next2">繼續</button></div>`, { cls: 'event' });
  Idol.checkConditions(); Idol.checkStage(); Idol.save('auto');

let M = null;

Mgr.fmt = function (t, ctx = {}) {
  if (typeof t === 'function') t = t(M);

};
Mgr.log = function (txt, kind = '') { M.logs.unshift({ day: M.day, txt, kind }); if (M.logs.length > 250) M.logs.length = 250; };
Mgr.ovr = T => DATA.ABK.reduce((a, k) => a + T.ab[k], 0) / 6;
Mgr.refresh = function (T) { T.age = Math.floor((M.day - T.born) / 365); T.ovr = Mgr.ovr(T); const d = T.ovr - BENCH(T.age); T.rating = d >= 10 ? 'S' : d >= 4 ? 'A' : d >= -3 ? 'B' : d >= -9 ? 'C' : 'D'; };
Mgr.stars = T => T.rev.pot ? Math.round(T.hid.pot / 20) : Math.max(1, Math.min(5, Math.round(T.seenPot / 20)));
Mgr.tier = () => DATA.M.TIERS[M.co.tier];
Mgr.exp = function (k, n) {
  const s = M.me; s.xp[k] = (s.xp[k] || 0) + n; let lv = 1; for (let i = 1; i < SKX.length; i++) if (s.xp[k] >= SKX[i]) lv = i + 1;
  if (lv > s.skill[k]) { s.skill[k] = lv; M.queue.push({ t: 'msg', title: '📈 技能升級', text: `你的「${SKILLS[k]}」提升到了 Lv.${lv}。` }); }
};
Mgr.genName = function (g) {
  const used = new Set(M.roster.map(t => t.name).concat((M.market || []).map(t => t.name)));
  for (let i = 0; i < 30; i++) { const n = U.pick(DATA.M.SUR) + U.pick(DATA.M.GIVEN[g]); if (!used.has(n)) return n; }
  return U.pick(DATA.M.SUR) + U.pick(DATA.M.GIVEN[g]) + U.ri(1, 9);
};
Mgr.mkTrainee = function (o) {
  const age = o.age, g = o.g || (U.chance(.5) ? 'm' : 'f'), q = o.q || 0;
  const pot = Math.round(U.clamp(U.gauss() * 14 + 62 + q * 8, 32, 98)), tal = {}, ab = {};
  const spikes = U.shuffle(DATA.ABK).slice(0, 2);
  DATA.ABK.forEach(k => { tal[k] = U.clamp(.7 + pot / 160 + U.rf(-.12, .12), .6, 1.5); ab[k] = U.clamp(BENCH(age) * U.rf(.6, 1.1) + U.gauss() * 3 + (spikes.includes(k) ? U.ri(5, 11) : 0), 3, 80); });
  const T = {
    id: M.nextId++, name: Mgr.genName(g), g, born: M.day - age * 365 - U.ri(0, 364), ab, st: { stam: 85, mood: 65, stress: 15, health: 90 },
    hid: { tal, luck: U.ri(20, 85), grit: U.ri(25, 85), res: U.ri(25, 85), looks: U.ri(25, 90), scandal: 0, fatigue: 0, loyalty: U.ri(45, 75), pot, fit: 0, p: {} },
    car: { fans: 0, fame: 0, pop: 0, eval: 50 }, plan: { focus: 'balanced', int: 1 }, stage: 0, gid: null, injury: 0, rev: { pot: false }, signed: M.day, flags: {}, traits: [], pers: null,
    tag: U.pick(DATA.M.TAGS), seenPot: pot + U.gauss() * (22 - 4 * M.me.skill.scout)
  };
  Mgr.refresh(T); return T;
};

/* ---------- 新遊戲 ---------- */
Mgr.newGame = function (o) {

  Mgr.log('就任經紀人。', 'story');

Mgr.fix = function (m) {
  const d = { logs: [], queue: [], flags: {}, market: [], last: [], did: {}, lowFunds: 0 };
  for (const k in d) if (m[k] === undefined) m[k] = d[k];

};

/* ---------- 效果與檢定 ---------- */
Mgr.roll = function (skill, diff) {
  const lv = M.me.skill[skill] || 1;
  const m = lv * 14 + U.rf(-14, 14) + (M.me.trust - 50) / 6 - (M.me.stress > 70 ? 6 : 0) - diff;
  return m >= 22 ? 'g' : m >= 0 ? 'k' : m >= -22 ? 'f' : 'b';
};
Mgr.applyT = function (T, f) {
  const lines = [];
  for (const k in f) {
    const v = f[k];
    if (k === 'mood' || k === 'stress' || k === 'stam' || k === 'health') T.st[k] = U.clamp(T.st[k] + v);
    else if (k === 'loyalty') T.hid.loyalty = U.clamp(T.hid.loyalty + v);
    else if (k === 'scandal') T.hid.scandal = U.clamp(T.hid.scandal + (v > 0 ? v * (M.co.staff.pr ? .6 : 1) : v));
    else if (k === 'fans') T.car.fans = Math.max(0, T.car.fans + v);
    else if (k === 'fame' || k === 'pop') T.car[k] = U.clamp(T.car[k] + v);
    else if (k === 'injury') T.injury = Math.max(T.injury, Math.ceil(v / 7));
    else if (k === 'ab') for (const a in v) T.ab[a] = U.clamp(T.ab[a] + v[a]);
    else if (k === 'leave') M.leaving = (M.leaving || []).concat(T.id);
  }
};
Mgr.applyFx = function (fx, ctx) {
  const out = [];
  for (const k in fx) {
    const v = fx[k];
    if (k === 'funds') { M.co.funds += v; out.push(`${v >= 0 ? '+' : '-'}${U.money(Math.abs(v))}`); }
    else if (k === 'rep') { M.co.rep = U.clamp(M.co.rep + v); out.push(`聲望 ${v > 0 ? '+' : ''}${v}`); }
    else if (k === 'trust') { M.me.trust = U.clamp(M.me.trust + v); out.push(`社長信任 ${v > 0 ? '+' : ''}${v}`); }
    else if (k === 'me') { for (const s in v) { M.me[s] = U.clamp(M.me[s] + v[s]); out.push(`${s === 'stress' ? '你的壓力' : '精力'} ${v[s] > 0 ? '+' : ''}${v[s]}`); } }
    else if (k === 't' && ctx.t) { Mgr.applyT(ctx.t, v); out.push(`${ctx.t.name}：${Object.entries(v).filter(([a]) => a !== 'ab' && a !== 'leave').map(([a, n]) => `${{ mood: '心情', stress: '壓力', loyalty: '忠誠', scandal: '黑料', fans: '粉絲', fame: '知名度', injury: '休養(天)', pop: '人氣' }[a] || a}${n > 0 ? '+' : ''}${n}`).join(' ')}${v.ab ? ' 能力提升' : ''}${v.leave ? ' 離開公司' : ''}`); }
    else if (k === 'all') { M.roster.forEach(T => Mgr.applyT(T, v)); out.push(`全員：${Object.entries(v).map(([a, n]) => `${{ mood: '心情', stress: '壓力', loyalty: '忠誠' }[a] || a}${n > 0 ? '+' : ''}${n}`).join(' ')}`); }
    else if (k === 'g' && ctx.g) { const G = ctx.g; for (const s in v) G[s] = s === 'fans' ? Math.max(0, G.fans + v[s]) : U.clamp(G[s] + v[s], 0, 100); out.push(`${G.name}：${Object.entries(v).map(([a, n]) => `${{ pop: '人氣', fans: '粉絲', fame: '知名度', team: '默契' }[a]}${n > 0 ? '+' : ''}${n}`).join(' ')}`); }
    else if (k === 'skill') for (const s in v) Mgr.exp(s, v[s] * 12);
    else if (k === 'flag') M.flags[v] = true;
  }
  Mgr.processLeaving();
  return out;
};
Mgr.processLeaving = function () {
  if (!M.leaving || !M.leaving.length) return;
  M.leaving.forEach(id => {
    const T = MT(M, id); if (!T) return;
    if (T.gid) { const G = M.groups.find(g => g.id === T.gid); if (G) { G.members = G.members.filter(x => x !== id); if (G.members.length < 2 && G.status !== 'prep') { G.status = 'hiatus'; } if (G.members.length === 0) { M.groups = M.groups.filter(g => g !== G); Mgr.log(`${G.name} 因成員全數離開而解散。`, 'bad'); } else if (G.status === 'prep' && G.members.length < 3) { M.groups = M.groups.filter(g => g !== G); M.roster.forEach(t => { if (t.gid === G.id) { t.gid = null; t.stage = 0; } }); } } }
    M.roster = M.roster.filter(t => t.id !== id); Mgr.log(`${T.name} 離開了公司。`, 'bad');
  }); M.leaving = [];
};

/* ---------- 訓練 ---------- */
const capMult = (T, k) => U.clamp(((52 + T.hid.pot * .48) - T.ab[k]) / 18, .08, 1);
Mgr.trainWeek = function (T) {
  const fac = M.co.fac, sf = M.co.staff, coach = M.me.skill.coach, pl = T.plan, gains = {};
  const fm = { vocal: 1 + .07 * (fac.studio - 1) + (sf.vocal ? .10 : 0), rap: 1 + .07 * (fac.studio - 1) + (sf.vocal ? .10 : 0), dance: 1 + .07 * (fac.practice - 1) + (sf.dance ? .10 : 0), acting: 1 + .07 * (fac.practice - 1) + (sf.dance ? .10 : 0), charm: 1 + (sf.stylist ? .05 : 0), variety: 1 };
  const G = T.gid ? M.groups.find(g => g.id === T.gid) : null;
  let n = (T.injury > 0 || pl.focus === 'rest') ? 0 : [3, 5, 7][pl.int ?? 1];
  const train = ['vocal', 'dance', 'rap', 'acting', 'variety', 'charm'];
  for (let i = 0; i < n; i++) {
    if (T.st.stam < 22) break;
    let k;
    if (pl.focus !== 'balanced' && U.chance(.8)) k = pl.focus;
    else k = train.slice().sort((a, b) => (T.ab[a] + U.rf(0, 5)) - (T.ab[b] + U.rf(0, 5)))[0];
    const g = Sim.gain(T, k, 1, { mult: 2.5 * fm[k] * (1 + .03 * (coach - 1)) });
    T.ab[k] = U.clamp(T.ab[k] + g); gains[k] = (gains[k] || 0) + g;
    T.st.stam = U.clamp(T.st.stam - 8); T.st.stress = U.clamp(T.st.stress + 1.1); T.hid.fatigue = U.clamp(T.hid.fatigue + 1.6);
  }
  const dorm = fac.dorm, rest = pl.focus === 'rest' || T.injury > 0;
  T.st.stam = U.clamp(T.st.stam + 45 + 3 * (dorm - 1) + (rest ? 20 : 0));
  T.st.stress = U.clamp(T.st.stress - 4 - 1.5 * (dorm - 1) - (rest ? 10 : 0));
  T.hid.fatigue = U.clamp(T.hid.fatigue - 6 - (rest ? 10 : 0));
  const target = 55 + (dorm - 1) * 4; T.st.mood = U.clamp(T.st.mood + (target - T.st.mood) * .12 + (rest ? 6 : pl.int === 2 ? -2 : pl.int === 0 ? 1.5 : 0));
  if (T.st.stress > 80) T.st.mood = U.clamp(T.st.mood - 3);
  T.st.health = U.clamp(T.st.health + (T.st.stress > 85 ? -2 : 1));
  if (T.injury > 0) T.injury--;
  else if (n >= 6 && T.hid.fatigue > 50 && U.chance(.08)) { T.injury = U.ri(1, 2); Mgr.log(`${T.name} 因過度訓練受傷了。`, 'bad'); }
  if (G && G.status !== 'rest') T.hid.loyalty = U.clamp(T.hid.loyalty + .2);
  T.hid.loyalty = U.clamp(T.hid.loyalty + (T.st.mood > 60 ? .6 : T.st.mood < 35 ? -1.5 : 0));
  if (T.st.mood < 30 && T.hid.loyalty < 30) T.flags.unrest = (T.flags.unrest || 0) + 1; else T.flags.unrest = 0;
  Mgr.refresh(T); return gains;
};

Mgr.rollEvent = function () {
  const evs = DATA.M.EVENTS.filter(e => !e.cond || e.cond(M)).map(e => { const tg = e.pick ? e.pick(M) : null; return { e, tg }; }).filter(x => !x.e.pick || (x.tg && x.tg.length));
  const pickd = U.wpick(evs, x => x.e.w - (M.cdE && M.cdE[x.e.id] && M.week - M.cdE[x.e.id] < 6 ? 99 : 0)); if (!pickd) return;
  M.cdE = M.cdE || {}; M.cdE[pickd.e.id] = M.week;
  const tg = pickd.tg ? U.pick(pickd.tg) : null;
  M.queue.push({ t: 'mev', id: pickd.e.id, tid: tg && tg.members ? null : (tg ? tg.id : null), gid: tg && tg.members ? tg.id : null });
};
Mgr.ending = function (key) {
  if (M.over) return; M.over = key; M.queue = [];
  const meta = Store.get('mgr', 'meta'); const mm = (meta && meta.state) || { endings: {} }; mm.endings[key] = (mm.endings[key] || 0) + 1; Store.put('mgr', 'meta', mm); Mgr.save('auto');
};
Mgr.save = function (slot) { return Store.put('mgr', slot, M, `${M.name}｜${Mgr.tier().n}｜第 ${M.week + 1} 週`); };

Mgr.flush = function () {
  if (!M || UI.isOpen()) return;
  const q = M.queue[0]; if (!q) { if (M.over) Mgr.render(); return; }
  if (q.t === 'mev') {
    const ev = DATA.M.EVENTS.find(e => e.id === q.id), T = q.tid ? MT(M, q.tid) : null, G = q.gid ? M.groups.find(g => g.id === q.gid) : null;
    if ((ev.pick && !T && !G) || !ev) { M.queue.shift(); return Mgr.flush(); }
    MgrUI.cur = { ev, T, G, ctx: { t: T, g: G } };
    const ch = ev.choices.map((c, i) => { const off = c.req && !c.req(M); return `<button class="choice" data-act="m.choose" data-i="${i}" ${off ? 'disabled' : ''}>${Mgr.fmt(c.t, MgrUI.cur.ctx)}${c.check ? `<small>🎲 檢定：${SKILLS[c.check.st]}</small>` : ''}${off ? '<small>條件不足</small>' : ''}</button>`; }).join('');
    return UI.modal(`<div class="ev-tag">📖 事件</div><h3>${ev.title}</h3><p class="pre">${Mgr.fmt(ev.text, MgrUI.cur.ctx)}</p><div class="choices">${ch}</div>`, { cls: 'event' });
  }
  if (q.t === 'report') {
    return UI.modal(`<div class="ev-tag">📋 月度報告</div><h3>練習生成長報告</h3><ol class="rank mini">${q.list.map((x, i) => `<li><span>${gradeChip(x.rating)}</span><b>${U.esc(x.name)}</b><small>${x.age}歲 · ${['練習生', '預備組', '已出道'][x.stage]}</small><em>${x.ovr}</em></li>`).join('')}</ol><p class="sub">評級依據同年齡的基準值。S/A 表示已有出道實力。</p><div class="btn-row"><button class="btn" data-act="m.next">繼續</button></div>`, { cls: 'event' });
  }
  if (q.t === 'end') { M.queue.shift(); Mgr.ending(q.key); return Mgr.render(); }
  UI.modal(`<div class="ev-tag">📢 通知</div><h3>${q.title}</h3><p class="pre">${q.text}</p><div class="btn-row"><button class="btn" data-act="m.next">繼續</button></div>`, { cls: 'event' });
};

ACT['m.plango'] = d => {

    <h3>🎤 偶像模式：新遊戲</h3>
    <section class="cc-sec"><h4>1. 你的名字</h4><input id="nm" maxlength="8" value="${U.esc(d.name)}" placeholder="例：金夏恩"></section>
