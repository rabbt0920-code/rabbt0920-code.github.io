<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>穿越成為武俠門派二把手，我該怎麼辦？</title>
<style>
/* ================= 基礎主題：深色古風 + 金邊 ================= */

}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(ellipse at 50% -10%,#31251a 0%,#14100c 45%,#0b0908 100%) fixed;
  color:var(--txt);
  font-family:"Noto Serif TC","Songti TC","STSong","PMingLiU","Microsoft JhengHei",serif;
  font-size:15px; line-height:1.5; overflow-x:hidden;
}
/* 背景流動的霧氣 */
.mist{position:fixed;inset:-20%;pointer-events:none;z-index:0;opacity:.5;
  background:
    radial-gradient(ellipse 40% 25% at 20% 30%,rgba(212,175,55,.07),transparent 70%),
    radial-gradient(ellipse 45% 30% at 80% 70%,rgba(160,130,80,.06),transparent 70%),
    radial-gradient(ellipse 35% 20% at 55% 90%,rgba(255,255,255,.04),transparent 70%);
  animation:mist 40s ease-in-out infinite alternate}
@keyframes mist{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(4%,3%,0) scale(1.15)}}
#app{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:10px 14px 18px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 6px 12px}
h1{margin:0;font-size:clamp(18px,2.6vw,28px);letter-spacing:.12em;font-weight:700;
  background:linear-gradient(180deg,#fff3c4,#d4af37 60%,#8c6d1a);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 18px rgba(212,175,55,.25)}
.sub{color:var(--mute);font-size:12px;letter-spacing:.2em}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr) 340px;gap:12px;height:calc(100vh - 86px);min-height:560px}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-y:auto;
  box-shadow:inset 0 0 0 1px rgba(212,175,55,.12),0 8px 28px rgba(0,0,0,.55)}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--gold);pointer-events:none;opacity:.8}
.panel::before{top:4px;left:4px;border-right:none;border-bottom:none}
.panel::after{bottom:4px;right:4px;border-left:none;border-top:none}
.panel::-webkit-scrollbar,.modal::-webkit-scrollbar{width:8px}.panel::-webkit-scrollbar-thumb,.modal::-webkit-scrollbar-thumb{background:#4a3c1e;border-radius:4px}
.ptitle{margin:0 0 10px;font-size:17px;color:var(--gold2);letter-spacing:.3em;text-align:center;border-bottom:1px solid var(--line);padding-bottom:6px}
h3{margin:14px 0 8px;font-size:14px;color:var(--gold);letter-spacing:.2em;display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* 按鈕 */
.btn{font:inherit;color:var(--gold2);background:linear-gradient(#3b2e19,#1d1610);border:1px solid var(--gold);border-radius:4px;
  padding:.5em .9em;cursor:pointer;transition:.18s;letter-spacing:.08em}
.btn:hover:not(:disabled){box-shadow:0 0 12px rgba(212,175,55,.5);transform:translateY(-1px);color:#fff}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{border-color:var(--red);color:#f1b3ac;background:linear-gradient(#3a1a17,#1d0e0c)}
.btn.small{font-size:12px;padding:.25em .6em}
.hdr-r{display:flex;align-items:center;gap:10px}.speedbox{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mute)}.speedbox .btn.on{background:linear-gradient(#6b5420,#3b2e19);box-shadow:0 0 10px rgba(212,175,55,.5);color:#fff}
.mini{font:inherit;font-size:12px;color:var(--mute);background:none;border:1px solid var(--line);border-radius:3px;cursor:pointer;padding:1px 6px}
.mini:hover{color:var(--gold2);border-color:var(--gold)}
.btn .cost{display:block;font-size:11px;color:var(--mute);letter-spacing:0}

/* 左側：門派狀態 */
.sect-name{font-size:19px;color:var(--gold2);text-align:center;margin:2px 0;letter-spacing:.15em}
.subline{text-align:center;color:var(--mute);font-size:12px;margin-bottom:10px}
.stat{display:flex;align-items:center;gap:10px;padding:7px 8px;margin-bottom:6px;background:rgba(0,0,0,.28);border:1px solid rgba(110,90,43,.5);border-radius:5px}
.badge{flex:none;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  color:#1a1208;background:radial-gradient(circle at 35% 30%,#fff1b8,#d4af37 60%,#8c6d1a);font-weight:700;font-size:14px;box-shadow:0 0 8px rgba(212,175,55,.35)}
.stat .k{font-size:12px;color:var(--mute)}
.stat .v{font-size:20px;color:var(--gold2);line-height:1.1;font-variant-numeric:tabular-nums}
.stat .rate{margin-left:auto;font-size:12px;color:var(--green);text-align:right;font-variant-numeric:tabular-nums}
.rate.neg{color:var(--red)}
.meter{margin:8px 0}
.meter .mrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.bar{height:8px;background:#000;border:1px solid #4a3c1e;border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8c6d1a,#f2dc94);transition:width .4s}
.bar.trust>i{background:linear-gradient(90deg,#2d7a46,#8be0a0)}
.bar.trust.low>i{background:linear-gradient(90deg,#7a2d2d,#e07a7a)}
.bar.amb>i{background:linear-gradient(90deg,#5a2d7a,#c49be8)}
.rankbox{background:rgba(0,0,0,.28);border:1px solid rgba(110,90,43,.5);border-radius:5px;padding:8px 10px;font-size:13px}
.rankbox .big{font-size:22px;color:var(--gold2);font-variant-numeric:tabular-nums}
.rankbox .ln{display:flex;justify-content:space-between;gap:6px;margin-top:3px}
.rankbox .ln span:first-child{color:var(--mute)}
.up{color:var(--green)}.down{color:#e08c84}
.techs{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;padding:1px 7px;border:1px solid var(--line);border-radius:10px;color:var(--gold2);background:rgba(212,175,55,.08)}
.foot-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.bump{animation:bump .5s}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.18);color:#fff}100%{transform:scale(1)}}

/* 中間：核心操作 */
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.bcard{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:5px;transition:.3s}
.bcard.flash{animation:flash .9s}
@keyframes flash{0%{box-shadow:0 0 0 rgba(212,175,55,0)}30%{box-shadow:0 0 26px rgba(242,220,148,.9);border-color:#fff}100%{box-shadow:0 0 0 rgba(212,175,55,0)}}
.bhead{display:flex;align-items:center;gap:8px}
.bhead .lv{margin-left:auto;color:var(--gold);font-size:13px}
.bdesc{font-size:12px;color:var(--mute)}
.bnow{font-size:13px}.bnext{font-size:12px;color:var(--green);min-height:18px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.log{margin-top:10px;height:210px;overflow-y:auto;background:rgba(0,0,0,.35);border:1px solid rgba(110,90,43,.5);border-radius:5px;padding:8px 10px;font-size:13px}
.log p{margin:0 0 5px;padding-bottom:5px;border-bottom:1px dashed rgba(110,90,43,.3)}
.log p.new{animation:logIn .6s}
@keyframes logIn{from{background:rgba(212,175,55,.25)}to{background:transparent}}
.log .t{color:var(--mute);font-size:11px;margin-right:6px}
.log .good{color:var(--green)}.log .bad{color:#e08c84}.log .gold{color:var(--gold2)}
.advrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cd{color:var(--mute);font-size:12px}

/* 右側：弟子列表 */
.sortrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:8px}
select{font:inherit;font-size:12px;background:#1a140e;color:var(--txt);border:1px solid var(--line);border-radius:3px;padding:2px 4px}
.dcard{position:relative;margin-bottom:8px;padding:8px 10px;background:rgba(0,0,0,.3);border:1px solid rgba(110,90,43,.6);border-radius:6px;cursor:pointer;transition:.2s}
.dcard:hover{border-color:var(--gold);background:rgba(212,175,55,.06)}
.dcard.training{border-color:rgba(212,175,55,.55);animation:glow 2.4s ease-in-out infinite}
.dcard.seclusion{border-color:#a77bd8;animation:glowp 1.6s ease-in-out infinite}
.dcard.hurt{border-color:rgba(192,69,58,.7)}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(212,175,55,0)}50%{box-shadow:0 0 12px rgba(212,175,55,.35)}}
@keyframes glowp{0%,100%{box-shadow:0 0 4px rgba(167,123,216,.2)}50%{box-shadow:0 0 18px rgba(167,123,216,.7)}}
.dhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dname{font-size:16px;color:var(--gold2);letter-spacing:.1em}
.realm{font-size:11px;padding:0 6px;border-radius:3px;border:1px solid var(--line);color:var(--mute)}
.realm.r1{color:#9fd3a3;border-color:#4d7a51}.realm.r2{color:#8fc3f0;border-color:#44739c}.realm.r3{color:#f0c06a;border-color:#b88a2c;box-shadow:0 0 6px rgba(240,192,106,.4)}
.lst{font-size:11px;padding:0 6px;border-radius:3px;color:#1a1208;background:linear-gradient(#fff1b8,#d4af37);font-weight:700}
.lst.di{background:linear-gradient(#e2c9ff,#a77bd8)}.lst.tian{background:linear-gradient(#ffd0c0,#e86a4a);color:#fff}
.trait{margin-left:auto;font-size:11px;color:var(--purple)}
.dmeta{font-size:12px;color:var(--mute);margin:3px 0}
.dpow{display:flex;justify-content:space-between;font-size:12px;margin:3px 0 2px}
.dstate{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qi{display:none;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff3c4,rgba(212,175,55,0) 70%);animation:qi 1.6s ease-in-out infinite}
.dcard.training .qi,.dcard.seclusion .qi{display:inline-block}
@keyframes qi{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.7);opacity:1}}
.cond{padding:0 6px;border-radius:3px;font-size:11px}
.cond.bad{background:rgba(192,69,58,.25);color:#f1b3ac}.cond.good{background:rgba(111,191,115,.2);color:#b6e8b9}.cond.sec{background:rgba(167,123,216,.25);color:#dcc4f4}
.eqline{font-size:11px;color:var(--mute);margin-top:3px}

/* 彈窗 */
#modal-root .mask{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(520px,100%);max-height:92vh;overflow-y:auto;background:linear-gradient(#211a12,#14100b);border:1px solid var(--gold);border-radius:8px;
  padding:16px 18px;box-shadow:0 0 40px rgba(212,175,55,.25),inset 0 0 0 1px rgba(212,175,55,.15);animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.modal.wide{width:min(680px,100%)}
@keyframes pop{from{transform:scale(.88) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.mtitle{font-size:19px;color:var(--gold2);letter-spacing:.25em;text-align:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.mbody p{margin:0 0 10px}
.mbody .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mbody .choices .btn{text-align:left;padding:.6em .9em}
.mbody .choices .hint{display:block;font-size:11px;color:var(--mute);letter-spacing:0}
.mfoot{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.fxline{font-size:13px;margin:2px 0}.fxline.pos{color:var(--green)}.fxline.neg{color:#e08c84}.fxline.neu{color:var(--gold2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px;margin:8px 0}
.grid2 span{color:var(--mute)}
.jobs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.jobs .btn.on{background:linear-gradient(#6b5420,#3b2e19);box-shadow:0 0 10px rgba(212,175,55,.5);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed rgba(110,90,43,.3);font-size:13px}
.row small{color:var(--mute);display:block}
.story{font-size:14px;line-height:1.8;text-indent:2em}
input.txt{width:100%;font:inherit;padding:6px 8px;background:#0e0b08;border:1px solid var(--gold);color:var(--txt);border-radius:4px}
.ending-title{font-size:26px;text-align:center;margin:6px 0 12px;letter-spacing:.3em;background:linear-gradient(180deg,#fff3c4,#d4af37);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 天機榜 */
.tripbox{margin-bottom:8px;font-size:13px}.tripbox .row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 8px;border:1px solid rgba(110,90,43,.5);border-radius:4px;background:rgba(0,0,0,.2);margin-bottom:4px}.tripbox small{display:block;color:var(--mute);font-size:11px}.dcard.away{opacity:.6;border-style:dashed}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.tabs .btn.on{background:linear-gradient(#6b5420,#3b2e19);box-shadow:0 0 10px rgba(212,175,55,.5);color:#fff}
.rnote{text-align:center;color:var(--mute);font-size:12px;margin-bottom:8px}
.rtable{width:100%;border-collapse:collapse;font-size:13px}
.rtable th{color:var(--gold);font-weight:normal;border-bottom:1px solid var(--line);padding:4px;text-align:left;position:sticky;top:-16px;background:#1d1710}
.rtable td{padding:4px;border-bottom:1px dashed rgba(110,90,43,.3);font-variant-numeric:tabular-nums}
.rtable td.n{text-align:right}
.rtable tr.own td{color:var(--gold2);background:rgba(212,175,55,.12)}
.rtable tr.rv td{color:#f1b3ac}
.rtable .nick{color:var(--mute);font-size:12px}
.float{position:fixed;z-index:80;pointer-events:none;font-weight:700;color:var(--gold2);text-shadow:0 0 6px #000;animation:floatup 1.3s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}
#toast-root{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#2a1f10;border:1px solid var(--gold);color:var(--gold2);padding:6px 16px;border-radius:20px;font-size:13px;animation:toast 2.6s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
/* v3 */
.guide{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;margin-bottom:8px;border:1px solid var(--gold);border-radius:5px;background:rgba(212,175,55,.12);color:var(--gold2);font-size:13px;animation:glow 2.4s ease-in-out infinite}
.guide-hl{outline:2px solid var(--gold2);outline-offset:2px;animation:hl 1.2s ease-in-out infinite;position:relative;z-index:2}
@keyframes hl{0%,100%{box-shadow:0 0 0 rgba(242,220,148,0)}50%{box-shadow:0 0 18px rgba(242,220,148,.9)}}
.qbox{font-size:12px;cursor:pointer;background:rgba(0,0,0,.25);border:1px solid rgba(110,90,43,.5);border-radius:5px;padding:5px 8px}
.qmini{display:flex;justify-content:space-between;gap:6px;padding:1px 0}.qmini.done{color:var(--mute);text-decoration:line-through}.qmini.ready{color:var(--green);font-weight:700;text-decoration:none}
.buffs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.buff{font-size:11px;padding:1px 7px;border-radius:10px;background:rgba(111,191,115,.18);color:#b6e8b9;border:1px solid rgba(111,191,115,.4)}.buff.bad{background:rgba(192,69,58,.2);color:#f1b3ac;border-color:rgba(192,69,58,.5)}
.warnbox{color:#f1b3ac;font-size:12px;margin:4px 0}.warnbox:empty{display:none}
.warn{color:#f1b3ac}
.stat .rate.neg{color:#e08c84}
.row.lock{opacity:.5}
.row small{display:block;color:var(--mute);font-size:11px}
.row .bar{height:4px;margin-top:3px;width:160px;max-width:100%}
.tag.on{border-color:var(--green);color:#b6e8b9;background:rgba(111,191,115,.12)}.tag.off{opacity:.55}.tag.foe{border-color:var(--red);color:#f1b3ac;background:rgba(192,69,58,.15)}
.combos{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.lnk{color:var(--gold2);cursor:pointer;text-decoration:underline dotted}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chart{background:rgba(0,0,0,.3);border:1px solid rgba(110,90,43,.5);border-radius:5px;padding:6px 8px}
.chart .ct{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}.chart .ct b{color:var(--gold2)}
.chart svg{width:100%;height:80px;display:block}.chart .cr{display:flex;justify-content:space-between;font-size:10px;color:var(--mute)}
textarea.io{width:100%;height:70px;font-size:11px;word-break:break-all;resize:vertical}
.spark{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:85;box-shadow:0 0 8px currentColor;animation:spark .8s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.achpop{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:95;background:linear-gradient(#3b2e19,#1d1610);border:2px solid var(--gold2);border-radius:8px;padding:10px 26px;text-align:center;
  box-shadow:0 0 30px rgba(242,220,148,.6);animation:achpop 3.5s forwards;pointer-events:none}
.achpop small{display:block;color:var(--gold);letter-spacing:.3em;font-size:11px}.achpop b{display:block;font-size:20px;color:#fff3c4;letter-spacing:.15em}.achpop span{font-size:12px;color:var(--mute)}
@keyframes achpop{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}10%,85%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-20px)}}
body.shake #app{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.mtabs{display:none}
input[type=range]{accent-color:var(--gold)}
@media(max-width:760px){
  header{flex-wrap:wrap}.hdr-r{flex-wrap:wrap;gap:6px}
  .layout{display:block;height:auto;padding-bottom:56px}

  body[data-tab="left"] #panel-left, body[data-tab="center"] #panel-center, body[data-tab="right"] #panel-right{display:block}

}

  .layout{grid-template-columns:1fr;height:auto}
  .panel{max-height:none}
}
</style>
</head>
<body>
<div class="mist"></div>
<div id="app">
  <header>
    <div>
      <h1>穿越成為武俠門派二把手，我該怎麼辦？</h1>
      <div class="sub">單機經營 · 自動存檔 · 離線可收益 · <span id="genText"></span></div>
    </div>
    <div class="hdr-r">
      <div class="speedbox" title="加速只影響線上遊玩；離線收益依實際離開時間計算，不受倍速影響">
        <span>速度</span>
        <button class="btn small on" data-act="speed" data-v="1">1×</button>
        <button class="btn small" data-act="speed" data-v="2">2×</button>
        <button class="btn small" data-act="speed" data-v="5">5×</button>
      </div>
      <button class="btn small" data-act="settings">設定</button>
      <button class="btn small" data-act="help">玩法說明</button>
    </div>
  </header>

  <main class="layout">

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const rint = (a, b) => Math.floor(rnd(a, b + 1));

function wpick(arr, wf) {                    // 加權隨機
  let t = 0; for (const x of arr) t += wf(x);
  let r = Math.random() * t;
  for (const x of arr) { r -= wf(x); if (r <= 0) return x; }
  return arr[arr.length - 1];
}
function fmt(n) {                            // 數字簡化顯示

}

const STATS_DEF = { recruited: 0, forged: 0, events: 0, promoted: 0, travels: 0, dispatches: 0, greats: 0, enc: 0, camp3: 0, rivalWin: 0, fests: 0 };

function newState() {

    auto: Object.assign({}, AUTO_OFF), lastDispatch: null, autoSig: '', dip: initDip(), hist: [],

  };

function saveGame() {

function loadGame() {

    const data = JSON.parse(raw);
    const base = newState();                 // 先建立預設值，再覆蓋，確保新欄位有預設（舊版存檔也能升級）
    const S = Object.assign(base, data);
    S.res = Object.assign({ gold: 0, rep: 0, food: 0 }, data.res);

    S.flags = Object.assign({ intro: false, wonA: false, wonTop: false, truth: false }, data.flags);
    S.disciples = (data.disciples || []).map(d => Object.assign(blankDisciple(), d));
    S.items = data.items || [];
    S.trips = data.trips || []; S.reports = data.reports || [];
    S.disciples.forEach(d => { if (d.trip && !S.trips.some(t => t.id === d.trip)) d.trip = null; });   // 清除失效的外出標記
    S.techs = data.techs || [];
    if (!data.npcs || !data.npcs.length) S.npcs = base.npcs;

/* ================= 5. 弟子與數值計算 ================= */
function blankDisciple() {
  return { id: uid(), name: '無名', talent: 50, bone: 50, power: 0, contrib: 0, job: 'train', age: rint(16, 24), title: '',
           cond: null, trip: null, master: null, rel: {}, weapon: null, armor: null, arts: [], realm: 0, trait: 'shechu' };
}
function genDisciple(opt = {}) {
  const rep = (state && state.res.rep) || 0;
  const boost = Math.min(15, rep / 300) + (opt.boost || 0) + (state && state.rank ? rankRecruitBoost() : 0) + 3 * perk('talent');
  const roll = () => clamp(Math.round(10 + (Math.random() + Math.random()) / 2 * 85 + boost), 10, 100);
  const d = blankDisciple();
  d.talent = roll(); d.bone = roll();
  d.trait = wpick(Object.keys(TRAITS), k => TRAITS[k].w);
  d.power = rint(0, 8);
  let name, tries = 0;
  do { name = pick(SURNAMES) + pick(GIVEN); tries++; }
  while (state && state.disciples.some(x => x.name === name) && tries < 30);
  d.name = name;
  return d;
}
function quality(d) {
  const q = (d.talent + d.bone) / 2;
  return q < 35 ? '平庸' : q < 55 ? '尚可' : q < 72 ? '良才' : q < 88 ? '奇才' : '絕世';
}
const capOf = d => d.bone * 12;                              // 實力成長軟上限
const realmOf = p => { let r = 0; REALMS.forEach((x, i) => { if (p >= x.min) r = i; }); return r; };
const getItem = id => state.items.find(i => i.id === id) || null;
const lvl = k => state.b[k];
const dojoMul = () => dojoMulAt(lvl('dojo'));
const gardenProd = () => gardenProdAt(lvl('garden'));
const capacity = () => 4 + 2 * Math.min(10, lvl('dojo')) + Math.max(0, lvl('dojo') - 10) + Math.min(10, lvl('garden'));   // 10 級後人數成長減半
const condOf = d => (d.cond && d.cond.until > state.clock) ? COND[d.cond.type] : null;
const listedOf = d => (state.rank && state.rank.mine[d.id]) || null;   // 弟子目前的上榜資訊 {tier,pos}

function sectBonus(key) {                     // 全門派被動（基礎功法）
  let s = 0; for (const id of state.techs) { const t = TECH_MAP[id]; if (t && t.key === key) s += t.base; } return s;
}
function dBonus(d, key) {                      // 單一弟子總加成：基礎 + 真傳
  let s = sectBonus(key);
  for (const id of d.arts) { const t = TECH_MAP[id]; if (t && t.key === key) s += t.adv; }
  return s + comboBonus(d, key);
}
function eqPow(d) { let s = 0; for (const k of ['weapon', 'armor']) { const it = d[k] && getItem(d[k]); if (it) s += it.pow; } return s; }
function guardOf(d) { const a = d.armor && getItem(d.armor); return dBonus(d, 'guard') + (a ? (a.guard || 0) : 0); }
function effPower(d) { return (d.power + eqPow(d)) * (1 + dBonus(d, 'power')); }
function sectPower() { return state.disciples.reduce((s, d) => s + effPower(d), 0); }
const countRealm = r => state.disciples.filter(d => d.realm >= r).length;
const recruitCost = () => { const n = state.disciples.length; return Math.round(40 + 12 * n + 1.5 * n * n); };
const forgeCost = () => 80 + 30 * state.stats.forged;
const upgradeCost = k => Math.round(BUILDINGS[k].base * Math.pow(BUILDINGS[k].grow, lvl(k) - 1));
const tributeCost = () => 40 + 5 * state.disciples.length;
const SCHEME_COST = 150;

// 門派榜名次帶來的加成
function rankBonus() {
  const p = state.rank ? state.rank.myPos : 99;
  return p <= 1 ? 0.5 : p <= 3 ? 0.3 : p <= 6 ? 0.2 : p <= 10 ? 0.1 : p <= 14 ? 0.05 : 0;
}
const rankRecruitBoost = () => Math.max(0, (SECTS_INIT.length + 1 - state.rank.myPos) * 0.6);

const WAGE = [0.01, 0.03, 0.08, 0.18];           // 各境界弟子月錢（每秒資金）
// 計算當前每秒產出（UI 與 tick 共用）
function calc() {
  const S = state, starveK = S.starve > 0 ? 0.3 : 1, libK = 1 + 0.03 * (lvl('library') - 1), dm = dojoMul();
  let gold = CONFIG.baseGold + S.res.rep * CONFIG.repGold, rep = 0, farm = 0, cons = 0, sp = 0, upkeep = 0;
  const tMul = (1 + 0.1 * perk('train')) * (1 + 0.03 * S.aura) * buffMul('train');
  const per = [];
  for (const d of S.disciples) {
    const tr = TRAITS[d.trait] || TRAITS.shechu, job = JOBS[d.job] || JOBS.train, c = condOf(d), L = listedOf(d);
    const wm = c ? c.work : 1, tm = c ? c.train : 1;
    const ep = effPower(d); sp += ep;
    cons += CONFIG.foodPerDisciple * (1 + tr.food) * (1 - clamp(dBonus(d, 'foodSave'), 0, 0.8));
    if (d.trip) { per.push({ d, train: 0, contrib: 0 }); continue; }      // 外出中：不產出、不修煉，只耗糧
    const rm = relMod(d), work = wm * (1 + tr.work) * starveK * rm.work * (S.unpaid ? 0.6 : 1) * buffMul('work');
    upkeep += WAGE[d.realm];
    gold += (0.12 + 0.0018 * ep) * job.gold * work * (1 + tr.gold + dBonus(d, 'gold'));
    rep  += (0.0006 * ep + REALMS[d.realm].bonus) * job.rep * work * (1 + tr.rep) * libK;
    if (L) { gold += TIER_GOLD[L.tier]; rep += TIER_REP[L.tier]; }           // 上榜弟子的名氣收益
    if (d.job === 'farm') farm += 0.45 * (1 + d.bone / 100) * work;
    // 修煉：頓悟/閉關等增益狀態會讓任何職務都以「修煉」效率成長
    const jt = (c && c.train > 1) ? Math.max(job.train, 1) : job.train;
    let train = 0;
    if (jt > 0) {
      train = (0.25 + d.talent / 100) * jt * tm * dm * Math.max(0.1, 1 + tr.train + dBonus(d, 'train')) * starveK * rm.train * tMul;
      if (d.power >= capOf(d)) train *= 0.05;      // 超過根骨上限後成長極慢
    }
    per.push({ d, train, contrib: 0.12 * job.ct * wm * starveK + 0.04 * S.disciples.filter(x => x.master === d.id).length });
  }
  gold += S.branches * 3 + dipIncome(); rep += S.branches * 0.6;              // 分舵與通商
  const rb = (1 + rankBonus()) * (1 + 0.1 * perk('prod')) * achMul() * (1 + 0.03 * S.aura);
  return { gold: gold * rb * buffMul('gold'), rep: rep * rb * buffMul('rep'), foodProd: (gardenProd() + farm) * buffMul('food'), foodCons: cons, sp, per, upkeep };
}

/* ================= 6. 主迴圈 ================= */
// dt：現實秒數；ws：江湖時間倍率（離線時縮小，避免一次老好幾十歲）
function tick(dt, offline, ws = 1) {
  const S = state, k = offline ? offlineEff() : 1, r = calc(), wt = dt * ws;
  S.clock += wt;
  S.res.gold += (r.gold - r.upkeep) * dt * k;
  // 月錢：資金見底時發不出月錢，弟子工作效率下降
  if (S.res.gold <= 0) { S.res.gold = 0; if (!S.unpaid && r.gold < r.upkeep) { S.unpaid = true; if (!offline) addLog('帳房哭喪著臉來報：資金見底，這個月的月錢發不出來了！弟子們幹活明顯沒勁。', 'bad'); } }
  else if (S.unpaid && S.res.gold > 50) { S.unpaid = false; if (!offline) addLog('月錢補發了，弟子們重新打起精神。', 'good'); }
  S.res.rep  += r.rep * dt * k;
  S.res.food += (r.foodProd - r.foodCons) * dt * k;

  // 糧食耗盡：產出大減；線上時每 25 秒有弟子下山討飯
  if (S.res.food <= 0) {
    S.res.food = 0; S.starve += dt;
    if (!S.starveWarned && !offline) { S.starveWarned = true; addLog('糧倉見底了！弟子們餓得頭昏眼花，做什麼都提不起勁。', 'bad'); }
    if (S.starve >= 25 && !offline && S.disciples.length > 0) {
      const d = S.disciples.slice().sort((a, b) => a.contrib - b.contrib)[0];
      removeDisciple(d); S.starve = 0;
      addLog(`${d.name} 餓得受不了，留下一張字條「我去江湖找飯吃了」，不告而別。`, 'bad');
    }
  } else { S.starve = 0; S.starveWarned = false; }

  // 弟子成長、年齡、狀態計時、晉升
  const retire = [];
  for (const p of r.per) {
    const d = p.d;
    if (p.train > 0) d.power += p.train * dt * k;
    d.contrib += p.contrib * dt * k;
    d.age += wt / CONFIG.yearLen;
    if (d.age >= CONFIG.retireAge) retire.push(d);
    if (d.cond) {
      const info = COND[d.cond.type];
      if (info && info.bad) {                          // 休息、特質可加速傷病恢復
        let heal = (TRAITS[d.trait] || TRAITS.shechu).heal;
        if (d.job === 'rest') heal += JOBS.rest.heal - 1;
        d.cond.until -= wt * heal;
      }
      if (!info || S.clock >= d.cond.until) { const t = d.cond.type; d.cond = null; if (info) onCondEnd(d, t, offline); }
    }
    const nr = realmOf(d.power);
    if (nr > d.realm) promote(d, nr);
  }
  for (const d of retire) {
    removeDisciple(d); S.res.rep += 30;
    addLog(`${d.name} 年屆六旬，決定告老還鄉，臨走前對著山門磕了三個響頭。（聲望 +30）`, 'gold');
  }

  // 增益／天災到期、各種計時
  S.buffs = S.buffs.filter(b => b.until > S.clock);
  S.festCd = Math.max(0, S.festCd - wt); S.giftCd = Math.max(0, S.giftCd - wt);
  S.autoTimer -= wt; if (S.autoTimer <= 0) { S.autoTimer = 5; runAuto(offline); }
  S.relTimer -= wt; if (S.relTimer <= 0) { S.relTimer = rnd(80, 140); relTick(offline); }
  S.histTimer -= wt; if (S.histTimer <= 0) { S.histTimer = 30; sampleHist(); }
  // 每年年初：官府課稅（持有資金的 5%）
  const yr = Math.floor(S.clock / CONFIG.yearLen);
  if (yr > S.lastYear) { S.lastYear = yr; const tax = Math.floor(S.res.gold * 0.05); if (tax > 0) { S.res.gold -= tax; if (!offline) addLog(`新的一年，官府派人來收「門派稅」${fmt(tax)} 資金。帳房一邊數錢一邊嘆氣。`, 'bad'); } }
  if (!offline) tutTick();

  // 外出歸來：結算遊歷／討伐
  for (const t of S.trips.slice()) if (S.clock >= t.until) { S.trips = S.trips.filter(x => x !== t); runTrip(t); }

  // 掌門信任與野心：野心太大掌門會起疑；低野心時信任緩慢回升
  if (!S.flags.wonA) {
    if (S.ambition >= 50) S.trust = clamp(S.trust - 0.015 * (S.ambition / 50) * wt, 0, 100);
    else if (S.ambition < 25 && S.trust < 70) S.trust = clamp(S.trust + 0.004 * wt, 0, 100);
  }
  // 各種冷卻
  S.advCd = Math.max(0, S.advCd - wt); S.tributeCd = Math.max(0, S.tributeCd - wt); S.schemeCd = Math.max(0, S.schemeCd - wt);
  // 隨機事件與宿敵計時（離線不觸發）
  if (!offline) { S.evTimer -= dt; S.rivalTimer -= dt; }
  // 每季放榜
  if (S.clock >= S.nextSeason) { S.nextSeason += CONFIG.seasonLen; settleSeason(offline); }
}
function onCondEnd(d, type, offline) {
  if (type === 'seclusion') { endSeclusion(d); return; }
  if (offline) return;
  if (COND[type].bad) addLog(`${d.name} 的「${COND[type].n}」好了，重新歸隊。`);
  else addLog(`${d.name} 的「${COND[type].n}」狀態結束了。`);
}
function endSeclusion(d) {
  const p = clamp(0.55 + d.talent / 300 + dBonus(d, 'luck'), 0.3, 0.95);
  if (Math.random() < p) {
    const g = Math.round(d.power * 0.1 + 5);
    d.power += g; d.bone = Math.min(150, d.bone + 3); d.contrib += 10;
    addLog(`${d.name} 閉關結束，大有突破！實力 +${g}、根骨 +3、貢獻 +10。`, 'good');
  } else {
    const loss = Math.round(d.power * 0.08);
    d.power = Math.max(0, d.power - loss);
    d.cond = { type: 'deviant', until: state.clock + 60 };
    addLog(`${d.name} 閉關時走火入魔，實力 -${loss}，需要調養一陣子。`, 'bad');
  }
}
function promote(d, nr) {
  d.realm = nr;
  const R = REALMS[nr];
  d.contrib += R.contrib; state.res.rep += R.rep; state.stats.promoted++; qProg('promote');
  addLog(`${d.name} 晉升為「${R.n}」！（貢獻 +${R.contrib}、聲望 +${R.rep}）`, 'gold');
  if (!simulating) { burst(document.querySelector(`.dcard[data-id="${d.id}"]`), '#a77bd8'); Snd.play('level'); }
}
function removeDisciple(d) {
  cleanRel(d);
  for (const t of state.trips) t.ids = t.ids.filter(id => id !== d.id);
  state.trips = state.trips.filter(t => t.ids.length);
  for (const it of state.items) if (it.owner === d.id) it.owner = null;
  state.disciples = state.disciples.filter(x => x !== d);
}
function syncTechs(silent) {                       // 依藏經閣等級自動解鎖門派功法
  for (const t of TECHS) {
    if (lvl('library') >= t.reqLib && !state.techs.includes(t.id)) {
      state.techs.push(t.id);
      if (!silent) addLog(`藏經閣解鎖新功法：「${t.name}」（全門派${KEY_NAME[t.key]} +${Math.round(t.base * 100)}%）`, 'gold');
    }
  }
}

/* ================= 7. 天機榜（江湖 NPC、各派評分、季度放榜） ================= */
function pickNpcSect() {
  if (Math.random() < 0.15) return '江湖散人';
  return wpick(state.sects, s => Math.sqrt(Math.max(1, s.score))).name;
}
// kind：young=開局少俠（16~29 歲）、fresh=新出道（15~18 歲）、adult=成名高手（32~45 歲）
function genNPC(kind) {
  const n = { id: uid(), name: genName(), title: genTitle(), sect: pickNpcSect(), age: 20, power: 100, g: rnd(40, 170) };
  if (kind === 'young') { n.age = rint(16, 29) + Math.random(); n.power = 30 + (n.age - 15) * rnd(15, 60) * (Math.random() < .1 ? 1.8 : 1); }
  else if (kind === 'fresh') { n.age = rint(15, 18) + Math.random(); n.power = rnd(20, 160); }
  else { n.age = rint(32, 45) + Math.random(); n.power = rnd(1300, 2500); n.g = rnd(30, 90); }
  return n;
}
function initNPCs() {
  const S = state; S.npcs = [];
  for (const [name, title, sect, age, power] of TIAN_INIT) S.npcs.push({ id: uid(), name, title, sect, age, power, g: rnd(40, 90) });
  S.npcs.push({ id: 'tiezhenshan', name: RIVAL_MASTER, title: '開碑手', sect: RIVAL, age: 52, power: 2600, g: 80, keep: true });
  S.npcs.push({ id: 'leilie', name: RIVAL_STAR, title: '小霸王', sect: RIVAL, age: 19, power: 450, g: 220, keep: true });
  while (S.npcs.filter(n => n.age >= 30).length < CONFIG.adultPool) S.npcs.push(genNPC('adult'));
  for (let i = 0; i < CONFIG.youngPool - 1; i++) S.npcs.push(genNPC('young'));
}
const leilie = () => state.npcs.find(n => n.id === 'leilie');
const rivalSect = () => state.sects.find(s => s.id === 'tiequan');

// 江湖過了一季：NPC 成長老去、新人出道、各派評分變動
function ageWorld() {
  const S = state;
  for (const n of S.npcs) {
    n.age += 0.25;
    if (n.age < 30) n.power += n.g * 0.25; else if (n.age < 55) n.power += n.g * 0.08; else n.power *= 0.995;
  }
  S.npcs = S.npcs.filter(n => n.age < 80 && (n.keep || n.age < 30 || n.power >= 1300));
  let young = S.npcs.filter(n => n.age < 30).length, adult = S.npcs.length - young;
  while (young < CONFIG.youngPool) { S.npcs.push(genNPC('fresh')); young++; }
  while (adult < CONFIG.adultPool) { S.npcs.push(genNPC('adult')); adult++; }
  for (const s of S.sects) {
    if (s.id === 'tiequan') s.score += 90 + 0.035 * s.score;   // 鐵拳門：野心勃勃，成長最快
    else s.score += s.grow * rnd(0.7, 1.3);
  }
  S.fame *= CONFIG.fameDecay;
}
function playerScore(cnt) {
  const S = state;
  return Math.max(0, S.res.rep + 0.5 * sectPower() + TIER_SCORE.ren * cnt.ren + TIER_SCORE.di * cnt.di + TIER_SCORE.tian * cnt.tian + S.fame);
}
const liveScore = () => playerScore(state.rank ? state.rank.cnt : { tian: 0, di: 0, ren: 0 });

// 依目前狀態排出天地人三榜與門派榜。quiet=true 時不跳提示
function publishRank(quiet) {
  const S = state;
  const people = [];
  for (const n of S.npcs) people.push({ id: n.id, n: n.name, t: n.title, s: n.sect, a: Math.floor(n.age), p: Math.round(n.power), o: 0 });
  for (const d of S.disciples) people.push({ id: d.id, n: d.name, t: d.title, s: S.sectName, a: Math.floor(d.age), p: Math.round(effPower(d)), o: 1 });
  people.sort((a, b) => b.p - a.p);
  const tian = people.slice(0, 10), di = people.slice(10, 22);
  const ren = people.slice(22).filter(x => x.a < CONFIG.renAgeLimit).slice(0, 78);
  const mine = {}, cnt = { tian: 0, di: 0, ren: 0 };
  for (const [k, list] of [['tian', tian], ['di', di], ['ren', ren]]) {
    list.forEach((x, i) => {
      if (!x.o) return;
      mine[x.id] = { tier: k, pos: i + 1 }; cnt[k]++;
      const d = S.disciples.find(dd => dd.id === x.id);
      if (d && !d.title) d.title = genTitle();               // 上榜時天機閣替弟子取綽號
      if (d) x.t = d.title;
    });
  }
  const prev = S.rank;
  const list = S.sects.map(s => ({ id: s.id, n: s.name, sc: Math.round(s.score) }));
  list.push({ id: 'me', n: S.sectName, sc: Math.round(playerScore(cnt)) });
  list.sort((a, b) => b.sc - a.sc);
  const prevPos = {}; if (prev) prev.sects.forEach((x, i) => { prevPos[x.id] = i + 1; });
  list.forEach(x => { x.pv = prevPos[x.id] || 0; });
  const myPos = list.findIndex(x => x.id === 'me') + 1, rivalPos = list.findIndex(x => x.id === 'tiequan') + 1;
  S.rank = { season: S.seasons, tian, di, ren, sects: list, mine, cnt, myPos, rivalPos };
  if (S.seasons === 0 || !prev) return;

  // ---- 放榜公告 ----
  const chg = prev.myPos - myPos;
  addLog(`天機閣發布第${S.seasons}期《天機榜》：${esc(S.sectName)}位列門派榜第 ${myPos} 名${chg > 0 ? `（上升 ${chg} 名）` : chg < 0 ? `（下滑 ${-chg} 名）` : ''}。`, chg >= 0 ? 'gold' : 'bad');
  if (prev.rivalPos < prev.myPos && myPos < rivalPos) addLog(`聽說鐵震山看到榜單後把桌子拍成了兩半——${esc(S.sectName)}超越了${RIVAL}！`, 'good');
  if (prev.rivalPos > prev.myPos && myPos > rivalPos) addLog(`${RIVAL}在榜上反超了你們，山下的鐵拳門弟子笑得特別大聲。`, 'bad');
  for (const d of S.disciples) {
    const now = mine[d.id], was = prev.mine[d.id];
    if (now && (!was || was.tier !== now.tier)) {
      const up = !was || ['ren', 'di', 'tian'].indexOf(now.tier) > ['ren', 'di', 'tian'].indexOf(was.tier);
      if (up) { S.res.rep += TIER_FIRST[now.tier]; addLog(`${d.name}以「${d.title}」之名登上${TIER_NAME[now.tier]}第 ${now.pos} 名！（聲望 +${TIER_FIRST[now.tier]}）`, 'gold'); }
      else addLog(`${d.name} 從${TIER_NAME[was.tier]}跌落至${TIER_NAME[now.tier]}第 ${now.pos} 名。`, 'bad');
    } else if (!now && was) {
      if (was.tier === 'ren' && d.age >= CONFIG.renAgeLimit) addLog(`${d.name}年滿三十，依天機閣規矩自人榜除名。他對著榜單發呆了一整個下午。`, 'bad');
      else addLog(`${d.name} 跌出了${TIER_NAME[was.tier]}。`, 'bad');
    }
  }
  if (!quiet) toast(`第${S.seasons}期天機榜放榜：門派第 ${myPos} 名`);
}
function settleSeason(quiet) { state.seasons++; ageWorld(); dipSeason(); publishRank(quiet); }

/* ================= 8. 玩家行動 ================= */
function pay(gold) { if (state.res.gold < gold) { toast('資金不足'); return false; } state.res.gold -= gold; return true; }

function upgrade(key) {
  if (lvl(key) >= CONFIG.maxLevel) return;
  if (!pay(upgradeCost(key))) return;
  state.b[key]++; qProg('upgrade'); Snd.play('level');
  if (key === 'library') syncTechs(false);
  addLog(`${BUILDINGS[key].name}升到 ${lvl(key)} 級！`, 'gold');
  const card = $(`.bcard[data-key="${key}"]`); if (card) { card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); burst(card); }
  update(true);
}
function doRecruit(silent) {
  if (state.disciples.length >= capacity()) return null;
  const cost = recruitCost(); if (state.res.gold < cost) return null;
  state.res.gold -= cost;
  const d = genDisciple(); state.disciples.push(d); state.stats.recruited++; qProg('recruit');
  addLog(`${silent ? '管事堂代為' : ''}招募新弟子：${d.name}（${Math.floor(d.age)}歲，${quality(d)}，資質${d.talent}／根骨${d.bone}，「${TRAITS[d.trait].n}」）`, 'good');
  return d;
}
function recruit() {
  if (state.disciples.length >= capacity()) return toast('弟子人數已達上限，先升級練武場或藥園吧');
  if (state.res.gold < recruitCost()) return toast('資金不足');
  doRecruit(false);
  popText($('#btnRecruit'), '+1 弟子'); Snd.play('coin');
  update(true);
}
function genItem(minTier = 0, forceTier = null) {   // 隨機生成裝備
  let tier;
  if (forceTier !== null) tier = forceTier;
  else {
    const q = Math.pow(Math.random(), 1 / (1 + 0.12 * (lvl('dojo') - 1)));
    tier = q < .55 ? 0 : q < .83 ? 1 : q < .95 ? 2 : q < .99 ? 3 : 4;
  }
  tier = Math.max(tier, minTier);
  const base = pick(ITEM_DB.filter(i => i.r === tier));
  const it = Object.assign({ id: uid(), owner: null }, base);
  state.items.push(it);
  return it;
}
const itemHTML = it => `<span style="color:${RARITY[it.r].c}">${it.name}［${RARITY[it.r].n}］</span>`;
function forge() {
  const c = forgeCost(); if (!pay(c)) return;
  state.stats.forged++; qProg('forge');
  const it = genItem(); Snd.play(it.r >= 3 ? 'ach' : 'coin');
  addLog(`鍛造採購獲得：${it.name}［${RARITY[it.r].n}］（戰力 +${it.pow}）`, it.r >= 2 ? 'gold' : '');
  toast(`獲得 ${it.name}［${RARITY[it.r].n}］`);
  update(true);
}
function tribute() {
  if (state.tributeCd > 0) return;
  if (!pay(tributeCost())) return;
  const add = state.trust > 80 ? 2 : 5;
  state.trust = clamp(state.trust + add, 0, 100); state.tributeCd = 25; qProg('tribute');
  addLog(`你提著一壺好酒去寒潭邊陪掌門${MASTER}釣魚，他笑呵呵地說「還是你懂事」。（信任 +${add}）`, 'good');
  popText($('#btnTribute'), `信任 +${add}`);
  update(true);
}
function scheme() {
  if (state.schemeCd > 0 || state.flags.wonA) return;
  if (!pay(SCHEME_COST)) return;
  state.ambition = clamp(state.ambition + 8, 0, 100); state.trust = clamp(state.trust - 2, 0, 100); state.schemeCd = 20;
  addLog('你在後山請長老們吃了頓飯，酒過三巡，大家都說「副掌門才是門派的未來」。（野心 +8、信任 -2）', 'bad');
  popText($('#btnScheme'), '野心 +8');
  update(true);
}
function coupChance() {
  const sp = sectPower();
  return clamp(sp / (sp + CONFIG.masterPower) + (state.trust - 50) / 250, 0.05, 0.95);
}
function coup() {
  if (state.ambition < 60 || state.flags.wonA) return toast('野心還不夠，時機未到（需 60）');
  const ch = coupChance();
  openModal({
    title: '發動政變？',
    html: `<p class="story">議事堂外，弟子們屏息以待。這一步踏出去就沒有回頭路了。</p>
           <p>目前成功率約 <b style="color:var(--gold2)">${Math.round(ch * 100)}%</b>（取決於全派戰力與掌門信任）。<br>不知為何，你總覺得那個只會釣魚的老頭……沒那麼簡單。</p>`,
    buttons: [
      { label: '算了，再等等' },
      { label: '成敗在此一舉！', cls: 'danger', fn: () => { doEnding(Math.random() < ch ? 'coup' : 'coupfail'); return false; } }
    ]
  });
}
function adventure() {
  if (state.advCd > 0) return;
  if (modal) return toast('請先處理眼前的事');
  if (state.res.food < CONFIG.advFood) return toast('糧食不足，沒乾糧出不了門');
  if (!state.disciples.length) return toast('門派沒有弟子可以陪你歷練');
  state.res.food -= CONFIG.advFood; state.advCd = CONFIG.advCooldown;
  triggerEvent();
  update(true);
}
function equip(d, slot, itemId) {
  const key = slot === 'w' ? 'weapon' : 'armor';
  const old = d[key] && getItem(d[key]); if (old) old.owner = null;
  d[key] = itemId; if (itemId) getItem(itemId).owner = d.id;
}
// 一鍵裝備：重新分配所有兵器／防具，裝備由強到弱配給戰力由強到弱的弟子
function autoEquip(silent) {
  const S = state;
  if (!S.disciples.length || !S.items.length) { if (!silent) toast('沒有可分配的裝備或弟子'); return 0; }
  const order = S.disciples.slice().sort((a, b) => (b.power * (1 + dBonus(b, 'power'))) - (a.power * (1 + dBonus(a, 'power'))));
  S.items.forEach(it => { it.owner = null; });
  S.disciples.forEach(d => { d.weapon = null; d.armor = null; });
  let n = 0;
  for (const slot of ['w', 'a']) {
    const list = S.items.filter(it => it.slot === slot).sort((a, b) => b.pow - a.pow || b.r - a.r);
    list.slice(0, order.length).forEach((it, i) => { equip(order[i], slot, it.id); n++; });
  }
  if (!silent) { toast(`已重新配發 ${n} 件裝備`); Snd.play('click'); addLog(`副掌門整頓兵器庫，把好裝備優先發給了門內高手。（配發 ${n} 件）`); }
  return n;
}
function teach(d, techId) {
  const t = TECH_MAP[techId];
  if (d.arts.includes(techId)) return;
  if (d.arts.length >= CONFIG.maxArts) return toast(`每人最多學 ${CONFIG.maxArts} 門真傳功法`);
  if (d.contrib < t.req) return toast('弟子貢獻不足');
  if (!pay(t.cost)) return;
  d.arts.push(techId);
  addLog(`${d.name} 獲傳「${t.name}」真傳版！${KEY_NAME[t.key]} +${Math.round(t.adv * 100)}%`, 'good');
}
function startSeclusion(d) {
  if (d.cond || d.trip) return toast('目前狀態無法閉關');
  if (state.res.food < 30) return toast('閉關需要 30 糧食備用');
  state.res.food -= 30; d.cond = { type: 'seclusion', until: state.clock + 60 };
  addLog(`${d.name} 開始閉關 60 秒，修煉效率 ×3。`);
}
function sellItem(it) {
  if (it.owner) return;
  state.res.gold += RARITY[it.r].sell; state.items = state.items.filter(x => x !== it);
  addLog(`賣掉了 ${it.name}，換得 ${RARITY[it.r].sell} 資金。`);
}

/* ---- 事件引擎 ---- */
const fmtText = (s, ctx) => s
  .replace(/\{d\}/g, ctx && ctx.d ? ctx.d.name : '某位弟子').replace(/\{m\}/g, MASTER)
  .replace(/\{s\}/g, esc(state.sectName)).replace(/\{rm\}/g, RIVAL_MASTER).replace(/\{r\}/g, RIVAL_STAR).replace(/\{n\}/g, RIVAL)
  .replace(/\{h\}/g, ctx && ctx.h ? ctx.h : '敵對門派');
const rollRange = v => Array.isArray(v) ? Math.round(rnd(v[0], v[1])) : v;

function availableDisciples() { return state.disciples.filter(d => !d.trip && !(d.cond && d.cond.type === 'seclusion')); }
const candidates = ev => availableDisciples().filter(ev.pickD || (() => true));
function triggerEvent(opt = {}) {
  if (state.over) return;
  if (modal) { pendingEvent = true; return; }
  const pool = EVENTS.filter(e => (!opt.rival || e.rival) && (!opt.id || e.id === opt.id) && (!e.cond || e.cond()) && (!e.needD || candidates(e).length > 0));
  if (!pool.length) return;
  const ev = wpick(pool, e => e.weight);
  const c = candidates(ev);
  const ctx = { ev, d: c.length ? pick(c) : null, h: ev.hostile && hostileSects().length ? pick(hostileSects()).name : '' };
  if (state.steward && state.auto.events) {          // 事件託管：自動選擇，不跳視窗
    const i = autoChoice(ctx);
    if (i >= 0) { resolveChoice(ctx, i, true); return; }
  }
  Snd.play('click');
  showEvent(ctx);
}
function canAfford(cost) { if (!cost) return true; for (const k in cost) if (state.res[k] < cost[k]) return false; return true; }
function costText(cost) {
  if (!cost) return '';
  const nm = { gold: '資金', food: '糧食' };
  return '（-' + Object.keys(cost).map(k => cost[k] + ' ' + nm[k]).join('、') + '）';
}
function showEvent(ctx) {
  const ev = ctx.ev;
  const btns = ev.choices.map((ch, i) => {
    const ok = canAfford(ch.cost) && !(ch.needD && !ctx.d);
    return `<button class="btn" data-m="choice" data-i="${i}" ${ok ? '' : 'disabled'}>${fmtText(ch.label, ctx)}${costText(ch.cost)}${ch.hint ? `<span class="hint">${ch.hint}</span>` : ''}</button>`;
  }).join('');
  openModal({
    title: fmtText(ev.title, ctx),
    html: `<p class="story">${fmtText(ev.text, ctx)}</p><div class="choices">${btns}</div>`,
    noClose: true,
    on: { choice: el => resolveChoice(ctx, +el.dataset.i) }
  });
}
// 判定成功率：戰力比 ratio，越高「好結果」的權重越大
function successMult(ctx, ch) {
  const d = ctx.d, luck = d ? dBonus(d, 'luck') : sectBonus('luck');
  let m = 1;
  if (ch.chk && d) m = clamp(ch.chk(ctx), 0.15, 4);
  else if (ch.check && d) {
    const src = ch.diff !== undefined ? ch.diff : ctx.ev.diff;
    const diff = Math.max(1, typeof src === 'function' ? src(ctx) : (src || 150));
    m = clamp(2 * Math.pow(effPower(d) / diff, 1.5), 0.15, 4);
  }
  return m * (1 + luck);
}
function resolveChoice(ctx, i, quiet) {
  const S = state, ev = ctx.ev, ch = ev.choices[i];
  if (!canAfford(ch.cost)) return toast('資源不足');
  if (ch.cost) for (const k in ch.cost) S.res[k] -= ch.cost[k];
  const mult = successMult(ctx, ch);
  const out = wpick(ch.outcomes, o => o.w * (o.good ? mult : 1));
  S.stats.events++; qProg('event');
  if (out.end) { doEnding(out.end); return; }
  const lines = out.fx ? applyFx(out.fx, ctx) : [];
  const text = fmtText(out.text, ctx);
  addLog(`【${fmtText(ev.title, ctx)}】${quiet ? '（管事堂代為處理：' + fmtText(ch.label, ctx) + '）' : ''}${text}`, out.good ? 'good' : '');
  if (quiet) { toast(`管事堂處理了「${fmtText(ev.title, ctx)}」`); update(true); return; }
  Snd.play(out.good ? 'win' : 'click');
  const fxHtml = lines.map(l => `<div class="fxline ${l.cls}">${l.t}</div>`).join('');
  openModal({
    title: fmtText(ev.title, ctx) + '・結果',
    html: `<p class="story">${text}</p>${fxHtml ? `<div style="margin-top:8px">${fxHtml}</div>` : ''}`,
    buttons: [{ label: '知道了' }]
  });
  update(true);
}
// 套用事件效果，回傳顯示用文字列表
function applyFx(fx, ctx) {
  const S = state, d = ctx.d, out = [];
  const num = (name, v, invert) => out.push({ t: `${name} ${v >= 0 ? '+' : ''}${v}`, cls: (v >= 0) !== !!invert ? 'pos' : 'neg' });
  const info = t => out.push({ t, cls: 'neu' });
  if (fx.gold !== undefined)    { const v = rollRange(fx.gold);    S.res.gold = Math.max(0, S.res.gold + v); num('資金', v); }
  if (fx.rep !== undefined)     { const v = rollRange(fx.rep);     S.res.rep  = Math.max(0, S.res.rep + v);  num('聲望', v); }
  if (fx.food !== undefined)    { const v = rollRange(fx.food);    S.res.food = Math.max(0, S.res.food + v); num('糧食', v); }
  if (fx.trust !== undefined)   { const v = rollRange(fx.trust);   S.trust = clamp(S.trust + v, 0, 100);    num('掌門信任', v); }
  if (fx.ambition !== undefined){ const v = rollRange(fx.ambition);S.ambition = clamp(S.ambition + v, 0, 100); num('野心', v); }
  if (fx.fame !== undefined)    { const v = rollRange(fx.fame);    S.fame += v; num('天機閣印象', v); }
  if (fx.rival !== undefined)   { const v = rollRange(fx.rival);   const r = rivalSect(); if (r) r.score = Math.max(500, r.score + v); num(RIVAL + '評分', v, true); }
  if (fx.cAll !== undefined)    { const v = rollRange(fx.cAll);    S.disciples.forEach(x => x.contrib += v); num('全體弟子貢獻', v); }
  if (d) {
    if (fx.dContrib !== undefined) { const v = rollRange(fx.dContrib); d.contrib = Math.max(0, d.contrib + v); num(d.name + ' 貢獻', v); }
    if (fx.dPower !== undefined)   { const v = rollRange(fx.dPower);   d.power = Math.max(0, d.power + v);     num(d.name + ' 實力', v); }
    if (fx.dCond) { d.cond = { type: fx.dCond.type, until: S.clock + fx.dCond.dur }; info(`${d.name} 進入「${COND[fx.dCond.type].n}」狀態`); }
    if (fx.injure) {
      const dur = Math.round(fx.injure * (1 - clamp(guardOf(d), 0, 0.8)));
      d.cond = { type: 'injured', until: S.clock + dur }; out.push({ t: `${d.name} 受傷（約 ${dur} 秒後復原）`, cls: 'neg' });
    }
  }
  if (fx.item !== undefined) { const it = genItem(fx.item); info(`獲得 ${itemHTML(it)}（戰力 +${it.pow}）`); }
  if (fx.buff) { const b = fx.buff; addBuff(b.id, b.n, b.dur, b.mods, b.bad); info(`「${b.n}」持續 ${b.dur} 秒`); }
  if (fx.sickN) { const pool = S.disciples.filter(x => !x.cond && !x.trip).sort(() => Math.random() - .5).slice(0, fx.sickN);
    pool.forEach(x => { x.cond = { type: 'sick', until: S.clock + 90 }; }); if (pool.length) out.push({ t: `${pool.map(x => x.name).join('、')} 染上風寒`, cls: 'neg' }); }
  if (fx.att !== undefined && ctx.h) { const sc = S.sects.find(x => x.name === ctx.h); if (sc && S.dip[sc.id]) { const v = rollRange(fx.att); S.dip[sc.id].att = clamp(S.dip[sc.id].att + v, -100, 100); num(ctx.h + ' 態度', v); } }
  if (fx.hscore !== undefined && ctx.h) { const sc = S.sects.find(x => x.name === ctx.h); if (sc) { const v = rollRange(fx.hscore); sc.score = Math.max(500, sc.score + v); num(ctx.h + ' 評分', v, true); } }
  if (fx.recruit) {
    if (S.disciples.length >= capacity()) out.push({ t: '山門人滿為患，新人只好悻悻離去', cls: 'neg' });
    else { const nd = genDisciple(fx.recruit); S.disciples.push(nd); S.stats.recruited++; info(`${nd.name} 加入門派（${Math.floor(nd.age)}歲，${quality(nd)}，資質${nd.talent}／根骨${nd.bone}，「${TRAITS[nd.trait].n}」）`); }
  }

        dp.sel = []; let p = 0;
        for (const d of pool) { if (dp.sel.length >= 12 || (dp.sel.length >= T.min && p >= diff * 1.1)) break; dp.sel.push(d.id); p += effPower(d); }
        renderDispatch();
      },
      go: () => {
        const T = TARGETS[dp.target], members = state.disciples.filter(d => dp.sel.includes(d.id) && idle(d));
        if (members.length < T.min) return toast(`至少需要 ${T.min} 人`);
        if (startTrip('dispatch', dp.target, members, { sect: dp.target === 'feud' ? dp.sect : null })) { closeModal(); update(true); }
      }
    }
  });
  renderDispatch();
}
function renderDispatch() {
  const S = state, T = TARGETS[dp.target], diff = diffOf(T, dp.sect);
  const pool = S.disciples.filter(idle);
  const hs = hostileSects().filter(x => x.id !== 'tiequan');
  const sectSel = dp.target === 'feud' ? `<div class="jobs" style="justify-content:center">${hs.map(x => `<button class="btn small ${dp.sect === x.id ? 'on' : ''}" data-m="sect" data-id="${x.id}">${x.name}</button>`).join('')}</div>` : '';
  dp.sel = dp.sel.filter(id => pool.some(d => d.id === id));
  const members = pool.filter(d => dp.sel.includes(d.id));
  const power = members.reduce((a, d) => a + effPower(d), 0);
  const luck = members.length ? members.reduce((a, d) => a + dBonus(d, 'luck'), 0) / members.length : 0;
  const pct = weightPct(tripWeights(power / diff, luck + 0.08 * pactCount('ally')));
  const tabs = TARGET_ORDER.map(k => {
    const t = TARGETS[k], ok = !t.cond || t.cond();
    return `<button class="btn small ${dp.target === k ? 'on' : ''}" data-m="target" data-t="${k}" ${ok ? '' : 'disabled'}>${t.name}${ok ? '' : '（需' + t.lock + '）'}</button>`;
  }).join('');
  const L = T.loot, cost = T.food * members.length;
  const rows = S.disciples.slice().sort((a, b) => effPower(b) - effPower(a)).map(d => {
    const ok = idle(d), reason = d.trip ? '外出中' : d.cond ? (COND[d.cond.type] || {}).n : '';
    return `<div class="row"><div><b>${d.name}</b> <span style="color:var(--mute);font-size:12px">${REALMS[d.realm].n}・戰力 ${Math.floor(effPower(d))}${reason ? '・' + reason : ''}</span></div>
      <button class="btn small ${dp.sel.includes(d.id) ? 'on' : ''}" data-m="toggle" data-id="${d.id}" ${ok ? '' : 'disabled'}>${dp.sel.includes(d.id) ? '已選' : '出戰'}</button></div>`;
  }).join('');
  setModalBody(`<div class="tabs">${tabs}</div>${sectSel}
    <p class="rnote">${T.desc}${pactCount('ally') ? `（盟友助陣：勝率提升）` : ''}</p>
    <div class="grid2">
      <div><span>難度</span> ${fmt(diff)} 戰力</div><div><span>歷時</span> ${T.dur} 秒</div>
      <div><span>最少人數</span> ${T.min} 人</div><div><span>乾糧</span> 每人 ${T.food}（共 ${cost}）</div>
      <div><span>預計戰利品</span> 資金約 ${L.gold[0]}～${L.gold[1]}</div><div><span>弟子貢獻</span> 每人約 ${L.contrib[0]}～${L.contrib[1]}</div>
    </div>
    <div class="rankbox" style="margin:8px 0">
      <div class="ln"><span>目前出戰</span><span>${members.length} 人・戰力 ${fmt(power)}</span></div>
      <div class="ln"><span>大獲全勝 / 小有斬獲 / 鎩羽而歸</span><span>${members.length ? `${pct[0]}% / ${pct[1]}% / ${pct[2]}%` : '—'}</span></div>
    </div>
    <div class="jobs"><button class="btn small" data-m="auto">自動挑選</button><button class="btn small" data-m="last" ${S.lastDispatch ? '' : 'disabled'}>上次隊伍</button>
      <button class="btn" data-m="go" ${members.length >= T.min && S.res.food >= cost ? '' : 'disabled'}>出發</button></div>
    ${rows}`);
}
function renderTripsPanel() {
  const S = state;
  if (!S.trips.length) return '<p style="color:var(--mute);font-size:12px;margin:6px 0 0">目前沒有弟子在外。可在弟子詳情頁安排「遊歷」，或按上方「出動討伐」。</p>';
  return S.trips.map(t => {
    const s = tripSpec(t), ms = t.ids.map(id => S.disciples.find(d => d.id === id)).filter(Boolean);
    if (!s || !ms.length) return '';
    const nm = t.sect ? ((S.sects.find(x => x.id === t.sect) || {}).name || '') + '分堂' : s.name;
    const left = Math.max(0, Math.ceil(t.until - S.clock));
    return `<div class="row"><div><b>${t.kind === 'travel' ? `${ms[0].name} 遊歷${t.place}` : `${nm}（${ms.length} 人出征）`}</b>
      <small>${t.kind === 'travel' ? s.name : ms.map(d => d.name).join('、')}・剩餘 ${left} 秒</small></div></div>`;
  }).join('');
}

function blankMeta() {
  return { dao: 0, daoTotal: 0, runs: 0, perks: {}, ach: [], questDone: 0, quests: null, tutDone: false,
           settings: { sfx: true, bgm: false, vol: 0.5 }, best: { score: 0, pos: 99 } };

  try {

function daoGain() {
  const S = state;
  return Math.max(1, Math.floor(Math.sqrt(liveScore() / 400) + countRealm(3) * 0.3 + S.seasons * 0.2
    + (S.flags.wonA ? 5 : 0) + (S.flags.wonTop ? 8 : 0) + (S.flags.truth ? 10 : 0)));
}
const canReborn = () => state.seasons >= 6 || state.flags.wonA || state.flags.wonTop || !!state.over;
function doReborn() {
  const S = state, gain = daoGain();
  let heir = null;
  if (perk('heir') && S.items.length) heir = Object.assign({}, S.items.slice().sort((a, b) => b.pow - a.pow)[0], { owner: null, id: uid() });
  meta.dao += gain; meta.daoTotal += gain; meta.runs++;
  meta.best.score = Math.max(meta.best.score, Math.round(liveScore()));
  if (S.rank) meta.best.pos = Math.min(meta.best.pos, S.rank.myPos);
  saveMeta();
  try { localStorage.removeItem(CONFIG.saveKey); } catch (e) {}
  closeModal(); newState(); lastVals = {};
  if (heir) { state.items.push(heir); addLog(`傳家寶「${heir.name}」隨你一同轉世，靜靜躺在兵器庫裡。`, 'gold'); }

}

const pad2 = n => String(n).padStart(2, '0');

}

function pickTravelSpec(d) {
  const p = effPower(d); let sp = TRAVELS[0];
  for (const t of TRAVELS) if (p >= t.diff * 0.9) sp = t;

}
function runAuto(offline) {
  const S = state; if (!S.steward) return;
  const A = S.auto;
  if (A.recruit) {
    let n = 0;
    while (S.disciples.length < capacity() && S.res.gold >= recruitCost() * 2 + 100 && n < 3) { doRecruit(true); n++; }
  }
  if (A.sell && S.items.filter(i => !i.owner && i.r <= 1).length >= 6) sellIdle(1, true);
  if (A.equip) {
    const sig = S.items.length + '|' + S.disciples.length + '|' + S.items.filter(i => i.owner).length;
    if (sig !== S.autoSig) { autoEquip(true); S.autoSig = S.items.length + '|' + S.disciples.length + '|' + S.items.filter(i => i.owner).length; }
  }
  if (A.travel) {
    const max = 2 + Math.floor(S.disciples.length / 10);
    let out = S.trips.filter(t => t.kind === 'travel').length;
    const pool = S.disciples.filter(d => idle(d) && d.realm >= 1 && d.job !== 'trade').sort(() => Math.random() - 0.5);
    for (const d of pool) {
      if (out >= max) break;
      const sp = pickTravelSpec(d);
      if (S.res.food < sp.food + 60) break;
      if (startTrip('travel', sp.id, [d], { silent: true })) out++;
    }
  }
  if (A.dispatch && S.lastDispatch && !S.trips.some(t => t.kind === 'dispatch')) {
    const ld = S.lastDispatch, T = TARGETS[ld.target];
    if (T && (!T.cond || T.cond()) && (ld.target !== 'feud' || hostileSects().some(s => s.id === ld.sect))) {
      const members = S.disciples.filter(d => ld.ids.includes(d.id) && idle(d));
      const need = diffOf(T, ld.sect);
      let p = members.reduce((a, d) => a + effPower(d), 0);
      for (const d of S.disciples.filter(x => idle(x) && !members.includes(x)).sort((a, b) => effPower(b) - effPower(a))) {
        if (members.length >= T.min && p >= need) break;
        if (members.length >= 12) break;
        members.push(d); p += effPower(d);
      }
      if (members.length >= T.min && p >= need * 0.8 && S.res.food >= T.food * members.length + 40)
        startTrip('dispatch', ld.target, members, { silent: true, sect: ld.sect, keepLast: true });
    }
  }
}

function autoChoice(ctx) {
  const ev = ctx.ev; let best = -1, bestScore = -1e9;
  ev.choices.forEach((ch, i) => {
    if (!canAfford(ch.cost) || (ch.needD && !ctx.d)) return;
    let sc;
    if (ch.check || ch.chk) { const m = successMult(ctx, ch); sc = m >= 1.6 ? 10 + m : -5; }
    else sc = ch.cost ? 1 : 3;
    if (ch.outcomes.some(o => o.end)) sc -= 100;
    if (ch.outcomes.some(o => o.fx && o.fx.lose)) sc -= 4;
    if (sc > bestScore) { bestScore = sc; best = i; }
  });
  return best;
}

function svgLine(data, key, color, invert, label, fmtv) {
  const W = 300, H = 90, pts = data.map(x => x[key]);
  if (pts.length < 2) return `<div class="chart"><div class="ct">${label}</div><p class="rnote">資料累積中……</p></div>`;
  let mn = Math.min(...pts), mx = Math.max(...pts); if (mx === mn) { mx += 1; mn -= 1; }
  const xy = pts.map((v, i) => { const x = i / (pts.length - 1) * W, y = invert ? (v - mn) / (mx - mn) * H : H - (v - mn) / (mx - mn) * H; return x.toFixed(1) + ',' + y.toFixed(1); });
  const last = pts[pts.length - 1];
  return `<div class="chart"><div class="ct">${label}<b>${fmtv(last)}</b></div>
    <svg viewBox="-2 -4 ${W + 4} ${H + 8}" preserveAspectRatio="none"><polyline points="0,${H} ${xy.join(' ')} ${W},${H}" fill="${color}" fill-opacity=".12" stroke="none"/>
    <polyline points="${xy.join(' ')}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="cr"><span>${timeStr(data[0].c)}</span><span>${invert ? '最佳 ' + fmtv(mn) : '最低 ' + fmtv(mn) + '・最高 ' + fmtv(mx)}</span></div></div>`;
}

/* ---------- 音效與背景音樂（Web Audio 即時合成，無外部檔案） ---------- */
const PENTA = [261.63, 293.66, 329.63, 392.0, 440.0];   // 宮商角徵羽
const Snd = {
  ctx: null, out: null, bgmT: null, step: 0,
  init() {
    if (this.ctx) return true;
    try { const C = window.AudioContext || window.webkitAudioContext; if (!C) return false;
      this.ctx = new C(); this.out = this.ctx.createGain(); this.out.gain.value = meta.settings.vol; this.out.connect(this.ctx.destination); return true;
    } catch (e) { return false; }
  },
  // 撥弦音色：快速起音、指數衰減，模擬古箏
  pluck(f, dur = 1.2, vol = .22, when = 0, type = 'triangle') {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain(), o2 = this.ctx.createOscillator(), g2 = this.ctx.createGain();
    o.type = type; o.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2; g2.gain.value = .3;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.out); o.start(t); o2.start(t); o.stop(t + dur + .05); o2.stop(t + dur + .05);
  },
  play(name) {
    if (!meta.settings.sfx || !this.init()) return;
    const P = PENTA;
    if (name === 'click') this.pluck(P[4] * 2, .15, .08);
    else if (name === 'coin') { this.pluck(P[3] * 2, .3, .15); this.pluck(P[0] * 4, .4, .12, .07); }
    else if (name === 'level') [0, 1, 2, 3, 4].forEach((i, k) => this.pluck(P[i] * 2, .6, .14, k * .06));
    else if (name === 'ach') [0, 2, 4, 3, 4].forEach((i, k) => this.pluck(P[i] * (k > 2 ? 4 : 2), .9, .16, k * .1));
    else if (name === 'bad') { this.pluck(P[1], .6, .18, 0, 'sawtooth'); this.pluck(P[0] * .75, .8, .15, .12, 'sawtooth'); }
    else if (name === 'win') [0, 2, 3, 4].forEach((i, k) => this.pluck(P[i] * 2, .7, .16, k * .08));
  },
  setVol(v) { meta.settings.vol = v; if (this.out) this.out.gain.value = v; },
  bgmOn() {
    if (this.bgmT || !this.init()) return;
    const tick = () => {                             // 簡單的五聲音階隨機旋律＋低音
      if (!this.ctx || this.ctx.state === 'suspended') return;
      const s = this.step++;
      if (s % 8 === 0) this.pluck(PENTA[[0, 3, 4, 2][(s / 8) % 4 | 0]] / 2, 3.2, .1, 0, 'sine');
      if (Math.random() < .55) this.pluck(PENTA[rint(0, 4)] * (Math.random() < .3 ? 2 : 1), 1.6, .07);
    };
    this.bgmT = setInterval(tick, 480);
  },
  bgmOff() { clearInterval(this.bgmT); this.bgmT = null; }
};
function applyAudio() { if (meta.settings.bgm) Snd.bgmOn(); else Snd.bgmOff(); }
document.addEventListener('pointerdown', () => {      // 瀏覽器需要使用者互動後才允許播放
  if (meta.settings.sfx || meta.settings.bgm) { if (Snd.init() && Snd.ctx.state === 'suspended') Snd.ctx.resume(); applyAudio(); }
}, { once: false, passive: true });

/* ================= 12. UI：彈窗 / 提示 / 日誌 ================= */
function openModal({ title, html, buttons = [], on = {}, wide = false, noClose = false }) {
  closeModal();
  const root = $('#modal-root');
  root.innerHTML = `<div class="mask"><div class="modal ${wide ? 'wide' : ''}"><div class="mtitle">${title}</div><div class="mbody">${html}</div><div class="mfoot"></div></div></div>`;
  modal = { on, noClose, buttons };
  const mask = $('.mask', root);
  mask.addEventListener('mousedown', e => { if (e.target === mask && modal && !modal.noClose) closeModal(); });
  $('.mbody', root).addEventListener('click', e => {
    const el = e.target.closest('[data-m]'); if (!el || el.disabled) return;
    const h = modal && modal.on[el.dataset.m]; if (h) h(el);
  });
  const foot = $('.mfoot', root);
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls || ''); btn.textContent = b.label;
    btn.addEventListener('click', () => { const keep = b.fn ? b.fn() : undefined; if (keep !== false) closeModal(); });
    foot.appendChild(btn);
  });
}
function setModalBody(html) { const b = $('#modal-root .mbody'); if (b) b.innerHTML = html; }
function closeModal() { $('#modal-root').innerHTML = ''; modal = null; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal && !modal.noClose) closeModal(); });

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  $('#toast-root').appendChild(el); setTimeout(() => el.remove(), 2700);
}
function popText(target, text) {                 // 在元素上方浮出文字動畫
  if (!target || !target.getBoundingClientRect) return;
  const r = target.getBoundingClientRect(), el = document.createElement('div');
  el.className = 'float'; el.textContent = text;
  el.style.left = (r.left + r.width / 2 - 30) + 'px'; el.style.top = (r.top - 6) + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 1400);
}
function logTime(l) { return l.t || ('第' + l.day + '天'); }
function addLog(msg, cls = '') {
  const S = state, t = timeStr(S.clock);
  S.log.unshift({ t, msg, cls }); if (S.log.length > 60) S.log.length = 60;
  const box = $('#log'); if (!box) return;
  const p = document.createElement('p'); p.className = 'new';
  p.innerHTML = `<span class="t">${t}</span><span class="${cls}">${msg}</span>`;
  box.insertBefore(p, box.firstChild);
  while (box.children.length > 60) box.removeChild(box.lastChild);
}
function renderLog() {
  const box = $('#log'); box.innerHTML = '';
  state.log.forEach(l => { const p = document.createElement('p'); p.innerHTML = `<span class="t">${logTime(l)}</span><span class="${l.cls}">${l.msg}</span>`; box.appendChild(p); });
}

function bumpIf(id, val) {                            // 數值大幅變動時閃一下

    ${!m && cands.length ? `<div class="jobs">${cands.map(x => `<button class="btn small" data-m="bai" data-id="${x.id}">拜 ${x.name} 為師</button>`).join('')}</div>` : ''}
    ${aps.length ? `<div class="row"><div>徒弟：${aps.map(a => `<a class="lnk" data-m="goto" data-id="${a.id}">${a.name}</a>`).join('、')}<small>每名徒弟讓師父貢獻持續增加</small></div></div>` : ''}
    ${rels || '<div style="font-size:12px;color:var(--mute)">尚無知己或宿怨。同門相處久了自然會有交情（或恩怨）。</div>'}`;
}
const renCutoff = () => { const r = state.rank && state.rank.ren; return r && r.length ? r[r.length - 1].p : 0; };
function confirmBox(msg, yes) {
  openModal({ title: '確認', html: `<p class="story" style="text-indent:0;text-align:center">${msg}</p>`, buttons: [{ label: '取消' }, { label: '確定', cls: 'danger', fn: () => { yes(); return false; } }] });
}
function openArmory() {
  const S = state;
  const items = S.items.slice().sort((a, b) => b.r - a.r || b.pow - a.pow);
  const rows = items.map(it => {
    const owner = it.owner && S.disciples.find(d => d.id === it.owner);
    return `<div class="row"><div>${itemHTML(it)}<small>${SLOT_NAME[it.slot]}・戰力 +${it.pow}${it.guard ? `・抗傷 +${Math.round(it.guard * 100)}%` : ''}・${owner ? '裝備者：' + owner.name : '閒置'}</small></div>
      ${owner ? '' : `<button class="btn small" data-m="sell" data-id="${it.id}">出售 ${RARITY[it.r].sell}</button>`}</div>`;
  }).join('') || '<p style="color:var(--mute)">兵器庫空空如也。</p>';
  openModal({ title: '兵器庫', wide: true, html: `<div class="jobs"><button class="btn small" data-m="auto">一鍵裝備（強裝給強人）</button>${[[0, '賣掉閒置「凡」'], [1, '賣掉閒置「良」以下'], [2, '賣掉閒置「精」以下']].map(([r, t]) => `<button class="btn small" data-m="sellidle" data-r="${r}">${t}</button>`).join('')}</div>` + rows, buttons: [{ label: '關閉' }],
    on: { auto: () => { autoEquip(); update(true); openArmory(); },
      sellidle: el => { confirmBox(`確定賣掉所有閒置的「${RARITY[+el.dataset.r].n}」品以下裝備嗎？（已裝備的不會賣）`, () => { sellIdle(+el.dataset.r); update(true); openArmory(); }); }, sell: el => { const it = S.items.find(i => i.id === el.dataset.id); if (it) { sellItem(it); update(true); openArmory(); } } } });
}
function openHelp() {
  openModal({ title: '玩法說明', wide: true, buttons: [{ label: '明白了' }], html: `
    <p><b>世界：</b>架空的承平年間，江湖各派如同商號般爭名逐利。中立組織「天機閣」每季（遊戲內三個月、現實約 ${CONFIG.seasonLen} 秒）發布《天機榜》，名次決定一個門派的生死。</p>
    <p><b>天機榜：</b>門派榜排行所有門派；天榜（10 人）、地榜（12 人）不限年齡；人榜（78 人）只收三十歲以下少俠，滿三十自動除名。弟子戰力夠高就會被列入，上榜弟子每秒額外產出資金與聲望，並大幅提升門派評分。</p>
    <p><b>時間：</b>遊戲內一年約 ${CONFIG.yearLen / 60} 分鐘。弟子入門時 16~24 歲，年屆六十會告老還鄉。</p>
    <p><b>宿敵：</b>${RIVAL}掌門${RIVAL_MASTER}與天才弟子「小霸王」${RIVAL_STAR}會不斷找麻煩：踢館、挖角、抹黑、搶生意。</p>
    <p><b>弟子：</b>點擊弟子可指派職務（修煉／務農／經商／休息）、裝備兵器防具、傳授真傳功法，或讓他閉關突破。實力超過「根骨×12」後成長極慢，可靠閉關提升根骨。</p>
    <p><b>外出：</b>在弟子詳情頁可派他「遊歷」（短／中／遠，單人），主畫面「出動討伐」可挑選多名弟子剿匪或攻打${RIVAL}山下分館。外出期間弟子不產出、只耗糧；歸來時上繳戰利品（資金、聲望、偶有裝備），弟子獲得貢獻與實力，擊敗${RIVAL}還會削弱其評分。實力不足容易鎩羽而歸並受傷。</p>
    <p><b>奇遇：</b>單人遊歷成功歸來時有機率碰上奇遇（高人點撥、拾得兵器、收徒、天機閣印象等）。兵器庫可「一鍵裝備」，也能一鍵出售閒置的低品裝備。</p>
    <p><b>建築：</b>練武場提升修煉效率與人數上限；藥園產糧；藏經閣解鎖全門派被動功法。弟子貢獻足夠時，可花資金傳授該功法的「真傳版」。</p>
    <p><b>掌門：</b>信任歸零會被逐出師門；野心 ≥50 時信任會持續下滑。那個成天釣魚的老頭似乎藏著什麼……隨著門派崛起，你會逐步揭開「掌門祕聞」。</p>
    <p><b>結局：</b>共 ${ENDING_COUNT} 種。例如「正統傳位」需門派榜前 ${CONFIG.legitRank}、真傳弟子 ${CONFIG.winElite} 人、掌門信任 ≥60；「榜首之派」需登上門派榜第一。</p>
    <p><b>經營壓力：</b>弟子每秒領月錢（境界越高越貴），資金見底會發不出月錢、工作效率下降；每年年初官府收取持有資金 5% 的稅；偶爾會有大旱、山洪、瘟疫等天災。</p>
    <p><b>門派擴張：</b>開設分舵（永久增加資金與聲望）、提升山門氣象（無上限，產出與修煉 +3%/級）、舉辦大典（短時間產出 ×1.5）、鑄造神兵；建築上限提高到 20 級，藏經閣 11 級後解鎖後期功法。</p>
    <p><b>管事堂：</b>建造後可開啟自動招募、自動裝備、自動出售、自動遊歷、自動討伐、事件託管，離線時也會運作（事件除外）。</p>
    <p><b>師徒與同門：</b>內門以上弟子可收徒（最多 2 名），徒弟修煉大幅加快。同門相處久了會結為知己（互相加成）或結下宿怨（工作效率下降，可花錢調解）。</p>
    <p><b>功法組合技：</b>同一名弟子習得特定兩門真傳功法，會領悟組合技，獲得額外加成（弟子詳情頁可查看）。</p>
    <p><b>江湖外交：</b>送禮提升各派態度；友好可通商（每秒資金），莫逆可結盟（每季贈印象與聲望、討伐勝率提升）；挑釁會使對方敵視，可討伐其分堂，但對方也會上門找碴。</p>
    <p><b>成就與目標：</b>成就永久提升產出 2%／個並給予道統；每日、每週目標依現實日期刷新。</p>
    <p><b>道統傳承：</b>第 6 次放榜後或達成結局，可傳承轉世：一切重來，但獲得「道統」購買永久天賦，成就與結局圖鑑保留。</p>
    <p><b>存檔：</b>設定中可匯出／匯入存檔碼，換電腦、換瀏覽器也能繼續。</p>
    <p><b>倍速：</b>右上角可切換 1×／2×／5×，加快線上遊戲進度（收益、計時、事件都會一起加速）。離線掛機收益只看實際離開的時間，不受倍速影響。</p>
    <p><b>存檔：</b>每 ${CONFIG.autosaveSec} 秒自動存檔。關閉頁面期間以 ${Math.round(CONFIG.offlineEfficiency * 100)}% 效率累積最多 ${CONFIG.offlineCapSec / 3600} 小時的收益（江湖時間最多推進一年）。</p>`
  });
}
function openRename() {
  openModal({ title: '門派改名', html: `<input class="txt" id="renameInput" maxlength="10" value="${esc(state.sectName)}">`,
    buttons: [{ label: '取消' }, { label: '確定', fn: () => { const v = $('#renameInput').value.trim(); if (v) { state.sectName = v.slice(0, 10); update(true); saveGame(); } } }] });
  setTimeout(() => { const i = $('#renameInput'); if (i) i.select(); }, 50);
}
function openIntro() {
  if (meta.runs > 0) {
    return openModal({ title: `第 ${state.gen} 世`, wide: true, noClose: true, buttons: [{ label: '再來一次', fn: () => { state.flags.intro = true; saveGame(); } }],
      html: `<p class="story">又是一道雷。</p>
        <p class="story">你睜開眼，硬木板床、漏風的練武場、歪掉的「聽風人派」匾額——一切都和記憶中一模一樣。只是這一次，你腦子裡多了 ${meta.runs} 世的經營心得。</p>
        <p class="story">${MASTER}拎著釣竿晃進門，盯著你看了半晌，忽然笑了：「咦，你這眼神……怎麼像是已經當過一回掌門的人？」</p>
        <p class="story">不等你回答，他又哼著小曲去寒潭了。你嘆了口氣，翻開帳本——道統尚在，天賦猶存。這一世，要走得更遠。</p>` });
  }
  openModal({ title: '穿 越', wide: true, noClose: true, buttons: [{ label: '開始我的副掌門人生', fn: () => { state.flags.intro = true; saveGame(); } }],
    html: `<p class="story">一道雷劈下來，你睜開眼睛，發現自己躺在一張硬得要命的木板床上。</p>
      <p class="story">窗外是風雨飄搖的山門，一塊歪歪斜斜的黑漆匾額上，用燙金大字勉強刷著「聽風劍派」四個大字，只不過「劍」字剛好被白蟻蛀掉大半，遠看活像「聽風人派」。</p>
      <p class="story">正當你扶著額頭消化記憶時，一個穿著滿是補丁道袍、鬍子拉碴的老頭哼著小曲拎著釣竿晃了進門。見你醒來，他非但不激動，反而長舒了一口氣，一把將釣竿塞進你懷裡：</p>
      <p class="story">「哎呀，副掌門，你總算挺過來了！太好了，門派上下大大小小的事就全權交給你啦！老夫這就去後山寒潭，聽說那裡的野生草魚魚況挺好的。」</p>
      <p class="story">不等你回過神，老頭已經踏著輕功遠去，溜得比誰都快。</p>
      <p class="story">你，一個前世只會坐在隔間裡寫年度報告、KPI報表的社畜打工人，如今莫名其妙成了破落武俠門派的二把手。環顧四周，手邊除了這張硬床，就剩三個面黃肌瘦的菜鳥弟子、一座四處漏風的破練武場、一畦已經快乾死得冒煙的藥園，以及空氣中迴盪著掌門留下的那句豪邁訓話：</p>
      <p class="story">「放手去做，門派的未來就靠你了！」</p>
      <p class="story">——行吧。既然逃不掉，那就想辦法招募第一批韭菜……不，是優秀弟子開始吧。</p>` });
}
function resetGame() {
  try { localStorage.removeItem(CONFIG.saveKey); } catch (e) {}
  closeModal(); newState(); lastVals = {}; renderLog(); update(true); openIntro();
}

/* ================= 14. 事件委派、初始化與主迴圈 ================= */
const ACTIONS = {
  upgrade: el => upgrade(el.dataset.key), recruit, forge, tribute, scheme, coup, adventure,
  armory: openArmory, branch: buyBranch, aura: buyAura, fest: holdFestival, god: forgeGod, steward: buySteward,
  dip: openDiplomacy, stats: openStats, ach: openAch, quest: () => { state.tutFlags.quest = true; openQuests(); }, reborn: openReborn, idle: openIdlePrep,
  settings: openSettings, saveio: openSaveIO, mtab: el => setMobileTab(el.dataset.tab),
  tutskip: () => { state.tut = -1; meta.tutDone = true; saveMeta(); update(true); }, speed: el => setSpeed(+el.dataset.v), autoequip: () => { autoEquip(); update(true); }, dispatch: () => { if (modal) return toast('請先處理眼前的事'); openDispatch(); }, help: openHelp, rename: openRename, ranks: openRanks,
  disc: el => openDisc(el.dataset.id),
  save: () => { saveGame(); toast('已存檔'); },
  reset: () => confirmBox('確定要重置遊戲嗎？目前的進度（資源、弟子、建築、榜單）會全部清除，無法復原。', resetGame)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (fn) fn(el);
});
$('#sortSel').addEventListener('change', e => { discSort = e.target.value; update(true); });

function simulate(seconds, offline) {              // 長時間模擬（離線收益）
  const ws = offline ? Math.min(1, CONFIG.offlineWorldCap / Math.max(1, seconds)) : 1;
  const step = 5; let left = seconds; simulating = seconds > 30;
  try { while (left > 0) { const dt = Math.min(step, left); tick(dt, offline, ws); left -= dt; } } finally { simulating = false; }
}
function offlineReport(sec, before, seasonsBefore, snap) {
  const S = state;
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  const dg = Math.floor(S.res.gold - before.gold), dr = Math.floor(S.res.rep - before.rep), df = Math.floor(S.res.food - before.food);
  const sg = v => (v >= 0 ? '+' : '-') + fmt(Math.abs(v));
  const ns = S.seasons - seasonsBefore;
  openModal({ title: '歡迎回來', buttons: [{ label: '收下' }],
    html: `<p class="story" style="text-indent:0">你離開了 ${h > 0 ? h + ' 小時 ' : ''}${m} 分鐘（最多計算 ${CONFIG.offlineCapSec / 3600} 小時），弟子們繼續認真修煉，門派靜靜運轉。</p>
      <div class="fxline ${dg >= 0 ? 'pos' : 'neg'}">資金 ${sg(dg)}</div>
      <div class="fxline ${dr >= 0 ? 'pos' : 'neg'}">聲望 ${sg(dr)}</div>
      <div class="fxline ${df >= 0 ? 'pos' : 'neg'}">糧食 ${sg(df)}${S.res.food <= 0 ? '（糧倉已見底！）' : ''}</div>
      ${ns > 0 ? `<div class="fxline neu">期間天機閣放榜 ${ns} 次，門派榜目前第 ${S.rank.myPos} 名</div>` : ''}
      ${snap ? offlineExtra(snap) : ''}
      <p style="color:var(--mute);font-size:12px">離線期間不會觸發隨機事件，收益以 ${Math.round(offlineEff() * 100)}% 效率計算，江湖時間最多推進一年。外出戰報稍後逐一呈上。</p>` });
}
function offlineExtra(snap) {
  const S = state, st = S.stats, o = snap.stats, L = [];
  const dsp = sectPower() - snap.sp; if (Math.abs(dsp) >= 1) L.push([`門派總戰力 ${dsp >= 0 ? '+' : ''}${fmt(dsp)}`, dsp >= 0 ? 'pos' : 'neg']);
  if (st.promoted > o.promoted) L.push([`弟子晉升 ${st.promoted - o.promoted} 次`, 'pos']);
  if (st.recruited > o.recruited) L.push([`管事堂招募了 ${st.recruited - o.recruited} 名新弟子`, 'pos']);
  const tr = (st.travels + st.dispatches) - (o.travels + o.dispatches); if (tr > 0) L.push([`自動派出 ${tr} 趟遊歷／討伐`, 'neu']);
  const back = S.reports.length - snap.reports; if (back > 0) L.push([`${back} 支外出隊伍歸來，帶回戰利品`, 'pos']);
  if (st.enc > o.enc) L.push([`遊歷途中奇遇 ${st.enc - o.enc} 次`, 'neu']);
  const di = S.items.length - snap.items; if (di) L.push([`兵器庫 ${di > 0 ? '+' : ''}${di} 件`, 'neu']);
  if (S.disciples.length < snap.n) L.push([`有 ${snap.n - S.disciples.length} 名弟子離開了門派`, 'neg']);
  return L.map(([t, c]) => `<div class="fxline ${c}">${t}</div>`).join('');
}
let simulating = false;                            // 長時間模擬中（不播特效、不寫細碎紀錄）
function runOffline(sec) {
  const S = state, before = Object.assign({}, S.res), sb = S.seasons;
  const snap = { stats: Object.assign({}, S.stats), sp: sectPower(), items: S.items.length, n: S.disciples.length, reports: S.reports.length, realms: S.disciples.map(d => d.realm) };
  simulate(sec, true);
  update(true);
  if (sec > 60) offlineReport(sec, before, sb, snap);
  checkAch();
}

let lastTime = Date.now(), acc = 0, saveAcc = 0, achAcc = 0;
let speed = 1;                                    // 線上倍速（1/2/5）；不存檔，重新開啟一律回到 1×
function setSpeed(v) { speed = v; document.querySelectorAll('[data-act="speed"]').forEach(b => b.classList.toggle('on', +b.dataset.v === v)); }
function loop() {
  const now = Date.now();
  let dt = Math.max(0, (now - lastTime) / 1000); lastTime = now;
  if (state.over) { update(false); return; }
  if (dt > 8) { if (!modal) closeModal(); runOffline(Math.min(dt, CONFIG.offlineCapSec)); dt = 0; }   // 分頁被凍結或電腦休眠：視為離線補算
  acc += dt * speed;                               // 倍速只放大線上的遊戲時間；離線補算仍以實際離開秒數計
  while (acc >= 1) { tick(1, false); acc -= 1; saveAcc += 1; achAcc += 1; }
  if (achAcc >= 2) { achAcc = 0; checkAch(); }
  if (!modal) {
    checkEndings();
    if (!modal) checkStory();
    if (!modal && state.reports.length) showReport();
    if (!modal && pendingEvent) { pendingEvent = false; triggerEvent(); }
    if (!modal && state.flags.intro && state.rivalTimer <= 0) { state.rivalTimer = rnd(CONFIG.rivalMin, CONFIG.rivalMax); triggerEvent({ rival: true }); }
    if (!modal && state.flags.intro && state.evTimer <= 0) { state.evTimer = rnd(CONFIG.eventMin, CONFIG.eventMax); triggerEvent(); }
  }
  if (saveAcc >= CONFIG.autosaveSec) { saveAcc = 0; saveGame(); }
  update(false);
}

function init() {
  loadMeta(); ensureQuests();
  endingsCount = loadEndings().length;
  setMobileTab('center');
  buildBuildingCards();
  const loaded = loadGame();
  if (!loaded) newState();
  renderLog();
  update(true);
  if (loaded && !state.over) {                     // 離線收益
    const sec = Math.min((Date.now() - state.savedAt) / 1000, CONFIG.offlineCapSec);
    if (sec > 5) runOffline(sec);
  }
  lastTime = Date.now();
  update(true);
  if (state.over && state.ending) doEnding(state.ending);
  else if (!state.flags.intro) openIntro();
  setInterval(loop, 250);
  window.addEventListener('beforeunload', saveGame);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
}
init();
</script>
