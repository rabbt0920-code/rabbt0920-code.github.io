<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣公務員人生模擬器｜依規定辦理</title>
<style>
:root{
  --paper:#f5f0e2; --paper2:#fffdf7; --ink:#2a2723; --muted:#7b7366; --line:#dccfb4;
  --red:#b3261e; --blue:#1f4e5f; --blue2:#2d6b80; --green:#2f6b3a; --gold:#a8761c;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px rgba(70,50,15,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.65;
  background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(31,78,95,.035) 31px 32px);min-height:100vh}
.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
button{font-family:inherit;font-size:14px;cursor:pointer}
header{background:var(--blue);color:#f3ede0;border-bottom:4px double #d9c9a3}
.hd{max-width:1300px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:44px;height:44px;border:2px solid #e8d9b5;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;color:#e8d9b5}
.hd h1{margin:0;font-size:21px;letter-spacing:2px}
.hd small{display:block;opacity:.75;font-size:12px;letter-spacing:1px}
.hd .sp{flex:1}
.hbtn{background:transparent;border:1px solid #cdbb92;color:#f3ede0;padding:5px 12px;border-radius:3px}
.hbtn:hover{background:rgba(255,255,255,.1)}
.wrap{max-width:1300px;margin:auto;padding:14px;display:grid;grid-template-columns:280px 1fr 330px;gap:14px;align-items:start}
@media(max-width:1050px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--paper2);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow)}
.ph{padding:8px 12px;border-bottom:1px solid var(--line);font-weight:700;color:var(--blue);display:flex;justify-content:space-between;align-items:center;letter-spacing:1px}
.pb{padding:10px 12px}
.who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.avatar{width:46px;height:46px;border-radius:4px;background:#e9e0c9;display:grid;place-items:center;font-size:24px;border:1px solid var(--line)}
.who b{font-size:16px}
.who .sub{font-size:12px;color:var(--muted)}
.stat{margin:7px 0}
.stat .row{display:flex;justify-content:space-between;font-size:13px}
.stat .row span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:7px;background:#ebe3cf;border-radius:4px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--blue2);transition:width .4s}
.bar.st i{background:linear-gradient(90deg,#d8a13a,#b3261e)}
.bar.pg i{background:var(--green)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.date{font-size:13px;color:var(--muted)}
/* 公文卡 */
.doc{background:var(--paper2);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;padding:18px 22px 16px;border-radius:2px}
.doc:before{content:"";position:absolute;inset:6px;border:1px solid #eadfc6;pointer-events:none}
.dochead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
.dochead .org{font-size:20px;font-weight:900;letter-spacing:3px}
.meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
.tagc{display:inline-block;font-size:12px;padding:1px 8px;border:1px solid var(--red);color:var(--red);border-radius:2px;margin-right:6px;font-weight:700}
.subject{font-size:17px;font-weight:700;margin:6px 0}
.subject em{font-style:normal;color:var(--muted);font-weight:400;margin-right:4px}
.body{margin:6px 0 12px;white-space:normal}
.body .lbl{color:var(--muted);margin-right:4px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ch{text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);padding:9px 12px;border-radius:2px;transition:.15s}
.ch:hover:not(:disabled){background:#f4f8f9;transform:translateX(2px)}
.ch:disabled{opacity:.45;cursor:not-allowed}
.ch b{display:block;font-size:15px}
.ch small{color:var(--muted);font-size:12px}
.ch small.chk{color:var(--gold);font-weight:700}
.result{background:#fbf7ea;border:1px dashed var(--line);padding:10px 12px;margin-top:6px;border-radius:2px}
.ok{color:var(--green)} .ng{color:var(--red)}
.deltas{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.dl{font-size:12px;padding:1px 7px;border-radius:10px;font-weight:700;background:#eee}
.dl.up{background:#e1efe3;color:var(--green)} .dl.dn{background:#f6e1df;color:var(--red)}
.award{color:var(--green);font-weight:700;margin-top:4px} .pun{color:var(--red);font-weight:700;margin-top:4px}
.stamp{position:absolute;right:26px;bottom:18px;width:84px;height:84px;border:3px solid var(--red);color:var(--red);border-radius:50%;display:grid;place-items:center;font-weight:900;transform:rotate(-14deg);opacity:.75;font-size:15px;text-align:center;line-height:1.2;pointer-events:none}
.btnp{background:var(--blue);color:#fff;border:none;padding:9px 18px;border-radius:3px;font-weight:700;letter-spacing:1px}
.btnp:hover{background:var(--blue2)}
.btnp:disabled{opacity:.4;cursor:not-allowed}
.btnr{background:var(--red);color:#fff;border:none;padding:9px 18px;border-radius:3px;font-weight:700}
.btns{background:#fff;border:1px solid var(--line);padding:6px 10px;border-radius:3px}
.btns:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.btns:disabled{opacity:.4;cursor:not-allowed}
/* 行動區 */
.acts{margin-top:14px}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:640px){.agrid{grid-template-columns:repeat(2,1fr)}}
.act{background:#fff;border:1px solid var(--line);border-top:3px solid var(--blue);padding:10px;border-radius:2px;text-align:left}
.act:hover:not(:disabled){background:#f4f8f9}
.act:disabled{opacity:.4;cursor:not-allowed}
.act b{display:block;font-size:15px} .act small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.slot{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dotted var(--line)}
.slot .nm{flex:1} .slot .nm small{display:block;color:var(--muted);font-size:12px}
.slot .cnt{width:26px;text-align:center;font-weight:900;font-size:17px}
.pill{display:inline-block;width:18px;height:10px;border-radius:2px;background:#e3d9c1;margin-right:2px}
.pill.on{background:var(--blue2)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:none;padding:9px 4px;color:var(--muted);font-weight:700;border-bottom:3px solid transparent}
.tab.on{color:var(--blue);border-color:var(--blue)}
.log{max-height:560px;overflow:auto;font-size:13px}
.log div{padding:5px 2px;border-bottom:1px dotted var(--line)}
.log .d{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px;font-size:12px}
.log .good{color:var(--green)} .log .bad{color:var(--red)} .log .key{color:var(--blue);font-weight:700}
.sec{margin-bottom:14px}
.sec h4{margin:0 0 6px;font-size:14px;color:var(--blue);border-left:3px solid var(--blue);padding-left:6px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.note{font-size:12px;color:var(--muted)}
table.rec{width:100%;border-collapse:collapse;font-size:13px}
table.rec td,table.rec th{border-bottom:1px solid var(--line);padding:4px;text-align:center}
.gA{color:var(--green);font-weight:900}.gB{color:var(--gold);font-weight:900}.gC{color:var(--red);font-weight:900}
/* 開始畫面 */
.start{max-width:760px;margin:30px auto;padding:0 14px}
.start .doc{padding:26px 30px}
.field{margin:12px 0}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field input,.field select{font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:3px;width:100%;background:#fff;font-family:inherit}
.roll{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0}
.roll div{background:#fff;border:1px solid var(--line);text-align:center;padding:8px 4px;border-radius:3px}
.roll b{display:block;font-size:22px;color:var(--blue)}
.roll span{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(30,25,15,.5);display:none;place-items:center;z-index:9;padding:14px}
.modal.on{display:grid}
.modal .doc{max-width:640px;width:100%;max-height:88vh;overflow:auto}
.end-title{font-size:30px;font-weight:900;letter-spacing:3px;margin:8px 0;color:var(--red)}
.big-ico{font-size:56px}
.salary{font-size:12px;background:#f7f2e4;padding:6px 8px;border-radius:3px;margin-top:6px}
.salary div{display:flex;justify-content:space-between}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:4px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:10}
.toast.on{opacity:.92}
.autotag{font-size:12px;opacity:.75}
div.tp{border-left:3px solid var(--red);padding:6px 10px;margin:8px 0;background:#fffdf7;font-size:14px;line-height:1.6}div.tp .tpa{color:var(--muted)}ol.prefbox{max-height:340px;overflow:auto;padding-right:2px}ol.pref .pname{flex:1;min-width:0}ol.pref{padding-left:0;list-style:none;margin:8px 0}ol.pref li{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);background:#fff;margin-bottom:4px;border-radius:3px;flex-wrap:wrap}
.pbtns{margin-left:auto;display:flex;gap:4px}
.yr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}.yr div{background:#fff;border:1px solid var(--line);border-radius:3px;text-align:center;padding:6px}.yr b{display:block;font-size:18px;color:var(--blue)}.yr span{font-size:12px;color:var(--muted)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.charts{grid-template-columns:1fr}}
.chart{background:#fff;border:1px solid var(--line);border-radius:3px;padding:6px 8px}.ctitle{font-weight:700;font-size:13px;color:var(--ink)}
.chart .pt:hover circle:first-child{r:5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;background:#fff;border:none;padding:7px 4px;border-right:1px solid var(--line)}.seg button:last-child{border-right:none}
.seg button.on{background:var(--blue);color:#fff;font-weight:700}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 8px}@media(max-width:640px){.picks{grid-template-columns:1fr}}
.pickc{background:#fff;border:2px solid var(--line);border-radius:4px;padding:8px 10px;text-align:left;transition:.15s}
.pickc:hover{border-color:var(--blue2)}.pickc.on{border-color:var(--red);box-shadow:0 0 0 3px rgba(179,38,30,.12);background:#fffaf5}
.ptitle{font-weight:900;margin-bottom:4px;color:var(--blue)}
.prow{display:flex;align-items:center;gap:6px;font-size:13px;margin:2px 0}.prow span{width:30px;color:var(--muted)}.prow b{width:26px;text-align:right}
.pbar{flex:1;height:6px;background:#ebe3cf;border-radius:3px;overflow:hidden;display:block}.pbar i{display:block;height:100%;background:var(--blue2)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.gi{background:#fff;border:1px solid var(--line);border-radius:3px;text-align:center;padding:6px;font-size:22px}.gi span{display:block;font-size:11px;color:var(--ink);line-height:1.3}
.gi.lock{opacity:.45}
.slotrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line);flex-wrap:wrap}
.slabel{width:76px;font-weight:700;color:var(--blue)}.sinfo{flex:1;min-width:200px;font-size:13px}.sbtn{display:flex;gap:4px}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="logo serif">公</div>
    <div><h1 class="serif">台灣公務員人生模擬器</h1><small>人生模擬器系列｜本遊戲純屬虛構，如有雷同，依規定辦理</small></div>
    <div class="sp"></div>
    <span id="autoTag" class="autotag"></span>
    <button class="hbtn" onclick="openTut()">🧭 新手引導</button>
    <button class="hbtn" onclick="openCharts()">📈 人生曲線</button>
    <button class="hbtn" onclick="openAch()">🏆 成就</button>
    <button class="hbtn" onclick="openSaves()">💾 存檔管理</button>
    <button class="hbtn" onclick="openHelp()">📜 辦法說明</button>
    <button class="hbtn" onclick="restart()">🗂 重新簽辦</button>
  </div>
</header>
<div id="app"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="doc" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================== 基本工具 ================== */
const SAVE_KEY='tw-civil-servant-sim-v2';
const $=s=>document.querySelector(s);
const rnd=Math.random;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ri=(a,b)=>Math.floor(a+rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const wan=n=>(n<0?'-':'')+(Math.abs(n)/10000).toFixed(Math.abs(n)>=1e6?0:1)+'萬';
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800);}

const ATTR={int:'智力',sta:'體力',stress:'壓力',eq:'情商',luck:'官運'};
const CAT={rep:'民代關說',audit:'廉政採購',fest:'大型活動',boss:'長官民眾',life:'生活',prep:'備考日常',office:'辦公室日常'};

/* ================== 資料表 ================== */
// 職務階梯：lo~hi 為職務列等（同一職務列等範圍內可「考績升等」，超出需陞任新職務）；sup＝主管職務加給比例
const UNITS=[
 {id:'metro',name:'直轄市區公所',desc:'洽公民眾川流不息，里長與議員的電話永遠不會停。',load:60,ot:0.7,rent:14000,house:15000000,w:{rep:1.6,boss:1.3,fest:1,audit:0.8},
  ladder:[{t:'課員',lo:6,hi:7},{t:'課長',lo:7,hi:8,sup:1},{t:'主任秘書',lo:8,hi:9,sup:1},{t:'區長',lo:9,hi:10,sup:1}]},
 {id:'remote',name:'偏遠鄉鎮公所',desc:'業務量不大但一人分飾三角，鄉長選舉年氣氛詭譎。另支地域加給。',load:40,ot:0.4,rent:6000,house:6500000,remote:true,w:{rep:1.4,boss:0.8,fest:1.3,audit:0.8},
  ladder:[{t:'課員',lo:6,hi:7},{t:'課長',lo:7,hi:8,sup:1},{t:'秘書',lo:8,hi:8},{t:'主任秘書',lo:9,hi:9,sup:1}]},
 {id:'central',name:'中央部會',desc:'立法院質詢、跨部會協調、深夜的院會資料，加班是日常。',load:85,ot:0.5,rent:18000,house:22000000,w:{rep:1,boss:1.4,fest:0.6,audit:1.5},
  ladder:[{t:'科員',lo:6,hi:7},{t:'專員',lo:7,hi:8},{t:'科長',lo:9,hi:9,sup:1},{t:'專門委員',lo:10,hi:10,sup:0.5},{t:'副司長',lo:11,hi:11,sup:1},{t:'司長',lo:12,hi:12,sup:1},{t:'所屬機關署長',lo:13,hi:13,sup:1},{t:'常務次長',lo:14,hi:14,sup:1}]},
 {id:'county',name:'縣市政府局處',desc:'首長的政見都要在你手上落地，節慶活動一檔接一檔。（局處首長多為政務職）',load:72,ot:0.6,rent:11000,house:11000000,w:{rep:1.2,boss:1.1,fest:1.7,audit:1},
  ladder:[{t:'科員',lo:6,hi:7},{t:'專員',lo:7,hi:8},{t:'科長',lo:8,hi:9,sup:1},{t:'專門委員',lo:10,hi:10,sup:0.5},{t:'副局長',lo:11,hi:11,sup:1}]},
 {id:'agency',name:'中央三級機關（署、局）',desc:'第一線執行中央政策，民眾陳情與立委關切一樣不少。',load:65,ot:0.8,rent:13000,house:13000000,w:{rep:1,boss:1.1,fest:0.7,audit:1.3},
  ladder:[{t:'科員',lo:6,hi:7},{t:'專員',lo:7,hi:8},{t:'科長',lo:9,hi:9,sup:1},{t:'副組長',lo:10,hi:10,sup:1},{t:'組長',lo:11,hi:11,sup:1},{t:'副署長',lo:12,hi:12,sup:1},{t:'署長',lo:13,hi:13,sup:1}]},
];
const ENTRY={t:'辦事員',lo:3,hi:5}; // 普考：委任第三職等起
function ladder(u){return [ENTRY,...(u||S.job.unit).ladder];}
function unitMax(u){const L=u.ladder;return L[L.length-1].hi;}

/* ---- 具體機關名單（熱門常見者；機關為遊戲化簡，名額與熱度為遊戲設定）----
   u:所屬類別  pop:熱門程度  q:類別內名額權重  b:各職系名額加權  only:限定職系（一般行政不受限）
   ren:職稱改名（局、關）  rent/house/load/ot/w:覆寫類別預設值 */
const ORGS=[
 {id:'xinyi',u:'metro',name:'臺北市信義區公所',pop:1.8,rent:20000,house:24000000,desc:'台北市的精華區，里長活動、社區營造與跨年晚會的人潮，都在你的轄區。'},
 {id:'banqiao',u:'metro',name:'新北市板橋區公所',pop:1.5,rent:14000,house:17000000,desc:'新北市政府所在地，人口稠密，洽公民眾與里長服務同樣爆量。'},
 {id:'xitun',u:'metro',name:'臺中市西屯區公所',pop:1.3,rent:12000,house:14500000,desc:'人口成長最快的行政區之一，建商、社區管委會與里長都很有想法。'},
 {id:'fengshan',u:'metro',name:'高雄市鳳山區公所',pop:1.0,rent:9000,house:9500000,desc:'老牌大區，生活機能好、房價還算友善，但敬老福利與陳情案件不少。'},
 {id:'xiulin',u:'remote',name:'花蓮縣秀林鄉公所',pop:0.4,load:42,desc:'幅員遼闊、山海環繞，颱風與地震後的災情通報全靠你。另支地域加給。'},
 {id:'lanyu',u:'remote',name:'臺東縣蘭嶼鄉公所',pop:0.3,load:38,rent:5500,house:5500000,desc:'離島生活，補給船決定你的伙食。班機不開、船不來時，整個辦公室一起看海。另支地域加給。'},
 {id:'renai',u:'remote',name:'南投縣仁愛鄉公所',pop:0.35,desc:'高山部落、原住民族事務與觀光民宿並重，每次颱風都要確認道路有沒有斷。另支地域加給。'},
 {id:'moi',u:'central',name:'內政部',pop:1.6,desc:'戶政、地政、營建、警政與移民的上級機關，業務橫跨民眾生活的每一件事。'},
 {id:'mof',u:'central',name:'財政部',pop:1.5,b:{tax:3},desc:'賦稅、關務、國有財產與公股銀行的主管機關，稅制修法時全部門動員。'},

const MEM={}; let STORE_OK=true, LAST_AUTO=null;
function sget(k){try{return localStorage.getItem(k);}catch(e){STORE_OK=false;return MEM[k]??null;}}
function sset(k,v){try{localStorage.setItem(k,v);}catch(e){STORE_OK=false;MEM[k]=v;}}

const AUTO_KEY=SAVE_KEY+'-auto', slotKey=i=>SAVE_KEY+'-slot'+i, END_KEY='tw-civil-servant-endings';

function save(){if(!S||Q.length)return;achCheck();writeSlot(AUTO_KEY);LAST_AUTO=new Date();const e=$('#autoTag');if(e)e.textContent=`✔ 已自動存檔 ${LAST_AUTO.toTimeString().slice(0,5)}`;}
function loadSave(){const o=readSlot(AUTO_KEY);return o?o.S:null;}
function clearSave(){sdel(AUTO_KEY);}
function slotSummary(o){
  if(!o) return '<span class="note">（空白）</span>';
  const s=o.S, roc=2027+Math.floor(s.m/12)-1911, mo=s.m%12+1, age=Math.floor(22+s.m/12);

}

function mod(d,raw){
  const out=[];
  for(const k in d){
    let v=d[k]; if(!v) continue;
    if(k==='money'){S.money+=v;out.push(`<span class="dl ${v>0?'up':'dn'}">存款${v>0?'+':''}${wan(v)}</span>`);continue;}
    if(k==='perf'){if(S.job){S.job.perf+=v;out.push(`<span class="dl ${v>0?'up':'dn'}">年度表現${v>0?'+':''}${Math.round(v*10)/10}</span>`);}continue;}
    if(k==='boss'||k==='mates'||k==='mate'){if(S.job)out.push(relMod(k,v));continue;}
    if(k==='progress'){S.prep.progress=clamp(S.prep.progress+v,0,150);out.push(`<span class="dl ${v>0?'up':'dn'}">備考進度${v>0?'+':''}${Math.round(v)}</span>`);continue;}
    if(k==='stress'&&v>0&&!raw) v*=resil();
    const b=S[k]; S[k]=clamp(S[k]+v,0,100); const r=S[k]-b;
    if(Math.abs(r)<0.05) continue;
    const good=k==='stress'?r<0:r>0;
    out.push(`<span class="dl ${good?'up':'dn'}">${ATTR[k]}${r>0?'+':''}${Math.round(r*10)/10}${k==='stress'?'%':''}</span>`);
  }
  return out.length?`<div class="deltas">${out.join('')}</div>`:'';
}

function recTP(c,ch,p,okf){
  const j=S.job;if(!j)return;
  const dp=j.perf-p.p,ds=S.stress-p.s,dm=S.money-p.m,dc=j.totalC-p.c,dd=j.totalD-p.d,db=rel().boss-p.b;
  const sc=Math.abs(dp)*1.2+Math.abs(ds)/2+Math.abs(dm)/25000+dc*7+dd*9+Math.abs(db)*0.7;
  if(sc<12)return;
  const parts=[];
  if(dc>0)parts.push(`獎勵折計+${dc}`);
  if(dd>0)parts.push(`懲處折計+${dd}`);
  if(Math.abs(dp)>=2)parts.push(`年度表現${dp>0?'+':''}${Math.round(dp)}`);
  if(Math.abs(db)>=3)parts.push(`長官好感${db>0?'+':''}${Math.round(db)}`);
  if(Math.abs(dm)>=20000)parts.push(`存款${dm>0?'+':'−'}${wan(Math.abs(dm))}`);
  if(Math.abs(ds)>=6)parts.push(`壓力${ds>0?'+':''}${Math.round(ds)}%`);
  const tp=S.tp||(S.tp=[]);
  tp.push({y:ROC(),a:AGE(),t:c.title,p:ch.t,ok:okf,s:parts.join('、'),sc:Math.round(sc),c:dc>0,d:dd>0,b:Math.round(db),m:Math.round(dm),mo:j.months});
  if(tp.length>50){tp.sort((a,b)=>b.sc-a.sc);tp.length=40;tp.sort((a,b)=>a.mo-b.mo);}
}
function pickTP(){
  const tp=(S.tp||[]).slice().sort((a,b)=>b.sc-a.sc),out=[];
  for(const t of tp){if(out.every(o=>Math.abs(o.mo-t.mo)>=24))out.push(t);if(out.length>=3)break;}
  for(const t of tp){if(out.length>=3)break;if(!out.includes(t))out.push(t);}
  return out.sort((a,b)=>a.mo-b.mo);
}
function tpAfter(t){
  if(t.d)return '這筆懲處記錄後來跟了你好幾年，每次考績和升遷評比，都有人翻出來看。';

  if(t.b<=-8)return '長官對你的看法明顯變了，之後的每一次簽辦，你都多花了一分心力。';
  if(t.m>=100000)return '這筆錢讓你的生活寬裕了一陣子，也讓你多了些選擇。';
  if(t.m<=-100000)return '荷包大失血，你也因此更謹慎地看待之後的每個決定。';
  return '這個選擇悄悄改變了你之後的工作節奏與人際。';
}

function pos(){return ladder()[S.job.pos];}
function basePay(){const j=S.job;return up10(PT[ptOf(j.grade,j.lv)]*mul());}           // 本（年功）俸額
function proPay(){return up10((PRO114[S.job.grade]+2000)*mul()*(TRACKS[S.track||'general'].pro));}                       // 專業加給
function supPay(){const s=pos().sup||0;return s?up10((SUP114[S.job.grade]+2000)*mul()*s):0;} // 主管職務加給
function regionPay(){const j=S.job;if(!j.unit.remote)return 0;return Math.round(3090+basePay()*0.02*Math.min(Math.floor(j.unitMonths/12),5));} // 地域加給（偏遠第一級）
function grossPay(){return basePay()+proPay()+supPay();}  // 俸給總額（考績獎金、年終獎金、加班費基準）
function isSup(){return (pos().sup||0)>0;}
function deductions(){
  const b=basePay(),g=grossPay(),r=regionPay();
  const pension=Math.round(Math.round(b*2*0.15)*0.35); // 退撫儲金：俸額×2×15%，自繳35%
  const gov=Math.round(b*0.1633*0.35);                   // 公保（個人專戶制適用費率16.33%），自付35%
  const dep=Math.min(S.life.kids+(S.life.married&&!S.life.spouse?1:0),3);
  const nhi=Math.round((g+r)*0.0517*0.3*(1+dep));        // 健保 5.17%×30%×(本人+眷屬，最多3口)
  return {b,pro:proPay(),sup:supPay(),r,g:g+r,pension,gov,nhi,net:g+r-pension-gov-nhi};
}
function rank(){const g=S.job.grade;return g<=5?'委任':g<=9?'薦任':'簡任';}
function title(){let t=pos().t;if(S.track&&TRACKS[S.track].tech){t=t.replace('辦事員','技佐').replace(/^(科員|課員)$/,'技士').replace(/^專員$/,'技正');}return t;}
function netWorth(){const l=S.life;return S.money+l.stockUnits*l.stockPrice+(l.house?l.house.value-l.house.loan:0);}

function choose(i){
  const c=Q[0],ch=c.choices[i]; if(c.result) return;
  if(S.yr&&S.job) S.yr.ev++;
  const pre=S.job&&(c.ev||c.arc)?{p:S.job.perf,s:S.stress,m:S.money,c:S.job.totalC,d:S.job.totalD,b:rel().boss}:null;
  let r,okf=null;
  if(ch.check){const ok=rnd()<chance(ch.check[0],ch.check[1]);okf=ok;r=(ok?'<b class="ok">【判定成功】</b>':'<b class="ng">【判定失敗】</b>')+(ok?ch.ok():ch.fail());}
  else r=ch.fn();
  if(S.phase==='end') return;
  c.result=r||'已簽辦。'; c.picked=ch.t;
  if(pre) recTP(c,ch,pre,okf);
  render();
}

/* ================== 生活月結（共用） ================== */
function lifeMonth(){
  const l=S.life,u=S.job.unit;
  let living=15000+(l.married?10000:0)+l.kids*12000, inc=l.married?l.spouse:0, rent=0, mort=0, care=l.parent==='care'?(l.careCost||0):0;
  if(!l.house) rent=u.rent;
  if(l.house&&l.house.loan>0){const h=l.house,ir=0.022/12,int=h.loan*ir;mort=Math.min(h.pay,h.loan+int);h.loan=Math.max(0,h.loan-(mort-int));}
  if(l.house) l.house.value*=1+0.0022+gauss()*0.008;
  S.money+=inc-living-rent-mort-care;
  const ret=0.006+gauss()*0.05+(rnd()<0.01?-0.2:0);l.stockPrice=Math.max(5,l.stockPrice*(1+ret));
  const age=AGE();mod({sta:age>=50?-0.25:age>=40?-0.12:0},true);
  mod({stress:(l.married?-1:0)+l.kids*0.8+(l.house?-0.5:0)+(S.money<0?3:0)+(care?1.5:0)},true);
  if(!S.job.stop||S.job.stop.type==='借調'){const r=rel(),al=r.mates.filter(m=>m.f>=70).length;mod({stress:-al*0.8+(r.boss>=70?-1:r.boss<=25?2:0)},true);}
  return {living,inc,rent,mort,care};
}
function econLines(e){return `${e.inc?`<div><span>配偶收入</span><span>+${fmt(e.inc).slice(1)}</span></div>`:''}
    <div><span>生活開銷</span><span>-${fmt(e.living).slice(1)}</span></div>
    ${e.rent?`<div><span>房租</span><span>-${fmt(e.rent).slice(1)}</span></div>`:''}
    ${e.mort?`<div><span>房貸</span><span>-${fmt(Math.round(e.mort)).slice(1)}</span></div>`:''}
    ${e.care?`<div><span>長輩照護費</span><span>-${fmt(e.care).slice(1)}</span></div>`:''}`;}

/* ================== 事件擴充：精簡格式 ==================
   E({cat,st,tr,t,b,cond,w}, ...choices)
   choice（無判定）: [選項文字, 結果文字, 效果]
   choice（有判定）: [選項文字, [屬性,難度], 成功文字, 成功效果, 失敗文字, 失敗效果]
   效果可含 mod 的鍵（int/sta/stress/eq/luck/money/perf/boss/mates/mate）以及：
     c:嘉獎記功折計次數  d:懲處折計次數  risk:[機率,文字,懲處次數]  go:函式（推進劇情等） */
const F=()=>S.flags||(S.flags={});
function mkC(c,title){
  const run=(txt,fx)=>()=>{const f={...(fx||{})};let x=txt;const cm=f.c,dm=f.d,rk=f.risk,go=f.go;delete f.c;delete f.d;delete f.risk;delete f.go;
    x+=mod(f);if(cm)x+=commend(cm,title);if(dm)x+=demerit(dm,title);if(rk&&rnd()<rk[0])x+='<br>'+rk[1]+demerit(rk[2],title);if(go)go();return x;};
  const [t,a,b,cc,d,e]=c;
  if(Array.isArray(a)) return {t,check:a,ok:run(b,cc),fail:run(d,e)};
  if(a===null) return {t,fn:run(b,cc)}; // [文字, null, 結果, 效果]
  return {t,fn:run(a,b)};
}
function E(o,...cs){EV.push({cat:o.cat,stage:o.st,track:o.tr,org:o.org,uc:o.uc,title:o.t,w:o.w,cond:o.cond,body:typeof o.b==='function'?o.b:()=>o.b,choices:cs.map(c=>mkC(c,o.t))});}
function stage(){const j=S.job;if(isSup()||j.grade>=9)return 'lead';if(j.grade>=7||j.months>=60)return 'mid';return 'new';}

/* ---------- 同事故事線：每位同事各有三段小故事 ---------- */
const MF=(T,v)=>()=>{const m=mateOf(T);if(m)m.f=clamp(m.f+v,0,100);};
function CE(T,step,gap,t,body,...cs){
  E({cat:'office',t,w:2.2,cond:()=>{const m=mateOf(T);return !!m&&(m.st||0)===step&&S.job.months>=6&&S.job.months-(m.last||0)>=gap&&!S.job.stop;},b:()=>body.replace(/\$N/g,mateOf(T).n)},...cs);
  EV[EV.length-1].choices.forEach(ch=>{
    ['fn','ok','fail'].forEach(k=>{if(ch[k]){const f=ch[k];ch[k]=()=>{let r=f();const m=mateOf(T);if(m){m.st=(m.st||0)+1;m.last=S.job.months;if(typeof r==='string')r=r.replace(/\$N/g,m.n);}return r;};}});
  });
}

const ARCS={};
function arcStart(id){S.arcs=S.arcs||{};S.arcs[id]={step:1,due:S.m+1+ri(0,1),d:{}};log(`📁 開啟劇情線「${ARCS[id].n}」`,'key');}
function arcNext(id,delay){const a=S.arcs[id];a.step++;a.due=S.m+(delay||1);}
function arcEnd(id,good){delete S.arcs[id];S.arcDone=S.arcDone||{};S.arcDone[id]=good?'good':'done';log(`📁 劇情線「${ARCS[id].n}」結案${good?'（圓滿落幕）':''}`,good?'good':'key');}
function arcDue(){if(!S.arcs)return null;for(const k in S.arcs){if(S.arcs[k].due<=S.m)return k;}return null;}
function arcD(id){return S.arcs[id].d;}
function pushArc(k){const a=S.arcs[k],c=ARCS[k].steps[a.step](a.d);pushCard({arc:1,tag:`劇情・${ARCS[k].n}（${a.step+1}/${ARCS[k].steps.length}）`,title:c.t,body:c.b,choices:c.c.map(x=>mkC(x,c.t))});}
const arcCond=id=>()=>!(S.arcs&&S.arcs[id])&&!(S.arcDone&&S.arcDone[id])&&!S.job.stop;
function A(id,n,start,steps){ARCS[id]={n,steps:[null,...steps]};
  const wrap=fx=>{const f={...(fx||{})};const g=f.go;f.go=()=>{arcStart(id);if(g)g();};return f;};
  E({...start,cond:start.cond?()=>arcCond(id)()&&start.cond():arcCond(id),w:1.4},...start.c.map(x=>Array.isArray(x[1])?[x[0],x[1],x[2],wrap(x[3]),x[4],wrap(x[5])]:x[1]===null?[x[0],null,x[2],wrap(x[3])]:[x[0],x[1],wrap(x[2])]));}

const ABCD='ABCD';
function startExam(){
  const pool=[...QUIZ].sort(()=>rnd()-0.5).slice(0,3);
  S.quiz={ok:0};
  pool.forEach((qq,i)=>pushCard({tag:'國家考試・法學知識與英文',title:`第 ${i+1} 題（${qq.s}試題）`,body:qq.q+'<br><span class="note">答對每題可提高錄取機率 5%，三題全對再加 3%。</span>',
    choices:qq.o.map((o,k)=>({t:`(${ABCD[k]}) ${o}`,fn:()=>{const ok=k===qq.a;if(ok)S.quiz.ok++;return (ok?'<b class="ok">✔ 答對了！</b>':'<b class="ng">✘ 答錯了。</b>')+`正解為 <b>(${ABCD[qq.a]}) ${qq.o[qq.a]}</b>。<br><span class="note">資料來源：考選部${qq.s}「法學知識與英文」試題</span>`;}}))}));
  Q.push({fn:examCard});
}
function quizBonus(){const n=(S.quiz&&S.quiz.ok)||0;return n*0.05+(n===3?0.03:0);}

const POP={metro:1.5,central:1.4,agency:1.2,county:1,remote:0.35};
function examQuota(){const base={general:420,tax:260,social:180,civil:200,it:120,land:150,env:90}[S.track||'general']||200;return Math.round(base*(S.prep.target==='普考'?1.25:1)*(0.85+rnd()*0.3));}
function orgQuota(N){const els=eligibleOrgs();let tot=0;els.forEach(o=>tot+=orgW(o));const q={};els.forEach(o=>q[o.id]=Math.max(1,Math.ceil(N*orgW(o)/tot)));return q;}
const heat=p=>p>=1.6?'🔥🔥🔥':p>=1.2?'🔥🔥':p>=0.8?'🔥':'❄️';
function pushPref(){
  const N=S.flags.N,rk=S.flags.rank,els=eligibleOrgs(),q0=orgQuota(N);
  if(!S.pref||S.pref.length!==els.length||S.pref.some(id=>!q0[id])) S.pref=els.map(o=>o.id).sort((a,b)=>ORGMAP[b].pop-ORGMAP[a].pop);
  pushCard({tag:'分發',title:'填寫分配志願',body:`你的錄取名次：<b>第 ${rk} 名</b>／本類科錄取 ${N} 名。<br>保訓會將<b>依考試成績名次及志願順序</b>分配實務訓練機關：名次在前的人先選，熱門機關名額可能在輪到你之前就被選完。<br><span class="note">共 ${els.length} 個機關可填（${TR().n}${S.track&&S.track!=='general'?'只能填業務相關機關':'可填全部機關'}）。用 ▲▼ 或「置頂」調整順序，確認後送出。名額與熱度為遊戲設定。</span>`,
    custom:()=>`<ol class="pref prefbox">${S.pref.map((id,i)=>{const o=ORGMAP[id];return `<li><b>第${i+1}志願</b><span class="pname">${o.name}<span class="note">　${CATN[o.u]}・${heat(o.pop)}・名額 ${q0[id]}</span></span><span class="pbtns"><button class="btns" ${i?'':'disabled'} onclick="movePref(${i},'top')">置頂</button><button class="btns" ${i?'':'disabled'} onclick="movePref(${i},-1)">▲</button><button class="btns" ${i<S.pref.length-1?'':'disabled'} onclick="movePref(${i},1)">▼</button></span></li>`;}).join('')}</ol>`,
    choices:[{t:'確認送出志願',fn:()=>{const r=allocate(rk,N),o=ORGMAP[r.got];S.flags.prefIdx=r.idx;Q.push({fn:()=>startCareer(r.got,r)});
      const rows=S.pref.slice(0,Math.min(Math.max(r.idx+1,3),8));
      return `分配結果出爐：你被分配到 <b>${r.idx>=0?`第 ${r.idx+1} 志願「`:'「'}${o.name}」</b>。${r.idx===0?'🎉 恭喜上第一志願！':r.idx>=0?'雖然不是第一志願，但也是一段緣分。':'你填的志願全數額滿，由保訓會依缺額調劑分配。'}<div class="salary">${rows.map((id,i)=>`<div><span>第${i+1}志願 ${ORGMAP[id].name}</span><span>名額 ${r.quota0[id]}，輪到你時剩 ${r.left[id]}</span></div>`).join('')}${r.idx>=rows.length?`<div><span>第${r.idx+1}志願 ${o.name}</span><span>名額 ${r.quota0[r.got]}，輪到你時剩 ${r.left[r.got]}</span></div>`:''}</div>`;}}]});
}
function movePref(i,d){const p=S.pref;if(d==='top'){if(i>0)p.unshift(p.splice(i,1)[0]);render();return;}const j=i+d;if(j<0||j>=p.length)return;[p[i],p[j]]=[p[j],p[i]];render();}
function allocate(rank,N){
  const els=eligibleOrgs(),quota=orgQuota(N),quota0={...quota};
  for(let i=1;i<rank;i++){const av=els.filter(o=>quota[o.id]>0);if(!av.length)break;const w=av.map(o=>o.pop*o.pop*(0.7+rnd()*0.6));let t=rnd()*w.reduce((a,b)=>a+b,0),k=0;for(;k<av.length-1;k++){t-=w[k];if(t<=0)break;}quota[av[k].id]--;}
  let got=S.pref.find(id=>quota[id]>0),idx=got?S.pref.indexOf(got):-1;
  if(!got){const av=els.filter(o=>quota[o.id]>0);got=(av.length?pick(av):pick(els)).id;}
  return {got,idx,quota0,left:{...quota}};
}

function lineChart(title,pts,unit,opt={}){
  if(pts.length<2) return `<div class="chart"><div class="ctitle">${title}</div><div class="note">資料累積中（每年 12 月記錄一次）</div></div>`;
  const W=300,H=130,L=34,R=8,T=10,B=22;
  let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));if(opt.min!==undefined)mn=Math.min(mn,opt.min);if(opt.max!==undefined)mx=Math.max(mx,opt.max);if(mx===mn){mx+=1;mn-=1;}
  const x=i=>L+(W-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const d=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const grid=[mn,(mn+mx)/2,mx].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e6dcc6" stroke-width="1"/><text x="${L-4}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#7b7366">${Math.round(v)}</text>`).join('');
  const step=Math.max(1,Math.ceil(pts.length/6));
  const xl=pts.map((p,i)=>i%step===0||i===pts.length-1?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#7b7366">${p.l}</text>`:'').join('');
  const dots=pts.map((p,i)=>`<g class="pt"><circle cx="${x(i)}" cy="${y(p.v)}" r="3" fill="#2d6b80" stroke="#fffdf7" stroke-width="2"/><circle cx="${x(i)}" cy="${y(p.v)}" r="10" fill="transparent"><title>${p.l}年（${p.a}歲）：${p.v}${unit}</title></circle></g>`).join('');

/* ================== 備考期 ================== */
function slotSum(){const s=S.prep.slots;return s.study+s.exercise+s.work+s.rest;}
function adjSlot(k,d){const s=S.prep.slots;if(d>0&&slotSum()>=4)return;s[k]=clamp(s[k]+d,0,4);render();}
function examNeed(){return S.prep.target==='高考'?100:70;}
function examChance(){const p=S.prep.progress,n=examNeed();if(p<n*0.75)return 0.03;
  return clamp(0.15+(p-n*0.75)/(n*0.5)*0.6+(S.int-50)/200-(S.stress>80?0.15:0),0.03,0.93);}
function submitPrep(){
  if(slotSum()!==4||Q.length)return;
  const s=S.prep.slots, eff=S.stress>=75?0.6:1;
  const gain=s.study*(3.2+S.int*0.06)*eff-(s.study===0?2:0);
  S.prep.progress=clamp(S.prep.progress+gain,0,150);
  const r=mod({stress:s.study*6+s.work*3-s.exercise*4-s.rest*9+2,int:s.study*0.4,sta:s.exercise*2.5-s.work*1-s.study*0.3,eq:s.rest*0.6+s.work*0.3,money:s.work*7000-s.rest*1500-8000});
  S.last={title:`${ROC()}年${MO()}月 備考月報`,html:`念書${s.study}・運動${s.exercise}・打工${s.work}・休閒${s.rest}（週）<br>備考進度 +${gain.toFixed(1)}${eff<1?'（壓力過高，效率打折）':''}；生活費 -$8,000`+r};
  log(`備考：念書${s.study}週，進度 ${Math.round(S.prep.progress)}/${examNeed()}`);
  if(S.money<0){S.money+=30000;mod({stress:8},true);log('存款見底，向爸媽借了 3 萬元生活費。','bad');}
  if(rnd()<0.35&&MO()!==6) pushEvent(pickPrep());
  Q.push({fn:endPrepMonth});
  processQueue();save();render();
}
function endPrepMonth(){
  if(S.stress>=100){
    pushCard({tag:'身心狀況',title:'壓力爆表・身心崩潰',body:'你連續失眠、看到考古題就想吐，終於在圖書館崩潰大哭。家人帶你回家休養。',
      choices:[{t:'回家休養三個月',fn:()=>{const mo=MO();S.m+=3;S.stress=40;mod({sta:-5});S.stats.collapse++;
        let t='休養期間你什麼書都沒念，但終於睡了好覺。';
        if(mo>=4&&mo<=6){S.prep.attempts++;t+='<br><b class="ng">錯過今年國家考試（停考）。</b>';log('身心崩潰，錯過今年國考。','bad');if(failCheck())return t;}
        return t+mod({progress:-8});}}]});

  }

  const p=S.prep,qb=quizBonus(),ch=clamp(examChance()+qb,0.03,0.97),qn=(S.quiz&&S.quiz.ok)||0;

      p.attempts++;p.progress*=0.6;log(`${p.target}落榜（第${p.attempts}次）。`,'bad');

        {t:'放棄國考，轉職外送員',fn:()=>{ending('failexam');}}]})});
      return '<b class="ng">落榜了。</b>差了幾分，你盯著成績單發呆了一整個下午。'+mod({stress:15},true);

function pickEvent(){

  let pool=EV.filter(e=>okTrack(e)&&(!e.cond||e.cond())&&!rec.includes(e.title));

    if(unitMax(j.unit)<10){if(!j.capNote){log(`具晉升簡任官等訓練資格，但「${j.unit.name}」沒有簡任職缺，可考慮申請調動。`,'key');j.capNote=true;}return;}
    pushCard({tag:'升官等訓練',title:'薦任公務人員晉升簡任官等訓練',body:'你任薦任第九職等滿3年、已敘本俸最高級、最近三年考績二甲一乙以上，可爭取參加國家文官學院「晉升簡任官等訓練」。名額有限，依積分遴選。',
      choices:[{t:'請長官寫推薦，全力衝刺',check:['luck',58],ok:()=>{if(rnd()<chance('int',62)+(j.master?0.1:0)+(j.exp||0)*0.05){promote('晉升簡任官等訓練合格',j.pos+1);return '遴選過關、結訓合格，你正式踏入簡任文官行列！'+mod({stress:-5,luck:2});}return '取得受訓資格，但結訓測驗差了一點。'+mod({stress:12});},fail:()=>'名額被積分更高的人拿走了。'+mod({stress:6})},
               {t:'靠積分硬拚',check:['int',70],ok:()=>{promote('晉升簡任官等訓練合格',j.pos+1);return '你憑真本事通過。'+mod({luck:3});},fail:()=>'積分不夠，明年再來。'+mod({stress:10})}]});
    return;
  }
  if(!elig)return;
  if(j.cap===7&&j.master&&g===7){const last=j.rec.filter(x=>x.gd===7&&!x.o).slice(-5);if(last.length>=5&&last.filter(x=>x.g==='甲').length>=4&&last.every(x=>x.g==='甲'||x.g==='乙')){j.cap=8;log('🎓 具碩士學位且最近五年薦任第七職等考績四甲一乙以上，得擔任職務列等最高薦任第八職等之職務','good');}}
  if(g+1>j.cap){if(!j.capNote){log('已具升等資格，但經升官等訓練升任者限任薦任第七職等以下職務。可報考薦任升官等考試（每年8月報名）。','key');j.capNote=true;}return;}
  // 同一職務列等範圍內：考績升等
  if(g<p.hi){promote('年終考績取得高一職等任用資格，於職務列等範圍內晉升',j.pos);return;}
  const nx=L[j.pos+1];
  if(!nx||nx.hi<g+1){if(!j.capNote){log(`已具升等資格，但「${j.unit.name}」已無更高職務。可考慮申請調動。`,'key');j.capNote=true;}return;}
  if(g===13){
    pushCard({tag:'人事佈局',title:'部長召見',body:'部長把你找去辦公室：「常務次長出缺，我考慮推薦你。這個位置要協調立法院、處理媒體，還要跟各方都處得來。」',
      choices:[{t:'「願意承擔，全力以赴！」',check:['luck',72],ok:()=>{if(S.eq>=60){promote('奉派為常務次長',j.pos+1);return '行政院人事命令發布：你被任命為常務次長，事務官的頂點！'+mod({luck:5});}return '部長覺得你協調能力還不夠（情商需達60）。'+mod({stress:6});},fail:()=>'最後政治考量，由別人出線。'+mod({stress:8})},
               {t:'婉謝，留任現職',fn:()=>'你選擇不蹚這渾水。'+mod({stress:-4})}]});
    return;
  }
  const bonusP=(j.exp||0)*0.08+(j.master?0.05:0)+(rel().boss-50)*0.004;
  const p2=clamp((g>=11?chance('luck',65):0.35+S.luck*0.004+S.eq*0.002)+bonusP,0.15,0.9);
  if(rnd()<p2) promote(`${nx.t}出缺，經甄審陞任`,j.pos+1);
  else log(`已具升等資格，但「${nx.t}」目前沒有職缺，繼續等待。`);
}
function promote(why,newPos){
  const j=S.job,curPt=ptOf(j.grade,j.lv);
  j.grade++;j.pos=newPos;
  // 俸給法：升任高一職等敘最低俸級；原俸點較高者，敘同數額俸點之俸級
  const list=gradeLv(j.grade);let lv=list.findIndex(p=>p>=curPt);if(lv<0)lv=list.length-1;j.lv=lv;
  j.sinceA=0;j.sinceB=0;j.capNote=false;j.gradeMonths=0;
  S.stats.maxGrade=Math.max(S.stats.maxGrade,j.grade);
  if(newPos!==undefined&&rnd()<0.4){j.boss={...pick(BOSSES)};rel().boss=50;}
  log(`📈 ${why}：${rank()}第${j.grade}職等 ${title()}（${lvName(j.grade,j.lv)}）`,'good');
  toast(`陞任 ${title()}（${j.grade}職等）！`);
}

function pensionCalc(){
  const j=S.job,yrs=j.months/12,b=basePay();
  const lumpOnly=yrs<15;                                 // 個人專戶制：年資未滿15年限領一次退休金
  const n=Math.max(15,85-AGE())*12, r=0.017/12;          // 攤提給付：依平均餘命（概估至85歲）與利率（約2年期定存）攤提
  const annuity=lumpOnly?0:j.pension*r/(1-Math.pow(1+r,-n));
  const gb=Math.round(b*0.013*Math.min(yrs,35));         // 公保養老年金（概估，給付率每年1.3%、年資上限35年）
  const monthly=annuity+gb;
  return {yrs,acct:j.pension,annuity,gb,monthly,lumpOnly,ratio:monthly/(b*2)};
}

function ending(reason){

      <button class="btnp" ${busy||left!==0?'disabled':''} onclick="submitPrep()">📨 呈核本月計畫</button></div></div></div>`;
  } else {
    const st=S.job.stop;
    if(st){
      h+=`<div class="panel acts"><div class="ph">${st.type==='借調'?'借調行政法人中':st.type+'留職停薪中'}<span class="date">剩 ${st.left} 個月</span></div><div class="pb">
        <div class="note">${st.type==='育嬰'?'專心陪伴孩子成長。前 6 個月可領育嬰留職停薪津貼，不會收到公文。':st.type==='侍親'?'在家照顧長輩，沒有薪水，也不會收到公文。':'在行政法人執行專案，薪水較高，考績仍由本職機關辦理。'}</div>
        <div class="btnrow" style="margin-top:8px"><button class="btnp" ${busy?'disabled':''} onclick="doMonth('stop')">📆 度過這個月</button>
        <button class="btns" ${busy?'disabled':''} onclick="fastForward()">⏩ 快轉 3 個月</button></div></div></div>`;
      $('#center').innerHTML=h;return;
    }
    h+=`<div class="panel acts"><div class="ph">本月工作重點<span class="date">每回合＝1個月</span></div><div class="pb"><div class="agrid">`;
    for(const k in ACTS){const off=busy||(k==='leave'&&leaveLeft()<1);h+=`<button class="act" ${off?'disabled':''} onclick="doMonth('${k}')"><b>${ACTS[k].t}</b><small>${k==='leave'?`剩 ${leaveLeft()} 日・`:''}${ACTS[k].d}</small></button>`;}
    h+=`</div><div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="note">每月約有六成機率收到「公文」（隨機事件）。12月結算年終考績。</span>
      <button class="btns" ${busy?'disabled':''} onclick="fastForward()">⏩ 蓋章快轉 3 個月（例行公事，不觸發事件）</button></div></div></div>`;
  }
  $('#center').innerHTML=h;
}
function fastForward(){for(let i=0;i<3;i++){if(Q.length||S.phase!=='career')break;doMonth(S.job.stop?'stop':'routine',true);}}
function renderRight(){
  let h=`<div class="tabs">
    <button class="tab ${TAB==='log'?'on':''}" onclick="TAB='log';renderRight()">日誌</button>
    <button class="tab ${TAB==='life'?'on':''}" onclick="TAB='life';renderRight()">生活理財</button>
    <button class="tab ${TAB==='rel'?'on':''}" onclick="TAB='rel';renderRight()">人際</button>
    <button class="tab ${TAB==='rec'?'on':''}" onclick="TAB='rec';renderRight()">考績紀錄</button></div><div class="pb">`;
  if(TAB==='rel') h+=relPanel();
  else if(TAB==='log') h+=`<div class="log">${S.log.map(l=>`<div class="${l.cls}"><span class="d">${l.d}</span>${l.msg}</div>`).join('')}</div>`;
  else if(TAB==='rec'){
    if(!S.job||!S.job.rec.length) h+='<div class="note">尚無考績紀錄。考上公職並任職滿一年後，每年12月辦理年終考績。</div>';
    else h+=`<table class="rec"><tr><th>年度</th><th>分數</th><th>等第</th></tr>${S.job.rec.slice().reverse().map(r=>`<tr><td>${r.y}</td><td>${r.s}</td><td class="${r.g==='甲'?'gA':r.g==='乙'?'gB':'gC'}">${r.g}</td></tr>`).join('')}</table>`;
    if(S.job) h+=`<div class="note" style="margin-top:8px">考績甲等：晉一級＋1個月獎金；乙等：晉一級＋半個月；丙等：留原俸級；丁等：免職。年終工作獎金另發1.5個月。<br>累計獎勵折計 ${S.job.totalC} 次、懲處折計 ${S.job.totalD} 次（大過 ${S.job.major}）。</div>`;
  } else h+=lifePanel();
  h+='</div>';
  $('#right').innerHTML=h;
}
function relPanel(){
  if(!S.job) return '<div class="note">考上公職、分發報到後，才會有長官與同事。</div>';
  const r=rel(),b=S.job.boss;
  const bar=f=>`<div class="bar"><i style="width:${f}%;background:${f>=70?'var(--green)':f<=25?'var(--red)':'var(--blue2)'}"></i></div>`;
  return `<div class="sec"><h4>👔 直屬長官</h4><div class="stat"><div class="row"><span>${b.name}</span><span>${Math.round(r.boss)}・${bossTag(r.boss)}</span></div>${bar(r.boss)}</div>
    <div class="note">${b.desc}<br>好感影響：考績分數與甲等名額、陞遷機會；好感達75時，長官有機會幫你擋下懲處；低於35，被甩鍋機率大增。</div></div>
    <div class="sec"><h4>🧑‍🤝‍🧑 同事</h4>${r.mates.map(m=>`<div class="stat"><div class="row"><span>${m.n}（${m.t}）${m.st?`<span class="note"> 故事${'●'.repeat(m.st)}${'○'.repeat(Math.max(0,3-m.st))}</span>`:''}</span><span>${Math.round(m.f)}・${relTag(m.f)}</span></div>${bar(m.f)}</div>`).join('')}
    <div class="note">好感≥70成為盟友，每位盟友每月幫你分擔壓力；≤25會不合，可能在背後打小報告。用「同事聯誼」「經營人脈」或在事件中的選擇經營關係。調動後會換一批長官與同事。</div></div>`;
}
function lifePanel(){
  const l=S.life,busy=Q.length>0,dis=c=>busy||!c?'disabled':'';
  const sv=l.stockUnits*l.stockPrice;
  let h=`<div class="sec"><h4>📈 股票投資（台股ETF）</h4>
    <dl class="kv"><dt>每單位價格</dt><dd>${l.stockPrice.toFixed(1)}</dd><dt>持有市值</dt><dd>${wan(sv)}</dd></dl>
    <div class="btnrow"><button class="btns" ${dis(S.money>=50000)} onclick="buyStock(50000)">買進 5萬</button><button class="btns" ${dis(S.money>=200000)} onclick="buyStock(200000)">買進 20萬</button>
    <button class="btns" ${dis(sv>0)} onclick="sellStock(0.5)">賣出一半</button><button class="btns" ${dis(sv>0)} onclick="sellStock(1)">全部出清</button></div>
    <div class="note">每月隨機漲跌，長期略為向上，偶有股災。</div></div>`;
  if(S.phase==='prep') return h+'<div class="note">🏠 買房、💍 成家、🗂 人事異動等功能，請考上公職後再行簽辦。</div>';
  const j=S.job,hp=housePrice();
  h+=`<div class="sec"><h4>🏠 房產</h4>`;
  if(l.house) h+=`<dl class="kv"><dt>房屋市值</dt><dd>${wan(l.house.value)}</dd><dt>貸款餘額</dt><dd>${wan(l.house.loan)}</dd><dt>每月房貸</dt><dd>${l.house.loan>0?fmt(l.house.pay):'已繳清🎉'}</dd></dl>
    <div class="btnrow"><button class="btns" ${dis(true)} onclick="ask('賣出房屋','確定要賣掉房子嗎？（扣除房貸與約4%稅費）',sellHouse)">賣出房屋</button></div>`;
  else h+=`<dl class="kv"><dt>當地房價</dt><dd>${wan(hp)}</dd><dt>頭期款＋稅費(22%)</dt><dd>${wan(hp*0.22)}</dd><dt>預估月付</dt><dd>${fmt(mortgagePay(hp*0.8))}</dd><dt>目前房租</dt><dd>${fmt(j.unit.rent)}/月</dd></dl>
    <div class="btnrow"><button class="btns" ${dis(S.money>=hp*0.22)} onclick="buyHouse()">申辦房貸購屋</button></div><div class="note">貸款八成、30年、利率2.2%。有房可省房租、略降壓力，房價長期抗通膨。</div>`;
  h+=`</div><div class="sec"><h4>💍 家庭</h4><dl class="kv"><dt>婚姻</dt><dd>${l.married?`已婚（配偶月收 ${fmt(l.spouse)}）`:l.dating?'交往中':'單身'}</dd><dt>子女</dt><dd>${l.kids} 人</dd></dl><div class="btnrow">`;
  if(!l.married) h+=`<button class="btns" ${dis(S.money>=300000&&S.eq>=45&&AGE()<55)} onclick="propose()">${l.dating?'求婚':'相親並求婚'}（婚宴30萬）</button>`;
  else h+=`<button class="btns" ${dis(AGE()<48&&l.kids<4)} onclick="haveKid()">生小孩</button>`;
  const kidOK=(l.kidsB||[]).some((b,i)=>S.m-b<36&&((l.kidStop||[])[i]||0)<24);
  if(l.kids) h+=`<button class="btns" ${dis(kidOK&&!j.stop)} onclick="startKidStop()">申請育嬰留職停薪</button>`;
  h+=`</div><div class="note">${!l.married?'需情商≥45、存款≥30萬。':'每個孩子每月開銷約1.2萬；子女未滿3歲可申請育嬰留職停薪（每名最長2年）。'}</div>`;
  const par=l.parent||'ok';
  h+=`<dl class="kv" style="margin-top:6px"><dt>父母</dt><dd>${par==='care'?`${l.parentWho}需長期照顧（每月 ${fmt(l.careCost||0)}）`:(l.parentsLeft===0?'均已辭世':'健在')}</dd></dl></div>`;
  h+=`<div class="sec"><h4>📅 假勤</h4><dl class="kv"><dt>今年休假</dt><dd>${leaveLeft()} / ${lea().quota} 日</dd><dt>事病假（計入考績）</dt><dd>${lea().sp} 日${lea().sp>14?' ⚠':''}</dd><dt>家庭照顧假</dt><dd>${lea().fam} 日</dd></dl>
    <div class="note">休假依年資：滿1年7日、滿3年14日、滿6年21日、滿9年28日、滿14年30日。事、病假合計超過14日不得考列甲等（家庭照顧假不計）。</div></div>`;
  h+=`<div class="sec"><h4>🎓 進修</h4><dl class="kv"><dt>學歷</dt><dd>${j.master?'碩士':j.study?`碩士在職專班（剩 ${j.study.left} 個月）`:'大學'}</dd><dt>跨域歷練</dt><dd>${j.exp?`借調 ${j.exp} 次`:'—'}</dd></dl>
    ${!j.master&&!j.study?`<div class="btnrow"><button class="btns" ${dis(S.money>=120000&&!j.stop)} onclick="startMaster()">報考碩士在職專班（學費12萬）</button></div>`:''}</div>`;
  h+=`<div class="sec"><h4>🗂 人事異動</h4><div class="btnrow">
    <button class="btns" ${dis(j.unitMonths>=24&&!j.stop)} onclick="transfer()">申請調動${j.unitMonths<24?`（需在職滿2年）`:''}</button>
    <button class="btns" ${dis(canRetire()&&!j.stop)} onclick="retireNow()">申請自願退休</button>
    <button class="btns" ${dis(true)} onclick="resign()">遞出辭呈</button></div>
    <div class="note">自願退休：年資滿25年，或年滿60歲且年資滿5年；65歲屆齡退休。<br>退撫個人專戶目前累積：${wan(j.pension)}</div></div>`;
  return h;
}
function openHelp(){
  $('#modalBody').innerHTML=`<div class="dochead"><div class="org serif">辦法說明</div><button class="btns" onclick="closeModal()">關閉</button></div>
  <div class="body" style="font-size:14px">
  <p><b>一、備考期</b>：每回合一個月，把四週分配到念書／運動／打工／休閒。智力影響念書效率；體力與情商越高，壓力累積越慢。壓力達 100% 會崩潰休養，可能錯過考試。高普考每年 7 月舉行，進度與智力決定錄取機率。（遊戲規則：落榜 4 次或滿 30 歲仍未上榜觸發結局；現實中國考沒有次數限制。）</p>
  <p><b>二、起敘</b>：普考＝委任第三職等本俸一級（280俸點）；高考三級＝薦任第六職等本俸一級（385俸點）。</p>
  <p><b>三、考績與俸級</b>：每年 12 月辦理年終考績。甲等（80分以上）晉一級＋1個月俸給總額獎金；乙等（70～79）晉一級＋半個月；已達最高俸級者改發 2 個月／1.5 個月；丙等留原俸級；丁等免職。平時考核嘉獎/申誡±1分、記功/記過±3分、大功/大過±9分，可互相抵銷；未抵銷的記過以上不得列甲等，抵銷後累積達二大過應列丁等。甲等人數比例原則上不超過 75%。</p>
  <p><b>四、升職等</b>：同一職等年終考績「二年甲等」或「一年甲等二年乙等」，取得高一職等任用資格。在現職務列等範圍內（如科員 6～7 職等）可直接升等，超出範圍要等更高職務出缺。陞任高一職等時，敘新職等最低俸級；原俸點較高者，敘同數額俸點的俸級。</p>
  <p><b>五、升官等</b>：委任→薦任：任委任第五職等滿 3 年、敘至本俸最高級、最近三年二甲一乙，參加晉升薦任官等訓練（訓練合格者只能擔任列等最高薦任第七職等以下的職務），或報考薦任升官等考試（不受限制）。薦任→簡任：高考或薦任升官等考試及格、任薦任第九職等滿 3 年、敘至本俸最高級、最近三年二甲一乙，再經晉升簡任官等訓練。</p>
  <p><b>六、薪資</b>：俸給總額＝本（年功）俸＋專業加給＋主管職務加給（主管才有）；偏遠鄉鎮另支地域加給（基本數額＋每滿1年加俸額2%）。扣除退撫儲金（俸額×2×15%×自繳35%）、公保（個人專戶制費率16.33%×自付35%）、健保（5.17%×30%×本人與眷屬，最多3口）後為實發。加班費每小時＝俸給總額÷240，一般加班每月上限 20 小時。年終工作獎金 1.5 個月。數額以 116 年度待遇（115.7.1 加給調增 2,000 元＋116 年通案調薪 4%）計算；之後的調薪為隨機事件。</p>
  <p><b>七、退休</b>：自願退休＝任職滿 25 年，或任職滿 5 年且年滿 60 歲；65 歲屆齡退休。112.7.1 後初任者適用個人專戶制：年資未滿 15 年限領一次退休金，滿 15 年可月領（依平均餘命攤提）。專戶報酬率、公保養老年金為遊戲概估。</p>
  <p><b>八、職系</b>：開局選擇報考類科，影響分發機關、專屬事件與職稱（技術類為技佐／技士／技正）。土木、資訊適用較高的專業加給（遊戲概估）。</p>
  <p><b>九、人際關係</b>：長官好感影響考績分數、甲等名額與陞遷；達 75 有機會幫你擋懲處，低於 35 容易被甩鍋。同事好感≥70 為盟友（每月分擔壓力），≤25 為不合（可能打小報告）。調動後換一批人。</p>
  <p><b>十、假勤與家庭</b>：休假依年資（滿1年7日→滿14年30日）。事、病假合計超過14日不得考列甲等，家庭照顧假不計。子女未滿3歲可申請育嬰留職停薪（每名最長2年，前6個月領本俸60%津貼＋政府加發20%）；父母年老可能需要照顧，可選長照2.0、外籍看護或侍親留職停薪；父母辭世給喪假15日及喪葬補助。年度中有留職停薪者辦理「另予考績」（不晉級，只發一次獎金）。本遊戲簡化：留職停薪期間不提撥退撫、不計年資。</p>
  <p><b>十一、職涯機會</b>：資深後可能獲邀借調行政法人（每次2年、最長4年，薪水較高，回任後陞遷加分）；可報考碩士在職專班（升簡任遴選加分，並放寬升官等訓練人員的職務列等限制）；40歲前可能遇到國營事業招考（考上即轉職結局）。</p>
  <p><b>十二、國考與分發</b>：考試時會隨機出 3 題「法學知識與英文」歷屆試題（考選部公開試題），每答對一題錄取機率 +5%，全對再 +3%。上榜後依錄取名次與志願順序分配機關：志願表列出具體機關（如交通部觀光署、臺北國稅局、內政部移民署、各區公所與縣市局處）：<b>一般行政可填全部機關</b>，其他專業職系（財稅、社會、土木、地政、環保、資訊）只能填業務相關的機關。名次在前者先選，熱門機關可能先額滿。各機關另有專屬事件，名額與熱度為遊戲設定。</p>
  <p><b>十三、事件與劇情</b>：事件依職涯階段分為新人期、中堅期、主管期（擔任主管或薦任九職等以上），並有各職系專屬事件。另有 6 條跨月劇情線（陳情案、標案、新首長、議會會期、審計查核、帶新人），選擇會影響後續發展。</p>
  <p><b>十四、數值回饋與重玩</b>：每年 12 月出年度回顧並記錄數值，「📈 人生曲線」可看歷年變化；「🏆 成就」有 30 項跨局保留的成就；另有 4 種隱藏結局等你發掘。</p>
  <p><b>十六、結案回顧、同事故事與離職出路</b>：人生結案時會列出你的「三個轉折點」。每位同事各有三段會隨年資發展的小故事；過去的獎懲（例如被審計開單、被議員稱讚）日後會有後續。遞辭呈後可依職系選擇離職出路（顧問、會計師、科技業、地政士、營造業、環境顧問、NPO、開咖啡店、補教等），能否成功看年資、存款與屬性判定。第一次遊玩會出現新手引導，隨時可按上方「🧭新手引導」重看。</p>
  <p><b>十五、存檔與操作</b>：每回合結束自動存檔；「💾 存檔管理」可手動存 3 格、讀取、刪除，也能匯出／匯入 .json 備份。快捷鍵：數字鍵 1～4 選擇選項，Enter 或空白鍵「存查」，Esc 關閉視窗。</p></div>`;
  $('#modal').classList.add('on');
}
function closeModal(){$('#modal').classList.remove('on');}
/* 快捷鍵：1~4 選擇選項、Enter/空白鍵 存查、Esc 關閉視窗 */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key==='Escape'){closeModal();return;}
  if($('#modal').classList.contains('on')||!S||S.phase==='end')return;
  const c=Q[0];if(!c)return;
  if(c.result&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ack();return;}
  const n=parseInt(e.key,10);if(!c.result&&n>=1&&n<=c.choices.length){const ch=c.choices[n-1];if(!(ch.need&&!ch.need()))choose(n-1);}
});

/* ================== 啟動 ================== */
render();
</script>
