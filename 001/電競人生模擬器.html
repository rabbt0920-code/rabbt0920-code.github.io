<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電競人生模擬器 3.0｜戰隊經理</title>
<script src="https://cdn.tailwindcss.com"></script>
<style type="text/tailwindcss">
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; background: radial-gradient(ellipse at top, #11214a 0%, #070b14 55%) fixed; min-height: 100vh; }
  .card { @apply bg-slate-900/80 border border-slate-700/60 rounded-2xl p-4 backdrop-blur shadow-lg; }
  .card-title { @apply text-sm font-bold tracking-wider text-cyan-300 mb-3 flex items-center gap-2; }
  .btn { @apply px-3 py-2 rounded-xl font-semibold text-sm transition active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100; }
  .btn-cyan { @apply bg-cyan-500/90 hover:bg-cyan-400 text-slate-950; }
  .btn-violet { @apply bg-violet-600 hover:bg-violet-500 text-white; }
  .btn-emerald { @apply bg-emerald-600 hover:bg-emerald-500 text-white; }
  .btn-amber { @apply bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-[0_0_18px_rgba(245,158,11,.25)]; }
  .btn-rose { @apply bg-rose-600 hover:bg-rose-500 text-white; }
  .btn-ghost { @apply bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600; }
  .tile { @apply rounded-xl px-1 py-2.5 bg-slate-800/80 border border-slate-700 transition text-center active:scale-95 hover:border-cyan-400 hover:bg-slate-700/70 disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:border-slate-700 disabled:hover:bg-slate-800/80 disabled:active:scale-100; }
  .choice { @apply w-full text-left px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 transition text-sm font-semibold hover:border-cyan-400 hover:bg-slate-700/80 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:border-slate-600; }
  .chip { @apply inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold border whitespace-nowrap; }
  .chip-good { @apply bg-emerald-500/15 text-emerald-300 border-emerald-500/30; }
  .chip-bad { @apply bg-rose-500/15 text-rose-300 border-rose-500/30; }
  .chip-n { @apply bg-slate-700/50 text-slate-300 border-slate-600; }
  .tab { @apply px-2.5 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-slate-200 hover:bg-slate-800; }
  .tab-on { @apply bg-slate-700 text-cyan-300; }
  .stat-row { @apply flex items-center gap-2 text-sm; }
  .bar { @apply h-2 flex-1 rounded-full bg-slate-800 overflow-hidden; }
  .bar > div { @apply h-full rounded-full transition-all duration-500; }
  .kv { @apply flex justify-between gap-2 text-sm py-1 border-b border-slate-800 last:border-0; }
  .neon { text-shadow: 0 0 14px rgba(34, 211, 238, .55); }
  .fade-in { animation: fade .25s ease; }
  .pop-in { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
  .fx-card { @apply bg-slate-900/95 border border-cyan-500/40 rounded-xl p-2.5 shadow-2xl max-w-xs; animation: slidein .3s ease; transition: opacity .5s, transform .5s; }
  .fx-out { opacity: 0; transform: translateX(24px); }
  @keyframes slidein { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; }
</style>
</head>
<body class="text-slate-200">
<div class="max-w-7xl mx-auto p-3 md:p-6">
  <header class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-black neon text-cyan-300">🎮 電競人生模擬器 <span class="text-violet-400">3.0</span></h1>
      <p class="text-xs text-slate-400 mt-1">戰隊老闆兼總教練：育成、帶隊、BP、經營，從次級聯賽打到世界賽</p>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <span id="modeBadge" class="hidden"></span>
      <button class="btn btn-ghost !py-1 text-xs" onclick="Menu.save()">💾 存檔</button>
      <button class="btn btn-ghost !py-1 text-xs" onclick="Menu.help()">❓ 說明</button>
      <button class="btn btn-ghost !py-1 text-xs" onclick="Menu.restart()">↺ 重新開始</button>
    </div>
  </header>
  <main id="screen"></main>
  <footer class="text-center text-xs text-slate-600 mt-6">進度自動儲存於此瀏覽器・成就跨存檔保留</footer>
</div>
<div class="fixed bottom-2 right-3 z-40 pointer-events-none select-none px-2.5 py-0.5 rounded-full text-[11px] font-bold tracking-wider bg-amber-500/15 text-amber-300 border border-amber-400/40 backdrop-blur">Beta版本</div>
<div id="modal" class="fixed inset-0 bg-black/75 hidden items-center justify-center z-50 p-3"><div id="modalBox"></div></div>
<div id="fx" class="fixed top-20 right-3 z-[70] flex flex-col gap-2 pointer-events-none"></div>
<div id="toast" class="hidden"></div>
<script>
'use strict';
/* ===== core.js ===== */
/* ===================== core：工具、存檔、UI、轉播、事件引擎 ===================== */
const $ = s => document.querySelector(s);
const rand = (a, b) => Math.random() * (b - a) + a;
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const fmt = n => Math.round(n).toLocaleString('zh-TW');
const money = n => (n < 0 ? '-$' : '$') + fmt(Math.abs(n));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const strip = s => String(s).replace(/<[^>]*>/g, '');
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function wpick(arr, wf) {
  const ws = arr.map(wf); const tot = ws.reduce((a, b) => a + b, 0); if (tot <= 0) return null;
  let r = Math.random() * tot;
  for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}
const uid = () => Math.random().toString(36).slice(2, 9);
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;

const KEY = 'esports_mgr_v1', ACH_KEY = 'esports_mgr_ach_v1';
let S = null;

const Store = {
  save() { try { if (S) localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} },
  load() { try { const d = localStorage.getItem(KEY); return d ? JSON.parse(d) : null; } catch (e) { return null; } },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
  sk: i => KEY + '_slot' + i,
  label() { return S && S.C ? `🏢 ${S.C.name}・第${S.C.season}賽季 ${DIVN[S.C.div]}` : ''; },
  saveSlot(i) { try { localStorage.setItem(Store.sk(i), JSON.stringify({ at: Date.now(), label: Store.label(), data: S })); return true; } catch (e) { return false; } },
  slot(i) { try { const d = localStorage.getItem(Store.sk(i)); return d ? JSON.parse(d) : null; } catch (e) { return null; } },
};
const Ach = {
  all() { try { return JSON.parse(localStorage.getItem(ACH_KEY) || '{}'); } catch (e) { return {}; } },
  unlock(id) {
    const a = Ach.all(); if (a[id]) return;
    a[id] = Date.now(); try { localStorage.setItem(ACH_KEY, JSON.stringify(a)); } catch (e) {}
    const d = ACH.find(x => x.id === id); if (!d) return;
    toast(`🏅 成就解鎖：${d.e} ${d.n}`, 'gold'); if (S) log(`🏅 成就解鎖：${d.n}`, 'gold');
  },
};

/* ---------- 變化提示 ---------- */
const LBL = { funds: '資金', pop: '聲望', chem: '默契', morale: '平均士氣', tac: '戰術', dev: '育成', neg: '談判', man: '管理' };
function snapC() { const C = S.C; return { funds: C.funds, pop: C.pop, chem: C.chem, morale: avg(C.players.map(p => p.morale)) }; }
function diffC(b) {
  const o = snapC(), out = [];
  for (const k in b) { const d = o[k] - b[k]; if (Math.abs(d) >= (k === 'funds' ? 1 : 0.5)) out.push([k, d]); }
  return out;
}
function chips(list) {
  return list.map(([k, d]) => `<span class="chip ${d > 0 ? 'chip-good' : 'chip-bad'}">${LBL[k] || k} ${d >= 0 ? '+' : '-'}${k === 'funds' ? '$' : ''}${k === 'funds' ? fmt(Math.abs(d)) : Math.abs(d).toFixed(k === 'pop' ? 1 : 0)}</span>`).join(' ');
}
function popFx(list, title) {
  if (!list || !list.length) return;
  const box = $('#fx'); if (!box) return;
  const el = document.createElement('div'); el.className = 'fx-card';
  el.innerHTML = `<div class="text-[11px] text-slate-400 mb-1">${esc(title)}</div><div class="flex flex-wrap gap-1">${chips(list)}</div>`;
  box.prepend(el);
  setTimeout(() => el.classList.add('fx-out'), 2600); setTimeout(() => el.remove(), 3200);
  while (box.children.length > 3) box.lastChild.remove();
}
function toast(msg, type = 'info') {
  const t = $('#toast'); if (!t) return;
  t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] px-4 py-2 rounded-xl text-sm shadow-xl border fade-in max-w-[92vw] ' +
    ({ bad: 'bg-rose-950 border-rose-500/60', gold: 'bg-amber-950 border-amber-400/60', good: 'bg-emerald-950 border-emerald-500/60' }[type] || 'bg-slate-800 border-cyan-500/50');
  t.textContent = msg; clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2600);
}
function openModal(html, wide) {
  const box = $('#modalBox');
  box.className = 'card w-full max-h-[92vh] overflow-y-auto fade-in ' + (wide ? 'max-w-3xl' : 'max-w-lg');
  box.innerHTML = html; const m = $('#modal'); m.classList.remove('hidden'); m.classList.add('flex');
}
function closeModal() { stopBC(); const m = $('#modal'); m.classList.add('hidden'); m.classList.remove('flex'); }
function log(msg, type = 'info') {
  if (!S || !S.C) return;
  S.log.unshift({ stamp: `S${S.C.season}·${phaseShort(S.C)}`, msg, type }); if (S.log.length > 150) S.log.length = 150;
}
const LOGC = { info: 'text-slate-300', good: 'text-emerald-300', bad: 'text-rose-300', gold: 'text-amber-300', sys: 'text-cyan-300' };
function logList(h, n) {
  return `<div class="${h} overflow-y-auto space-y-1.5 pr-1 text-xs">${S.log.slice(0, n || 150).map(l => `<div class="${LOGC[l.type] || ''}"><span class="text-slate-500 mr-1">[${l.stamp}]</span>${l.msg}</div>`).join('') || '<div class="text-slate-500">尚無紀錄</div>'}</div>`;
}
function spark(vals, color = '#22d3ee', h = 48) {
  if (!vals || vals.length < 2) return '<div class="text-xs text-slate-500 py-3 text-center">資料累積中…</div>';
  const mn = Math.min(...vals), mx = Math.max(...vals), r = (mx - mn) || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 100).toFixed(2)},${(h - 4 - (v - mn) / r * (h - 8)).toFixed(2)}`).join(' ');
  return `<svg viewBox="0 0 100 ${h}" preserveAspectRatio="none" class="w-full" style="height:${h}px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
    <div class="flex justify-between text-[10px] text-slate-500"><span>${money(mn)}</span><span>${money(mx)}</span></div>`;
}

/* ---------- 比賽轉播 ---------- */
let BC = null;
function broadcast(d) {
  stopBC();
  openModal(`<div class="text-center text-xs text-slate-400 tracking-widest">🔴 LIVE・${esc(d.title)}</div>
    <div class="flex items-center justify-center gap-3 my-3"><div class="flex-1 text-right font-black text-cyan-300">${esc(d.A)}</div>
    <div class="text-3xl font-black font-mono px-3">${d.x} : ${d.y}</div><div class="flex-1 font-black text-rose-300">${esc(d.B)}</div></div>
    <div class="text-[10px] text-slate-500 flex justify-between"><span>經濟差</span><span id="bcGoldT">0</span></div>
    <div class="h-2 rounded-full bg-rose-500/60 overflow-hidden mb-3"><div id="bcGold" class="h-full bg-cyan-400 transition-all duration-300" style="width:50%"></div></div>
    <div id="bcFeed" class="h-64 overflow-y-auto space-y-1 text-sm bg-slate-950/70 rounded-xl p-3 border border-slate-800"></div>
    <div id="bcEnd" class="mt-3"><button class="btn btn-ghost w-full" onclick="skipBC()">⏩ 跳過轉播</button></div>`, true);
  BC = { lines: d.lines, i: 0, d, timer: setInterval(stepBC, 520) };
}
function bcLine(l) {
  const feed = $('#bcFeed'); if (!feed) return;
  if (l.hdr) feed.insertAdjacentHTML('beforeend', `<div class="text-center text-xs text-amber-300 pt-2">${l.hdr}</div>`);
  else {
    feed.insertAdjacentHTML('beforeend', `<div class="${l.good ? 'text-emerald-300' : 'text-rose-300'} ${l.big ? 'font-black' : ''}"><span class="text-slate-500 font-mono mr-1">${String(l.t).padStart(2, '0')}:00</span>${esc(l.txt)}</div>`);
    $('#bcGold').style.width = clamp(50 + l.gold / 200, 4, 96) + '%';
    $('#bcGoldT').textContent = (l.gold >= 0 ? '+' : '') + (l.gold / 1000).toFixed(1) + 'k';
  }
  feed.scrollTop = feed.scrollHeight;
}
function stepBC() { if (!BC) return; if (BC.i >= BC.lines.length) return endBC(); bcLine(BC.lines[BC.i++]); }
function skipBC() { if (!BC) return; clearInterval(BC.timer); while (BC.i < BC.lines.length) bcLine(BC.lines[BC.i++]); endBC(); }
function endBC() {
  if (!BC) return; clearInterval(BC.timer); const d = BC.d; BC = null;
  const e = $('#bcEnd'); if (e) e.innerHTML = (d.endHtml || '') + `<button class="btn btn-cyan w-full mt-3" onclick="Match.cont()">繼續</button>`;
}
function stopBC() { if (BC) { clearInterval(BC.timer); BC = null; } }

/* ---------- 佇列 ---------- */
const G = {
  next() {
    if (!S) return;
    stopBC();
    const it = S.queue.shift(); Store.save();
    if (!it) { closeModal(); render(); Sim.checkOver(); return; }
    if (it.kind === 'ev') { S.cur = it; showEvent(); }
    else if (it.kind === 'html') openModal(it.html + `<button class="btn btn-cyan w-full mt-4" onclick="G.next()">${it.btn || '繼續'}</button>`, it.wide);
    else if (it.kind === 'sponsor') UI.sponsorPick();
    else G.next();
  },
};

/* ---------- 事件引擎 ---------- */
const RES = { g: ['🌟 大成功', 'text-amber-300'], k: ['✅ 成功', 'text-emerald-300'], f: ['❌ 失敗', 'text-rose-300'], b: ['💥 大失敗', 'text-rose-400'] };
const chkRate = (C, chk) => clamp(0.5 + (C.skill[chk.st] - chk.diff) * 0.06 + (C.luck - 50) / 400 - DIFF[C.diff].chk, 0.05, 0.95);
function rollCheck(C, chk) { const p = chkRate(C, chk), r = Math.random(); return r < p * 0.2 ? 'g' : r < p ? 'k' : r < p + (1 - p) * 0.75 ? 'f' : 'b'; }
function evCtx(ref) { const C = S.C, c = {}; for (const k in ref.ctx || {}) c[k] = C.players.find(p => p.id === ref.ctx[k]); return c; }
function showEvent() {
  const ref = S.cur, C = S.C, ev = EVM[ref.id], ctx = evCtx(ref);
  if (!ev || Object.values(ctx).some(v => !v)) { S.cur = null; return G.next(); }
  const T = s => typeof s === 'function' ? s(C, ctx) : s;
  const chs = ev.choices(C, ctx);
  openModal(`<div class="text-xs tracking-widest text-cyan-300">${ev.tag || '🏢 經營事件'}</div>
    <h3 class="text-xl font-black mt-1 mb-2">${ev.e} ${T(ev.title)}</h3>
    <p class="text-sm text-slate-300 leading-relaxed whitespace-pre-line mb-4">${T(ev.text)}</p>
    <div class="space-y-2">${chs.map((c, i) => {
      const ok = !c.req || c.req(C, ctx);
      const ck = c.check ? `<div class="text-[11px] mt-0.5 font-normal text-cyan-200/80">🎲 ${LBL[c.check.st]}判定・成功率約 ${Math.round(chkRate(C, c.check) * 100)}%</div>` : '';
      const rq = !ok && c.reqTxt ? `<div class="text-[11px] font-normal text-rose-300 mt-0.5">🔒 ${c.reqTxt}</div>` : '';
      return `<button class="choice" ${ok ? '' : 'disabled'} onclick="chooseEv(${i})">${c.t}${ck}${rq}</button>`;
    }).join('')}</div>`);
}
function chooseEv(i) {
  const ref = S.cur; if (!ref) return;
  const C = S.C, ev = EVM[ref.id], ctx = evCtx(ref), c = ev.choices(C, ctx)[i];
  if (!c || (c.req && !c.req(C, ctx))) return;
  const b = snapC(); let out, res = null;
  if (c.check) { res = rollCheck(C, c.check); out = c.out[res] || c.out[res === 'g' ? 'k' : 'f']; } else out = [c.txt, c.fx];
  const T = s => typeof s === 'function' ? s(C, ctx) : s;
  const title = strip(T(ev.title));
  if (out[1]) out[1](C, ctx);
  const resTxt = T(out[0]);
  Sim.fix(C);
  C.evSeen[ref.id] = (C.evSeen[ref.id] || 0) + 1; C.evLast[ref.id] = C.tick;
  S.cur = null;
  const d = diffC(b);
  log(`${ev.e} ${title}：${strip(c.t)}${res ? `（${RES[res][0]}）` : ''}`, res === 'b' || res === 'f' ? 'bad' : 'info');
  openModal(`<div class="text-xs text-slate-400">${ev.e} ${title}</div>
    <div class="text-sm text-slate-400 mt-1">你選擇：<span class="text-slate-200">${strip(c.t)}</span></div>
    ${res ? `<div class="text-2xl font-black mt-3 ${RES[res][1]} pop-in">${RES[res][0]}</div>` : ''}
    <p class="text-base mt-3 leading-relaxed">${resTxt}</p>
    <div class="flex flex-wrap gap-1 mt-4">${d.length ? chips(d) : '<span class="chip chip-n">沒有明顯的數值變化</span>'}</div>
    <button class="btn btn-cyan w-full mt-5" onclick="G.next()">繼續</button>`);
  checkAch(); Store.save();
}

/* ---------- 隨機向量紙娃娃頭像 ---------- */
const Av = {
  SK: ['#fde0c8', '#f6cfa8', '#e8b48a', '#c98f63', '#9a6642', '#6e4a30'],
  HC: ['#1c1917', '#3b2a1e', '#7c4a24', '#c9a24a', '#e7e5e4', '#b91c1c', '#2563eb', '#a21caf', '#0d9488', '#f472b6'],
  SH: ['#0ea5e9', '#8b5cf6', '#f43f5e', '#10b981', '#f59e0b', '#334155', '#e2e8f0', '#06b6d4', '#ec4899', '#84cc16'],
  BG: ['#1e3a5f', '#3b1f5e', '#5e1f2e', '#14532d', '#78350f', '#1e293b', '#134e4a', '#4a1d4f'],
  gen() { const r = n => Math.floor(Math.random() * n); return { sk: r(6), hs: r(8), hc: r(10), ey: r(4), br: r(3), mo: r(4), ac: chance(0.7) ? r(5) + 1 : 0, sh: r(10), bg: r(8), nose: r(2), ear: chance(0.3) ? 1 : 0 }; },
  of(p) { if (!p.av) p.av = Av.gen(); return p.av; },
  svg(p, size = 40) {
    const a = Av.of(p), sk = Av.SK[a.sk], hc = Av.HC[a.hc], sh = Av.SH[a.sh], dk = '#1c1917';
    let back = '', front = '', acc = '';
    switch (a.hs) {
      case 0: front = `<path d="M17.5 30 C16 12 48 12 46.5 30 C44 22 38 19 32 19 C26 19 20 22 17.5 30Z" fill="${hc}"/>`; break;
      case 1: front = `<path d="M17 30 L18 15 L24 21 L28 11 L33 20 L39 11 L42 21 L47 15 L47 30 C44 23 38 21 32 21 C26 21 20 23 17 30Z" fill="${hc}"/>`; break;
      case 2: back = `<path d="M15 30 C13 12 51 12 49 30 L50 54 L14 54Z" fill="${hc}"/>`; front = `<path d="M17 29 C18 14 46 14 47 29 C42 21 36 20 32 24 C28 20 22 21 17 29Z" fill="${hc}"/>`; break;
      case 3: back = `<circle cx="32" cy="10.5" r="6" fill="${hc}"/>`; front = `<path d="M17.5 30 C16 14 48 14 46.5 30 C43 23 38 20 32 20 C26 20 21 23 17.5 30Z" fill="${hc}"/>`; break;
      case 4: front = `<path d="M18 26 C20 17 44 17 46 26 C42 21 22 21 18 26Z" fill="${hc}" opacity=".55"/>`; break;
      case 5: front = `<path d="M26 18 C28 8 36 8 38 18 L38 24 C35 20 29 20 26 24Z" fill="${hc}"/><path d="M17.5 30 C17 24 21 20 24 20 L24 24 C21 25 19 27 17.5 30Z M46.5 30 C47 24 43 20 40 20 L40 24 C43 25 45 27 46.5 30Z" fill="${hc}"/>`; break;
      case 6: back = `<path d="M15.5 30 C14 12 50 12 48.5 30 L49 42 L40 42 L24 42 L15 42Z" fill="${hc}"/>`; front = `<path d="M17 28 C18 15 46 15 47 28 C40 20 27 22 17 28Z" fill="${hc}"/>`; break;
      default: front = `<path d="M17.5 31 C15 12 49 12 46.5 31 C46 24 42 20 38 19 C34 24 24 24 17.5 31Z" fill="${hc}"/>`;
    }
    const eye = ({
      0: [[26, 31], [38, 31]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.7" fill="${dk}"/>`).join(''),

/* ===================== sim：選手、聯賽、週期、賽季 ===================== */
const phaseShort = C => C.phase === 'off' ? `休賽${C.offW + 1}` : C.phase === 'reg' ? `R${C.round + 1}` : C.phase === 'po' ? '季後賽' : C.phase === 'pr' ? '升降賽' : '世界賽';
const CONTRA = [['clutch', 'choke'], ['hard', 'lazy'], ['iron', 'glass'], ['pool', 'onetrick'], ['loyal', 'greedy']];
const Sim = {
  ovr: p => avg(ATTR.map(a => p.attr[a])),
  usedNames() { const C = S && S.C; if (!C) return new Set(); const u = new Set([...C.players, ...C.market, ...C.youth].map(p => p.name)); [...(C.lg ? C.lg.teams : []), ...(C.other || [])].forEach(t => (t.ps || []).forEach(p => u.add(p.name))); return u; },
  proName(pos, ovr, used) {
    const L = PRO[pos], r = clamp(Math.round((93 - ovr) / 0.8 + rand(-2, 2)), 0, 29);
    for (let d = 0; d < 30; d++) for (const i of [r + d, r - d]) if (i >= 0 && i < 30 && !used.has(L[i])) return L[i];
    return null;
  },
  nameFor(pos, ovr, d1, used) {
    let n = d1 && ovr >= 67 ? Sim.proName(pos, ovr, used) : null;
    for (let i = 0; !n && i < 40; i++) { const c = pick(NICKS) + (chance(0.25) ? randi(1, 99) : ''); if (!used.has(c)) n = c; }
    n = n || pick(NICKS) + randi(100, 999); used.add(n); return n;
  },
  name(pos, ovr) { return Sim.nameFor(pos, ovr, !!(S && S.C && S.C.div === 1), Sim.usedNames()); },
  nameTeam(t, d1, used) { [...t.ps].sort((a, b) => b.rt - a.rt).forEach(p => { p.name = Sim.nameFor(p.pos, p.rt, d1, used); }); },
  nameLeague(teams, d1) { const used = new Set(); [...teams].filter(t => !t.me).sort((a, b) => b.pw - a.pw).forEach(t => Sim.nameTeam(t, d1, used)); },
  gen(o = {}) {
    const pos = o.pos || pick(POS), age = o.age || randi(17, 26), ov = o.ovr || 55, attr = {};
    ATTR.forEach(a => attr[a] = ov + rand(-6, 6)); const m = avg(Object.values(attr)); ATTR.forEach(a => attr[a] = clamp(attr[a] - m + ov, 20, 99));
    let pot = o.pot; if (pot == null) pot = ov + (age <= 18 ? rand(4, 24) : age <= 21 ? rand(2, 14) : age <= 23 ? rand(0, 6) : 0);
    const traits = []; const n = (chance(0.55) ? 1 : 0) + (chance(0.2) ? 1 : 0);
    for (let i = 0; i < n; i++) { const t = pick(TRK); if (!traits.includes(t) && !CONTRA.some(c => c.includes(t) && traits.some(x => c.includes(x)))) traits.push(t); }
    return { id: uid(), av: Av.gen(), name: Sim.name(pos, ov), pos, age, attr, pot: clamp(Math.max(pot, ov), 30, 99), traits, pool: traits.includes('pool') ? 5 : traits.includes('onetrick') ? 1 : randi(2, 4), form: randi(-1, 1), fat: randi(5, 20), morale: 60, sal: salOf(ov), con: 2, inj: 0, gp: 0, mvp: 0, rs: 0, joinAge: age };
  },

    const sal = C.players.reduce((a, p) => a + p.sal, 0), keep = Object.values(C.fac).reduce((a, l) => a + facKeep(l), 0), wage = Object.values(C.staff).reduce((a, l) => a + staffWage(l), 0);

    const T = C.train, im = { low: 0.6, mid: 1, high: 1.45 }[T.int], st = Sim.starters(C), rest = T.focus === 'rest';
    C.players.forEach(p => {

      if (!rest && !p.inj) {

        const g = 1.1 * ageF * potF * im * (1 + 0.08 * (C.fac.gym - 1) + 0.06 * C.staff.coach + C.skill.dev * 0.012) * (p.traits.includes('hard') ? 1.25 : p.traits.includes('lazy') ? 0.8 : 1) * (st.includes(p) ? 1.15 : 1) * (T.focus === 'chem' ? 0.5 : 1) * (p.morale < 35 ? 0.7 : 1);
        ATTR.forEach(a => p.attr[a] += T.focus === a ? g * 0.5 : T.focus === 'chem' ? g / 5 : g * 0.125);
        p.fat += ({ low: -5, mid: 3, high: 11 }[T.int] + (p.traits.includes('hard') ? 2 : 0)) * (p.traits.includes('iron') ? 0.7 : 1);
        if (T.int === 'high') Sim.mor(p, -1);

      if (p.age >= 25) { const a = pick(['mech', 'mech', 'lane', 'tf']); p.attr[a] -= p.age >= 27 ? rand(0.15, 0.4) : rand(0.03, 0.15); }

  /* ---------- 賽季結算 ---------- */

      if (pl === 1) { C.titles.push(`S${C.season} 頂級聯賽冠軍`); Ach.unlock('champ1'); if (C.history.length && C.history[C.history.length - 1].div === 1 && C.history[C.history.length - 1].place === 1) Ach.unlock('dyn'); }

const Match = {
  need: s => (s.bo + 1) / 2,
  over: s => s.x >= Match.need(s) || s.y >= Match.need(s),
  start(kind, opp, bo, title) {

  myPh(C, s, banIdx) {

  },
  opPh(s, banIdx) {

      ${last ? `<div class="text-center text-xs mb-2 ${last.win ? 'text-emerald-300' : 'text-rose-300'}">上一局${last.win ? '獲勝' : '落敗'}：對手使用 ${STRAT[last.os].e}${STRAT[last.os].n}，針對了 ${esc(last.bn)}</div>` : ''}

      <div class="text-xs text-slate-400 mt-3 mb-1">② 針對 Ban 人（英雄池越淺的選手越怕被針對）</div><div class="grid grid-cols-3 sm:grid-cols-5 gap-1.5">${bb}</div>
      <div class="grid grid-cols-2 gap-2 mt-4"><button class="btn btn-ghost" onclick="Match.auto()">⏩ 用此設定打完</button><button class="btn btn-amber" onclick="Match.play()">▶ 開始第 ${s.games.length + 1} 局</button></div>`, true);
  },
  pick(k) { S.C.series.sel.strat = k; Match.open(); },
  ban(i) { S.C.series.sel.ban = i; Match.open(); },
  core() {
    const C = S.C, s = C.series, o = s.opp, last = s.games[s.games.length - 1], st = Sim.starters(C);
    let os = wpick(STRK, k => o.style === k ? 0.6 : 0.2);
    if (last && last.win && chance(0.45)) os = STRK.find(k => STRAT[k].beats === last.ms) || os;
    const ob = chance(0.6) ? st.reduce((b, p, i) => Sim.ovr(p) > Sim.ovr(st[b]) ? i : b, 0) : st.reduce((b, p, i) => p.pool < st[b].pool ? i : b, 0);
    const my = Match.myPh(C, s, ob), op = Match.opPh(s, s.sel.ban), ms = s.sel.strat;
    const a = Match.pw(my, ms) + my.bonus + (STRAT[ms].beats === os ? 2.5 : 0), b = Match.pw(op, os) + (STRAT[os].beats === ms ? 2.5 : 0);
    const win = chance(1 / (1 + Math.exp(-(a - b) / 5)));
    const lines = [{ hdr: `— 第 ${s.games.length + 1} 局・${STRAT[ms].e}${STRAT[ms].n} vs ${STRAT[os].e}${STRAT[os].n} —` }]; let gold = 0;
    const add = (t, key, d, i) => { const fav = chance(clamp(0.5 + d / 20 + (win ? 0.15 : -0.15), 0.1, 0.9)), k = i == null ? randi(0, 4) : i; gold += fav ? randi(600, 1800) : -randi(600, 1800);
      lines.push({ t, good: fav, gold, txt: pick(LT[key + (fav ? 'g' : 'b')]).replace(/\{A\}/g, C.name).replace(/\{B\}/g, o.name).replace(/\{m\}/g, st[k].name).replace(/\{o\}/g, o.ps[k].name).replace(/\{j\}/g, st[1].name).replace(/\{oj\}/g, o.ps[1].name) }); };
    add(4, 'l', my.L - op.L, 0); add(8, 'l', my.L - op.L, 2); add(12, 'l', my.L - op.L, 3); add(18, 'm', my.M - op.M); add(24, 'm', my.M - op.M); add(30, 't', my.T - op.T); add(35, 't', my.T - op.T);
    if (win && gold < 1000) { gold = randi(1500, 3000); lines.push({ t: 38, good: true, gold, big: true, txt: `${C.name} 決勝團打出團滅，逆轉推平主堡！` }); }
    else if (!win && gold > -1000) { gold = -randi(1500, 3000); lines.push({ t: 38, good: false, gold, big: true, txt: `${o.name} 決勝團一波翻盤，推平主堡` }); }
    else lines.push({ t: 38, good: win, gold, big: true, txt: `${win ? C.name : o.name} 推平主堡，拿下這一局${win ? '！' : ''}` });
    st.forEach((p, i) => { const r = clamp(6.3 + (Sim.ovr(p) * my.ef[i] - op.rts[i]) / 7 + (win ? 0.8 : -0.6) + rand(-0.9, 0.9), 3, 9.9); s.rat[p.id] = (s.rat[p.id] || 0) + r; p.fat += 5 * (p.traits.includes('iron') ? 0.7 : 1); });
    s.games.push({ win, ms, os, bn: st[ob].name, ctr: STRAT[ms].beats === os ? 1 : STRAT[os].beats === ms ? -1 : 0 }); win ? s.x++ : s.y++;
    Sim.fix(C); Store.save();
    return { win, lines, os, ms, bn: st[ob].name };
  },
  play() {
    const C = S.C, s = C.series, x0 = s.x, y0 = s.y, g = Match.core(), gm = s.games[s.games.length - 1];
    broadcast({ title: `${s.title}・第 ${s.games.length} 局`, A: C.name, B: s.opp.name, x: x0, y: y0, lines: g.lines,
      endHtml: `<div class="text-center mt-1"><div class="text-xl font-black ${g.win ? 'text-emerald-300' : 'text-rose-300'} pop-in">${g.win ? '🏆 拿下這一局' : '💔 輸掉這一局'}（${s.x} : ${s.y}）</div>
        <div class="text-xs text-slate-400 mt-1">${gm.ctr > 0 ? '✅ 你的戰術剋制了對手' : gm.ctr < 0 ? '⚠️ 你的戰術被對手剋制' : '戰術互不剋制'}・對手針對了 ${esc(g.bn)}</div></div>` });
  },
  cont() { const s = S.C.series; if (!s) return G.next(); Match.over(s) ? Match.finish() : Match.open(); },
  auto() { const s = S.C.series; while (!Match.over(s)) Match.core(); Match.finish(); },
  finish() {
    const C = S.C, s = C.series; if (s.done) return Match.result();
    const win = s.x > s.y, reg = s.kind === 'reg', D = DIFF[C.diff], b0 = snapC(), st = Sim.starters(C).filter(Boolean), n = s.games.length || 1;
    const bonus = win ? Math.round((C.div === 1 ? 10000 : 4000) * (reg ? 1 : 2) * D.inc) : 0; C.funds += bonus;
    C.pop += (win ? (C.div === 1 ? 0.5 : 0.3) : -0.15) * (reg ? 1 : 2.5); Sim.teamMor(C, win ? 3 : -3); Sim.xp(C, win ? (reg ? 10 : 25) : 3);
    if (C.flags.trash) { C.pop += win ? 2 : -3; if (!win) Sim.teamMor(C, -3); delete C.flags.trash; }
    win ? C.stats.w++ : C.stats.l++; C.lastRes = win; C.buff = 0;
    let mvp = null; st.forEach(p => { const r = (s.rat[p.id] || 0) / n; p.gp += s.games.length; p.rs += r; if (s.games.length && (!mvp || r > mvp.r)) mvp = { id: p.id, r }; });
    if (mvp && win) { const p = C.players.find(x => x.id === mvp.id); p.mvp++; p.form = clamp(p.form + 1, -5, 5); s.mvp = mvp.id; }
    if (win && s.oppPw - s.myPw >= 8) Ach.unlock('under');
    Sim.fix(C); s.done = true; s.d = diffC(b0); s.bonus = bonus; Store.save(); Match.result();
  },
  result() {
    const C = S.C, s = C.series, win = s.x > s.y, n = s.games.length || 1;
    const rows = Sim.starters(C).filter(Boolean).map(p => { const r = (s.rat[p.id] || 0) / n; return `<div class="flex items-center gap-2 text-sm py-1 border-b border-slate-800">${Av.svg(p, 28)}<span class="w-10 text-xs text-slate-400">${p.pos}</span><span class="flex-1 font-bold">${esc(p.name)} ${s.mvp === p.id ? '<span class="chip chip-good">MVP</span>' : ''}</span><span class="font-mono ${r >= 7.5 ? 'text-emerald-300' : r < 5.5 ? 'text-rose-300' : ''}">${s.games.length ? r.toFixed(1) : '-'}</span></div>`; }).join('');
    openModal(`<div class="text-center"><div class="text-xs text-slate-400 tracking-widest">${esc(s.title)}</div>
      <div class="text-4xl mt-2">${win ? '🏆' : '💔'}</div><div class="text-2xl font-black mt-1 ${win ? 'text-emerald-300' : 'text-rose-300'}">${s.forfeit ? '人數不足，棄賽判負' : win ? '系列賽獲勝' : '系列賽落敗'}</div>

      <div class="text-xs text-slate-400">${s.games.map((g, i) => `G${i + 1} ${g.win ? '勝' : '敗'}`).join('・')}</div></div>
      <div class="mt-3">${rows}</div><div class="flex flex-wrap gap-1 mt-3">${s.d && s.d.length ? chips(s.d) : ''}</div>
      <button class="btn btn-cyan w-full mt-4" onclick="Sim.afterSeries('${s.kind}', ${win}, ${s.x}, ${s.y})">繼續</button>`);
  },
};

  return `<div class="grid lg:grid-cols-2 gap-3">
    <div class="card"><div class="card-title">🧑‍💼 ${esc(C.mgr)}・Lv${C.lv} <span class="text-slate-400 font-normal">經驗 ${Math.floor(C.xp)}/${100 + C.lv * 40}・技能點 ${C.sp}</span></div>
      ${SK.map(s => `<div class="stat-row mb-1.5"><span class="w-10 text-slate-400 text-xs shrink-0">${s[1]}</span><div class="bar"><div class="bg-cyan-400" style="width:${C.skill[s[0]] * 5}%"></div></div><span class="w-6 text-right font-mono text-xs">${C.skill[s[0]]}</span><button class="chip chip-good" ${C.sp && C.skill[s[0]] < 20 ? '' : 'disabled style="opacity:.3"'} onclick="Sim.upSkill('${s[0]}')">＋</button></div><div class="text-[10px] text-slate-500 -mt-1 mb-1.5 ml-12">${s[2]}</div>`).join('')}</div>
    <div class="card"><div class="card-title">💰 財務</div><div class="kv"><span class="text-slate-400">贊助（${esc(C.sponsor.name)}）</span><b class="text-emerald-300">+${money(f.sp)}</b></div><div class="kv"><span class="text-slate-400">直播與周邊</span><b class="text-emerald-300">+${money(f.st)}</b></div>
      <div class="kv"><span class="text-slate-400">選手薪資</span><b class="text-rose-300">-${money(f.sal)}</b></div><div class="kv"><span class="text-slate-400">設施維護</span><b class="text-rose-300">-${money(f.keep)}</b></div><div class="kv"><span class="text-slate-400">職員薪資</span><b class="text-rose-300">-${money(f.wage)}</b></div>
      <div class="kv"><span>每週淨額</span><b class="${f.net < 0 ? 'text-rose-300' : 'text-emerald-300'}">${money(f.net)}</b></div>
      <div class="text-[11px] text-slate-400 mt-2">贊助目標：${C.sponsor.tn}${C.sponsor.bonus ? `（獎金 ${money(C.sponsor.bonus)}）` : ''}${C.sponsor.pen ? `（未達罰 ${money(C.sponsor.pen)}）` : ''}。贏一場系列賽另有 ${money((C.div === 1 ? 10000 : 4000) * DIFF[C.diff].inc)} 勝場獎金。</div>
      <div class="mt-2">${spark(C.fin, '#34d399')}</div></div>
    <div class="card"><div class="card-title">🏗️ 設施</div><div class="space-y-2">${Object.entries(FAC).map(([k, d]) => { const l = C.fac[k]; return `<div class="flex items-center gap-2 bg-slate-800/60 rounded-xl p-2.5"><div class="text-2xl">${d.e}</div><div class="flex-1 min-w-0"><div class="text-sm font-bold">${d.n} <span class="text-cyan-300">Lv${l}</span></div><div class="text-[11px] text-slate-400">${d.d}・維護 ${money(facKeep(l))}/週</div></div>
      <button class="btn btn-ghost !py-1 text-xs" ${l >= 5 || C.funds < facCost(l) ? 'disabled' : ''} onclick="Sim.upFac('${k}')">${l >= 5 ? '滿級' : '升級 ' + money(facCost(l))}</button></div>`; }).join('')}</div></div>
    <div class="card"><div class="card-title">🧑‍🏫 職員</div><div class="space-y-2">${Object.entries(STAFF).map(([k, d]) => { const l = C.staff[k]; return `<div class="flex items-center gap-2 bg-slate-800/60 rounded-xl p-2.5"><div class="text-2xl">${d.e}</div><div class="flex-1 min-w-0"><div class="text-sm font-bold">${d.n} <span class="text-cyan-300">Lv${l}</span></div><div class="text-[11px] text-slate-400">${d.d}・薪資 ${money(staffWage(l))}/週</div></div>
      <div class="flex flex-col gap-1"><button class="btn btn-ghost !py-1 text-xs" ${l >= 3 || C.funds < staffCost(l) ? 'disabled' : ''} onclick="Sim.upStaff('${k}')">${l >= 3 ? '滿級' : (l ? '升級 ' : '聘請 ') + money(staffCost(l))}</button>${l ? `<button class="text-[10px] text-slate-500 hover:text-rose-300" onclick="Sim.downStaff('${k}')">降一級</button>` : ''}</div></div>`; }).join('')}</div></div></div>`;
}
function tabLeague(C) {
  const tb = Sim.table(C), info = C.staff.analyst >= 2;
  const rows = tb.map((t, i) => `<tr class="${t.me ? 'bg-cyan-500/15 font-bold' : ''} border-b border-slate-800"><td class="py-1.5 pl-2 ${i < 4 ? 'text-amber-300' : i >= 6 ? 'text-rose-300' : ''}">${i + 1}</td><td>${esc(t.name)}</td><td class="text-center">${t.w}-${t.l}</td><td class="text-center">${t.gw - t.gl >= 0 ? '+' : ''}${t.gw - t.gl}</td><td class="text-center font-mono">${t.me ? Sim.myPw(C).toFixed(0) : info ? t.pw.toFixed(0) : '~' + Math.round(t.pw / 5) * 5}</td><td class="text-center">${t.me ? '' : STRAT[t.style].e}</td></tr>`).join('');
  const nx = C.phase === 'reg' ? C.lg.sched.slice(C.round, C.round + 4).map((rd, i) => { const m = rd.find(m => m.includes('me')), o = Sim.team(C, m[0] === 'me' ? m[1] : m[0]); return `<div class="kv"><span class="text-slate-400">第 ${C.round + i + 1} 輪</span><span>${esc(o.name)}（${o.w}-${o.l}）</span></div>`; }).join('') : '<div class="text-sm text-slate-500">例行賽未進行中</div>';
  return `<div class="grid lg:grid-cols-2 gap-3"><div class="card"><div class="card-title">🏆 ${DIVN[C.div]} 積分榜</div><table class="w-full text-sm"><thead><tr class="text-[11px] text-slate-400"><th class="text-left pl-2">#</th><th class="text-left">隊伍</th><th>勝敗</th><th>局差</th><th>戰力</th><th>風格</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="text-[11px] text-slate-500 mt-2">${C.div === 2 ? '前 4 名進季後賽；冠軍直接升級，亞軍打升降賽。' : '前 4 名進季後賽，冠亞軍進世界賽；第 7 名打保級戰，第 8 名直接降級。'}</div></div>
    <div class="space-y-3"><div class="card"><div class="card-title">📅 接下來的賽程</div>${nx}</div>
    <div class="card"><div class="card-title">🗂️ ${DIVN[C.div === 1 ? 2 : 1]}</div><div class="flex flex-wrap gap-1">${[...C.other].sort((a, b) => b.pw - a.pw).map(t => `<span class="chip chip-n">${esc(t.name)} ~${Math.round(t.pw / 5) * 5}</span>`).join('')}</div></div>
    <div class="card"><div class="card-title">📚 歷年成績</div>${C.history.map(h => `<div class="kv"><span class="text-slate-400">S${h.season} ${DIVN[h.div]}</span><span>${h.w}勝${h.l}敗・${h.res}</span></div>`).join('') || '<div class="text-sm text-slate-500">第一個賽季還沒打完</div>'}</div></div></div>`;
}
function tabLog(C) {
  const a = Ach.all();
  return `<div class="grid lg:grid-cols-2 gap-3"><div class="card"><div class="card-title">📜 紀錄</div>${logList('max-h-96')}</div>
    <div class="card"><div class="card-title">🏅 成就（${ACH.filter(x => a[x.id]).length}/${ACH.length}）</div><div class="grid grid-cols-2 gap-1.5">${ACH.map(x => `<div class="rounded-xl p-2 border text-xs ${a[x.id] ? 'border-amber-400/50 bg-amber-500/10' : 'border-slate-700 opacity-50'}"><div class="font-bold">${x.e} ${x.n}</div><div class="text-[10px] text-slate-400">${x.d}</div></div>`).join('')}</div>
    <button class="btn btn-ghost w-full mt-4 text-xs" onclick="UI.retire()">🎤 退休並結算生涯</button></div></div>`;
}
function renderOver(el) {
  const C = S.C, sc = C.titles.reduce((a, t) => a + (t.includes('世界') ? 500 : t.includes('頂級') ? 200 : 40), 0) + C.history.reduce((a, h) => a + (h.div === 1 ? 20 : 4), 0) + C.stats.w;
  const g = sc >= 900 ? ['S', '傳奇教頭', 'text-amber-300'] : sc >= 450 ? ['A', '冠軍教練', 'text-fuchsia-300'] : sc >= 200 ? ['B', '頂級聯賽名帥', 'text-cyan-300'] : sc >= 80 ? ['C', '稱職的經理', 'text-emerald-300'] : ['D', '曇花一現', 'text-slate-300'];
  el.innerHTML = `<div class="max-w-2xl mx-auto card fade-in text-center"><div class="text-5xl">${S.over.why.includes('破產') ? '💥' : '🎤'}</div><h2 class="text-2xl font-black mt-2">${esc(C.name)}・${esc(C.mgr)} 的生涯</h2><p class="text-sm text-slate-400 mt-1">${S.over.why}</p>
    <div class="text-6xl font-black mt-4 ${g[2]} pop-in">${g[0]}</div><div class="font-bold ${g[2]}">${g[1]}</div>
    <div class="grid grid-cols-3 gap-2 mt-4 text-sm"><div class="bg-slate-800/60 rounded-xl p-2"><div class="text-[10px] text-slate-400">執教賽季</div><b>${C.history.length}</b></div><div class="bg-slate-800/60 rounded-xl p-2"><div class="text-[10px] text-slate-400">系列賽戰績</div><b>${C.stats.w}勝${C.stats.l}敗</b></div><div class="bg-slate-800/60 rounded-xl p-2"><div class="text-[10px] text-slate-400">冠軍數</div><b>${C.titles.length}</b></div></div>
    <div class="text-left mt-4">${C.titles.map(t => `<div class="text-sm text-amber-300">🏆 ${t}</div>`).join('')}${C.history.map(h => `<div class="kv"><span class="text-slate-400">S${h.season} ${DIVN[h.div]}</span><span>${h.w}勝${h.l}敗・${h.res}</span></div>`).join('')}</div>
    <button class="btn btn-amber w-full mt-5" onclick="Store.clear();S=null;CR=null;render()">🔁 開始新的生涯</button></div>`;
}

const Menu = {
  save() {
    if (!S) return toast('還沒開始遊戲');
    const slot = i => { const d = Store.slot(i); return `<div class="flex items-center gap-2 bg-slate-800/70 rounded-xl p-2.5"><div class="flex-1 min-w-0"><div class="text-sm font-bold">欄位 ${i}</div><div class="text-[11px] text-slate-400 truncate">${d ? `${esc(d.label)}・${new Date(d.at).toLocaleString('zh-TW')}` : '（空）'}</div></div>
      <button class="btn btn-cyan !py-1 text-xs" onclick="Menu.doSave(${i})">存入</button><button class="btn btn-ghost !py-1 text-xs" ${d ? '' : 'disabled'} onclick="Menu.doLoad(${i})">讀取</button></div>`; };
    openModal(`<div class="card-title text-base">💾 存檔管理</div><p class="text-xs text-slate-400 mb-3">遊戲會自動存檔。手動欄位可以保留特定時間點。</p><div class="space-y-2">${[1, 2, 3].map(slot).join('')}</div>
      <div class="text-xs text-slate-400 mt-4 mb-1">📤 匯出 / 📥 匯入（換裝置或備份用）</div><textarea id="ioBox" class="w-full h-24 text-[10px] font-mono bg-slate-950 border border-slate-700 rounded-xl p-2" placeholder="按「匯出」產生存檔碼，或貼上存檔碼後按「匯入」"></textarea>
      <div class="grid grid-cols-2 gap-2 mt-2"><button class="btn btn-ghost" onclick="Menu.exp()">📤 匯出</button><button class="btn btn-ghost" onclick="Menu.imp()">📥 匯入</button></div><button class="btn btn-ghost w-full mt-3" onclick="closeModal()">關閉</button>`);
  },
  doSave(i) { if (Store.saveSlot(i)) { toast(`已存到欄位 ${i}`, 'good'); Menu.save(); } else toast('存檔失敗', 'bad'); },
  doLoad(i) { const d = Store.slot(i); if (!d) return; S = d.data; Menu._fix(); closeModal(); Store.save(); render(); toast(`已讀取欄位 ${i}`, 'good'); if (S.queue.length) G.next(); },
  exp() { const box = $('#ioBox'); box.value = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); box.select(); try { navigator.clipboard.writeText(box.value).then(() => toast('已複製存檔碼', 'good'), () => toast('已產生存檔碼，請手動複製')); } catch (e) { toast('已產生存檔碼，請手動複製'); } },
  imp() { try { const d = JSON.parse(decodeURIComponent(escape(atob($('#ioBox').value.trim())))); if (!d || !d.C || !d.C.lg) throw 0; S = d; Menu._fix(); closeModal(); Store.save(); render(); toast('匯入成功', 'good'); if (S.queue.length) G.next(); } catch (e) { toast('存檔碼格式錯誤', 'bad'); } },
  _fix() { S.queue = S.queue || []; if (S.cur) { S.queue.unshift(S.cur); S.cur = null; } },
  help() {
    openModal(`<div class="card-title text-base">❓ 遊戲說明</div><div class="text-sm space-y-3 leading-relaxed">
      <div><b class="text-cyan-300">🎯 目標</b><br>從次級聯賽出發，升上頂級聯賽、拿下聯賽冠軍，最後挑戰世界賽。</div>
      <div><b class="text-cyan-300">📅 每週流程</b><br>設定訓練課表 → 用 2 次行動（研究對手、團建、商業活動、球探、談話、特訓）→ 進入比賽日。每週結算收支、成長、疲勞與傷病。</div>
      <div><b class="text-cyan-300">🧠 BP 室</b><br>每一局開打前選戰術與 Ban 人。三種戰術互相剋制：前期壓制 ▶ 團戰決勝 ▶ 運營分推 ▶ 前期壓制。戰術也要配合陣容的長處（對線／意識／團戰）。</div>
      <div><b class="text-cyan-300">👥 選手</b><br>五項能力、潛力、狀態、疲勞、士氣、合約。年輕選手成長快，25 歲後下滑。未考察的市場選手只看得到模糊戰力。強者不會來聲望低或次級聯賽的隊伍。</div>
      <div><b class="text-cyan-300">💰 財務</b><br>薪資隨能力指數成長，明星很貴。轉會窗只在休賽季與季中第 7、8 輪開啟，其他時間只能簽自由選手、賣人會被壓價。資金連續 8 週為負或低於 -$150,000 就破產。</div>
      <div><b class="text-cyan-300">🏁 賽季</b><br>14 輪例行賽（BO3）→ 前四季後賽（BO5）→ 升降賽或世界賽 → 4 週休賽季（續約、青訓、贊助）。</div></div>
      <button class="btn btn-cyan w-full mt-4" onclick="closeModal()">了解</button>`);
  },
  restart() { openModal(`<div class="text-center"><h3 class="text-lg font-bold">確定要重新開始嗎？</h3><p class="text-sm text-slate-400 mt-2">自動存檔會被清除（手動存檔欄位與成就會保留）。</p><div class="grid grid-cols-2 gap-2 mt-4"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-rose" onclick="closeModal();Store.clear();S=null;CR=null;render()">重新開始</button></div></div>`); },
};

S = Store.load();
if (S && (!S.C || !S.C.lg || !S.queue)) S = null;
if (S) Menu._fix();
render();
if (S && S.queue.length) G.next();

</script>
</body>
</html>
