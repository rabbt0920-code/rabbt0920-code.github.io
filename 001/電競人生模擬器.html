<script>
'use strict';
/* ===== core.js ===== */
/* ===================== core：工具、存檔、UI、轉播、事件引擎 ===================== */
const $ = s => document.querySelector(s);
const rand = (a, b) => Math.random() * (b - a) + a;

const pick = a => a[Math.floor(Math.random() * a.length)];

const fmt = n => Math.round(n).toLocaleString('zh-TW');
const money = n => (n < 0 ? '-$' : '$') + fmt(Math.abs(n));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const strip = s => String(s).replace(/<[^>]*>/g, '');
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function wpick(arr, wf) {
  const ws = arr.map(wf); const tot = ws.reduce((a, b) => a + b, 0); if (tot <= 0) return null;
  let r = Math.random() * tot;
  for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}
const uid = () => Math.random().toString(36).slice(2, 9);
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;

const KEY = 'esports_mgr_v1', ACH_KEY = 'esports_mgr_ach_v1';
const SAVE_VERSION = 9;

// 將所有舊版資料升級到目前資料結構；保留原本的 localStorage key 以相容 3.0。
function migrateSave(data) {
  if (!data || typeof data !== 'object' || !data.C || typeof data.C !== 'object') throw new Error('存檔缺少俱樂部資料');
  const oldVersion = Number(data.schemaVersion || data.v || 1);
  const C = data.C;
  C.players = Array.isArray(C.players) ? C.players : [];
  C.market = Array.isArray(C.market) ? C.market : [];
  C.youth = Array.isArray(C.youth) ? C.youth : [];
  const normalizePlayer = p => {
    if (!p || typeof p !== 'object') return;
    p.attr = p.attr && typeof p.attr === 'object' ? p.attr : {};
    ATTR.forEach(a => { const n = Number(p.attr[a]); p.attr[a] = Number.isFinite(n) ? clamp(n, 15, 99) : 20; });
    p.traits = Array.isArray(p.traits) ? p.traits.filter(t => !!TRAITS[t]) : [];
    p.fat = clamp(Number.isFinite(Number(p.fat)) ? Number(p.fat) : 10, 0, 100);
    p.morale = clamp(Number.isFinite(Number(p.morale)) ? Number(p.morale) : 60, 0, 100);
    p.form = clamp(Number.isFinite(Number(p.form)) ? Number(p.form) : 0, -5, 5);
    p.pot = clamp(Number.isFinite(Number(p.pot)) ? Number(p.pot) : avg(ATTR.map(a => p.attr[a])), 15, 99);
    p.developmentPath = DEV_PATHS[p.developmentPath] ? p.developmentPath : 'balanced';
    p.trainFocus = ['auto', ...ATTR].includes(p.trainFocus) ? p.trainFocus : 'auto';
    if (typeof HeroManager !== 'undefined') HeroManager.ensure(p);
    p.career = p.career && typeof p.career === 'object' ? p.career : CareerManager.emptyCareer();
    p.careerHistory = Array.isArray(p.careerHistory) ? p.careerHistory.slice(-40) : [];
    if (!Number.isFinite(Number(p.inj))) p.inj = 0;
    if (!Number.isFinite(Number(p.con))) p.con = 1;
  };
  C.players.forEach(normalizePlayer);
  C.market.forEach(normalizePlayer);
  C.youth.forEach(normalizePlayer);
  if (typeof RelationshipManager !== 'undefined') RelationshipManager.init(C);
  C.train = C.train && typeof C.train === 'object' ? C.train : {};
  if (!['lane', 'tf', 'mech', 'iq', 'men', 'chem', 'rest'].includes(C.train.focus)) C.train.focus = 'mech';
  if (!['low', 'mid', 'high'].includes(C.train.int)) C.train.int = 'mid';
  C.skill = C.skill && typeof C.skill === 'object' ? C.skill : { tac: 6, dev: 6, neg: 6, man: 6 };
  ['tac', 'dev', 'neg', 'man'].forEach(k => { if (!Number.isFinite(Number(C.skill[k]))) C.skill[k] = 6; });
  C.staff = Object.assign({ coach: 0, analyst: 0, scout: 0, physio: 0 }, C.staff || {});
  C.fac = Object.assign({ gym: 1, dorm: 1, academy: 1, studio: 1, physical: 0, lab: 0 }, C.fac || {});
  C.brand = ['champion','academy','media','competitive','budget'].includes(C.brand) ? C.brand : 'competitive';

  C.aiWorld = C.aiWorld && typeof C.aiWorld === 'object' ? C.aiWorld : { clubs: {}, offers: [], lastWindowSeason: 0 };
  C.aiWorld.clubs = C.aiWorld.clubs && typeof C.aiWorld.clubs === 'object' ? C.aiWorld.clubs : {};
  C.aiWorld.offers = Array.isArray(C.aiWorld.offers) ? C.aiWorld.offers : [];
  C.lineup = C.lineup && typeof C.lineup === 'object' ? C.lineup : {};
  C.relationships = C.relationships && typeof C.relationships === 'object' ? C.relationships : {};
  C.captain = C.captain || null;
  C.careerEventLast = C.careerEventLast && typeof C.careerEventLast === 'object' ? C.careerEventLast : {};
  C.careerArchive = Array.isArray(C.careerArchive) ? C.careerArchive.slice(-60) : [];

  if (!C.seasonArchive.length && Array.isArray(C.history) && C.history.length) {
    C.seasonArchive = C.history.slice(-100).reverse().map(h => ({ season:h.season, div:h.div, place:h.place, rank:h.rank, w:h.w, l:h.l, res:h.res, prize:null, teamPower:null, fans:null, funds:null, brand:null, mvp:null, champion:/冠軍/.test(h.res||''), worldChampion:/世界賽.*冠軍/.test(h.res||''), promoted:/升級/.test(h.res||''), relegated:/降級/.test(h.res||'') }));
  }

  data.log = Array.isArray(data.log) ? data.log : [];
  data.queue = Array.isArray(data.queue) ? data.queue : [];
  data.schemaVersion = SAVE_VERSION;
  data.v = SAVE_VERSION;

const Store = {
  save() { try { if (S) { S.schemaVersion = SAVE_VERSION; S.v = SAVE_VERSION; localStorage.setItem(KEY, JSON.stringify(S)); } } catch (e) { console.warn('自動存檔失敗：', e); } },
  load() {
    try {
      const raw = localStorage.getItem(KEY); if (!raw) return null;
      const parsed = JSON.parse(raw), oldVersion = Number(parsed.schemaVersion || parsed.v || 1);
      const upgraded = migrateSave(parsed);
      if (oldVersion < SAVE_VERSION) { try { localStorage.setItem(KEY + '_backup_v' + oldVersion, raw); } catch (e) {} }
      return upgraded;
    } catch (e) { console.error('存檔讀取或升級失敗：', e); return null; }
  },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
  sk: i => KEY + '_slot' + i,
  label() { return S && S.C ? `🏢 ${S.C.name}・第${S.C.season}賽季 ${DIVN[S.C.div]}` : ''; },
  saveSlot(i) { try { if (S) { S.schemaVersion = SAVE_VERSION; S.v = SAVE_VERSION; } localStorage.setItem(Store.sk(i), JSON.stringify({ at: Date.now(), label: Store.label(), data: S })); return true; } catch (e) { return false; } },
  slot(i) { try { const d = localStorage.getItem(Store.sk(i)); return d ? JSON.parse(d) : null; } catch (e) { return null; } },
};
const Ach = {
  all() { try { return JSON.parse(localStorage.getItem(ACH_KEY) || '{}'); } catch (e) { return {}; } },
  unlock(id) {

/* ---------- 變化提示 ---------- */
const LBL = { funds: '資金', pop: '聲望', chem: '默契', morale: '平均士氣', tac: '戰術', dev: '育成', neg: '談判', man: '管理' };
function snapC() { const C = S.C; return { funds: C.funds, pop: C.pop, chem: C.chem, morale: avg(C.players.map(p => p.morale)) }; }
function diffC(b) {
  const o = snapC(), out = [];
  for (const k in b) { const d = o[k] - b[k]; if (Math.abs(d) >= (k === 'funds' ? 1 : 0.5)) out.push([k, d]); }
  return out;
}
function chips(list) {
  return list.map(([k, d]) => `<span class="chip ${d > 0 ? 'chip-good' : 'chip-bad'}">${LBL[k] || k} ${d >= 0 ? '+' : '-'}${k === 'funds' ? '$' : ''}${k === 'funds' ? fmt(Math.abs(d)) : Math.abs(d).toFixed(k === 'pop' ? 1 : 0)}</span>`).join(' ');
}
function popFx(list, title) {
  if (!list || !list.length) return;
  const box = $('#fx'); if (!box) return;
  const el = document.createElement('div'); el.className = 'fx-card';
  el.innerHTML = `<div class="text-[11px] text-slate-400 mb-1">${esc(title)}</div><div class="flex flex-wrap gap-1">${chips(list)}</div>`;
  box.prepend(el);
  setTimeout(() => el.classList.add('fx-out'), 2600); setTimeout(() => el.remove(), 3200);
  while (box.children.length > 3) box.lastChild.remove();
}
function toast(msg, type = 'info') {
  const t = $('#toast'); if (!t) return;
  t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] px-4 py-2 rounded-xl text-sm shadow-xl border fade-in max-w-[92vw] ' +
    ({ bad: 'bg-rose-950 border-rose-500/60', gold: 'bg-amber-950 border-amber-400/60', good: 'bg-emerald-950 border-emerald-500/60' }[type] || 'bg-slate-800 border-cyan-500/50');
  t.textContent = msg; clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2600);
}
function openModal(html, wide) {
  const box = $('#modalBox');
  box.className = 'card w-full max-h-[92vh] overflow-y-auto fade-in ' + (wide ? 'max-w-3xl' : 'max-w-lg');
  box.innerHTML = html; const m = $('#modal'); m.classList.remove('hidden'); m.classList.add('flex');
}
function closeModal() { stopBC(); const m = $('#modal'); m.classList.add('hidden'); m.classList.remove('flex'); }
function log(msg, type = 'info') {
  if (!S || !S.C) return;
  S.log.unshift({ stamp: `S${S.C.season}·${phaseShort(S.C)}`, msg, type }); if (S.log.length > 150) S.log.length = 150;
}
const LOGC = { info: 'text-slate-300', good: 'text-emerald-300', bad: 'text-rose-300', gold: 'text-amber-300', sys: 'text-cyan-300' };
function logList(h, n) {
  return `<div class="${h} overflow-y-auto space-y-1.5 pr-1 text-xs">${S.log.slice(0, n || 150).map(l => `<div class="${LOGC[l.type] || ''}"><span class="text-slate-500 mr-1">[${l.stamp}]</span>${l.msg}</div>`).join('') || '<div class="text-slate-500">尚無紀錄</div>'}</div>`;
}
function spark(vals, color = '#22d3ee', h = 48) {
  if (!vals || vals.length < 2) return '<div class="text-xs text-slate-500 py-3 text-center">資料累積中…</div>';
  const mn = Math.min(...vals), mx = Math.max(...vals), r = (mx - mn) || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 100).toFixed(2)},${(h - 4 - (v - mn) / r * (h - 8)).toFixed(2)}`).join(' ');
  return `<svg viewBox="0 0 100 ${h}" preserveAspectRatio="none" class="w-full" style="height:${h}px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
    <div class="flex justify-between text-[10px] text-slate-500"><span>${money(mn)}</span><span>${money(mx)}</span></div>`;
}

function bcLine(l) {

function stepBC() { if (!BC) return; if (BC.i >= BC.lines.length) return endBC(); bcLine(BC.lines[BC.i++]); }
function skipBC() { if (!BC) return; clearInterval(BC.timer); while (BC.i < BC.lines.length) bcLine(BC.lines[BC.i++]); endBC(); }

/* ---------- 事件引擎 ---------- */
const RES = { g: ['🌟 大成功', 'text-amber-300'], k: ['✅ 成功', 'text-emerald-300'], f: ['❌ 失敗', 'text-rose-300'], b: ['💥 大失敗', 'text-rose-400'] };
const chkRate = (C, chk) => clamp(0.5 + (C.skill[chk.st] - chk.diff) * 0.06 + (C.luck - 50) / 400 - DIFF[C.diff].chk, 0.05, 0.95);
function rollCheck(C, chk) { const p = chkRate(C, chk), r = Math.random(); return r < p * 0.2 ? 'g' : r < p ? 'k' : r < p + (1 - p) * 0.75 ? 'f' : 'b'; }
function evCtx(ref) { const C = S.C, c = {}; for (const k in ref.ctx || {}) c[k] = C.players.find(p => p.id === ref.ctx[k]); return c; }
function showEvent() {
  const ref = S.cur, C = S.C, ev = EVM[ref.id], ctx = evCtx(ref);
  if (!ev || Object.values(ctx).some(v => !v)) { S.cur = null; return G.next(); }
  const T = s => typeof s === 'function' ? s(C, ctx) : s;
  const chs = ev.choices(C, ctx);
  openModal(`<div class="text-xs tracking-widest text-cyan-300">${ev.tag || '🏢 經營事件'}</div>
    <h3 class="text-xl font-black mt-1 mb-2">${ev.e} ${T(ev.title)}</h3>
    <p class="text-sm text-slate-300 leading-relaxed whitespace-pre-line mb-4">${T(ev.text)}</p>
    <div class="space-y-2">${chs.map((c, i) => {
      const ok = !c.req || c.req(C, ctx);
      const ck = c.check ? `<div class="text-[11px] mt-0.5 font-normal text-cyan-200/80">🎲 ${LBL[c.check.st]}判定・成功率約 ${Math.round(chkRate(C, c.check) * 100)}%</div>` : '';
      const rq = !ok && c.reqTxt ? `<div class="text-[11px] font-normal text-rose-300 mt-0.5">🔒 ${c.reqTxt}</div>` : '';
      return `<button class="choice" ${ok ? '' : 'disabled'} onclick="chooseEv(${i})">${c.t}${ck}${rq}</button>`;
    }).join('')}</div>`);
}
function chooseEv(i) {
  const ref = S.cur; if (!ref) return;
  const C = S.C, ev = EVM[ref.id], ctx = evCtx(ref), c = ev.choices(C, ctx)[i];
  if (!c || (c.req && !c.req(C, ctx))) return;
  const b = snapC(); let out, res = null;
  if (c.check) { res = rollCheck(C, c.check); out = c.out[res] || c.out[res === 'g' ? 'k' : 'f']; } else out = [c.txt, c.fx];
  const T = s => typeof s === 'function' ? s(C, ctx) : s;
  const title = strip(T(ev.title));
  if (out[1]) out[1](C, ctx);
  const resTxt = T(out[0]);
  Sim.fix(C);
  C.evSeen[ref.id] = (C.evSeen[ref.id] || 0) + 1; C.evLast[ref.id] = C.tick;
  S.cur = null;
  const d = diffC(b);
  log(`${ev.e} ${title}：${strip(c.t)}${res ? `（${RES[res][0]}）` : ''}`, res === 'b' || res === 'f' ? 'bad' : 'info');
  openModal(`<div class="text-xs text-slate-400">${ev.e} ${title}</div>
    <div class="text-sm text-slate-400 mt-1">你選擇：<span class="text-slate-200">${strip(c.t)}</span></div>
    ${res ? `<div class="text-2xl font-black mt-3 ${RES[res][1]} pop-in">${RES[res][0]}</div>` : ''}
    <p class="text-base mt-3 leading-relaxed">${resTxt}</p>
    <div class="flex flex-wrap gap-1 mt-4">${d.length ? chips(d) : '<span class="chip chip-n">沒有明顯的數值變化</span>'}</div>
    <button class="btn btn-cyan w-full mt-5" onclick="G.next()">繼續</button>`);
  checkAch(); Store.save();
}

  sell(id) { const C = S.C, p = C.players.find(x => x.id === id); if (!p) return; const v = Sim.sellPrice(p, C); C.funds += v; C.stats.sold += v; if (v >= 500000) Ach.unlock('sell'); Sim.removeP(C, id, '轉會離隊'); log(`💸 賣出 ${p.name}，進帳 ${money(v)}`, 'good'); Store.save(); closeModal(); render(); toast(`賣出 ${p.name}：${money(v)}`, 'good'); },
  renewAsk(p, C) { return Math.round(Sim.ask(p, C) * (p.morale < 40 ? 1.2 : 1) * (p.rhag || 1) / 50) * 50; },
  renew(id, hag) {
    const C = S.C, p = C.players.find(x => x.id === id); if (!p) return;
    if (hag) { if (p.rhag) return; const r = rollCheck(C, { st: 'neg', diff: 11 }); if (r === 'g' || r === 'k') { p.rhag = 0.88; toast('對方同意降價', 'good'); } else { p.rhag = 1.1; Sim.mor(p, -8); toast('砍價失敗，對方反而提高要價', 'bad'); } Store.save(); return UI.playerModal(id); }
    p.sal = Sim.renewAsk(p, C); p.con = 2; delete p.exp; delete p.rhag; Sim.mor(p, 6); log(`📝 與 ${p.name} 續約 2 季，週薪 ${money(p.sal)}`); Store.save(); UI.playerModal(id); render(); toast('續約完成', 'good');
  },
  setStarter(id) {
    const C = S.C, p = C.players.find(x => x.id === id); if (!p) return; if (p.inj) return toast('他目前無法出賽', 'bad');
    const cur = POS.find(pos => C.lineup[pos] === id); if (cur) C.lineup[cur] = null;
    C.lineup[p.pos] = id; Store.save(); closeModal(); render();
  },
  unStarter(id) { const C = S.C; POS.forEach(pos => { if (C.lineup[pos] === id) C.lineup[pos] = null; }); Store.save(); closeModal(); render(); },
  upFac(k) { const C = S.C, l = C.fac[k]; if (l >= 5) return; const disc = (C.sponsor && C.sponsor.facilityDiscount || 0) + (C.brand === 'budget' ? 0.05 : 0); const c = Math.round(facCost(l) * (1 - Math.min(0.25, disc))); if (C.funds < c) return toast('資金不足', 'bad'); C.funds -= c; C.fac[k]++; log(`🏗️ ${FAC[k].n} 升級到 Lv${C.fac[k]}（${money(c)}）`, 'good'); Store.save(); render(); },
  upStaff(k) { const C = S.C, l = C.staff[k]; if (l >= 3) return; const c = staffCost(l); if (C.funds < c) return toast('資金不足', 'bad'); C.funds -= c; C.staff[k]++; log(`🧑‍💼 ${STAFF[k].n} 提升到 Lv${C.staff[k]}`, 'good'); Store.save(); render(); },
  downStaff(k) { const C = S.C; if (C.staff[k] <= 0) return; C.staff[k]--; log(`📉 ${STAFF[k].n} 降為 Lv${C.staff[k]}（節省薪資）`); Store.save(); render(); },
  upSkill(k) { const C = S.C; if (C.sp <= 0 || C.skill[k] >= 20) return; C.sp--; C.skill[k]++; Store.save(); render(); },
};

/* ===== training-manager.js：第二階段訓練與育成公式集中管理 ===== */
const TrainingManager = {
  ageFactor(age) { return age <= 18 ? 1.3 : age <= 21 ? 1 : age <= 23 ? 0.7 : age <= 25 ? 0.35 : 0; },
  fatigueEfficiency(fat) {
    if (fat <= 40) return 1;
    if (fat <= 60) return 1 - (fat - 40) * 0.0075;
    if (fat <= 75) return 0.85 - (fat - 60) * (0.20 / 15);
    if (fat <= 90) return 0.65 - (fat - 75) * (0.25 / 15);
    return 0.30;
  },
  weights(p, teamFocus) {
    const w = {};
    if (ATTR.includes(teamFocus)) ATTR.forEach(a => w[a] = a === teamFocus ? 0.5 : 0.125);
    else ATTR.forEach(a => w[a] = 0.2);
    // 個人專項與全隊課表採 30/70 混合，避免個人訓練完全無視團隊安排。
    if (ATTR.includes(p.trainFocus) && ATTR.includes(teamFocus)) {
      ATTR.forEach(a => { w[a] = w[a] * 0.7 + (a === p.trainFocus ? 0.3 : 0); });
    } else if (ATTR.includes(p.trainFocus) && teamFocus !== 'chem') {
      ATTR.forEach(a => { w[a] = w[a] * 0.7 + (a === p.trainFocus ? 0.3 : 0); });
    }
    const path = DEV_PATHS[p.developmentPath] || DEV_PATHS.balanced;
    Object.entries(path.boost).forEach(([a, m]) => { w[a] *= m; });
    const total = ATTR.reduce((sum, a) => sum + w[a], 0) || 1;
    ATTR.forEach(a => { w[a] /= total; });
    return w;
  },
  growthBudget(p, C, isStarter) {
    const T = C.train || { focus: 'mech', int: 'mid' };
    if (T.focus === 'rest' || p.inj) return { growth: 0, efficiency: this.fatigueEfficiency(p.fat) };
    const intensity = { low: 0.6, mid: 1, high: 1.45 }[T.int] || 1;
    const ageF = this.ageFactor(p.age), ovr = Sim.ovr(p);
    const potF = clamp((p.pot - ovr) / 12, 0, 1.4);
    const facility = 1 + 0.08 * ((C.fac && C.fac.gym) - 1) + 0.06 * (C.staff && C.staff.coach) + (C.skill && C.skill.dev || 0) * 0.012;
    const trait = p.traits.includes('hard') ? 1.25 : p.traits.includes('lazy') ? 0.8 : 1;
    const starter = isStarter ? 1.15 : 1;
    const morale = p.morale < 35 ? 0.7 : 1;
    const fatigue = this.fatigueEfficiency(p.fat);
    const focus = T.focus === 'chem' ? 0.5 : 1;
    // 長期平衡：高能力選手成長逐漸趨緩，避免多賽季後全員快速碰到上限。
    const softCap = clamp((94 - ovr) / 24, 0.28, 1);
    return { growth: 1.1 * ageF * potF * intensity * facility * trait * starter * morale * fatigue * focus * softCap, efficiency: fatigue, softCap };
  },
  applyFatigue(p, C, rest) {
    const T = C.train || { int: 'mid' };
    const recovery = 8 + 1.5 * ((C.fac && C.fac.dorm) - 1) + 2 * (C.staff && C.staff.physio) + 0.75 * ((C.fac && C.fac.physical) || 0);
    if (rest) p.fat -= 30 + 1.5 * ((C.fac && C.fac.dorm) - 1) + 2 * (C.staff && C.staff.physio) + 0.75 * ((C.fac && C.fac.physical) || 0);
    else {
      // 傷兵不參與訓練，只享有日常恢復；健康選手才承擔課表疲勞。
      if (!p.inj) {
        const trainingCost = ({ low: -5, mid: 3, high: 11 }[T.int] ?? 3) + (p.traits.includes('hard') ? 2 : 0);
        p.fat += trainingCost * (p.traits.includes('iron') ? 0.7 : 1);
      }
      p.fat -= recovery;
    }
    p.fat = clamp(p.fat, 0, 100);
    if (!rest && p.fat >= 75) Sim.mor(p, -0.5);
    return p.fat;
  },
  injuryChance(p, C, T, rest) {
    if (rest) return 0;
    let rate = 0.002 + Math.max(0, p.fat - 55) * 0.0015 + (T.int === 'high' ? 0.006 : 0);
    rate *= p.traits.includes('glass') ? 2 : 1;
    rate *= 1 - 0.2 * ((C.staff && C.staff.physio) || 0);
    rate *= 1 - 0.08 * ((C.fac && C.fac.physical) || 0);
    return clamp(rate, 0.001, 0.15);
  },
  applyWeekly(p, C, options = {}) {
    const isStarter = !!options.isStarter, rest = !!options.rest;
    const budget = this.growthBudget(p, C, isStarter);
    if (budget.growth > 0) {
      const weights = this.weights(p, C.train.focus);
      ATTR.forEach(a => { p.attr[a] += budget.growth * weights[a]; });
      if (C.train.int === 'high') Sim.mor(p, -1);
    }
    this.applyFatigue(p, C, rest);
    return budget;
  },
};

function checkAch() { const C = S.C; if (!C) return; if (C.stats.w >= 1) Ach.unlock('first'); }

/* ===== hero-manager.js：第三階段英雄池、專精、BP 計算 ===== */
const HeroManager = {
  list(role) { return HEROES.filter(h => h.role === role); },
  get(id) { return HEROES.find(h => h.id === id) || HEROES[0]; },
  seed(p) {
    const list = this.list(p.pos || '上路'); const out = {};
    list.forEach(h => out[h.id] = 0);
    const code = String(p.id || p.name || 'p').split('').reduce((a,c) => a + c.charCodeAt(0), 0);
    if (list.length) out[list[code % list.length].id] = 52;
    if (list.length > 1) out[list[(code + 1) % list.length].id] = 38;
    return out;
  },
  ensure(p) {
    if (!p.heroMastery || typeof p.heroMastery !== 'object') p.heroMastery = this.seed(p);
    this.list(p.pos || '上路').forEach(h => { const n = Number(p.heroMastery[h.id]); p.heroMastery[h.id] = Number.isFinite(n) ? clamp(n, 0, 100) : 0; });
    if (!p.career || typeof p.career !== 'object') p.career = CareerManager.emptyCareer();
    if (!Array.isArray(p.careerHistory)) p.careerHistory = [];
    return p.heroMastery;
  },
  mastery(p, id) { this.ensure(p); return p.heroMastery[id] || 0; },
  defaultPicks(players) { const out = {}; POS.forEach((pos, i) => { const p = players[i]; if (!p) return; this.ensure(p); const list = this.list(pos); out[pos] = list.slice().sort((a,b) => this.mastery(p,b.id) - this.mastery(p,a.id))[0]?.id || list[0]?.id; }); return out; },
  aiPicks(team, style) { const out = {}; POS.forEach((pos, i) => { const list = this.list(pos); const good = list.filter(h => h.styles.includes(style)); out[pos] = pick(good.length ? good : list).id; }); return out; },
  alternate(role, exclude, style) { const list = this.list(role).filter(h => h.id !== exclude); const fit = list.filter(h => h.styles.includes(style)); return pick(fit.length ? fit : list).id; },
  label(id) { return this.get(id).name; },
  typeKey(type) { return ({'坦克':'tank','刺客':'assassin','法師':'mage','戰士':'fighter','射手':'marksman','輔助':'support'})[type] || String(type||'').toLowerCase(); },
  teamScore(players, picks, strategy, enemyPicks) {
    let mastery = 0, fit = 0, counter = 0, roles = 0, comboTags = [];
    players.forEach((p, i) => {
      const pos = POS[i], id = picks && picks[pos], h = HEROES.find(x => x.id === id);
      if (!h) return;
      const m = p && p.heroMastery ? (Number(p.heroMastery[id]) || 0) : 50;
      mastery += (m - 50) * 0.018;
      if (h.role === pos) roles++;
      if (h.styles.includes(strategy)) fit += 0.35;
      comboTags.push(...h.tags);
      const enemy = HEROES.find(x => x.id === (enemyPicks && enemyPicks[pos]));
      if (enemy && enemy.counters.includes(this.typeKey(h.type))) counter -= 0.35;
      if (enemy && h.counters.includes(this.typeKey(enemy.type))) counter += 0.35;
    });
    const engage = comboTags.filter(t => t === 'engage').length;
    const frontline = comboTags.filter(t => t === 'frontline').length;
    const protect = comboTags.filter(t => t === 'protect' || t === 'peel').length;
    const composition = (engage >= 2 ? 0.35 : 0) + (frontline >= 2 && protect >= 1 ? 0.25 : 0);
    const rolePenalty = (5 - roles) * 0.9;
    return clamp(mastery + fit + counter + composition - rolePenalty, -3.5, 3.5);
  },
  learn(players, picks) {
    players.forEach((p, i) => { const h = HEROES.find(x => x.id === (picks || {})[POS[i]]); if (!h) return; this.ensure(p); p.heroMastery[h.id] = clamp((p.heroMastery[h.id] || 0) + rand(1.2, 2.4), 0, 100); });
  },
  train(playerId, heroId) {
    const C = S.C, p = C.players.find(x => x.id === playerId), h = HEROES.find(x => x.id === heroId);
    if (!p || !h || h.role !== p.pos) return toast('英雄與選手位置不符', 'bad');
    if (p.inj) return toast('受傷選手無法進行英雄專精訓練', 'bad');
    if (C.funds < 1500) return toast('資金不足（需要 $1,500）', 'bad');
    if (!Sim.useAp(C)) return;
    this.ensure(p); const before = p.heroMastery[h.id] || 0;
    const gain = Math.min(100 - before, 5 + C.skill.dev * 0.22 + rand(0, 2));
    p.heroMastery[h.id] = before + gain; p.fat = clamp(p.fat + 8, 0, 100); C.funds -= 1500;
    CareerManager.add(p, C, '英雄專精', `完成「${h.name}」專項訓練，熟練度提升 ${gain.toFixed(1)}。`);
    log(`🎯 ${p.name} 練習 ${h.name}，熟練度 ${before.toFixed(0)}→${p.heroMastery[h.id].toFixed(0)}`, 'good');
    Store.save(); UI.playerModal(playerId); toast('英雄專精訓練完成', 'good');
  }
};

/* ===== relationship-manager.js：第四階段隊內關係 ===== */
const RelationshipManager = {
  key(a,b) { return [a,b].sort().join('|'); },
  init(C) {
    C.relationships = C.relationships && typeof C.relationships === 'object' ? C.relationships : {};
    for (let i=0;i<C.players.length;i++) for (let j=i+1;j<C.players.length;j++) {
      const a=C.players[i], b=C.players[j], k=this.key(a.id,b.id);
      if (!Number.isFinite(Number(C.relationships[k]))) C.relationships[k] = 0;
    }
    if (C.captain && !C.players.some(p=>p.id===C.captain)) C.captain=null;
  },
  score(C,a,b) { if (!a || !b || a.id===b.id) return 0; this.init(C); return clamp(Number(C.relationships[this.key(a.id,b.id)]) || 0,-100,100); },
  change(C,a,b,d) { if (!a || !b || a.id===b.id) return 0; this.init(C); const k=this.key(a.id,b.id); C.relationships[k]=clamp((Number(C.relationships[k])||0)+d,-100,100); return C.relationships[k]; },
  pairs(C) { const out=[]; for(let i=0;i<C.players.length;i++) for(let j=i+1;j<C.players.length;j++) out.push({a:C.players[i],b:C.players[j],score:this.score(C,C.players[i],C.players[j])}); return out.sort((x,y)=>x.score-y.score); },
  lineupBonus(C,players) { const vals=[]; for(let i=0;i<players.length;i++) for(let j=i+1;j<players.length;j++) vals.push(this.score(C,players[i],players[j])); return clamp(avg(vals)*0.012,-1.2,1.2); },
  afterMatch(C,players,win) { for(let i=0;i<players.length;i++) for(let j=i+1;j<players.length;j++) this.change(C,players[i],players[j],win ? 1.5 : -0.7); },
  openPair(aId,bId) {
    const C=S.C, a=C.players.find(p=>p.id===aId), b=C.players.find(p=>p.id===bId); if(!a||!b) return;
    const v=this.score(C,a,b), desc=v>=60?'默契十足':v>=25?'關係友好':v<=-50?'嚴重不合':v<=-20?'關係緊張':'普通隊友';
    openModal(`<div class="card-title">🤝 隊友關係</div><div class="flex items-center justify-center gap-3"><div class="text-center">${Av.svg(a,52)}<div class="text-sm font-bold mt-1">${esc(a.name)}</div></div><div class="text-center"><div class="text-2xl font-black ${v>=20?'text-emerald-300':v<=-20?'text-rose-300':'text-slate-200'}">${Math.round(v)}</div><div class="text-xs text-slate-400">${desc}</div></div><div class="text-center">${Av.svg(b,52)}<div class="text-sm font-bold mt-1">${esc(b.name)}</div></div></div><div class="bar mt-3"><div class="${v>=0?'bg-emerald-400':'bg-rose-400'}" style="width:${Math.abs(v)}%;margin-left:${v<0?`${50+v/2}%`:'50%'}"></div></div><div class="grid grid-cols-2 gap-2 mt-4"><button class="btn btn-cyan" onclick="RelationshipManager.pairTraining('${aId}','${bId}')">安排雙人訓練（行動 -1）</button><button class="btn btn-ghost" onclick="RelationshipManager.mediate('${aId}','${bId}')">經理出面調解（$3,000）</button></div><button class="btn btn-ghost w-full mt-3" onclick="closeModal()">關閉</button>`);
  },
  pairTraining(aId,bId) {
    const C=S.C,a=C.players.find(p=>p.id===aId),b=C.players.find(p=>p.id===bId); if(!a||!b)return;
    if(!Sim.useAp(C))return;
    a.fat=clamp(a.fat+5,0,100); b.fat=clamp(b.fat+5,0,100); const score=this.change(C,a,b,7); C.chem=clamp(C.chem+1.5,0,100);
    CareerManager.add(a,C,'隊友互動',`與 ${b.name} 進行雙人訓練，關係提升。`); CareerManager.add(b,C,'隊友互動',`與 ${a.name} 進行雙人訓練，關係提升。`);
    log(`🤝 ${a.name} 與 ${b.name} 雙人訓練，關係提升至 ${Math.round(score)}`, 'good'); Store.save(); this.openPair(aId,bId); toast('雙人訓練完成', 'good');
  },
  mediate(aId,bId) {
    const C=S.C,a=C.players.find(p=>p.id===aId),b=C.players.find(p=>p.id===bId); if(!a||!b)return;
    if(C.funds<3000)return toast('資金不足', 'bad'); if(!Sim.useAp(C))return; C.funds-=3000;
    const result=rollCheck(C,{st:'man',diff:10}), gain=result==='g'?18:result==='k'?12:result==='f'?3:-4;
    const score=this.change(C,a,b,gain); if(gain>0){Sim.mor(a,2);Sim.mor(b,2);}
    CareerManager.add(a,C,'關係調解',`經理介入與 ${b.name} 的隊內關係。`); CareerManager.add(b,C,'關係調解',`經理介入與 ${a.name} 的隊內關係。`);
    log(`🗣️ 經理調解 ${a.name} 與 ${b.name}（${RES[result][0]}）`,gain>0?'good':'bad'); Store.save(); this.openPair(aId,bId); toast(`調解結果：關係 ${gain>=0?'+':''}${gain}`,gain>0?'good':'bad');
  },
  appointCaptain(id) {
    const C=S.C,p=C.players.find(x=>x.id===id); if(!p)return; if(C.captain===id)return toast('他已經是隊長'); if(!Sim.useAp(C))return;
    const old=C.players.find(x=>x.id===C.captain); C.captain=id; Sim.mor(p,5); if(old)CareerManager.add(old,C,'隊長交接',`${p.name} 接任隊長。`); CareerManager.add(p,C,'隊長任命','正式接任戰隊隊長。');
    log(`🧭 ${p.name} 接任隊長`, 'gold'); Store.save(); UI.playerModal(id); toast(`${p.name} 已成為隊長`, 'good');
  }
};

/* ===== career-manager.js：第四階段職涯履歷與賽季紀錄 ===== */
const CareerManager = {
  emptyCareer() { return { series:0,wins:0,losses:0,games:0,gameWins:0,gameLosses:0,mvp:0,titles:0,seasons:0,bestOvr:0 }; },
  add(p,C,type,note) {
    if(!p)return; if(!Array.isArray(p.careerHistory))p.careerHistory=[];
    p.careerHistory.unshift({season:C.season,week:C.tick,type,note:String(note||'')}); if(p.careerHistory.length>40)p.careerHistory.length=40;
  },
  recordSeries(C,players,series,win) {
    players.forEach(p=>{
      if(!p.career)p.career=this.emptyCareer(); const c=p.career;
      c.series=(c.series||0)+1; c[win?'wins':'losses']=(c[win?'wins':'losses']||0)+1;
      c.games=(c.games||0)+series.games.length; c.gameWins=(c.gameWins||0)+series.games.filter(g=>g.win).length; c.gameLosses=(c.gameLosses||0)+series.games.filter(g=>!g.win).length;
      c.bestOvr=Math.max(c.bestOvr||0,Sim.ovr(p));
      this.add(p,C,'賽事紀錄',`${series.title} 系列賽${win?'獲勝':'落敗'}（${series.x}:${series.y}）。`);
      if(series.mvp===p.id){c.mvp=(c.mvp||0)+1;this.add(p,C,'個人榮譽','獲得本場系列賽 MVP。');}
    });
  },
  seasonEnd(C,summary) {
    const title=/冠軍/.test(summary.res);
    C.players.forEach(p=>{
      if(!p.career)p.career=this.emptyCareer(); p.career.seasons=(p.career.seasons||0)+1;
      if(title){p.career.titles=(p.career.titles||0)+1;this.add(p,C,'冠軍紀錄',`隨 ${C.name} 奪得${summary.res}。`);}
      else this.add(p,C,'賽季結算',`第 ${C.season} 賽季：${summary.res}。`);
    });
  },
  depart(C,p,reason) {
    this.add(p,C,reason||'離隊',`${reason||'離隊'}：${C.name}。`);
    C.careerArchive=C.careerArchive||[];
    C.careerArchive.unshift({id:p.id,name:p.name,pos:p.pos,age:p.age,reason:reason||'離隊',season:C.season,career:JSON.parse(JSON.stringify(p.career||this.emptyCareer())),history:(p.careerHistory||[]).slice(0,12)});
    if(C.careerArchive.length>60)C.careerArchive.length=60;
  },
  careerEventReady(C,p,key) { const stamp=C.careerEventLast && C.careerEventLast[p.id+'_'+key]; return stamp == null || C.tick-Number(stamp)>=12; },
  markEvent(C,p,key) { C.careerEventLast[p.id+'_'+key]=C.tick; },
  showArchive() {
    const C=S.C, rows=(C.careerArchive||[]).map(p=>`<div class="bg-slate-800/60 rounded-lg p-2 text-xs"><b>${esc(p.name)}</b>・${p.pos}・${p.age} 歲・${esc(p.reason)}<div class="text-slate-400 mt-1">系列賽 ${p.career.series||0}・勝 ${p.career.wins||0}・MVP ${p.career.mvp||0}・冠軍 ${p.career.titles||0}</div></div>`).join('');

  core() {

    const st = own ? [p.inj ? `<span class="chip chip-bad">${p.injWhy || '受傷'} ${p.inj}週</span>` : '', p.exp ? '<span class="chip chip-bad">合約到期</span>' : p.con <= 1 ? '<span class="chip chip-n">約剩1季</span>' : '', p.fat >= 60 ? '<span class="chip chip-bad">疲勞</span>' : '', p.morale < 35 ? '<span class="chip chip-bad">不滿</span>' : ''].join(' ') : '';
    const right = own ? `<div class="text-[10px] text-slate-400 text-right leading-4">疲勞 ${Math.round(p.fat)}<br>士氣 ${Math.round(p.morale)}</div>` : o.mk ? `<div class="text-[10px] text-right leading-4">${p.youth ? '<span class="text-emerald-300">青訓</span>' : p.fa ? '<span class="text-emerald-300">自由</span>' : `<span class="text-amber-300">${money(Sim.fee(p, C))}</span>`}<br><span class="text-slate-400">週薪 ${money(p.youth ? 400 : Sim.wage(p, C))}</span></div>` : '';
    return `<button class="w-full text-left bg-slate-800/60 hover:bg-slate-700/60 border ${o.slot && p.pos !== o.slot ? 'border-rose-500/60' : 'border-slate-700'} rounded-xl px-2.5 py-2 flex items-center gap-2 transition" onclick="UI.playerModal('${p.id}')">
      <div class="w-11 text-center shrink-0">${Av.svg(p, 40)}<div class="text-[10px] text-slate-400 mt-0.5">${POSE[o.slot || p.pos]}${o.slot || p.pos}</div></div>
      <div class="w-11 text-center shrink-0"><div class="${k >= 1 ? 'text-xl' : 'text-xs'} font-black font-mono ${UI.ovrC(ov)}">${UI.ovrTxt(p)}</div><div class="text-[9px] text-slate-500">潛 ${UI.potTxt(p)}</div></div>
      <div class="flex-1 min-w-0"><div class="text-sm font-bold truncate">${esc(p.name)} <span class="text-[11px] font-normal text-slate-400">${p.age}歲${o.slot && p.pos !== o.slot ? `・本職${p.pos}` : ''}</span> ${own ? UI.formIc(p.form) : ''}</div>

  playerModal(id) {
    const C = S.C, own = C.players.find(p => p.id === id), p = own || C.market.find(p => p.id === id) || C.youth.find(p => p.id === id); if (!p) return closeModal();
    const k = UI.known(p), ov = Sim.ovr(p), isSt = Object.values(C.lineup).includes(id);
    const bars = ATTR.map(a => `<div class="stat-row"><span class="w-10 text-slate-400 shrink-0 text-xs">${ATTRN[a]}</span><div class="bar"><div class="${p.attr[a] >= 75 ? 'bg-fuchsia-400' : p.attr[a] >= 60 ? 'bg-cyan-400' : 'bg-slate-400'}" style="width:${k >= 1 ? p.attr[a] : 0}%"></div></div><span class="w-8 text-right font-mono text-xs">${k >= 1 ? Math.floor(p.attr[a]) : '??'}</span>${own ? `<button class="chip chip-n hover:!border-cyan-400" onclick="Sim.act('drill','${id}','${a}')">特訓</button>` : ''}</div>`).join('');
    // 4.1：選手能力以五軸 SVG 雷達圖呈現，直接使用既有五項能力資料。
    const radar = (() => {
      const cx=150, cy=122, radius=78, count=ATTR.length;
      const point=(value,index,r=radius)=>{
        const angle=-Math.PI/2+index*Math.PI*2/count;
        const rr=r*clamp(Number(value)||0,0,100)/100;
        return `${(cx+Math.cos(angle)*rr).toFixed(1)},${(cy+Math.sin(angle)*rr).toFixed(1)}`;
      };
      const ring=(scale)=>ATTR.map((_,i)=>{
        const angle=-Math.PI/2+i*Math.PI*2/count;
        return `${(cx+Math.cos(angle)*radius*scale).toFixed(1)},${(cy+Math.sin(angle)*radius*scale).toFixed(1)}`;
      }).join(' ');
      const values=ATTR.map(a=>k>=1?Math.floor(p.attr[a]):0);
      const polygon=values.map((v,i)=>point(v,i)).join(' ');
      const axes=ATTR.map((a,i)=>{
        const angle=-Math.PI/2+i*Math.PI*2/count;
        const x=cx+Math.cos(angle)*radius, y=cy+Math.sin(angle)*radius;
        const lx=cx+Math.cos(angle)*(radius+23), ly=cy+Math.sin(angle)*(radius+23);
        const anchor=Math.abs(lx-cx)<8?'middle':lx<cx?'end':'start';
        return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(148,163,184,.32)" stroke-width="1"/><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" fill="#cbd5e1" font-size="11" font-weight="600">${ATTRN[a]}</text>`;
      }).join('');
      const dots=values.map((v,i)=>{const [x,y]=point(v,i).split(',');return `<circle cx="${x}" cy="${y}" r="3.6" fill="#c9f36d" stroke="#172b43" stroke-width="1.5"/>`;}).join('');
      const valueList=ATTR.map((a,i)=>`<div class="rounded-lg bg-slate-800/70 px-2 py-2 text-center"><div class="text-[11px] text-slate-400">${ATTRN[a]}</div><div class="text-base font-bold font-mono ${k>=1?'text-slate-100':'text-slate-500'}">${k>=1?values[i]:'??'}</div>${own?`<button class="chip chip-n mt-1" onclick="Sim.act('drill','${id}','${a}')">特訓</button>`:''}</div>`).join('');
      return `<section class="mt-3 rounded-2xl border border-slate-700/80 bg-slate-950/65 p-3">
        <div class="flex items-center justify-between gap-2 mb-1"><div><div class="text-sm font-bold text-slate-100">選手能力分析</div><div class="text-[11px] text-slate-400">五項核心能力雷達圖</div></div><span class="chip chip-good">OVR ${k>=1?Math.floor(ov):'??'}</span></div>
        <div class="flex justify-center">
          <svg viewBox="0 0 300 245" role="img" aria-label="選手五項能力雷達圖" style="width:100%;max-width:360px;height:auto;overflow:visible">
            <defs><linearGradient id="playerRadarFill-${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c9f36d" stop-opacity=".38"/><stop offset="100%" stop-color="#60a5fa" stop-opacity=".18"/></linearGradient></defs>
            ${[.25,.5,.75,1].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="rgba(148,163,184,${v===1?.48:.2})" stroke-width="${v===1?1.2:1}"/>`).join('')}
            ${axes}
            ${k>=1?`<polygon points="${polygon}" fill="url(#playerRadarFill-${id})" stroke="#c9f36d" stroke-width="2.4" stroke-linejoin="round"/>${dots}`:`<text x="${cx}" y="${cy+4}" text-anchor="middle" fill="#94a3b8" font-size="12">考察後顯示能力</text>`}
          </svg>
        </div>
        <div class="grid grid-cols-5 gap-1.5 mt-1">${valueList}</div>
        ${own?'<div class="text-[11px] text-slate-500 mt-2">點選下方特訓，可直接針對單項能力進行培養。</div>':''}
      </section>`;
    })();
    let act = '';
    if (own) {
      const need = p.exp || p.con <= 1, ask = Sim.renewAsk(p, C);
      act = `<div class="grid grid-cols-2 gap-2 mt-3">
        ${isSt ? `<button class="btn btn-ghost" onclick="Sim.unStarter('${id}')">移出先發</button>` : `<button class="btn btn-cyan" onclick="Sim.setStarter('${id}')">設為先發（${p.pos}）</button>`}
        <button class="btn btn-ghost" onclick="Sim.act('talk','${id}')">🗣️ 談話（行動 -1）</button>
        ${need ? `<button class="btn btn-emerald" onclick="Sim.renew('${id}')">📝 續約 2 季・週薪 ${money(ask)}</button><button class="btn btn-ghost" ${p.rhag ? 'disabled' : ''} onclick="Sim.renew('${id}',1)">砍價（談判 ${Math.round(chkRate(C, { st: 'neg', diff: 11 }) * 100)}%）</button>` : ''}
        <button class="btn btn-rose col-span-2" onclick="UI.confirmSell('${id}')">💸 出售（${money(Sim.sellPrice(p, C))}${Sim.window(C) ? '' : '・非轉會期賤賣'}）</button></div>
        <div class="text-[11px] text-slate-500 mt-2">「特訓」每次消耗 1 次行動、疲勞 +10，越接近潛力上限效果越差。</div>`;
    } else if (p.youth) {
      act = `<div class="grid grid-cols-2 gap-2 mt-3"><button class="btn btn-ghost" ${k >= 2 ? 'disabled' : ''} onclick="Sim.scout('${id}')">🔭 考察（$2,000）</button><button class="btn btn-emerald" onclick="Sim.sign('${id}')">升上一隊（週薪 $400）</button></div>`;
    } else {
      const w = Sim.willing(p, C), win = p.fa || Sim.window(C);
      act = `<div class="text-xs mt-3 ${w.ok ? 'text-emerald-300' : 'text-rose-300'}">${w.ok ? '✅ 願意加入' : '❌ ' + w.why}${!win ? '<span class="text-rose-300">・非轉會期，無法簽下有合約的選手</span>' : ''}</div>
        <div class="kv mt-1"><span class="text-slate-400">${p.fa ? '簽約金' : '轉會費'}</span><b>${money(Sim.fee(p, C))}</b></div><div class="kv"><span class="text-slate-400">要求週薪（合約 2 季）</span><b>${money(Sim.wage(p, C))}</b></div>
        <div class="grid grid-cols-3 gap-2 mt-3"><button class="btn btn-ghost !px-1" ${k >= 2 ? 'disabled' : ''} onclick="Sim.scout('${id}')">🔭 考察</button>
        <button class="btn btn-ghost !px-1" ${p.hag || !w.ok ? 'disabled' : ''} onclick="Sim.sign('${id}',1)">殺價 ${Math.round(chkRate(C, { st: 'neg', diff: 11 }) * 100)}%</button>
        <button class="btn btn-emerald !px-1" ${w.ok && win ? '' : 'disabled'} onclick="Sim.sign('${id}')">✍️ 簽約</button></div>
        <div class="text-[11px] text-slate-500 mt-2">本週剩餘考察 ${C.scoutLeft} 次（每次 $2,000）。殺價失敗對方會暫時中止談判。</div>`;
    }
    const heroPanel = own ? (() => { HeroManager.ensure(p); return `<div class="mt-4 rounded-xl border border-violet-500/25 bg-slate-950/45 p-3"><div class="text-sm font-bold text-violet-300 mb-2">🧙 英雄池與專精訓練</div><div class="space-y-2">${HeroManager.list(p.pos).map(h=>{const m=HeroManager.mastery(p,h.id);return `<div class="flex items-center gap-2 text-xs"><span class="w-24">${h.name}</span><div class="bar"><div class="bg-violet-400" style="width:${m}%"></div></div><span class="w-8 text-right font-mono">${Math.round(m)}</span><button class="chip chip-n" onclick="HeroManager.train('${id}','${h.id}')" ${m>=100||p.inj?'disabled':''}>訓練</button></div>`;}).join('')}</div><div class="text-[10px] text-slate-500 mt-2">每次消耗 1 次行動與 $1,500，疲勞 +8；熟練度越高，BP 與比賽表現越穩定。</div></div>`; })() : '';
    const relationPanel = own ? (() => { const rels=C.players.filter(q=>q.id!==p.id).map(q=>({q,v:RelationshipManager.score(C,p,q)})).sort((a,b)=>b.v-a.v); return `<div class="mt-4 rounded-xl border border-emerald-500/25 bg-slate-950/45 p-3"><div class="flex items-center justify-between mb-2"><div class="text-sm font-bold text-emerald-300">🤝 隊友關係</div>${C.captain===id?'<span class="chip chip-good">隊長</span>':`<button class="chip chip-n" onclick="RelationshipManager.appointCaptain('${id}')">任命隊長（行動 -1）</button>`}</div><div class="space-y-1.5">${rels.slice(0,4).map(r=>`<button class="w-full flex items-center justify-between gap-2 text-xs bg-slate-800/60 rounded-lg px-2 py-1.5" onclick="RelationshipManager.openPair('${id}','${r.q.id}')"><span>${esc(r.q.name)}</span><b class="${r.v>=25?'text-emerald-300':r.v<=-25?'text-rose-300':'text-slate-300'}">${Math.round(r.v)}／100</b></button>`).join('')||'<div class="text-xs text-slate-500">目前沒有其他隊友。</div>'}</div><div class="text-[10px] text-slate-500 mt-2">關係會隨比賽、雙人訓練與經理調解變化，並小幅影響五人團隊合作表現。</div></div>`; })() : '';
    const careerPanel = own ? (() => { const c=p.career||CareerManager.emptyCareer(); return `<div class="mt-4 rounded-xl border border-amber-500/25 bg-slate-950/45 p-3"><div class="text-sm font-bold text-amber-300 mb-2">📜 職涯履歷</div><div class="grid grid-cols-3 gap-2 text-center">${[['系列賽',c.series||0],['勝場',c.wins||0],['MVP',c.mvp||0],['冠軍',c.titles||0],['出賽局數',c.games||0],['最高戰力',Math.round(c.bestOvr||Sim.ovr(p))]].map(x=>`<div class="bg-slate-800/70 rounded-lg p-2"><div class="text-[10px] text-slate-400">${x[0]}</div><div class="font-black text-sm">${x[1]}</div></div>`).join('')}</div><div class="text-xs font-bold text-slate-300 mt-3 mb-1">近期紀錄</div><div class="space-y-1 max-h-28 overflow-y-auto">${(p.careerHistory||[]).slice(0,6).map(h=>`<div class="text-[10px] text-slate-400">S${h.season} W${h.week}・${esc(h.type)}：${esc(h.note)}</div>`).join('')||'<div class="text-xs text-slate-500">尚無職涯紀錄。</div>'}</div></div>`; })() : '';
    const planPanel = own ? `<div class="mt-4 rounded-xl border border-cyan-500/25 bg-slate-950/45 p-3">
      <div class="text-sm font-bold text-cyan-300 mb-2">🎓 個人培養計畫</div>
      <label class="block text-[11px] text-slate-400 mb-1">發展路線</label>
      <select class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm mb-2" onchange="UI.setPlayerPlan('${id}','developmentPath',this.value)">${Object.entries(DEV_PATHS).map(([k, d]) => `<option value="${k}" ${(p.developmentPath || 'balanced') === k ? 'selected' : ''}>${d.n}｜${d.d}</option>`).join('')}</select>
      <label class="block text-[11px] text-slate-400 mb-1">每週個人專項</label>
      <select class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm" onchange="UI.setPlayerPlan('${id}','trainFocus',this.value)"><option value="auto" ${(p.trainFocus || 'auto') === 'auto' ? 'selected' : ''}>跟隨全隊課表</option>${ATTR.map(a => `<option value="${a}" ${p.trainFocus === a ? 'selected' : ''}>${ATTRN[a]}專項</option>`).join('')}</select>
      <p class="text-[11px] text-slate-500 mt-2">個人專項會與全隊課表混合計算；發展路線會重新分配成長比重，不會憑空增加總成長量。</p>
    </div>` : '';
    openModal(`<div class="flex items-center gap-3">${Av.svg(p, 64)}<div class="flex-1"><div class="text-lg font-black">${esc(p.name)}</div><div class="text-xs text-slate-400">${POSE[p.pos]}${p.pos}・${p.age} 歲${own ? '' : '・' + (p.youth ? '青訓營' : p.club)}</div></div>
      <div class="text-center"><div class="text-2xl font-black font-mono ${UI.ovrC(ov)}">${UI.ovrTxt(p)}</div><div class="text-[10px] text-slate-400">潛力 ${UI.potTxt(p)}</div></div></div>
      <div class="mt-3">${radar}</div>
      ${planPanel}
      ${heroPanel}
      ${relationPanel}
      ${careerPanel}
      <div class="mt-3 space-y-1">${p.traits.map(t => `<div class="text-xs"><span class="chip ${TRAITS[t].good ? 'chip-good' : 'chip-bad'}">${TRAITS[t].n}</span> <span class="text-slate-400">${TRAITS[t].d}</span></div>`).join('') || '<div class="text-xs text-slate-500">沒有特殊特質</div>'}</div>
      <div class="grid grid-cols-2 gap-x-4 mt-3 text-sm">
        <div class="kv"><span class="text-slate-400">英雄池</span><span>${k >= 1 ? '●'.repeat(p.pool) + '○'.repeat(5 - p.pool) : '?'}</span></div><div class="kv"><span class="text-slate-400">身價</span><span>${k >= 1 ? money(Sim.val(p)) : '?'}</span></div>
        ${own ? `<div class="kv"><span class="text-slate-400">週薪</span><span>${money(p.sal)}</span></div><div class="kv"><span class="text-slate-400">合約</span><span class="${p.exp ? 'text-rose-300' : ''}">${p.exp ? '已到期' : `剩 ${p.con} 季`}</span></div>
        <div class="kv"><span class="text-slate-400">狀態 / 疲勞</span><span>${UI.formIc(p.form)} / ${Math.round(p.fat)}</span></div><div class="kv"><span class="text-slate-400">士氣</span><span>${Math.round(p.morale)}</span></div>
        <div class="kv"><span class="text-slate-400">本季出賽</span><span>${p.gp} 局</span></div><div class="kv"><span class="text-slate-400">MVP</span><span>${p.mvp} 次</span></div>` : ''}</div>
      ${act}<button class="btn btn-ghost w-full mt-3" onclick="closeModal()">關閉</button>`);

  setPlayerPlan(id, field, value) {
    const p = S && S.C && S.C.players.find(x => x.id === id); if (!p) return;
    if (field === 'developmentPath' && DEV_PATHS[value]) p.developmentPath = value;

  },
  confirmSell(id) { const C = S.C, p = C.players.find(x => x.id === id); openModal(`<div class="text-center"><h3 class="text-lg font-bold">確定出售 ${esc(p.name)}？</h3><p class="text-sm text-slate-400 mt-2">可得 ${money(Sim.sellPrice(p, C))}。賣出後無法反悔。</p><div class="grid grid-cols-2 gap-2 mt-4"><button class="btn btn-ghost" onclick="UI.playerModal('${id}')">取消</button><button class="btn btn-rose" onclick="Sim.sell('${id}')">確定出售</button></div></div>`); },

      <div class="space-y-2">${of.map((o, i) => `<button class="choice" onclick="UI.takeSponsor(${i})"><div class="flex justify-between"><span>${esc(o.name)} <span class="chip chip-n">${o.type}</span></span><span class="text-emerald-300">每週 ${money(o.weekly)}</span></div>
        <div class="text-[11px] font-normal text-slate-400 mt-1">目標：${o.tn}${o.bonus ? `・達成獎金 <span class="text-amber-300">${money(o.bonus)}</span>` : ''}${o.pen ? `・未達成罰 <span class="text-rose-300">${money(o.pen)}</span>` : ''}${o.kind==='popularity'?'・粉絲收入分潤 16%':o.kind==='longterm'?'・簽約後連續合作兩季':o.kind==='equipment'?'・設施升級折扣 12%':o.kind==='champion'?'・奪冠可獲高額獎金':''}</div></button>`).join('')}</div>`);

  seasonHtml(s) {
    return `<div class="text-center"><div class="text-4xl">${s.promoted ? '⬆️' : s.relegated ? '⬇️' : '🏁'}</div><h3 class="text-xl font-black mt-1">第 ${s.season} 賽季結算</h3><div class="text-lg font-bold mt-1 ${s.relegated ? 'text-rose-300' : 'text-amber-300'}">${DIVN[s.div]}・${s.res}</div></div>
      <div class="mt-3">${s.L.map(l => `<div class="kv"><span class="text-slate-400">${l[0]}</span><b class="${l[1] < 0 ? 'text-rose-300' : 'text-emerald-300'}">${money(l[1])}</b></div>`).join('')}<div class="kv"><span>合計</span><b>${money(s.tot)}</b></div><div class="kv"><span class="text-slate-400">聲望變化</span><b class="${s.popD < 0 ? 'text-rose-300' : 'text-emerald-300'}">${s.popD >= 0 ? '+' : ''}${s.popD}</b></div></div>
      ${s.notes.length ? `<div class="mt-3 text-xs space-y-1 bg-slate-950/50 rounded-xl p-2.5">${s.notes.map(n => `<div>${esc(n)}</div>`).join('')}</div>` : ''}

  },
  retire() {

/* ===== club-business-manager.js：第五階段俱樂部商業、品牌、粉絲與財務 ===== */
const BRAND_PROFILES = {
  champion: { name: '冠軍豪門', icon: '🏆', desc: '勝利與明星選手更能轉化粉絲；贊助商偏好高成績隊伍。', fanWin: 1.45, merch: 1.05 },
  academy: { name: '青訓基地', icon: '🌱', desc: '年輕選手更容易吸引關注，長期培養形象。', fanWin: 1.05, merch: 0.92 },
  media: { name: '流量戰隊', icon: '📺', desc: '直播、周邊和社群活動收益提高，但粉絲流失也更敏感。', fanWin: 1.2, merch: 1.35 },
  competitive: { name: '實力戰隊', icon: '⚔️', desc: '成績與粉絲成長較均衡，沒有明顯短板。', fanWin: 1.15, merch: 1.0 },
  budget: { name: '精實經營', icon: '💼', desc: '員工薪資與基地升級成本較低，但粉絲成長較慢。', fanWin: 0.9, merch: 0.92 },
};
const ClubBusinessManager = {
  init(C) {
    C.brand = C.brand || 'competitive'; C.fans = Number.isFinite(Number(C.fans)) ? C.fans : Math.round((C.pop || 14) * 400);
    C.business = Object.assign({ lastW: C.stats ? C.stats.w : 0, lastL: C.stats ? C.stats.l : 0, campaignCount: 0, sponsorRenewal: 1 }, C.business || {});
    C.news = Array.isArray(C.news) ? C.news : [];
    return C;
  },
  ensure(C) { return this.init(C); },
  brand(C) { this.ensure(C); return BRAND_PROFILES[C.brand] || BRAND_PROFILES.competitive; },
  merchRevenue(C) {
    this.ensure(C);
    const b = this.brand(C), studio = 1 + 0.15 * Math.max(0, (C.fac && C.fac.studio || 1) - 1);
    return Math.round(Math.sqrt(Math.max(0, C.fans)) * 16 * b.merch * studio * DIFF[C.diff].inc);
  },
  addNews(C, category, title, detail) {
    this.ensure(C);
    C.news.unshift({ season: C.season || 1, tick: C.tick || 0, category, title, detail, at: Date.now() });
    if (C.news.length > 60) C.news.length = 60;
  },
  weekly(C) {
    this.ensure(C);
    const b = this.brand(C), stats = C.stats || { w: 0, l: 0 };
    const dw = Math.max(0, (stats.w || 0) - (C.business.lastW || 0));
    const dl = Math.max(0, (stats.l || 0) - (C.business.lastL || 0));
    C.business.lastW = stats.w || 0; C.business.lastL = stats.l || 0;
    let delta = 35 + Math.round(C.pop * 1.4) + Math.round(dw * 260 * b.fanWin) - Math.round(dl * 130 * (C.brand === 'media' ? 1.25 : 1));
    if (C.brand === 'media') delta += randi(25, 70);
    if (C.brand === 'academy' && C.players.some(p => p.age <= 20 && Sim.ovr(p) >= 65)) delta += 45;
    if (C.brand === 'champion' && dw) delta += 100 * dw;
    if (C.brand === 'budget') delta = Math.round(delta * 0.88);
    const before = C.fans;
    C.fans = clamp(Math.round(C.fans + delta), 0, 5000000);
    if (Math.abs(C.fans - before) >= 250) this.addNews(C, '粉絲', '粉絲團規模出現變化', `本週粉絲數 ${C.fans >= before ? '增加' : '減少'} ${fmt(Math.abs(C.fans - before))} 人，目前共 ${fmt(C.fans)} 人。`);
  },
  seasonEnd(C, result) {
    this.ensure(C);
    const b = this.brand(C);
    if (result.place === 1) {
      const gain = C.brand === 'champion' ? 1800 : 1100;
      C.fans = clamp(C.fans + gain, 0, 5000000);
      this.addNews(C, '賽季', '俱樂部奪得聯賽冠軍', `${C.name} 拿下${DIVN[result.div]}冠軍，粉絲增加 ${fmt(gain)} 人。`);
    } else if (result.place <= 3) {
      const gain = C.brand === 'academy' ? 650 : 400;
      C.fans = clamp(C.fans + gain, 0, 5000000);
      this.addNews(C, '賽季', '俱樂部取得聯賽前三', `${C.name} 本季排名第 ${result.place}，粉絲增加 ${fmt(gain)} 人。`);
    }
    if (result.relegated) this.addNews(C, '賽季', '俱樂部降級', '降級將影響下一季贊助與粉絲成長，建議重新評估薪資結構。');
    if (result.promoted) this.addNews(C, '賽季', '俱樂部成功升級', '升級帶來更高曝光與商業機會，也會提高陣容競爭成本。');
    C.fans = clamp(C.fans, 0, 5000000);
  },
  action(C, kind) {
    this.ensure(C);
    const cfg = {
      livestream: { cost: 0, ap: 1 }, fanmeet: { cost: 14000, ap: 1 }, merch: { cost: 9000, ap: 1 }, pr: { cost: 7000, ap: 1 }
    }[kind];
    if (!cfg) return;
    if (C.funds < cfg.cost) return toast('資金不足，無法執行這項商業活動', 'bad');
    if (!Sim.useAp(C)) return;
    C.funds -= cfg.cost;
    let msg = '';
    if (kind === 'livestream') {
      const fans = randi(180, 360) * (C.brand === 'media' ? 1.35 : 1);
      const revenue = Math.round(1800 + C.fans * 0.035);
      C.fans += Math.round(fans); C.funds += revenue; C.pop += 0.25; C.players.forEach(p => p.fat = clamp(p.fat + 2, 0, 100));
      msg = `直播收入 ${money(revenue)}，粉絲增加 ${fmt(fans)} 人；全隊疲勞 +2。`;
    } else if (kind === 'fanmeet') {
      const fans = randi(850, 1450) * (C.brand === 'media' ? 1.25 : 1);
      C.fans += Math.round(fans); C.pop += 0.65; Sim.teamMor(C, 2); C.players.forEach(p => p.fat = clamp(p.fat + 3, 0, 100));
      msg = `粉絲增加 ${fmt(fans)} 人，聲望 +0.65，士氣提升；全隊疲勞 +3。`;
    } else if (kind === 'merch') {
      const sales = Math.round(12000 + Math.sqrt(Math.max(0, C.fans)) * 55 * (C.brand === 'media' ? 1.25 : 1));
      C.funds += sales; C.fans += 120; C.business.campaignCount++;
      msg = `商品販售收入 ${money(sales)}，粉絲增加 120 人。`;
    } else if (kind === 'pr') {
      const fans = randi(450, 850); C.fans += fans; C.pop += 1.1;
      msg = `公關宣傳提升聲望 +1.1，粉絲增加 ${fmt(fans)} 人。`;
    }
    C.fans = clamp(Math.round(C.fans), 0, 5000000);
    this.addNews(C, '商業', ({ livestream: '俱樂部舉辦選手直播', fanmeet: '粉絲見面會圓滿落幕', merch: '推出限定周邊商品', pr: '俱樂部公關宣傳活動' })[kind], msg);
    log(`📣 ${msg}`, 'good'); Store.save(); render(); toast('商業活動完成', 'good');
  },
  chooseBrand() {
    const C = S.C; this.ensure(C);
    const options = Object.entries(BRAND_PROFILES).map(([k,b]) => `<button class="choice" onclick="ClubBusinessManager.setBrand('${k}')"><div class="flex items-center justify-between"><b>${b.icon} ${b.name}</b>${C.brand===k?'<span class="chip chip-good">目前定位</span>':''}</div><div class="text-xs font-normal text-slate-400 mt-1">${b.desc}</div></button>`).join('');
    openModal(`<div class="card-title text-base">🏷️ 調整俱樂部品牌定位</div><p class="text-xs text-slate-400 mb-3">僅能在休賽季調整，費用 $25,000。品牌會影響粉絲成長、周邊收益或固定成本。</p><div class="space-y-2">${options}</div><button class="btn btn-ghost w-full mt-3" onclick="closeModal()">取消</button>`);
  },
  setBrand(key) {
    const C = S.C; if (!BRAND_PROFILES[key]) return;
    if (C.phase !== 'off') return toast('品牌定位只能在休賽季調整', 'bad');
    if (C.funds < 25000) return toast('資金不足，需要 $25,000', 'bad');
    C.funds -= 25000; C.brand = key; this.addNews(C, '品牌', '俱樂部調整品牌定位', `俱樂部定位調整為「${BRAND_PROFILES[key].name}」。`);
    log(`🏷️ 俱樂部品牌定位調整為 ${BRAND_PROFILES[key].name}`, 'good'); Store.save(); closeModal(); render();
  },
  forecast(C, weeks = 8) {
    this.ensure(C);
    const out = []; let funds = C.funds, fans = C.fans;
    const current = Sim.income(C);
    for (let i = 1; i <= weeks; i++) {
      const fanRate = C.sponsor && C.sponsor.fanRate || 0;
      const sp = (C.sponsor && C.sponsor.weekly || 0) + fans * fanRate;
      const st = C.pop * C.pop * (C.div === 1 ? 5 : 2) * (1 + 0.15 * ((C.fac.studio || 1) - 1)) * DIFF[C.diff].inc;
      const merch = Math.sqrt(Math.max(0, fans)) * 16 * this.brand(C).merch * (1 + 0.15 * ((C.fac.studio || 1) - 1)) * DIFF[C.diff].inc;
      const net = Math.round(sp + st + merch - current.sal - current.keep - current.wage);
      funds += net; fans = clamp(fans + 35 + Math.round(C.pop * 1.4), 0, 5000000);
      out.push({ week: i, net, funds: Math.round(funds), fans: Math.round(fans) });
    }
    return out;
  },
  showForecast() {
    const C = S.C, rows = this.forecast(C, 8);
    openModal(`<div class="card-title text-base">📈 未來八週財務預測</div><div class="text-xs text-slate-400 mb-3">依目前贊助、粉絲收入、薪資及設施成本估算；未計入未來比賽獎金、臨時事件、轉會或贊助目標獎金。</div><div class="space-y-1">${rows.map(r=>`<div class="grid grid-cols-4 gap-2 text-xs py-2 border-b border-slate-800"><span class="text-slate-400">第 ${r.week} 週</span><b class="${r.net>=0?'text-emerald-300':'text-rose-300'}">${money(r.net)}</b><b>${money(r.funds)}</b><span class="text-slate-400 text-right">粉絲 ${fmt(r.fans)}</span></div>`).join('')}</div><button class="btn btn-cyan w-full mt-4" onclick="closeModal()">關閉</button>` , true);
  }
};

/* ===== ai-world-manager.js：第六階段 AI 戰隊經營與動態轉會 ===== */
const AIWorldManager = {
  teams(C) {
    const all = [...(C.lg && C.lg.teams || []), ...(C.other || [])].filter(t => t && !t.me);
    if (C.wd && Array.isArray(C.wd.opps)) all.push(...C.wd.opps.filter(t => t && !t.me));
    const seen = new Set(); return all.filter(t => !seen.has(t.id) && seen.add(t.id));
  },
  profile(team) {
    if (team.pw >= 78) return 'champion';
    if (team.pw <= 58) return 'academy';
    return pick(['competitive','media','budget']);
  },
  ensure(C) {
    C.aiWorld = C.aiWorld && typeof C.aiWorld === 'object' ? C.aiWorld : { clubs: {}, offers: [], lastWindowSeason: 0 };
    C.aiWorld.clubs = C.aiWorld.clubs && typeof C.aiWorld.clubs === 'object' ? C.aiWorld.clubs : {};
    C.aiWorld.offers = Array.isArray(C.aiWorld.offers) ? C.aiWorld.offers : [];
    C.aiWorld.lastWindowSeason = Number(C.aiWorld.lastWindowSeason || 0);
    this.teams(C).forEach(t => {
      if (!C.aiWorld.clubs[t.id]) C.aiWorld.clubs[t.id] = {
        funds: Math.round(420000 + t.pw * 19000), fans: Math.round(t.pw * 950), brand: this.profile(t),
        coachLevel: randi(0,3), lastW: t.w || 0, lastL: t.l || 0, transactions: 0, lastMoveTick: -99
      };
      const a = C.aiWorld.clubs[t.id];
      a.funds = Number.isFinite(Number(a.funds)) ? Number(a.funds) : 500000;
      a.fans = Number.isFinite(Number(a.fans)) ? Number(a.fans) : Math.round(t.pw * 900);
      a.brand = BRAND_PROFILES[a.brand] ? a.brand : 'competitive';
      a.transactions = Number(a.transactions || 0); a.coachLevel = clamp(Number(a.coachLevel || 0), 0, 5);
    });
    if (!Array.isArray(C.news)) C.news = [];
    return C.aiWorld;
  },
  info(C, team) { this.ensure(C); return C.aiWorld.clubs[team.id]; },
  push(C, title, detail) { ClubBusinessManager.addNews(C, '轉會市場', title, detail); },
  isTopDivision(C, team) { return !!(C.lg && C.lg.teams && C.lg.teams.some(t => t.id === team.id)) ? C.div === 1 : C.div !== 1; },
  recalc(team) { team.pw = Math.round(avg((team.ps || []).map(p => p.rt)) * 10) / 10; team.base = team.pw; },
  weekly(C) {
    const W = this.ensure(C), teams = this.teams(C);
    teams.forEach(t => {
      const a = W.clubs[t.id], top = this.isTopDivision(C,t);
      const dw = Math.max(0,(t.w||0)-(a.lastW||0)), dl = Math.max(0,(t.l||0)-(a.lastL||0));
      a.lastW=t.w||0; a.lastL=t.l||0;
      a.fans = clamp(a.fans + dw*220 - dl*100 + Math.round((t.pw-60)*2), 1000, 3000000);
      const revenue = (top ? 27000 : 15500) + a.fans*0.025 + (a.brand==='media' ? a.fans*0.009 : a.fans*0.004);
      const payroll = (t.ps||[]).reduce((sum,p)=>sum+(p.rt||t.pw)*58,0) + 3500 + a.coachLevel*900;
      a.funds = clamp(Math.round(a.funds + revenue - payroll), -1200000, 12000000);
    });
    W.offers = W.offers.filter(o => o.expiresTick >= C.tick && C.players.some(p=>p.id===o.playerId));
    const openWindow = C.phase === 'off' && C.offW <= 1 && W.lastWindowSeason !== C.season;
    const midWindow = C.phase === 'reg' && (C.round === 7 || C.round === 8) && C.tick % 2 === 0;
    if (openWindow || midWindow) {
      this.transferWindow(C, teams);
      if (openWindow) W.lastWindowSeason = C.season;
    }
    if (C.tick % 5 === 0) this.generateOffers(C, teams);
  },
  transferWindow(C, teams) {
    teams.forEach(t => {
      const a = this.info(C,t); if (C.tick - a.lastMoveTick < 3 || !t.ps || !t.ps.length || !chance(0.55)) return;
      const weakest = t.ps.reduce((best,p,i,arr)=>p.rt<arr[best].rt?i:best,0), old=t.ps[weakest];
      if (a.funds > 220000 && t.ps.length >= 5) {
        const target = clamp(old.rt + rand(a.funds>900000?2.5:1, a.funds>900000?6:3.5) + (t.pw>78?1:0), 45, 94);
        const fee = Math.round((Math.max(0,target-old.rt)*42000 + target*1500)/1000)*1000;
        if (target > old.rt + 1 && a.funds >= fee) {
          const replacement = { name: pick(NICKS)+randi(1,99), pos: old.pos, rt: target, pool: randi(2,5), age: randi(18,25) };
          t.ps[weakest] = replacement; a.funds -= fee; a.transactions++; a.lastMoveTick=C.tick; this.recalc(t);
          this.push(C, `${t.name} 補強 ${old.pos}`, `${t.name} 以約 ${money(fee)} 的預算簽入新選手 ${replacement.name}，該位置戰力 ${old.rt.toFixed(1)} → ${target.toFixed(1)}。`);
          return;
        }
      }
      if (a.funds < 140000 && chance(0.25)) {
        const strongest=t.ps.reduce((best,p,i,arr)=>p.rt>arr[best].rt?i:best,0), veteran=t.ps[strongest];
        if (veteran.rt>t.pw+2) { a.funds += Math.round(veteran.rt*9000); t.ps[strongest]={...veteran,name:pick(NICKS)+randi(1,99),rt:Math.max(42,veteran.rt-rand(5,9)),age:randi(17,20)}; a.lastMoveTick=C.tick; this.recalc(t); this.push(C,`${t.name} 啟動重建`,`${t.name} 出售高薪核心並改用年輕選手，短期戰力下降，開始重建。`); }
      }
      if (chance(0.07)) { const oldStyle=t.style; t.style=pick(STRK); if(oldStyle!==t.style){a.coachLevel=clamp(a.coachLevel+randi(-1,1),0,5);this.push(C,`${t.name} 更換戰術教練`,`戰隊風格由「${STRAT[oldStyle].n}」調整為「${STRAT[t.style].n}」。`);} }
    });
  },
  generateOffers(C, teams) {
    if (C.aiWorld.offers.length >= 2 || !C.players.length) return;
    const candidates=C.players.filter(p=>Sim.ovr(p)>=65 && !C.aiWorld.offers.some(o=>o.playerId===p.id));
    if (!candidates.length || !chance(0.48)) return;
    const p=pick(candidates), team=wpick(teams,t=>Math.max(1,t.pw-45)); if(!team)return;
    const a=this.info(C,team), price=Math.round(Math.min(Sim.val(p)*1.25, a.funds*0.72)/1000)*1000;
    if(price<Math.max(80000,Sim.val(p)*0.65) || a.funds<price)return;
    C.aiWorld.offers.push({id:uid(),playerId:p.id,teamId:team.id,amount:price,createdTick:C.tick,expiresTick:C.tick+7});
    this.push(C,`${team.name} 對 ${p.name} 提出報價`,`${team.name} 提出 ${money(price)} 的轉會報價，請在期限內決定是否出售。`);
  },
  acceptOffer(id) {
    const C=S.C, offer=C.aiWorld && C.aiWorld.offers.find(o=>o.id===id); if(!offer)return toast('報價已失效','bad');
    const p=C.players.find(x=>x.id===offer.playerId), team=this.teams(C).find(t=>t.id===offer.teamId), a=team&&this.info(C,team);
    if(!p||!team||!a||a.funds<offer.amount)return toast('對方已無法負擔這筆報價','bad');
    const idx=team.ps.findIndex(x=>x.pos===p.pos); if(idx<0)return toast('對方陣容位置不符，無法完成交易','bad');
    const old=team.ps[idx]; team.ps[idx]={name:p.name,pos:p.pos,rt:Sim.ovr(p),pool:p.pool||3,age:p.age};
    a.funds-=offer.amount; a.transactions++; this.recalc(team); C.funds+=offer.amount;
    C.aiWorld.offers=C.aiWorld.offers.filter(o=>o.id!==id); Sim.removeP(C,p.id,`轉會至 ${team.name}`);
    this.push(C,`${p.name} 轉會至 ${team.name}`,`轉會費 ${money(offer.amount)}；${team.name} 以 ${p.name} 取代 ${old.name}。`);
    log(`💸 ${p.name} 接受 ${team.name} 報價，轉會費 ${money(offer.amount)}`,'good'); Store.save(); closeModal(); render(); toast('轉會完成，款項已入帳','good');
  },
  rejectOffer(id) {
    const C=S.C, offer=C.aiWorld && C.aiWorld.offers.find(o=>o.id===id); if(!offer)return;
    const p=C.players.find(x=>x.id===offer.playerId); if(p)Sim.mor(p,2);
    C.aiWorld.offers=C.aiWorld.offers.filter(o=>o.id!==id); if(p)ClubBusinessManager.addNews(C,'轉會市場',`${p.name} 拒絕離隊`,`球員拒絕了外隊報價，決定留在俱樂部。`);
    Store.save(); render(); toast('已拒絕轉會報價');
  },
  table(C) {
    return this.teams(C).map(t=>{const a=this.info(C,t);return {team:t,info:a};}).sort((x,y)=>y.team.pw-x.team.pw);
  }
};


/* ===== phase-7：職涯模式、名人堂、歷史檔案與長期平衡 ===== */
const CareerModeManager = {
  apply(C, key) {
    const mode = CAREER_MODES[key] ? key : 'standard';
    C.careerMode = mode; C.modeGoal = CAREER_MODES[mode].goal;
    const bump = (p, delta) => {
      ATTR.forEach(a => p.attr[a] = clamp(p.attr[a] + delta, 15, 99));
      p.sal = Math.round(salOf(Sim.ovr(p)) / 50) * 50;
    };
    const setDivision = div => {
      C.div = div;
      if (div === 1) {
        C.lg = { teams: [Sim.meTeam(C), ...TEAMS1.slice(0,7).map((n,i)=>Sim.genTeam(n, 70+i*2.2+rand(-1,1)+DIFF[C.diff].ai))], sched: [] };
        C.other = TEAMS2.map((n,i)=>Sim.genTeam(n, 51+i*1.7+rand(-1,1)+DIFF[C.diff].ai));
      } else {
        C.lg = { teams: [Sim.meTeam(C), ...TEAMS2.slice(0,7).map((n,i)=>Sim.genTeam(n, 50+i*1.9+rand(-1,1)+DIFF[C.diff].ai))], sched: [] };
        C.other = TEAMS1.map((n,i)=>Sim.genTeam(n, 70+i*2.4+rand(-1,1)+DIFF[C.diff].ai));
      }
    };
    if (mode === 'dynasty') {
      C.funds += 520000; C.pop = 32; C.fans = 42000; C.brand = 'champion';
      C.players.forEach(p=>bump(p, p.age <= 21 ? 14 : 11));
      setDivision(1); C.modeGoal = '連續兩季打進頂級聯賽前三，至少拿下一座冠軍。';
    } else if (mode === 'academy') {
      C.funds = Math.round(C.funds * 0.82); C.pop = 10; C.fans = 3200; C.brand = 'academy'; C.fac.academy = 3;
      C.players.forEach((p,i)=>{ p.age = i === 5 ? 17 : randi(17,20); p.pot = clamp(Math.max(p.pot, Sim.ovr(p)+randi(16,25)), 55, 97); p.attr = Object.fromEntries(ATTR.map(a=>[a,clamp(p.attr[a]-2,15,99)])); p.sal = Math.max(400,Math.round(salOf(Sim.ovr(p))/50)*50); });
      C.modeGoal = '培養一名 21 歲以下、能力達 85 的自家選手。';
    } else if (mode === 'rebuild') {
      C.funds = 105000; C.pop = 8; C.fans = 2200; C.brand = 'budget';
      C.players.forEach((p,i)=>{ if(i<5)bump(p,-4); });
      const prospect=C.players[C.players.length-1]; if(prospect){ prospect.age=17; prospect.pot=clamp(Math.max(prospect.pot,88),55,97); }
      C.modeGoal = '第一個賽季結束時資金維持正數，且成功打進季後賽或升級。';
    } else if (mode === 'challenge') {
      const variants = [
        {id:'academy_trial', name:'新秀優先', goal:'第一個賽季結束時，至少有兩名 21 歲以下選手能力達 70。', funds:170000, pop:12, fans:4200, brand:'academy', apply:()=>C.players.forEach((p,i)=>{p.age=i<5?randi(17,20):p.age;p.pot=clamp(Math.max(p.pot,78),55,97);})},
        {id:'cashflow_trial', name:'現金流考驗', goal:'第一個賽季結束時資金至少達到 $250,000。', funds:90000, pop:8, fans:2600, brand:'budget', apply:()=>C.players.forEach((p,i)=>{if(i<5)bump(p,-2);})},
        {id:'promotion_trial', name:'升級衝刺', goal:'兩個賽季內升上頂級聯賽。', funds:260000, pop:17, fans:7000, brand:'competitive', apply:()=>C.players.forEach((p,i)=>{if(i<5)bump(p,2);})}
      ];
      const v=pick(variants); C.challenge={id:v.id,name:v.name,goal:v.goal,completed:false,createdSeason:C.season}; C.funds=v.funds; C.pop=v.pop; C.fans=v.fans; C.brand=v.brand; v.apply(); C.modeGoal=v.goal;
    }
    C.records = C.records || {}; C.records.peakFunds = Math.max(Number(C.records.peakFunds||0), C.funds); C.records.peakFans = Math.max(Number(C.records.peakFans||0), C.fans);
    C.sponsor = null; C.aiWorld = {clubs:{},offers:[],lastWindowSeason:0};
    return C;
  },
  evaluate(C, summary) {
    const players=C.players||[];
    if(C.careerMode==='academy') return players.some(p=>p.age<=21&&Sim.ovr(p)>=85);
    if(C.careerMode==='rebuild') return C.funds>0 && (summary.place<=4 || C.promoted);
    if(C.careerMode==='dynasty') return (C.history||[]).filter(h=>h.div===1&&h.place<=3).length>=2 && (C.titles||[]).some(t=>t.includes('頂級'));
    if(C.careerMode==='challenge' && C.challenge){
      if(C.challenge.id==='academy_trial') return players.filter(p=>p.age<=21&&Sim.ovr(p)>=70).length>=2;
      if(C.challenge.id==='cashflow_trial') return C.funds>=250000;
      if(C.challenge.id==='promotion_trial') return C.div===1 || C.promoted;
    }
    return summary.place<=4 || C.promoted;
  }
};

const HallOfFameManager = {
  ensure(C) {
    C.hallOfFame=Array.isArray(C.hallOfFame)?C.hallOfFame:[];
    C.seasonArchive=Array.isArray(C.seasonArchive)?C.seasonArchive:[];
    C.records=Object.assign({peakFans:0,peakFunds:0,bestSeasonWins:0,totalSeasons:0,totalTitles:0,upsetWins:0},C.records||{});
    return C;
  },
  qualifies(p) {
    const c=p.career||{};
    return (c.titles||0)>=2 || (c.mvp||0)>=5 || ((c.bestOvr||Sim.ovr(p))>=88 && (c.seasons||0)>=3);
  },
  induct(C,p,reason='生涯成就') {
    this.ensure(C); if(!p || C.hallOfFame.some(x=>x.id===p.id)) return false;
    if(!this.qualifies(p)) return false;
    C.hallOfFame.unshift({id:p.id,name:p.name,pos:p.pos,age:p.age,reason,ovr:+Sim.ovr(p).toFixed(1),career:JSON.parse(JSON.stringify(p.career||CareerManager.emptyCareer())),season:C.season});
    if(C.hallOfFame.length>100)C.hallOfFame.length=100;
    ClubBusinessManager.addNews(C,'名人堂',`${p.name} 入選俱樂部名人堂`,`憑藉 ${p.career?.titles||0} 座冠軍、${p.career?.mvp||0} 次 MVP 與生涯表現，${p.name} 正式入選名人堂。`);
    return true;
  },
  recordSeason(C,summary) {
    this.ensure(C);
    const players=[...(C.players||[])];
    const mvp=players.slice().sort((a,b)=>(b.mvp||0)-(a.mvp||0)||Sim.ovr(b)-Sim.ovr(a))[0]||null;
    const entry={season:summary.season,div:summary.div,place:summary.place,rank:summary.rank,w:summary.w,l:summary.l,res:summary.res,prize:summary.prize,
      teamPower:+Sim.myPw(C).toFixed(1),fans:C.fans||0,funds:C.funds||0,brand:C.brand,mvp:mvp?{id:mvp.id,name:mvp.name,pos:mvp.pos,count:mvp.mvp||0,ovr:+Sim.ovr(mvp).toFixed(1)}:null,
      champion:/冠軍/.test(summary.res),worldChampion:/世界賽.*冠軍/.test(summary.res),promoted:!!C.promoted,relegated:!!C.relegated};
    C.seasonArchive.unshift(entry); if(C.seasonArchive.length>100)C.seasonArchive.length=100;
    C.records.totalSeasons=(C.records.totalSeasons||0)+1;
    C.records.totalTitles=C.titles.length;
    C.records.peakFans=Math.max(C.records.peakFans||0,C.fans||0);
    C.records.peakFunds=Math.max(C.records.peakFunds||0,C.funds||0);
    C.records.bestSeasonWins=Math.max(C.records.bestSeasonWins||0,summary.w||0);
    players.forEach(p=>this.induct(C,p));
    if(C.challenge&&!C.challenge.completed&&!C.challenge.failed){
      const deadline=C.challenge.id==='promotion_trial' ? C.challenge.createdSeason+1 : C.challenge.createdSeason;
      const done=summary.season<=deadline && CareerModeManager.evaluate(C,summary);
      if(done){C.challenge.completed=true;C.challenge.completedSeason=summary.season;C.funds+=120000;log(`🎯 挑戰完成：${C.challenge.name}，獲得 $120,000 獎勵。`,'gold');ClubBusinessManager.addNews(C,'挑戰','特殊挑戰完成',`${C.challenge.name} 已完成，俱樂部獲得 $120,000 獎勵。`);}
      else if(summary.season>=deadline){C.challenge.failed=true;C.challenge.failedSeason=summary.season;ClubBusinessManager.addNews(C,'挑戰','挑戰期限結束',`${C.challenge.name} 未能在期限內完成。仍可繼續經營，但不會取得挑戰獎勵。`);}
    } else if(['academy','rebuild','dynasty'].includes(C.careerMode) && !C.modeCompleted && CareerModeManager.evaluate(C,summary)){
      C.modeCompleted=true;C.funds+=150000;log(`🏅 職涯模式目標達成：${CAREER_MODES[C.careerMode].n}。`,'gold');
    }
    return entry;
  },
  metrics(C) {
    this.ensure(C); const h=C.seasonArchive, wins=C.stats?.w||0, losses=C.stats?.l||0;
    return {seasons:C.history?.length||0,wins,losses,winRate:wins+losses?Math.round(wins/(wins+losses)*100):0,titles:C.titles?.length||0,
      bestRank:h.length?Math.min(...h.map(x=>x.place||8)):null,bestSeasonWins:C.records.bestSeasonWins||0,peakFans:C.records.peakFans||C.fans||0,peakFunds:C.records.peakFunds||C.funds||0,
      mvpCount:(C.players||[]).reduce((n,p)=>n+(p.career?.mvp||0),0)+(C.careerArchive||[]).reduce((n,p)=>n+(p.career?.mvp||0),0)};
  }
};

const BalanceManager = {
  audit(C, summary) {
    const players=C.players||[], starters=Sim.starters(C).filter(Boolean), payroll=players.reduce((n,p)=>n+(p.sal||0),0), income=Sim.income(C);
    const avgOvr=avg(players.map(p=>Sim.ovr(p))), avgFat=avg(players.map(p=>p.fat||0));
    const notes=[];
    if(income.net < -Math.max(8000,payroll*0.45)) notes.push('每週固定支出偏高，建議調整薪資或設施。');
    if(avgFat>62) notes.push('全隊平均疲勞偏高，應安排恢復週。');
    if(avgOvr>82 && players.length<7) notes.push('核心陣容強度高但替補深度不足，傷病風險較高。');
    if(C.fans<3000 && C.pop<12) notes.push('俱樂部曝光不足，可安排直播或公關活動。');
    const entry={season:summary.season,avgOvr:+avgOvr.toFixed(1),starterOvr:+avg(starters.map(Sim.ovr)).toFixed(1),avgFat:+avgFat.toFixed(1),payroll,weeklyNet:income.net,notes};
    C.balanceAudit.unshift(entry); if(C.balanceAudit.length>20)C.balanceAudit.length=20;
    return entry;
  }
};

function CChallengePreview(){return `<div class="challenge-preview">🎲 隨機挑戰將在成立俱樂部時抽取特殊任務，完成後可獲得額外獎勵。</div>`;}

function crKeep() { const a = $('#inMgr'), b = $('#inName'); if (a) CR.mgr = a.value; if (b) CR.name = b.value; }
function crSet(k, v) { crKeep(); CR[k] = v; render(); }

  const a = Ach.all();
  return `<div class="grid lg:grid-cols-2 gap-3"><div class="card"><div class="card-title">📜 紀錄</div>${logList('max-h-96')}</div>
    <div class="card"><div class="card-title">🏅 成就（${ACH.filter(x => a[x.id]).length}/${ACH.length}）</div><div class="grid grid-cols-2 gap-1.5">${ACH.map(x => `<div class="rounded-xl p-2 border text-xs ${a[x.id] ? 'border-amber-400/50 bg-amber-500/10' : 'border-slate-700 opacity-50'}"><div class="font-bold">${x.e} ${x.n}</div><div class="text-[10px] text-slate-400">${x.d}</div></div>`).join('')}</div>
    <button class="btn btn-ghost w-full mt-4 text-xs" onclick="UI.retire()">🎤 退休並結算生涯</button></div></div>`;
}
function renderOver(el) {
  document.body.classList.remove('is-playing');
  const C = S.C, sc = C.titles.reduce((a, t) => a + (t.includes('世界') ? 500 : t.includes('頂級') ? 200 : 40), 0) + C.history.reduce((a, h) => a + (h.div === 1 ? 20 : 4), 0) + C.stats.w;
  const g = sc >= 900 ? ['S', '傳奇教頭', 'text-amber-300'] : sc >= 450 ? ['A', '冠軍教練', 'text-fuchsia-300'] : sc >= 200 ? ['B', '頂級聯賽名帥', 'text-cyan-300'] : sc >= 80 ? ['C', '稱職的經理', 'text-emerald-300'] : ['D', '曇花一現', 'text-slate-300'];
  el.innerHTML = `<div class="max-w-2xl mx-auto card fade-in text-center"><div class="text-5xl">${S.over.why.includes('破產') ? '💥' : '🎤'}</div><h2 class="text-2xl font-black mt-2">${esc(C.name)}・${esc(C.mgr)} 的生涯</h2><p class="text-sm text-slate-400 mt-1">${S.over.why}</p><p class="text-xs text-cyan-300 mt-2">${CAREER_MODES[C.careerMode]?.n||'經典經理'} · ${esc(C.modeGoal||'')}</p>
    <div class="text-6xl font-black mt-4 ${g[2]} pop-in">${g[0]}</div><div class="font-bold ${g[2]}">${g[1]}</div>
    <div class="grid grid-cols-3 gap-2 mt-4 text-sm"><div class="bg-slate-800/60 rounded-xl p-2"><div class="text-[10px] text-slate-400">執教賽季</div><b>${C.history.length}</b></div><div class="bg-slate-800/60 rounded-xl p-2"><div class="text-[10px] text-slate-400">系列賽戰績</div><b>${C.stats.w}勝${C.stats.l}敗</b></div><div class="bg-slate-800/60 rounded-xl p-2"><div class="text-[10px] text-slate-400">冠軍數</div><b>${C.titles.length}</b></div></div>
    <div class="text-left mt-4">${C.titles.map(t => `<div class="text-sm text-amber-300">🏆 ${t}</div>`).join('')}${C.history.map(h => `<div class="kv"><span class="text-slate-400">S${h.season} ${DIVN[h.div]}</span><span>${h.w}勝${h.l}敗・${h.res}</span></div>`).join('')}</div>
    <button class="btn btn-amber w-full mt-5" onclick="Store.clear();S=null;CR=null;render()">🔁 開始新的生涯</button></div>`;
}

const Menu = {
  save() {
    if (!S) return toast('還沒開始遊戲');
    const slot = i => { const d = Store.slot(i); return `<div class="flex items-center gap-2 bg-slate-800/70 rounded-xl p-2.5"><div class="flex-1 min-w-0"><div class="text-sm font-bold">欄位 ${i}</div><div class="text-[11px] text-slate-400 truncate">${d ? `${esc(d.label)}・${new Date(d.at).toLocaleString('zh-TW')}` : '（空）'}</div></div>
      <button class="btn btn-cyan !py-1 text-xs" onclick="Menu.doSave(${i})">存入</button><button class="btn btn-ghost !py-1 text-xs" ${d ? '' : 'disabled'} onclick="Menu.doLoad(${i})">讀取</button></div>`; };
    openModal(`<div class="card-title text-base">💾 存檔管理</div><p class="text-xs text-slate-400 mb-3">遊戲會自動存檔。手動欄位可以保留特定時間點。</p><div class="space-y-2">${[1, 2, 3].map(slot).join('')}</div>
      <div class="text-xs text-slate-400 mt-4 mb-1">📤 匯出 / 📥 匯入（換裝置或備份用）</div><textarea id="ioBox" class="w-full h-24 text-[10px] font-mono bg-slate-950 border border-slate-700 rounded-xl p-2" placeholder="按「匯出」產生存檔碼，或貼上存檔碼後按「匯入」"></textarea>
      <div class="grid grid-cols-2 gap-2 mt-2"><button class="btn btn-ghost" onclick="Menu.exp()">📤 匯出</button><button class="btn btn-ghost" onclick="Menu.imp()">📥 匯入</button></div><button class="btn btn-ghost w-full mt-3" onclick="closeModal()">關閉</button>`);
  },
  doSave(i) { if (Store.saveSlot(i)) { toast(`已存到欄位 ${i}`, 'good'); Menu.save(); } else toast('存檔失敗', 'bad'); },
  doLoad(i) { const d = Store.slot(i); if (!d || !d.data) return; try { S = migrateSave(d.data); Menu._fix(); closeModal(); Store.save(); render(); toast(`已讀取欄位 ${i}`, 'good'); if (S.queue.length) G.next(); } catch (e) { toast('存檔升級失敗，原存檔未覆蓋', 'bad'); console.error(e); } },
  exp() { const box = $('#ioBox'); box.value = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); box.select(); try { navigator.clipboard.writeText(box.value).then(() => toast('已複製存檔碼', 'good'), () => toast('已產生存檔碼，請手動複製')); } catch (e) { toast('已產生存檔碼，請手動複製'); } },
  imp() { try { const d = JSON.parse(decodeURIComponent(escape(atob($('#ioBox').value.trim())))); if (!d || !d.C || !d.C.lg) throw new Error('存檔格式不完整'); S = migrateSave(d); Menu._fix(); closeModal(); Store.save(); render(); toast('匯入成功（已檢查版本與資料欄位）', 'good'); if (S.queue.length) G.next(); } catch (e) { toast('存檔碼格式錯誤或升級失敗', 'bad'); console.error(e); } },
  _fix() { S = migrateSave(S); S.queue = S.queue || []; if (S.cur) { S.queue.unshift(S.cur); S.cur = null; } },
  help() {
    openModal(`<div class="card-title text-base">❓ 遊戲說明</div><div class="text-sm space-y-3 leading-relaxed">
      <div><b class="text-cyan-300">🎯 目標</b><br>從次級聯賽出發，升上頂級聯賽、拿下聯賽冠軍，最後挑戰世界賽。</div>
      <div><b class="text-cyan-300">📅 每週流程</b><br>設定訓練課表 → 用 2 次行動（研究對手、團建、商業活動、球探、談話、特訓）→ 進入比賽日。每週結算收支、成長、疲勞與傷病。</div>
      <div><b class="text-cyan-300">🧠 BP 室</b><br>每一局開打前選戰術、己方英雄與 Ban 對手英雄／選手。英雄熟練度、版本相性及陣容組合會影響比賽戰力。</div>
      <div><b class="text-cyan-300">🤝 隊內關係與職涯</b><br>在選手資料中查看隊友關係、安排雙人訓練或經理調解，也能查看系列賽、MVP、冠軍與近期職涯事件。離隊選手會保留履歷。</div>
      <div><b class="text-cyan-300">👥 選手</b><br>五項能力、潛力、狀態、疲勞、士氣、合約。可在選手詳細資料設定操作型、團隊型、指揮型或全能型發展路線，以及個人每週專項。疲勞過高會降低訓練成長並增加傷病風險。未考察的市場選手只看得到模糊戰力。</div>
      <div><b class="text-cyan-300">💰 財務與商業</b><br>薪資隨能力指數成長，明星很貴。粉絲會影響周邊與部分贊助收入；可在俱樂部頁舉辦直播、見面會、周邊販售與公關活動，並查看八週財務預測。品牌定位只能在休賽季調整。</div>
      <div><b class="text-cyan-300">🌐 AI 動態世界</b><br>AI 戰隊會計算自己的資金、粉絲與薪資，並在轉會窗補強、重建或更換教練。強勢選手可能收到 AI 戰隊報價，可在轉會頁接受或拒絕。</div>
      <div><b class="text-cyan-300">🏁 賽季與名人堂</b><br>14 輪例行賽（BO3）→ 前四季後賽（BO5）→ 升降賽或世界賽 → 4 週休賽季。每季結算會留下歷史檔案，達成指定生涯成就的選手可入選名人堂。</div></div>
      <button class="btn btn-cyan w-full mt-4" onclick="closeModal()">了解</button>`);
  },
  restart() { openModal(`<div class="text-center"><h3 class="text-lg font-bold">確定要重新開始嗎？</h3><p class="text-sm text-slate-400 mt-2">自動存檔會被清除（手動存檔欄位與成就會保留）。</p><div class="grid grid-cols-2 gap-2 mt-4"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-rose" onclick="closeModal();Store.clear();S=null;CR=null;render()">重新開始</button></div></div>`); },
};

S = Store.load();
if (S && (!S.C || !S.C.lg || !S.queue)) S = null;
if (S) { ClubBusinessManager.ensure(S.C); AIWorldManager.ensure(S.C); HallOfFameManager.ensure(S.C); Menu._fix(); Store.save(); }
render();
if (S && S.queue.length) G.next();

</script>
</body>
</html>
