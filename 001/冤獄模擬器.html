<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>冤獄模擬器｜被遺忘的那一夜</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0d0e12;color:#eee;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.hud{position:fixed;pointer-events:none;font-size:13px;text-shadow:0 1px 2px #000}
#hudL{left:10px;top:10px;background:rgba(14,16,22,.82);border:1px solid #2e3240;border-radius:10px;padding:8px 10px;min-width:190px}
#hudR{right:10px;top:10px;background:rgba(14,16,22,.82);border:1px solid #2e3240;border-radius:10px;padding:8px 10px;max-width:270px;text-align:right}
.clock{font-size:18px;font-weight:700;letter-spacing:1px}
.act{color:#ffcf6b;font-weight:700}
.bar{display:flex;align-items:center;gap:6px;margin-top:4px}
.bar span{width:30px;color:#aab}
.bar i{flex:1;height:7px;background:#222631;border-radius:4px;overflow:hidden;display:block}
.bar b{display:block;height:100%;border-radius:4px}
.money{margin-top:5px;color:#ffd86b}
#obj{margin-top:4px;color:#cfd6e6;font-size:12px;line-height:1.45}
#area{color:#8fb4ff;font-weight:700}
#alertLv{font-size:12px}
#bottom{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
.btn{background:rgba(20,22,30,.9);border:1px solid #3a3f52;color:#eee;border-radius:10px;padding:8px 11px;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{background:#2a2f40}.btn:active{transform:scale(.96)}
.btn.on{border-color:#ffcf6b;color:#ffcf6b}
.btn.lock{opacity:.4}
#prompt{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);display:none;pointer-events:auto}
#prompt .btn{background:#ffcf6b;color:#1a1408;font-weight:700;border-color:#ffcf6b;font-size:15px;padding:10px 16px}
#dialog{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(600px,78vw);background:rgba(12,13,18,.96);border:1px solid #4a4f63;border-radius:12px;padding:14px 16px 12px;display:none;z-index:20;pointer-events:auto;cursor:pointer}
#dlgWho{color:#ffcf6b;font-weight:700;margin-bottom:6px;font-size:15px}
#dlgText{font-size:16px;line-height:1.7;min-height:44px;white-space:pre-wrap}
#dlgChoices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#dlgChoices .btn{text-align:left;font-size:15px}
#dlgNext{position:absolute;right:14px;bottom:8px;color:#777;font-size:12px}
#toasts{position:fixed;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:15;pointer-events:none;max-width:min(467px,50vw)}
.toast{background:rgba(14,16,22,.94);border:1px solid #4a4f63;border-radius:9px;padding:7px 13px;font-size:14px;animation:tin .25s ease-out;text-align:center}
.toast.warn{border-color:#e05555;color:#ffb3b3}.toast.good{border-color:#5fbf7a;color:#b9f3c9}.toast.info{border-color:#ffcf6b;color:#ffe3a3}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60;pointer-events:auto}
.panel .box{background:#14161d;border:1px solid #3a3f52;border-radius:14px;width:min(633px,79vw);max-height:73vh;overflow:auto;padding:16px 18px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.panel h2{margin:0 0 10px;font-size:19px;color:#ffcf6b}
.panel h3{margin:14px 0 6px;font-size:15px;color:#8fb4ff}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.card{background:#1c1f28;border:1px solid #2e3240;border-radius:10px;padding:9px 11px;margin-bottom:7px;font-size:14px;line-height:1.6;cursor:pointer}
.card.sel{border-color:#ffcf6b;box-shadow:0 0 0 1px #ffcf6b inset}
.card .t{font-weight:700}.card .m{color:#99a;font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;margin-left:6px;vertical-align:1px}
.tag.hi{background:#1f4a2c;color:#9fe6b4}.tag.mid{background:#4a421f;color:#f3e19f}.tag.lo{background:#4a1f1f;color:#f3a9a9}.tag.con{background:#3a2550;color:#d9b8ff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chk{font-size:14px;line-height:1.9}
#overlay{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:40;opacity:0;pointer-events:none;transition:opacity .6s}
#overlay.show{opacity:1;pointer-events:auto}
#overlay .in{transition:opacity .4s;max-width:640px;padding:24px;text-align:center;font-size:18px;line-height:1.9;white-space:pre-wrap}
#title{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#06070a;text-align:center;padding:20px;overflow:hidden}
#title .tbg{position:absolute;inset:0;pointer-events:none}
#title .tbg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 28%,#2b3350 0,#12151f 42%,#05060a 78%)}
#title .beam{position:absolute;top:-12%;left:50%;width:70vmax;height:150%;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,232,160,.32),rgba(255,232,160,0) 78%);clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);animation:sweep 12s ease-in-out infinite alternate;mix-blend-mode:screen}
#title .beam.b2{animation-duration:17s;animation-delay:-6s;opacity:.55}
@keyframes sweep{from{transform:translateX(-50%) rotate(-26deg)}to{transform:translateX(-50%) rotate(26deg)}}
#title .bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(4,5,8,.0) 0 46px,rgba(4,5,8,.92) 46px 54px);-webkit-mask-image:linear-gradient(90deg,#000 0,transparent 24%,transparent 76%,#000 100%);mask-image:linear-gradient(90deg,#000 0,transparent 24%,transparent 76%,#000 100%)}
#title .vig{position:absolute;inset:0;box-shadow:inset 0 0 200px 40px #000}
#title .tmain{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:min(400px,92vw)}
#title .kick{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.42em;color:#c9a24a;opacity:.9;margin-bottom:14px;text-indent:.42em}
#title h1{white-space:nowrap;font-size:clamp(30px,8vw,56px);margin:0;letter-spacing:6px;text-indent:6px;color:#f2f2f2;text-shadow:0 3px 0 #000,0 0 36px rgba(255,207,107,.28);font-weight:800}
#title .sub{color:#ffcf6b;letter-spacing:5px;text-indent:5px;margin:10px 0 4px;font-size:clamp(13px,2.6vw,17px)}
#tLine{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:68px;margin:10px 0 18px}
#tLine img{height:54px;width:auto;image-rendering:pixelated;filter:brightness(.5) saturate(.7);animation:bob 3.4s ease-in-out infinite}
#tLine img:nth-child(even){animation-delay:-1.6s}
#tLine img.me{height:64px;filter:drop-shadow(0 0 8px rgba(255,207,107,.35))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.tbtn{display:flex;flex-direction:column;align-items:flex-start;width:100%;margin:5px 0;padding:11px 18px;background:rgba(16,18,26,.8);border:1px solid #333849;border-left:3px solid #333849;color:#eee;border-radius:8px;cursor:pointer;font:inherit;text-align:left;transition:transform .15s,background .15s,border-color .15s}
.tbtn b{font-size:17px;letter-spacing:3px;font-weight:600}
.tbtn small{color:#8a90a6;font-size:12px;margin-top:2px;letter-spacing:.5px}
.tbtn:hover{border-left-color:#ffcf6b;background:rgba(36,40,58,.92);transform:translateX(3px)}
.tbtn:active{transform:scale(.98)}
.tbtn.main{border-color:rgba(255,207,107,.35);border-left-color:#ffcf6b;background:rgba(52,42,16,.6)}
.tbtn.main b{color:#ffcf6b}
.trow{display:flex;gap:8px;width:100%}.trow .tbtn{flex:1;min-width:0}
#title .ver{position:absolute;right:14px;top:12px;font:11px ui-monospace,monospace;color:#5b6176;z-index:2;letter-spacing:1px}
#title .cr{position:absolute;bottom:10px;left:0;right:0;font-size:11px;color:#667;z-index:2;padding:0 14px}
@media (max-height:600px){#tLine{display:none}#title .sub{margin-bottom:12px}.tbtn{padding:8px 16px}}
#mini{position:fixed;right:10px;bottom:10px;width:194px;height:166px;border:1px solid #3a3f52;border-radius:8px;background:rgba(10,11,16,.8);image-rendering:pixelated;cursor:pointer;z-index:5}
#prog{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);display:none;background:rgba(10,10,14,.9);border:1px solid #4a4f63;border-radius:10px;padding:8px 14px;z-index:12;text-align:center;font-size:14px;pointer-events:none}
#prog i{display:block;width:180px;height:8px;background:#2a2d38;border-radius:4px;margin-top:6px;overflow:hidden}
#prog b{display:block;height:100%;background:#ffcf6b;width:0}
/* UI 整體放大 1.2 倍（遊戲畫面與小地圖除外） */
#hudL,#hudR,#bottom,#prompt,#dialog,#toasts,#prog,.panel .box,#overlay .in,#title .tmain{zoom:1.2}
@media (max-width:640px),(max-height:480px){
 .hud{font-size:11px}#hudL{min-width:150px;padding:6px 8px}#hudR{max-width:38vw;padding:6px 8px}
 #mini{width:130px;height:110px;bottom:66px}.clock{font-size:15px}.btn{padding:7px 9px;font-size:13px}#dlgText{font-size:15px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hudL" class="hud">
 <div class="clock" id="clock">第1天 06:00</div>
 <div class="act" id="act">起床</div>
 <div class="bar"><span>飢餓</span><i><b id="bHunger" style="background:#e3a04a"></b></i></div>
 <div class="bar"><span>體力</span><i><b id="bStam" style="background:#5fbf7a"></b></i></div>
 <div class="bar"><span>警戒</span><i><b id="bAlert" style="background:#e05555"></b></i></div>
 <div class="money" id="money">💰 10 元</div>
</div>
<div id="hudR" class="hud">
 <div id="area">牢房</div>
 <div id="alertLv"></div>
 <div id="evt" style="color:#ffcf6b;font-size:12px"></div>
 <div id="obj"></div>
</div>
<div id="toasts"></div>
<canvas id="mini" width="162" height="138"></canvas>
<div id="prompt"><button class="btn" id="promptBtn">E：互動</button></div>
<div id="prog"><span id="progT">進行中…</span><i><b id="progB"></b></i></div>
<div id="bottom">
 <button class="btn" id="bInv">🎒 背包</button>
 <button class="btn" id="bNotes">📒 筆記</button>
 <button class="btn" id="bMap">🗺️</button>
 <button class="btn" id="bFast">⏩</button>
 <button class="btn" id="bMenu">⚙️</button>
</div>
<div id="dialog"><div id="dlgWho"></div><div id="dlgText"></div><div id="dlgChoices"></div><div id="dlgNext">▼ 點擊繼續</div></div>
<div class="panel" id="panel"><div class="box" id="panelBox"></div></div>
<div id="overlay"><div class="in" id="overlayText"></div></div>
<div id="title">
 <div class="tbg"><div class="beam"></div><div class="beam b2"></div><div class="bars"></div><div class="vig"></div></div>
 <div class="ver">v3.0 ・ DEMO</div>
 <div class="tmain">
  <div class="kick">WRONGFULLY CONVICTED</div>
  <h1>冤獄模擬器</h1>
  <div class="sub">被遺忘的那一夜</div>
  <div id="tLine"></div>
  <button class="tbtn main" id="tCont"><b>繼續遊戲</b><small id="tContSub"></small></button>
  <button class="tbtn" id="tNew"><b>新的開始</b><small>醒來時，你不記得自己是誰</small></button>
  <div class="trow">
   <button class="tbtn" id="tLoad"><b>讀取存檔</b><small>3 個手動欄位・匯入匯出</small></button>
   <button class="tbtn" id="tEnd"><b>結局圖鑑</b><small id="tEndSub"></small></button>
  </div>
  <button class="tbtn" id="tSet"><b>設定與說明</b><small>音效・新手提示・操作方式</small></button>
 </div>
 <div class="cr">美術素材：Free 2D Prison Game Assets by Adarsh S（adarshs.itch.io）｜本作人物、案件皆為虛構</div>
</div>

  if (pZone() !== 'vent') DOORLBL.forEach(([dx, dy, t]) => { const X = sx(tc(dx)), Y = sy(dy * T - 12); if (X < -40 || Y < -20 || X > cv.width + 40 || Y > cv.height + 20) return; const tw = ctx.measureText(t).width + 6 * DPR; ctx.fillStyle = 'rgba(10,12,18,.6)'; ctx.fillRect(X - tw / 2, Y - 9 * DPR, tw, 12 * DPR); ctx.fillStyle = '#e9d9a6'; ctx.fillText(t, X, Y); });
  if (sleeping) { ctx.fillStyle = '#cfe0ff'; ctx.font = `bold ${Math.round(14 * DPR)}px sans-serif`; ctx.fillText('Z z z', sx(S.x + 6), sy(S.y - 30 - Math.sin(now * 2) * 2)); }
  if (ppath && ppath.length) { const [gx, gy] = ppath[ppath.length - 1]; ctx.strokeStyle = 'rgba(255,207,107,.8)'; ctx.lineWidth = 2 * DPR; ctx.beginPath(); ctx.arc(sx(tc(gx)), sy(tf(gy) - 2), 5 * z / 3, 0, 7); ctx.stroke(); }
}

// ================= 小地圖 =================
let miniCv = null;
const MCOL = { '#': '#33363f', ',': '#8a7a66', '.': '#9da3b0', r: '#b9a24a', c: '#b3a07a', o: '#8a5a38', p: '#c9a36a', g: '#6e7d6c', N: '#d8b13a', l: '#6f93a6', m: '#7d5f78', y: '#5b6165', i: '#d3e2e8', b: '#a0744a', w: '#8a8068', s: '#24262c', F: '#3f7a5c', W: '#3f7a5c' };
function buildMini() {
  miniCv = document.createElement('canvas'); miniCv.width = MW; miniCv.height = VIEW_H; const c = miniCv.getContext('2d');
  for (let y = 0; y < VIEW_H; y++) for (let x = 0; x < MW; x++) { const t = G[y][x]; if (t === ' ') continue; c.fillStyle = DOORS.includes(t) ? '#e8c860' : (MCOL[t] || '#000'); c.fillRect(x, y, 1, 1); }
}
function drawMini(cvs, big) {
  const c = cvs.getContext('2d'), s = cvs.width / MW; c.imageSmoothingEnabled = false; c.clearRect(0, 0, cvs.width, cvs.height);
  c.globalAlpha = big ? 1 : .88; c.drawImage(miniCv, 0, 0, cvs.width, VIEW_H * s); c.globalAlpha = 1;
  const inVent = pZone() === 'vent';
  if (big) {
    c.textAlign = 'center'; c.font = `bold ${Math.round(s * 1.25)}px sans-serif`;
    Object.keys(ZONES).forEach(k => { if (['rollcall', 'vent', 'cell2', 'cell3', 'cell4', 'cell5', 'cell6'].includes(k)) return; const z = ZONES[k]; const X = (z[0] + z[2] + 1) / 2 * s, Y = (z[1] + z[3] + 1) / 2 * s; c.fillStyle = 'rgba(0,0,0,.55)'; const tw = c.measureText(z[4]).width + 6; if (k === 'corrW' || k === 'corrE') return; c.fillRect(X - tw / 2, Y - s * .9, tw, s * 1.7); c.fillStyle = '#fff'; c.fillText(z[4], X, Y + s * .4); });
  }
  NPCS.forEach(n => { if (!n.vis || n.kind === 'guard' || n.kind === 'watcher') return; if (!big && !(S.flags['met_' + n.id] || n.id === 'ahao')) return; c.fillStyle = n.id === 'oldk' && S.flags.caseUnlocked ? '#ff7070' : n.id === 'lawyer' ? '#7fd0ff' : '#fff'; const X = n.x / T * s, Y = (n.y - 4) / T * s; c.fillRect(X - s * .45, Y - s * .45, s * .9, s * .9); if (big && (S.flags['met_' + n.id] || n.id === 'ahao' || n.id === 'lawyer')) { c.font = `${Math.round(s * 1.05)}px sans-serif`; c.fillStyle = '#ffe9a0'; c.fillText(n.name, X, Y - s * .7); } });
  if (!inVent) { const X = S.x / T * s, Y = (S.y - 4) / T * s, r = big ? s * .8 : s * .9; c.fillStyle = '#ffcf40'; c.beginPath(); c.arc(X, Y, r * (1 + .25 * Math.sin(performance.now() / 200)), 0, 7); c.fill(); c.strokeStyle = '#000'; c.lineWidth = 1; c.stroke(); }
}
function openMap() {
  openPanel(`<h2>🗺️ 黑鴉監獄</h2><canvas id="bigmap" width="${MW * 12}" height="${VIEW_H * 12}" style="width:100%;max-height:50vh;object-fit:contain;border-radius:8px;background:#0b0b10"></canvas><div class="m" style="color:#99a;font-size:12px;margin-top:6px">🟡 你　⬜ 囚犯（認識的人會顯示名字）　🟨 門　｜獄警的位置不會顯示，要靠你自己觀察。</div><div class="row"><button class="btn" onclick="closePanel()">關閉</button></div>`);
  drawMini($('bigmap'), true);
}

// ================= HUD =================
let hudT = 0;
function nearestUse() {
  if (sleeping || action) return null;
  let best = null, bd = 1e9;
  NPCS.forEach(n => { if (!n.vis) return; const d = Math.hypot(n.x - S.x, n.y - S.y); if (d < T * 1.6 && d < bd) { bd = d; best = { npc: n, label: '與' + n.name + '交談' }; } });
  if (best) return best;
  OBJ.forEach(o => { if (!o.id || !o.name) return; const d = objDist(o); if (d < 0.9 && d < bd) { const A = actionsFor(o); if (A.length) { bd = d; best = { obj: o, label: A.length === 1 ? A[0].t : o.name } } } });
  return best;
}
let curUse = null;
function hud() {
  const c = S.clock;
  $('clock').textContent = `第${S.day}天 ${fmt(c)}`;
  $('act').textContent = activity(c);
  $('bHunger').style.width = S.hunger + '%'; $('bStam').style.width = S.stamina + '%'; $('bAlert').style.width = S.alert + '%';
  $('money').textContent = `💰 ${S.money} 元`;
  const z = pZone(); $('area').textContent = '📍 ' + (ZONES[z] ? ZONES[z][4] : '走廊');
  $('alertLv').innerHTML = '監獄警戒：' + (S.alert >= 50 ? '<b style="color:#ff6b6b">高</b>' : S.alert >= 25 ? '<b style="color:#ffcf6b">中</b>' : '<b style="color:#7fd99a">低</b>') + (isIllegal() && !thieving ? ' ・<b style="color:#ff6b6b">你在違規區域</b>' : '');
  $('obj').innerHTML = objective(); tutorial();
  $('evt').textContent = S.evt && S.day >= 2 ? '📅 ' + EVTS[S.evt].n + (blackout() ? '（停電中）' : '') : '';
  if (pZone() !== 'vent') { $('mini').style.visibility = 'visible'; drawMini($('mini'), false); } else $('mini').style.visibility = 'hidden';
  curUse = nearestUse();
  if (curUse && !paused()) { $('prompt').style.display = 'block'; $('promptBtn').textContent = (matchMedia('(pointer:fine)').matches ? 'E：' : '👆 ') + curUse.label; } else $('prompt').style.display = 'none';
  $('bFast').classList.toggle('on', !!S.fast);
  $('bNotes').classList.toggle('lock', !S.flags.caseUnlocked);
}
function objective() {
  const c = S.clock, f = S.flags;
  if (!f.readVerdict) return '到你的床上讀判決書';
  if ((inR(c, 385, 420) || inR(c, 1195, 1230)) && S.rc !== rcKey(c < 720 ? 400 : 1210)) return '點名中：到走廊<b>黃線區</b>報到（' + (c < 720 ? '07:00' : '20:30') + ' 前）';
  if (isMeal(c) && !S.ate[S.day + '-' + (c < 600 ? 'b' : c < 900 ? 'l' : 'd')]) return '到餐廳<b>櫃台</b>打飯';
  if (S.lawyerDay === S.day && inR(c, 590, 660)) return '前往<b>會客室</b>見許律師';
  if (has('letter') || has('eletter')) return '到走廊<b>信箱</b>寄信';
  if (S.searchDay === S.day && f.warned && c < 780) return '<b style="color:#ff8080">突擊搜房前，檢查床墊夾層！</b>';
  if (inR(c, 1250, 1320)) return '熄燈前回到<b>你的牢房</b>';
  if (isNight(c)) return S.ventOpen || has('screwdriver') ? '睡覺，或……趁查房空檔行動' : '在床上睡覺';
  const qh = questHint(); if (qh) return '🎯 ' + qh;
  if (isWork(c)) return '可以去洗衣房工作賺錢';
  return '自由行動';
}

// ================= 輸入 =================
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if ($('title').style.display !== 'none') return;
  if (k === ' ' || k === 'enter') { if (dlgQ) { advance(); e.preventDefault(); } }
  if (k === 'escape') { if (panelOpen()) closePanel(); }
  if (paused()) { if (k === 'e' && dlgQ) advance(); return; }
  if (sleeping && k !== 'tab') { sleeping = null; toast('你醒了。'); }
  if (k === 'e') { curUse = nearestUse(); if (curUse) doUse(curUse); }
  if (k === 'i') openInv();
  if (k === 'j' || k === 'n') openNotes();
  if (k === 'c') { notesTab = 'people'; openNotes(); }
  if (k === 'm') openMap();
  if (k === 'f') toggleFast();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => keys = {});
function doUse(u) { if (u.npc) talk(u.npc); else useObj(u.obj); }
$('promptBtn').onclick = e => { e.stopPropagation(); if (curUse && !paused()) doUse(curUse); };
cv.addEventListener('pointerdown', e => {
  if (dlgQ) { advance(); return; }
  if (paused() || !S) return;
  if (sleeping) { sleeping = null; toast('你醒了。'); return; }
  if (action) return;
  const z = Z * DPR, r = cv.getBoundingClientRect();
  const wx = (e.clientX - r.left) * DPR / z + camX, wy = (e.clientY - r.top) * DPR / z + camY;
  const [ptx, pty] = playerTile();
  // NPC
  for (const n of NPCS) { if (n.vis && Math.abs(wx - n.x) < 9 && wy < n.y + 3 && wy > n.y - 28) { const tx = Math.floor(n.x / T), ty = Math.floor((n.y - 4) / T); ppath = pathNear(ptx, pty, tx, ty, 0); pendingUse = { npc: n }; if (!ppath) ppath = []; return; } }
  const tx = Math.floor(wx / T), ty = Math.floor(wy / T);
  const o = OBJMAP[tx + ',' + ty] || OBJMAP[tx + ',' + (ty + 1)];
  if (o && o.name && actionsFor(o).length) {
    if (objDist(o) < 0.9) { useObj(o); return; }
    const c = [];
    for (let y = o.y - 1; y <= o.y + o.h; y++) for (let x = o.x - 1; x <= o.x + o.w; x++) if (walkable(x, y, 0)) c.push([x, y, Math.hypot(x - ptx, y - pty)]);
    c.sort((a, b) => a[2] - b[2]);
    for (const [x, y] of c) { const p = astar(ptx, pty, x, y, 0); if (p) { ppath = p; pendingUse = { obj: o }; return; } }
    toast('過不去。'); return;
  }
  const p = pathNear(ptx, pty, tx, ty, 0);
  if (p) { ppath = p; pendingUse = null; } else toast('過不去。');
});
function toggleFast() { S.fast = !S.fast; toast(S.fast ? '⏩ 兩倍速（時間與移動，夜晚不會加速）' : '▶ 正常速度'); }
$('bInv').onclick = () => !paused() && openInv();
$('bNotes').onclick = () => !paused() && openNotes();
$('bFast').onclick = () => toggleFast();
$('bMap').onclick = () => !paused() && openMap();
$('mini').onclick = () => !paused() && openMap();
$('bMenu').onclick = () => { if (paused()) return; openMenu(); };

// ================= 流程 =================
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); VW = innerWidth; VH = innerHeight;
  cv.width = VW * DPR; cv.height = VH * DPR;
  Z = clamp(Math.min(VW / (22 * T), VH / (13 * T)), 1.7, 4);
}
addEventListener('resize', resize);
function toTitle() { $('title').style.display = 'flex'; S = null; refreshTitle(); }
function refreshTitle() {
  const b = latestSlot(), c = $('tCont');
  c.style.display = b ? '' : 'none';
  if (b) $('tContSub').textContent = `${b.s.name}・第 ${b.d.meta.day} 天 ${fmt(b.d.meta.clock)}・主線 ${b.d.meta.prog == null ? '—' : b.d.meta.prog + '%'}`;
  $('tLoad').style.display = b ? '' : 'none';
  const g = getEnds(), n = Object.keys(END_META).filter(k => g[k]).length;
  $('tEndSub').textContent = `已達成 ${n}/${Object.keys(END_META).length}`;
  const L = $('tLine');
  if (!L.childElementCount && IMG.player_idle) { ['ahao', 'rat', 'player', 'oldk', 'marcus'].forEach(k => { const im = document.createElement('img'); im.src = IMG[k + '_idle'].src; im.draggable = false; if (k === 'player') im.className = 'me'; L.appendChild(im); }); }
}
function startPlay() {
  $('title').style.display = 'none'; sleeping = null; action = null; thieving = false; ppath = null; dlgQ = null; closeDlg();
  lastAbs = S.t; memQ = []; tipLast = performance.now(); placeNPCs(); camX = S.x - 200; camY = S.y - 120;
}
function newGame() {
  S = newState(); S.ended = 'intro'; setTimeout(startPlay, 0); lastSaveT = S.t;
  storySeq(['三天前。黑鴉監獄的放風場上，爆發了一場鬥毆。', '有人從背後推了你一把。\n後腦勺撞上水泥牆的那一刻——什麼都沒有了。', '——「哐！」\n鐵門撞擊的聲音，把你吵醒。'], () => {
    S.ended = null; placeNPCs();
    say([
      { who: '阿豪', t: '林正恩！你終於醒啦。你在醫務室躺了兩天，艾琳說你撞得不輕。' },
      { who: '你', t: '……林正恩？是在叫我嗎？\n（灰色的水泥牆、鐵欄杆、身上的橘色囚服。我想不起來這是哪裡。）' },
      { who: '阿豪', t: '完蛋，真的撞壞了。我是阿豪，你的室友。你……連自己的案子都不記得了？' },
      { who: '阿豪', t: '醫生說可能只是暫時的，慢慢想就會回來。對了，你出事之前一直盯著那個通風口看。別想了，螺絲都鏽死了，沒螺絲起子根本打不開。' },
      { who: '你', t: '（先搞清楚狀況。床上好像有一份文件……）' },
    ], () => { S.flags.ventHint = 1; toast('點擊地面移動，點擊物件或人物互動（鍵盤：WASD + E）', 'info'); save(); });
  });
}
$('tNew').onclick = () => { audioInit(); if (!hasSave()) { closePanel(); return newGame(); } confirmPanel('開始新遊戲？<div class="m">新的進度會取代「自動存檔」；手動存檔 1–3 不受影響。</div>', '開始', () => { closePanel(); newGame(); }); };
$('tCont').onclick = () => { audioInit(); if (!load()) newGame(); };
$('tLoad').onclick = () => { audioInit(); slotPanel('load'); };
$('tEnd').onclick = () => { audioInit(); endingsPanel(); };
$('tSet').onclick = () => { audioInit(); settingsPanel(); };
addEventListener('pointerdown', audioInit, { once: true });
let loopErr = 0;
function loop(ts) {
  requestAnimationFrame(loop);   // 先排下一幀：就算這一幀出錯，遊戲也不會整個停住
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  try {
    if (S) { step(dt); if (memQ.length && !paused() && !action && !sleeping) memShow(memQ.shift()); hudT += dt; if (hudT > 0.1) { hudT = 0; hud(); } }
  } catch (e) {
    console.error(e); pendingUse = null; ppath = null;
    if (++loopErr <= 3) toast('⚠️ 發生了小錯誤，已自動恢復。', 'warn');
  }
  try { render(); } catch (e) { console.error(e); }
}
function boot() {
  resize();
  const ks = Object.keys(ASSETS); let n = 0;
  const blank = document.createElement('canvas'); blank.width = blank.height = 16;
  const fin = () => { if (++n === ks.length) { buildMap(); buildMini(); toTitle(); requestAnimationFrame(loop); } };
  ks.forEach(k => { const im = new Image(); im.onload = fin; im.onerror = () => { console.error('image failed', k); IMG[k] = blank; fin(); }; im.src = ASSETS[k]; IMG[k] = im; });
}
window.__dbg = { get S() { return S; }, path: (a, b, c, d) => { const r = astar(a, b, c, d, 1); return r ? r.length : -1; }, map: openMap, craft: craftPanel, learn, OBJ, use: id => useObj(OBJ.find(o => o.id === id)), talk: id => talk(N(id)), notes: openNotes, choose: t => { const b = [...document.querySelectorAll('#dlgChoices .btn')].find(b => b.textContent.includes(t)); b && b.click(); return !!b; }, NPCS, teleport, caught, ending, unlockCase, give, step: s => step(s), setTime: m => { S.t = Math.floor(S.t / 1440) * 1440 + m; S.clock = m; placeNPCs(); } };
boot();

</script>
